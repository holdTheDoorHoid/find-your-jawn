name: Remove my details
description: Ask us to remove your name, phone number, email, or a whole listing.
title: "Removal: "
labels: [removal]
body:
  - type: markdown
    attributes:
      value: |
        We copy contact details that groups or public sources have published. If any of them are yours and you want them gone, tell us here and we will remove them promptly and keep them from coming back. Please do not post the private details again in this form; just tell us which ones.
  - type: input
    id: group
    attributes:
      label: Group name or link to its page on Find Your Jawn
    validations:
      required: true
  - type: checkboxes
    id: what
    attributes:
      label: What should we remove?
      options:
        - label: My name
        - label: My phone number
        - label: My email address
        - label: The whole listing
  - type: textarea
    id: notes
    attributes:
      label: Anything else we should know? (optional)
