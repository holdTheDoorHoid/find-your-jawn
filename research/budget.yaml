# How much of the weekly usage allowance Find Your Jawn may use (owner decisions 2026-10-08).
# Read by the orchestrator before every wave, from the app's usage meter (percent of the weekly
# "all models" limit). The weekly window resets Thursdays at 09:00 UTC.
launch_week:
  starts: 2026-10-08
  ends: 2026-10-15
  cap_percent: 20            # site build plus research together
weekly_cap_percent: 20       # later weeks: all nightly runs combined
per_run_cap_percent: 3       # a nightly run stops starting new agents after spending this much
skip_if_account_weekly_above: 60   # leave room for the owner's other projects
skip_if_five_hour_above: 50
log: research/waves/usage.jsonl    # one line per wave: wave, time, percent before, percent after
