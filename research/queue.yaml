    max_agents_per_run: 9
    status: done
    progress: "Done 2026-10-08. Third pass (nightly run, four agents at a time, batches of 12): 94 groups tried, 83 merged and 11 held because their sites gave too little to write a record (research/held/w4-tier1-cultural-fund/). Those 11 stay at tier 0 and can be picked up by w19 or a later retry with --exclude-done. Earlier passes: 162 groups in the launch session, 72 in the first nightly pass."

  - id: w6-tier2-deep-a
    lane: tier2
