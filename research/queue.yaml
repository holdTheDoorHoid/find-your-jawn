    - agent: g-emergency-disaster
      text: 'Family `emergency-disaster` (Emergency and disaster help). Tags: emergency_response_teams, disaster_relief,
        first_aid_cpr, volunteer_fire_ems, preparedness_planning, weather_checks, search_rescue.'
    - agent: g-philly-traditions
      text: 'Family `philly-traditions` (Philly traditions). Tags: mummers_string_band, mummers_fancy_brigade,
        mummers_comic_club, mummers_clubhouse, parade_units, street_festivals. Mummers clubs are covered by
        another wave; focus on parade units, block parties traditions, neighborhood festivals with volunteer
