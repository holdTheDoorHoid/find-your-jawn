    - agent: u-recovery
      text: 'Recovery support in Philadelphia: the Southeastern Pennsylvania Intergroup of Alcoholics Anonymous (one record linking its meeting finder), Narcotics Anonymous Philadelphia area service, Al-Anon and Alateen in Philadelphia, SMART Recovery meetings in the city, recovery community organizations (PRO-ACT and others) with peer groups and drop in centers, and sober social groups. One record per organization; never copy meeting lists.'
    - agent: u-mental-health-grief-caregiver
      text: 'Mental health, grief and caregiver support groups in Philadelphia: NAMI Philadelphia (https://namiphilly.org/) support groups, Mental Health Partnerships, grief support centers (for example Uplift Center for Grieving Children, hospice bereavement groups open to the public), caregiver support groups (Alzheimer''s Association Delaware Valley, Philadelphia Corporation for Aging), and survivor support groups. One record per organization or recurring group.'
    - agent: u-illness-parenting-lgbtq
      text: 'Illness, parenting and identity support groups in Philadelphia: Cancer Support Community Greater Philadelphia, hospital support group calendars (Penn Medicine, Jefferson, Temple Health) for groups open to the public, new parent and postpartum support groups, LGBTQ support groups (William Way peer groups were already checked; skip them), and support groups for families of people who are incarcerated. One record per organization or recurring group.'
