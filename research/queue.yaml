        Scouts, 4-H, Big Brothers Big Sisters, Boys and Girls Clubs and PAL were covered by the chapter wave;
        focus on tutoring and mentoring programs, after school programs that take volunteers, and parent groups.'
    - agent: g-seniors-intergenerational
      text: 'Family `seniors-intergenerational` (Older adults and all ages together). Tags: senior_centers,
        friendly_visiting, intergenerational, retiree_corps, senior_activities, nursing_home_hospice, neighbor_errands.'
    - agent: g-advocacy-rights
      text: 'Family `advocacy-rights` (Advocacy and rights). Tags: tenant_rights, street_safety_transit, immigrant_rights,
        disability_rights, racial_equity, womens_lgbtq_rights, worker_rights, justice_reform_reentry, violence_prevention,
        civil_liberties_privacy.'
    - agent: g-health-wellness
      text: 'Family `health-wellness` (Health and wellness). Tags: meditation_mindfulness, tai_chi_qigong,
