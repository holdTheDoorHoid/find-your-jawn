      text: 'Family `nature-environment` (Nature and environment). Tags: trail_building, park_cleanup, friends_of_park,
        tree_tending, river_stewardship, habitat_restoration, citizen_science, climate_action.'
    - agent: g-gardening-greening
      text: 'Family `gardening-greening` (Gardens and greening). Tags: community_garden, urban_farming, vacant_lot_greening,
        community_orchard, pollinators_bees, garden_club.'
    - agent: g-hunger-housing-basic-needs
      text: 'Family `hunger-housing-basic-needs` (Food, housing and basic needs). Tags: food_pantry, community_fridge,
        mutual_aid, food_rescue, housing_help, homeless_outreach, goods_closets, home_repair, free_help_clinics.'
    - agent: g-kids-youth-mentoring
      text: 'Family `kids-youth-mentoring` (Kids and youth). Tags: mentoring, tutoring, after_school_camps,
