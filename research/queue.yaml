    slices:
    - agent: q-orchards-gardens-trees
      text: 'Philadelphia Orchard Project orchard partners (https://www.phillyorchards.org/), Neighborhood Gardens Trust gardens (https://ngtrust.org/), PHS Tree Tenders neighborhood groups and PHS community garden network (https://phsonline.org/), and Farm Philly (Parks and Recreation). Each garden or orchard group that welcomes volunteers or members is a record.'
    - agent: q-youth-sports-ost
      text: 'Philadelphia Youth Sports Collaborative member organizations (https://www.pysc.org/), Philadelphia out of school time providers that take volunteers, and youth sports leagues listed by Parks and Recreation. Record each organization, with volunteer coach roles where published.'
    - agent: q-arts-networks
      text: 'Theatre Philadelphia member companies (https://theatrephiladelphia.org/), Greater Philadelphia Cultural Alliance members (https://www.philaculture.org/), Philadelphia Folklore Project folk arts groups (https://www.folkloreproject.org/), and community choirs and orchestras in their lists. Keep groups with a public way in (auditions open to community members, volunteers, classes, ushers). Cultural Fund groups were done in another wave; spend little effort on big institutions.'
    - agent: q-cdc-neighborhood
      text: 'Philadelphia Association of Community Development Corporations members (https://pacdc.org/), main street and business district groups with volunteer committees, and neighborhood network hubs. Record CDCs only when they run a program residents can join (volunteer days, resident committees, clean ups, community gardens).'
    - agent: q-food-access
      text: 'Food access networks: community fridge maps for Philadelphia, Philly Food Rescue, Share Food Program partner pantries that publish volunteer shifts, the Coalition Against Hunger, and mutual aid directories. Pantries and fridges that take volunteers are records (family hunger-housing-basic-needs). Philabundance and SHARE locators need a browser: skip those tools, use their public partner pages only.'
