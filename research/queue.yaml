# Research waves still to run, highest priority first.
#
# The orchestrator (the launch week session, then the nightly scheduled run) takes the first wave
# whose status is todo and whose `after` waves are done (statuses: todo, running, researched = agents
# finished but not yet imported, done, held), checks research/budget.yaml against the
# usage meter, runs it with Haiku agents, imports, checks, publishes, logs, and marks it done.
#
# kind: batches = `fyj batches <id> <selector> --size <size>`, one agent per batch file, brief
#       research/briefs/<brief>.md
#       slices  = one agent per slice listed, brief research/briefs/<brief>.md, slice text pasted
#                 into the agent prompt
#       script  = a pipeline command, no agents
# searches_per_agent is a hard cap given to each agent. About 200 WebSearch calls are available per
# session, so a run never starts a wave whose agents x searches would exceed what is left.
# max_agents_per_run lets a big batch wave be split across several nightly runs.

waves:
  - id: w0-city-scripted
    lane: A
    kind: script
    command: fyj city-tier1 && fyj import-research w0-city-scripted
    status: done
    note: Free. Basic listings for City records (RCOs, rec centers, libraries, senior centers, gardens, City volunteer programs).

  - id: w1-tier1-friends
    lane: A
    kind: batches
    brief: tier1
    selector: --source city_friends,nss_grottos,manual_seeds --exclude-done
    size: 15
    searches_per_agent: 3
    status: done

  - id: w1-tier1-mummers
    lane: C
    kind: slices
    brief: tier1
    searches_per_agent: 6
    status: done
    slices:
      - agent: mummers-comics-wenches
        text: >
          Batch: every group from `fyj batches` selector --source mummers whose division is Comic or
          Wench Brigade (see the lineup page https://philadelphiamummersparade.com/2026-official-parade-lineup/).
          Start from the parade site and each association's own site (Comic Division, Wench Brigade
          Association) before searching. Record clubhouse addresses where published.
      - agent: mummers-fancy-strings
        text: >
          Batch: every group from `fyj batches` selector --source mummers whose division is Fancy,
          Fancy Brigade or String Band. Start from the parade site, the Philadelphia String Band
          Association and the Fancy Brigade Association sites. Many string bands list clubhouses on
          South 2nd Street ("Two Street"); note open rehearsals or recruiting where published.

  - id: w1b-tier1-redo
    lane: A
    kind: batches
    brief: tier1
    batch_files: research/batches/w1b-tier1-redo/
    searches_per_agent: 5
    status: todo
    note: Records from w1-tier1-friends that came back without sources. The batch file is already written; run one agent on it.

  - id: w2-chapters
    lane: P
    kind: slices
    brief: chapters
    searches_per_agent: 8
    status: done
    slices:
      - agent: p1-service-clubs
        text: Rotary, Lions, Kiwanis, Optimist, Toastmasters, Junior League of Philadelphia, League of Women Voters of Philadelphia, NAACP Philadelphia branch, Habitat for Humanity Philadelphia.
      - agent: p2-fraternal-veterans
        text: Elks lodges, Loyal Order of Moose, Masonic lodges and Prince Hall Masons, Knights of Columbus councils, Order Sons and Daughters of Italy lodges, Ancient Order of Hibernians divisions, VFW posts, American Legion posts, AMVETS posts.
      - agent: p3-black-service-social
        text: Divine Nine graduate chapters in Philadelphia (Alpha Phi Alpha, Alpha Kappa Alpha, Kappa Alpha Psi, Omega Psi Phi, Delta Sigma Theta, Phi Beta Sigma, Zeta Phi Beta, Sigma Gamma Rho, Iota Phi Theta), Jack and Jill of America Philadelphia chapter, The Links Philadelphia chapters, 100 Black Men of Philadelphia, National Council of Negro Women sections.
      - agent: p4-youth
        text: Scouting America units (via the Cradle of Liberty Council), Girl Scouts of Eastern Pennsylvania (Philadelphia service units and volunteer roles), Philadelphia 4-H (Penn State Extension), Big Brothers Big Sisters Independence, Boys and Girls Clubs of Philadelphia, Police Athletic League centers, Little League districts in Philadelphia, youth soccer clubs (EPYSA), CYO sports.
      - agent: p5-outdoors-nature
        text: Sierra Club Southeastern Pennsylvania Group, Audubon chapters serving Philadelphia, AMC Delaware Valley Chapter, Trout Unlimited chapters, Eastern Pennsylvania Mushroom Club, Delaware Valley Ornithological Club, Batona Hiking Club, Wissahickon Trails, Philadelphia Canoe Club, Philly Tree Tenders (PHS) groups.
      - agent: p6-arts-guilds
        text: Barbershop Harmony Society and Sweet Adelines choruses near Philadelphia, quilting, sewing, weaving and embroidery guilds, Urban Sketchers Philadelphia, NMRA model railroad divisions (Philadelphia area), the Society for Creative Anachronism barony covering Philadelphia, community choirs and orchestras listed by Chorus America or the League of American Orchestras.
      - agent: p7-sports-bodies
        text: Road Runners Club of America member clubs in Philadelphia, USA Rugby clubs (men, women, mixed ability), USA Ultimate and the Philadelphia Area Disc Alliance, US Masters Swimming clubs, USA Fencing clubs, table tennis clubs, USA Pickleball places and clubs, Women's Flat Track Derby Association leagues, USA Cycling and local cycling clubs, Schuylkill Navy rowing clubs and learn to row programs, cricket clubs.
      - agent: p8-disability-deaf-blind
        text: National Federation of the Blind of Pennsylvania Philadelphia chapter, Hearing Loss Association of America Philadelphia chapter, deaf clubs and Deaf community organizations in Philadelphia, Special Olympics Pennsylvania Philadelphia, adaptive sports (Philadelphia Adaptive Sports, Achilles International Philadelphia, adaptive rowing and climbing), Arc of Philadelphia, disability self advocacy groups.

  # Lane G interest sweeps. Family ids are filled in from data/vocab/interests.yaml once it lands.
  - id: w3-interests-a
    lane: G
    kind: slices
    brief: discover
    searches_per_agent: 10
    status: done
    slices:
    - agent: g-sports-teams
      text: 'Family `sports-teams` (Team sports). Tags: soccer, basketball, softball_baseball, kickball_rec_leagues,
        football_rugby, tennis_pickleball, hockey_roller_derby, cricket, youth_coaching, adaptive_sports,
        sports_fans. Include adult rec leagues (paid is fine, record cost), pickup groups, youth leagues that
        need volunteer coaches, and adaptive teams. Rugby, ultimate, rowing and running clubs were covered
        by the chapter wave; spend little effort there.'
    - agent: g-running-cycling-fitness
      text: 'Family `running-cycling-fitness` (Running, cycling and fitness). Tags: running, walking_group,
        group_bike_rides, bike_repair, yoga_movement, strength_training, martial_arts.'
    - agent: g-social-meetups
      text: 'Family `social-meetups` (Meetups and making friends). Tags: newcomer_meetups, conversation_circles,
        young_adult_social, singles_dating, lgbtq_social, affinity_social, neurodivergent_social, sober_social,
        veterans_posts, fraternal_service_clubs. Include LGBTQ social groups (William Way LGBT Community Center
        hosts many), newcomer and transplant meetups, young adult and over 50 social groups, sober social
        groups, language and affinity social clubs.'
    - agent: g-games-puzzles
      text: 'Family `games-puzzles` (Games and puzzles). Tags: board_games, chess, tabletop_rpg, trivia_nights,
        puzzles_escape, video_games, fandom_cons.'
    - agent: g-music
      text: 'Family `music` (Music). Tags: choir_singing, community_band, jam_sessions, drum_circle, instrument_lessons,
        dj_hip_hop, folk_traditional_music.'
    - agent: g-theater-dance-performance
      text: 'Family `theater-dance-performance` (Theater, dance and performance). Tags: community_theater,
        improv_comedy, social_dance, dance_company, cultural_dance, stage_crew, storytelling_spoken_word,
        variety_cabaret.'
    - agent: g-books-writing
      text: 'Family `books-writing` (Books and writing). Tags: book_club, writing_group, poetry, zines_media,
        literacy_tutoring, prison_book_programs, library_programs.'

  - id: w3-interests-b
