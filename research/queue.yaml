    slices:
    - agent: g-arts-crafts
      text: 'Family `arts-crafts` (Arts and crafts). Tags: painting_drawing, pottery_ceramics, fiber_arts,
        mural_public_art, photography, film_video, printmaking, craft_circle.'
    - agent: g-making-tech
      text: 'Family `making-tech` (Making and tech). Tags: woodworking, makerspace, electronics_robotics,
        coding_software, repair_cafe, cars_motorcycles, ham_radio, digital_skills.'
    - agent: g-outdoors-adventure
      text: 'Family `outdoors-adventure` (Outdoors and adventure). Tags: hiking, caving, climbing, kayaking,
        birding, camping.'
    - agent: g-water-rowing
      text: 'Family `water-rowing` (Water and rowing). Tags: rowing, youth_rowing, dragon_boat, sailing, swimming,
        regatta_volunteering.'
    - agent: g-food-drink
      text: 'Family `food-drink` (Food and drink). Tags: cooking_baking, community_meals, homebrew_wine, farmers_markets_coops,
        foodie_meetups, heritage_cooking.'
    - agent: g-animals
      text: 'Family `animals` (Animals). Tags: shelter_volunteering, cat_rescue_tnr, animal_fostering, wildlife_rehab,
        dog_owner_groups, horses_riding, pet_birds_hobbies, zoo_volunteering.'
    - agent: g-culture-language-heritage-groups
      text: 'Family `culture-language-heritage-groups` (Cultures and languages). Tags: language_exchange,
        esl_conversation, heritage_clubs, heritage_schools, immigrant_welcome, sign_language, cultural_exchange.'

  - id: w3-interests-c
    lane: G
    kind: slices
    brief: discover
    searches_per_agent: 10
    status: todo
    after: [w3-interests-b]
    slices:
