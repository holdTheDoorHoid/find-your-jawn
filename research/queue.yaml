  - id: w11-host-venues
    lane: N
    kind: slices
    brief: lists
    searches_per_agent: 3
    status: todo
    slices:
    - agent: n-william-way
      text: 'William Way LGBT Community Center (https://www.waygay.org/): its own peer groups and programs, and the outside community groups that meet there (calendar, "groups that meet here", community programs pages). Many small LGBTQ social, support, arts and sports groups meet at William Way. Support and recovery groups get audience.support_group true.'
    - agent: n-friends-center-bok
      text: 'Buildings full of small nonprofits and makers: Friends Center (https://www.friendscentercorp.org/, tenant list), the Bok building (https://www.buildingbok.com/, tenants), Crane Arts, and the Lutheran Settlement House and Norris Square Neighborhood Project program pages. Keep groups with a public program; skip businesses and offices with no way in.'
    - agent: n-community-centers
      text: 'Community centers and cultural centers that host classes, clubs and volunteers: Taller Puertorriqueno (https://tallerpr.org/), Asian Arts Initiative (https://asianartsinitiative.org/), The Village of Arts and Humanities (https://villagearts.org/), Mt. Airy Learning Tree (https://mtairylearningtree.org/, record its volunteer and member side, not each class), Center in the Park (https://www.centerinthepark.org/), Smith Memorial Playground, and Fleisher Art Memorial (https://fleisher.org/). Record each center once, plus any clubs that meet there with their own name and page.'
    - agent: n-bookstores-yarn-games
      text: 'Shops that host recurring free groups: independent bookstores with book clubs or writing groups (Uncle Bobbie''s, Harriett''s Bookshop, Head House Books, Big Blue Marble, Brickbat Books, A Novel Idea, Philly AIDS Thrift at Giovanni''s Room, Bindlestiff Books), yarn shops with knitting or crochet circles, game stores with open game nights, and comic shops with clubs. The GROUP is the recurring club or circle (kind club or program), named after the shop if it has no other name. Skip shops whose events are one off or ticketed readings only.'
    - agent: n-bike-run-climb
      text: 'Shops and gyms that run free recurring group activities: bike shops with weekly group rides, running stores with weekly group runs (Philadelphia Runner and others), climbing gyms with affinity meetups (queer climb nights, women climb nights, BIPOC climb nights), yoga studios with community or donation classes, skate parks with programs. The GROUP is the recurring ride, run or meetup. Record cost when the gym charges a day pass.'
    - agent: n-coops-alliances
      text: 'Cooperatives and their member groups and committees: the Philadelphia Area Cooperative Alliance member list (https://pacaphilly.coop/), Weavers Way committees and working member program, Mariposa Food Co-op, South Philly Food Co-op, Kensington Community Food Co-op, worker and housing co-ops with public events, credit unions with volunteer boards only if there is a public way in.'
  - id: w12-fiscal-sponsors
    lane: M
    kind: slices
    brief: lists
    searches_per_agent: 4
    status: todo
    slices:
    - agent: m-culturetrust
      text: 'CultureTrust Greater Philadelphia (https://culturetrust.org/), its list or directory of fiscally sponsored projects. Read every project page it links; many are tiny arts, youth, food and neighborhood projects with no tax status of their own. Keep the ones with a public way in.'
    - agent: m-open-collective-fractured-atlas
      text: 'Open Collective collectives based in Philadelphia (start at https://opencollective.com/search?query=philadelphia, read at most 6 search pages) and Fractured Atlas fiscally sponsored artists and projects in Philadelphia (public directory pages only). Keep community groups, mutual aid, clubs and volunteer projects; skip one person creative projects.'
    - agent: m-local-sponsors
      text: 'Other fiscal sponsors that serve Philadelphia groups. Use searches to find their public project lists (for example Bread and Roses Community Fund partners, Philadelphia Activities Fund, Allied fiscal sponsors of neighborhood projects, Public Health Management Corporation projects, The Philadelphia Foundation fiscal sponsorship, Urban Affairs Coalition partners). Urban Affairs Coalition (https://uac.org/) sponsors many small community programs: start there.'
  - id: w13-congregations
    lane: R
    kind: slices
    brief: lists
    searches_per_agent: 3
    status: todo
    slices:
    - agent: r-quaker-meetings
      text: 'Philadelphia Yearly Meeting (https://www.pym.org/) list of monthly meetings: every Quaker meeting that meets in the City of Philadelphia, with its worship time, First Day school, and committees or service work open to visitors. Also Friends Center (1501 Cherry St) programs open to the public.'
    - agent: r-episcopal-lutheran
      text: 'Episcopal Diocese of Pennsylvania (https://www.diopa.org/) parishes in Philadelphia and the Southeastern Pennsylvania Synod of the ELCA (https://sselca.org/) congregations in Philadelphia. Favor congregations with community meals, pantries, choirs or service programs open to neighbors.'
    - agent: r-presbyterian-methodist-ucc
      text: 'Presbytery of Philadelphia (https://www.presbyphl.org/) congregations, the United Methodist Eastern Pennsylvania Conference congregations in Philadelphia, United Church of Christ and American Baptist congregations in Philadelphia. Favor congregations with community programs open to neighbors.'
    - agent: r-catholic-parishes
      text: 'Archdiocese of Philadelphia parish finder (https://archphila.org/) for parishes in the City of Philadelphia, plus Saint Vincent de Paul conferences, Catholic young adult groups and parish community programs (pantries, meals, senior clubs) open to the public. Start with parishes whose websites list ministries; spend about the same effort on each.'
    - agent: r-jewish-congregations
      text: 'Synagogues and Jewish community groups in Philadelphia: the Jewish Federation of Greater Philadelphia directory (https://www.jewishphilly.org/), Reconstructing Judaism affiliated congregations, Chabad houses in the city, and Jewish volunteer programs (Jewish Relief Agency, Repair the World Philadelphia). We already have Tribe 12; skip it.'
    - agent: r-muslim-hindu-sikh-buddhist
      text: 'Mosques, Hindu temples, Sikh gurdwaras and Buddhist temples and sanghas in the City of Philadelphia (start from the Interfaith Philadelphia site https://www.interfaithphiladelphia.org/ and each community''s own site). Record open events, community meals (langar), classes and volunteer programs open to the public.'
    - agent: r-black-churches
      text: 'Historic and active Black congregations in Philadelphia with community programs open to neighbors (Mother Bethel AME, Enon Tabernacle Baptist, Zion Baptist, Mount Airy Church of God in Christ, Sharon Baptist, Vine Memorial Baptist and others found through the Black Clergy of Philadelphia and Vicinity and denominational lists). Record worship time and community programs (food, youth, health, re entry, senior).'
