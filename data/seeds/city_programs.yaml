      Contact per search text is Police.Explorers@phila.gov. We tried several guessed URL
      patterns for a dedicated enrollment page (all 404) and could not confirm one by direct
      fetch, so the age range and commitment length above carry lower confidence than our other
      entries; treat them as reported, not verified.

