    who_can_join: "55 or older, limited income, must live in Philadelphia"
    commitment: weekly
    training: "Yes: an information session and an orientation"
    clearances: "PA Child Abuse History Clearance, PA State Police Criminal Record Check, FBI Criminal History Background Check, and a National Sex Offender public website check"
    season: year round
    evidence_date: "2025-02"
    notes: >
      Philadelphia's is described on the page as one of the oldest and largest Foster Grandparent
      programs of its kind. serve.phila.gov, the City's old general volunteer portal address, now
