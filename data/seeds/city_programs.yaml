discontinued:
  - name: Philly Free Streets
    department: >
      Described in its own era's posts as a partnership between the City and the Office of Civic
      Engagement and Volunteer Service ("SERVE"), which no longer appears in the City's current
      department directory under that name
    url: "https://www.phila.gov/2019-08-29-philly-free-streets-by-the-numbers/"
    evidence: >
      Every phila.gov post we found about Philly Free Streets dates from 2017 to 2019 (the
      newest, 2019-08-29). Its own event domain, phillyfreestreets.com, no longer belongs to the
      program: fetched directly on 2026-10-04, it loaded an unrelated commercial gambling page,
      not anything related to Philly Free Streets.
    notes: >
      The event does not appear to have run, or at least has not been promoted on phila.gov,
