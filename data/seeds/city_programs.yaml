# Hand researched inventory of City of Philadelphia volunteer programs, built 2026-10-04 to fix
# the gaps in the city_volunteer_pages crawl (see research/harvest/2026-10-04-city-programs.md
# for the full report). Covers every program named in the task brief's checklist plus whatever
# else turned up while checking phila.gov. Facts only, written in our own words, each with a
# source URL and the date we saw it, per docs/RESEARCH.md and docs/ETHICS.md.
#
# Two top level lists:
#   programs: active (or apparently active) programs a resident can volunteer with or join.
#   discontinued: programs that look dead, with the evidence that leads to that conclusion.
#
# pipeline/fyj/harvest/city_programs.py turns `programs` into leads (kind_hint "program"); the
# `discontinued` list is not harvested, it is a research record for the write up and for anyone
# who revisits this list later.
#
# Mural Arts Philadelphia is included once, flagged as a nonprofit partner, link only, per the
# task: never copy a partner's own text. The School District of Philadelphia entry is flagged
# "public agency, not City government" per the task, since it has its own elected Board of
# Education and is not part of the City government this project otherwise covers.

programs:
  - name: Philly Reading Coaches
    department: Office of Children and Families, Department of Human Services (Out of School Time)
    url: http://ost.phila.gov/philly-reading-coaches/
    signup_url: https://secure.ngpvan.com/00Uw32TZoEm1ZG8EODxCmQ2
    what: >
      Pairs a trained volunteer with a K to 3rd grade student for weekly one on one after school
      reading sessions at an Out of School Time site, October through May.
    who_can_join: 16 or older (16 to 17 year olds need a parent or guardian waiver); no residency requirement stated
    commitment: weekly
    training: "Yes: an orientation plus a Safe Schools mandated reporter training module"
    clearances: >
      PA State Criminal Background Check, PA Child Abuse History Clearance, an FBI waiver or
      fingerprint check, a City Release Waiver (18+) or Parental Release Waiver (16 to 17), and a
      National Sex Offender Registry check for adults
    season: "School year, October through May"
    evidence_date: "2026-10"
    notes: >
      A 2023-11-27 phila.gov news post first announced the program, but its own site on the
      Out of School Time subdomain (ost.phila.gov) is the current, more detailed source: as of
      this research pass it said it is "now accepting volunteers for the 2026-2027 school year."

  - name: Power Up Tech Corps
    department: Office of Innovation and Technology
    url: https://www.phila.gov/services/education-learning/get-help-with-technology/volunteer-for-the-power-up-tech-corps/
    signup_url: https://phila.formstack.com/forms/oit_power_up_tech_corps_volunteer_program_intake_form
    what: >
      Trains volunteers to work as digital skills coaches, lab monitors and classroom aides,
      helping Philadelphia residents build computer and internet skills at library, Parks and
      Recreation, and Adult Education sites.
    who_can_join: 14 or older (14 to 17 year olds need parent or guardian permission); no residency requirement stated
    commitment: weekly
    training: "Yes: a 20 minute screening call plus an orientation module"
    clearances: >
      PA Criminal History Background Check and PA Child Abuse Clearance for anyone working with
      youth or at a Parks and Recreation or Free Library site; some sites also want an FBI check,
      which is waived for Pennsylvania residents of more than 10 consecutive years
    season: year round, rolling admission
    evidence_date: "2026-03"
    notes: >
      Launched per a 2026-01-29 announcement. As of this research pass the application form was
      temporarily closed because the program said it was at capacity for volunteers and asked
      people to check back in a few weeks, so the program itself is active even though new sign
      ups were paused that day.

  - name: Philadelphia Medical Reserve Corps (PMRC)
    department: Department of Public Health
    url: https://www.phila.gov/services/mental-physical-health/volunteer-for-the-philadelphia-medical-reserve-corps-pmrc/
    signup_url: https://www.serv.pa.gov/agreement.php
    what: >
      Registers and trains medical, public health and support volunteers that the Department of
      Public Health deploys during public health emergencies and large City events.
    who_can_join: 18 or older; must live in Philadelphia
    commitment: ongoing
    training: "Yes: trainings, exercises and real deployment opportunities offered throughout the year"
    clearances: "A criminal background check; licensed medical volunteers must hold an active, unencumbered license"
    season: year round
    evidence_date: "2025-03"
    notes: >
      The program page says it currently has over 7,000 members. Also reachable through the
      Office of Emergency Management's "Volunteering" referral page, which otherwise just links
      out to independent emergency response organizations rather than running its own corps.

  - name: Town Watch Integrated Services
    department: Office of Public Safety (Town Watch Integrated Services)
    url: https://www.phila.gov/departments/town-watch-integrated-services/
    signup_url: null
    what: >
      Trains, equips and certifies neighborhood Town Watch groups that patrol and report on their
      blocks, and runs Citizens Emergency Response Training (CERT), which teaches groups what to
      do in a disaster.
    who_can_join: any resident, through an existing or newly certified Town Watch group
    commitment: ongoing
    training: "Yes: TWIS trains and certifies groups, including CERT disaster training"
    clearances: unknown, not stated on this page
    season: year round
    evidence_date: "2026-05"
    notes: >
      This is the City's answer to the task's "CERT" checklist item. The Office of Emergency
      Management's own "Volunteering" page does not run a CERT program itself; CERT is one of
      TWIS's support programs, alongside Safe Corridors and drug prevention and anti bullying
      programs. A new group applies with a form linked from this page; an individual resident
      joins an existing group, not a citywide roster.

  - name: Citizens Police Academy
