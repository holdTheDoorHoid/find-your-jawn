    signup_url: null
    what: A ten week evening course, run each fall at the Police Academy, that teaches residents how police operate.
    who_can_join: unknown, not confirmed by a page we could fetch
    commitment: "Weekly for about 10 weeks, one evening a week, seasonal (fall)"
    training: n/a, the course is the training
    clearances: unknown
    season: fall
    evidence_date: "2023-08"
    notes: >
      We could not find or guess a current standalone phila.gov page with sign up instructions
      (several likely URLs returned 404). What is known (10 Wednesday evenings, 6:30 to 9:30 pm,
      contact a named officer at the Police Academy) comes from indexed search result text about
      a Citizens Police Oversight Commission presentation to an academy class, not a page we read
      ourselves. Evidence date is weak; worth a phone check before publishing with confidence.

  - name: Police Explorer Cadet Program
