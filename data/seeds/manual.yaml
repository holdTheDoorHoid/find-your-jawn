# Hand maintained seed list for groups that have no scriptable source of their own.
#
# Two batches, both written from facts only, no copied descriptions, per docs research rules:
#
# 1. The Schuylkill Navy's member boat clubs. structured-sources.md names the club list from
#    boathouserow.org's About page; this file uses the fuller, freshly checked list from
#    boathouserow.org/members/ (fetched 2026-10-04), which breaks the same 18 clubs into 12
#    "full members" and 6 "associate members" and is the more complete, more current version
#    of the same source.
# 2. The 32 numbered items at the end of docs/research/scouting/long-tail-sources.md, "Seed
#    list: 20 plus small groups discovered". Item 32 named two New Year Brigades in one line
#    (Golden Slipper NYB and Two Street Stompers NYB); since a lead is one group, that line
#    became two seed rows here rather than one row with two names.
#
# fyj harvest manual_seeds turns every row below into one lead in data/leads/manual_seeds.jsonl.
# `id` becomes the lead's native_id (manual_seeds:<id>). `note` is our own research note, kept
# in the lead's `extra.note`, not copied text from the source.

