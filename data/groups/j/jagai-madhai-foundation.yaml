first_step:
  how: Open the Meetings page on bhaktirecoverygroup.com, pick an open meeting that fits your time zone,
    and join it on Zoom with the link listed there.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Open meetings are listed with a join link, and the site says the only requirement is wanting
    recovery. The pages read do not say newcomers are welcomed by name, so the rating is 3.
  what_to_expect: Meetings follow the 12 steps, and most draw on Bhakti texts such as the Bhagavad Gita
    or Prabhupada's writings, so expect a spiritual element. The listed times show when each meeting starts
    and ends, but the pages do not say whether you will be asked to speak.
  first_visit_tips:
  - Convert the Eastern time to your own time zone before you join, since most listings use Eastern time.
  - Join a few minutes early to check your audio and video, since meetings are on Zoom.
  - Pick an open meeting; men's meetings are for men only.
