summary: A 12-step recovery fellowship for people working on addiction and related struggles. It adds
  bhakti yoga, a devotional practice, to the steps, and the only membership requirement is a wish to recover.
what_you_do: Join one of the about 20 Zoom meetings on the Meetings page, most of them open to anyone.
  Most meetings draw on Bhakti texts such as the Bhagavad Gita or Prabhupada's writings. Men's meetings
  are closed to others, and the one in-person meeting listed is in Mayapur, India.
