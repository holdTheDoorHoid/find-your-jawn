summary: An Orthodox community network in Rhawnhurst, Northeast Philadelphia. It links six congregations,
  a kollel, chesed groups, schools, and mikvahs, and it shares the weekly eruv status.
what_you_do: Join the JCOR email group for announcements, shiurim, events, and job and housing listings.
  Check the weekly eruv status, or browse the shul directory to choose a congregation.
