first_step:
  how: Join the JCOR email group from the website, then choose one of the six congregations in the shul
    directory to visit.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The site invites visitors and people thinking about moving to the area, and it gives a clear
    way to sign up for the email group.
  what_to_expect: JCOR is a network rather than one group, so a first step is choosing a congregation
    from the directory on the page. Shiurim (Torah classes) are offered across the congregations and by
    the kollel, and the email group announces them along with events and job and housing postings. The
    site lists no visit times, so check with the congregation you pick before you go.
  first_visit_tips:
  - Check the weekly eruv status before Shabbat, since the site shares it through the email group.
  - Read the About section for information on schools, kosher options and housing if you are thinking
    of moving.
  - Contact the congregation you choose to ask about visiting.
