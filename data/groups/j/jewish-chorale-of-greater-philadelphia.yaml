first_step:
  how: Email manager@nashirah.org to book an audition for the 2026 to 2027 season. Auditions are by appointment,
    in person or online.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: You must audition by appointment before joining, and the site does not say who may audition or
    describe a beginner route.
  what_to_expect: Staff email you to confirm an audition time, which can be in person or online. The audition
    checks sight-reading, tonal memory, rhythm, vocal range, and how even your tone is. The site does
    not give the audition length, fees, or rehearsal times, so ask when you book.
  first_visit_tips:
  - Arrive at least 15 minutes before your confirmed time.
  - Ask about rehearsal days, fees, and membership terms when you email, since the site does not list
    them.
