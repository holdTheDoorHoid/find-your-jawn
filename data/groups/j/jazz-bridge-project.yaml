first_step:
  how: Come to a free park show listed on the events page, or buy a ticket for a Cheltenham or Collingswood
    show through that event's Get Tickets link.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The shows are public, the events page explains how to attend, and many park shows have free admission.
    Musician help has a phone line and a request form, so that path is clear too.
  what_to_expect: Most park shows run about an hour and a half, hosted by a local jazz or blues musician
    who invites the audience to take part. Many are free and outdoors in Philadelphia parks. The ticketed
    shows at the Cheltenham Center for the Arts and the Collingswood Community Center run about 7:30 to
    9 pm.
  first_visit_tips:
  - Check the events page for the start time and whether a ticket is needed before you go.
  - Ticketed shows list $20 in advance and $25 at the door, and some say students are free.
  - The office is at 6703 Germantown Ave, Suite 200. Call 215-517-8337 before you visit.
