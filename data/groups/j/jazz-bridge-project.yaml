summary: Helps jazz and blues musicians in the Philadelphia area who are in money, health or housing trouble,
  with a social worker and small grants. It also books local musicians for public concerts, many of them
  free park shows in Philadelphia.
what_you_do: 'Musicians can call the office, which aims to return calls within 24 hours, or fill in the
  request form for help with money, health or housing. Anyone can attend a concert: many park shows are
  free, and some ticketed shows let students in free. Volunteers can join individual or group projects,
  and donations are accepted.'
