summary: Drexel's physics department opens its rooftop observatory to the public on the first Wednesday
  of most months during the school year, weather permitting. Everyone is invited, but the telescope is
  being replaced, so no public night is set right now.
what_you_do: Go up to the observatory roof at a listed night and look through the telescope when the sky
  is clear. Check the status page first, since no night is listed while the upgrade is under way.
