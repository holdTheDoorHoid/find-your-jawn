  sign_up_needed: null
  newcomer_friendliness: 2
  basis: Anyone can come, but no night is scheduled while the telescope is replaced, so the way in is
    unclear until dates return.
  what_to_expect: A public night is a session on the Main Building roof, run by a physics professor with
    graduate and undergraduate helpers. Guests look through the observatory telescope at objects such
    as planets, star clusters, nebulae and comets, when the sky is clear. The route up is several flights
    of stairs, so plan for the climb.
  first_visit_tips:
  - 'Check the status page the day of: the night is cancelled or moved if it rains or the sky is not clear.'
  - Expect several flights of stairs, since the site mentions no elevator.
  - Email physics@drexel.edu before you come if you have an access need.
