first_step:
  how: Come to the 11 am Sunday service at 6301 Drexel Road, in person or on Zoom, or call 215-473-1910
    with questions before a first visit.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The site says visitors of any faith and families with children are welcome, and it lists several
    ways to get in touch.
  what_to_expect: Sunday worship starts at 11 am in the church building, and a Zoom service runs alongside
    it. The church mainly serves Japanese speakers, and the website is in Japanese and English. Coffee
    follows worship, and some Sundays also have a meal or lunch.
  first_visit_tips:
  - Parking is available, and the entrance is from Drexel Road.
  - Plan to stay for coffee, and for lunch on Sundays when a meal is listed.
  - From the 69th Street Terminal, take Bus 65 to 63rd Street and Sherwood Avenue, as the directions page
    explains.
  - Call 215-473-1910 before you come if you have questions.
