first_step:
  how: Fill in the Volunteer Interest Form on the Get Involved page. Youth can instead come to the Wednesday
    4 pm Fuerza meeting at 600 Washington Ave.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: 'The volunteer form works as a directory: the group says it cannot work with everyone at once
    and will contact people when a role fits. Youth can attend the open weekly meeting, but adults have
    no clear first step.'
  what_to_expect: Adults who fill in the form wait to be contacted when a role fits, since the group cannot
    take everyone at once. Youth who come to Fuerza join a weekly group that looks at education, labor
    and immigration from a youth view. The site does not describe a first shift, how long it lasts, or
    any training.
  first_visit_tips:
  - Call 215-218-9079, extension 3, to ask about Fuerza before you come.
  - Fuerza meets on the 2nd floor of the Saigon Maxim Shopping Center at 600 Washington Ave.
  - Food and diaper pickup runs Thursdays from noon to 2 pm at the same address.
  - The office is open Monday to Friday, 10 am to 6 pm.
