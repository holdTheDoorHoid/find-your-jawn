summary: A community led group in South Philadelphia, made up of Latine immigrants, that works for the
  rights of workers, parents, youth and immigrant families. It runs youth leadership, immigrant justice
  and community care programs, plus food and diaper pickups.
what_you_do: Fill in the Volunteer Interest Form to offer skills or time, or join the volunteer network
  that goes with people to court dates and immigration check ins. Young people can attend the Wednesday
  Fuerza youth meeting, and families can pick up food and diapers on Thursdays.
