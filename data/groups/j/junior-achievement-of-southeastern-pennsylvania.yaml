first_step:
  how: Fill in the volunteer sign-up form on the Volunteer page. A program manager then contacts you to
    pick a grade range and schedule, and you attend a short training.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The sign-up steps are spelled out in order, and a short training with a program manager comes
    before teaching. The page does not say whether teaching experience is needed.
  what_to_expect: Expect a short training with a program manager, who answers your questions before you
    teach. You then choose a grade range from K to 12 and a schedule together, often at a class near your
    home or work. Classes can be in person or virtual.
  first_visit_tips:
  - 'Do not come to 1501 Cherry Street expecting an office: the address is for mail, and the office does
    not take visitors.'
  - Call 267-519-5307 with questions before you fill in the form.
  - Think about the grade range you would like before the program manager calls you.
