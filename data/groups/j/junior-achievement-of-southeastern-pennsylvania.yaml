summary: A nonprofit that brings lessons on money, work, and starting a business into schools and after-school
  programs. Volunteers from many kinds of jobs teach short classes and guide hands-on activities such
  as a budgeting simulation.
what_you_do: Sign up through the volunteer form, choose a grade range and a schedule with a program manager,
  and attend a short training. Then share your work and life experience in classes, in person or virtually.
