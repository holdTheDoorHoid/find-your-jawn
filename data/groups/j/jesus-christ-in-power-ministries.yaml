summary: A congregation with Sunday school, Sunday worship, and weeknight services. It says everyone is
  welcome, including people who do not have a church home.
what_you_do: Attend a Sunday or weeknight service, join Sunday school, or send a prayer request through
  the form on the website. The community programs page also lists a Friday 11 am to 1 pm slot, a first-Friday
  9 to 11 am slot, and named programs (Kiddie Carnival, Community Prayer Walk, Men 4 the Master and Work
  Crew) with no details on any of them.
