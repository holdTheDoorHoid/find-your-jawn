  newcomer_friendliness: 4
  basis: The site says visitors are welcome even without a church home and lists the service times. It
    does not describe a separate newcomer program.
  what_to_expect: Services run Sunday mornings and on Wednesday, Thursday and Friday evenings, and Sunday
    school comes before the Sunday service. The site does not say how long a service lasts, what language
    it uses, or what the service feels like. You can ask anyone at the ministry for prayer or a listening
    ear, and no fee is listed.
  first_visit_tips:
  - Check which season's start time applies, since the page lists different times for April to September
    and October to March.
  - The site gives no parking or transit details, so call ahead for directions.
