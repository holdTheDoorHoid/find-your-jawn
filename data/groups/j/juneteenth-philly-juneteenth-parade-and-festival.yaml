summary: Juneteenth Philly organizes the Juneteenth parade and festival each June, with a music festival,
  a youth pavilion and a scholarship pageant. Adults volunteer through an online form, and groups can
  apply to march in the parade.
what_you_do: Volunteers aged 18 and older fill in a sign-up form. Groups apply to march in the parade.
  Registration for the 2026 parade is closed, so watch the parade page for the next round.
