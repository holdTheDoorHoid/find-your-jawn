summary: A secular Jewish community in Northwest Philadelphia for families and adults. Its Sunday school
  teaches Jewish history, holidays and values to children from kindergarten through high school, and adults
  can join study groups, outings and social clubs.
what_you_do: Enroll children in Sunday school, come to holiday celebrations and life-cycle events as a
  family, or join adult study groups, outings and social activities.
