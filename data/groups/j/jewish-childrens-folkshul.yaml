first_step:
  how: Email Folkshul@folkshul.org for the meeting address and to ask about a visit. The calendar also
    lists an adult introduction session that is open to new people.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The site says it wants new families and adults, and the calendar lists an adult introduction
    session that is open to new people, with an email address for questions.
  what_to_expect: Sunday school runs about 10 am to 12:30 pm on most Sundays from September through May,
    with classes by grade and a free Sunday Fundays program for children ages 0 to 4 and their caregivers
    on select Sundays. Adults can join study groups, a restaurant club, local outings, film screenings
    and a speakers series, and the adult community gathers during Sunday school hours. Families register
    for membership first, then enroll each child and pay tuition, with tuition help available on request.
  first_visit_tips:
  - Email for the meeting address before you come, since it is not published on the website.
  - Membership comes before Sunday school enrollment, so ask about the steps early.
  - Most calendar items are for members, so ask whether a specific event is open to visitors.
