summary: A jazz charity serving the Philadelphia region. It holds public concerts at churches and other
  community venues, and it offers music lessons for young people who cannot afford them.
what_you_do: Go to a public concert on the schedule page. Children and young adults who cannot afford
  lessons can ask about the music education program, where teachers come to students. The site also describes
  a Jazz Master Class for musicians of all levels, though it lists no current dates for it. The site lists
  no volunteer roles.
