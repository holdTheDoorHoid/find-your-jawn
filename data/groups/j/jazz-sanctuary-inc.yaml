first_step:
  how: Pick a public concert on the schedule page and go, or email music@thejazzsanctuary.com to ask about
    lessons or the Jazz Master Class.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Concerts are public and listed by date with venue names. Lessons and the class are arranged by
    email, and the site gives no start steps for them.
  what_to_expect: A concert is a public show held in a church or community venue. The schedule page does
    not list start times or ticket prices, so check each event's own page first. When lessons are arranged,
    teachers go to houses of worship or community houses close to the student.
  first_visit_tips:
  - Check the event page for the start time and whether tickets are needed.
  - Email the group if you or a young person wants lessons; the site does not say what they cost.
