summary: A Jewish community network for graduate students and young professionals in Philadelphia, run
  as a program of Philly Hillel. It lists programs named Shabbat Across Philly and Philly Jewish Community,
  along with student associations.
what_you_do: Sign up for the weekly e-newsletter, attend a home Shabbat dinner or holiday meal, or come
  to a lunch and learn or networking event. The site does not say how membership works.
