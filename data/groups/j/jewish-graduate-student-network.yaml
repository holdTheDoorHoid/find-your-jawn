first_step:
  how: Sign up for the weekly e-newsletter from the site, then email info@phillyhillel.org to ask how
    a newcomer can join a home Shabbat dinner or an event.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Anyone can sign up for the weekly newsletter and email to ask questions, and the FAQ says young
    professionals can take part as well as grad students, but the site does not say newcomers get a special
    welcome.
  what_to_expect: 'Most events are meals or discussions: home Shabbat dinners hosted by a grad student
    or young professional, holiday dinners, lunch and learns, and networking nights. The group says most
    participants are grad students, usually aged 22 to 35, and young professionals are welcome too. The
    site does not list costs or how long events last, and its calendar showed no upcoming events when
    we checked.'
  first_visit_tips:
  - Sign up for the weekly e-newsletter so you hear about upcoming events.
  - Email info@phillyhillel.org before you come, since the site does not explain how guests join home
    dinners.
  - If the calendar is empty, call 267.229.1451 to ask about the next program.
