  newcomer_friendliness: 4
  basis: The page welcomes new parents by name, the sign-up form is optional, and the host says people
    can still come if they forget to register.
  what_to_expect: The circle meets on the second floor of a physical therapy office on North 20th Street,
    which is stroller friendly. Expect coffee, donuts and fruit, and a relaxed time to talk with other
    parents whose babies are about the same age. The page describes no set agenda, and the meetup is free.
  first_visit_tips:
  - Bring your baby if they are still pre-crawling, since that is who the circle is for.
  - The sign-up helps the host plan refreshments, but you can still walk in if you forget.
  - The building has an elevator, so a stroller is fine.
