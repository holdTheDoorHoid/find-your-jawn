summary: A free weekly meetup for new moms and birthing people whose babies are about the same age. It
  meets at Invictus Physical Therapy on North 20th Street and is aimed at families with babies who are
  not crawling yet. Coffee, donuts, and fruit are provided.
what_you_do: Come to the weekly circle to meet other new parents and share what is going on. A special
  free session on mommy and me yoga and infant massage is listed for a December date.
