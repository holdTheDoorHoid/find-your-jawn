summary: A free weekly meetup for new moms and birthing people whose babies are about the same age. It
  meets in a second floor room at Invictus Physical Therapy on North 20th Street and is aimed at families
  with babies who are not crawling yet. Coffee, donuts and fruit are provided.
what_you_do: Come to the weekly circle to meet other new parents and talk about what is going on with
  you and your baby. The host also offers occasional free sessions, such as a mommy and me yoga and infant
  massage class, with registration requested.
