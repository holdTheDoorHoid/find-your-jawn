  basis: Joining runs through a membership sign-up page, and the site says some events are members only.
    It does not say whether non-members can attend the other events.
  what_to_expect: Events are networking, career, and leadership gatherings run by volunteers. Calendar
    listings run from 5 to 8 pm. The site does not give event venue addresses or event prices.
  first_visit_tips:
  - Email NAAAPPHILA@gmail.com before you go to ask whether the event is members only.
  - Check the calendar for the date and time, since the site does not list venue addresses.
  - Member benefits include discounted or free workshops, so ask about member prices before you pay.
