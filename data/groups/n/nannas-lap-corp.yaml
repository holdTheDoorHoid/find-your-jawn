  basis: The family workshops are real and open to parents and children, but the site gives no schedule,
    price, or sign up steps, so the way in is unclear.
  what_to_expect: The site does not describe a first visit, such as how long a session runs or where it
    is held. Workshops can be one-on-one or in a group and can be in person or online, and the group asks
    people to get in touch for details.
  first_visit_tips:
  - Ask how long a session runs and whether it is in person or online, since the site does not say.
  - The address on the site is a P.O. Box, so no meeting place is listed; ask where sessions happen.
  - Instructional videos on shampooing, conditioning, combing, brushing, and skincare are on the site
    and can be watched before you get in touch.
