summary: A Philadelphia nonprofit that helps foster and adoptive parents care for children's hair and
  cultural heritage. It runs family workshops and styling training, and it offers salon services and hair
  care supplies to children and teens in hard circumstances.
what_you_do: Parents, caregivers, and families can take part in the hair care and cultural workshops,
  which run in person or online. Schools and adoption agencies can ask about training for staff. To ask
  how to help, use the contact form or email the group, since the site lists no set class times or volunteer
  roles.
