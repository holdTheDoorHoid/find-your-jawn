  how: Email NewGem116@gmail.com to ask how to volunteer, or submit the Basic Needs or Housing Support
    form on the Get Support page.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Volunteers can apply by email regardless of background or experience, and support requests use
    posted forms, but no orientation or first-timer program is described.
  what_to_expect: Volunteer roles include event help, outreach, mentoring, and behind-the-scenes work,
    and time can be as little as about an hour a week. The page does not describe training, orientation,
    or background checks, so ask by email before you start. After a support request, a team member follows
    up directly, and housing requests are reviewed as soon as possible.
  first_visit_tips:
  - Email NewGem116@gmail.com first, since the site lists no set visit hours.
  - Ask about training, background checks, and age rules, which the volunteer page does not cover.
  - For support, ask about eligibility, cost, and the process, which the Get Support page leaves open.
