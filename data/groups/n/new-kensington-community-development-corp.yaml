first_step:
  how: Come to the Saturday Weekend Gardening Club at 10 am. The group's pages do not give the place or
    cost, so call 215-427-0350 first to confirm.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Friday hours are a walk-in space, and the group lists a phone, email and text line. The gardening
    club is for adults building skills, but its listing gives no sign-up step.
  what_to_expect: The Saturday gardening club runs 10 am to noon for adults who want to build gardening
    skills and share what they know. Friday walk-in hours run 2 to 4 pm, and you can drop by without an
    appointment. Neither listing gives the place or cost, so ask first.
  first_visit_tips:
  - Call 215-427-0350 or email info@nkcdc.org to confirm the place for the gardening club.
  - Text the word NKCDC to 833-901-2072 to get event alerts.
  - Wear clothes you can get dirty if you plan to garden.
