summary: New Kensington CDC is a community-based nonprofit that helps neighbors with housing counseling
  and home repairs, small business help, and health and gardening programs. It also works with the City
  on local priorities and is a registered community organization for zoning talks.
what_you_do: Get help with housing or a small business, join the Saturday gardening club, or sign up as
  a Community Connector to build skills and connect with a wider network.
