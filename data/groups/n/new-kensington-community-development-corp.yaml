summary: A community organization named by the City as a Neighborhood Advisory Committee, New Kensington
  CDC connects neighbors in the River Wards part of the city with City services and a say in local priorities.
  It is also a registered community organization, so developers are asked to talk with it about nearby
  zoning and building plans.
what_you_do: Work with neighbors and the City on local services and what the area needs.
