summary: A community development group in Nicetown that runs a yearly summer festival with concerts and
  a Land Care program for parks and gardens. The City lists it as the Friends group for Nicetown Park,
  but its website does not mention the park.
what_you_do: Volunteer at the yearly Giveback Community Festival through the sign-up link on the site,
  or call the office about Land Care. Residents can act as stewards who look after vacant land on their
  blocks.
