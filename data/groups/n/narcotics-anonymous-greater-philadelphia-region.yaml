summary: The regional service office for Narcotics Anonymous groups in the Philadelphia area. It runs
  phone lines for people who want to reach someone in recovery right away, and a line that gives meeting
  information by ZIP code.
what_you_do: Call for immediate help or for meeting information, or browse the meeting directory on the
  website by area, county, virtual meeting, or map. Members can also serve on regional committees such
  as hospitals and institutions, outreach, public relations, and the phone line.
