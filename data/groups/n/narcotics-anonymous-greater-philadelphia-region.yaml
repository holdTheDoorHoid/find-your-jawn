first_step:
  how: Call 215-NA-WORKS (215-629-6757) for immediate help, or call or text 215-999-4670 for meeting times
    by ZIP code. You can also pick a meeting from the meeting directory on the website and go to see how
    it works.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The FAQ says you do not have to be clean to attend a first meeting, and the Welcome page describes
    how newcomers are greeted, with a help line and a meeting finder to start.
  what_to_expect: Expect an informal meeting of people in recovery from drug addiction, where members
    take turns sharing or one person speaks at length. Visitors are usually asked to give a first name,
    and there is no fee to attend. Some meetings are open to people who do not have an addiction and some
    are closed, so check the listing first.
  first_visit_tips:
  - Arrive a few minutes early and stay until the end if you can, and feel free to ask questions.
  - Choose a meeting marked open if you do not have an addiction yourself.
  - Be ready to say your first name, which is the usual way to introduce yourself.
  - Pamphlets are often free at meetings, so you can take one home.
