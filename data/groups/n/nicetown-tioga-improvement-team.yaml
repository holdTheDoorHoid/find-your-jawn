first_step:
  how: Join the monthly meeting on the third Tuesday at 6 pm on Zoom; the current link is on the group's
    meetings page.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: The membership page says everyone is welcome at meetings and the meetings page gives a fixed
    time, but neither speaks to newcomers directly.
  what_to_expect: Meetings run on Zoom, and the agenda is posted on the meetings page once it is set,
    though some months list it as to be announced. The group reviews nearby zoning and development plans
    and hosts public meetings for some projects. Residents who come regularly can join committee talks
    or sign up to help with a program. The page does not say how long a meeting lasts or what it costs.
  first_visit_tips:
  - Check the meetings page for the current Zoom link before the meeting, since the links on the site
    differ.
  - Camera use is optional on Zoom, and the page also lists a phone dial-in.
  - Expect the talk to center on zoning and building plans, the group's main work.
