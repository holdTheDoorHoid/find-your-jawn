summary: Nicetown-Tioga Improvement Team is a neighborhood group, formed in 1998, that works as an umbrella
  for more than 50 local groups and block captains. Its monthly meeting is where neighbors hear about
  zoning and building plans and talk about housing, schools and jobs.
what_you_do: Neighbors come together to review nearby building and zoning proposals and share the group's
  view with the City and developers. They also join free community events, such as school supply giveaways
  and movie nights.
