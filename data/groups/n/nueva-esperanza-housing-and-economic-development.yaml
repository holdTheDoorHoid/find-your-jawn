summary: Nueva Esperanza is a faith-based nonprofit in the Hunting Park area that runs charter schools,
  a college branch, job training, housing counseling, immigration legal help, and arts and music classes.
  It is also a City registered community organization for reviewing zoning and building plans in the North
  part of the city.
what_you_do: Use one of its programs, such as housing counseling, workforce training, immigration legal
  help, or arts and music classes, or attend its community events and outreach.
