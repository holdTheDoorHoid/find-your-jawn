first_step:
  how: Call (215) 324-0746 or visit 4261 North 5th Street and ask which community meetings or programs
    fit you.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The site lists programs and events and says to call or visit, but it does not say how to join
    the neighborhood meetings or volunteer.
  what_to_expect: The site does not describe a community meeting, volunteer shift, or class schedule,
    so ask at the office what is running. Its neighborhood work includes door to door outreach, daily
    street cleaning on the commercial corridor, tree planting, food outreach, and community fairs. The
    page does not say how long a first visit takes or what it costs.
  first_visit_tips:
  - Ask whether the community meetings are open to residents or mainly to business owners.
  - The office is at 4261 North 5th Street, Philadelphia, PA 19140.
