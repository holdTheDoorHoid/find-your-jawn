summary: Promotes February 1 as National Freedom Day, a day meant to honor freedom for all Americans.
  The group works through education, civic programs, and community events, and its site lists ways to
  join, volunteer, or give.
what_you_do: Join as a member through the Sign up now link on the site, or volunteer to help plan local
  events, write educational content, or mentor young people. Members get updates, event invitations, and
  a voice in programs.
