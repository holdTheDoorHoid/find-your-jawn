first_step:
  how: Email nfda1941@gmail.com or use the contact form on the website to ask about membership, volunteering,
    or the next luncheon. To join, use the Sign up now link, which uses a passwordless login.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Anyone can sign up on the site or email to volunteer, and the page lists volunteer roles and
    member benefits. The site does not say whether the luncheon is open to the public or what it costs.
  what_to_expect: The main public event is an anniversary luncheon held on a Saturday in late January,
    with a noon start. The 2026 luncheon was at a hotel on City Avenue in Philadelphia. The 2027 luncheon
    is planned for Springfield, in Delaware County.
  first_visit_tips:
  - Email nfda1941@gmail.com to ask whether the luncheon is open to the public and what it costs. The
    site does not say.
  - If you are going to the 2027 luncheon, plan for a trip to Springfield, Pennsylvania.
  - Members get updates and event invitations, so joining is the easiest way to hear about the next event.
