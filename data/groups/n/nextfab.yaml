first_step:
  how: Book a free tour through the website, then ask about membership before you plan a class or a project
    on the machines.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Free tours and public events let you see the space before you pay, but classes and shop use need
    a paid membership and a proficiency check.
  what_to_expect: A free tour walks you through the North Philadelphia space, including the jewelry, sewing,
    woodworking, metal, and laser cutting areas. Before you use the machines, you finish an online orientation
    and then pass a proficiency check, a private lesson, or a class. Ask when you book how long a tour
    runs.
  first_visit_tips:
  - Book the tour through the website before you come.
  - Free on-site parking is open to visitors as well as members.
  - Check the events page for free public gatherings that non-members can join.
  - Ask an instructor before you bring any power tools or unusual items.
