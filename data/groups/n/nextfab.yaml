  notes: 'The building is described as ADA compliant, with a paved, ramped entrance, a load-in garage,
    and gender-neutral restrooms near the workshops. Some workshop areas and machines may be hard to use
    for some physical disabilities, so ask about accommodations. Classes assume you can follow instruction
    in English on your own. Nearest SEPTA rail, per the FAQ: the Berks stop on the Market-Frankford Line,
    about five blocks east. Bus Routes 3 and 57 and the Girard Avenue trolley also run nearby.'
