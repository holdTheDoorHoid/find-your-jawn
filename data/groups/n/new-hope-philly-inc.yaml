  newcomer_friendliness: 3
  basis: Worship and Bible studies are listed publicly with times and an address, with a phone number
    and contact form, but the site gives no visitor guidance and does not explain how to join a study.
  what_to_expect: Sunday worship starts at 11 am. The website does not describe the service, what to wear,
    or what visitors do, so it is worth calling ahead. Bible studies meet on Tuesday evenings and on the
    first and third Saturday mornings, and the site does not explain how to join one.
  first_visit_tips:
  - Call 267-201-2419 or use the contact form ahead of time, since the church says it may take 48 to 72
    hours to reply.
  - Confirm the service location before you go, since the church asks for prayer for a building renovation
    and gives no timeline.
  - Ask about parking and transit, since the site lists neither.
