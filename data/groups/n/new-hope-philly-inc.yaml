summary: A non-denominational Christian church in Southwest Philadelphia. It offers Sunday worship, separate
  men's and women's Bible studies, and addiction support for men, including a 12-month discipleship track.
what_you_do: Come to Sunday worship, join a men's or women's Bible study, or ask about the men's addiction
  support and discipleship track. The church also lists counseling, Bible school, and GED courses as member
  supports, with no class schedules published.
