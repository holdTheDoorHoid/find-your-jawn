first_step:
  how: RSVP for a guest seat on the club's Meetup page. The Zoom link is posted there after you RSVP.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The club says guests are welcome at any skill level, speaking is optional for guests, and its
    pages explain how to RSVP.
  what_to_expect: A guest joins the Zoom meeting and watches members give prepared speeches, speak off
    the cuff, and run the meeting roles, followed by feedback. You are asked what brought you to the meeting
    and, at the close, what you thought of it. Speaking is your choice, and the visit costs nothing.
  first_visit_tips:
  - RSVP on the club's Meetup page first, since the Zoom link appears only after you do.
  - Decide before the meeting whether you want to take part in the impromptu speaking, since guests choose.
  - Check the Meetup page for cancellations, because the club posts changes there.
  - Meeting times are shown in your own local time on the club's site.
