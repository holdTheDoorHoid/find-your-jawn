summary: A Northeast Philadelphia Toastmasters club that practices public speaking and meets online on
  Zoom. Guests attend free after an RSVP and choose for themselves whether to speak.
what_you_do: Join an online meeting to try speaking, answer impromptu questions, or just watch and say
  what brought you.
