  basis: Community members and dancers can take part in the workshops, and the company names a contact
    to ask about the next one, but no workshop is listed as upcoming.
  what_to_expect: The 2026 Lunar Retreat community workshops ran two hours in the early evening, mixing
    movement prompts with writing, games, and group talk about care, grief, and change. The movement workshops
    focus on technique, improvising, and developing a grounded dance presence. The site does not list
    prices, experience needed, or room details, so ask before you go.
  first_visit_tips:
  - Ask the company manager for the street address and the price before you come.
  - Ask whether the workshop needs any dance experience, since the site does not say.
