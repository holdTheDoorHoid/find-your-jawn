first_step:
  how: Stop by Community Office Hours to meet board members and share ideas. Or join a Sunday garden shift
    at Liberty Lands from 9 am to noon, or a neighborhood clean-up listed on the calendar.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: Office hours, general meetings and committees are open to the public and the calendar gives dates,
    but the site does not describe how a first-time volunteer is welcomed.
  what_to_expect: Office hours are a walk-in chance to meet board members and talk about neighborhood
    ideas. Committee meetings are in the evening at the Community Center; the calendar lists the Liberty
    Lands and Education committees at 7 to 8 pm, and the Zoning Committee can also be joined on Zoom.
    The site lists no fee for the garden shifts or clean-ups.
  first_visit_tips:
  - Check the calendar before you go, since times and rooms change.
  - Use the contact form on the website to ask about volunteer projects.
