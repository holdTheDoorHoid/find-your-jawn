summary: Neighbors who look after Liberty Lands, the community-owned park, and keep watch on zoning and
  building plans in Northern Liberties. They also run clean-ups, park music and movie nights, and walk-in
  office hours.
what_you_do: Join a committee such as Liberty Lands, Zoning or Education, help at a Sunday garden shift
  or a neighborhood clean-up, or bring an idea to office hours.
