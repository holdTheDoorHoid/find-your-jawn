summary: Norris Square Community Action Network-NSCAN is a Registered Community Organization (RCO) in
  the Lower North part of the city. The City asks developers to talk with RCOs about nearby zoning and
  building plans, so this is a way for neighbors to have a say.
what_you_do: Neighbors come together to review nearby building and zoning proposals and share the group's
  view with the City and developers.
