summary: A riding stable in Wissahickon Valley Park that teaches group and private riding lessons to children
  over 7 and adults, runs summer day camps, and holds shows and fundraisers that welcome volunteer help.
what_you_do: Take riding lessons placed by level, go to summer day camp, or help at a show or fundraiser.
  The stable also runs Racehorse Restarts, which rehabilitates and rehomes retired racehorses.
