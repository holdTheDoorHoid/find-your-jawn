first_step:
  how: Email office@northwesternstables.com to ask about beginner lessons and join the new student email
    list, or call (215) 242-8892. The site says beginner registration for Fall 2026 is open.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Youth beginners ages 7 to 12 have their own Leadline/Beginner class and the site explains how
    to register, but adult classes are for experienced riders and new adults must contact the stable first.
  what_to_expect: Group lessons last one hour and run in multi-week sessions. Riders are placed in groups
    by level, based on an instructor's observation and a conversation about your skills. Private and semi-private
    lessons are mostly on weekdays before 5 pm, and beginners ages 7 to 12 start in the Leadline/Beginner
    class.
  first_visit_tips:
  - Arrive 20 minutes early for a Leadline/Beginner barn lesson on grooming and tacking a horse.
  - Pay before the session starts, online, by check or in cash. Credit card payments carry extra fees.
  - Classes fill first come, first served, and current students get preference, so register early.
