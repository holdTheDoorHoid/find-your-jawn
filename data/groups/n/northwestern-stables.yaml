summary: A riding stable in Wissahickon Valley Park that teaches group lessons year round to children
  over 7 and adults, runs summer day camps, and holds shows and fundraisers that welcome volunteer help.
what_you_do: Take group riding lessons placed by level, go to summer camp, or help with a schooling show
  fundraiser through the volunteer sign-up sheet. The stable also runs Racehorse Restarts, which rehabilitates
  retired racehorses.
