summary: A community bike shop that teaches young people to repair bikes and lets them earn a bike by
  finishing a program. It also runs group rides for youth and open shop nights for adults.
what_you_do: Youth ages 8 to 18 learn repair by fixing a donated bike in Earn-a-Bike, or join Ride Club
  for after-school group rides. Adults can walk in to work on their own bikes with the shop's stands and
  tools, or take a four-week adult repair class.
