summary: A nonprofit community bike shop at 3939 Lancaster Avenue. It teaches people to ride and repair
  bikes, and sells refurbished bikes and parts to pay for free and low-cost classes.
what_you_do: Fix your own bike with the shop's tools during Bike Church or an open shop night, or join
  the youth program to learn repair.
