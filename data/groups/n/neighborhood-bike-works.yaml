first_step:
  how: Fill in the Youth Programs Interest Form on the group's website, then sign up for the next Earn-a-Bike
    or Ride Club session.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: Earn-a-Bike teaches repair from the start for ages 8 to 18 and begins with an interest form,
    and the adult Bike Church takes walk-ins with no reservation; Ride Club needs riding skill first.
  what_to_expect: Earn-a-Bike and Ride Club meet two afternoons a week, Monday and Wednesday or Tuesday
    and Thursday, from 4 to 6 pm. Adults can walk in to Bike Church on Tuesday or Thursday evenings, where
    volunteers help diagnose and fix problems on your own bike.
  first_visit_tips:
  - Ride Club asks that you can ride 20 minutes without a stop, and students need 75% attendance to graduate.
  - Bring the bike you want to work on to an adult open shop night.
  - The Saturday Youth Drop-In is for program graduates, so start with the interest form.
  - The shop is at 3939 Lancaster Avenue, zip 19104. The site does not give transit or parking details.
