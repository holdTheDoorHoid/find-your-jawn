schedule:
  text: Youth programs meet Monday to Thursday, 4 to 6 pm, in sessions. Adults can drop in on Tuesday,
    Thursday and Friday afternoons, on Tuesday and Thursday evenings for Bike Church, and on Wednesday
    evenings at a shift limited to women, trans and nonbinary people.
