summary: North of Washington Avenue Coalition is a Registered Community Organization (RCO) in the South
  part of the city. The City asks developers to talk with RCOs about nearby zoning and building plans,
  so this is a way for neighbors to have a say.
what_you_do: The coalition works on affordable housing, zoning, parking, and utility and tax issues for
  the area, with a goal of development that does not push out current residents. Neighbors can sign its
  petition and read its conservation overlay report and proposed guidelines.
