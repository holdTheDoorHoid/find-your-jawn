  newcomer_friendliness: 2
  basis: The site welcomes people of any background, but it gives no meeting dates, places or join steps;
    the way in is a phone call, a Facebook group, or a website account form.
  what_to_expect: The site does not describe a first visit. From the About page, the core work is a town
    watch in which volunteers patrol streets, check on local businesses, and share information. The group
    also holds information meetings on local programs and laws and helps residents with limited English
    reach local services. The site does not say what taking part costs, though it asks for donations.
  first_visit_tips:
  - Call first, since the site lists no meeting times or places.
  - Ask whether a town watch patrol or an information meeting is the best first step for you.
