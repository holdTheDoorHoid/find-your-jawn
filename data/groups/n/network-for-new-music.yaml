first_step:
  how: Choose a program from the current season on the group's website and check its listing for tickets.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Concerts are open to the public and listed by season, which is a clear way in, though the site
    shows no path beyond attending.
  what_to_expect: The site lists programs by name, such as Crossfade and Schoenberg in Hi-Fi, without
    dates on the pages read. It does not say how long a concert runs or what tickets cost. The double
    bass call is a separate project with paid positions.
  first_visit_tips:
  - Look for the program you want on the season page before you buy anything.
  - If you play double bass, ask about the yearly ensemble by email through the education contact on the
    education page.
  - Check the ticket listing for the price, since the site does not show it on the pages read.
