summary: A Philadelphia ensemble that performs and commissions new contemporary music. It also runs school
  workshops and a yearly double bass ensemble that includes hobbyist players.
what_you_do: Attend concerts in the season, or join the yearly double bass performance, which includes
  professional, student and hobbyist players and has a call for paid bassists. The group also takes gifts
  to its annual fund and commissioning fund.
