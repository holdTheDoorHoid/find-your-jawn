first_step:
  how: Call 215-893-8400 to ask about the next English class session, or register for a volunteer shift
    through the link on the volunteer page.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: English classes start at beginner level and volunteer roles are open to the public, but classes
    charge $100 per session before you start and enrollment goes through a staff contact.
  what_to_expect: English classes meet in person at the Arch Street office on Mondays and Wednesdays from
    10 am to 12 pm for 10 weeks. Students are placed in one of six levels from beginner to advanced, and
    the page does not explain how placement works. The fee is $100 for the session and is paid when you
    register.
  first_visit_tips:
  - Ask how placement works and what to bring when you call, since the course page does not say.
  - Plan for the $100 session fee, which is paid at registration.
  - Fall 2026 classes started October 5, 2026, so ask when the next session begins.
  - Ask about building entry, elevators and parking before you come, since the site does not describe
    the building.
