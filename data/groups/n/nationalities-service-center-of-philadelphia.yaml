summary: A more than 100-year-old group that helps immigrants and refugees in Greater Philadelphia with
  English classes, legal help, health services and youth programs. Volunteers help with classes, the food
  pantry, events and home setup for newly arrived refugees.
what_you_do: Take an in-person English class, or volunteer to teach English, help the food pantry, help
  at events, or set up homes for newly arrived refugees. Groups from schools, congregations or businesses
  can also help with home setup and donation drives.
