first_step:
  how: Click Join on the Join Us page to become a member for $50 a year, then sign up for the next Zoom
    meeting or workshop.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The homepage says all skill levels are welcome and the Join button is clear, but the join page
    lists free meeting access as a member perk, so a first look may need the $50 membership.
  what_to_expect: Regular meetings and workshops run on Zoom, and members can take in-person workshops
    that the guild arranges during the year. Several in-person events named on the site are in other states,
    so check each event's location before you plan to attend. The site does not say how long a meeting
    runs or who usually attends.
  first_visit_tips:
  - Ask on the contact form whether non-members can join the Zoom meetings before you pay the $50.
  - Membership renews each year on its own, so cancel before the renewal date if you do not want to keep
    it.
  - Check the Upcoming Events page for registration links before each meeting.
