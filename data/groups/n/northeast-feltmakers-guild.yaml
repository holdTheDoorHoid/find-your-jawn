summary: A volunteer-run guild for people who make felt, at every skill level. It holds meetings and workshops
  on Zoom, and members get a learning library, in-person workshops, and a yearly retreat.
what_you_do: Become a member for $50 a year to get meetings, online programs, subsidized workshops, and
  retreat access, or volunteer on one of the guild's committees.
