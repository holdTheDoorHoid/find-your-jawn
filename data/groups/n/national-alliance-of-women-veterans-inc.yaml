first_step:
  how: Email info@nawvinc.org or use the contact form to ask about volunteering, sponsoring, or the October
    24, 2026 tribute, and register through the link on the group's site.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Women veterans are members by default and the site invites volunteers and sponsors, but it does
    not describe a newcomer program or orientation.
  what_to_expect: 'The October 24, 2026 tribute is a daytime event: breakfast, networking, and registration
    from 9 to 11 am, a panel and lunch from 11 to 2, and a ceremony at 3:45. Partners named on the page
    include a veterans home and the Philadelphia VA. The page lists no attendance fee.'
  first_visit_tips:
  - Arrive at 9 am if you want breakfast and time to register.
  - The page says registration is open until October 10 but gives no year, so check the registration link
    for the exact deadline.
  - Ask the group about parking, transit, and accessibility, since the page does not describe them.
