summary: A group that speaks up for women who served in the military. It runs learning, healing, and empowerment
  work, paying special attention to women who were hurt by military sexual trauma. Women veterans can
  join, volunteer, or sponsor the work.
what_you_do: Women veterans are members by default. You can volunteer, sponsor the work, or register for
  the 20th Anniversary Tribute on October 24, 2026.
