summary: A volunteer group fighting hunger and food waste in Philadelphia. Volunteers sort donated food,
  pack grocery bags for neighbors, and drive meals to older and disabled residents.
what_you_do: Help in the warehouse by receiving, storing and checking the dates on donated food (lifting
  up to 50 pounds), pack grocery bags, help with office tasks, or drive meals to seniors and disabled
  neighbors. Drivers need a valid driver's license and up-to-date car insurance.
