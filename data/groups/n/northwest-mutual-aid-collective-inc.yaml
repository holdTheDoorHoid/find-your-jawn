first_step:
  how: Call 484-640-2792 or email info@northwestmutualaidcollective.org and ask about the roles on the
    volunteer page. The warehouse does not accept mail, so ask there for the mailing address.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: Roles and contact details are public, but the site gives no sign-up steps, shift times, training
    or orientation, so the way in is unclear.
  what_to_expect: 'The site lists four kinds of help: warehouse work that includes receiving and storing
    donated food, bag packing, office tasks, and driving meals to homes. Warehouse work can include lifting
    up to 50 pounds. The site does not describe shifts, training or a first day, so ask the group what
    a first visit looks like.'
  first_visit_tips:
  - Driving roles need a valid driver's license and up-to-date car insurance.
  - Warehouse roles can include lifting up to 50 pounds, so check that it fits you.
  - Call or email first, since the warehouse does not take mail and the site does not describe how new
    volunteers start.
