first_step:
  how: Read the membership terms on the Auditions page, then email manager@nashirah.org to book an audition
    time. Auditions are by appointment, in person or online.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Joining requires an audition booked by email and confirmed by the artistic staff, and the site
    does not show a way to try a rehearsal first.
  what_to_expect: The audition is by appointment, in person or online, and singers are checked on sight-reading,
    memory for pitch, rhythm, range, and blend. The page does not say how long an audition lasts or what
    it costs. Arrive at least 15 minutes before your time.
  first_visit_tips:
  - Read the membership terms before you book, since applicants are asked to be able to meet them.
  - Arrive at least 15 minutes before your audition time.
  - Practice sight-reading and your vocal range, since those are what the staff listen for.
