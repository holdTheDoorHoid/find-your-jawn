summary: An auditioned community choir that sings the full range of Jewish choral music for audiences
  in the Philadelphia area. New singers join by audition, and the site shows an audition poster for the
  2026 to 2027 season.
what_you_do: Audition to join, then sing in rehearsals and perform in concerts. The site lists its concerts
  by date, but it did not show ticket prices or rehearsal times.
