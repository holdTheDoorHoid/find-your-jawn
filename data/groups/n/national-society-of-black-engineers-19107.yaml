first_step:
  how: 'Attend a chapter event as a guest, or join: pay the $30 chapter dues, fill in the chapter membership
    form, then set up a national profile and pay the $70 national dues, choosing the Greater Philadelphia
    Chapter.'
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The chapter says non-members can attend chapter events and meetings before they join, and the
    membership steps and dues are posted. The events page listed no dated events when checked.
  what_to_expect: Non-members can attend chapter events and meetings before they join. Event dates were
    not listed on the events page when we checked, and event prices are not posted, so ask first. Membership
    is open to people with STEM degrees and to people who support the mission.
  first_visit_tips:
  - Email info@nsbephilly.org to ask about the next chapter event and whether there is a charge.
  - If you join, choose the Greater Philadelphia Chapter when you set up your national profile.
  - Graduating undergraduate seniors get their first professional year of membership free.
