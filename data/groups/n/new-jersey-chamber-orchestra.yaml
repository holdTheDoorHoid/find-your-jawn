  newcomer_friendliness: 3
  basis: Concerts are public and tickets are sold through a clear link, but the site does not describe
    any way for local players to take part.
  what_to_expect: Expect a professional orchestra playing a set program, often with guest soloists, some
    from The Philadelphia Orchestra. The group describes its concerts as intimate and informal, and it
    can play in smaller venues with about ten musicians. The pages read do not give concert length or
    ticket prices.
  first_visit_tips:
  - Check the concert list on the site for the date and venue before you buy.
  - Buy tickets through the group's ticket link, since the site does not say whether tickets are sold
    at the door.
  - Ask about parking, transit, and accessibility, since the site does not describe them.
