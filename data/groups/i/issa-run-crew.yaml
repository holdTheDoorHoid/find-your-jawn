first_step:
  how: Show up at Monday Night Therapy at Whole Foods, 2101 Pennsylvania Ave, by 5:45 pm. No sign up is
    needed.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The FAQ says anyone can come, speed does not matter, and there is no sign up. The group welcomes
    slower runners but names no beginner program, so this is a 4, not a 5.
  what_to_expect: Monday's run is an easy 3.1 miles at a group pace. Thursday is a track session at Temple,
    with paces that vary, and Saturday runs start at 8 am from Lloyd Hall with coffee and donuts afterward.
    The site does not list a cost, and no sign up is needed.
  first_visit_tips:
  - Meet at Whole Foods, 2101 Pennsylvania Ave, by 5:45 pm for the Monday run that starts at 6 pm.
  - Thursday track sessions meet at the Temple Sports Complex, 1300 Master St. The run starts at 6:30
    pm.
  - Saturday runs start at 8 am at Lloyd Hall, 1 Boathouse Row.
  - The site does not say what to wear or bring, or give parking or transit, so email the group before
    your first run.
