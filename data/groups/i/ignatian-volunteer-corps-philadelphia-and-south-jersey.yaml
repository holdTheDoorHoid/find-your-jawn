summary: Adults 50 and older give one or two days a week, September through June, to Philadelphia nonprofits
  that serve people in need, with monthly reflection gatherings.
what_you_do: Serve on site with a partner nonprofit in areas such as housing, food, tutoring, support
  for immigrants, and elder care, and join monthly reflection sessions with other volunteers.
