first_step:
  how: Fill out the interest form on the IVC Philadelphia page, or email the regional office. Then you
    talk with the regional director about your background and availability, and IVC finds a partner nonprofit
    that fits.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: An interest form, a conversation, and a match come before you start serving, so the way in takes
    several steps.
  what_to_expect: The first step is a conversation about your background, interests, and how many days
    a week you can give. Once matched, you serve one or two days a week at a nonprofit partner, usually
    September through June. Many members stay for several years, and you also join monthly reflection
    gatherings with other volunteers.
  first_visit_tips:
  - Think about which days of the week you can give before you talk with the office.
  - Ask the office when and where the monthly gatherings meet, since the site does not say.
  - Ask about transportation to the partner site, since the site does not describe it.
