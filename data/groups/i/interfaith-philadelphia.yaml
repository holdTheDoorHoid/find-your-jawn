  basis: Each public event has its own registration link and the newsletter form is open to anyone, so
    a newcomer has a clear way in.
  what_to_expect: Public events are talks, classes and community walks, and many are held in person at
    Philadelphia sites such as the Arch Street Meeting House or the Rosenbach. Some are virtual, and a
    few are held as online courses. Costs and how long each event runs are listed on its own registration
    page, which we did not check one by one.
  first_visit_tips:
  - Check whether an event is virtual or in person before you register
  - Ask about the sliding fee page if cost is a concern
  - Sign up for the newsletter to hear about new events as they are posted
