summary: Philanthropic partner to Independence National Historical Park. It raises money for restoration
  and public projects, runs public talks, movie nights and tours, and uses volunteers for tours and events.
what_you_do: Lead free summer Twilight Tours, help staff events such as the Pops on Independence concert
  and the annual meeting, or help in the office. The public can attend talks, movie nights, Halloween
  events and tours.
