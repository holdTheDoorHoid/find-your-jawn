first_step:
  how: Join a free Twilight Tour, which needs no reservation. Meet next to the Liberty Bell Center viewing
    window, across from Independence Hall, near Chestnut Street.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Twilight Tours are free, need no reservation, and are open to visitors and locals. Volunteer
    roles need an email or form, and the page does not say what training is given or who may volunteer.
  what_to_expect: A Twilight Tour is about an hour on foot, led by a local guide who designs the route
    and theme, past sites such as Independence Hall and the Liberty Bell. Tours start at 5:15 pm each
    day, with a 6 pm tour too on Thursday to Sunday. Volunteers help lead tours, staff events, or do office
    work, and the page does not describe training.
  first_visit_tips:
  - Arrive a few minutes early to find the group by the Liberty Bell Center viewing window.
  - Check the Twilight Tours page for the current season, since the tours run only for part of the year.
  - To ask about volunteer roles, email attn@inht.org or call 215-861-4971.
