cost:
  level: low
  text: Beginner classes cost $5 per class for new Mainstream dancers and members, and $7 for non-members.
    Most Saturday dances cost $10 per session, or $15 for a two-session event. Open houses are usually
    $5. Club dues of $45 cover June 1, 2026 to May 31, 2027, and first-time Mainstream dancers do not
    owe dues. Reduced admission is available by confidential application.
