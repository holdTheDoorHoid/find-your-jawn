summary: A square dance club for LGBTQ+ dancers in Philadelphia. Members dance modern Western square dance,
  and you change partners with each tip, so you can come without a partner.
what_you_do: Take a beginner class in the fall, come to a summer open house, or join the Tuesday evening
  classes and dances. Saturday dances run at several levels, so check the dance schedule before you go.
