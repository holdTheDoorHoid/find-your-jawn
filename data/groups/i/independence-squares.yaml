first_step:
  how: Come to a Tuesday beginner (Mainstream) class at 2111 Sansom St at 7 pm. No partner is needed.
    You join a set when the music starts and change partners as you go. Pay $5 at the class.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: Beginner classes run each fall for people new to square dancing, first-time Mainstream dancers
    do not owe dues, and no partner is needed. The page does not say whether the Saturday dances suit
    beginners.
  what_to_expect: A Tuesday class runs 7 to 9:30 pm, led by callers, and it alternates between Week A
    and Week B. You do not need a partner. Wear what you like, such as jeans and a t-shirt. First-time
    Mainstream dancers do not owe club dues, but each class is $5.
  first_visit_tips:
  - Arrive a few minutes early and use the back entrance at 2111 Sansom St.
  - A nearby garage offers discounted parking. Ask at check-in for the QR code.
  - Bring a snack to share, as the club suggests.
  - Wear comfortable clothes, such as jeans and a t-shirt.
