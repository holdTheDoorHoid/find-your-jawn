first_step:
  how: Email ivyhillsaints2018@gmail.com to ask which fall or winter 2026 program is open, since the registration
    page's Google form covers the 2025 to 2026 spring season.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Registration is through a Google form or a paper copy, but the site does not say how tryouts,
    team placement or new players are handled.
  what_to_expect: Each player is registered on a form, and families may be asked for paperwork such as
    a birth certificate or a school profile. Once a player is registered, the club places them on a team
    for its season, and the league calendar is posted on the site. The site does not name a practice field,
    so ask where to show up before the first practice.
  first_visit_tips:
  - If you prefer paper, print the registration form and bring it to the field to fill out before a workout.
  - Ask which field and practice time apply, since the site does not say.
