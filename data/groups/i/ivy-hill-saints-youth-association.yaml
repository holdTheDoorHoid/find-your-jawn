summary: A community youth athletic association founded in 1966, according to its site. It fields youth
  football teams, 12U and 14U in 2025, and posted NESAC schedules for its 12U and 13U teams in September
  2025. It is also looking for a cheerleading coordinator.
what_you_do: Kids register for a season through the registration page, then join a team. The club also
  has a volunteer page where people can share their interests, and a page for its open cheerleading coordinator
  role.
