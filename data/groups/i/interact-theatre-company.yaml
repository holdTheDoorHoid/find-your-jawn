summary: A Philadelphia theater company that develops and stages new and contemporary plays at The Drake,
  and takes in new scripts from playwrights.
what_you_do: Buy single tickets or a season subscription to see the plays, join the mailing list for show
  news, or submit a script. The company also offers post-performance talk backs and free public convenings
  and symposia. The site lists no volunteer or usher roles.
