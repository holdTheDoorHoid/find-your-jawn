first_step:
  how: Call 215-338-3120 or fill out the Student Interest Form on the website. New students then take
    a placement test and book an in-person appointment.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: 'The about page says learners at every stage of English are welcome, and the classes page lays
    out the steps: an interest form or a call, a placement test, then an in-person appointment.'
  what_to_expect: New students take a placement test that sets a level from Basic up to Intermediate.
    Classes are small, with 5 to 20 students, and meet on weekday mornings or evenings. The site does
    not say what the placement test covers, how long it takes, or what classes cost.
  first_visit_tips:
  - 'Call during office hours: Monday to Thursday, 8:30 am to 1 pm, or 6:15 to 8 pm. The office is closed
    Friday to Sunday.'
  - Ask about fees and the placement test on the phone, since the website does not state them.
  - The site gives no bus, train or parking details, so ask about getting there when you call.
