first_step:
  how: Come to a Sunday Mass at 7:30, 9:30 or 11:30 am, or call the parish office at 215-483-1000 to ask
    about classes or set up a visit with the pastor.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The welcome page greets new members and invites them to contact the pastor for a home visit,
    and Mass is open to anyone at the posted times.
  what_to_expect: Mass is open to anyone at the posted times. The church was built in 1965 and seats about
    1,000 people. The site does not say how long Mass lasts or what visitors do, so the parish office
    is the best place to ask.
  first_visit_tips:
  - Weekday Mass is in the Chapel at 8:30 am, except on Wednesdays during the school year, when it is
    in the church.
  - The rectory is open Monday to Friday, 9 am to 4 pm. Call first if you want to meet the pastor.
  - For religious education in grades 1 to 7, new students need a baptismal certificate to register.
