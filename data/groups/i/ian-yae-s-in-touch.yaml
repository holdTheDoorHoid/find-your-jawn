first_step:
  how: Call 267-254-9531 or use the contact form on the site to ask how to volunteer with street outreach
    or at the Community H.U.B.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: Meal and haircut times are listed, but the site does not say whether you sign up or walk in.
    Volunteering goes through a contact form or a phone call.
  what_to_expect: The Tuesday community meal is served outdoors at 20th and Race Streets, and a 2023 news
    item says it has run for more than ten years and draws about 75 people. With the meal, people can
    get clothing, personal care items, and referrals to housing, other meal sites and job information.
    The site does not say how long a meal lasts or whether you can just come.
  first_visit_tips:
  - Plan to be at 20th and Race Streets by 6:30 pm on a Tuesday, the listed start time.
  - Dress for the weather, since the meal is outdoors and goes ahead in any weather.
  - Call before you come if you want to volunteer, since the site does not say what volunteers do at meals.
