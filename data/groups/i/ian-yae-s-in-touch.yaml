summary: A nonprofit that helps people experiencing homelessness and families in underserved neighborhoods.
  Its Community H.U.B. offers meals, a clothing closet, a food pantry, haircuts, and computer use, and
  volunteers help with year-round street outreach.
what_you_do: Volunteer with the street outreach team, which works in all four seasons, or ask about helping
  at the Community H.U.B. The group also runs a weekly meal on Tuesday evenings.
