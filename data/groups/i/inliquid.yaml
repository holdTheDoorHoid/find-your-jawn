summary: A Philadelphia art group with a gallery at Crane Arts that shows local artists' work, runs an
  online magazine and posts calls for artists.
what_you_do: Visit the gallery Wednesday to Saturday, come to artist receptions (RSVP through the links
  on the site), apply for artist membership, or submit work to its calls for artists. The site also lists
  workshop calls, such as a Saturday glassblowing workshop, and no volunteer roles.
