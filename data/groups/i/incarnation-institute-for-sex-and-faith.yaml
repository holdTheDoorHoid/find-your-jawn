first_step:
  how: Use the Click To Sign Up button on the Events page to join a webinar or event. For the educator
    training, complete the online application form, then email two references and your essay to admin@incarnationinstitute.org.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Events have a public sign up button and no application is shown for them. The educator training
    needs an application, two references, an essay, a deposit and a phone interview, so it is not a walk
    in.
  what_to_expect: The Events page shows only a season, not a day, time, or format. The educator training
    is a course of weekly readings, videos, and assigned projects, with preparation due before each session.
    Accepted applicants have a phone interview.
  first_visit_tips:
  - Check the day, time, and format on the sign up page before you register, since the Events page shows
    only a season.
  - For the educator training, prepare two references and a 300 to 500 word essay before you apply.
  - The site says the group does not turn away people who cannot pay, so ask about financial help before
    you decide.
