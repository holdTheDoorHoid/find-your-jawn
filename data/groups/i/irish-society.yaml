first_step:
  how: Buy a ticket to a public event on the calendar, such as the Toast to Saint Patrick or the awards
    dinner, which were open to the public. To ask about attending as a non-member, or to join, email info@theirishsociety.com.
  drop_in: false
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Several events are open to the public with a ticket, and membership has a clear application.
    The site does not say whether non-members can attend general meetings, and new members need a sponsor
    from a current member.
  what_to_expect: Events are mostly dinners, speaker meetings and happy hours, many held at the Ashburner
    Inn. Public dinners such as the Toast to Saint Patrick and the awards dinner need a ticket, while
    Christmas parties are for members and one guest. The pages do not say how long events run, so ask
    before you go.
  first_visit_tips:
  - Check the calendar for public events, since the Christmas party is limited to members and a guest.
  - Email the group before the event to ask whether a non-member can attend.
