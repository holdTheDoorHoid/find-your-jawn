first_step:
  how: Check the events page for the next show, then email christina@internationalballet.org or call 215-849-7950
    to ask whether your child's school has the 30-week course.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: Public shows welcome all ages and some need a ticket, but the site does not say how students
    join the 30-week course or where tickets are sold, so the way in is unclear.
  what_to_expect: Public events are story ballets or student showcases, with casts that mix students and
    professional dancers. The December Winter's Dream shows ran two performances, at 1 PM and 7 PM, and
    the 2023 tickets were $25 each with free parking. The 30-week course is free for students at partner
    schools, and the site lists no prices for anything else.
  first_visit_tips:
  - Read the event page for ticket prices, since some shows charged for tickets.
  - 'Buy early if you can: a 2021 listing said seating was limited.'
  - Parking was free at the Teatro Esperanza shows listed for 2022 and 2023.
