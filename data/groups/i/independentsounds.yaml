summary: A festival of opera and instrumental music that started in Philadelphia in 2023. Shows run an
  hour or less, and voice students of all levels can perform onstage with professional singers and an
  orchestra.
what_you_do: Buy tickets to see the festival's performances, or join the email list to hear when the next
  season opens. Voice students can perform with the festival, though the site does not say how to sign
  up.
