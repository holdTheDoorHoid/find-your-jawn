first_step:
  how: Join the email list on the site to hear when the next festival season opens, then buy a ticket
    for a performance.
  drop_in: false
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The about page says the shows are aimed at first-time audiences as well as longtime fans, and
    the home page offers a ticket purchase and an email list as ways in.
  what_to_expect: Each show is one hour or less, and foreign-language productions include English translations.
    You buy a ticket for one performance, and the venue changes from year to year, so check the address
    on your ticket. Ticket prices are not listed on the pages we could read, so check the sales page before
    you go.
  first_visit_tips:
  - Some past shows were held in private homes, with the address given only on the ticket after purchase.
  - If you sing and want to perform, ask the festival directly, since the site does not describe how voice
    students apply.
