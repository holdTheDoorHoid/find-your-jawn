summary: A club for fly anglers and fly tiers from around the Delaware Valley. Members learn casting,
  fly tying and fishing, go on day and multi-day fishing trips, and take part in conservation and education
  work.
what_you_do: Come to a monthly meeting as a guest, take a beginner fly fishing or fly tying class, or
  join to get the newsletter, member classes and trips.
