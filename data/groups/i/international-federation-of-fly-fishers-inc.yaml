schedule:
  text: Monthly meetings at 7 pm on the second Thursday at the Churchville Nature Center. There is no
    December meeting, because a holiday party takes its place. Beginner fly fishing (three sessions) and
    beginner fly tying (about six weeks) are offered through the club.
