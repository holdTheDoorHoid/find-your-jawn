first_step:
  how: Come to the second Thursday meeting at 7 pm at Churchville Nature Center as a guest, or sign up
    for the Beginner Fly Fishing or Beginner Fly Tying class.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 5
  basis: The club runs beginner fly fishing and fly tying classes and welcomes guests at its monthly meeting,
    which has a guest speaker.
  what_to_expect: Monthly meetings include a guest speaker, refreshments and sometimes a raffle, and doors
    have opened at 6:30 pm. Beginner fly tying runs about six weeks and covers the vise, tools and simple
    flies, while beginner fly fishing covers gear, knots, fish habitat and first casts. Dues and class
    fees are not posted, so ask the club before you sign up.
  first_visit_tips:
  - Plan to arrive by 6:30 pm, when doors have opened for past meetings.
  - Plan a drive, since the meeting place is in Churchville, outside Philadelphia.
  - Ask about the guest fee before you go, since one 2025 meeting charged non-members $10.
