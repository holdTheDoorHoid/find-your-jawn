first_step:
  how: Pick the studio for your child's class on the Rates and Registration page, then sign up on that
    studio's 2026 to 27 registration page. Signing up by October 30, 2026 takes 5 percent off the $100
    fee. You can also email the studio about financial aid first.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: Beginner youth classes are listed for ages 3 and up, adult classes welcome any experience level,
    and the site names camps, birthday parties, and financial aid as ways to start.
  what_to_expect: Youth classes are grouped by age and skill. Beginner classes are open to sign up, while
    intermediate, advanced, and performance classes are by invitation or after you contact the studio.
    Adult classes at 2100 Chestnut welcome people of any experience level. The site does not list class
    length or whether a trial class is offered.
  first_visit_tips:
  - Sign up by October 30, 2026 for 5 percent off the $100 fee.
  - Ask about financial aid or the sibling discount before you register, since the site lists both.
  - Confirm the studio address before you go. The Range of Motion registration link names 812 Chestnut,
    while its after school page lists 2100 Chestnut.
