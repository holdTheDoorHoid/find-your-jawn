summary: A hip hop dance school for kids and teens, ages 3 and up, with two studios on Chestnut Street.
  It teaches hip hop dance and music, runs after school pick up programs, and offers camps, sibling discounts,
  and financial aid.
what_you_do: Sign kids up for dance, music, or after school classes, or ask about financial aid. Range
  of Motion on Chestnut Street also teaches parkour and martial arts, and adult classes meet at 2100 Chestnut.
