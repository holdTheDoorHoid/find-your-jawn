summary: A Philadelphia group that teaches money and investing skills to people in low-income and underserved
  communities. Its weekly investment club meets on Zoom, and it keeps an archive of past club meetings.
what_you_do: Join the Thursday 6 pm Eastern investment club on Zoom, or book a one on one appointment
  through the site. Past club meetings are listed in the Meeting Library, which the site says is still
  being built.
