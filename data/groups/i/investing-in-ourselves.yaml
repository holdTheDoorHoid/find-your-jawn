  basis: The club is open to the public on Zoom with a join link on the site, and past meetings are listed
    for people who cannot attend live. The site does not say whether beginners are specifically welcome.
  what_to_expect: A Thursday meeting runs on Zoom at 6 pm Eastern. Members learn together about markets
    and money, and the site shares a weekly market and trends download. The services are free, according
    to the group. The page does not say how long a meeting runs or whether you will be asked to speak.
  first_visit_tips:
  - Test your Zoom connection a few minutes before 6 pm Eastern.
  - The Meeting Library is still being built, so only some past meetings are listed there as a preview.
