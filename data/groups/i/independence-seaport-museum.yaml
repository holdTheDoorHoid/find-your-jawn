summary: A museum at 211 S. Columbus Blvd with historic ships and boats. Its docent program trains volunteers
  to lead tours of the museum and its ships, but it is not taking new applications right now.
what_you_do: Docents lead tours of the museum and its historic ships, help with education programs, and
  welcome guests at special events. Other volunteer areas on the site are helping restore the historic
  ships Olympia and Becuna, working in the J. Welles Henderson Research Center, and assisting master boat
  builders at the Seaport Boat Shop.
