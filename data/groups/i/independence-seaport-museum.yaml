  basis: The volunteer page says the museum is at maximum capacity for volunteers and is not accepting
    applications, so there is no open way in right now.
  what_to_expect: Docent applications are closed, so there is no volunteer first visit to plan right now.
    If the program reopens, expect a free online Pennsylvania background check and child abuse clearance
    before your first day, then four required training sessions in late February and early March. The
    museum itself is open Thursday through Tuesday, 10 am to 5 pm, with the last entry at 4:30 pm and
    closed on Wednesdays.
  first_visit_tips:
  - Start the Pennsylvania background check and child abuse clearance early, since both must be received
    before your first day, with no exceptions.
  - Clearances obtained in Pennsylvania within the last 12 months are accepted.
  - The museum is closed on Wednesdays and the last entry is at 4:30 pm, so plan your visit around those
    times.
