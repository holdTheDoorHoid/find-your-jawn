  newcomer_friendliness: 4
  basis: The club says its programs run from beginners to competitive players and explains how to register
    through its dashboard. The pages I could read do not describe the beginner group in detail.
  what_to_expect: 'Programs are grouped by age: the older site lists a toddler and kids program for ages
    2 to 4, an intramural program for ages 5 to 15, and an academy for ages 5 to 7. The listed field is
    Edgely Field, but the site does not give practice times, season dates or fees. Ask the club which
    team fits a new player before you register.'
  first_visit_tips:
  - Make your Sprocket account before you try to register, since the site says one is required.
  - A Spanish version of the tryout information is on the club's site.
