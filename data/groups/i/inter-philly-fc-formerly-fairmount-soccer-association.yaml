summary: A youth soccer club formed by merging Fairmount Soccer Association with two other Philadelphia
  clubs. It has programs from beginner to competitive play, plus travel tryouts, and the site lists players
  born 2014 through 2023 as eligible.
what_you_do: Players register through the club's online dashboard and join fall or travel teams. The older
  site lists toddler, intramural and academy programs by age, and Edgely Field is the listed field.
