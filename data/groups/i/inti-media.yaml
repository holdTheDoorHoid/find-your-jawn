summary: A media organization that makes news, films and podcasts with a focus on Black and Latin American
  communities. Its news sections are in English, Spanish and Portuguese, and community members can pitch
  story ideas.
what_you_do: Volunteer to help with stories, pitch a story idea, attend a community pitch meeting, or
  sign up for the monthly newsletter. You can also come to community events such as a Spanish-language
  film club and a monthly Afro-Latin dance lesson and social.
