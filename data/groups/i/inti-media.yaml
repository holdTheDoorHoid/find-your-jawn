first_step:
  how: Come to the monthly Sunday dance lesson and social at the Mercado Latino at FDR Park, or email
    production@intimedia.org to offer help or pitch a story.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The dance is free with no RSVP, and the site gives an email address for volunteering and story
    pitches. The site describes no training for new volunteers.
  what_to_expect: The monthly Sunday dance starts with a one-hour lesson, then becomes a social until
    4 pm, and it is free with no RSVP. The site says the dance is open to LGBTQ+ people. Community pitch
    meetings are held each season and are open to everyone.
  first_visit_tips:
  - Ask the group for the exact meeting spot at the Mercado Latino at FDR Park, since the events page
    gives no street address.
  - Email production@intimedia.org to offer a story idea; the site does not describe what a pitch should
    include.
