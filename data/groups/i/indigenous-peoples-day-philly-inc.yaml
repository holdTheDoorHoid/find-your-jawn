  basis: The celebration is public, and volunteer roles are posted with an application form. The site
    gives no orientation or welcome steps for first-time volunteers.
  what_to_expect: The October celebration is held at Shackamaxon (Penn Treaty) Park, where the group has
    put it on since 2019. Volunteer roles run three to six months, from about two to six hours a week,
    and most are open to Indigenous Peoples and allies.
