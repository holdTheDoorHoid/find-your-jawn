summary: A Philadelphia nonprofit working to make Indigenous Peoples' Day a permanent city holiday. It
  holds a public celebration each October and runs cultural, educational and community-building programs.
what_you_do: Take one of the posted volunteer roles, such as a general volunteer, an internship, writing
  or design help, or a campaign assistant role. You can also attend the October celebration, subscribe
  to the newsletters, or join, donate, or sign the petition through the website.
