  basis: The site invites visitors to Sunday worship in person or on Zoom, and it gives an office phone
    and email for questions or a visit.
  what_to_expect: Services are held in person and on Zoom at the same time. The site does not say how
    long worship lasts, what to wear, or whether children have a separate program during the service.
    The office can answer those questions before you come.
  first_visit_tips:
  - Confirm the Sunday time with the office, since two church pages list different times.
  - The church has ramps, an elevator and an accessible restroom.
  - The site does not give a Zoom link, so ask the office for one if you plan to join online.
