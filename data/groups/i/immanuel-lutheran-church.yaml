summary: A Lutheran congregation in the Somerton area of Northeast Philadelphia that worships on Sundays
  in person and on Zoom. It also lists a German-language service and a Trunk or Treat.
what_you_do: Join Sunday worship in person or on Zoom, come to a listed event, or call the office to arrange
  a visit. The church also lists groups such as a German circle and a women's group, and the site does
  not say how to join them.
