summary: The Philadelphia chapter of the International Game Developers Association. It holds free monthly
  meetings where local game makers give talks, with networking time first. Meetings are in person at Drexel
  or online.
what_you_do: Attend a free monthly meeting with 30 minutes of networking, then talks by local developers.
  Join the chapter's Discord to hear about upcoming meetings.
