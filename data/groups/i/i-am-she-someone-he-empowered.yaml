first_step:
  how: Email info@iamshenikita.org or call 215-839-8165 to ask for the next Single By Design date, since
    registration for the August 2025 gathering was closed.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Events have a Details link or a registration step, and the site gives an email and a phone number,
    so the way in is clear. The August 2025 page says the gathering is for women going through relationship
    changes, such as divorce, widowhood, or separation.
  what_to_expect: The Single By Design gathering is on Zoom, starts at 7:30 pm, and runs every third Thursday
    of the month. The August 2025 page describes personal stories and lessons from other women's experiences
    of relationship change, with support and encouragement. The site does not say how long it lasts or
    whether it costs anything.
  first_visit_tips:
  - Ask by email or phone before the date, because the page does not state a time zone.
  - You need a computer or phone with internet to join the Zoom gathering.
  - Check the events page for the next date, since past gatherings show registration as closed.
