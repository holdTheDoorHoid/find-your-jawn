summary: A Philadelphia program that teaches FIBA 3x3 basketball to young people through clinics, camps
  and tournaments, including sessions at city recreation centers. It also trains and mentors basketball
  referees.
what_you_do: Kids and teens can take part in 3x3 clinics, camps and tournaments when they run. Adults
  can volunteer for check-in, court setup, scoring, youth support or media through the volunteer form
  on the site.
