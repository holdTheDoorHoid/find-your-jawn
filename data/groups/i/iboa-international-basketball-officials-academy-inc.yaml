first_step:
  how: Join the mailing list on the Contact page for notices about youth clinics and tournaments, or send
    the volunteer form from the Become a Volunteer page.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Youth programs are open to kids and teens, and the site has a mailing list and a volunteer form,
    but the steps to sign up for a clinic are not published.
  what_to_expect: Volunteers can help for a few hours or a full day. Roles include check-in, court setup,
    scoring, youth support and media, and the site says no experience is needed. Past tournaments were
    held at Pelbano Recreation Center, but the site does not say when clinics meet.
  first_visit_tips:
  - Ask whether volunteers who work with young people need background clearances, since the site does
    not say.
  - Email info@iboa3x3.com or call 267-268-9022 to ask about the next clinic or camp.
  - The academy office is at 2650 Welsh Road, and the site gives no bus, train or parking details.
