first_step:
  how: Use the contact form on the home page, or email support@irvinkellyfoundation.org, to ask about
    housing or career help. For a scholarship, complete the Scholarship Application linked on the scholarships
    page.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The housing and career help pages say details are coming soon, so there is no clear way in yet.
    The scholarship needs a written application with proof of a veteran connection.
  what_to_expect: This is an office that answers requests, not a group that meets. The site says it will
    respond to contact form messages as soon as possible, and the housing and career pages do not yet
    list eligibility, steps or cost. For the scholarship, the page asks for an application, proof of service
    connection, transcripts and recommendations, but it gives no deadline.
