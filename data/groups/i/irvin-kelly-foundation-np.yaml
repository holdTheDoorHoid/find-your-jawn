summary: A Philadelphia foundation for veterans moving back into civilian life. Its housing and career
  help pages say full details are coming soon, and it takes applications for scholarships for veterans'
  descendants.
what_you_do: Send a request through the contact form on the home page or by email to ask about housing
  or career help. For a scholarship, you complete the application and send proof of a veteran connection,
  transcripts and recommendations. The site does not list volunteer roles or events.
