first_step:
  how: Fill out the Baker Intake Form linked from the Become a Baker page, then accept the scheduling
    site invite and sign up for a baking shift.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: 'The Become a Baker page welcomes new bakers and lays out a two step way in: an intake form,
    then an invite to the scheduling site. A steering committee member reviews each form by hand, so the
    invite can take a day or two, sometimes longer.'
  what_to_expect: 'Before your first bake, expect a short sign up: the intake form, then an invite to
    the scheduling site. Bakers can be professionals or people baking at home, and every item must be
    labeled with its ingredients and allergens and a note that it was prepared in a home kitchen. The
    pages I could read do not say how long a shift takes, so ask the project before your first one.'
  first_visit_tips:
  - Watch the info session video on the project's website before you sign up for a shift.
  - 'Plan your own drop-off: the project does not arrange transport, though the RISE Fund may help with
    drop-off costs.'
  - If you cannot make a shift, cancel on the scheduling site and email the project. Within 2 weeks, find
    a replacement first and give at least 72 hours' notice.
  - Ask the project where and when to bring the goods, since the pages do not say.
