first_step:
  how: Email info@influencingaction.org to ask about the current student registration, or to ask how to
    become a mentor. Mentors finish their clearances before they are matched.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Students apply for a program year, and mentors must clear background and child abuse checks and
    fingerprinting before they are matched, so the way in is an application rather than a drop in.
  what_to_expect: A mentoring day runs from 5 to 7:30 pm and starts with dinner and networking. Students
    introduce themselves, write a short journal reflection, take a lesson, and fill in a feedback survey.
    Mentors keep in touch with their student at least once a week. The page lists no program fee.
  first_visit_tips:
  - 'Students: arrive by 6 pm, since arrivals after 6:01 pm are marked late.'
  - 'Mentors: start the clearances early, because they come before any match.'
  - Ask for the current year's registration, since the application link on the high school page is for
    an older year.
