summary: Working since 2011, this group matches high school students with mentors and runs workshops,
  seminars and youth conferences.
what_you_do: Students in grades 9 to 12 can apply to the mentoring program. Adults who want to mentor
  pass a background check, child abuse clearances and fingerprinting, then keep in touch with their student
  at least once a week. The group also offers workshops on topics such as public speaking and conflict
  resolution, and it holds a youth conference.
