summary: An artist collective that shows artists' work through exhibitions and film screenings, runs creative
  writing workshops with immigrant communities, and collects stories from people through a share form.
what_you_do: Send a story through the Share Your Story form, or email the collective to ask about showing
  work or screening a film. The group also runs creative writing workshops with immigrant communities
  in Philadelphia and other cities, and its site says workshop participants are paid for their time and
  creative work.
