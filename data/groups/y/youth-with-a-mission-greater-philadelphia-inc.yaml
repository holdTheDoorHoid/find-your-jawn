first_step:
  how: Fill in the Volunteer Sign-Up form for the Thursday Center City outreach, or email connect@ywamphiladelphia.org
    to ask how to join.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The site invites people to join the Thursday outreach, links a volunteer sign-up form, and gives
    an email address. It does not say beginners are welcome or whether a single visit is fine, so the
    rating stays at 3.
  what_to_expect: On a Thursday in Center City, volunteers work a table under a recognizable banner, listen
    to people who stop by, ask how they can pray for them, and pray with them. Volunteers come from many
    churches, and talk about faith often grows out of these conversations. The page does not say how long
    a shift runs or what to wear, so ask the team before your first Thursday.
  first_visit_tips:
  - Look for the recognizable banner at the Thursday Center City table.
  - When you reach out, send your name, your church or group if you have one, and the outreach you want
    to join.
  - Photos on the site show volunteers in red vests, but the page does not say that is required.
  - Call (412) 600-1096 or email connect@ywamphiladelphia.org with questions before you come.
