summary: A Christian mission group that offers free prayer in public places each week and does street
  outreach in the city. It also hosts short mission teams and helps churches take part.
what_you_do: Pray with people at the Thursday Center City outreach, join an outreach team, bring a church
  team to serve in the city, or take evangelism training at the Messenger School.
