first_step:
  how: Take one of the free practice tests the site offers, then open the Enroll Here page and fill out
    the enrollment form linked there.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Adults can start through a public enroll page and free practice tests, with no in person step
    listed. The site gives no prices, course length or start dates.
  what_to_expect: Courses are self-paced and run online on a computer, tablet or phone at any hour. The
    site describes tutoring, progress checks and one on one guidance. It does not say how long a course
    takes or what it costs, so check before you enroll.
  first_visit_tips:
  - Have a computer, tablet or phone with internet access ready before you start.
  - Take a free practice test first to see where you stand.
  - Ask about course length and fees before you enroll, since the site does not list them.
