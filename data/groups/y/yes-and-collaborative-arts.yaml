summary: A Philadelphia nonprofit that uses performing arts to build confidence, voice and community in
  children and teens from kindergarten through 12th grade. It runs fall to spring classes, summer camps,
  and Shadow Company, a year-round youth theater group for high schoolers.
what_you_do: Enroll a child in a fall to spring class or a summer camp, or have a high school student
  join Shadow Company at any time. Families can come to youth shows, and supporters can volunteer, sponsor
  or donate.
