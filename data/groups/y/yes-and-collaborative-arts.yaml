schedule:
  text: Classes run fall to spring. Silhouettes, a theater class for grades 5 to 8, meets monthly on Saturdays
    from 10 am to noon. Summer camps run each summer for grades K to 12. Shadow Company runs on a season
    from October through September, with monthly meetings for grades 9 to 12.
