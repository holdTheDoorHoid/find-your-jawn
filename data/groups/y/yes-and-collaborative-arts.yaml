first_step:
  how: Register a child for a class or camp through the online form linked on the program pages, or buy
    one Silhouettes drop-in day for $31.25. High school students can register for Shadow Company at any
    time through its year-round form.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Anyone can register online for a class, camp, or Shadow Company. The site does not offer a free
    trial class and does not say beginners are welcome, but a single Silhouettes day can be bought for
    $31.25.
  what_to_expect: Classes meet at the main building at 21 W Washington Lane, and sessions run from one
    to three hours. Kids work with professional artists on singing, dancing, improv and sketches, and
    the classes we read about end with a showing or showcase for family and friends. Shadow Company meets
    monthly, and the site does not mention an audition for members.
  first_visit_tips:
  - 'Ask about scholarships before you pay: lower tiers and full scholarships exist, but the scholarship
    page gives no application steps, so call or email the group.'
  - Plan to pay a deposit or the full fee when you register, since a spot is not held until you pay.
  - 'Check the refund rule first: no refunds within 5 days of the first session, or for missed sessions.'
