cost:
  level: paid
  text: Classes use a sliding scale, with listed direct costs of $160 to $365 per session, and lower tiers
    and full scholarships are available. One Silhouettes day can be bought alone for $31.25. Shadow Company
    has no fee. Camp prices are not listed on the site.
