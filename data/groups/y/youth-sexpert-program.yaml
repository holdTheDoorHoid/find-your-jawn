summary: A nonprofit that teaches high school age youth about sexual health, so they can learn accurate
  facts about sex, consent and staying healthy. The fall cohort meets online and covers body knowledge,
  birth control and reducing stigma around STIs.
what_you_do: Participants meet online for lessons on sexual health, consent and communication skills.
  Taking part does not require teaching classes or workshops for other students.
