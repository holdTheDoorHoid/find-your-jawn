summary: A Philadelphia nonprofit started in 2025 that teaches kids and teens money skills, business building,
  and leadership. It has worked with high schools and held a youth business fair.
what_you_do: Young people learn money skills, entrepreneurship and leadership through hands-on lessons
  and mentoring. The group reports helping more than 15 young people start businesses in 2025. Youth and
  families can use the Enroll Now form on the group's site, or email to ask about enrollment.
