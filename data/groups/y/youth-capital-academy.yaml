first_step:
  how: Click Enroll Now on youthcapitalacademy.org to open the enrollment form, or email info@youthcapitalacademy.org
    to ask about times and places.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Anyone can use the public enrollment form, but the site says spots are limited and does not say
    how they are filled.
  what_to_expect: Sessions are hands-on, with games, mentoring and business-building activities, and meals
    and snacks are served. Most programs meet one to two days a week for one to two hours at a time, and
    Purpose to Profit runs for 14 weeks. The site does not list meeting places or times, so ask before
    the first session.
  first_visit_tips:
  - Fill in the enrollment form early, since spots are limited.
  - Ask about times and the meeting place by email before you come.
  - Youth Diversion sessions take youth referred by schools, community groups or justice partners, so
    ask whether a referral is needed.
