summary: A Philadelphia nonprofit started in 2025 that teaches kids and teens money skills, business building,
  and leadership. It has worked with high schools and held a youth business fair.
what_you_do: Young people learn money skills, entrepreneurship and leadership, with mentoring; the group
  reports helping more than 15 young people start businesses in 2025. Families and students can use the
  contact form on the site to get involved or ask about enrollment.
