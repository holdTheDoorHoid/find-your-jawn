summary: A Black-led nonprofit that works with young people ages 15 to 24 in West and Southwest Philadelphia.
  It supports youth affected by violence and runs a weekday hangout, violence prevention work, and youth
  volunteer and work openings.
what_you_do: Stop by the hangout on a weekday afternoon or evening, or ask about volunteer and work openings.
  The group also publishes news and videos about youth issues.
