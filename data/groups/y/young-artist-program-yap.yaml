summary: A no-cost arts program that explores social justice through art-making for young people ages
  14 to 25 in Philadelphia. It is aimed at BIPOC LGBTQ+ youth and allies.
what_you_do: Apply through the form on the site, then join weekly studio sessions to make art with other
  young people.
