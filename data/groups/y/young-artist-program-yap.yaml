first_step:
  how: Fill in the application on the Google form linked from the Join page on theyap.org. Applications
    are taken all year.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: A free program with a public application form that is open all year. The site does not say whether
    art experience is needed.
  what_to_expect: Sessions run Wednesday to Friday from 4 to 6:30 pm during the school year, and once
    you have applied you can drop in. You make art with other young people, look at social justice ideas
    through your work, and sometimes join guest artist workshops and gallery visits. The program is free,
    and participants can also get food, art supplies and the chance to sell their artwork.
  first_visit_tips:
  - Apply first; the site lists no set deadline, so check the form for current dates.
  - The site gives no street address for the studio, so ask the group on Instagram before your first session.
  - Summer sessions run on a different schedule, shown only as images, so ask before June.
