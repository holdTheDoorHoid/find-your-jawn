first_step:
  how: Come to Unsilent Night on Friday, Dec 18, 2026 at 6 pm, a free walk around Rittenhouse Square,
    or email director@relache.org to ask about performing in a project.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The Unsilent Night listing says anyone can take part and needs no tickets. The site describes
    no join or audition process for performers, so the rating stays at 3.
  what_to_expect: Unsilent Night is a group performance of about 45 minutes, on foot through the streets
    around Rittenhouse Square. Each participant plays one of four digital tracks on a phone or device
    with speakers, and organizers help you download it before the countdown. Re | UNITE, the group's October
    concert at the Philadelphia Ethical Society, is ticketed and the site shows no price.
  first_visit_tips:
  - Bring a phone or other device with speakers for the Unsilent Night track.
  - Plan for more than 30 minutes of walking, including crossing city streets.
  - Buy Re | UNITE tickets through the ticket link on the group's site before the Oct 25 concert.
