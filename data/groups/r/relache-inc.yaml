first_step:
  how: Come to Unsilent Night, the free group walk around Rittenhouse Square (next listed for Friday,
    Dec 18, 2026 at 6 pm, meeting at the Guard House), or email director@relache.org to ask about performing
    in a project.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The Unsilent Night listing says anyone can take part at no cost and with no tickets. The site
    describes no audition or join process for performers, so the rating stays at 3.
  what_to_expect: Unsilent Night lasts about 45 minutes and is a group performance on foot through the
    streets around Rittenhouse Square. You play one of four recorded tracks on a phone or another device
    with speakers, and organizers help you download it before the countdown. Everyone presses play together
    when the countdown ends.
  first_visit_tips:
  - Bring a phone or other device with speakers. The page says a smartphone with external speakers works
    best.
  - Plan for over 30 minutes of walking, including crossing city streets.
  - Get there early enough to download a track before the countdown. The page gives no arrival time.
