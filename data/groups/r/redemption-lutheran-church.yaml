first_step:
  how: Come to Sunday worship at 10 am at 8001 Bustleton Avenue, or watch the livestream on Facebook or
    YouTube first.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The site says all are welcome, lists a weekly worship time and gives an office phone and email.
    It links to an 'I'm New' section whose contents we could not see, and it describes no newcomer program.
  what_to_expect: The site describes Sunday worship at 10 am, held in person at the corner of Bustleton
    and Rhawn and also livestreamed. It does not describe what happens after the service, dress, or whether
    there is a children's program. The church says it has been in the neighborhood for over 90 years.
  first_visit_tips:
  - Watch the livestream on Facebook or YouTube first if you want to see a service before you go.
  - Call the office Tuesday to Thursday, 8 am to 11 am, with questions about dress, children's programs
    or parking, since the site does not cover them.
  - Ask the office for the dates of the monthly service days and seasonal Bible study, because the site
    lists none.
