first_step:
  how: Come to a public open house at Ryan Observatory on a second Saturday evening. No registration is
    listed for open houses, and the events page shows the next dates. You can also join the mailing list
    through the contact page.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: Open houses are listed for all interested people with no registration shown, and the society
    says no experience is needed to attend (tier 1 read of its about page). Some events are members only.
  what_to_expect: Open houses start at 7:15 pm and run late into the evening, with a talk or themed program
    at the observatory. Ryan Observatory is in Muddy Run Park in Holtwood, outside the city, so plan your
    ride. The events page lists no price for open houses.
  first_visit_tips:
  - Check the events page the week before, since weather often changes or cancels observing nights.
  - The observatory is outside the city, so plan transport to Holtwood before you go.
  - Non-members pay for the beginner telescope workshop; members get it free.
