summary: An astronomy society founded in 1888 that runs public talks with guest speakers and keeps the
  public posted through a mailing list.
what_you_do: Come to a public open house at Ryan Observatory, usually on the second Saturday evening,
  or to one of the city nights at Columbus Recreation Center. Members get dark-sky observing, virtual
  access to the monthly meetings, and a free seat at the telescope workshop.
