first_step:
  how: Come to a public open house at Ryan Observatory on a second Saturday evening. The next one is Saturday,
    October 10, 2026, starting at 7:15 pm. No registration is listed for open houses, and the contact
    page offers a mailing list for updates.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: Open houses are public with no registration listed, the society says no experience is needed
    to attend, and it runs telescope workshops that non-members buy a ticket to.
  what_to_expect: Open houses run from 7:15 pm to about 10 pm, usually with a talk or themed program at
    the observatory. Observing nights depend on the weather, so check the events page before you go. The
    observatory is in Muddy Run Park in Holtwood, outside the city, so plan your ride ahead.
  first_visit_tips:
  - Check the events page the week before, since observing nights depend on the weather.
  - Plan transport to Holtwood, since the observatory is outside the city.
  - The telescope workshop is free for members and needs a ticket for non-members, so ask about it if
    you want hands-on learning.
