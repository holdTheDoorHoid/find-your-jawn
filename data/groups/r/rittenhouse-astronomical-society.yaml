summary: An astronomy society founded in 1888 that runs public talks with guest speakers and keeps the
  public posted through a mailing list.
what_you_do: Attend a public open house at Ryan Observatory, usually held on the second Saturday evening,
  or a public night at Columbus Recreation Center in the city. Members get observing nights, workshops
  and monthly Zoom meetings.
