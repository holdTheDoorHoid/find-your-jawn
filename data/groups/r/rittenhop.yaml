first_step:
  how: Go to Rittenhouse Square on a Sunday between 1 and 3:30 pm, look for the bench with the goat statue
    in the southwest corner, and join in.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Free and open to anyone who shows up, and the about page sets no experience requirement, but
    formal lessons at the dance are rare, so the rating stays at 3.
  what_to_expect: Expect a free, DJ'd swing dance on the square's brick surface, mostly Lindy Hop and
    Charleston, with all jazz dance styles welcome. Formal lessons are rare at the Sunday dance, though
    some regulars may show newcomers a few basics. The dance runs rain or shine, and it is sometimes held
    in the center of the park instead of the southwest corner.
  first_visit_tips:
  - Check the website and Discord around 1 pm on the day, since weather or venue changes are posted there.
  - Wear shoes you can dance in, since the square's surface is brick.
  - For a lesson first, the about page points to a Thursday beginner class across the street run by Jazz
    Attack. Check its time and price with them, since listings differ.
