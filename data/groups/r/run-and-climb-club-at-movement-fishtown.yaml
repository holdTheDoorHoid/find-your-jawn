first_step:
  how: Book a spot for the next second Wednesday night on the Movement Fishtown calendar, sign the participant
    agreement online before you go, and watch the bouldering orientation video. If you are new to climbing,
    start with the Introduction to Rope Climbing class.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Open to women and nonbinary climbers with a posted date, price and booking link. The page does
    not say beginners are welcome at the night, though the gym runs intro classes for people new to climbing.
  what_to_expect: Each night starts at 6 pm on the second Wednesday of the month at Movement Fishtown.
    Everyone signs the participant agreement and watches a bouldering orientation video before climbing.
    The night costs $15 per person, or nothing for members, and the page does not say how many people
    attend or whether you need belaying skills to join.
  first_visit_tips:
  - Sign the participant agreement online before you arrive to speed up check-in.
  - Watch the bouldering orientation video, which everyone must do.
  - Park in the free lots on the north or south side of the building, or take the 57 bus to the entrance.
  - If you are new, the Introduction to Rope Climbing class (about 1 hour, $39) is for people with little
    or no experience.
