first_step:
  how: Register for the next Thursday meeting through the online form on the club's site, or sign up for
    a service day on the club calendar.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Meetings and service days are posted publicly with online sign up, and the club says guests are
    part of the audience. The club does not publish a guest policy, so the rating stays at 3.
  what_to_expect: A meeting is an evening at 6 pm with a speaker who talks for about 20 to 25 minutes,
    followed by questions. Usually 30 to 60 members and guests attend, mostly professionals and civic
    leaders. Service days are hands on volunteer work the club organizes, such as a cemetery cleanup.
  first_visit_tips:
  - Register through the meeting form before the date, since that is how the club counts guests.
  - Ask the club about guest meal costs and dress when you register, because the site does not say.
  - Ask about any dues before you join, since the club does not publish them.
