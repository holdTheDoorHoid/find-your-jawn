first_step:
  how: Email Rhawnhurstcivic@aol.com or call 215.439.9074 to ask whether non-members can attend the next
    monthly meeting, held on the third Wednesday at 7 pm at Pelbano Playground. To join, print the membership
    application from the website.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: Joining needs a residency check, an application and dues. The site does not say whether non-members
    can come to meetings, so the way in is unclear.
  what_to_expect: The meeting is monthly and in person at Pelbano Playground, and the calendar entries
    run from 7 to 8 pm. The agenda posted for the October 21, 2026 meeting includes police community relations
    reports, updates from elected officials' offices, and local zoning. Members must pay dues and attend
    at least three meetings a year to stay in good standing.
  first_visit_tips:
  - Confirm the date before you go, since one calendar entry is titled 'March Membership Meeting' but
    is dated October 21, 2026.
  - Membership is for residents inside the Rhawnhurst boundary who are at least 18.
  - Ask whether guests may sit in, since the site does not say.
  - The page does not say how to return the application, so ask the group before you send it.
