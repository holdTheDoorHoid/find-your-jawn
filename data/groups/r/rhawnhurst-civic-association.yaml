summary: The neighborhood civic group for Rhawnhurst. Its monthly meeting brings police community relations
  reports, updates from elected officials' offices, and talk about local zoning issues.
what_you_do: Members attend the monthly meeting, follow local zoning issues, and can help on committees.
  The group also asks for volunteers to help plan projects, coordinate work, and direct its grant funds.
