summary: Rugby Pennsylvania runs an Emerging Girls Rugby effort that helps high schools add girls' rugby
  teams. It also lists clinics, sevens tournaments, and team, player and coach registration.
what_you_do: Anyone, including a teacher, parent or player, can help start a school team using the group's
  prospect form. Players, coaches and teams register through links on the site, and clinics are booked
  through SportsEngine.
