first_step:
  how: Register as a player at https://www.rugbypa.org/registration-player for a season or the annual
    registration. A parent or guardian sets up the account for a minor, pays, and verifies age with an
    official ID. To start a team at a school, fill out the Emerging Girls Rugby prospect form.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: A player must make an account, pay a season or annual fee, and upload an ID before taking part.
    The site lists no open practice, try-out or intro day for newcomers.
  what_to_expect: The site does not describe practices, the first session, or what coaches expect. Player
    registration is done online, and the page suggests asking your coach which registration type to choose.
    The $41 USA Rugby fee is paid on top of the listed prices.
  first_visit_tips:
  - Have an official ID ready for age verification, such as a birth certificate, passport or driver's
    license.
  - Ask your coach which registration type to choose before you pay.
  - Plan for the $41 USA Rugby fee on top of the team prices.
  - For help, email dhamilton@rugbypa.org.
