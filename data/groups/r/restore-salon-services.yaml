schedule:
  text: Free visits at the Hospital of the University of Pennsylvania every Monday, at Jefferson Moss-Magee
    Rehabilitation on the third Sunday of each month, and in weekly three-hour sessions at Ronald McDonald
    House Charities in Philadelphia. Home visits are also offered, and the site does not give set times
    for them.
