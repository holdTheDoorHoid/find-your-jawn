summary: Stylists give free haircuts and styling to people who cannot get to a salon because of illness,
  disability or displacement, including at hospitals, rehab centers and at home.
what_you_do: Licensed stylists visit clients at homes, hospitals, rehab centers and skilled nursing facilities.
  Clients ask for a visit through the request form on the services page. Stylists, volunteers and sponsors
  can sign up on the Join Our Village page.
