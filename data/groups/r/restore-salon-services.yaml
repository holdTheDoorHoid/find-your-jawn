first_step:
  how: If you need a visit, fill out the request form linked from restoresalonservices.org/services, and
    expect a team member to reach out after you submit it.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Anyone who needs a visit can use a public request form and the page says staff will follow up,
    though the site does not describe volunteer training or what happens after a volunteer signs up.
  what_to_expect: A licensed stylist comes to you at a home, hospital, rehab center or care facility,
    and can cut, style, blow-dry, do up-dos, buzz cuts, wig styling and barber work for all hair types,
    starting in infancy. Caregivers and family members are also served. The site does not say how long
    a visit lasts or how soon one can be booked, though testimonials on the site mention private rooms
    and gentle handling.
  first_visit_tips:
  - Expect a call or email from the team after you submit the request form, since the site does not say
    how soon.
  - Ask about parking or transit before a visit, because the site lists neither.
  - Use the services request form for a visit; the Circle of Care page is a donation form.
  - 'Helpers: the stylist form asks for the days you can work from Monday to Saturday and a short bio.'
