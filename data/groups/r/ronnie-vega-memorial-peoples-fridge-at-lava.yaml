  basis: The site lists posted food times and describes the fridge as serving neighbors, with no eligibility
    rules or sign-up. It does not say which posted hours are the fridge's own, so check the Instagram
    page if you are unsure.
  what_to_expect: The posted food times are on Monday afternoons (food share) and Thursday afternoons
    (food distro), and the free market is on the second Saturday morning. The stock comes from leftovers
    from the food distro, other food shares, and neighbor donations. The site does not say what to bring
    or how visits run.
  first_visit_tips:
  - Come during the posted food times, since the site lists no other hours.
  - The site does not say what to bring, so ask on the fridge's Instagram page before you go if you need
    to know.
