first_step:
  how: Come to LAVA at 4134 Lancaster Ave during a posted food time, such as the Monday food share from
    3 to 5 pm or the Thursday food distro from 3 to 4 pm. The site lists no sign-up.
  drop_in: true
  sign_up_needed: null
