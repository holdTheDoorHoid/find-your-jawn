summary: A Philadelphia company that puts on Shakespeare in new forms, including adaptations, readings
  and digital work, with a focus on how audiences hear and learn from the plays.
what_you_do: Watch its productions, which have included free outdoor shows in city parks, or follow its
  readings and digital programs. To ask about auditions or helping out, email the company, since its site
  lists no open calls.
