first_step:
  how: Email revolutionshakespeare@gmail.com to ask about audition calls or helping out. The newsletter
    signup also sends audition news, but its form showed a setup note when checked, so email is the surer
    route.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The site names no open audition, class or volunteer role, and the only ways in are an email address
    and a newsletter form that may not be working, so the way in is unclear.
  what_to_expect: The company's site lists no open classes, rehearsals or volunteer shifts, so a first
    step is an email. Its 2026 Hamlet ran as free outdoor shows in parks in late July and early August,
    with shows starting around 7 pm, and the site lists no future dates. Ask the company about dates and
    seating before you come.
  first_visit_tips:
  - Email before you come, since the site has no event calendar.
  - The mailing address is c/o The Painted Bride Arts Center, so it is not a place to visit in person.
