summary: The young adult ministry of a Catholic parish at Castor Avenue and Vista Street, for people aged
  18 to 35. Its groups meet for Bible study, social mixers, talks and retreats, and the parish holds four
  Sunday Masses plus a weekday morning Mass.
what_you_do: Join a young adult group for Bible study, Theology on Tap at local bars, socials and dances,
  speakers, retreats or pilgrimages, and come to Mass. The page gives no meeting times, so ask the parish
  office which group meets when. The parish also lists a Portuguese Apostolate, faith formation, RCIA,
  and ministry to the sick and homebound.
