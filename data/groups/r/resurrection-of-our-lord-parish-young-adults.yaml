first_step:
  how: Come to any listed Mass, then email or call the parish office to ask which young adult group meets
    next.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The pastor's I'm New page invites newcomers to visit and contact the parish office, though the
    young adult page gives no sign-up or meeting times.
  what_to_expect: The young adult ministry runs groups with weekly, monthly and yearly gatherings, such
    as Bible study, socials, dances, talks, retreats and pilgrimages. Mass is free, and a first visit
    can be as simple as attending a Sunday Mass and asking the office about the next gathering. The website
    does not list meeting days or times for the groups, so the office is the best source.
  first_visit_tips:
  - Call or email the parish office before you come, since the young adult pages give no meeting times.
  - The parish's I'm New page is the place to start for newcomers.
  - Parking and transit are not listed on the parish pages, so ask when you call.
