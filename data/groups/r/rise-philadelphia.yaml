first_step:
  how: 'Families: use the I need a tutor option on risephiladelphia.com to start the participation form,
    which parents and students both sign.'
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Families and tutors each have a public sign-up route, and the site says the team will reach out
    up to three times to make a match, but the pages do not describe screening, session details or cost.
  what_to_expect: After you sign the participation form, the team tries to match your student with a graduate
    tutor and contacts you up to three times to do it. Sessions are one on one and online, and the team
    picks tutors with each student's needs and academic background in mind. The pages do not say how long
    a session lasts, how often it happens, or what it costs.
  first_visit_tips:
  - Have your student's grade and the subjects you need ready, since the site covers kindergarten through
    12th grade.
  - Watch the email address you give, because the team reaches out to arrange the match.
  - For college help, pick a specific area from the list, such as AP courses, SAT or ACT, or financial
    aid.
  - Ask about session length and cost before you commit, since the pages do not state them.
