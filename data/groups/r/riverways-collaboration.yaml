  basis: The page says no paddling or swim experience is needed, equipment and instruction are provided,
    and it links a registration form, so the way in is clear for beginners.
  what_to_expect: Paddles are single-seat kayaks, about 2 to 3 miles round trip on the Delaware River,
    from 4:30 to 7 pm on Thursdays in October. Equipment and instruction are provided, and no paddling
    or swim experience is needed. Paddlers must be 12 or older.
  first_visit_tips:
  - Pay the $10 seat donation when you register; it is refunded when you arrive.
  - Paddlers must be 12 or older.
  - If you bring your own boat, you still need to register.
