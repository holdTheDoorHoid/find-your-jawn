summary: A partnership that gets more people onto the water in Philadelphia and nearby, especially in
  communities that have had little access. Its Thursday sunset paddles at Cherry Street Pier in October
  cost only a $10 seat donation, refunded on arrival, and it lists youth camps and boat building run by
  partner groups.
what_you_do: Register for a Thursday sunset paddle (ages 12 and up), sign a young person up for a camp
  or boat build with a partner group, or check the water access map.
