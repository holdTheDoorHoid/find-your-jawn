summary: A Philadelphia mentoring program for girls ages 13 to 19 that aims to prevent violence. Girls
  join free eight-week cohorts with weekly Monday mentoring, plus leadership, life skills and creative
  workshops.
what_you_do: Each girl meets a mentor on Mondays and joins workshops during an eight-week cohort. Families
  sign up through the group's online forms.
