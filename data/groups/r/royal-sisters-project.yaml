first_step:
  how: Fill in the info card on the home page with her first and last name and the Monday she would like
    to start, then follow the registration link. You can also call 267-210-3274 or email royalsisterproject@gmail.com.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Free and open to girls 13 to 19 in Philadelphia, with several clear ways to sign up. The site
    does not say whether cohorts have limited spots or need approval.
  what_to_expect: A girl in a cohort meets a mentor on Mondays, and the group runs leadership, life skills,
    entrepreneurship and wellness workshops and community experiences across the eight weeks. The mentoring
    costs nothing to join. The site does not say how long a meeting lasts or where cohort meetings are
    held.
  first_visit_tips:
  - Pick the Monday you would like to start when you fill in the info card.
  - Ask where cohort meetings are held, since the site shows only the city.
  - Call 267-210-3274 if the online form does not work.
