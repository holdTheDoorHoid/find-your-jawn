  newcomer_friendliness: 4
  basis: The church says visitors can talk with a pastor or elder through its contact page, greeters welcome
    people, and the homepage invites visitors to Sunday worship, though no newcomer class is described.
  what_to_expect: Sunday worship is at 11 am in the main sanctuary, with hymn singing, prayer, and Bible-centered
    preaching from rotating guest pastors. The site does not say how long the service runs. Children from
    infancy through age 5 can go to nursery, and children ages 5 through fifth grade attend junior church
    during the service.
  first_visit_tips:
  - Come as you are; the about page says dress is not a concern.
  - The site gives no parking or entrance details, so email rpc19111@gmail.com or call 215-342-2112 before
    a first visit.
  - Ask a greeter about nursery or junior church for children.
