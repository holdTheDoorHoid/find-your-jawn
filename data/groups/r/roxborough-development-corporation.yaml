first_step:
  how: Sign up for the newsletter on the group's site, then come to a public event such as Roxtoberfest,
    held on Ridge Avenue each fall.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Festivals and workshops listed on the site are open to the public, and the site invites people
    to sign up for its newsletter. The site does not describe membership or resident meetings.
  what_to_expect: The 2026 Roxtoberfest ran noon to 6 pm on Ridge Avenue, with live music on three stages,
    beer gardens, food, a dog costume parade and a wellness village with health screenings. The site calls
    it a community and family festival and says it draws more than 10,000 visitors. The site does not
    say whether admission is free.
  first_visit_tips:
  - Many listings give only a date, so check the events page close to the day for the time and place.
  - Email info@roxboroughpa.com with questions about cost or tickets before a workshop or event.
  - If you run a business or make things to sell, ask about vendor and sponsor spots by email; the site
    sends those questions to a named staff member.
