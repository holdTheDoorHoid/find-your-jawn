summary: The Roxborough development group that runs and promotes public neighborhood events, such as the
  Roxtoberfest street festival, and keeps a local news and events page and business directory. The City
  also lists it as a registered community organization.
what_you_do: The group runs and promotes public events, including the fall Roxtoberfest street festival,
  and its events page lists a monthly still life drawing workshop. Local businesses and makers can become
  vendors or sponsors, and the site invites people to sign up for its newsletter.
