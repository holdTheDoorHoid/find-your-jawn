summary: A nonprofit that makes free home repairs for homeowners who need them, with volunteer crews doing
  the work. Its block builds bring 100 to 250 volunteers to repair 10 to 15 homes in one area over two
  days.
what_you_do: Join a Block Build, held three times a year in April, June and October over two days. Each
  volunteer usually gives 7 to 8 hours on one day. Group and individual volunteers of all skill levels
  are welcome, and roles include general volunteer, house captain and skilled leader. Homeowners can request
  free repairs through the Get Repairs page.
