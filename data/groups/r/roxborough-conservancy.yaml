first_step:
  how: Use the Sign up link on the Volunteer Events page, then meet at the spot listed for the session
    you pick.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: Evening sessions welcome all experience levels, with tools and guidance provided, and the site
    explains how to sign up.
  what_to_expect: An evening session runs under two hours. You pull invasive plants, repair trails, pick
    up litter and tidy green spaces, and the page says the crew finishes with a drink together. Morning
    sessions use hand tools for weeding, mulching and pruning, and the page prefers some gardening experience.
  first_visit_tips:
  - Check the Volunteer Events page for each session's meeting spot, since it changes from one session
    to the next.
  - Bring gloves, a water bottle and clippers to an evening session if you have them.
  - Start with an evening session if you have no gardening experience, since the morning crew prefers
    some.
  - Subscribe to the RMC Volunteer Calendar from the Volunteer Events page to see upcoming sessions.
