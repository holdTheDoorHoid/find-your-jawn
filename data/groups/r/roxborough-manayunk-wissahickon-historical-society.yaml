  basis: Open to the public, with a clear way in by email or the contact form. Archive visits need an
    appointment, and only two visitors are allowed at a time.
  what_to_expect: A visit is by appointment, for up to two people at a time, in a small room inside the
    Roxborough library branch. Food, drink and pets are not allowed, and children must come with an adult.
