summary: A local news group for Philadelphia neighborhoods. It sends free text updates in English and
  Spanish, runs a Germantown news site, and publishes G-Town Beat, a series of community briefings on
  topics like property rights.
what_you_do: Text EQUAL INFO to 215-910-4040 for free updates, subscribe to the Germantown newsletter,
  share a story or resource for the Equally Informed newsletter, ask about becoming an Info Hub Captain,
  or come to a G-Town Beat briefing.
