first_step:
  how: Sign up for the site's low-volume email updates, then come to the next Spring Street Cleanup on
    Shawmont Avenue, where it meets Minerva.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The site does not say whether non-members can come to meetings, and membership comes with $10
    to $15 in dues. The email list and the spring cleanup are the only clear ways in.
  what_to_expect: The spring cleanup gathers on Shawmont Avenue on a Saturday morning in April, and past
    ones started at 9 or 10 am. Meetings happen semi-regularly and as needed, and recent ones were held
    at Roxborough Presbyterian Church on Ridge Avenue. Members can attend meetings and vote, and dues
    can be paid in cash or by check.
  first_visit_tips:
  - The events page still lists an April 11, 2026 cleanup as upcoming, so email the group to confirm the
    next date.
  - Email the group before a first meeting to ask whether non-members can attend.
  - Subscribe to the site's email list or RSS feed to hear about meetings.
