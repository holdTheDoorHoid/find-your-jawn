summary: A neighborhood association for upper Roxborough, founded in 1980, that works to protect local
  greenways, waterways and the watershed and speaks up on zoning and quality of life. Members meet a few
  times a year and help with a spring street cleanup.
what_you_do: Members attend meetings and vote on the association's positions, follow watershed and gully
  projects with partner groups, and turn out for the spring street cleanup on Shawmont Avenue.
