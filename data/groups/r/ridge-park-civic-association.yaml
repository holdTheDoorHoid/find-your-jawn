summary: A volunteer-run, non-partisan community group for the Roxborough and Manayunk area since 1995.
  It reviews zoning requests, plants street trees, organizes neighborhood cleanups, and supports historic
  preservation.
what_you_do: Members come to quarterly meetings, where developers and officials sometimes present, and
  volunteers join cleanups in Germany Hill, plant trees through the Pennsylvania Horticultural Society's
  program, or help the preservation committee.
