first_step:
  how: Stop by a neighborhood cleanup in Germany Hill. The volunteer page says anyone can join cleanups,
    weekly or occasionally.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The volunteer page says a first-timer can arrive at a cleanup without registering first, and
    the homepage invites new neighbors to join, volunteer or get involved. The site describes no separate
    newcomer program.
  what_to_expect: Cleanups remove trash and debris in Germany Hill and nearby areas, working with the
    Roxborough Manayunk Conservancy and Ivy Ridge Green, and they happen through the year. Quarterly meetings
    are open to members and guests, and recent ones were held both in person and on Zoom. Dues can be
    paid in person at a meeting or through PayPal.
  first_visit_tips:
  - The cleanup schedule link on the volunteer page is labeled 2020, so ask the group which cleanup is
    next before you go.
  - Recent quarterly meetings were held in person and on Zoom, so check which format the next one uses.
  - If you want to help with historic preservation, contact the preservation committee first, since the
    page asks people to reach out before joining.
