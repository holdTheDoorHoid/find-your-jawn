first_step:
  how: Fill in the short Google sign-up form linked from the event page, then join the next monthly Zoom
    meeting.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The event page says the meeting is open to anyone interested in change for people with disabilities
    and seniors in Philadelphia, and it gives a clear sign-up form. It does not say newcomers are specifically
    welcome, so the rating stays at 3.
  what_to_expect: The meeting is a video call on Zoom that runs about an hour and a half on a Wednesday
    afternoon. Residents, workers and organizations share ideas for changes that matter to people with
    disabilities and seniors in the city. The event page does not describe the agenda in detail.
  first_visit_tips:
  - Fill in the sign-up form on the event page before the meeting.
  - You need a computer, tablet or phone with internet access to join the Zoom call.
  - The coalition has its own join page on the group's site, for people who want to take part beyond one
    meeting.
