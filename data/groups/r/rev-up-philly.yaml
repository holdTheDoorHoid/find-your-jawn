first_step:
  how: Fill in the short sign-up form linked from the event page, then join the next monthly Zoom meeting.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The meeting is open to anyone interested in disability and senior issues in Philadelphia and
    links a sign-up form, but it does not say newcomers are specifically welcome.
  what_to_expect: The meeting is a video call on Zoom that runs about an hour and a half on a Wednesday
    afternoon. Residents, workers and organizations share ideas for changes that matter to people with
    disabilities and seniors in the city. The page does not describe the agenda in detail and mentions
    no fees or dues.
  first_visit_tips:
  - Fill in the sign-up form on the event page before the meeting.
  - You need a computer, tablet or phone with internet access to join the Zoom call.
  - Ask for any accommodation at least seven days ahead by emailing Access@DisabilityPridePA.org.
