first_step:
  how: Email rebelventures215@gmail.com with the help you can offer, such as design, video, or kitchen
    and office work.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The volunteer page welcomes all volunteers and gives an email to start, but it sets no sign-up
    steps, start dates or training.
  what_to_expect: The volunteer page describes design, video, and in-person kitchen and office work, with
    roles shaped around what you can add. It does not describe shifts, a time commitment, training, or
    background checks. Your first contact is an email about your skills, so expect that conversation before
    any placement.
  first_visit_tips:
  - Say in your first email what you can offer, such as design, video, or kitchen and office help.
  - High school students who need service hours can say so, since the page welcomes them.
  - Ask about time commitment and training, which the pages do not describe.
  - Check the jobs page again before applying for paid work, because it said the team was not hiring when
    we checked on 2026-10-08.
