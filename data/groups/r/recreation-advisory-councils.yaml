summary: Lets anyone become a voting member of their local rec center's advisory council just by attending
  one meeting and signing in, with elected officer roles for more involved members.
what_you_do: Help your rec center decide which programs to offer, raise money for supplies and equipment,
  plan events, and help keep the center clean.
