first_step:
  how: Attend one meeting of your rec center's council and sign the sign-in sheet so your name is on it.
    Ask the rec center staff for the next meeting date, since the city page does not list one.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: The city says anyone can join by attending one meeting and signing in, and the 2016 manual says
    meetings are open to the public. The city page gives no meeting dates, so you need to ask your rec
    center.
  what_to_expect: Meetings are open to the public and are held at the rec center, with the date, time
    and place posted there at least five days ahead, according to the city's 2016 manual. Members can
    vote in council elections and help plan programs and events, and to vote or hold office you must be
    a registered volunteer or adult participant at the center, or the parent of a registered child there.
    Officer posts (president, vice president, treasurer and secretary) require being 18 and having attended
    70 percent of meetings in the election cycle, and the 2016 manual also requires a criminal background
    check and child abuse clearance for officers.
  first_visit_tips:
  - Ask the staff at your rec center for the next meeting date and time, since the city page does not
    list them.
  - Look for the meeting notice posted in the rec center, which must go up at least five days before each
    meeting.
  - To vote or hold office later, register as a volunteer or adult participant at the center, or as the
    parent of a registered child there.
  - Officers must pass a criminal background check and child abuse clearance under the 2016 manual, so
    plan ahead if you want that role.
