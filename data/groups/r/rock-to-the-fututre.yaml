summary: A free music program for young people in under-resourced parts of Philadelphia, run in schools,
  community centers and the juvenile justice system, with mentoring and college and career help.
what_you_do: Join a free music program such as Lyric Lab, a songwriting class for teens that builds toward
  a live performance. Volunteers and donors can also help.
