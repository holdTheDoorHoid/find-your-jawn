first_step:
  how: Fill in the program interest form on the Join Now page for Lyric Lab or another program, or call
    or text 215-302-9633.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The join page says beginners are welcome, supplies and instruments are provided, and each program
    has a Sign Up Today button. The MusiCore after-school spots at the two schools are limited to their
    own students for now, with a waitlist for others.
  what_to_expect: Lyric Lab is a Monday class from 4 to 6 pm at One Art Community Center for teens aged
    13 to 19. No experience is needed, and the work builds toward a live performance. Meals, transit passes
    and instruments are provided at no cost, and a staff member follows up after you sign up.
  first_visit_tips:
  - Sign up before you come, using the interest form on the join page.
  - 'Check the age range for your program: the songwriting and production classes list ages 13 to 19,
    and MusiCore lists grades 6 to 12.'
  - Volunteers who work with students must pass PA child abuse and criminal background checks, which can
    be done free online.
