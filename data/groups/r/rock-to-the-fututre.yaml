first_step:
  how: Use the Sign Up Today form on the Join Now page for Lyric Lab or another program, or call 215-302-9633.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The join page says beginners are welcome, supplies and instruments are provided, and each program
    has a Sign Up Today form. The MusiCore spots at the two schools are limited to their own students
    for now, with a waitlist for others.
  what_to_expect: Lyric Lab meets Mondays from 4 to 6 pm at One Art Community Center for teens aged 13
    to 19. Beginners are welcome, and students write original music together toward a performance. Meals,
    transit passes, and instruments are provided at no cost. After you send the interest form, a team
    member follows up.
  first_visit_tips:
  - Fill in the interest form on the join page before you come, since a team member follows up after it.
  - 'Check the age range: Lyric Lab and Music Production list ages 13 to 19, and MusiCore lists grades
    6 to 12.'
  - If you are not from Kensington High School or Roosevelt Elementary, join the MusiCore waitlist through
    the interest form.
  - If you want to volunteer, you can attend an orientation before your background checks are finished.
