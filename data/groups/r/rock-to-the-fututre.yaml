schedule:
  text: 'Lyric Lab meets Mondays from 4 to 6 pm at One Art Community Center, and Concert Creators meets
    Thursdays from 4 to 6 pm at the same site. Music Production meets Mondays from 6 to 7:30 pm at a second
    site. The two MusiCore after-school programs meet at schools until 6 pm: Kensington on Mondays and
    Wednesdays, and Germantown on Tuesdays and Thursdays.'
