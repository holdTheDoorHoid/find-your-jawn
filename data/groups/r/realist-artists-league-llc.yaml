schedule:
  text: 'Open studio runs Saturdays and Sundays, 9 am to 4 pm, with a live model in long pose figure and
    portrait sessions. Ongoing figure and still life classes meet on weekdays in multi-week terms: figure
    painting on Mondays and Thursdays, and still life on Tuesdays, both during the day.'
