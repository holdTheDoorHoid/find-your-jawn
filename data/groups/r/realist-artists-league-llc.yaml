first_step:
  how: Contact the studio before your first open studio day (a Saturday or Sunday, 9 am to 4 pm) to get
    parking and entry details, then pay $25 for the day.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Open studio is open to artists who contact the studio first. The page calls the space judgment-free
    but does not say beginners are welcome. The studio's classes say all experience levels are welcome.
  what_to_expect: Open studio is a full day, 9 am to 4 pm, built around a six-hour pose with a live model.
    You bring your own art materials, and the studio provides easels and tables. One day costs $25, or
    $40 for both weekend days.
  first_visit_tips:
  - Check the open studio page for closed weekends before you come, since some Saturdays are closed.
  - Cash, check or Zelle avoid the card fee that applies to credit card payments.
  - Bring your own art materials; the studio provides easels and tables.
