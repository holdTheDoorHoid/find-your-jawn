first_step:
  how: Come to the 10:30 am Sunday service at 8230 Ridge Avenue, or fill in the Connect Card form on the
    church website.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The visit page gives a service time, an address, a phone line and a Connect form, and describes
    a fellowship lunch after the service. It has no explicit welcome for first-time guests.
  what_to_expect: Sunday worship starts at 10:30 am at 8230 Ridge Avenue, and the service is also streamed
    on YouTube if you want to watch first. A fellowship hour with lunch follows the service, a casual
    time to talk with others. The site does not give the service length, what to wear, or whether children's
    programs run during the service.
  first_visit_tips:
  - Plan to stay for the fellowship lunch that follows the service.
  - Call (215) 483-2762 or email office@roxboroughchurch.org about parking, entry, and children's programs,
    since the site does not describe them.
  - If you would rather watch first, the service is streamed on YouTube.
