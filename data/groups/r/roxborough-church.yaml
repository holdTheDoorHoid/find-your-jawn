summary: A church on Ridge Avenue with a 10:30 am Sunday service, children and youth programs, a preschool
  and after-school care, and a food pantry called The Table.
what_you_do: Attend the Sunday service and the fellowship lunch after it, join Roxy Kids (infant to grade
  5), RUSH (grades 3 to 5) or ROX Youth (grades 6 to 12), or get food at The Table on Thursday mornings.
