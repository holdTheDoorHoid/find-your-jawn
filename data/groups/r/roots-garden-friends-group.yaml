summary: Neighbors who tend the Roots Garden, a community garden inside Fisher Park in Olney. Older sources
  describe residents nurturing it for decades, but we could not confirm what it does today.
what_you_do: Older sources describe volunteer work days on the third Saturday of each month, when people
  clean litter, plant, and care for the garden and the park's trees. Confirm before you come, since we
  could not verify these still run.
