first_step:
  how: Email Rangeofmotion@gmail.com to set up a one on one consultation for adult martial arts. For kids,
    use the early registration form for after-school or class programs.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Adult martial arts requires a one on one consultation and a paid first month before you can join,
    and the site lists no drop in option. Youth programs need a registration fee and forms before the
    first class.
  what_to_expect: Adult martial arts classes last about 1 to 2 hours and mix bag work, pad and mitt drills,
    and partner exchanges, with strength and conditioning included. The first step is a one on one consultation,
    where you can ask about your level. A first month of membership is charged after that.
  first_visit_tips:
  - Book the one on one consultation before you come, and ask about your level then.
  - Ask the studio what to wear and where to arrive, since the site does not say.
  - Plan for a 1 to 2 hour class; mobility and drilling sessions last one hour.
  - 'Read the cancellation terms before you pay: cancelling takes effect 30 days after you give notice,
    and a fee applies inside that window.'
