  level: paid
  text: Adults pay $20 for a guided tour or $15 for self-guided. Seniors and students pay less, children
    aged 12 to 17 pay $10 guided or $7.50 self-guided, and children under 12 get in free. Rosenbach members
    and AAM, ICOM and NARM members get in free.
