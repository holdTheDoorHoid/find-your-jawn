first_step:
  how: Book a guided or self-guided visit online or by phone at 215-732-1600.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Open to the public on posted hours with clear booking links, and several public events are free.
    The volunteer guide route needs an application, so it is not counted in the rating.
  what_to_expect: Visits run during posted hours, Thursday to Sunday, and guided tours need a booking
    because space is limited. Self-guided visits use timed entry tickets and the free Bloomberg Connects
    app, so bring headphones. Photos and notes are welcome, but notes on paper must be in pencil, and
    video is not allowed during Signature Programs.
  first_visit_tips:
  - Book ahead online, by email, or by phone, since guided tour space is limited.
  - Bring headphones for the self-guided tour, which uses the free Bloomberg Connects app.
  - Use a pencil for any notes on paper, and leave food and drink outside the tour.
  - There is no parking on site, so plan how you will get to Delancey Place.
