  notes: The south entrance is wheelchair accessible. Call 215-732-1600 ext. 110 before you arrive, and
    staff will meet you at the door. Service animals are welcome in public areas. Bathrooms are on the
    first floor, and lockers are available. A paid personal care attendant can come at no cost if you
    request a free attendant ticket in advance at rsvp@rosenbach.org.
