first_step:
  how: Book a guided or self-guided visit online or by phone at 215-732-1600, or sign up for a public
    program such as a book club, talk or open house. Volunteer guides apply through the volunteer page.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Open to the public on posted hours with clear booking links, and several public events are free.
    The volunteer guide route needs an application, so it is not counted in the rating.
  what_to_expect: Guided tours start at 10:30 am Thursday to Sunday and are booked online. The self-guided
    option uses the Bloomberg Connects app on your phone, so bring headphones. The museum welcomes photos
    and notes, though paper notes must be in pencil, and video is not allowed during signature programs.
  first_visit_tips:
  - Book ahead by phone or email, since the museum asks visitors to pre-register.
  - Bring headphones for the self-guided tour, which uses the Bloomberg Connects app.
  - Use a pencil for notes on paper, and leave food and drink outside the tour.
  - There is no parking on site, so plan how you will get to Delancey Place.
