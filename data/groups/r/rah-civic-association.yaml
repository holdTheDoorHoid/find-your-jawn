first_step:
  how: Email rcooper@rahcivic.org to ask whether a community meeting is scheduled and where, since the
    site says meetings are on hold.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: Meetings are on hold according to the site, and the only way in is an email to the contact, with
    a newsletter signup that may not work yet.
  what_to_expect: The site says community meetings are on hold because of COVID-19 and will restart when
    it is safe. When they run, the page lists a 6:30 pm start at St. James School at 3217 W. Clearfield
    Street. The page does not give meeting days, how long meetings last, or any cost.
  first_visit_tips:
  - Confirm by email before you go, because the site does not show a current meeting.
  - The newest dated posts on the news page are from 2024, so ask whether the group is still meeting.
