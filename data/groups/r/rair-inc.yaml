  basis: Tours and the yearly party are open to the public and booked through clear links, and the Volunteer
    page invites sign ups. The site does not describe a beginner program.
  what_to_expect: Tours run in person or online, typically at least once a month. A virtual tour lasts
    about an hour and ends with time for questions, and you get the Zoom link the Friday before. In-person
    tours are limited in size, so book ahead.
  first_visit_tips:
  - Book a space through the Ticketleap links on the Tours page, and email info@rairphilly.org with questions.
  - For a virtual tour, watch for the Zoom link, which comes the Friday before.
  - If you cannot attend live, a pre-recorded tour is on YouTube.
  - For access needs, email billy@rairphilly.org before you come.
