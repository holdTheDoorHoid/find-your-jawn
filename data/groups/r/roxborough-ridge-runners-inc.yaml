first_step:
  how: Come to a Thursday cruise night at Ivy Ridge Shopping Center, starting around 5 pm, or to the second
    Wednesday meeting at 7 pm at 504 Hermit St. To join the club, use the Contact Us link on the website.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The club says it welcomes new members and invites people to come to a cruise, meeting or event
    first. Cruise nights need no sign up. Joining the club means an application, so membership is not
    drop in.
  what_to_expect: Cruise nights are casual gatherings where members bring classic, muscle and newer cars,
    line up and drive together, and people come to look as well. Monthly meetings open with socializing
    and event planning, and the club says every idea is welcome. Dues and the application steps are not
    on the site.
  first_visit_tips:
  - You can come to look without bringing a car.
  - Check the events calendar before a cruise night, since dates depend on the weather.
  - Meetings are on the second Wednesday at 7 pm at the Adam Kowalski Post on Hermit Street.
  - Email chris@roxrigrun.org or use the Contact Us link for membership questions.
