schedule:
  text: Thursday cruise nights run from mid April to the end of September, weather permitting, starting
    around 5 pm at Ivy Ridge Shopping Center. Monthly membership meetings are on the second Wednesday
    at 7 pm at Adam Kowalski Post 1 Polish. The club also holds yearly car shows, including a spring show.
