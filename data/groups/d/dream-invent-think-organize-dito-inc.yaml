summary: A community development group in West Oak Lane that grows food on a former vacant lot and teaches
  urban farming to youth and families. It also runs a weekly food bank and wellness courses.
what_you_do: Take one of the listed courses on seedlings, raised beds, or plant identification, or use
  the volunteer page to ask how to help. The group also has green space for gathering and recreation.
