first_step:
  how: Register for an adult, teen or kids ASL class through the links on the ASL classes page. Enrollment
    is first come, first served, and a class needs at least 8 students to run.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The class page describes the courses as non-credit beginner instruction and gives registration
    links and a contact email. It does not say that no experience is needed.
  what_to_expect: Adult levels meet for 20 hours in total over ten weeks, taught in ASL by Deaf instructors.
    Teen classes meet one hour a week and kids classes 30 minutes a week, with in-person and Zoom options.
  first_visit_tips:
  - Adult classes are for students 18 and older.
  - Online classes need a laptop or desktop computer.
  - Textbooks cost extra, and the page lists them separately from tuition.
  - A class can be cancelled or combined if enrollment is too low by the deadline.
