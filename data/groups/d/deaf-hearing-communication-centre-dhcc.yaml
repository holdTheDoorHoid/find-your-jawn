schedule:
  text: 'Ten-week ASL courses run in person and on Zoom: adult levels 1 to 4, teen classes for ages 12
    to 17, and kids classes for ages 2 to 11. Community socials, such as trivia, bingo, chat nights and
    coffee meet-ups, are listed through the year.'
