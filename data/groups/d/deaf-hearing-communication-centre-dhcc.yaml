summary: A center that teaches American Sign Language classes and works for equal communication access
  across the Philadelphia region. It also holds Deaf community social events, such as a bingo and ASL
  night.
what_you_do: Take an ASL class for kids, teens or adults, practice signing at community socials, or ask
  about interpreting and access services.
