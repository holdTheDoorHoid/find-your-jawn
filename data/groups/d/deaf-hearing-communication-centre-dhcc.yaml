summary: A nonprofit that works for communication access for Deaf, DeafBlind, and hard of hearing people
  in the greater Philadelphia area. It runs ASL classes, interpreter services, and community events such
  as a Deaf community day at the zoo and an ASL social night.
what_you_do: Take an ASL class, come to a community event such as a bingo night with ASL, or request an
  interpreter. The group also helps people get access to services, schools, and workplaces.
