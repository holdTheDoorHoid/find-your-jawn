summary: A cultural center at Cherry Street Pier with a large archive of rare books and archival materials.
  It also helps people research family history and add their own stories to the archive.
what_you_do: Visit the archive during open hours. Members can join the Kinkeeping Club for genealogy clinics
  and family tree help. The group also runs creative art and writing sessions, plus occasional summits
  and festivals.
