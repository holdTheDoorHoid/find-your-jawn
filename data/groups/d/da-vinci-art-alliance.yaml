summary: An artist group founded in 1931 that runs a gallery on Catharine Street. It holds shows, artist
  talks, a monthly book club, and workshops, and it offers memberships for artists and supporters.
what_you_do: 'Visit the gallery, come to an opening or an artist talk, join the monthly book club on Zoom,
  take a workshop such as the Paper and Paste wheat paste class, or join as an artist or supporting member.
  Volunteers can join one of three committees: marketing and outreach, membership, or building.'
