first_step:
  how: Come by on a Friday or Saturday between 11 am and 6 pm, no appointment needed. To take part in
    the book club, join the Zoom discussion (4 to 5:30 pm, monthly).
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The membership page says artists at all stages are welcome, with no portfolio review, and the
    gallery takes weekend visitors without an appointment.
  what_to_expect: Expect a free walk through the current show. Opening receptions run 5 to 7 pm on the
    calendar, and the book club is a Zoom discussion where you read the book first.
  first_visit_tips:
  - Weekend visits need no appointment. Wednesday, Thursday and Sunday visits need one through the link
    on the visit page.
  - Street parking is free but limited to 2 to 4 hours. Free municipal lots are at 1012 E Passyunk Ave
    and 701 Clymer Street.
  - Read the book ahead of time if you plan to join the Zoom book club.
  - Check the calendar or Instagram before you visit, since emergency closures are posted there.
