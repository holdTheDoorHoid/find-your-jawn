summary: An artist collective founded in 1931 by Italian immigrants. It runs a gallery, exhibitions, workshops,
  a monthly book club, and mentoring for artists. Visitors can see shows, come to openings, and join as
  members.
what_you_do: Visit the gallery, come to an opening or the monthly book club, take a workshop such as the
  Paper and Paste wheat paste class, or join as an artist or supporting member. Volunteers can join a
  committee.
