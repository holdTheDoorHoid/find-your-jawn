schedule:
  text: Gallery open Fridays and Saturdays, 11 am to 6 pm, with no appointment needed. Wednesday, Thursday
    and Sunday visits are by appointment, but the footer lists Thursday and Sunday hours, so check the
    calendar first. The monthly book club meets 4 to 5:30 pm on Zoom.
