summary: A history and genealogy society for people whose African ancestry DNA results link them to the
  Djola family. It shares Djola history, oral histories, and research on DNA, places, and language.
what_you_do: Join as a member to get help researching your family history and to take part in workshops,
  tours and events. You can also sign up for the newsletter to hear about news and events.
