summary: A registered community organization for University City property owners, formed in 2012. It keeps
  members up to date on nearby development projects, and the City asks developers to talk with it about
  nearby zoning and building plans.
what_you_do: Property owners follow development projects in University City and share their views on zoning
  and building plans. The group also works with community leaders, city officials, and police on safety
  and neighborhood concerns.
