first_step:
  how: Join the next quarterly Zoom meeting at 7 pm using the link on the homepage. The site lists October
    14, 2026 as the next meeting, with a zoning board request on the agenda.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: The homepage says any resident may join the Zoom meetings through the posted link, and no sign-up
    is described. Membership is for people who live or run a business in Dearnley Park.
  what_to_expect: Meetings are online at 7 pm and follow a set agenda, such as a zoning board review and
    a water department project on the Ridge Avenue corridor. Members vote on the group's position and
    elect officers every two years. The site lists no fee to attend, and household dues are $20 a year
    if you choose to join.
  first_visit_tips:
  - Confirm the date by email first, because the homepage lists both September 30 and October 14, 2026
    as the next meeting.
  - Membership is for residents or business owners of Dearnley Park, and dues are paid by check or money
    order to the treasurer.
  - Have the Zoom link from the homepage ready before 7 pm.
