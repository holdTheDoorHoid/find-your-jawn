summary: Dearnley Park neighbors who meet on Zoom to review zoning board requests and city projects, such
  as a water main replacement, and speak up for the area. The group has also talked about cleanup projects
  with a neighboring association.
what_you_do: Members review zoning board applications and city construction projects at quarterly Zoom
  meetings and vote on the group's position. Officers are elected to two-year terms.
