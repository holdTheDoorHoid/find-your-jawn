summary: A club that runs about 45 public orienteering events a year, where people use a map and compass
  to find checkpoints in parks. Beginners always get instruction at events.
what_you_do: Walk or jog a course with a map and compass, punching checkpoints along the way. Beginners
  get instruction and can take part without experience.
