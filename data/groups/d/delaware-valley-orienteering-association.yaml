first_step:
  how: Pick an event on the club's Event Schedule and arrive before 1 pm to register.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The Learn section is the club's starting point for new people, and the club says beginners always
    get instruction at events.
  what_to_expect: An event runs about 10 am to 1 pm, and you walk or jog a course with a map and compass.
    Courses are printed on the map in colors from White to Red, and the White course is the beginner level
    that several events offer. Some events run a beginners clinic that starts at 10 am.
  first_visit_tips:
  - Arrive before 1 pm, because the last start is at 1 pm.
  - Look for a White course or a beginners clinic in the event listing.
  - Check the linked price sheet before you go, since prices are not on the main pages.
  - The events listed from October 2026 to May 2027 are all outside Philadelphia city, so plan on a drive.
