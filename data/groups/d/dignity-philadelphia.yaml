  newcomer_friendliness: 3
  basis: Mass times, the street address and parking notes are posted publicly, and a contact email is
    listed. The site does not describe a first visit or say whether visitors need to sign up.
  what_to_expect: Sunday Mass is at 7 pm in the church at 330 S 13th Street, and some services and discussion
    nights are on Zoom. The site does not describe what a service is like or what to wear. Arriving a
    few minutes early gives you time to find a seat.
  first_visit_tips:
  - Center City street parking is free on Sundays. The church's own lot is no longer available; the site
    lists a discounted rate at the EZ Lot, 515 S 15th St, and says to contact the group for the code.
  - Several transit lines are a few blocks away, including the Broad Street Line, the Market-Frankford
    Line and Regional Rail.
