summary: A Catholic community for LGBTQ+ Catholics in Philadelphia. Members gather for Sunday Mass in
  Center City, join online Masses and discussion nights, and get email updates about events.
what_you_do: Come to Mass in person or online, join a Zoom discussion, or read the group's quarterly magazine.
  Members also get email updates about services and events, and can take part in the group's projects,
  such as its oral history project.
