summary: A South Philadelphia nonprofit that teaches outdoor and environmental skills to young people
  and adults. Its programs include boating, fishing, youth leadership, dragon boating and greening work
  in parks and along waterways.
what_you_do: Join a free boating or fishing day at FDR Park, take part in youth leadership or community
  greening work, paddle with the dragon boat team, or sign up to volunteer through the volunteer form.
