  how: Come to a free boating day at FDR Park on a Saturday from 10 am to 1:30 pm. Boating needs no registration
    and no experience.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The FDR boating and fishing programs are free and open to all ages, boating needs no experience,
    and the site says no pre-registration is needed for boating.
  what_to_expect: Boating days provide rowboats, kayaks and canoes with instruction, and children must
    come with a guardian. Family fishing on Wednesdays from 4 to 6:30 pm teaches people how to fish, with
    rods and bait provided.
