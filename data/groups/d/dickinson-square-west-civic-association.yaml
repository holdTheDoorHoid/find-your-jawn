first_step:
  how: Come to the monthly public meeting on the third Tuesday, 6 to 7:30 pm, at 2219 S 7th St. Before
    you go, email info@dswca.org to confirm the next date, because the group's site has not been updated
    since 2022.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The meeting page says all neighbors are welcome to attend, share ideas, and raise concerns, with
    no membership or dues step listed. The site was last updated in 2022, so the schedule may be out of
    date.
  what_to_expect: The page describes the meeting as in person and does not mention Zoom. Neighbors share
    ideas and raise concerns, and the group talks over zoning and development requests in the area. The
    page does not say how long the discussion runs or how the meeting is run.
  first_visit_tips:
  - Email info@dswca.org ahead of time to confirm the date and place.
  - Plan to arrive a little before 6 pm.
  - Bring any questions about a nearby project or zoning request.
