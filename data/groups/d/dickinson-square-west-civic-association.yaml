summary: A neighbors' association for the area between 4th and 6th Streets, from Washington Avenue to
  Snyder Avenue. It works on parks, cleanups, safety, and zoning, and the City consults it on local development.
what_you_do: Neighbors come to the monthly public meeting to share ideas, raise concerns, and talk over
  zoning and development requests. The site lists past cleanups and block events, most recently in 2022.
