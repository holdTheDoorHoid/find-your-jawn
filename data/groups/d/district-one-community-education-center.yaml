first_step:
  how: Pick a class from the Classes page, then call 215.387.1911 or email Programs@cecarts.org to confirm
    the start date and the price before your first session.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The programs page says all levels are welcome in the dance classes, and the center publishes
    a phone number and email, but the pages do not say how to sign up or whether drop-ins are allowed.
  what_to_expect: Funk Sole Fundamentals runs 6 to 8 pm on Wednesdays, about two hours, and the page says
    all levels are welcome. The building is a working arts space where artists rehearse and perform, so
    classes share it with other activity. Prices are not shown online, so ask before you come.
  first_visit_tips:
  - Call or email ahead to confirm the class, the price and the start date.
  - The monthly African dance classes run on different weekends from the weekly classes, so check the
    day on the programs page.
