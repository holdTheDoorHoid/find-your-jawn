summary: The Community Education Center is an arts space on Lancaster Avenue where artists rehearse, teach
  and perform. It runs dance classes open to the public, a regular open mic and a jazz night, and it rents
  space to artists and tenant groups.
what_you_do: Take a dance class (Funk Sole on Wednesday evenings, a Friday night workshop, or one of the
  monthly African dance classes), try the open mic, or visit the Blue Grotto, a basement lamp installation
  open to the public every second Friday.
