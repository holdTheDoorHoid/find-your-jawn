schedule:
  text: 'Weekly: Funk Sole Fundamentals on Wednesdays 6 to 8 pm, and a Friday night workshop at 8 pm.
    Monthly: African dance classes on the first Thursday, first Saturday, second Saturday and fourth Friday.
    Every second Friday: the Blue Grotto, 6 to 10 pm, and a jazz night. Every other second Sunday: an
    open mic, 4 to 9 pm.'
