summary: A Philadelphia nonprofit that cooks meals for people in need, including unhoused neighbors, and
  gives them to partner programs. It also runs a four-month culinary training program for young adults
  who were formerly incarcerated.
what_you_do: News coverage from 2024 and 2025 says the group cooks meals, hands them to partner programs
  and community fridges, and runs its training program with a partner. Its website returned a not found
  error when checked, and no volunteer shift or donation drop-off is described on any page we could open,
  so confirm how to help before you plan a visit.
