summary: A free weekly open mic night at Drexel's Creese Commuter Lounge, run by students in Drexel's
  music industry and arts management programs. Performers sign up for five-minute slots in music, comedy,
  poetry or monologues.
what_you_do: Claim a five-minute slot to perform, or come to watch the 8 pm show. Headliners include Drexel
  students and regional artists.
