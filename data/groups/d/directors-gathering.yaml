first_step:
  how: Sign up for the free membership through the sign-up button on directorsgathering.org, then register
    for the next salon or gathering on the events page.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Membership and events are free and open to theatre artists at any career stage, through a public
    sign-up form; the pages name no application or approval step.
  what_to_expect: Salons usually run about 90 minutes online, with a facilitator who opens the conversation.
    Gatherings can include a guest artist or a short presentation, and the in-person ones open with about
    half an hour of food and mingling before the talk. Membership and the listed events are free.
  first_visit_tips:
  - Listing times are Eastern Time, and some also give Pacific Time.
  - Register through the linked form or Eventbrite, since some events ask for an RSVP.
  - In-person gatherings meet at the CultureWorks Suite, 1315 Walnut St, Suite 300.
