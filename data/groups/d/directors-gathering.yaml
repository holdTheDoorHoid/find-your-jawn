summary: A free network for theatre directors in and around Philadelphia. It holds salons and gatherings,
  mostly on Zoom with some in person, where directors talk about their craft and try out new work.
what_you_do: Join a free salon or gathering, or sign up for the free membership to get the digital resource
  hub and the monthly newsletter about directing opportunities.
