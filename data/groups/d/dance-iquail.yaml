summary: An arts group that turns residents' own life stories into dance and percussion work, with a yearly
  community festival in Mantua and a long-running youth dance program there.
what_you_do: Mantua youth can join the percussive dance program Mantua's Most Majestic. The group also
  offers classes, holds auditions for its productions, has a volunteer page, and runs the Celebrate Mantua
  festival, which the site says drew over 2,500 people in 2023.
