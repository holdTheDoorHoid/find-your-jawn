summary: A Philadelphia alumnae chapter of Delta Sigma Theta, chartered in 1976. It serves the city through
  education, health, emergency preparedness and social action, and some of its events are open to the
  public.
what_you_do: Public-facing events include a children's coat drive, a fire safety workshop and a community
  walk. The chapter lists program areas in arts, economic development, education, emergency response,
  health, international awareness and social action. Joining goes through the national sorority's membership
  center.
