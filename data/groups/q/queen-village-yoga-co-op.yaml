first_step:
  how: Show up to an in-person drop-in class with no sign up needed. For a beginner class, try Ellen's
    Monday or Thursday 6 pm Iyengar class, which is $25 a drop-in or $20 a class with a 10-class card.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The team page labels Ellen's Monday and Thursday 6 pm Iyengar classes as beginner friendly, and
    the co-op says in-person drop-ins need no advance sign up. It does not describe a newcomer program
    or orientation.
  what_to_expect: No sign up is needed for in-person drop-in classes. You pay what you choose, with a
    suggested $15 minimum, and mats and props are free. Ellen's Iyengar classes run 75 to 90 minutes and
    are priced separately from the donation classes.
  first_visit_tips:
  - Mats and props are free, so you do not need to bring your own.
  - Ellen's Iyengar classes are not donation based, so check the price before you go.
  - Zoom classes need their own sign up at practiceyogastudio.com.
  - The site does not say where the door is or how to get there, so call (215) 755-3268 or email info@practiceyogacoop.com
    before your first visit.
