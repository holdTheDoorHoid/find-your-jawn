summary: A worker-owned yoga co-op in Philadelphia where the teachers run classes, events and workshops
  together. Drop-in classes are by donation, and mats and props are free to use.
what_you_do: Drop in to a class without signing up and pay what you choose, with a suggested minimum of
  $15. Mats and props are free. Ellen's Iyengar classes cost more and are priced separately.
