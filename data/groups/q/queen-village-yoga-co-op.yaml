schedule:
  text: Vinyasa, align and flow, embodied flow, restorative and Iyengar classes run through the week.
    Ellen's Monday and Thursday 6 pm Iyengar classes are labeled beginner friendly, and her Level II classes
    meet Tuesday evening and Saturday morning. Zoom classes need a separate sign up at practiceyogastudio.com,
    and the schedule page shows the current week.
