schedule:
  text: 'Weekly runs: Mondays at 7 pm from the center of Rittenhouse Square (3 miles), Wednesdays at 6
    pm from Philadelphia Runner in Manayunk (3 miles), and Thursdays at 6 am from the southwest corner
    of Love Park (4 miles). Runs stop halfway for stretching and conversation, and they go on year round
    except in severe weather, when cancellations are posted on the site.'
