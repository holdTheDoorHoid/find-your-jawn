first_step:
  how: Go to the meeting spot for one weekly run, such as Monday at 7 pm at the center of Rittenhouse
    Square. You can email contact@queerrun.net with questions before you go.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The site says all runners are welcome whatever their background or experience, runs are open
    to all paces, and each run has a named meeting spot and time.
  what_to_expect: Runs are free and go on year round except in severe weather. Each run is 3 or 4 miles
    at your own pace, with a stop halfway for stretching and conversation. Runners are not compared with
    one another, and the group puts care for each other first.
  first_visit_tips:
  - Check the site for cancellations before you go, since runs are cancelled in severe weather and the
    cancellations are posted on the site.
  - 'Meet at the spot listed for your run: the center of Rittenhouse Square, Philadelphia Runner in Manayunk,
    or the southwest corner of Love Park.'
  - The site does not say what to bring or wear, so email contact@queerrun.net if you are unsure.
