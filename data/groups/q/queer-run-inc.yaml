summary: A free run club for LGBTQIA+ runners in Philadelphia, run as a nonprofit. Runners of all paces
  meet for weekly runs in Center City and Manayunk.
what_you_do: Run three or four miles with other queer runners at your own pace, starting from a meeting
  point on a weekly run night.
