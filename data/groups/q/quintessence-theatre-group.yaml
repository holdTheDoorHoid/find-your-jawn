cost:
  level: paid
  text: Tickets are about $30 to $75, with previews at the low end and opening nights at the high end.
    Youth 18 and under pay $30 to $35, seniors get $5 off full price, active military pay $25 to $30,
    and a limited number of $10 rush tickets go on sale in person one hour before curtain.
