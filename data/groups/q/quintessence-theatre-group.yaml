access:
  wheelchair: 'yes'
  languages: []
  notes: The site calls the theater accessible and has an accessible restroom in the lobby. You can ask
    for seating accommodations when you buy tickets. Some performances have open captioning, but the site
    does not say which ones. To confirm the entrance and seating, email the box office. SEPTA Bus 23 stops
    at Mount Pleasant Avenue, and the page names Allen Lane and Sedgwick stations on the Chestnut Hill
    rail lines nearby.
