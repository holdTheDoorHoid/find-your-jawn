first_step:
  how: Buy a ticket to a Season XVII show, or email volunteer@quintessencetheatre.org to ask about ushering.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: Shows are open to anyone with a ticket, and the site has an email sign up for volunteers. The
    adult workshop listed is aimed at working actors and does not say beginners are welcome.
  what_to_expect: Shows are staged at the Sedgwick Theater on Germantown Avenue, and you can buy tickets
    in advance or try for a limited $10 rush ticket in person about an hour before curtain. If you usher,
    you get a free ticket to the show you work and a free concessions item, with no alcohol.
  first_visit_tips:
  - Park in the free lot directly across from the theater, or use the unmetered street spaces on Germantown
    Avenue, which have a 2-hour limit.
  - Take SEPTA Bus 23 to Mount Pleasant Avenue. The site warns that the trip from Center City takes a
    long time, so allow extra time.
  - Ask for seating accommodations when you buy tickets, in person or online.
  - Volunteers must be 18 or older, or 15 to 17 with a guardian. Email volunteer@quintessencetheatre.org
    with your availability and interests.
