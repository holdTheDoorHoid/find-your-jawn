summary: A theatre company in residence at the Sedgwick Theater in Mt. Airy. It stages a season of plays
  and runs classes, student matinees and a summer camp.
what_you_do: Buy tickets to a season show, take an adult workshop, or bring a student group. Volunteers
  usher, hand out flyers at local businesses, prepare mailings, and help build sets and costumes.
