first_step:
  how: Sign up for the weekly newsletter on the site, then join a park cleanup or planting day from the
    events page.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Park days and zoning meetings are listed as public, and volunteering can be as small as an hour.
    The site describes no newcomer program.
  what_to_expect: A park day is usually two to three hours of cleanup or planting with neighbors, often
    run by a Friends of park group. Zoning meetings are evening calls on Zoom where the committee reviews
    a nearby project, and neighbors can give input.
  first_visit_tips:
  - Check the events page close to the date, since times and places are posted there.
  - For zoning questions, email info@qvna.org and put 'Zoning Page' in the subject line.
  - Park days happen at parks the Friends of groups look after, such as Weccacoe Playground, Mario Lanza
    Park and Bainbridge Green.
  - Some neighborhood events charge tickets, so check the price before you go.
