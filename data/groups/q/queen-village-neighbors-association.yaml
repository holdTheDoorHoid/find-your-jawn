summary: The neighborhood association for Queen Village, founded in 1969. It follows nearby zoning and
  building plans through a zoning committee, organizes Friends of park groups for cleanups and planting
  days, and publishes a quarterly newsletter.
what_you_do: Join a zoning meeting, help a Friends of park group with a cleanup or planting, volunteer
  with QV Tree Tenders, or come to a neighborhood event.
