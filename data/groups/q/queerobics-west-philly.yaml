  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Open to the public, with seated and low-impact options and an email contact. The Next Class page
    does not say beginners are welcome and does not spell out how to register.
  what_to_expect: The class is an accessibility-centered dance and movement class held outdoors in parks
    or on courts. Dance captains show moves live beside the lead instructor and offer low-impact and seated
    options. Masks are required, and the suggested donation is $10 to $15, with no one turned away for
    lack of funds.
  first_visit_tips:
  - Bring a mask if you can, because the group has only a limited supply.
  - Wear comfortable athletic clothes, like the instructors in the group's flyers.
  - Water is available at class.
  - Check the Next Class page for the location before you go, since each class is a pop-up.
