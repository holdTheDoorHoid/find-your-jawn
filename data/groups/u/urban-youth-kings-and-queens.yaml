cost:
  level: low
  text: Winter basketball is $110 for ages 4 to 6 and $185 for ages 7 to 16, uniform included. Summer
    basketball is $165. Quickball is $85 per spring season. The John B. Kelly after-school program is
    free with limited spots, and the group says it does not turn a child away for inability to pay.
