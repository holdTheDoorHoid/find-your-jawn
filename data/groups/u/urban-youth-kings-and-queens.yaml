summary: A Germantown youth sports and enrichment group. It runs baseball, softball, Quickball and basketball,
  plus after-school programs at partner schools and a summer camp.
what_you_do: Families register children for the program they want on the group's site. Adults can coach
  or mentor through the Get Involved page.
