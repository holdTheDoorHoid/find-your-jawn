first_step:
  how: Open the program page you want, such as basketball for ages 4 to 16, and use its Register button.
    Winter spots are limited, so register early, or email info@uykq.org to ask first.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: Basketball is open to all skill levels and the group says every child gets a chance to play.
    Quickball is an intro for ages 4 to 6, and each program page explains how to register.
  what_to_expect: Winter basketball practices run on weeknight evenings starting at 6 pm, with one guaranteed
    practice a week, and games are on Wednesday evenings and Saturday mornings. Coaches are volunteers,
    and the winter fee includes the uniform. Quickball teaches hitting, fielding, catching and baserunning,
    and parents help coaches carry out the lessons.
  first_visit_tips:
  - Winter basketball divisions are ages 4 to 6, 7 to 9, 10 to 12 and 13 to 16, so check your child's
    age group before you sign up.
  - The winter fee includes the uniform. The site does not list shoes or other gear, so ask.
  - Basketball games and practices are at SCH Vare Fieldhouse, 8000 East Cherokee Street.
  - Winter registration is online through the team sign up system, and spots are limited and may close
    early.
