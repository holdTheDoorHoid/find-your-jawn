schedule:
  text: Baseball (ages 7 to 14) and softball (girls 7 to 12) run in spring and fall. Quickball (ages 4
    to 6) meets on Saturday mornings from 9:45 to 10:45 am in spring. Basketball (ages 4 to 16) has a
    winter and a summer season, with weeknight practices and games on Wednesdays and Saturdays. After-school
    programs run during the school year, and a six-week summer enrichment camp is held each summer.
