summary: A North Philadelphia nonprofit working on food, art and learning. It runs Life Do Grow, an urban
  farm with a public park, an outdoor classroom and an arts space, and it has hosted programs there since
  2011.
what_you_do: Volunteer on the farm or at a service day, schedule a group service project, or join the
  email list. Past community workshops covered medicinal herbs.
