  basis: Volunteering starts with an intake form and a reply from the team, and no volunteer days are
    posted, so the first shift depends on the group's answer.
  what_to_expect: No volunteer days are posted right now, so the first step is the intake form and a reply.
    Past volunteer days were held on Thursdays and Saturdays at the farm on North 11th Street. The site
    does not say how long a shift lasts or what the work will be.
  first_visit_tips:
  - Dress for outdoor work, since the farm is outdoors.
  - Ask the group which volunteer day is next, since none is posted.
  - Group service projects are booked by email, so write to the group before you plan a visit.
  - Public visiting hours are not stated, so ask before you go to the farm.
