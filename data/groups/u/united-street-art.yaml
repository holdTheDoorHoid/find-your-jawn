  newcomer_friendliness: 2
  basis: The site says the public can watch artists at STEP OUTSIDE exhibitions. It names the monthly
    meetup but gives no day, place or way to join, so the way in is unclear.
  what_to_expect: At a STEP OUTSIDE exhibition, the public can watch artists work on walls, panels and
    doors, and can engage with and learn from them, according to the site. The site does not list exhibition
    dates, a venue or how long an event runs, so ask before you go. The monthly Return to Sender meetup
    is for drawing, and the site does not say what to bring or how long it runs.
  first_visit_tips:
  - Email info@unitedstreetart.org for the day and place of the next Return to Sender meetup, since the
    site does not list them.
  - The address on file is an IRS mailing address, so it may not be where events happen.
  - The site lists the social accounts @stepoutsideshow and @pmslaps.
