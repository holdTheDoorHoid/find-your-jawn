summary: A nonprofit formed in 2022 to support street artists and graffiti writers. It runs STEP OUTSIDE,
  a live street art exhibition program, publishes Priority Mag and Sticker Movie the Zine, and holds a
  monthly drawing meetup called Return to Sender.
what_you_do: Go to a STEP OUTSIDE exhibition, where graffiti writers, sticker artists and muralists paint
  live, or come to the monthly Return to Sender drawing meetup. Artists can contact the group about future
  exhibitions.
