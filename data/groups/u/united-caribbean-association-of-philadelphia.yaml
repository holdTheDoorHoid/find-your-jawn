first_step:
  how: Fill in the free pre-registration interest form linked from the Join Us page on the Carnival site.
    It is an interest check, so no payment is needed.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The Join Us page says the band welcomes first-time masqueraders and gives a free online form
    to start. Practice dates and fees are not yet published.
  what_to_expect: This is an interest check for the 2027 Carnival, so the site has no practice schedule
    yet. The band says it will provide food, drinks and music. Ask about practices and fees through the
    contact form or email before you commit.
  first_visit_tips:
  - Bring a costume from a past Carnival, or plan a new one, since the band has no matching costume rule.
  - The page encourages you to bring a flag and some friends.
  - If you have questions first, use the Schedule a meeting link on the contact page.
