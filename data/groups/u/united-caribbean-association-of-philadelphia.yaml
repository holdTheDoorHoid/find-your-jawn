summary: The nonprofit behind the Philadelphia Caribbean Carnival. Its costumed mas band, Philly Mas United,
  is taking interest sign-ups for the 2027 Carnival.
what_you_do: Join Philly Mas United, the band that is planning its road experience for the 2027 Carnival.
  Pre-register with the free online form on the site. No matching costume is required, so you can wear
  an older costume or design a new one.
