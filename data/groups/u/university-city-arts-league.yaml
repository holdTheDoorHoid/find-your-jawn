summary: An art center in West Philadelphia, founded in 1967 in an old Victorian house. It offers adult
  and kids' art classes, memberships with open studio time, and exhibitions. Its rooms can also be rented
  for rehearsals, recitals and events.
what_you_do: Sign up for an adult art class or a kids' class (Arts After School, grades K to 5, for the
  2026 to 27 school year). Members get open studio time and class discounts. Anyone can visit the gallery,
  and the BOHÉMIENNE show runs October 2 to 29, 2026.
