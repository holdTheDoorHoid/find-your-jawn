schedule:
  text: 'Most adult classes run in six-week sessions, mostly on weeknight evenings, with some weekend
    daytime options. After school art for grades K to 5 runs on weekdays during the school year: pickup
    from Penn Alexander or Henry C. Lea Elementary is from 3 to 4 pm, and snack and workshops run from
    4 to 6 pm.'
