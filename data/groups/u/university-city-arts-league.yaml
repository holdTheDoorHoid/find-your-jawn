first_step:
  how: Choose a class on the Fall 2026 page that still has open spots and register for it, or use the
    Register link to enroll a child in after school art.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: Several adult classes are listed for all levels or as beginner friendly, and registration is
    required for each listed class, so the class pages show exactly how to start.
  what_to_expect: Adult classes are artist led and meet once a week for six weeks, usually for two hours
    (pottery sessions run three). Six-week classes cost $250 to $300, and first-time students at some
    classes pay a $25 materials fee. Pottery students can buy clay and tools ahead of time or in the studio,
    but outside clay is not allowed. Six-week classes include a free open studio week at the end of the
    term.
  first_visit_tips:
  - Several fall classes showed as sold out when checked, so look for one with open spots on its class
    page.
  - Fall class sign up closes October 9 at 5 pm, and workshops close 48 hours before the first lesson,
    so check each page's cut off.
  - For weaving and woodcarving, buy the first-time materials fee at least 7 days before the first lesson.
