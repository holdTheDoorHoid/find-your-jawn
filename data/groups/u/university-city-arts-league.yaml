summary: A contemporary art center in West Philadelphia, also listed as the University City Arts League.
  Artists teach adult classes and workshops, members can use open studio time, and kids can join an after
  school art program.
what_you_do: Take an artist led class or workshop, join as a member for open studio time, or sign a child
  up for after school art.
