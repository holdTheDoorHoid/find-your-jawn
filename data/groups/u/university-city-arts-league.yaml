first_step:
  how: Pick an adult class on the Take a Class page at theartsleague.org and sign up online, or use the
    Register link to enroll a child in after school art.
  drop_in: false
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Adult classes are open to the public with online sign up. The class list, times and prices were
    not visible on the pages checked, so a first timer needs to look at the class page before choosing.
  what_to_expect: Adult classes are artist led classes and workshops. Open studio time is a member benefit,
    so check membership before you plan to drop in. After school art serves grades K to 5 with snack and
    workshops, and pickup is from Penn Alexander or Henry C. Lea Elementary between 3 and 4 pm.
  first_visit_tips:
  - Check the class page for dates and prices before you sign up, since they are not on the main pages.
  - After school students from other schools must be dropped off by 4 pm.
  - Fill in the Student Information Form before the first after school day.
  - Use an email address you check often; the program contacts new families within a week of buying a
    plan.
