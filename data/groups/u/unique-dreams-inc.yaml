summary: A Philadelphia nonprofit that runs a free evening center for youth ages 10 to 17, a summer camp
  for younger kids, and a community food pantry. Youth get homework help, arts, sports, cooking, and a
  meal.
what_you_do: Youth register online for the evening center, which includes a meal and round-trip rides,
  and take part in homework help, arts and crafts, cooking, games, sports, and field trips. The food pantry
  runs on set days each week.
