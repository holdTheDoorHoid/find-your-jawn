first_step:
  how: Register a young person, ages 10 to 17, for the free Community Evening Resource Center, online
    or in person, or call 267-325-2115 with questions first.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The center is free and open to any youth in the age range, with a clear sign-up path, but the
    site does not say whether walk-ins are welcome.
  what_to_expect: A young person registers, then spends the evening on homework help and one or more activities
    such as arts and crafts, cooking, games, sports, or boxing. A meal is served, and the center provides
    free rides home. The site names its staff but does not say how many adults or volunteers are present
    each night.
  first_visit_tips:
  - Call 267-325-2115 before the first night, since the site does not say whether walk-ins are welcome.
  - Registration is by the online form linked on the site or in person.
  - Round-trip transportation is free.
  - The office is open Monday to Friday, 7 am to 8 pm, and on weekends, 6 am to 6 pm.
