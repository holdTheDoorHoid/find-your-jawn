summary: A Philadelphia nonprofit that runs a free evening center for youth ages 10 to 17, a summer camp
  for younger kids, and a community food pantry. Youth get homework help, arts, sports, cooking, and a
  meal.
what_you_do: Youth ages 10 to 17 register for the free evening center, online or in person, and join homework
  help, arts and crafts, cooking, gaming, boxing, sports, and field trips. Families can also enroll children
  ages 8 to 12 in summer camp. The food pantry runs on set days from a trailer in the Garsed Center parking
  lot, but the site lists more than one schedule, so call before you go.
