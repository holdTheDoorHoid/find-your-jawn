first_step:
  how: Use the Meet with us button on urbedadvocates.org to ask how to get involved, or apply to one of
    the open internship or fellowship roles on the Careers page.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The site has a contact button, open roles with apply links, and a testimony sign up. Eligibility,
    hours and pay are not stated, so a first timer needs to ask.
  what_to_expect: The site does not describe a first meeting or how long it takes. Joining, testifying
    and signing petitions are free, and the fellowship is paid. Roles are listed as hybrid, so some work
    may happen in person at the Philadelphia office on Locust Street.
  first_visit_tips:
  - Read each role's own vacancy page, since the careers page gives only titles and tags.
  - Ask about Youth Space hours before you visit, since the site does not list them.
  - If you want to testify, sign up with the school district for the board meeting you plan to attend.
  - Ask whether a role needs in person days, since the roles are marked hybrid.
