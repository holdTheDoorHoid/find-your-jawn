summary: The group that runs the Bridesburg Memorial Day Parade, a long-running parade in Bridesburg that
  dates back to 1946. It also holds a Memorial 5K and 1 Mile Honor Walk that raises money for the parade.
what_you_do: Watch the Memorial Day parade, or sign up for the Memorial 5K and 1 Mile Honor Walk held
  on a Saturday in May. The group's own website was not found, and the pages read do not say how to volunteer
  with the parade.
