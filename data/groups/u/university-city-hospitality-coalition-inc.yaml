first_step:
  how: Email volunteers@uchcphiladelphia.org to sign up for a meal shift, arriving around 5:30 pm. You
    can also call (856) 209-3819 to confirm the schedule before a shift.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Volunteer shifts have a clear email route and a set routine, and the site explains the basic
    tasks. The site does not describe how a first shift is set up, so the rating stays at 3.
  what_to_expect: A shift runs about 1 hour 45 minutes, from about 5:30 to 7:15 pm. Volunteers set tables,
    portion food, serve plates and tea, assemble take-out meals, and clean up after dinner. The site asks
    volunteers to wear gloves, tie back long hair, and stay home if they are sick.
  first_visit_tips:
  - Arrive around 5:30 pm, since cleanup ends about 7:15 pm
  - Wear gloves if you can and tie back long hair
  - Do not come if you are sick
  - Volunteers under 18 must come with a parent or legal guardian
