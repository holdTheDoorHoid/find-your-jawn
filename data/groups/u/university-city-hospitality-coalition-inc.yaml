summary: A volunteer-run group that serves free hot meals and sandwiches to people in West Philadelphia's
  University City, with church and campus partners hosting the meals. It also works to ease hunger and
  homelessness in the neighborhood.
what_you_do: Volunteer at a partner church dinner by setting tables, serving plates, or cleaning up, help
  assemble take-out meals, or donate food or money. Email volunteers@uchcphiladelphia.org to sign up.
