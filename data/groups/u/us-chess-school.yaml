summary: A nonprofit that gives free chess training to talented young players through camps. Camps run
  online year round and in person in some cities, with coaches who are grandmasters and international
  masters.
what_you_do: Players apply for an online or in person camp and are invited based on rating, experience
  and fit. Online camps run on weekends. The next one is an online fall camp on October 24 and 25, 2026,
  and its applications are not yet open.
