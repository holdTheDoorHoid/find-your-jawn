summary: Penn's elected student government. It decides how student groups get funded, pushes for changes
  that help students, and runs services for undergraduates.
what_you_do: Attend the General Body Meetings, which the public may attend (the closing Communications
  portion is closed to visitors). Students can apply to be an associate member when the fall application
  opens, run for an elected seat, or fill out the interest form for updates.
