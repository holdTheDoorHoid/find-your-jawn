summary: A masjid in South Philadelphia, founded in 1994, with weekly Islamic classes on Tuesdays and
  Fridays after Isha prayer. The Friday class is streamed live online.
what_you_do: Join the Tuesday class on the inner dimensions of prayer, or the Friday class, which you
  can attend online. The site also lists volunteer sign-up, Zakat al-Fitr and a monthly giving program.
