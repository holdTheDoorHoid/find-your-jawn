first_step:
  how: Call 215-546-6555 or use the contact form on ummonline.org to ask about the Tuesday class, or join
    the Friday class live online.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The Friday class is streamed live for anyone to join and the classes are listed with days and
    times, but the site does not say whether beginners or non-Muslim visitors are welcome.
  what_to_expect: The Friday class is an explanation of a classic text on Islamic belief, given after
    Isha prayer and streamed live online. The Tuesday class covers the inner side of prayer, meaning how
    to pray with full focus, after Isha prayer. The site does not say where the classes meet, how long
    they run, or whether beginners get extra help.
  first_visit_tips:
  - Check the weekly class schedule page on ummonline.org before you come, since it lists the classes
    and the online link.
  - The site lists two addresses, 810 South 15th Street and 1251 Point Breeze Avenue, but does not say
    which class meets at which one.
  - Prayer times are posted on the site as images, so check them before you go.
