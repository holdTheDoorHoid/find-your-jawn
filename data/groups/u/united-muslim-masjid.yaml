summary: A masjid in South Philadelphia, founded in 1994, with weekly Islamic classes on Tuesdays and
  Fridays after Isha prayer. The Friday class is streamed live online.
what_you_do: Join the Tuesday class on the inner side of prayer, or follow the Friday class live online.
  The masjid also lists volunteer teams in communications, youth and family, and aging with dignity, plus
  Zakat al-Fitr and donation options.
