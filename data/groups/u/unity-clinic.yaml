summary: A free primary care clinic for uninsured adults at 2130 South 21st Street in South Philadelphia.
  The Augustinian Defenders of the Rights of the Poor run it with help from Villanova's nursing school,
  and volunteer nurses, doctors and students staff it on Tuesday evenings.
what_you_do: Volunteer as a nurse, clinician, student or translator on a Tuesday evening shift.
