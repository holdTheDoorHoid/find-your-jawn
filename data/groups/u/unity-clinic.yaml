first_step:
  how: If you are a nurse practitioner or physician, email phewson@augustinian.org. If you are a nurse,
    a nursing or medical student, or a translator, email meredith.mackenziegreenle@villanova.edu. Students
    can also go through their school programs.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Clinicians need a license and commit to at least one shift a month, and students join through
    their schools, so a first-timer cannot simply walk in.
  what_to_expect: Shifts run on Tuesday evenings. Volunteer hours start at 4:30 pm, and patient visits
    run from 5 to 8 pm. Nurses and nursing students take vital signs and patient intake, and may give
    immunizations and watch clinicians at work. Nurse practitioners and physicians see patients, and medical
    students work alongside a clinician.
  first_visit_tips:
  - Bring your own stethoscope, since the Villanova page asks every volunteer to bring one.
  - Arrive by 4:30 pm for volunteer hours, since patient sessions start at 5 pm.
  - Parking at the clinic is on site and free.
  - Nurses need a Pennsylvania license.
