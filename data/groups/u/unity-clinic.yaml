first_step:
  how: If you are a licensed nurse practitioner or physician, email phewson@augustinian.org, the volunteer
    contact the Villanova page lists for them, or use the ADROP volunteer form at rightsofthepoor.org/volunteer.
    Nursing and medical students go through their school programs.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Clinicians need a license and at least a monthly commitment, and students join through their
    schools, so a first timer cannot simply walk in. The pages do not describe a first shift.
  what_to_expect: Shifts run on Tuesday evenings. Nurses and nursing students take patient intake and
    vital signs and give immunizations, and they can watch clinicians at work. Nurse practitioners and
    physicians see patients and come at least one shift a month, and medical students work alongside a
    clinician. The clinic also uses translators.
  first_visit_tips:
  - Bring your own stethoscope, since the Villanova page says every volunteer needs one.
  - Arrive by 4:30 pm for volunteer hours; patient sessions start at 5.
  - Parking at the clinic is on site and free.
  - Nurses need a Pennsylvania license.
