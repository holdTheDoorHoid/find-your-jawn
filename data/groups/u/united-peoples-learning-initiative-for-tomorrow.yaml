first_step:
  how: Fill out the first step of the Enroll Now application at upliftworld.org, or call 267-226-9748
    with questions before you start.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Families fill out an application before they see the school, and the site does not mention tours
    or open houses.
  what_to_expect: UPLIFT Academy is a Montessori-style early learning center for children from 6 weeks
    to 12 years old, with a focus on early literacy and hands-on learning. The application asks about
    your child's current school or daycare, and the site does not say how long a school day is, what tuition
    costs, or whether tours are offered. Call to ask about these before you apply.
  first_visit_tips:
  - Have a state ID, passport, or driver's license ready for each parent or guardian and each emergency
    contact, since the form asks for an upload.
  - If your child attended a daycare, have the names of the last three, because the school contacts them
    before admission.
  - Pick an anticipated start date, since the form asks for one.
