schedule:
  text: Music rehearsals at Uptown Hall on Tuesdays, 8 to 10 pm. Prop and scenery sessions on Sundays,
    11 am to 2 pm, at an annex in Fairless Hill, Pennsylvania. The band marches in Philadelphia's New
