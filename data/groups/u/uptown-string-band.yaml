summary: A Mummers string band that practices in Langhorne, Bucks County, and marches in Philadelphia's
  New Year's Day parade. Its Tuesday rehearsals are at Uptown Hall, which it also manages as a rental
  venue, and it hosts public family events there.
what_you_do: Join as a performer, marshal or social member, march in the New Year's Day parade, or come
  to a public family event.
