first_step:
  how: Walk in on a Tuesday between 8 and 10 pm at Uptown Hall to watch rehearsal, or fill out the Join
    Us form on the band's website with your name, email and membership type.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: Visitors can walk in on Tuesday nights to watch, and the Join Us form is a clear way to start.
    Musicians take a music test and dancers are placed by the drill director, so the first role depends
    on skill.
  what_to_expect: Tuesday rehearsal runs from 8 to 10 pm at Uptown Hall in Langhorne, and visitors can
    walk in to watch. Musicians take a short music test with the music director once they feel ready,
    and dancers' level is set by working with the drill director. Marshals and aides go over their requirements
    with the chief marshal, and current members range from about 12 to 75. The page gives no dues.
  first_visit_tips:
  - Uptown Hall is in Langhorne, Bucks County, and has two full size parking lots, so plan the drive.
  - Come between 8 and 10 pm on a Tuesday to see the music rehearsal.
  - If you play, bring your instrument for the music test. The band lists saxophone, banjo, accordion,
    upright bass and percussion.
  - If you do not play, ask about dancer, marshal or aide roles. The Join Us form also offers a social
    member option.
