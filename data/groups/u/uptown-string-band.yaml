first_step:
  how: Walk in on a Tuesday night at Uptown Hall, or fill out the Join Us form on uptownstringband.com
    and wait for an officer to follow up.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: The site says Tuesday nights have an open-door policy and that anyone can fill out the Join Us
    form. Musicians take a music test and dancers meet the drill director to find their level, so the
    next step depends on the role.
  what_to_expect: Tuesday nights use an open-door policy, and new people are placed by role. Musicians
    take a short music test with the music director, dancers meet the drill director to find their level,
    and marshals and aides go over their requirements with the chief marshal. The page gives no dues or
    costs.
  first_visit_tips:
  - Uptown Hall is in Langhorne, Bucks County, so plan the drive; it is not in Philadelphia.
  - Come between 8 and 10 pm on a Tuesday to see the music rehearsal.
  - If you play, bring your instrument for the music test. The band lists saxophone, banjo, accordion,
    upright bass and percussion.
  - If you do not play, ask the officer about dancer, marshal or social roles.
