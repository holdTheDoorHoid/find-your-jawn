first_step:
  how: Pick a monthly group on the Community page and use its Register link, which opens an online scheduling
    page.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Each group has a Register link, and the groups are open to women and parents. The site does not
    say whether you must attend every month.
  what_to_expect: Each monthly group is built around a discussion topic set for that group. The site presents
    them as relaxed sessions where you can talk, raise questions and lean on other women. Events cost
    $25 or less, and the site does not say how long a meeting runs.
  first_visit_tips:
  - Read the discussion topic on the Community page for the group you pick, so you know what the conversation
    covers.
  - Check the date on the register link, since the site lists some dates in more than one way.
  - Some groups are virtual gatherings, so check the format on the register link before you sign up.
