summary: A Philadelphia nonprofit that offers women affordable, non-clinical support through monthly groups
  for mothers, married women, singles, single mothers, and mothers of children with disabilities or illnesses.
  Some groups meet online.
what_you_do: Pick the monthly group that fits your life stage, such as motherhood or singles, and sign
  up through its register link to talk with other women in a supportive circle.
