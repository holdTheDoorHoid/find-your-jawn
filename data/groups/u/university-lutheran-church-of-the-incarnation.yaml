first_step:
  how: Come to Sunday worship at 10:30 am, and fill in a welcome card from the pew rack if you want the
    church to know you are new.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The church has a first-time visitor page, lets visitors say hello to members after the service,
    and offers a pew card and an online connection card to say you are new.
  what_to_expect: Sunday worship starts at 10:30 am with Holy Communion and lasts a bit over an hour.
    The music is hymn based, with organ, strings and winds, and dress is casual. Visitors can say hello
    to a member over coffee after the service. Visitors do not need to give when the offering plate comes
    around.
  first_visit_tips:
  - The main entrance is on 37th Street Walk, a few minutes from 30th Street Station. The contact page
    also lists trolley routes 10, 11, 13, 34 and 36 to 36th Street Station, and bus 21 to 37th Street.
  - On Sundays and evenings, park in the lot behind the church, entered from Ludlow Street. On other days,
    street parking needs a paid kiosk receipt on your dash.
  - Children are welcome in worship, but there is no nursery during services. Ushers can give you an activity
    kit.
  - Communion is offered at both services. You can stand or kneel at the rail, or come forward and receive
    a blessing if you prefer not to take communion.
