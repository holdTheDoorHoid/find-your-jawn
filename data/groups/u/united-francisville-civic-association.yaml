summary: The registered neighborhood group for Francisville. It holds a monthly community meeting, runs
  monthly trash clean-ups, has a Greening Committee, and follows zoning and development projects in the
  area.
what_you_do: Neighbors hear updates on zoning and development, help with the monthly trash clean-ups (the
  group provides supplies), and talk over neighborhood plans at the monthly meeting, in person or online.
