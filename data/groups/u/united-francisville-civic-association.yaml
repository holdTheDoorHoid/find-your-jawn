first_step:
  how: Come to the second Wednesday community meeting at 6:30 pm at the Francisville Recreation Center,
    1737 Francis St. The group also offers a virtual option. To ask about events or concerns, email info@ufcaphilly.org.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The meetings page invites everyone to attend, including residents and business owners, and offers
    a virtual option. It does not use newcomer language or describe a membership path, so it is rated
    3.
  what_to_expect: Meetings run from 6:30 to 8 pm, once a month. The group says food and drinks are provided.
    No agenda was posted on the page we read, and no dues or fees are listed for attending.
  first_visit_tips:
  - Read the past meeting minutes posted on the website to see what gets discussed.
  - The Greening Committee meets on Tuesdays at 7 pm at Greenspace in Francisville, if you want hands-on
    work.
  - The group is recruiting volunteers for president, vice president and treasurer, and interested neighbors
    can say so through a linked folder.
