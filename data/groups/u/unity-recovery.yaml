schedule:
  text: Online recovery meetings run every day, several times a day, including a family meeting, an LGBTQ+
    meeting, a parenting meeting, and a harm reduction meeting. Times are Eastern. Life skills workshops
    run online on the third Saturday of each month at 10 am Eastern.
