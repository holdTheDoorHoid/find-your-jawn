first_step:
  how: Join an online recovery meeting through its Join Now link on the digital meetings page, or fill
    out the peer support request form for the Philadelphia area.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Meetings and peer support are free and open to people in recovery or seeking it, with a Join
    Now link and a request form, but the site does not explain how meeting sign-up works.
  what_to_expect: Online meetings run on Zoom or a similar video platform. Video is optional, you can
    mute your audio, and you can message the facilitator. If the room is full, you can leave your email
    to be told when a space opens. After you submit a peer support request, a peer should be in touch
    within 24 hours, according to the FAQ.
  first_visit_tips:
  - Times on the site are Eastern time, so check the time in your own zone before you join.
  - Video is optional, and you can mute your audio.
  - If a meeting is full, leave your email to be told when a space opens.
  - You can ask for peer support for a loved one, too.
