summary: A peer-run recovery organization with a Philadelphia presence. It offers free one-on-one peer
  support, recovery meetings held online, life skills workshops, and volunteer roles open to people in
  recovery, family members, and others.
what_you_do: Ask for one-on-one peer support, for yourself or a loved one, join an online recovery meeting,
  take a free life skills workshop, or sign up to volunteer.
