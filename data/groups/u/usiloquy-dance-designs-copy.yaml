first_step:
  how: Email shaily@usiloquydance.org or call 267-324-5917 to ask about the next beginner class. You can
    also book a workshop with the Book a Workshop button on the Repertoire and Workshops page.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Beginner classes are offered, and the site gives an email, a phone number and a contact page
    to ask. Class times, fees and the studio address are not published, so you need to ask before you
    plan a first visit.
  what_to_expect: 'Classes use the Kalakshetra style and run at beginner, intermediate and advanced levels.
    The site does not say how long a class lasts, what it costs, or whether a trial class is offered,
    so ask those questions first. Workshops are another way in: an introduction for children ages 7 to
    12, a technique session for adults, and a family workshop for mixed ages.'
  first_visit_tips:
  - Ask for the studio address and class times, since neither is published.
  - Ask whether a trial class is offered; the site does not say.
  - Watch the events page for free public performances, which the group lists by date.
