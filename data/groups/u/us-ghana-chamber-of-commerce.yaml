summary: A membership trade group that links businesses in the United States and Ghana. It runs trade
  missions, business summits and open community gatherings, and a youth volunteer program for high school
  students.
what_you_do: Members get trade, investment and networking help and can join trade missions. Public gatherings
  are open with registration when one is listed, and tri-state high school students can volunteer at large
  Philadelphia area events through the Youth Diplomats program.
