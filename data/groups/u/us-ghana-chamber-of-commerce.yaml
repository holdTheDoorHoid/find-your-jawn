first_step:
  how: Register for a public gathering through the registration link on the chamber's events page when
    one is listed, or compare the membership levels on the membership page before you join.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Membership is aimed at businesses and professionals and costs $50 or more, and the events calendar
    showed no listed events when checked. Public gatherings open with registration, so the way in depends
    on the next event.
  what_to_expect: Some public gatherings have included live music, food, networking and a raffle. Membership
    payments go through an outside payment page, so check the level and price first. Event registration
    runs through a separate ticket link.
  first_visit_tips:
  - Public gatherings use a separate registration link on the events page, not the membership payment
    page.
  - The Youth Diplomats program takes applications through a Learn More link, and the page does not list
    ages or steps.
  - The chamber lists an office in Philadelphia, but no street address is printed on the pages read, so
    ask before you visit.
