summary: Upper Holmesburg Civic Association is a Registered Community Organization (RCO) in the North
  Delaware part of the city. The City asks developers to talk with RCOs about nearby zoning and building
  plans, so this is a way for neighbors to have a say.
what_you_do: Volunteers work on local issues and look for practical solutions with city leaders and elected
  officials. The association meets monthly and invites people who live or work in Upper Holmesburg to
  take part.
