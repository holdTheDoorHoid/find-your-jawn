summary: The volunteer civic association for Upper Roxborough and a registered community organization.
  It meets every second Wednesday at Roxborough Church, and new neighbors are welcome to come to a meeting
  and get to know the board.
what_you_do: Neighbors meet with the board to talk over neighborhood matters, pay dues of $25 per household
  or $50 per business, and volunteer, especially on fundraising, events and technology.
