summary: A Philadelphia performing arts group that teaches acting, dance, and voice to young people and
  adults, and stages shows about real social issues.
what_you_do: Take a weekly class in acting, dance, or music, or audition for a youth company. Audiences
  can attend the group's events, such as an artist showcase and a murder mystery dinner.
