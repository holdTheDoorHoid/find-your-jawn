  what_to_expect: Classes meet once a week, and each student picks acting, dance, or music. The group
    describes its younger classes as building structure and confidence, and its older classes as building
    performance skills and preparing for work in the arts. The site does not list class prices, so ask
    before you sign up.
  first_visit_tips:
