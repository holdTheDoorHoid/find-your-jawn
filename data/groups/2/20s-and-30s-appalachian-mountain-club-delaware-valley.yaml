summary: The young adult group of the Appalachian Mountain Club's Delaware Valley chapter, for people
  in their 20s and 30s. It runs hikes, bike rides, paddling and social outings, and you do not need an
  AMC membership to take part.
what_you_do: Find a 20s/30s outing in the AMC activities database, filtered for the Delaware Valley chapter,
  then register and go. Outings include hikes, bike rides, paddling, trail work, backpacking and indoor
  climbing, plus social outings such as picnics and brewery stops. You can also join the group's mailing
  list by email.
