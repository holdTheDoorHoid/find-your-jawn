first_step:
  how: Watch the July 4 parade, or come to the veterans concert and picnic at Gorgas Park. To march, email
    21stward4thjuly@gmail.com after reading the Participants and Parade Rules pages.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: Watching the parade and the public park events is open to anyone. The pages give no steps for
    joining a parade unit beyond an email, and special units need advance approval, so the way in to marching
    is unclear.
  what_to_expect: The parade starts at 9 a.m. on July 4. The veterans concert and picnic features a concert
    band, classic cars, a costumed mascot and a live bald eagle, food for sale, and activities for children
    on the Gorgas Park playground. Anyone can attend, and the page does not say how long the parade lasts.
  first_visit_tips:
  - If you are a veteran, arrive before 10 a.m. at the veterans event.
  - 'Marchers: bicycles, motor vehicles and special units need advance approval, and throwing candy or
    other items to the crowd is banned.'
  - Email the association with questions at 21stward4thjuly@gmail.com.
