summary: Runs a neighborhood Independence Day parade in Northwest Philadelphia that the group says dates
  back to 1831, with a park party and veterans events through the year.
what_you_do: 'Watch the July 4 parade or join the veterans concert and picnic at Gorgas Park. To march,
  email the association first: the participants listed on the site are churches, veterans and Masonic
  groups, among others, and special units need advance approval.'
