summary: A live action roleplay group that plays costumed games with foam gear. Its core event is a Saturday
  afternoon Capture the Flag game at Clark Park, and it also runs camps and teaches members to craft foam
  swords and props.
what_you_do: Join the Saturday Capture the Flag game at Clark Park, try one of the camps, or learn to
  craft foam props with the group.
