first_step:
  how: Sign the participant waiver linked on the Our Programs page, then come to a Saturday Capture the
    Flag game at Clark Park. Games start at 1 pm.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The site says it serves people new to live action roleplay, trains new recruits, and asks for
    a signed waiver before the weekly game.
  what_to_expect: A game runs about three hours on Saturday afternoon. Players form teams and try to take
    each other's flag using foam play gear, with no referees, so players are trusted to play fair. The
    group supplies equipment, but the site does not say what a first-timer pays.
  first_visit_tips:
  - Sign the waiver before you come, since every player needs one
  - Bring yourself; the group supplies the foam equipment
  - Follow the group on Facebook or Discord for game updates
