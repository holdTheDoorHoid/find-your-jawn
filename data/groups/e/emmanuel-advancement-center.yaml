first_step:
  how: Fill in the Request More Information form for Education or Career Planning & Placement, or call
    215-874-3282 or toll-free 800-322-6942 to ask about tutoring or career help.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Each program starts with a request form. The site gives no eligibility rules, fees, or steps
    after a request, so the way in is unclear, although phone lines are listed.
  what_to_expect: Tutoring is one-on-one with a certified instructor, with a personal assessment plan
    and progress reports, focused on reading and math. Career help includes planning, resume writing,
    mentoring, job search help and workshops. The site does not say how long sessions last, where they
    happen, or what they cost.
  first_visit_tips:
  - Ask on the phone whether sessions are in person or online, since the site does not say.
  - The office is at 5132 N 4th St., and the site does not describe parking or transit.
