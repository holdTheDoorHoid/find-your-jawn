  how: 'Email extendedplayinc@gmail.com with a short description of your socially conscious film and what
    you need: funding, screenings, or distribution.'
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The only way in is an email, and the site does not say how projects are chosen.
  what_to_expect: This is not a class or a drop-in group. You send an email about a socially conscious
    film project and say whether you need funding, screenings or distribution. The site does not say how
    projects are chosen or how quickly the group replies, and fiscal sponsorship takes 5% to 10% of a
    grant.
  first_visit_tips:
  - Have a few lines ready about your film's goal, its stage, and the help you need.
  - Ask about the fiscal sponsorship fee before you commit, since it takes 5% to 10% of a grant.
  - The past projects page shows the kinds of films the group has backed from 2020 to 2025.
