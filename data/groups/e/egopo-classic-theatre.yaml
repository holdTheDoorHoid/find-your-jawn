first_step:
  how: Buy a single ticket for a show on the Buy Tickets page of the EgoPo website, or start with the
    $80 Basic Subscription, which includes one ticket each to three shows.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Anyone can buy a ticket to a public show, and volunteers can reach the company through a contact
    sheet on its site.
  what_to_expect: A visit is a night at the theater for one of the season's limited runs. Some shows have
    few tickets, and subscribers get priority on those, so buy early. Memberships start at $80, and single-ticket
    prices are not listed on the site.
  first_visit_tips:
  - For Company, the page says you may bring a blanket, pillows and pajamas, which are optional.
  - The box office is open Monday to Friday, 10 am to 4 pm, and from 10 am to 2 pm in the week of a performance.
  - Shows can be held at other venues, so check the venue for each show before you go.
