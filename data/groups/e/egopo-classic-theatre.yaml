summary: A Philadelphia theater company that stages its own productions each season. Single tickets, subscriptions
  and memberships let people see the season's shows, and volunteers help with productions and public events.
what_you_do: See a show by buying a single ticket, a subscription or a membership, which adds tickets
  and a drink package. Volunteers help with productions and public events, and the page lists free concessions
  and free tickets as perks.
