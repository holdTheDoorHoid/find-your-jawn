first_step:
  how: Register through the Zoom link on the Community Impact Committee page, then attend its third Monday
    meeting from 7 to 8 pm.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Meetings are on Zoom with a registration link, and the site invites neighbors to join through
    an online membership application. The site does not say outright that the committee is open to all.
  what_to_expect: The office is open Tuesday and Thursday from 10 am to 2 pm, and other visits are by
    appointment. The meetings listed on the site are on Zoom, and one project meeting asked people to
    register in advance. The site does not state a cost or how long a meeting runs.
  first_visit_tips:
  - 'Register first: the Zoom link goes to a registration page.'
  - Office hours are Tuesday and Thursday, 10 am to 2 pm; other days need an appointment.
  - Membership is an online application that the site links from its join page.
