summary: A neighborhood group the City of Philadelphia has registered to be consulted on zoning and development
  in the Upper Northwest part of the city, East Mt. Airy Neighbors gives neighbors a place to hear about
  projects and respond.
what_you_do: Members follow zoning and development plans in the area and meet to talk them over. Volunteers
  can also serve as ambassadors who represent the group at city board meetings and public hearings, such
  as the Zoning Board of Adjustment and City Council.
