summary: An advocacy group that opposes polluting energy and waste facilities and promotes zero waste,
  wind, solar, and energy storage. It maps facilities nationwide and helps local residents organize against
  threats in their own communities.
what_you_do: Sign up for news and activism invitations, join an issue email list, help research or write
  fact sheets, or help map polluting facilities. The group also takes applications for its board and asks
  people who want to be members to send a pledge form.
