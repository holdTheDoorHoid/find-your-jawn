first_step:
  how: Fill in the sign-up form on energyjustice.net with your name, contact details, ZIP, and the kinds
    of help you want, or email niaby@energyjustice.net to ask about joining a list or helping with research.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The sign-up form and the Get Involved page are public and list several clear ways in, but the
    site lists no meetings and does not say what happens after you sign up.
  what_to_expect: The site does not describe a first visit, and it lists no meetings, events, or drop-in
    times. Signing up adds you to the group's news and invitations, and the form asks which kinds of help
    interest you. Phone and email are the other ways in that the site names.
  first_visit_tips:
  - Name the local threat you care about in the form's comment box, which takes up to 180 characters.
  - Ask by email or phone which meetings are open to new people before you plan a trip to 1434 Elbridge
    St, since the site does not say whether the office takes visitors.
