  newcomer_friendliness: 4
  basis: The FAQ says singers of all skill levels are welcome with no audition, and anyone can attend
    the first rehearsal of a season to try singing before registering.
  what_to_expect: Rehearsals run about 90 minutes and are led by a professional choral conductor, in four-part
    harmony. Singers may sit or stand during rehearsals and may sit during concerts. Fall concerts are
    usually in December, and the chorale's concerts are free and open to the public.
  first_visit_tips:
  - Come to the first rehearsal of the season to try singing; after the first week, singers must be registered.
  - Ask about tuition assistance before you register, since the amount is not posted.
  - Call 301-261-5747 on a weekday for questions. It is the Encore Creativity office in Washington, DC,
    open 9 am to 5 pm Eastern.
