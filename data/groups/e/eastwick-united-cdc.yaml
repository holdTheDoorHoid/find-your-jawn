summary: Eastwick United CDC is a group of Eastwick residents working on local issues such as flooding,
  the Amazon warehouse on Elmwood Avenue, and the Hilco refinery cleanup. It is also a City-registered
  community organization. Its website lists no upcoming meetings, and its newest dated news is from April
  2022.
what_you_do: Review local issues, such as proposed developments and flooding, and join the discussion
  on the group's issue pages.
