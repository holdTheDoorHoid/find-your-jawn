  newcomer_friendliness: 2
  basis: The site lists no upcoming meetings, events or volunteer roles, and its only listed way in is
    a contact form, so the way to join is unclear.
  what_to_expect: The last meeting listed on the site, in 2021, ran an hour on Zoom in the evening and
    let neighbors meet the board of directors. No current date is posted, so ask before you plan to attend.
  first_visit_tips:
