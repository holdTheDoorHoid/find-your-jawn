summary: A nonprofit that supports families after a hit and run crash, with help for funeral and medical
  costs, family advocates for court hearings, and a crisis team that meets with families. It also lists
  a push for safer neighborhoods.
what_you_do: Call or text to volunteer, or email to set up an appointment for help. A crisis response
  team meets with families after a hit and run. Start your own online fundraiser for the group, or join
  the Women of Strength money and business workshops.
