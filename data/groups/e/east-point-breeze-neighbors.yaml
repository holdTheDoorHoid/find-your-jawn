summary: A City-registered neighborhood group for the Point Breeze area. Neighbors join committees on
  zoning, outreach, technology, cleanups and public safety, and the group holds general meetings and community
  events.
what_you_do: Members join committees such as Planning and Zoning and Clean & Green, attend general meetings
  and community events, and help elect the board, which members in good standing choose.
