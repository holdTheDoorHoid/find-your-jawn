first_step:
  how: Text the keyword epbn to 77948 or join the monthly email newsletter to get meeting and event notices,
    then come to a general meeting.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The site invites area residents and property owners to general meetings and offers reminder sign-ups,
    but it gives no meeting dates or place, so the first way in is not clear until you sign up.
  what_to_expect: 'The site does not give meeting dates, times, places or a Zoom link, and it does not
    say whether people who do not live or own property in the area may attend. It lists five committees
    you can join: Planning and Zoning, Community Outreach, Technology, Clean & Green and Public Safety.
    The site mentions no dues or fees.'
  first_visit_tips:
  - Ask for the next general meeting date through the contact page before you go, since the site lists
    none.
  - Ask a committee chair, listed on the contact page, how and when that committee meets.
  - If zoning is your interest, read the group's Zoning and Planning Information page first, as the site
    asks.
