summary: El Concilio is a nonprofit that runs education, workforce and family services in Philadelphia.
  It also organizes the annual Puerto Rican Day Parade on the Benjamin Franklin Parkway each fall.
what_you_do: Volunteers sign up with an online form on the website. Groups that want to march apply in
  a yearly window; the 2025 window was closed when the parade page was read.
