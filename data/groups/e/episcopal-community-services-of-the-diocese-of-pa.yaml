summary: ECS Philly works to reduce poverty in Philadelphia, mostly in West Philadelphia, with a food
  pantry, housing help, one-on-one coaching, after-school enrichment, and monthly community dinners. The
  City also lists it as a Neighborhood Advisory Committee that ECS leads.
what_you_do: Volunteers help cook for a community meal, sort and hand out groceries at the food pantry,
  lead activities, help with after-school programs, and give mock job interviews, mainly at the St. Barnabas
  Community Resource Center.
