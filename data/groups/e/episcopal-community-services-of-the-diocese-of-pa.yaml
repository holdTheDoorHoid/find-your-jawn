first_step:
  how: Fill out the volunteer interest form on the Get Involved page, then ask about the next monthly
    Community Dinner before you go.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Volunteering starts with a public interest form, and the monthly dinners are described as community
    meals, but the site does not say whether anyone can walk in to a dinner.
  what_to_expect: Volunteers might cook for a community meal, set up and hand out groceries at the food
    pantry, lead an activity, or help with after-school programs. Community Dinners are monthly meals
    meant to build trust and connection among neighbors. Most of the events listed for this fall are free.
  first_visit_tips:
  - Ask first whether the monthly dinner is open to walk-ins, since the site does not say.
  - Call (215) 351-1400 to confirm place and time, because many listed events do not give a location.
  - Name the roles you prefer on the volunteer form, such as the food pantry or mock interviews.
