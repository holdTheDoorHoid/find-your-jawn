first_step:
  how: Complete the audition form on the audition page (name, age, voice part, email, and phone are required),
    or watch the events list for an Open Sing-In and sing with the choir for a day.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The audition page says singers at any level are welcome and explains how to sign up. Membership
    is by audition, but Open Sing-Ins are a public one-day way to sing with the choir.
  what_to_expect: 'The audition has five parts: a warm-up, a piece you choose, sight reading, pitch memory,
    and quartet singing, with the quartet scores and tracks provided before the audition. Members rehearse
    on Saturdays from 1 to 3 pm at the Cathedral Basilica. The site lists past audition dates but not
    the next one, and it gives no fee for auditions or Open Sing-Ins.'
  first_visit_tips:
  - Prepare a piece that shows your best choral singing, since you choose it for the audition.
  - Watch the events list for the next Open Sing-In, since the site does not say what to bring.
  - Email epiphanysingersphila@gmail.com with questions about Open Sing-Ins or auditions.
