summary: A non-profit choir of young adults in Philadelphia that sings traditional and modern choral music.
  Singers join through an audition, and the choir holds Open Sing-Ins where people can sing with the group
  for a day.
what_you_do: Sing in the choir after an audition, or come to an Open Sing-In to try it for a day. Concerts
  are open to the public, and tickets are sold for some of them.
