  basis: The membership page exists, but it does not say who can join, what the steps are, or what it
    costs, so the way in is unclear. Public celebrations are announced, and the office has posted hours
    and a phone line.
  what_to_expect: The office is open Monday to Thursday from 10 am to 2 pm, which is the time to call
    or visit. Public celebrations have featured music, cultural dance, vendors, and food. The site does
    not describe membership meetings, dues, or what a new member does, so ask before you join.
