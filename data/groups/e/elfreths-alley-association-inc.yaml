summary: Keeps Elfreth's Alley and its history in view. The association runs a small museum in two of
  the Alley's houses, leads guided tours, and holds events such as a fall makers market and a December
  holiday event.
what_you_do: Volunteers greet visitors and share Alley history, help run events like the makers market
  and Deck the Alley, or do project work such as garden upkeep, building care, and archives. Anyone can
  visit the museum or join a guided tour.
