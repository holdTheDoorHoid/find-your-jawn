first_step:
  how: Visit the museum or join a 2:30 pm Saturday or Sunday guided tour, or fill out the volunteer interest
    form on the Volunteer with Us page
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The volunteer page says no history background is needed, training is provided, and new volunteers
    get a packet of common questions. Visits and tours need no sign-up.
  what_to_expect: A tour lasts about 40 minutes with an expert guide, and it covers the full length of
    the Alley and Bladen's Court, with entry to both museum houses. Tickets are bought in person, so plan
    to pay at the door. Volunteers mostly greet visitors, share Alley history, help at events, or work
    on garden, building or archive projects.
  first_visit_tips:
  - Tours start at 2:30 pm on weekends, so arrive a few minutes early
  - Bring cash or a card, since online ticketing is not offered
  - Ask the museum about stairs and access before you go, because the site does not cover it
