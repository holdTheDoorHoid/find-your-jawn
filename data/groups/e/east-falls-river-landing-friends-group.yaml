summary: A volunteer-led Friends group for the East Falls River Landing, a public boat launch on the Schuylkill
  River at Kelly Drive in East Fairmount Park. The East Falls Development Corporation helped form the
  group and still supports it.
what_you_do: Help with volunteer days at the landing, which the group holds with Parks and Recreation
  and the Fairmount Park Conservancy. Ask the group how to join the next one.
