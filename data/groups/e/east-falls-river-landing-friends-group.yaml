first_step:
  how: Email efrlfg@gmail.com and ask to be added to the list for the next volunteer day at the landing.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: Volunteer days are open to neighbors, but no schedule or sign-up page was found, so the way in
    is by email and is not clearly marked.
  what_to_expect: Volunteer days at the landing are work sessions with neighbors and partners such as
    Parks and Recreation and the Fairmount Park Conservancy. No page we could read gives the dates, the
    length or what to bring, so ask the group before you come.
  first_visit_tips:
  - The lot's listing warns that a left turn into it from westbound Kelly Drive is often hard and is not
    allowed on weekdays from 4 to 6:30 pm, so plan to approach from the other direction at those times.
  - Confirm the meeting spot and the time by email before you come.
