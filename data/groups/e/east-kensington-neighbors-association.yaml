summary: East Kensington neighbors who meet once a month to share concerns and run committees for cleanups,
  greening, youth programs, historic preservation, and zoning. A member can join a committee or simply
  come to the monthly meeting.
what_you_do: Join a committee (cleanups and community affairs, greening, youth and education, historic
  preservation, zoning, or green space), or come to the monthly meeting to raise concerns and hear updates.
