first_step:
  how: Come to the monthly general meeting on the 3rd Monday at 7 pm, and say you are new, since the agenda
    opens by welcoming new residents. To ask first, email info@ekna.org.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The meeting agenda starts by welcoming new residents, the meeting is open to all with no fee,
    and the group's pages say how to attend.
  what_to_expect: The general meeting starts at 7 pm and the community calendar lists it ending around
    8:30 pm. The agenda opens with a welcome to new residents, then officer reports, cleanup and greening
    news, a quarterly crime report from the local police precinct, and an open forum for neighbors. There
    is no membership fee to attend.
  first_visit_tips:
  - Arrive a few minutes before 7 pm to find a seat.
  - Say you are new when you arrive, since the agenda welcomes new residents.
  - To join by Zoom, register ahead and have proof of an East Kensington address or business.
  - There is no meeting in August, so plan around that.
