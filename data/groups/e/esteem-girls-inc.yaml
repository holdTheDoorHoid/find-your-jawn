summary: A nonprofit that runs hands-on STEM activities for girls in grades 3 to 8, both after school
  and on Saturdays.
what_you_do: Girls do hands-on science, technology, engineering and math work with program staff. STEM
  Afterschool runs on weekdays from school dismissal to 6 pm, and STEM Saturday meets on second Saturdays.
  Afterschool pickup is offered from select schools. Adults can also volunteer as ambassadors, event helpers,
  guest speakers, or behind-the-scenes helpers.
