first_step:
  how: Fill in the interest form linked from the programs page for STEM Afterschool or STEM Saturday.
    The same form is used for all three programs.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Enrollment for girls in grades 3 to 8 in the service area runs through a public interest form,
    but the site does not describe a first day or a waitlist.
  what_to_expect: Girls work in teams and on their own on hands-on STEM projects with program staff. STEM
    Afterschool combines STEM activities, academic support, leadership, and career exploration, and STEM
    Saturday has a new hands-on theme each month with experiments, engineering or robotics challenges,
    and coding. Families who qualify for ELRC or CCIS childcare help pay nothing.
  first_visit_tips:
  - Check whether your child's school is on the afterschool pickup list, which names William McKinley,
    Julia de Burgos, Conwell Middle School, Sankofa Freedom Academy, and Mariana Bracetti Academy.
  - Ask how pickup works, since the programs page does not explain it.
  - Ask about ELRC or CCIS childcare help when you fill in the interest form, since it can make the program
    free.
