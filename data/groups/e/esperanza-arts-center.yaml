  newcomer_friendliness: 3
  basis: Events are public and sold through ticket links, and the site has a first time guests page. Workshops
    list only a contact email.
  what_to_expect: Most people dress smart casual, and jeans are fine. The theater is kept cool, so bring
    a layer, and tickets are non-refundable. Events listed so far run about two hours.
  first_visit_tips:
  - Bring a layer, since the theater is kept at 70 to 74 degrees and can feel cool even in summer.
  - Check your ticket details at purchase, because tickets are non-refundable.
  - Park in the free lot at 406 West Bristol Street, or take the Route 47 bus to 5th and Bristol.
  - Read the House Rules page before you go, since it covers expected behavior.
