summary: The Latino arts and culture center in North Philadelphia. It presents music, dance, theater,
  film and art from Latin America and the Caribbean, with family and community events.
what_you_do: Buy a ticket to a dance, music, film or family show, go to a gallery opening, or apply to
  the open call for artists. The center also runs workshops for neighborhood students and families, and
  the site gives no sign-up steps for them.
