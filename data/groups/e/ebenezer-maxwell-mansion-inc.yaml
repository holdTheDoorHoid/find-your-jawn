first_step:
  how: Come on a Friday, Saturday or Sunday for a tour at noon, 1, 2 or 3 pm for $10 per person. You can
    reserve online, or call (215) 438-1861.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The volunteer page says you do not need a history background, that the museum trains docents,
    and how to apply through an online form. Tours are open to the public for a fee.
  what_to_expect: A tour walks through a restored house from about the 1860s to the 1910s, with stories
    about the household on each floor. The site does not say how long a tour takes, so ask when you book.
    Reservations are encouraged on weekends and required for Thursday tours.
  first_visit_tips:
  - Ask about parking and the nearest transit stop when you book, since the site gives no directions.
  - Ask how long a tour lasts and whether children are welcome, since the site does not say.
