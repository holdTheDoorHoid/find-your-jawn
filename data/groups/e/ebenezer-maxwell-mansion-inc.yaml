summary: A Victorian house museum in Germantown that shows nineteenth century home life through its rooms,
  gardens and collections. It also runs guided tours, live Victorian theatre, lectures and family events.
what_you_do: Take a guided house tour, come to the free or paid concerts, theatre shows and family events,
  or volunteer as a docent through the museum's volunteer page.
