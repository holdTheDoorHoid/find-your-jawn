summary: A Catholic parish at 11th and Jackson Streets in South Philadelphia. It holds Sunday and weekday
  Masses, and some of its Masses have sign language interpreting, including a hearing-impaired Mass on
  the second and fourth Sundays.
what_you_do: Come to Mass, which is free and open to all. Sign language interpreting is used at some weekly
  or monthly liturgies, so ask the parish which Mass has it that week.
