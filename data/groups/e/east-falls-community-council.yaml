first_step:
  how: Come to the next monthly meeting on the second Monday, or to the October 12, 2026 candidates night,
    which the site says is open to all. Join as a member through the online form if you want to vote.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: The site says council meetings are open to all East Falls neighbors and links an online membership
    form. It does not describe a newcomer welcome.
  what_to_expect: Meetings take place once a month on the second Monday, and any neighbor can sit in.
    Only current members vote, and member dues start at $10 a year. The October 2026 meeting is a candidates
    night where candidates or their representatives answer questions.
  first_visit_tips:
  - The site's listing for October 12, 2026 gives a 7 pm start but no room, so email info@eastfallscommunity.org
    to ask where it is held.
  - Membership is joined through an online form linked from the Join Us button, and the group's P.O. Box
    is on the site for mail.
