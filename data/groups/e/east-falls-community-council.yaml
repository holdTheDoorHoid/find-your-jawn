summary: An all-volunteer nonprofit, incorporated in 1975, that speaks for East Falls residents on zoning,
  development and neighborhood issues. It meets monthly and holds open forums, such as a candidates night
  before local elections.
what_you_do: Members follow zoning and development plans in East Falls and talk them over at the monthly
  meeting. Membership also brings a weekly events email, and only members vote at meetings.
