summary: A peer-led group in Philadelphia that runs mental health trainings, including the WRAP wellness
  planning seminar and Mental Health First Aid. It also offers forensic peer support and a small business
  training program.
what_you_do: Sign up for WRAP Seminar I on its seminar page, send the training request form to ask about
  Mental Health First Aid or other trainings, or join the mailing list for updates.
