first_step:
  how: Click Register Now on the WRAP Seminar I page to sign up for the online seminar, or send the training
    request form to ask about the next Mental Health First Aid course.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The WRAP Seminar I page says no prior experience is needed and has a Register Now button. It
    does not say the seminar is limited to any group.
  what_to_expect: WRAP Seminar I is four online sessions of about 4.5 hours each, with breaks, led by
    certified WRAP facilitators. You set your own wellness goals and build a personal plan with practical
    tools and action steps. A full Mental Health First Aid session lasts about 8 hours, and the course
    includes role-play practice.
  first_visit_tips:
  - Plan for an online session, since the WRAP seminar is held online only, so you need a device and an
    internet connection.
  - Budget $350 plus $30 to $40 for materials for WRAP Seminar I, as the site lists.
