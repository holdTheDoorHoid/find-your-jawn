summary: 'A Baptist church with two Philadelphia locations: Enon East on West Cheltenham Avenue and Enon
  West on West Coulter Street. Neighbors can join Sunday worship at either campus, a Thursday night young
  adult Bible study, or a young adult fellowship that meets the second weekend of each month.'
