first_step:
  how: Come to Sunday worship at 10:30 am at 3800 Vaux Street. For the Thursday small groups, sign up
    through the linked form on the site.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The worship page says visitors are glad to be there, and the All Saints event says non-religious
    visitors are welcome; the Thursday groups have a clear sign-up form.
  what_to_expect: Sunday worship starts at 10:30 am in the sanctuary, with traditional hymns, choral music,
    printed liturgy and prayer. Dress ranges from Sunday best to jeans, and children may stay in the sanctuary
    or go to Sunday School after the children's sermon. Communion is served on the first Sunday of each
    month, and servers bring it to people who cannot come forward. The nursery is staffed by two background-checked
    adult caregivers.
  first_visit_tips:
  - Online worship is also available; the site has a sign-up link at the top of the page.
  - The site gives no parking or transit details, so check the route before you go.
