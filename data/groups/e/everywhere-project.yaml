summary: A Philadelphia harm reduction group that hands out food, clothing, and safer use supplies, teaches
  overdose reversal, and works to lower stigma against people who use drugs.
what_you_do: Help on the Wednesday and Saturday outreach, cook meals from home for the outreach, make
  harm reduction kits on Thursday evenings, or drop off gently used clothing. The volunteer survey is
  now closed, so questions go through the contact form.
