first_step:
  how: Pick a workshop on the upcoming events calendar and register on its page, or call the Philadelphia
    office at 215.545.3100 to ask about the Start It Grow It program.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The site says it meets people where they are in experience, and its Start It Grow It program
    is aimed at people starting a business, with a clear way to register or call.
  what_to_expect: Most sessions are short workshops on topics such as online marketing, managing money,
    and getting a loan, and you register on each event page. One-on-one coaching needs an application
    and depends on availability. The site does not give the length or cost of most sessions, so ask before
    you come.
  first_visit_tips:
  - Register on the event page before you go, since walk-ins are not described.
  - Call 215.545.3100 to ask the cost and the room for the session you want.
  - The contact page lists a second Philadelphia address, 400 Market Street, Suite 210, with no note on
    which is current, so confirm before you visit.
