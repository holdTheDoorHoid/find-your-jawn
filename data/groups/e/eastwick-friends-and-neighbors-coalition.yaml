summary: The Eastwick Friends & Neighbors Coalition is a group of neighbors who work on flooding, the
  Clearview Landfill cleanup, and the refinery land. It has posted public meetings and news since 2012,
  but its newest posts are from 2022, so check before you plan to come.
what_you_do: Send flooding reports, environmental concerns, and local news to the coalition, follow its
  updates by email, and join one of its action committees.
