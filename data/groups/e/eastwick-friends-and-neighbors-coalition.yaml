first_step:
  how: Sign up for updates with the Follow Blog via Email form on the coalition's blog home page.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The site invites people to join email updates and an action committee, but it lists no current
    meetings or volunteer roles and gives no direct contact, so the way in is unclear.
  what_to_expect: Past public meetings were posted as open to all and usually ran about two hours on weeknights,
    mostly in person at local venues. The newest posts are from 2022 and no upcoming meeting is listed,
    so ask before you plan to come.
  first_visit_tips:
  - Read the newest posts on the blog first, since the most recent items are from 2022.
  - Bring your flooding or environmental questions, since those are the coalition's main topics.
