first_step:
  how: Pick a talk from the events page and use its Zoom link, or go to an in person talk at the Falls
    of Schuylkill Library meeting room. For the October 31, 2026 walking tour, email eastfallshistory@gmail.com,
    since the page gives no meeting place or sign-up steps.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Talks and tours are open to the public with dates on the events page and a way to join by email
    or mail, though the site does not say it welcomes newcomers; some past tours needed booking ahead.
  what_to_expect: Talks are given by a speaker, either on Zoom or at the library meeting room, and many
    are free. Walking tours run about an hour and a half to two hours in the morning, and members present
    their research on the places you visit.
  first_visit_tips:
  - Bring cash for a walking tour, since past tours were paid in cash at the start.
  - Email the society before the October 31, 2026 tour to learn the meeting place and time.
