summary: A collective that pairs political education with organizing, helping people make sense of the
  world and work toward change together.
what_you_do: Runs political education workshops and trainings, often built with partner organizations
  and groups, using games, storytelling, and small group work. It also offers facilitation help to groups
  that want to work in a more shared way. Its listed trainings give no dates, audience, or cost on the
  pages we read, so email to ask about the next one.
