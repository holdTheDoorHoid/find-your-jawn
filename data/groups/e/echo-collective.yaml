first_step:
  how: Email echocollective@proton.me and ask how to join the next workshop or training. The agenda page
    showed no dated sessions when we checked.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The only public way in is an email, and the offers listed are mostly trainings and programs built
    with organizations and groups, with no open sessions named.
  what_to_expect: The site describes its sessions as hands on and participatory, with people learning
    through games, storytelling, small group work, and shared reflection. The listed trainings run one
    week or three days on topics such as ecological breakdown and utopian thinking, but the pages do not
    say who can attend or what a first session is like.
