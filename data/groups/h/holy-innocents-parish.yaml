summary: A Catholic parish in Hunting Park with Masses in English, Spanish and Vietnamese. It also runs
  a food pantry and a Monday afternoon group for seniors.
what_you_do: Come to Mass in English, Spanish or Vietnamese. The parish also runs a food pantry (last
  Thursday and Friday of the month), a senior group that meets Monday afternoons, and religious education
  for children and youth. Adults who want to join the Catholic Church can ask about OCIA classes.
