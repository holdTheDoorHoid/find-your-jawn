first_step:
  how: Come to any listed Mass, or call the rectory at 215-743-2600 or email holyinnocents@comcast.net
    to ask about religious education, youth groups, the food pantry, or OCIA.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: Mass is open to anyone, and the parish publishes a phone number and an email. The adult faith
    classes page is dated 2024, so those details may be out of date.
  what_to_expect: Mass is free and open to anyone. Sunday Masses run at 7:30 and 10 am in English, noon
    in Spanish and 5 pm in Vietnamese, so choose the one in your language. The site does not say how long
    Mass takes or what happens afterward, so call the rectory with questions before you go.
  first_visit_tips:
  - Weekday Mass in summer is at 8 am only.
  - The Saturday vigil is at 4:30 pm in English and 6:30 pm in Spanish. Confession is Saturdays from 3:30
    to 4:30 pm.
  - The church is at L Street and Hunting Park Avenue. The rectory is at 1337 E. Hunting Park Avenue.
