schedule:
  text: Saturday vigil Mass at 4:30 pm in English and 6:30 pm in Spanish. Sunday Masses at 7:30 and 10
    am in English, noon in Spanish, and 5 pm in Vietnamese. Weekday Mass at 6:30 and 8 am, or 8 am only
    in summer. Confession Saturdays from 3:30 to 4:30 pm. The St. Joan of Arc worship site has Sunday
    Masses at 9 am in English and 11:30 am in Spanish.
