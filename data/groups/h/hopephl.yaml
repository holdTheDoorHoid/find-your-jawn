first_step:
  how: Ask Kevin Brown at 267-777-5820 for the link to the online Bridges to Wealth meeting, held the
    second Monday of each month at 5 pm.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The site lists open online meetings and a named contact for the link. It implies residents are
    welcome but does not say so outright or give eligibility rules.
  what_to_expect: The meetings we found are online, so you join from a phone or computer once you have
    the link. The page does not say how long a meeting runs or how many people usually attend. One-on-one
    appointments with the neighborhood staff are open Monday to Friday, 9 am to 5:30 pm, for help with
    things like property tax relief or utility bills.
  first_visit_tips:
  - Call the main line, (267) 720-HOPE, or Kevin Brown at 267-777-5820 before a meeting to get the link.
  - For an appointment, bring the bill or notice you want help with.
  - The office is at 325 N. 39th Street, Philadelphia, PA 19104. The site gives no parking or transit
    details.
