summary: HopePHL serves as a Neighborhood Advisory Committee for the City of Philadelphia, linking residents
  in the West part of the city to services and giving them a voice.
what_you_do: Work with neighbors and the City on local services and what the area needs. Its neighborhood
  staff also help residents one on one with property tax relief, 311 requests, utility bills, and reporting
  litter or vacant lots.
