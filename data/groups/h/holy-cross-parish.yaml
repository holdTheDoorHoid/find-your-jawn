summary: A Catholic parish in Mount Airy with Sunday Masses, a Saturday evening Vigil Mass, and a parish
  school on East Mount Airy Avenue. A food pantry on East Mount Airy Avenue is also listed.
what_you_do: Come to Mass, or call the parish office to ask about groups such as the Legion of Mary, Stewards
  of Our Earth, the greeters and ushers team, or the Ladies Guild. The parish's HOPE Food Pantry serves
  neighbors, but the site gives no hours.
