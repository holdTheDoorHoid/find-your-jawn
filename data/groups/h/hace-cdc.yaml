summary: HACE CDC is the registered community organization for part of Fairhill and St. Hugh. It holds
  public virtual meetings where residents hear about development projects that need zoning changes, and
  they can weigh in before the city decides.
what_you_do: Go to the virtual community meetings, ask questions about zoning and development plans, and
  share your view. The group sends a summary letter to the city before the Zoning Board of Adjustment
  hearing.
