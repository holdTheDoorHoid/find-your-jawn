first_step:
  how: Email Stasia Monteiro at smonteiro@hacecdc.org to register for the next virtual community meeting.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Community meetings are open to residents, and the page gives one clear way in, which is to contact
    the program director. The page does not say who can become a member.
  what_to_expect: 'A first visit is a virtual meeting where a project is presented and residents discuss
    it. The page describes a set order: a preliminary meeting with the applicant, a community meeting,
    a committee vote, then a summary letter to the city. It does not say how long meetings run or whether
    anything costs money.'
  first_visit_tips:
  - Email the program director first to get the meeting link and the date.
  - Test your audio and camera before the call starts.
