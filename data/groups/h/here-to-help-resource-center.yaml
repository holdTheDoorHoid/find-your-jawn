summary: A help center for neighbors who need a hand with basic needs. It offers food, clothing, back-to-school
  supplies, help applying for grants and aid, job search support, and referrals to other services.
what_you_do: Ask for help with food, clothing, school supplies, aid applications, shelter, or job searching
  by phone, email, or the contact form. Volunteers and people joining programs use the Get involved page
  to apply.
