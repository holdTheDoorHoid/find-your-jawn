first_step:
  how: Call +1 267-344-8376 during office hours, or send the contact form on the Contact page and choose
    Use Program, Volunteer, or Donate.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Phone, email, a contact form and weekday hours are all listed on the contact page, so the way
    in is clear. Volunteers and people joining programs fill in an application first, so this is not rated
    4.
  what_to_expect: 'Tell the staff which help you need: food, clothing, school supplies, an aid application,
    or job search support. The site does not say what paperwork a service needs, how long it takes, or
    whether children can come without an adult, so ask those questions when you call.'
  first_visit_tips:
  - Call during the posted hours, which end at 3 pm on Fridays and Saturdays and at 4 pm on other weekdays.
  - If you want to volunteer or join a program, have photo ID, emergency contact details, and a signed
    background check authorization ready, since the application lists them.
  - Sunday is closed, so plan around the weekday hours.
