summary: A statewide group that works for affordable housing and eviction prevention. It follows state
  lawmaking, posts legislative updates, supports housing workers with training, and invites members of
  the public to take action on housing policy.
what_you_do: Read the legislative updates, take action on housing bills, and sign up for the newsletter.
  Members get free educational webinars and a discount on the Homes Within Reach Conference, and volunteers
  can serve on committees and boards.
