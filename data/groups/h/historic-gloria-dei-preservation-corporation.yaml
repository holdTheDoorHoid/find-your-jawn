  what_to_expect: A Great Talk lasts about an hour, from 7 to 8 pm, in the church sanctuary, given by
    a local history expert. Afterward the speakers join a meet and mingle in Riverside Hall where they
    answer questions and sign books. Tickets are required and are sold through the Get Tickets link.
  first_visit_tips:
  - Buy your ticket online through the Get Tickets link before you go.
  - Check the events page for how many seats are left.
  - Stay for the meet and mingle in Riverside Hall after the talk.
