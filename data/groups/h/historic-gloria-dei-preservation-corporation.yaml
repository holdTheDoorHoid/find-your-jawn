summary: Looks after Gloria Dei (Old Swedes') Church as a historic site. It hosts history talks and concerts,
  runs guided tours, and offers hands-on activities that help care for the church, its graveyard, and
  its grounds.
what_you_do: Attend a Great Talk or a concert, take a guided or self-guided tour, or join a community
  activity such as gravestone cleaning, native gardening, bird-watching, or a crafting session.
