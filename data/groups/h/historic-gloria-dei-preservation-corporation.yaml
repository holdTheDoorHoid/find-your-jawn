summary: Looks after Gloria Dei (Old Swedes') Church as a historic site. It hosts history talks and concerts,
  runs guided tours, and calls on volunteers for service days on the grounds.
what_you_do: Attend a Great Talk or a concert, take a guided tour, or join a community service day to
  help care for the church and grounds. A volunteer link on the website is the way to offer help.
