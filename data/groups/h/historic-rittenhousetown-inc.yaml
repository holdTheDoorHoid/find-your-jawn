first_step:
  how: Take a tour of the 1707 homestead on a select Saturday from noon to 3 pm, starting on the hour.
    If you want to help, email the volunteer address on the volunteer page to join a Wednesday morning
    work day.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Tours and Second Saturday visits are open to the public, and the volunteer page gives a clear
    email route for joining a work day.
  what_to_expect: A public homestead tour runs about 45 minutes and starts on the hour. Wednesday volunteer
    mornings, 9 am to noon, are outdoor work pulling invasive plants so native species can return across
    the 20-acre site. Tools and gloves are provided.
  first_visit_tips:
  - Arrive 5 to 10 minutes early at the Homestead entrance.
  - Parking is limited and on site. The main entrance is on Wissahickon Avenue.
  - Children under 8 go free on tours, according to the home page.
  - On volunteer mornings, bring water and bug repellent, since the work is outdoors.
