summary: A historic village in the Wissahickon area with a 1707 homestead, several historic houses, an
  arboretum, and a small museum. Visitors take tours, and volunteers and members help keep the site going.
what_you_do: Pull invasive plants on Wednesday morning volunteer days, take a Saturday tour of the homestead,
  become a member, or come to the free Second Saturday museum visits.
