summary: A Lutheran congregation downtown with Sunday worship, a food pantry on the second Wednesday of
  each month, and a 150th anniversary dinner planned for November 7, 2026.
what_you_do: Come to Sunday worship at 11 am, join the Monday Welcome Church Bible study at 11 am, or
  visit the food pantry on the second Wednesday of the month. Senior food boxes are handed out on the
  third Wednesday.
