summary: A walking group in the Hunting Park neighborhood that is part of the citywide We Walk PHL program.
  Most members are in their 60s to 80s, and the group has slow, medium and fast walks.
what_you_do: Walk with the group about three times a week, pick the pace group that suits you, and finish
  with a cool down. Newcomers can attend a group meetup or accept an invitation from a walker met on the
  route.
