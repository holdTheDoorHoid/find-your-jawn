summary: A grassroots group run by people in prison and their families. It campaigns against solitary
  confinement and harsh prison conditions, pushes for fairer sentencing and release, and helps people
  inside prepare for life after prison.
what_you_do: Sign up for a campaign through the Get Involved form, come to the monthly Toxic Prisons Campaign
  meetings or a Thursday letter-writing night, or read its quarterly magazine, The MOVEMENT.
