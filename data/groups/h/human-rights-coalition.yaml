first_step:
  how: Use the RSVP form linked on hrcoalition.org/events to sign up for the next Monday Toxic Prisons
    meeting or Thursday letter-writing night, or fill in the Get Involved form to join a campaign.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Both event series use public sign-up forms, and the Get Involved form is open to anyone. The
    page does not say the meetings are open to the public, so the rating stays at 3 instead of 4.
  what_to_expect: A Thursday letter-writing night runs 6 to 8 pm, with snacks and drinks provided, and
    you sign up through a form to get the location. The Monday Toxic Prisons Campaign meetings run 6 to
    7 pm, you RSVP through a form first, and the group's program director leads them. The site does not
    say how many people usually come.
  first_visit_tips:
  - 'RSVP first: the Monday meetings use an RSVP form, and the letter-writing location is sent only after
    you sign up.'
  - Snacks and drinks are provided at letter-writing nights.
