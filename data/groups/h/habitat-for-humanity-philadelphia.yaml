first_step:
  how: Create a GivePulse account, complete the required virtual orientation for new volunteers, then
    book a volunteer day in GivePulse.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The current individuals page lays out the steps, the FAQ says no construction experience is needed
    because training is on site, and the site welcomes all volunteers.
  what_to_expect: A build day runs 8:30 am to 3:30 pm, with a safety orientation at 8:30 am, so plan on
    the full day. You do not need construction experience, and training happens on site. Your task is
    set when you arrive, because the work depends on the stage of the house, and it can range from demolition
    to landscaping.
  first_visit_tips:
  - Wear sturdy closed-toe shoes and clothes you do not mind getting dirty.
  - Bring your own water and lunch. The lunch break is one hour.
  - Volunteers aged 16 and 17 cannot use power tools or work more than 10 feet off the ground.
