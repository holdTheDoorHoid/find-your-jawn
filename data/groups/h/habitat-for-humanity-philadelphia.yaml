summary: A housing nonprofit that builds and repairs homes with volunteers across Philadelphia and runs
  the ReStore. Individuals and groups can volunteer, and the page says all volunteers are welcome.
what_you_do: Build or repair homes on a full-day build shift, sort and stock donations at the ReStore,
  help in the warehouse, or join the Young Professionals volunteer network. Start with a GivePulse account
  and the virtual orientation.
