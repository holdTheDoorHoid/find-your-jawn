summary: A housing nonprofit that builds and repairs homes with volunteers across Philadelphia and runs
  the ReStore. Individuals and groups can volunteer, and the page says all volunteers are welcome.
what_you_do: Start on the Individual Volunteering page, or join the Young Professionals volunteer network.
  A 2026 Construction Sprint on October 20 and a Habi Hour on October 29 are listed on the home page.
  Pope Leo Village, an interfaith effort to build 26 homes, has no sign-up steps shown.
