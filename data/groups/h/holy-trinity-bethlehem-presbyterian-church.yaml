  basis: The church says all are welcome to come as they are, and its site has a visit page and a contact
    form for people who want to ask first.
  what_to_expect: Sunday worship is at 11 am in the sanctuary, and it is also streamed live on YouTube,
    Facebook and Zoom, so you can watch from home first. The site does not say how long the service runs,
    what to bring, or whether you need to sign up. The Friday morning prayer is about 15 minutes, and
    the site says all are welcome to pray with the church.
  first_visit_tips:
  - The church is at 1100 W. Rockland Street in the Logan neighborhood.
  - The church says to come as you are.
  - The church office is open Monday to Thursday, 9 am to 5 pm, if you want to call before you come.
