summary: The orchard and kitchen garden at Historic Strawberry Mansion in East Fairmount Park, planted
  with the Philadelphia Orchard Project. Community members are welcome to pick fruit from the orchard
  trees, and the mansion hosts workshops on using the fruit.
what_you_do: Pick fruit from the orchard trees as a community member (call first, since the site gives
  no picking rules), take a walk-in mansion tour, or email the mansion about volunteering in the gardens
  and orchard.
