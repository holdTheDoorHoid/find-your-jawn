  basis: Tours are walk-in and open to the public, and volunteer questions go to an email address, with
    no online form described.
  what_to_expect: Tours are guided and start on the hour, taking you through rooms of antiques, fine art
    and collectibles from the 18th and 19th centuries. The site does not say how long a tour takes. Volunteers
    work in the gardens and orchard, and the site describes no training or set hours.
  first_visit_tips:
  - Bring cash or a check, since the mansion does not take cards.
  - Ask about virtual tour options before you come if you cannot use the stairs.
  - Parking is free and off-street for up to 50 vehicles.
  - Take SEPTA bus Route 32 to the stop on 33rd Street near Dauphin Street.
