    register for an event or what one costs.
  what_to_expect: Events are one-off, hands-on sessions. The off-grid solar workshop covers the basics
    of how a small solar system works, and you build a small working system yourself. The site gives no
    cost or length for events, so ask through the contact page before you come.
  first_visit_tips:
