summary: A community lab based at Karakung Reef in West Philadelphia that tests climate ideas with neighbors.
  Its projects include solar installs, a heat shelter with solar-powered sprinklers, and hands-on solar
  and papermaking sessions.
what_you_do: Come to the lab's public events, such as the off-grid solar session (date to be announced)
  or a zine launch party. Subscribe to its email updates to hear when new events are scheduled.
