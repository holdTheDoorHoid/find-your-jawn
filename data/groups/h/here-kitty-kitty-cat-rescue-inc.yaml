summary: A Philadelphia nonprofit that rescues homeless and unwanted cats and places them in permanent
  homes, with help from volunteers and donors.
what_you_do: Volunteers can foster cats and kittens, help with transport, help with fundraising or social
  media, or join a street team that asks shops to host a cat in the window. You can also adopt a cat or
  kitten, donate, or send items from the wish lists. The Get Involved page lists the volunteer and foster
  steps.
