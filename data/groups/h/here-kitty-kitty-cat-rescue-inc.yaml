first_step:
  how: Send the volunteer or foster application from the Get Involved page at herekittykitty.org, or email
    info@herekittykitty.org, which the rescue says it usually answers within 24 hours.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Volunteering and fostering both start with an application form, and the site lists no orientation
    or meeting times, so the way in needs a step first.
  what_to_expect: The site does not describe an orientation, shift times, or a visiting day. Listed roles
    include fostering, where the rescue covers medical care, food and litter as needed, plus fundraising,
    social media, transport, and a street team that asks shops to host a cat in their window.
  first_visit_tips:
  - Email info@herekittykitty.org if the form is unclear, since the rescue usually replies within 24 hours.
  - Ask about shelter hours and any visiting rules before you travel, because the site does not list them.
