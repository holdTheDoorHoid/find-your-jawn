first_step:
  how: Call the 24-hour prayer line at 1-480-553-0487, or use the request form on the How Can We Serve
    You page, to ask for caregiver help or a referral.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: There is no group to join, since the site describes no meetings or volunteer roles. Help is by
    request, and the Benevolence Fund needs an online application and is for people 60 and older.
  what_to_expect: You ask for help rather than attend anything, and the ministry follows up on your request.
    If a Benevolence Fund request is approved, you are contacted within three business days of submitting
    it about what help is possible, and the help is mainly gift cards for food or personal care items,
    or a utility bill.
  first_visit_tips:
  - Benevolence Fund requests must be submitted online, since the site says verbal requests are not accepted.
  - A senior can apply to the Benevolence Fund only once a year, and for a different kind of help each
    time.
  - 'Gifts are picked up: the senior signs for them, or a designee with a photo ID signs on their behalf.'
  - The Philadelphia office is open Monday to Friday, 8:30 am to 3:30 pm, and is closed on weekends and
    holidays. The contact page lists 267-595-9000 as its telephone.
