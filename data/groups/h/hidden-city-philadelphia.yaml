first_step:
  how: Read the articles on the home page, then email the tours coordinator, Alison Zeidman, at azeidman@hiddencityphila.org
    to ask which walking tour fits you and whether an individual can join one.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The articles are public and membership is optional, but the tours page describes group bookings
    and gives no public tour dates.
  what_to_expect: The tours page names four walking tours and says they can be booked as private tours
    for groups of up to 30, but it gives no meeting place, length, or price. The simplest start is the
    publication itself, whose articles cover preservation, architecture, development, and city history.
  first_visit_tips:
  - Ask the coordinator for the meeting place, length, and price before you plan the trip.
  - Members get 40% off Hidden City events and tours, and invitations to members-only tours.
  - Membership questions go to the program director listed on the contact page.
