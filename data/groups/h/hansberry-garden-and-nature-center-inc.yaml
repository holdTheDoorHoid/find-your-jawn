first_step:
  how: Fill out the short volunteer questionnaire linked from the Volunteer page, saying what work interests
    you and when you are free.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Public events are on the calendar and the volunteer page starts with a short questionnaire, but
    membership runs through a waiting list and the site does not say whether it is open.
  what_to_expect: Volunteers help with grounds work, the garden's performance and education programs,
    and keeping volunteers connected, and the site does not list set volunteer days. Membership includes
    a first year in the Garden Collective, where work sessions are led by two experienced volunteer gardeners.
  first_visit_tips:
  - Collective work sessions are for members, so ask about the waiting list before you plan on a regular
    shift.
  - Membership is $40 plus a $5 key fee for new members, and new members attend an orientation before
    they get free garden access.
  - In 2026, members were asked to attend a spring gathering and log at least 10 hours of garden volunteer
    work.
