schedule:
  text: Garden Collective work sessions for members run on Tuesday evenings (5:30 to 7:30 pm), Saturday
    mornings (10 am to 1 pm, except the second Saturday of the month), and the second Sunday evening of
    the month (5:30 to 7:30 pm). Public events are posted on the calendar. Check the collective's Signal
    group before you come, since a session may not happen.
