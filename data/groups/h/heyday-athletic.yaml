first_step:
  how: Use the League Finder to pick a league, open its League Details page, and choose Individual. Sign
    in, sign the waivers, and pay. Staff then place you on a balanced team.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Anyone can sign up online with no approval step listed, and solo players are placed on teams.
    The site describes no beginner division and no first-visit welcome, so it does not rate higher.
  what_to_expect: You pay and sign waivers online, then staff place you on a team by skill, position and
    player size. Team captains collect payments from their players. The site does not describe the first
    game night or the venue, so ask through the Contact page before you pay.
  first_visit_tips:
  - Choose the group of friends option if you want to be placed with people you know.
  - Have your payment details and any coupon or gift card ready before checkout.
  - Ask about the first game night and the venue before you pay, because the site does not list them.
