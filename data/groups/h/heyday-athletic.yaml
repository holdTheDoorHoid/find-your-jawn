summary: A company that runs adult sports leagues in the Philadelphia area, including basketball, soccer,
  kickball, softball, pickleball and tennis. You can sign up alone, with friends, or as a full team, and
  solo players are placed on balanced teams.
what_you_do: Sign up for a league alone, with friends, or as a team, then play organized games. The site
  also lists pickup games, tournaments and social events.
