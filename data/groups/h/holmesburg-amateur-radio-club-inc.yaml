first_step:
  how: Email wm3pen@arrl.net to ask where the next meeting is held, then come to the third Wednesday meeting
    at 7:30 pm.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The site says meetings are open to anyone interested in learning about amateur radio, and it
    lists a membership form and an email address.
  what_to_expect: Meetings are open to anyone interested in amateur radio, and visitors are welcome. The
    site does not say how long a meeting runs or where it meets in person, so ask first. The Thursday
    net is a radio gathering where participants bring questions, news, and stories from their hobby.
  first_visit_tips:
  - The site gives only a mailing address, so email before you go to confirm the meeting place.
  - The homepage has noted months with a restaurant meeting or a Zoom meeting, so check it first.
  - Full and family members must hold an amateur license. Associate membership ($5) is open to people
    without one.
  - To join, print the membership form from the club's membership page and bring it to a meeting or mail
    it to the club.
