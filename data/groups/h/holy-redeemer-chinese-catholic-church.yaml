first_step:
  how: Come to a Sunday Mass in the language you prefer. To ask about RCIA or the children's religion
    classes, call the church office at 215-922-0999 or use the contact form on the parish website.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The parish says newcomers can start with RCIA, and a September 2026 post says lector and Eucharistic
    minister roles need no previous experience. The site also lists ways to contact the parish.
  what_to_expect: Sunday Mass is offered in Cantonese, English or Mandarin, and the Cantonese and Mandarin
    Masses are livestreamed. The Mass is free to attend. The site does not say how long Mass lasts or
    what a first visit feels like, so the church office is the best place to ask questions.
  first_visit_tips:
  - Each Sunday Mass is in a different language, so pick the time that matches the language you want.
  - Call 215-922-0999 or use the contact form before your first visit if you have questions.
  - RCIA is the baptism preparation class. Ask about it when you call.
