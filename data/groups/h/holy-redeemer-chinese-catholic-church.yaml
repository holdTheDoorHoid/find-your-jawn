summary: A Chinese Catholic parish in Chinatown at 915 Vine Street with Sunday Masses in Cantonese, English
  and Mandarin.
what_you_do: Come to Mass in Cantonese, English or Mandarin. Ask about RCIA (the baptism prep classes),
  Cantonese and Mandarin Bible study, the Cantonese choir, or the Sunday religion classes for children.
  Lector and Eucharistic minister roles need no previous experience.
