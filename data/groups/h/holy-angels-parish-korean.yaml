summary: A Korean-language Catholic parish on Old York Road with several Sunday Masses, and Masses on
  Tuesday and Thursday evenings.
what_you_do: Come to Mass in Korean. Confession is offered before and after Mass. Parish groups such as
  the choir, the library and a Friday evening Bible reflection meet, but the site does not explain how
  to sign up, so call the office.
