  newcomer_friendliness: 3
  basis: Mass is open to anyone and the site lists an inquirers' class for people preparing to join, but
    it does not describe a welcome for newcomers.
  what_to_expect: Mass is said in Korean and is free to attend. The site does not describe a first visit
    or say whether any service is offered in English. Confession is offered before and after Mass, so
    you can go before or after the service.
  first_visit_tips:
  - Call 215-927-1662 to confirm the times, since the parish site does not mark am or pm and listings
    can change.
  - If you want to become Catholic, ask about the inquirers' class, which starts in September and meets
    each morning at 8:30 am. The site gives no year.
