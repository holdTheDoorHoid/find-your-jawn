summary: A neighborhood committee and nonprofit for the Hunting Park area. It helps residents with utility
  bill grants, energy savings, repairs, and emergency food, and it holds community meetings on zoning.
what_you_do: Residents come to the office for help with utility bills, energy use, repairs, or emergency
  food. The group also works on housing, education, jobs, beautification, and recreation.
