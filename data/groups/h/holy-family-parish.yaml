  newcomer_friendliness: 3
  basis: Mass is open to anyone, and the parish lists a phone number and an email. Its online form is
    for becoming a registered parishioner.
  what_to_expect: Mass is free and open to anyone. The 9 am Sunday Mass is livestreamed on the parish
    website, so you can watch before you come. The site does not say how long Mass lasts or what happens
    after it, so call ahead with questions.
  first_visit_tips:
  - Park in the Fowler Street lot, where the handicap spaces are, or on Hermitage Street.
  - Use the parking lot entrance. The Hermitage Street door is not wheelchair accessible, and the lot
    entrance has one step.
  - The rectory office is open Monday to Thursday, 8:30 am to 3 pm, if you have questions.
