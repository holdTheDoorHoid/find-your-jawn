summary: A Philadelphia nonprofit that gives out food, diapers, clothing, and water to families in need.
  It also runs a summer camp, a college scholarship, and holiday baskets and toys.
what_you_do: Ask about the Cupboard food program, the diaper program (run with the Delaware Valley Diaper
  Bank), clothing, water bottles, the summer camp, the undergraduate scholarship, and holiday baskets
  and toys. The site does not say how to sign up, so call first.
