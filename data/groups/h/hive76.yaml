summary: A makerspace in Kensington where people build and learn with woodworking tools, electronics,
  laser cutters and 3D printers. Anyone can drop in on a Sunday open house to try the space.
what_you_do: Work on your own projects with shared tools and benches. Members pay a monthly fee, must
  be 18 or older, and sign a liability waiver before they use the space.
