first_step:
  how: Drop in at a Sunday open house, 2 to 5 pm, to look around. To use the tools, join as a Light member
    for $15 a month. Or email through the contact page for a one-on-one tour on another day.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The site says beginners and experienced makers both use the space. The FAQ advises new members
    to come in during open hours and learn tools from experienced members, and the group holds occasional
    Tool-Training Days.
  what_to_expect: A Sunday open house runs from 2 to 5 pm. Members work on their own projects at shared
    benches with shared tools, and members can ask someone experienced to teach them a tool. The Light
    plan is meant as a way to try the space. Ask at the door whether a visit needs a membership, since
    the visit page and the FAQ describe open houses a little differently.
  first_visit_tips:
  - Bring your own project materials, since the space does not sell supplies.
  - Take the York-Dauphin stop on the Market-Frankford Line, about three minutes away, or use the free
    street parking on Jasper or Hagert streets.
  - Ask a member or staff person to teach you a tool before you use it.
  - Plan to be 18 or older to join, since the group requires it for membership.
