summary: A partnership of about 20 historic houses, museums and gardens in northwest Philadelphia. Its
  sites offer tours, free events and a volunteer garden program at Wyck.
what_you_do: Volunteers at Wyck's Home Farm Club help in the kitchen garden on Tuesdays and Fridays, get
  short lessons, and take home a share of fresh produce. No sign-up is required.
