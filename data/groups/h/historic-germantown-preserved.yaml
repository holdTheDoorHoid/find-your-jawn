summary: A partnership of about 20 historic houses, sites and museums in Northwest Philadelphia that protects
  and shares Germantown's history. It runs walking tours, free and ticketed events, and a volunteer kitchen
  garden at Wyck.
what_you_do: Join a walking or house tour, come to the free events, or volunteer at Wyck's Home Farm Club,
  a kitchen garden where helpers take home a share of the produce.
