first_step:
  how: Come to the Wyck garden on a Tuesday or Friday; no sign-up is needed. For other questions, email
    programs@historicgermantownpa.org
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The garden program offers short lessons, needs no registration, and the group's page says so
    directly, so a beginner can come to a first session.
  what_to_expect: Sessions combine short lessons with hands-on work in the kitchen garden of the historic
    home farm. Listed morning sessions run from 10 am to noon, and afternoon sessions start at 4 pm. You
    take home a share of fresh produce, and the page does not list a cost for the garden program.
  first_visit_tips:
  - Check the session list on wyck.org before you come, since sessions are listed by date
  - Wear clothes you can work outside in, because the work is hands-on in a garden
  - Plan your trip, since the page does not list parking or transit for the garden
