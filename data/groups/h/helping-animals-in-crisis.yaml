summary: A statewide nonprofit of volunteers who help animals and the people who care for them during
  disasters and emergencies, such as house fires and loose livestock. The City of Philadelphia points
  local volunteers to its Philadelphia County division.
what_you_do: 'After basic training, volunteers answer calls for animal help: delivering pet care kits
  to families displaced by house fires, moving loose farm animals, trapping cats for rescue groups, and
  helping an animal that is down.'
