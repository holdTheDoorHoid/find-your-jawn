first_step:
  how: Call 267-237-0706 or email heavenlymadeblessings@gmail.com to ask which program fits you and, for
    a childcare scholarship, which documents to send.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Scholarships need proof of income, Pennsylvania residency, a financial literacy workshop and
    five volunteer hours a month, and the site does not explain how newcomers sign up for mentoring or
    workshops.
  what_to_expect: The site does not describe a first visit or give dates, times, or formats for its programs.
    Scholarship help is partial, first come first served, and is for families with children ages 0 to
    5 who cannot afford full child care and do not qualify for free or subsidized care.
  first_visit_tips:
  - Have proof of income and proof of Pennsylvania residency ready before you apply for a scholarship.
  - Confirm that the child's child care program is state-licensed and will work with the group.
  - Ask about the financial literacy workshop and the five hours a month of volunteering before you apply.
