summary: The volunteer crew that runs Philadelphia's Head of the Schuylkill Regatta, now in its 56th year.
  Volunteers help with timing, docks, registration, parking and more.
what_you_do: Work half-day shifts around lunchtime in timing, docks, registration, parking, hospitality
  or the zero waste team. Timing volunteers get training.
