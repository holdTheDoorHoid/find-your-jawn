first_step:
  how: Pick a half-day shift on SignUpGenius once sign-ups open after August 1, or email volunteers@hosr.org
    to ask for help choosing one.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The page says timing needs no rowing experience, training is given to timing volunteers, and
    it lists the sign-up steps and an information session.
  what_to_expect: Shifts are half days that break around lunchtime, and a captain contacts you after you
    sign up to confirm your shift and location. Roles range from docks and registration to hospitality
    and the zero waste team, and golf cart drivers must be 18 or older with a driver's license. Area prep
    meetings are usually held on Zoom.
  first_visit_tips:
  - Join the Zoom information session on Tuesday, October 20 for the 2026 regatta, or use the recording
    if you cannot attend.
  - If you are volunteering, park in Area 2, the Grandstand Parking Lot, shown on the on-site map. Your
    HOSR volunteer ID tag is not a parking permit.
  - Kelly Drive has restricted traffic over regatta weekend, so read the traffic and parking page before
    you drive.
  - If you will be around young athletes, take the brief U.S. Center for SafeSport volunteer course first.
