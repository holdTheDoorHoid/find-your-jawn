first_step:
  how: Come to a community meeting at the Hawthorne Cultural Center, 1200 Carpenter St., or on Zoom. Check
    the group calendar for the next date and place, or sign up for the mailing list on the site.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Open community meetings are public and posted on the group's calendar. Joining is open to Hawthorne
    residents, and the site does not describe a welcome for first timers.
  what_to_expect: Community meetings are held in the evening, usually at 7 pm. Recent meeting posts cover
    the group's work, officer changes, school and City Council issues, and board elections. The meeting
    is at the Hawthorne Cultural Center or on Zoom, so check which before you go.
  first_visit_tips:
  - Check the calendar first, since some meetings are on Zoom and others are at the Hawthorne Cultural
    Center.
  - Bring a question about a nearby building or zoning project if you have one.
  - Arrive a few minutes early so you can find a seat before the meeting starts.
