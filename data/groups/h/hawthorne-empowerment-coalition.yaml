summary: A volunteer group for the Hawthorne neighborhood in South Philadelphia. It works on safety, zoning,
  parks and street trees, and youth and adult computer classes, and it holds open community meetings for
  neighbors.
what_you_do: Neighbors come to open community meetings, review nearby zoning and building proposals, and
  join park and street cleanups. The group also runs summer movie nights and jazz concerts in Hawthorne
  Park. All Hawthorne residents may join, and the site does not mention dues.
