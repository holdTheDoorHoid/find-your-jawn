first_step:
  how: Go to the monthly neighbors' meeting, which runs 6:30 to 8:30 pm. The calendar does not give the
    room, so email harrowgatecivicassociation@gmail.com first to confirm the next date and place.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: A community calendar lists a monthly neighbors' meeting, and the group gives an email and phone
    number. No page says how first-timers are welcomed.
  what_to_expect: The monthly meeting runs about two hours in the evening, from 6:30 to 8:30 pm on the
    calendar. The calendar does not describe the agenda, whether the meeting is in person or online, or
    who usually attends, so ask the group before your first visit.
  first_visit_tips:
  - Email the group before the meeting to confirm the date and room.
  - Bring a question about a nearby building or zoning plan, since that is the group's main work.
