summary: A nonprofit wig shop in Queen Village. It gives wigs to people who have lost their hair to illness,
  and it sells wigs and head coverings to everyone else.
what_you_do: Book a consultation to be fitted for a wig or learn wig care, or shop in person. The free
  wig program ships wigs after a hospital doctor or social worker signs the program's patient form. Donations
  keep the free program running.
