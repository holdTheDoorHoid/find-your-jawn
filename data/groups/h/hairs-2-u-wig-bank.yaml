first_step:
  how: Book a consultation at hairs2u.org/consultations. For the free wig program, have your hospital
    doctor or social worker complete the program's patient form and add the hospital stamp first.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The shop and consultations are open to anyone, and the site lists hours and an address. The free
    wig program needs a patient form signed by a hospital doctor or social worker.
  what_to_expect: 'A consultation is a fitting: the shop says a good fit matters most, and wig sizes run
    from extra petite to extra large. The shop also offers custom wig making and sells wigs, hats, turbans,
    and jewelry. The site does not say how long a consultation takes or what it costs, so ask when you
    book.'
  first_visit_tips:
  - Book a consultation first, since the site does not say whether walk-ins are welcome.
  - The shop is closed Sunday to Tuesday, so plan a visit for Wednesday through Saturday.
  - For the free wig program, get the patient form completed by your doctor or social worker and stamped
    by the hospital before you contact the shop.
