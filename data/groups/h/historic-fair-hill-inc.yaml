schedule:
  text: Family Fun Saturdays run each Saturday afternoon from April to November. Garden volunteers help
    on Saturdays from 10 am to 3 pm, Community Clean Up Days are on the third Saturday of the month, and
    Fairhill Neighbors meets on Zoom on the first Monday, 5 to 6 pm.
