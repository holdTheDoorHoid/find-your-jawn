summary: A community organization in the Fairhill neighborhood that cares for a historic Quaker burial
  ground and works with local schools on early reading and urban greening. It also runs family events,
  a cooking class and a farmers market.
what_you_do: Read with children as a reading buddy, help in a school library or garden, plant trees, help
  run events, or come to the family events, the cooking class and the farmers market.
