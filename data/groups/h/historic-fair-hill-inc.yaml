first_step:
  how: Email info@historicfairhill.com or call (215) 844-1683 ext 107 about a volunteer role, or drop
    in on a Saturday afternoon for Family Fun Saturdays.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The volunteer page gives a contact and a next step for each role, Reading Buddies get training,
    and the Saturday family event is an open invitation with no sign-up listed.
  what_to_expect: Family Fun Saturdays are afternoon activities with storytimes, games, arts and crafts,
    gardening and scavenger hunts. Reading Buddies work one on one with students in a classroom, get training
    and guidance, and receive help with state clearances and carpools. Some roles need background clearances
    or training before you start.
  first_visit_tips:
  - For an easy first visit, come to a Saturday afternoon Family Fun Saturday and wear clothes you can
    garden in.
  - For a volunteer role, email or call first, since some roles need clearances or training before you
    begin.
  - The site does not list transit or parking, so ask before you go.
