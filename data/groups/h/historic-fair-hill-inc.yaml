summary: A North Philadelphia community organization that cares for the Fair Hill burial ground, a historic
  Quaker site that holds the graves of abolitionists and early women's rights leaders. It also runs reading,
  garden, and tree-planting programs and community events.
what_you_do: Volunteer as a reading buddy, school library helper, garden helper, or tree planter, or help
  with events. Public events include Family Fun Saturdays and a 19133 Farmer's Market.
