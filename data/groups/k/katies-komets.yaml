summary: A co-ed wheelchair basketball team for young players with lower limb impairments in the Philadelphia
  area. It has prep and varsity divisions and is always looking for new players.
what_you_do: 'Play on a co-ed wheelchair basketball team: the prep division is for players 13 and under
  and uses 8.5 foot baskets, and the varsity division plays on full size courts. The team competes in
  the NWBA junior division.'
