summary: A Philadelphia group that helps whole families build self-sufficiency and learn about services
  they can use. Its YES youth program, running since 1997, works to keep students in school, and its site
  has voter pages for 2026.
what_you_do: Ask how to help with the youth program or voter work through the contact form or email. The
  site lists no meeting times, youth sign-up steps, or voter events.
