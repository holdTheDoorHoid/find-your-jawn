first_step:
  how: Send a message through the contact form at ceo1.org/contact to ask how to help with the youth program
    or the voter work
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The Volunteer button leads to a contact form, which is a clear way to ask, but the site lists
    no volunteer steps, schedule, or youth sign-up.
  what_to_expect: The site does not describe what a volunteer does day to day, how long a shift lasts,
    or where it happens. It lists no fees for its programs. Put those questions in your first message,
    since the site does not answer them.
  first_visit_tips:
  - The contact form asks for a first and last name, an email, and a message.
  - Ask in your first message about times and place, since the site lists neither.
