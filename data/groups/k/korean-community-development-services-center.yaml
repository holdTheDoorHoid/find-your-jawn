first_step:
  how: Call 202-821-8591 to book an appointment for housing, benefits or immigration help, or to ask about
    the early learning center. The site also has a contact page.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The site says it serves new immigrants and gives a phone number to start, but housing and childcare
    are for low-income families and the eligibility rules are not described.
  what_to_expect: Housing, benefits and immigration help is by appointment, and staff guide you through
    each application, including naturalization and benefit sign-ups. The page does not say how long a
    visit takes, what papers to bring, or what it costs.
  first_visit_tips:
  - 'Book by phone first: housing, benefits and immigration services are by appointment only.'
  - The office is at 6055 N. 5th St. The early learning center is at a different address, 5224 Rising
    Sun Avenue.
  - Ask about languages and eligibility when you call, since the site does not list either.
