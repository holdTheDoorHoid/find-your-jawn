first_step:
  how: Fill in the Register Now form on kidzindahood.org for the program you want, or call 267-768-7738
    to ask when sessions start.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Joining means filling in a registration form, and the site gives no schedule, age range, start
    date, or description of a session, so the way in is unclear.
  what_to_expect: The site does not say how long a session lasts, where it meets, or what a session looks
    like. Mentoring is described as one-on-one guidance plus group sessions. Kidz Corner play stations
    run in small groups of 6 to 8 children at community events, with licensed caregivers and trained parent
    volunteers. Ask about start dates before you plan around a program.
  first_visit_tips:
  - Ask by phone or email about start dates and where sessions meet, because the site does not list them.
  - Volunteers must complete a state background check at epatch.pa.gov and upload it on the volunteer
    form.
  - The contact form has a menu that lets you pick Volunteer, Registration, Sponsorship, or General.
