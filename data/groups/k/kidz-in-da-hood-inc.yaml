summary: A Philadelphia nonprofit that mentors young people, runs after-school enrichment, and helps families
  in need through community outreach. It also runs First Teachers, a parent support community.
what_you_do: Sign up for youth mentorship (including The Bloom Project), Kidz Corner play stations, or
  First Teachers through the Register Now form. You can also volunteer, which requires a background check,
  or call to ask about a start date.
