first_step:
  how: Click Register Now on kulumele.org to open the youth class sign-up and create a parent account,
    or email info@kulumele.org or call 484.929.7353 to ask about the next class start.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The program page says all skill levels are welcome, that no prior dance experience is needed,
    and explains how to register. It does not say whether a first class is free or drop-in.
  what_to_expect: Youth classes are for ages 5 to 18 and run on Sundays in a season that ends with a June
    show. Students learn traditional West African drumming and dance, plus Afrobeat and AfroFusion, and
    the program includes cultural study and teamwork. Beginner dance is for ages 5 to 9 and advanced dance
    for ages 10 to 18, so ask which group fits your child.
  first_visit_tips:
  - Ask whether a first class is free or drop-in before you pay the registration fee.
  - The group's office is on North 13th Street, but the youth classes meet at Inspire Arts Space on Ridge
    Avenue, so use that address for a first visit.
  - Ask which class suits a child's age, since dance levels split at age 10.
