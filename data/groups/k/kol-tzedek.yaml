first_step:
  how: Come to the Friday 6:30 pm service, hybrid or online, or the Saturday 10 am service in person.
    For Torah School, use the Register Now form on the Torah School page, or call the Torah School Director
    at 267-629-2349.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The Shabbat page welcomes first-time guests, and the membership page gives a form and a staff
    contact to start; no guest orientation is described, so it is a 4 rather than a 5.
  what_to_expect: Friday services run about an hour and a half, and Saturday services run two to two and
    a half hours, mostly in Hebrew. The page welcomes first-time guests and has no dress code, but it
    does not say where to check in or whether there is a sign-in step. The cost of attending as a guest
    is not printed.
  first_visit_tips:
  - Street parking on Whitby Ave is not guaranteed. A handicapped spot is directly in front of the sanctuary,
    and the Director of Operations can hold nearby parking if you ask ahead.
  - Fidgets and headphones can be borrowed during services; they sit next to the prayerbooks.
  - The prayerbooks are Siddur Chaverim Kol Yisrael on Friday and P'tach Libi on Saturday. The page does
    not say whether copies are provided.
