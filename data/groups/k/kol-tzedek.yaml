cost:
  level: null
  text: Membership runs on a sustaining share. The page prints the 5785 figures as $180 a month or $2,160
    a year, with a suggested minimum of $36 a month, and says money should not be a barrier to membership.
    No price for visiting services or for Torah School tuition is printed.
