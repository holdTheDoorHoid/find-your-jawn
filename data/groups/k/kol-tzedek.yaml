access:
  wheelchair: partial
  languages: []
  notes: Accessible front door with a push button into the lobby, an ADA restroom, and a handicapped parking
    spot directly in front of the sanctuary on Whitby Ave. The page does not mention an elevator or ramp.
    Friday services are live-captioned, and ASL is available for High Holiday services when requested
    at least 30 days ahead. Fidgets and headphones can be borrowed during services.
