summary: A Reconstructionist synagogue in West Philadelphia. Members pray on Shabbat, study in the Torah
  school and adult classes, and can join a virtual community.
what_you_do: Come to Friday evening or Saturday morning services, enroll children in the Torah school,
  take an adult learning class, or become a member. A newsletter sign-up is on the site.
