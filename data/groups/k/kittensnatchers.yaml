first_step:
  how: Fill in the foster application or the temporary host form linked on the site, or email cats@kittensnatchers.org
    with questions.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Fostering, hosting and adopting all start with a form, and the site lists no orientation, volunteer
    shifts, or events, so the way in is a form first.
  what_to_expect: Adopters apply online, and approval can take up to 5 days. The rescue then connects
    you with the foster caring for the cat, you meet by video or in person, and kittens go home only after
    spay or neuter surgery. The pages read do not describe foster duties, supplies, orientation, or hours.
  first_visit_tips:
  - Pick at least two cats you like, since the adoption page advises it in case another adopter gets the
    first one.
  - Expect the foster to ask about your home life and what you want in a cat.
