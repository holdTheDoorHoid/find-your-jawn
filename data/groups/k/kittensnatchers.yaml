summary: A volunteer-run Philadelphia rescue that takes in stray cats and kittens and places them in foster
  homes until they are adopted.
what_you_do: Foster a cat in your home while it waits for adoption, or offer temporary hosting. Adopt
  through the online application, or donate. The rescue has no shelter building, so cats live with volunteer
  fosters.
