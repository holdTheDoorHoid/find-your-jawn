first_step:
  how: Come to one of the public events the council lists on kofc283philly.org, such as a food or coat
    drive, a Mass or a festival. To ask about membership, use the contact form linked from the Join the
    Knights page.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Public drives, Masses and festivals are open to anyone, and the site has a contact form for membership
    questions. The council does not publish membership rules, dues or a guest policy.
  what_to_expect: At a public event you can attend a Mass, walk with the council in a parade or festival,
    or help with a drive. Events are announced one at a time, and the site does not list costs for them.
    Membership questions go through the contact form, and the site does not say how a first meeting works.
  first_visit_tips:
  - Check the event listing for the date, time and place before you go.
  - Dress for the weather if you plan to walk in a parade or festival.
