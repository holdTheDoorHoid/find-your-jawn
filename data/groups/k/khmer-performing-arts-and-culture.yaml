first_step:
  how: Fill in the Register for classes form linked on the website, or message the group on Instagram
    or Facebook to ask about class times
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The classes are free and open to the community, and the site links a registration form, but class
    times are not published, so the way in is clear but not yet detailed.
  what_to_expect: Classes cover Khmer language and culture, classical and folk dance, and music on instruments
    such as the khim, takae, drum and xylophone. Language and some dance classes can be taken on Zoom,
    and most music classes are in person. Class times and the length of each class are not published,
    so ask before your first visit.
  first_visit_tips:
  - Ask for the class time and whether it is in person or on Zoom before you come
  - Confirm the room, since the site names the temple space as the group's community space but does not
    list each class location
  - Plan your trip, since the page does not list parking or transit
