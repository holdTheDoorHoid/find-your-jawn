summary: A Buddhist meditation center on North 2nd Street with weekly classes on Sunday, Monday, Wednesday
  and Thursday, plus a monthly Prayers for World Peace session on the first Friday.
what_you_do: Take a weekly meditation class, come to the free monthly Prayers for World Peace, or join
  a series such as Meditation 101. Most classes cost $15 and the Thursday morning class costs $5, and
  a $50 monthly membership covers the general classes.
