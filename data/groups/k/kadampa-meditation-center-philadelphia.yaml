summary: A Buddhist meditation center on North 2nd Street with weekly classes on Sunday, Monday, Wednesday
  and Thursday, plus a monthly prayers for world peace session on the first Friday.
what_you_do: Take a weekly meditation class, come to the monthly prayers for world peace (free), or sign
  up for the half day course listed on the site. Most classes cost $15 and the Thursday morning class
  costs $5, and membership covers both.
