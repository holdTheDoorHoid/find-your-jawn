first_step:
  how: Pick a class on the classes page and register online, or call 267-702-3817 (voicemail; they call
    back). The FAQ says you can also drop in if you arrive 10 to 15 minutes early to sign in and pay.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: Each class says beginners are welcome with no experience needed, and the FAQ says classes suit
    beginners and experienced meditators. Rated 4 rather than 5 because the class listings say registration
    is required and the beginner series is not stated as repeating.
  what_to_expect: Each class opens with a short introduction, then a guided breathing meditation and a
    short teaching on Buddhist thought, and ends with a closing meditation. Sunday mornings run 10:30
    to 11:45 am and the evening classes run an hour, 7 to 8 pm. You can stay afterward to ask the teacher
    questions or browse the bookstore.
  first_visit_tips:
  - 'Arrive 10 to 15 minutes early: doors lock 5 minutes after the start, and late arrivals cannot be
    seated.'
  - The entrance is on Cuthbert St. Take your shoes off in the hallway before the meditation room, where
    benches are provided.
  - Nothing special is needed to bring or wear. A pen and notepad are handy if you take notes.
  - Food and drink stay in the lounge, not the meditation room.
