summary: A soccer club founded in 2010 in Kensington. It runs recreational seasons for beginners, free
  after school soccer at partner schools, a book reading program, and competitive teams for youth, teens
  and adults.
what_you_do: Players can join a recreational season or the after school program. Volunteers can coach,
  referee, help at club events or with the book program, or join the communications and fundraising working
  groups.
