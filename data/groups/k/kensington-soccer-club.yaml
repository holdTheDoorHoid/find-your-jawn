first_step:
  how: Open the program directory at kensingtonsoccer.org/programs, pick a program, and use its registration
    link or email the club about it.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The program directory gives a registration link or a contact email for most programs, and the
    fall beginner program is open to new players. Most programs do not list fees, so ask before you sign
    up.
  what_to_expect: The fall beginner program runs 10 weeks and focuses on skills, fun, fitness and healthy
    habits. Sessions are on weekdays and on Saturday mornings at Casiano Field and Hissey Playground.
    The 2026 fall session started in September, so ask the club when the next session opens.
  first_visit_tips:
  - Check the program page for the field, day and time before you come.
  - Ask about fees before you register, since most program pages do not list them.
  - If you want to help instead of play, email volunteer@kensingtonsoccer.org.
