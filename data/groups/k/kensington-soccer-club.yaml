schedule:
  text: Seasons run through the year. The fall beginner program meets on weekday late afternoons and evenings
    and on Saturday mornings at Casiano Field and Hissey Playground. KSC PREP, for high school students,
    meets Mondays, Wednesdays and Thursdays from 4 to 8 pm during its season at the Community Center at
    Visitation.
