summary: Volunteers who clean up, plant and care for Royal Gardens in Morris Park, in the Overbrook area.
  They clear invasive plants and dumped trash and work against graffiti. The group's website also lists
  weekday morning tai chi classes.
what_you_do: Help clear invasive plants and dumped trash, plant gardens, and take part in the group's
  events. The group asks volunteers to commit to at least two visits a year.
