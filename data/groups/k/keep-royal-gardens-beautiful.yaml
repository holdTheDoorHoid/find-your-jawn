summary: Volunteers who clean up, plant, and beautify Morris Park and the Overbrook area, and who work
  against graffiti and illegal dumping. The group also lists tai chi classes at the park.
what_you_do: Help clear invasive plants and dumped trash, plant gardens, and take part in the group's
  events. The site asks volunteers to commit to at least two times a year. Tai chi classes are listed
  on weekday mornings.
