summary: An online matching tool where professionals volunteer their skills for local nonprofits. Typical
  projects include marketing plans, websites and graphic design.
what_you_do: Create a volunteer profile, then take a one hour strategy call with a nonprofit or agree
  to a set project such as a website, graphic design or copywriting. Nonprofits post their needs, and
  both sides decide whether the match fits.
