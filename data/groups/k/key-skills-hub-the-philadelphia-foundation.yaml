first_step:
  how: Click Get Started Today on the volunteer page to create a skills profile, then choose a one hour
    strategy call or a set project.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: You need a profile before you can be matched, and the page does not say whether you can browse
    projects first. A retiree guide and a partner program for hands on volunteering are listed, so there
    are other paths too.
  what_to_expect: Expect an online profile first. A match can be a one hour strategy call, or a set project
    such as a website, graphic design or copywriting. Both sides decide whether the fit works, and the
    page does not say how long a full project takes.
  first_visit_tips:
  - Have a short description of your skills and the areas you care about ready for your profile.
  - Retirees can find separate guidance on the site.
  - If you want hands on volunteering rather than skills work, the page names RSVP as a partner that offers
    tutoring and food security work.
