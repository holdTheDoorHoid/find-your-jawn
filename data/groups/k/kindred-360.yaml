summary: A nonprofit that runs virtual peer support groups and webinars for Black parents and caregivers.
  Its free Changemaker membership adds on-demand wellness content, such as movement sessions and recipes.
what_you_do: Sign up for a virtual support group through its Join Us link (most groups are marked coming
  soon), or join the free Changemaker membership for on-demand content. You can also email changemaker@kindred360.org
  to ask when a group opens.
