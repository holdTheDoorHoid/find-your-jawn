first_step:
  how: Pick a group and use its Join Us link to register on Zoom. For the online library, sign up for
    the free Changemaker membership.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Sign-up is free and clearly marked, and the groups are open to parents and caregivers. The page
    limits the resources to Black parents, and most groups are still coming soon.
  what_to_expect: Support groups are peer groups held on Zoom, led by hosts who are not licensed therapists
    and who do not replace professional care. The page does not say how long a session lasts or how many
    people attend. Most groups are marked coming soon, so a group may not be open to join yet.
  first_visit_tips:
  - Confirm which group you are registering for, since the page notes that the High-Risk Pregnancy link
    goes to the same Zoom page as NICU Parents.
  - Have a device ready with audio and video, since the groups meet on Zoom.
