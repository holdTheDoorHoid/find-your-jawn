summary: A baseball and softball program for kids that runs a beginner program, a four-week clinic called
  Bagels and Baseball, summer camps, and school and community days.
what_you_do: Kids ages 7 to 12 can join the Saturday Bagels and Baseball program in Brewerytown, with
  no gear or experience needed. The group also runs an entry level program, summer camps, and school and
  community days. Its listed service areas are Norristown, Ambler, Willow Grove, Fort Washington, Philadelphia
  and Glenside.
