summary: A Christian community at Penn, open to students, staff and neighbors. It offers a weekly Wednesday
  dinner and discussion, a free online English class, a mentoring program for West Philadelphia high school
  students, and a monthly Night Church gathering.
what_you_do: Come to the Wednesday dinner and discussion, the Thursday English class on Zoom, the Tuesday
  grad book group, or the monthly Night Church gathering. Ask about the mentoring program if you want
  to work with high school students.
