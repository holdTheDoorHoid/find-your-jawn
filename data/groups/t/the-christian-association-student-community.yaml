first_step:
  how: Fill in the visit form on upennca.org or email upennca@gmail.com, and the group will contact you
    to set a time. You can also join the mailing list.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The site invites visitors to stop in for a visit through a short form and describes a hospitable
    community where people can come as they are. It does not say whether belief is required, so this rating
    covers the first visit only.
  what_to_expect: The Wednesday dinner is a shared meal followed by a discussion of faith and Scripture,
    from 6:30 to 8 pm. The page does not say where the dinner is held, what it costs, or whether you should
    bring anything, so ask before you come. Most programs take place at the SPARC building on South 37th
    Street, so confirm the room first.
  first_visit_tips:
  - Send the visit form first, since the group contacts you to set a time.
  - Ask which room you will meet in, because most programs are at 118 S. 37th St. and the club address
    is 3637 Chestnut St.
  - Slanguage meets on Zoom, so you need a phone or computer with internet, and the site points to the
    group's Facebook page for details.
