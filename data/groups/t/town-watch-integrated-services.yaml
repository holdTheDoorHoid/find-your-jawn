first_step:
  how: Ask whether a Town Watch group already meets on your block. To ask about joining or starting one,
    call the office at 215-686-1459.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The city describes how existing groups get training and certification and gives a form for new
    groups, but it does not say how one resident joins an existing group.
  what_to_expect: The city's pages describe what Town Watch groups do, not what a meeting is like. Members
    observe, document, and report, and groups work with district police and local advisory commissions.
    The city trains and certifies groups, including for CERT disaster response.
  first_visit_tips:
  - Call the office before you visit, since the site lists no walk-in hours.
  - For non-emergency problems, the city's 311 line is linked from the department page.
