summary: The City's Town Watch program trains, organizes, and equips residents who want to join a Town
  Watch group on their block. It also supports CERT, a disaster response program.
what_you_do: Observe, document, and report suspicious or criminal activity on your block, and work with
  district police. Groups also take part in local Police District Advisory Commissions.
