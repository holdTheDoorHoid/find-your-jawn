  newcomer_friendliness: 3
  basis: Lectures are free, open to the public, and posted with a set time and place. The site does not
    describe any newcomer welcome beyond that, so the rating is 3.
  what_to_expect: A lecture is a single evening talk in the Society's building, with doors at 7 pm and
    the talk at 7:30 pm. The Society's notice for its October lecture says light refreshments are served
    and masks are optional. You can also watch a lecture live online.
  first_visit_tips:
  - Park in the free lot across Orthodox Street at Frankford Friends School.
  - Arrive when doors open at 7 pm, so you are settled before the 7:30 pm talk.
  - Call 215-743-6030 to ask about the next lecture or to book a museum visit.
