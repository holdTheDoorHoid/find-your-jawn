summary: A volunteer-run history group, founded in 1905, that keeps and shares the history of Frankford.
  It holds monthly lectures, runs a museum open by appointment, and offers library research help.
what_you_do: Attend a free lecture at the Society's building, book a museum visit or research help, or
  watch past lectures on the Society's YouTube channel.
