first_step:
  how: Start with the Genocide Prevention Toolbox or a microcourse on the website. To volunteer, fill
    in the online volunteer form, then expect a call and an orientation.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The toolbox, microcourses and podcast are open to anyone online. Volunteering has a clear route
    (form, call, orientation), but the intern cohort was closed and open volunteer roles are not listed.
  what_to_expect: The toolbox, microcourses, and podcast are online, so you can read or listen at any
    time. Volunteers help with daily tasks or single projects with no weekly commitment, and interns commit
    at least 5 hours a week. The volunteer path starts with a Zoom or phone call, then an orientation
    and a mentor, and all roles are unpaid.
  first_visit_tips:
  - Read the toolbox or a microcourse first, so you know the group's work before you write in.
  - Email info@lemkininstitute.com if you are not sure which volunteer role fits.
  - The Winter 2025 intern cohort is closed, so ask about current openings before you apply.
  - The optional résumé or CV upload on the volunteer form accepts files up to 15 MB.
