access:
  wheelchair: partial
  languages: []
  notes: 'Nearest SEPTA: Subway-Surface Trolley to the 40th Street Trolley Portal at 40th and Woodland,
    directly across from the gates (any line except T1). Paved roads, historic brick sidewalks, and grass,
    with most roads having a 4-inch curb. The one ADA restroom is at the northeast corner of the Stable
    and is open when staff are on site and during public events. A wedge ramp for event areas can be set
    up with advance notice. Hamilton Mansion has four steps, and a ramp can be added on request. An event
    space accessibility map is available.'
