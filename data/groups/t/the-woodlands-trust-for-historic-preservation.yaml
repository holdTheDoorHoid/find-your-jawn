first_step:
  how: Book a public tour on the tours page at least 2 weeks ahead, or walk the grounds yourself during
    open hours.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The grounds and public events are open to anyone, and tours are booked through a form. The volunteer
    page does not spell out how a new volunteer signs up.
  what_to_expect: A public tour takes about 1.5 hours on a weekday between April and October, and you
    book it ahead. Tours cover the cemetery and Hamilton Mansion, which is open by appointment or during
    certain events and has four steps unless a ramp is set up. Clean-up work days run on weekends from
    October to March and on weekday evenings from April to September.
  first_visit_tips:
  - Book a tour at least 2 weeks ahead, since the page asks for advance notice.
  - Take the SEPTA trolley to 40th and Woodland. The gates are directly across from the trolley portal.
  - Plan to leave before sunset, since safety staff close the gates each evening.
  - Children under 14 need an adult with them, and dogs must stay leashed.
