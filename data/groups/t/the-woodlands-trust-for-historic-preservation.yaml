summary: A historic cemetery and garden at 4000 Woodland Avenue. It runs public tours, a public events
  calendar, and volunteer work days where people clean paths, plant and care for trees, and help welcome
  visitors.
what_you_do: Book a tour of the mansion and cemetery ($20 a person), join a public event such as a walk
  or an evening event, or sign up for a clean-up or tree day. The Grave Gardeners program, run by The
  Woodlands, opens applications each January.
