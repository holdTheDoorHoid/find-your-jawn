first_step:
  how: Book a tour on the tours page at least 2 weeks ahead, or walk the grounds yourself during open
    hours.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The grounds and public events are open to anyone, and tours are booked by form, phone, or email.
    The volunteer page says to contact the group or join its mailing list, but it gives no sign-up form.
  what_to_expect: A tour takes about 1.5 hours on a weekday from April to October, costs $20 per person,
    and needs a booking at least 2 weeks ahead with a 50 percent deposit. It covers the cemetery and the
    Hamilton Mansion, which is open only for appointments or certain events. The cemetery still holds
    funerals, so a service can change your tour plans on short notice.
  first_visit_tips:
  - Book at least 2 weeks ahead. A 50 percent deposit holds the tour and is refundable up to 5 days before.
  - Take the SEPTA trolley to 40th and Woodland. The gates are directly across from the trolley portal.
  - Plan to leave before sunset, since safety staff close the gates each evening.
  - Children under 14 need an adult with them, and dogs must stay on a leash at all times.
