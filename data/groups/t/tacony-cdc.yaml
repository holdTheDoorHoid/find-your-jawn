  newcomer_friendliness: 3
  basis: The Third Thursday event is for the whole family and community, and the site gives its time and
    place. The site does not say how residents join the group or volunteer.
  what_to_expect: Tacony Third Thursdays runs from 6 to 9 pm and is aimed at the whole family. The site
    lists a food truck, produce and flowers, live music, family activities, and tables from local organizations
    and elected officials. The site does not say whether it costs anything or whether you need to sign
    up.
  first_visit_tips:
  - You can come for part of the evening, since the event runs from 6 to 9 pm.
  - Call (267) 276-2586 before you go, because the site lists no office hours.
  - The site says to check the Tacony CDC Facebook page for current dates, so look there before you go.
