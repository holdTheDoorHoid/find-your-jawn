summary: A neighborhood group that residents founded in 2001 to preserve Tacony's housing. It now works
  to revitalize Torresdale Avenue, the main shopping street, and runs events such as Tacony Third Thursdays
  and a yearly Halloween celebration.
what_you_do: Come to a Tacony Third Thursday event, join a seasonal street celebration, or contact the
  office about neighborhood services, business help, and what the area needs.
