first_step:
  how: Enroll online, by email, or by phone at 215-413-2122 on a weekday. Enrolling makes you a member
    of the co-op.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Any home or business in the service area can sign up through several clear routes, with no fees,
    so the way in is clear. The site describes no welcome or orientation beyond the enrollment steps.
  what_to_expect: Joining means switching your electricity supplier, which usually takes 3 to 5 days.
    Home members pay no enrollment, membership, or cancellation fee, though your utility may still charge
    its own fees. You can leave at any time by telling the co-op or your utility.
  first_visit_tips:
  - If you are moving, confirm your start date with your utility before you enroll.
  - Customers on PECO's Customer Assistance Program cannot choose a third-party supplier, so check that
    first.
  - If you would rather talk to someone, the office is open weekdays 9 am to 5 pm.
