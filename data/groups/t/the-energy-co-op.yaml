summary: A community energy supplier for homes and businesses in Southeastern Pennsylvania that sells
  wind and solar electricity. Customers who join can vote for the board and help shape its programs.
what_you_do: Switch your home or business power to the co-op, vote in member decisions, and attend member
  meetings, fairs, expos, and talks.
