  newcomer_friendliness: 3
  basis: Productions are free and open to the public, and one form covers auditions, volunteering, and
    work roles, but the site lists no dated events or newcomer details to judge a first visit by.
  what_to_expect: The site does not describe a first visit. Many past productions were staged outdoors
    in Philadelphia parks, several of them free, so for a park show bring your own chair. The group says
    it works with actors, playwrights, directors, stage managers, sound engineers, and DJs, so name the
    role you want on the form.
  first_visit_tips:
  - Check the website or mailing list for the next free production, since show dates are not listed on
    the site.
  - Name the role you want on the form, such as stage crew, sound, DJ, or playwriting.
  - For outdoor park shows, bring your own chair; past free outdoor shows asked audiences to do so.
  - Call 484-326-2596 if you want to ask before filling in the form.
