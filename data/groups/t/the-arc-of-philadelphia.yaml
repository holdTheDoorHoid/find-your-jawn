first_step:
  how: Register for a Zoom Ask the Advocate drop-in hour through the registration link on arcphiladelphia.org.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Drop-in Zoom hours, a listed phone line and an online intake form are open to families and individuals,
    but the site does not describe a welcome for newcomers.
  what_to_expect: 'An Ask the Advocate hour is a drop-in Zoom call: you register, join, ask about school
    planning or IEPs, and leave when you are done. The parent IEP trainings cover topics such as parent
    rights, evaluations, writing goals and assistive technology, and the site posts slides for some sessions
    as downloads. The site does not say how long a session lasts or what it costs.'
  first_visit_tips:
  - Use the registration link on the Arc's home page for the Zoom hour, and write down your questions
    about your child's school plan before you join.
  - The main office is at 2350 West Westmoreland Street, 19140, but the site does not list office hours
    or transit, so call 215-229-4550 first.
  - When you call, ask about sign language, wheelchair access and other accommodations, since the site
    does not describe them.
  - Ask about training fees and how membership is billed before you register, since the site does not
    list training costs.
