summary: A nonprofit that advocates for people with intellectual and developmental disabilities and their
  families. It runs parent trainings, Zoom drop-in hours for school planning help, and a youth leadership
  program.
what_you_do: Go to a parent IEP training or a Zoom Ask the Advocate drop-in hour for school planning help,
  or ask about the youth leadership program for people ages 14 to 21 with disabilities. Families can also
  send the online intake form to ask for help and connections to other services.
