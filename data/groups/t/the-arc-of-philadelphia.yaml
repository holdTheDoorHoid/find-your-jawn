summary: A nonprofit that advocates for people with intellectual and developmental disabilities and their
  families. It runs parent training sessions on special education topics, Zoom drop-in hours for school
  planning help, and a youth leadership program.
what_you_do: Join a Zoom Ask the Advocate drop-in hour for school planning help, go to a parent IEP training
  on topics such as parent rights and evaluations, or ask about the youth leadership program for people
  ages 14 to 21 with disabilities. Families can also send the online intake form to ask for help and connections
  to other services.
