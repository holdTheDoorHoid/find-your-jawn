first_step:
  how: Call 215-229-4550 or send the online intake form to ask for help, or join a Zoom Ask the Advocate
    hour through the site's registration link.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Drop-in Zoom hours, a listed phone line and an online intake form are open to families and individuals,
    though the site does not describe a welcome for newcomers.
  what_to_expect: An Ask the Advocate hour is a drop-in call on Zoom, so you can join, ask about school
    planning and IEPs, and leave when you are done. Parent IEP trainings cover topics such as parent rights,
    evaluations, writing goals and assistive technology, and some session slides can be downloaded from
    the site. The site does not say how long sessions last or what the trainings cost.
  first_visit_tips:
  - Ask the Advocate hours are on Zoom, so use the registration link on the site to join.
  - The main office is at 2350 West Westmoreland Street, 19140. The site does not list office hours or
    transit, so call first.
  - When you call, ask about sign language, wheelchair access or other accommodations, since the site
    does not describe them.
  - Ask about training fees when you register, since the site does not list them.
