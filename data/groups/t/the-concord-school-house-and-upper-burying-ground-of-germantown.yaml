summary: Looks after the Upper Burying Ground, a cemetery started in 1693 in Germantown, and the Concord
  School House, a schoolroom built in 1775 on the cemetery's corner. Visitors can see both during public
  hours and at summer evening events.
what_you_do: Visit the burying ground and the schoolroom during public hours, or come to an event such
  as the evening Firefly Hours. The site does not list volunteer or membership options.
