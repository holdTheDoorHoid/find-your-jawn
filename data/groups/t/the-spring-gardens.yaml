summary: A volunteer-run community garden that neighbors started in 1995 in the Spring Garden area. Members
  grow food and flowers, and the garden also runs cooking workshops, gardening classes, school tours,
  and bike tours.
what_you_do: Garden members, who live inside the garden's boundaries, grow a plot. Volunteers sign up
  through a GivePulse page linked from the site. The garden also hosts events such as a yoga class and
  food truck nights.
