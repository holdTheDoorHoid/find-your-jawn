summary: A Puerto Rican arts and culture center in North Philadelphia that shows art, runs youth and family
  art programs, and keeps an archive on Puerto Rican history in the city.
what_you_do: Enroll in the weekday after-school Cultural Exploration Program for K to 8 students, a summer
  camp, or the Young Artist Program. Adults can come to a tour or hands-on workshop, see an exhibition
  or public talk, or become a member.
