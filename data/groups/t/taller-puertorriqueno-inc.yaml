first_step:
  how: New after-school students fill out the CEP English Application on the after-school page, or returning
    families email mrodriguez@tallerpr.org. Adults can call 215.426.3311 or come to the next public event.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The after-school page sets out a clear first step for new students, and public events list how
    to get tickets or an RSVP. The site also welcomes visitors to tours and the bookstore.
  what_to_expect: Students in the after-school program spend weekday afternoons from 3 to 6 pm in cultural
    exploration activities, after a one-time $30 registration. Public exhibitions and talks are open to
    visitors, and some events ask for an RSVP. The bookstore and archive are on site.
  first_visit_tips:
  - Call 215.426.3311 before you visit to ask about accommodations
  - Check the events page for RSVP dates on panels and talks
  - The bookstore and archive are on site, so you can come just to look around
