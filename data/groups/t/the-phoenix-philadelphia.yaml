first_step:
  how: Reserve a spot on the Friday chair yoga listing (Fox Chase Library, 10:30 am), or send a question
    through the Contact Us page on thephoenix.org.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The site says people seeking connection are welcome, whether or not they are in recovery, and
    the Friday chair yoga is listed for all levels with a Reserve Spot button.
  what_to_expect: The Friday chair yoga is 60 minutes, listed for all levels, with 15 spots per listing.
    The Saturday community yoga is a 60 minute gentle, slow flow class, and mats are provided. The site
    describes its activities as led by volunteers.
  first_visit_tips:
  - Reserve your spot on the listing first, since each class lists a limited number of places.
  - Check the listing before the Saturday class, since it is held weather permitting.
  - You do not need to bring a mat to the Saturday class, because the listing says mats are provided.
