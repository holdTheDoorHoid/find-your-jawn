summary: A nonprofit community for people in recovery, the people who love them, and anyone who wants
  friends without alcohol or drugs. Its Philadelphia programs include workouts, art, social meetups and
  other free events.
what_you_do: Go to free sober activities led by volunteers, such as weekly chair yoga, weekly community
  yoga, fitness sessions, art, or social meetups. The listings checked have a Reserve Spot button. To
  volunteer, the site describes a short process that starts with its NewForm app and includes attending
  two events first. A sober community center is planned for North Philadelphia, with no opening date given.
