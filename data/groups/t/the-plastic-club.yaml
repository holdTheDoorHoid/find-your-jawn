summary: A volunteer-run art club in Center City that has supported artists since 1897. It runs weekly
  drawing and open studio sessions, monthly art shows, and film, music and poetry nights.
what_you_do: Drop in to a weekly drawing or open studio session for a small fee, or apply to join the
  club as a member. Artists can also enter its monthly exhibitions.
