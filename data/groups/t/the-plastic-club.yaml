summary: A volunteer-run art club in Center City that has supported artists since 1897. It runs weekly
  drawing and open studio sessions, monthly art shows, and film, music and poetry nights.
what_you_do: 'Drop in to a weekly drawing or open studio session. Where a fee is listed it is $5 to $10,
  and most sessions need no booking. You can also apply to join the club as a member: full membership
  is $60 a year, associate $40, and long distance $25. Artists can enter the club''s exhibitions through
  its open calls.'
