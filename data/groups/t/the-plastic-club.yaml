first_step:
  how: Read the Guide to Workshop Etiquette on the weekly workshops page, then come to a Thursday or Saturday
    open studio. New printmaking participants should text 609-682-1088 to book with the monitor first.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: Most workshops need no booking and are open to the public, though new people must read the etiquette
    guide first. Printmaking needs an appointment, and no beginner class is listed.
  what_to_expect: Most life drawing sessions run about three hours with a model, and the club brings easels,
    drawing boards and small tables. The page does not say what to bring, so bring your own supplies if
    you have them. Printmaking is the one session that needs a booking first.
  first_visit_tips:
  - Read the Guide to Workshop Etiquette before you come, since every new participant is asked to.
  - Bring your own drawing supplies, since the page lists only easels, boards and tables from the club.
  - No pets are allowed in workshops, and the mask policy applies to indoor sessions.
