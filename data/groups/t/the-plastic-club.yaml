schedule:
  text: 'Sessions run Monday to Saturday, from mornings into evenings. Examples: Tuesday 9:30 am to 12:30
    pm (clothed portrait model), Thursday 5:30 to 8:30 pm (life model), and Saturday 9:30 am to 12:30
    pm (croquis with life model). A printmaking open studio runs Saturday 10 am to 2 pm. A Tuesday night
    Zoom share is also listed.'
