schedule:
  text: 'Sessions run Monday to Saturday, mornings through evenings. Examples: Tuesday 9:30 am to 12:30
    pm (clothed portrait model), Thursday 5:30 to 8:30 pm (life model), and Saturday 9:30 am to 12:30
