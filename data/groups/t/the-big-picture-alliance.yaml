summary: A Philadelphia nonprofit that teaches digital filmmaking and video skills to young people. Students
  make their own films, and most programs include a stipend.
what_you_do: 'Apply to one of its youth media programs: a summer teen program, a 9-month teen fellowship,
  a paid fellowship for young adults, a summer intensive for young adults, or a film studies class for
  young adults. Most programs require Philadelphia residency.'
