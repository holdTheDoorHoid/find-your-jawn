first_step:
  how: Call (267) 639-6912 on a weekday between 9 am and 5 pm to book a visit at 1539 W. Venango Street.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Any neighbor is invited to call or email for an appointment, which is a clear way in, but the
    site lists no regular meetings or volunteer steps.
  what_to_expect: The office is open by appointment only, so you call ahead on a weekday to set a time.
    Staff can help with foreclosure, rent, emergency housing information, benefits, job training, small
    business start-up, blight, and zoning questions. The page does not give a cost or say how long a visit
    takes.
  first_visit_tips:
  - Call ahead, since walk-in visits are not listed as welcome.
  - Ask whether the Zoom informational meetings have a date, because the site mentions them without a
    schedule or link.
