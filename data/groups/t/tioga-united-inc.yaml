summary: Tioga United is a community organization in the Tioga area of North Philadelphia that serves
  as the neighborhood's Neighborhood Advisory Committee and links residents to City services. Its office
  helps neighbors with foreclosure, rent, benefits, and property questions, by appointment.
what_you_do: Call to set up an appointment at the office at 1539 W. Venango Street for help with foreclosure,
  rent, benefits, job training, small business start-up, blight, zoning, and property tax questions. You
  can also share what you like and want changed in the area.
