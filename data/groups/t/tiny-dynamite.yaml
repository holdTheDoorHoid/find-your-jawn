first_step:
  how: Fill in the volunteer form at tinydynamite.org/volunteer, choosing Ushering, to join the usher
    list. Then buy a ticket to the next show you want to see.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The usher form and ticket sales are open to anyone, but no orientation is described and the page
    does not say how often shows run.
  what_to_expect: Ushers see the show free and get pizza and a drink. The company describes its plays
    as about an hour long, and the page does not say how long a shift lasts or whether ushers get training.
  first_visit_tips:
  - The volunteer form asks for a name, email, and phone; you hear back only when a usher spot opens.
  - Check the Venues page for where each show is staged, since the site lists no parking or transit notes.
  - For ticket questions, call the box office at 215-399-0088 or write to boxoffice@tinydynamite.org.
