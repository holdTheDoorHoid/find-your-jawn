summary: A Philadelphia theatre company that stages one-hour plays for modest ticket prices in small Center
  City venues. Volunteers can usher at shows and see them for free.
what_you_do: Fill in the volunteer form on the site to join the usher list. Ushers see the show for free
  and get pizza and a drink. You can also buy a ticket to a show or come to a special party.
