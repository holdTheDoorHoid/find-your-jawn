summary: A Philadelphia theatre company that makes plays at modest ticket prices in a relaxed, social
  setting. Its shows include pub-style nights with food and drink, and volunteers can usher at shows.
what_you_do: Fill in the volunteer form on the site to join the usher list. Ushers see the show for free
  and get pizza and a drink. You can also buy a ticket to a show or come to a special party.
