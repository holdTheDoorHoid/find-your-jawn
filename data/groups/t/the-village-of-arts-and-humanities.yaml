summary: A community arts and youth organization on Germantown Avenue in North Philadelphia. It runs youth
  arts and farm education, a media lab, and neighborhood projects with young people and local residents.
what_you_do: Call or email to ask about the youth studios (music production, dance, fashion design, ceramics,
  photography, and graphic design) or the Philly Earth farm classes for ages 9 to 19. You can also take
  part in a neighborhood project or sign up for the newsletter. The site lists no volunteer openings.
