  newcomer_friendliness: 2
  basis: The youth pages name the studios and farm classes and give office hours and a phone line, but
    describe no enrollment steps. The only way in is to call or email, so the way in is unclear.
  what_to_expect: Philly Earth classes run after school and in summer for ages 9 to 19. Students learn
    composting, companion planting, and simple builds such as rocket stoves and rainwater collection,
    and they can earn sustainability badges. The site does not say how long a class lasts or what it costs,
    so call the office first.
  first_visit_tips:
  - Call the office on a weekday between 10 am and 5 pm, since those are the listed office hours.
  - Ask about the age range and the start date, since the farm page lists ages 9 to 19 and no start date.
  - The farm classes are taught on the teaching farm on the Village campus at 2544 Germantown Ave.
