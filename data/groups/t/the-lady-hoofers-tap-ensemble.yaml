schedule:
  text: 'Class Series sessions run on Sunday afternoons, in two four-week sessions: 3 to 4 pm for teens
    and adults ages 15 and up, and 4 to 5 pm for youth ages 9 and up. The Youth Ensemble rehearses on
    Sundays through the fall and holds auditions each spring. The Tapcracker holiday show runs each December.'
