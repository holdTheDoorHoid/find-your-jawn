summary: A Philadelphia tap company, founded in 2011, that makes its own tap work and stages a holiday
  show each December. It runs a Class Series, a Youth Ensemble for young women ages 9 to 18, and free
  tap lessons for students at a Philadelphia elementary school.
what_you_do: Take a Class Series session at the intermediate or advanced level, audition for the Youth
  Ensemble each spring, see The Tapcracker holiday show, or ask about the company's free school tap programs.
