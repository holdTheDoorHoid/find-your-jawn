first_step:
  how: Buy a ticket to The Tapcracker, the December holiday show, to see the company before you take a
    class.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The Class Series is listed only at intermediate and advanced levels, with the youngest group
    starting at age 9. The Youth Ensemble is by audition, and the summer intensive needs prior tap training.
    No beginner class is listed, so the way in for a true beginner is unclear.
  what_to_expect: The Tapcracker is a ticketed holiday show with four performances over one December weekend.
    A Class Series session is one hour on a Sunday afternoon, for four weeks. The Youth Ensemble is pre-professional,
    so expect serious training rather than a casual class. The site does not list class fees, so ask before
    you register.
  first_visit_tips:
  - Sign up for the newsletter to hear when Class Series registration opens.
  - Everyone needs a ticket to The Tapcracker, and children under three are not admitted.
  - All sales are final, and the show goes on rain or shine with no weather refunds.
  - For accessible seating, email the box office, since the orchestra and mezzanine seats avoid stairs.
