  notes: The building has an elevator to all three floors and an accessible restroom on the first floor.
    Visitors with special needs can enter by a ramp from the rear parking lot and ring the intercom at
    its top to reach the receptionist. One accessible parking space is in the garden, reached from St.
    James Street.
