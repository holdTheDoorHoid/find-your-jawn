summary: A member supported library, archive and talk space focused on Philadelphia's books, buildings
  and history. Members can borrow books, and visitors can join small discussion groups and attend talks.
what_you_do: Join a book club, a discussion circle, or a Spanish, French or Italian conversation group,
  take a database course, or go to a talk. Some groups are free, and others show a price on each listing.
  Research visits are by appointment.
