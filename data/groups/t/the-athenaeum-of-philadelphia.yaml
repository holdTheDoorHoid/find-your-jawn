first_step:
  how: Open the events page, pick a discussion group, conversation group or talk, and use its registration
    link. Or call 215-925-2688 to ask how to join.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Groups and talks are listed publicly with dates, prices and sign up links, and a phone line is
    given for questions. The page does not say who may attend each group.
  what_to_expect: Most groups are small circles that meet on a set day and time, and each listing shows
    its date, time and price. Visitors can come to the building during posted hours, and research visits
    need an appointment. The page does not say how long a session lasts or how many people usually come.
  first_visit_tips:
  - The Athenaeum is at 219 S. 6th Street, on the east side of Washington Square, below Walnut Street.
  - 'Parking garages are about half a block south on 6th Street: Independence Place (self park) and Hopkinson
    House (valet).'
  - 'Visiting hours change by day: open until 7 pm on Monday, 10 am to 3 pm on Saturday, and closed on
    several holidays.'
  - Call 215-925-2688 before you come to ask whether a group is open to non-members, since the site does
    not say.
