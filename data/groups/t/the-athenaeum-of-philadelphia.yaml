cost:
  level: low
  text: Some groups are free, such as the Spanish, French and Italian conversation groups and some book
    clubs. Some series show a price, such as $90 to $120 for certain monthly discussion groups. Talks
    show a price from about $5 to $25. Student membership is $50 a year, Young Friend membership (ages
    18 to 35) is $85 a year, the Subscriber level is $160 a year, and a day pass to the reading room is
    $35.
