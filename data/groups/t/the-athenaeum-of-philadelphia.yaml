first_step:
  how: Open the events page, pick a discussion group, conversation group or talk, and use its Learn More
    or Register link. Or call 215-925-2688 to ask how to join.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Groups and talks are listed publicly with days, times and prices, each with a register link,
    and a phone line answers questions. The site does not say who may attend each group.
  what_to_expect: Most groups are small circles, such as a book club or conversation group, that meet
    on a set day and time, and each listing shows its time and price. To see the building first, book
    a docent-led tour, which runs about 30 to 40 minutes and takes up to 8 people. The site does not say
    how long a group session runs, so ask when you register.
  first_visit_tips:
  - The building is at 219 S. 6th Street, a short walk from Washington Square.
  - 'Parking garages are about half a block south on 6th Street: Independence Place (self park) and Hopkinson
    House (valet).'
  - 'Hours change by day: open until 7 pm on Monday and 10 am to 3 pm on Saturday. The building also closes
    on many holidays, such as Thanksgiving and Christmas.'
  - Call 215-925-2688 before you come to ask whether a group is open to non-members, since the site does
    not say.
