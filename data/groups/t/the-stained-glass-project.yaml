first_step:
  how: Pick a workshop on the classes page and sign up through its listing. Email windowsthatopendoors@gmail.com
    with questions; the group says replies take 24 to 48 hours.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The classes page says no experience is needed unless a listing says otherwise, and that most
    workshops suit beginners. It also gives an email address for questions.
  what_to_expect: A workshop usually runs 2 to 4 hours, and you leave with a small piece such as a sun
    catcher, an ornament, or a simple panel made from a pre-set pattern. Most workshops suit beginners,
    so you do not need to bring any skill. Each listed workshop costs $150.
  first_visit_tips:
  - Wear closed-toe shoes and long pants, and avoid loose sleeves or dangling items.
  - Bring only a closable water bottle, since no food is allowed in the studio.
  - Street parking is limited, so allow extra time, or use a nearby garage or the Broad Street Line.
  - Volunteers can use the Volunteer Interest Form on the Get Involved page, and no stained glass experience
    is needed.
