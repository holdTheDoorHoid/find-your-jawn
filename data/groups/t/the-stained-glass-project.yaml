summary: A nonprofit that brings stained glass to Philadelphia public high school students and also teaches
  stained glass workshops at its studio on South Broad Street.
what_you_do: Sign up for a stained glass workshop, which usually runs 2 to 4 hours, and make a small piece
  from a pre-designed pattern, such as a sun catcher or ornament. Volunteer through the Volunteer Interest
  Form, where no stained glass experience is needed. Families can also use the Interest Form to express
  interest in the student program for the 2026 to 2027 school year.
