first_step:
  how: Fill out the short volunteer survey linked from the Volunteer button on phillysuns.org, or email
    volunteer@phillysuns.org with questions. Youth coaches also complete onboarding and paperwork.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The volunteer page gives a short survey and an email address, which is a clear way in. It does
    not say how a young person joins a team, so it is not rated higher.
  what_to_expect: One easy first step is to watch a lion dance at a public event, such as the Lunar New
    Year parade in Chinatown in February. Volunteer roles run about 5 to 10 hours a month, or 3 hours
    on Saturday mornings for youth basketball coaches during the season. The site lists no fee to take
    part, and donations go to programs and scholarships.
  first_visit_tips:
  - Ask which clearances a youth coach needs, since the page says only that clearances are required.
  - Email volunteer@phillysuns.org before you come, since no phone number is listed.
  - Check the news page for the date of the next Lunar New Year parade.
