first_step:
  how: Read a few recent pieces on the site, then join the mailing list or send a pitch to editor@thinkingdance.net,
    following the guest writer page.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Anyone can read the journal and join the mailing list, and the site invites new writers to pitch.
    Guest capacity is limited and staff write most pieces.
  what_to_expect: Nothing happens in person, since the group works through its online journal. A pitch
    is shaped with an editor first, and the editorial board then decides whether to commission the full
    piece. Guest pitches are accepted all year, and open calls for new writers come every one to two years.
  first_visit_tips:
  - Read a few recent pieces first to get the tone, since reviews make up most of the journal.
  - A pitch should include a subject outline, the view you would bring and a writing sample, as the guest
    writer page asks.
  - A Philadelphia dance connection is encouraged but not required.
