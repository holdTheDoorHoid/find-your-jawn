summary: The non-credit music and dance division of Temple's Boyer College of Music and Dance. It teaches
  music and dance to people of every age, from babies to grown adults.
what_you_do: Sign up for private lessons, including Suzuki instruction, or for a group class or ensemble.
  Programs include group music and dance classes for babies through teens, adult classes and community
  ensembles, and the Philadelphia String Project for beginning string players. Join the email list for
  news.
