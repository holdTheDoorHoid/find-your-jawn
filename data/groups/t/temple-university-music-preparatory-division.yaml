summary: The non-credit music and dance division of Temple's Boyer College of Music and Dance. It teaches
  people of every age, from babies to adults, through private lessons, group classes, adult classes and
  community ensembles, and it runs the Philadelphia String Project for beginning string players.
what_you_do: Sign up for private lessons, including Suzuki instruction, a group class for children from
  infancy through the teen years, an adult class, or a community band, orchestra or choir. Beginning string
  students in grades 2 to 7 can join the Philadelphia String Project. Join the email list for news.
