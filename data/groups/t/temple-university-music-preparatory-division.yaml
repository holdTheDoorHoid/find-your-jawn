cost:
  level: paid
  text: Individual lessons are $40 for 30 minutes, $60 for 45 minutes and $80 for 60 minutes (traditional
    method, per Temple's course listing). The application for individual lessons is free. Some adult classes
    offer a free intro class. Group class, ensemble and String Project fees are not listed on the pages
    read.
