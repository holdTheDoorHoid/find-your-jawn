first_step:
  how: Create an account in Temple's non-credit course search, complete the free Individual Music Lessons
    application, and wait for the office to match you with a teacher. Or join the Music Prep email list.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Lessons are open to all ages through a free application that carries no obligation, with no audition
    or placement test, and staff recommend a teacher for each student.
  what_to_expect: Private lessons are one on one with a teacher, in 30, 45 or 60 minute blocks. The course
    listing suggests 30 minutes for children 12 and under and 45 minutes for older students and adults.
    New students can start partway through the semester, with the fee prorated.
  first_visit_tips:
  - Have your instrument, your experience and your availability ready, because the application asks for
    them.
  - Choose a 30, 45 or 60 minute lesson; the listing suggests 30 minutes for children 12 and under.
  - Ask the office where lessons take place, since the site does not give lesson rooms or times.
  - Ask about refunds and absences, which are set out in a separate policy document.
