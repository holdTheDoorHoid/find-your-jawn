  gear: Students bring their own instrument for the String Project and the ensembles; the adult guitar
    class also needs an acoustic guitar and tuner.
first_step:
  how: Complete the free Individual Music Lessons application in Temple's non-credit course search, and
    the office will match you with a teacher.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The String Project needs no audition or prior experience and invites families to open houses,
    and some adult classes offer a free intro class. Individual lessons need an application first, and
    the site does not describe a first-day welcome, so this is a 4 rather than a 5.
  what_to_expect: Private lessons are one on one with a teacher, in 30, 45 or 60 minute blocks, and the
    course listing suggests 30 minutes for children 12 and under. Some adult classes are small and informal,
    and community ensembles rehearse one evening a week and perform each semester. New students can start
    partway through a semester, with the fee prorated.
  first_visit_tips:
  - Have your instrument, your experience and your availability ready, since the application asks for
    them.
  - Choose a 30, 45 or 60 minute lesson; the course listing suggests 30 minutes for children 12 and under.
  - Ask the office where lessons and classes meet, since the site does not list rooms; the String Project
    meets at Presser Hall.
  - Ask about refunds and absences, which are set out in a separate policy document.
