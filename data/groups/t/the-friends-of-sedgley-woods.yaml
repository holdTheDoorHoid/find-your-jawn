summary: Volunteers who maintain Sedgley Woods, a 27-hole disc golf course in Fairmount Park. The group
  was founded in 1977 and runs the course's tournaments and weekly organized rounds.
what_you_do: Help with course upkeep at the second Saturday workday, or play in the monthly pro/am singles
  tournaments and the weekly tags. Play is free and the course is open to the public.
