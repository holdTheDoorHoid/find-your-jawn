summary: Volunteers who look after Sedgley Woods, a 27-hole disc golf course in Fairmount Park. They run
  monthly workdays, weekly rounds, and monthly singles tournaments, and playing the course is always free.
what_you_do: Help with course upkeep at the second Saturday workday, or play the weekly rounds and the
  monthly singles tournaments.
