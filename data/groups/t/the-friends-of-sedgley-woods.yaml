schedule:
  text: 'Workdays on the second Saturday of each month, 9 am to noon, with tag results at 1 pm. Weekly
    tags on Thursdays, Saturdays and Sundays all year: Saturday and Sunday start at 11 am, and Thursday
    start times are set by sunset. Monthly pro/am singles tournaments. The course is open from sunup to
    sundown.'
