first_step:
  how: Come to the second Saturday workday, 9 am to noon, at the course, or email friendsofsedgleywoods@gmail.com
    to ask how to join.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: 'The course page says a club member is usually on site to answer questions and show newcomers
    around. It names two easy ways in: a monthly workday or an email. The tags and monthly events are
    described as casual.'
  what_to_expect: 'A workday is a few hours of outdoor work: mowing, weed-whacking, picking up sticks
    and trash, and course projects. Weekend tags start at 11 am, so arrive early to check in. Discs are
    usually sold at the course on Thursdays, Saturdays and Sundays, and play is free.'
  first_visit_tips:
  - Check the group's Facebook page or email before a workday, because workdays are sometimes moved or
    canceled.
  - For a weekend tag, arrive early to check in.
  - Ask a club member on site where to start, since the page says one is usually around to help newcomers.
