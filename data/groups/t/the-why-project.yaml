first_step:
  how: Book a session of the After School Digital Media Labs on the Program Sign-Up page, or email info@thewhyproject.org
    to ask about the summer studios.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The labs can be booked online and are listed as free, so anyone can ask to join. The summer studios
    show no dates or ages on the site, so the rating stays at 3.
  what_to_expect: Each After School Digital Media Lab session runs 2 hours and covers videography, music
    mixing, instrumentation, animation, and production. You choose a day on the booking calendar on the
    sign-up page. The site does not list ages, group size, or what to bring.
  first_visit_tips:
  - Use the booking calendar on the Program Sign-Up page to pick a session day.
  - Email info@thewhyproject.org or call (215) 395-5343 to ask about ages and summer studio dates.
  - The only address the site shows is 602 S 52nd Street.
