summary: A Philadelphia nonprofit, founded in 2021, that runs media and animation studios and a free after-school
  digital media lab. A math and building series is listed as coming soon.
what_you_do: Book a session of the After School Digital Media Labs through the Program Sign-Up page. Summer
  media and animation studios and an English and language arts in animation program are listed, but the
  site shows no dates for them. You can volunteer through the Volunteer page, which links to a VolunteerMatch
  listing.
