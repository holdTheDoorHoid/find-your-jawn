summary: A nonprofit that uses storytelling to fight loneliness, mostly among older adults. Partner sites
  run storytelling groups that bring older adults and younger volunteers together, and the group trains
  youth and professionals in the same approach.
what_you_do: Volunteer through the sign-up form on its Get Involved page, or ask an organization that
  serves older adults near you whether it runs a storytelling group. Students can take part in its four-week
  Grand Camp youth program, which the site describes without dates.
