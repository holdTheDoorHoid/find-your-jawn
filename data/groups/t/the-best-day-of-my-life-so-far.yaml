first_step:
  how: Fill in the volunteer form on the Get Involved page of the group's site.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Storytelling groups run through partner organizations, and the site does not say how an individual
    can join one directly. The volunteer form is the clearest public way in, so the rating is 2.
  what_to_expect: A first step is usually the volunteer form or a story listening session with an older
    adult. The group's guide says a spoken story usually takes 10 to 15 minutes. Storytelling groups meet
    at partner sites such as senior living communities and senior centers, and the site does not list
    meeting times, so ask the partner site when its group meets.
  first_visit_tips:
  - Ask the partner site whether its storytelling group is open to people from outside the building.
  - Use the group's free listening guide before you talk with an older adult, then submit the story on
    the Share a Story page.
  - Students who want Grand Camp need their school or group to apply, with the form due two months before
    the start date.
