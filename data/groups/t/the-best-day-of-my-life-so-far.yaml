summary: A nonprofit that uses storytelling to ease loneliness and isolation, mostly among older adults.
  Storytelling groups meet at partner sites, and the group also trains youth and professionals in the
  same storytelling approach.
what_you_do: Older adults and volunteers meet in storytelling groups at partner sites. Anyone can listen
  to an older adult and share the story on the group's site. Students can take part in the four-week Grand
  Camp program, which a school or group applies to run.
