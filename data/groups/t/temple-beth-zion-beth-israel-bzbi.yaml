summary: A Jewish congregation at 300 South 18th Street in Center City. It holds Shabbat morning services
  in person and on Zoom, weekday morning minyanim, family and early childhood education, and adult learning
  classes.
what_you_do: Join Shabbat morning services or a weekday minyan, take an adult class such as the introduction
  to Judaism or the book club, or ask the office about the Shabbat dinners for young professionals. Membership
  and dues are handled through the office.
