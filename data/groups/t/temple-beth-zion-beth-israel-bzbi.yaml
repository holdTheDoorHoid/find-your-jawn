first_step:
  how: Call the Temple Office at 215-735-5148 with your questions before you come to Saturday morning
    services at 9:30 am.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The worship page says anyone interested in minyan is welcome, the Visiting Us page tells you
    to call the office, and the adult learning page says no one is turned away from congregational learning.
    The site does not describe a first-visit routine, so it is not rated 5.
  what_to_expect: Shabbat morning services start at 9:30 am in the Goldberg Sanctuary, and most in-person
    services can also be joined on Zoom once you get the password from the office. Weekday minyanim are
    morning prayer gatherings open to anyone interested, and a Torah study with Rabbi Mort follows the
    Wednesday minyan at about 8:15 am. The site does not say how long services last, what visitors wear,
    or whether you must register first.
  first_visit_tips:
  - Call the Temple Office at 215-735-5148 or email templeoffice@bzbi.org; weekday hours are 9 am to 5
    pm, and Friday hours end at 3 pm.
  - For pick-up or drop-off by car, call the office to reserve a parking pass; metered street parking
    is also nearby.
  - Ask the office for the Zoom password if you would rather join online.
  - The office is closed on federal holidays and many Jewish holidays, so call ahead on those days.
