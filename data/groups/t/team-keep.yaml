summary: A nonprofit that helps Philadelphia residents get back the ID papers they need for housing, jobs,
  benefits, and health care. It holds ID clinics at Free Library branches and works with partner sites.
what_you_do: Bring a mailing address to a clinic, where staff help you request birth certificates, photo
  IDs, and Social Security cards. Staff also run a phone and text line.
