  newcomer_friendliness: 3
  basis: The clinics are open to the public, and the site gives a phone line and a clinic calendar. It
    does not say whether you can walk in or need an appointment.
  what_to_expect: At a clinic, staff help you request a birth certificate, photo ID, or Social Security
    card, and you bring a mailing address. The site does not say how long a visit takes or whether you
    need an appointment. It asks for donations and does not state a fee.
  first_visit_tips:
  - Call 1-844-KEEPID before you go to confirm the clinic date and what papers to bring.
  - Bring a mailing address, since the site lists one as a clinic requirement.
  - If you have no ID or no address, ask the hotline first, since the site says help is still available
    for people with missing IDs or no address.
