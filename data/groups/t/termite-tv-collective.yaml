summary: A Philadelphia video and media art collective that makes experimental video, shows its work in
  galleries and screenings, and airs its show on PhillyCAM. Its Places of Power project uses virtual and
  augmented reality to tell neighborhood stories.
what_you_do: Watch the collective's show on PhillyCAM on Friday nights, go to a gallery show or screening,
  or sign up for its newsletter to hear about the next event.
