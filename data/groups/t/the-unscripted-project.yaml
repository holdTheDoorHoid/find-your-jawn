summary: An improv nonprofit that uses improv games to build speaking, teamwork and confidence in young
  people. It runs free improv workshops in Philadelphia public school classrooms and a free afterschool
  improv program for high school students.
what_you_do: Philadelphia high school students in grades 9 to 12 can apply for the free Tuesday afterschool
  improv program at CEG Studios this fall. Adults 18 and up can volunteer to help in school classes. Public
  schools can request a free 10-week improv workshop for their classes.
