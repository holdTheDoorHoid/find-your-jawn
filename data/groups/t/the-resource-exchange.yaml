first_step:
  how: Visit the shop at 1800 N. American St during open hours, or use the volunteer sign-up link on the
    site for the next volunteer day.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Visitors can walk into the shop and gallery with no sign-up, and volunteer days and workshops
    use sign-up links, but the site gives no volunteer age limits or workshop costs.
  what_to_expect: A shop visit is a browse through donated and reclaimed art and craft supplies, sold
    at low prices. The gallery shows work by local artists and makers who use reclaimed materials. Volunteer
    days and workshops have set times and sign-up links, but the site does not give a general shift length.
  first_visit_tips:
  - Free customer parking is in the fenced lot, and the shop sits on the right side toward the north end.
  - The shop is not listed as open on Monday or Tuesday, so plan for Wednesday to Sunday.
  - Ask about the cost of a workshop before you sign up, since the site does not show it.
