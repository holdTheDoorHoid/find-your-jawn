summary: A reuse shop and gallery that sells donated and reclaimed art and craft materials at low prices.
  It runs workshops, a monthly gallery night and volunteer days, and gives artists a gallery call for
  work made from its materials.
what_you_do: Sign up for a volunteer day through the sign-up link on the site, join a workshop such as
  the block printing session, or visit the shop and the gallery night. Artists can apply to the reCreate
  gallery through its open calls.
