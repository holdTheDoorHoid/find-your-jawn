summary: A reuse shop and gallery that sells donated and reclaimed art and craft materials at low prices.
  It runs workshops, a monthly gallery night and volunteer days, and gives artists a gallery call for
  work made from its materials.
what_you_do: Sign up for the Oct 24, 2026 volunteer day through the sign-up link, join a workshop such
  as the Oct 17 block printing session, or visit the shop and the monthly gallery night. Artists can apply
  to the reCreate gallery call (deadline Nov 10).
