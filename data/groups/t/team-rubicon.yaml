summary: A national disaster response group whose volunteers, called Greyshirts, deploy after disasters
  and do home repair and recovery work. Its volunteers helped finish flood repairs in Philadelphia's Eastwick
  neighborhood in November 2024.
what_you_do: After signing up, pass a background check, finish the first training mission, and then accept
  deployment invitations when a response needs volunteers. Work areas include disaster response, long-term
  recovery, medical support, and workforce development.
