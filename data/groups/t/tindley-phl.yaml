first_step:
  how: Sign up through the Volunteer Here link on the soup kitchen page, or subscribe to the newsletter
    on the home page.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The volunteer sign up and newsletter are public and easy to find, but the site gives no meal
    times, guest details, or shift details, so the first visit is hard to plan from the site alone.
  what_to_expect: The site does not describe a meal visit or a volunteer shift, and meal times are not
    published. The church says it serves meals on Tuesdays and Thursdays and hopes to add more weekdays.
    Call before you come to confirm the days, the times, and whether a first time volunteer can join a
    shift.
  first_visit_tips:
  - Call 215-735-0442 before you come, since meal times are not on the site and directory listings are
    unconfirmed.
  - The site gives no entry rules or check in steps, so ask about them when you call.
  - Subscribe to the newsletter on the home page to hear when meal days or events change.
