first_step:
  how: Register through the form for the program you want (youth basketball, girls volleyball, or the
    DASH Music Program), or email info@timoteosports.org with questions.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Each program has a public registration form and the volleyball listing says all skill levels
    are welcome, but the site does not describe tryouts or what a first session is like.
  what_to_expect: The site describes basketball as structured practices, competitive play, and mentorship,
    with no tryouts listed. Girls volleyball meets on Saturday mornings at International Christian High
    School, which the site does not give an address for. The site does not say how long each session runs
    or what the first practice looks like.
  first_visit_tips:
  - Register through the form for each program; the site lists no drop in visits.
  - Basketball meets at Esperanza, 4261 N 5th St; the DASH Music Program meets at the office, 1300 W Hunting
    Park Ave.
  - Ask the office for the street address of the volleyball location, since the site gives only the school
    name.
  - Call (609) 200-1351 or email info@timoteosports.org; the contact page also has a form.
