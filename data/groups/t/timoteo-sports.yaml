summary: A youth sports and mentoring group based on West Hunting Park Avenue in Philadelphia. It runs
  fall basketball and girls volleyball for kids, a free music program for teens, and after-school and
  mentoring work.
what_you_do: Families register kids for fall basketball (ages 6 to 14) or girls volleyball. Teens register
  for the free DASH Music Program (ages 12 to 18). The group also lists mentoring programs and scholarships.
