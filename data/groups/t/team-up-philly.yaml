first_step:
  how: Register your girl through the TeamSnap form linked from the Team Up Philly programs page; the
    programs are free.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Programs are free and open to girls in the listed grades through a clear registration button,
    though the site does not describe a first day or a welcome for newcomers.
  what_to_expect: Girls Club meets twice a week after school at Bluford or John Barry Elementary, or at
    the Daroff Rec Center during the Rebuild construction, and Team Up Philly provides rides to Daroff
    at dismissal. Sessions mix fitness drills, basketball basics, tennis and yoga with talks on teamwork,
    goal-setting and self-care, and the girls complete a community service project. The program is free,
    and the site does not list start or end dates for the season.
  first_visit_tips:
  - Register through the TeamSnap form on the programs page; the site lists no deadline, so register early.
  - Be ready at dismissal on Monday or Wednesday, since pick-up is by 5:30 pm.
  - If your school is under construction, ask which site your girl goes to, since some girls attend Daroff.
  - Ask about gear and any forms before the first day, since the page does not list them.
