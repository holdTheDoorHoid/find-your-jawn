summary: A nonprofit that runs free sports and enrichment programs for girls in Philadelphia, including
  tutoring, an after-school Girls Club and a leadership academy for high school girls.
what_you_do: Girls join a free after-school Girls Club for grades 4 to 8, a free summer camp for grades
  4 to 12, or the G.I.R.L.S. Leadership Academy for grades 9 to 12. Volunteers can coach, tutor or speak
  to the girls, and the group also runs summer scholarships and events.
