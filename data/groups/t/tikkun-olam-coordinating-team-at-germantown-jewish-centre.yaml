first_step:
  how: Call the synagogue office at 215-844-1507 or email office@germantownjewishcentre.org to ask about
    the next election session and how to get the Zoom link.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: The session page is written for members and does not say whether others can attend, so the way
    in is to ask the office first, even though prospective members are welcome to call and visit.
  what_to_expect: A recent session ran on Zoom for 90 minutes, from 7 to 8:30 pm, where the team reviewed
    possible actions and decided which ones neighbors might take on together. The page does not say how
    many people attend or whether guests are welcome. Ask the office before you plan to join.
  first_visit_tips:
  - Ask the office whether the next session is open to people who are not members.
  - 'The session page names four partner groups: ACLU of Pennsylvania, Committee of Seventy, Election
    Protection, and the Philadelphia Neighborhood Networks Action Network. Read what each one offers before
    you come.'
  - The session page asks people to RSVP by email to get the Zoom link, so the office can point you to
    the right person.
