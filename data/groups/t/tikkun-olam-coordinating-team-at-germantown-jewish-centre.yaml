summary: A volunteer team at Germantown Jewish Centre, a synagogue, that follows up on election security
  and voter protection. It holds Zoom sessions where people talk through local actions they can take.
what_you_do: Share voter education, learn about poll worker and poll watcher roles, and talk through local
  actions. Members can bring their own ideas.
