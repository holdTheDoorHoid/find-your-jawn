schedule:
  text: 'Teams practice about once a week and play games mostly on Saturdays, with Friday night games
    for some boys'' basketball teams. Seasons differ by sport: soccer starts in September, basketball
    runs from mid-November to mid-March, and in-house baseball starts after Easter.'
