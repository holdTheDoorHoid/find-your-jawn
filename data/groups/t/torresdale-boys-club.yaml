cost:
  level: low
  text: Soccer and in-house baseball are $80 per child. Soccer and baseball travel teams cost $165 for
    the first child and $125 for each more. Basketball is $90 for Little Hoopers and $150 for Developmental,
    with travel at $165. The family cap is $325. Scholarship help is not stated.
