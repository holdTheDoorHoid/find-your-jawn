summary: A Northeast Philadelphia club with baseball, softball, soccer, and basketball teams for boys
  and girls, with in-house and travel teams sorted by age.
what_you_do: Kids join in-house or travel teams by age and can take part in neighborhood social and community
  service events. Parents are encouraged to volunteer as coaches. Current updates are sent to a Facebook
  group.
