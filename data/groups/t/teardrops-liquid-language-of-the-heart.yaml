first_step:
  how: Tune in to the next Tuesday morning teaching or the third Thursday women's table, live on Facebook
    or YouTube.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The sessions are public and streamed live. The site describes no sign up step, but it does not
    say how to ask questions or take part.
  what_to_expect: Sessions are streamed live, so you can watch from home without a visit. The Tuesday
    teaching is a talk from the host about faith and focus, and the monthly women's table is a conversation
    about spiritual growth and purpose. The site does not say how long each session runs or whether viewers
    can join in.
  first_visit_tips:
  - Open the Facebook or YouTube page a few minutes before the start time.
  - There is no in-person meeting place on the site, so plan to watch from home or on a phone.
  - The site lists a series called When Tears Speak as coming soon, with no start date, so check back
    for it.
