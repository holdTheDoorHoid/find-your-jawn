first_step:
  how: Fill in the short form on ttwwlabs.org (first and last name and email, with an optional mobile
    number) to ask about joining a discussion group.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The site describes beginner-style digital skills courses for seniors and gives a home-page form
    and a booking option to start.
  what_to_expect: Joining a discussion group starts with the home-page form. Senior courses last 16 weeks
    and mix in-person workshops, Zoom sessions, and helpline support, with take-home guides. The site
    does not say how long a discussion lasts or what it costs.
  first_visit_tips:
  - Have your email address ready before you fill in the home-page form.
  - You can book a phone call or a Zoom call with Wayne before you join.
  - The helpline runs around the clock, so you can call at any hour.
