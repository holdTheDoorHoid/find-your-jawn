summary: 'A nonprofit that offers free tech help, especially to older adults: a free helpline, in-person
  discussion groups, a newsletter, a TV show and a podcast.'
what_you_do: Call the helpline for tech questions, join a discussion group through the home-page form,
  or ask Wayne to set up a group at a church or community center. Its senior courses teach smartphones,
  email, video calls, online health tools, scam safety, and how to spot misinformation.
