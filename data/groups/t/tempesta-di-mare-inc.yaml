summary: A Philadelphia baroque orchestra that plays music from about 300 years ago, makes new performing
  editions, and researches works that were forgotten. Audiences attend a season of recitals and full orchestra
  concerts.
what_you_do: Buy a ticket to a recital or orchestra concert. Adults under 40 can get a discount on a season
  pass through the group's Young Friends program, which also invites members to events where they can
  meet the musicians.
