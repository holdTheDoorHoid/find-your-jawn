first_step:
  how: Buy a single ticket for an upcoming recital or concert through the ticket link on tempestadimare.org,
    or call 215-755-8776.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Anyone can buy a ticket online, by phone or at the door, so the way in is clear. The site does
    not describe a welcome for newcomers at concerts, so the rating is 3 rather than higher.
  what_to_expect: Concerts are performed by a baroque orchestra that plays without a conductor, as was
    common when this music was new. Single tickets cannot be refunded or exchanged, while season pass
    tickets can be exchanged for other performances, subject to availability. The Baroque Music 101 guide
    on the site explains the era, instruments and composers in plain words, so you can read it before
    a first concert.
  first_visit_tips:
  - Single tickets cannot be refunded or exchanged, so check the date before you buy.
  - Youth under 17 and full-time students with ID get free admission, so bring ID.
  - Call 215-755-8776 or email info@tempestadimare.org about seating or ASL before you buy, since accessibility
    details vary by event.
  - Season pass buyers under 40 bring ID to the door for the Young Friends discount.
