summary: A faith-based charity whose Greater Philadelphia unit uses volunteers for meals, holiday service,
  and disaster response. In February 2025, its volunteers served meals to first responders during the
  plane crash recovery and at the Eagles parade.
what_you_do: Serve meals, help with facilities, ring bells during the holidays, work with youth, or join
  disaster response when it is needed. Start from the local volunteer page to pick a role.
