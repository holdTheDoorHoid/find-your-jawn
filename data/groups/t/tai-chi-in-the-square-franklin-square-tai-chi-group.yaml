first_step:
  how: Go to the northeast side of the fountain at Franklin Square at 7:30 am on a Tuesday, Thursday or
    Saturday.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The page says all are welcome at a set place and time, and it describes no sign up. It does not
    say beginners are welcome by name, and it describes no newcomer program.
  what_to_expect: A free outdoor tai chi session from 7:30 to 8:30 am, with the group gathered at the
    northeast side of the fountain. The page does not name a leader or describe the class format. On cold,
    rainy or snowy days, the group moves to the pavilion in the northwest part of the square.
  first_visit_tips:
  - Arrive a few minutes before 7:30 am and look for the group by the fountain.
  - On cold, wet or snowy mornings, look for the group at the pavilion in the northwest part of the square.
  - Dress for the weather in clothes you can move in.
  - For updates, the group's Facebook group is the listed way to join.
