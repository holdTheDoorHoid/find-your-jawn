first_step:
  how: Email twbasketballcamp@gmail.com to ask when the next camp sign-up opens. The most recent sign-up
    form on the site is for the 2026 camp.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The camp sign-up form and a camp email address are public, and the camp takes Philadelphia kids
    ages 6 to 16.
  what_to_expect: The camp runs Monday to Friday from 8:30 am to 3 pm for two weeks in August at two Philadelphia
    sites. Campers play basketball and take workshops in yoga, coding, physical education, and arts and
    crafts, with a guest speaker after lunch.
  first_visit_tips:
  - Pack lunch, a filled water bottle, and any medicine your camper needs.
  - Check which site your camper's week uses, since the two weeks are held at different places.
  - Watch for the confirmation email, which carries the details after you register.
