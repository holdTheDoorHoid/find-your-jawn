summary: A Philadelphia nonprofit for youth and families. It runs a summer basketball camp for kids, a
  yearly turkey drive, and a Martin Luther King Jr. speech contest that gives college scholarships.
what_you_do: Kids ages 6 to 16 can register for the annual summer basketball camp, which pairs basketball
  with workshops and a guest speaker. High school students can enter the MLK Day speech contest, where
  the top three win scholarships, or join Basketball Beyond Buckets for Sunday practices, SAT tutoring,
  and college visits. The group also gives Thanksgiving food to low-income families each November.
