  newcomer_friendliness: 4
  basis: The site says trips, training and events are open to the public and do not need membership. Lessons
    range from recreational kayak and paddleboard to whitewater and pool sessions, so there is a path
    for beginners.
  what_to_expect: Work days and open events happen at the boathouse on Ridge Avenue. The site does not
    say how long a lesson runs or what it costs, so ask by email before you sign up for one.
  first_visit_tips:
  - Park along the driveway if there is room, or follow the Additional Parking signs
  - A SEPTA bus stop sits at the driveway entrance on Ridge Ave, at the traffic light
  - Email admin@philacanoe.org to ask about lesson times and prices before you come
