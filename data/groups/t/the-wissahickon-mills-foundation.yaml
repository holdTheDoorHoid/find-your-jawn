summary: A paddling club founded in 1905 that teaches canoeing, kayaking and stand-up paddleboarding from
  its boathouse on Ridge Avenue. It runs trips, training and social paddles through the year.
what_you_do: Take a lesson, join an open club event or trip, or come to a work day at the boathouse. Club
  trips, training and events do not require membership.
