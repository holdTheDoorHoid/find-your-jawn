summary: A paid season program, offered through the Philadelphia Runner store, that trains runners for
  spring and fall races. A season membership includes weekly group runs and training plans, and race entries
  cost extra.
what_you_do: Train with a group for a spring or fall race. The membership brings weekly group runs, supported
  Saturday long runs, clinics, info sessions and team social events.
