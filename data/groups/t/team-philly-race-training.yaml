first_step:
  how: Buy a season membership on the RunSignUp program page, which lists four options.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: The program is for beginner to intermediate runners, but a paid membership comes before you can
    see the group runs, and the page does not say how a new runner starts.
  what_to_expect: The page does not describe a typical group run, so ask the program about run times and
    distances before you pay. Members get a training plan for the race they pick, weekly group runs, supported
    Saturday long runs, and team clinics and social events. Race registration is separate and is not included
    in the membership.
  first_visit_tips:
  - 'Pick the membership that matches your race: spring, fall half marathon, fall marathon, or the full
    year.'
  - Register for each race separately, since the membership does not include race entries.
  - Ask about run times and the meeting spot before you pay, since the page does not list them.
