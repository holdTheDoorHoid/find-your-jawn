first_step:
  how: Come to a Walk with Me or Run with Me, using the date and meeting time from the partner events
    calendar, or fill in the volunteer form to join a cleanup or planting day.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The walks are free and open to visitors. The site invites new people to bring a friend and lists
    a volunteer form and a contact form, but it does not say beginners are welcome by name.
  what_to_expect: The walks and runs are free and happen weekly on the park trails. The Friends site does
    not list meeting points, distances or paces, so check the events calendar first. The site invites
    new people to bring a friend. For volunteer days, you fill in the online form, and someone from the
    group contacts you after you submit.
  first_visit_tips:
  - Check the events calendar for the walk's meeting point, time and distance before you go.
  - Take a SEPTA bus to a neighborhood gateway. The park's interactive map shows the closest one, and
    buses 18 and 26 stop at some gateways.
  - Watch your footing on the narrow, curved trail. In an emergency, call 911 and give the nearest gateway
    or intersection.
  - Send questions through the Contact Us form on the Friends site.
