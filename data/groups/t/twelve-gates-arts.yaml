first_step:
  how: Visit the gallery at 106 North 2nd Street during posted hours, or get a ticket for a talk or screening
    from the all-events list.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The gallery is open to the public on posted hours, and it gives a phone number and an email for
    questions. The site names no beginner programs.
  what_to_expect: Visits during posted hours are open to the public, so you can look at the current exhibition.
    Openings, talks and screenings are listed by date on the events page, and some need a ticket. Tuesday
    visits need an appointment, so call or email first if that is the day you have.
  first_visit_tips:
  - Check the all-events page before you go, since some talks and screenings need a ticket.
  - The gallery is closed Sunday and Monday, and Tuesday visits need an appointment made by email or phone.
  - The site does not say whether a visit is free, so call (215) 253-8578 to ask first.
  - The gallery is at 106 North 2nd Street in Old City.
