summary: Tacony Civic Association is a neighborhood membership group in Tacony. It holds general membership
  meetings several times a year and lists local projects that neighbors can join, such as the Disston
  Park and Community Garden, a yard sale, and Hometown Hero banners. The City also registers it as a community
  organization to be consulted on nearby zoning and development.
what_you_do: Members meet at general membership meetings, and the group lists projects neighbors can take
  part in, including the Disston Park and Community Garden, a yard sale, and Hometown Hero banners.
