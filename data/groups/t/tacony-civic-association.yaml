first_step:
  how: Email taconycivicassociation@gmail.com to ask which room the next general membership meeting is
    in, then come on the second Wednesday at 7 pm.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: A membership form is posted, but the site gives no dues and does not say whether visitors may
    attend meetings, so the way in is unclear.
  what_to_expect: The site describes the general membership meetings but not what happens at them, how
    long they run, or who attends. Membership is through a form on the site, and no dues amount is stated.
    Ask the association before your first meeting.
  first_visit_tips:
  - Ask whether visitors are welcome at general membership meetings before you come.
  - Watch the newsletter or the website for the meeting room, since the site says it is announced there.
  - Read the membership form on the site to see the dues before you join.
