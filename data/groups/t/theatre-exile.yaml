first_step:
  how: Fill in the online volunteer and usher form linked from the site, or RSVP for the open house on
    Sunday, October 11, 2026 (3 to 6 pm) and ask about ushering there.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The usher and volunteer form is open to the public, ushers see shows for free, and the open house
    is a public stop by, but the site does not say it welcomes newcomers by name or describe training,
    so it is not rated higher.
  what_to_expect: Ushers help at productions and volunteers help in the office, and both see the shows
    for free. The page does not say how long a shift runs, whether there is training, or how often shifts
    come up, so ask when you apply. The open house on October 11 is a free stop by event with popcorn
    and pizza, a good chance to ask about ushering.
  first_visit_tips:
  - Arrive at least 30 minutes early, since seating opens about 20 minutes before curtain.
  - Street parking nearby is free but some spots have a 2 hour limit; the municipal lot at 12th and Reed
    Streets is about a 2 minute walk and often fills up.
  - If you will be late, call the Box Office at 215-218-4022 so the House Manager can plan for you.
  - Turn off electronic devices before the show.
