summary: A nonprofit theatre in South Philadelphia that stages new and provocative plays. Its education
  programs include school residencies and camps, and volunteers and ushers can help at the theatre.
what_you_do: Volunteer as an usher or in the office, which also gives free entry to shows, or join the
  education programs (school residencies and camps). An open house on Sunday, October 11, 2026, 3 to 6
  pm, is open to visitors, with an RSVP link on the site.
