first_step:
  how: Fill in the online volunteer and usher form linked from the site, or come to the open house on
    Sunday, Oct 11, 2026 (3 to 6 pm) and ask about ushering.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The usher and volunteer form is open to the public, ushers see shows for free, and the open house
    is a public drop by. The site lists no usher training and no minimum age for ushers.
  what_to_expect: Ushers work at productions, and volunteers can also help in the office. The page does
    not say how long a shift runs, whether there is training, or how often shifts come up, so ask when
    you apply. Ushers and volunteers see the shows for free.
  first_visit_tips:
  - Arrive at least 30 minutes early, since seating opens about 20 minutes before curtain.
  - If you will be late, call the Box Office at 215-218-4022 so the House Manager can plan for you.
  - Turn off electronic devices before the show, and food bought at the concessions can be taken into
    the theatre.
  - Ask the Box Office in advance about special seating for an access need.
