cost:
  level: paid
  text: Single show tickets are sold separately, and a 3-show Flex Pass starts at $45. Students and seniors
    65 and up get $10 off single tickets with ID, and residents of ZIP codes 19145, 19146, 19147 or 19148
    get $5 off with ID. Ushers and volunteers see shows for free.
