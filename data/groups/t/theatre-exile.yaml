  notes: 'Ask the Box Office in advance about special seating for an access need. Subscription series
    seating is general admission. Nearest SEPTA: the Broad Street Line (Orange) stop at Tasker-Morris,
    about two blocks away on foot. Access Card holders can get two $5 tickets for some Preview dates of
    subscription shows; the company is not part of the LiveArts ACCESS program.'
