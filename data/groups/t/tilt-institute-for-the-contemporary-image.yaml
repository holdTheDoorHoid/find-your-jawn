first_step:
  how: Stop by the gallery at 1400 N. American Street, Suite 103, any Wednesday to Saturday between 12
    and 6 pm to see the current show.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The gallery is free and open to anyone during posted hours, and each tutorial has a booking link,
    but the Studio is members only and expects working knowledge of its software, so the site does not
    invite beginners and the rating is not higher.
  what_to_expect: 'Gallery visits are self guided: you walk through the exhibitions during open hours
    at no charge. Tutorials are booked with an instructor in blocks of 1, 1.5, or 2 hours, at $105 to
    $150 an hour on a sliding scale. The Studio needs a membership and an orientation form first.'
  first_visit_tips:
  - Gallery hours are Wednesday to Saturday, 12 to 6 pm, so plan the visit inside those hours.
  - To book a tutorial, contact Danielle Morris, who handles scheduling, at 215.232.5678.
  - Before using the Studio, new users fill in an orientation form, and the site expects you to know your
    printing software; a tutorial is offered if you need one.
