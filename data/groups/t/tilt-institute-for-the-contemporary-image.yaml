summary: A photography center in North Philadelphia that runs gallery shows, printing services, artist
  residencies, and youth education for photographers and image makers at every level.
what_you_do: Visit the gallery for free, book a one to one photo tutorial, or ask about the youth programs.
  Membership opens the Studio, a members only printing space booked by reservation. The artist residency
  is paid, but applications were closed when the site was read.
