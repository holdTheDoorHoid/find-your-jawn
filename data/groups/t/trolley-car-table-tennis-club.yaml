first_step:
  how: Walk in during open play, sign in when you arrive, and pay the daily fee in cash.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The club says its leagues are open to players of all levels, and walk-ins are welcome during
    open play. No beginner lessons or beginner session is listed now.
  what_to_expect: You sign in when you arrive, pay the daily fee in cash, and start playing when a table
    is open. Matches are usually best 3 out of 5 games, and you can bring a friend or find a partner at
    the club. The page does not list beginner lessons, but it says players of every level are welcome.
  first_visit_tips:
  - Coming by car from Henry Avenue, turn left just before the coffee and pizza shop, pass the gate, and
    park. Go down the stairs by the door nearest the club sign on your right.
  - Bring cash, because daily fees are cash only.
  - Taking SEPTA? The Route 32 bus stops directly in front of Falls Center.
  - To join the Tuesday league, show up before 7 pm. The league is capped at 24 players.
