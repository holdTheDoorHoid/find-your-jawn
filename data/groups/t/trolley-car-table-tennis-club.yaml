first_step:
  how: Walk in during open play, sign in when you arrive, and pay the daily fee in cash.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The club says it welcomes players at every level and accepts walk-ins during open play. It does
    not list beginner lessons.
  what_to_expect: Open play means you sign in when you arrive and play with whoever is there. The club
    welcomes players at every level, but it does not list a beginner session. Adults pay $5 for a day
    of play, and youth under 18 pay $3.
  first_visit_tips:
  - Enter Falls Center from Henry Avenue, turn left just before the coffee and pizza shop, go through
    the gate, and look for the club sign on your right.
  - Go down the stairs by the door nearest the club sign.
  - Bring cash, because daily fees are cash only.
  - Taking SEPTA? The Route 32 bus stops directly in front of Falls Center.
