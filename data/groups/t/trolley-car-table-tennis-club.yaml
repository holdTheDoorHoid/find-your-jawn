cost:
  level: low
  text: Daily play is $5 for adults and $3 for youth under 18, paid in cash. Monthly membership is $40
    for adults and $20 for youth. Yearly membership is $360 for adults and $180 for youth, and a youth
    yearly membership is half price when a parent is a yearly member. League nights cost $5, plus a $5
    club entry fee for non-members.
