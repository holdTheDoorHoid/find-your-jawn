cost:
  level: low
  text: Daily play is $5 for adults and $3 for youth under 18, paid in cash. Monthly membership is $40
    for adults and $20 for youth. Yearly membership is $360 for adults and $180 for youth. Parents or
    guardians who are yearly members get half off the yearly youth membership. Non-members pay $5 per
    person on league nights, plus a $5 club entry fee.
