summary: A table tennis club at One Falls Center in East Falls, open to players of all levels. It runs
  open play every day, a Tuesday league night and monthly tournaments, and it is affiliated with USA Table
  Tennis.
what_you_do: Come to open play, join the Tuesday league night, or take out a monthly or yearly membership.
