summary: A nonprofit independent publisher and community bookstore on Frankford Avenue. It runs a writing
  group, a poetry book club, author events and readings, and it lets community groups book its lower-level
  workshop for free.
what_you_do: Join the writing group or the Poetry is for Everyone book club, go to an author event or
  reading, donate books for store credit, or book the workshop for a community meeting.
