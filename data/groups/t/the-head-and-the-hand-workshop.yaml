schedule:
  text: A writing group about once a month on a Saturday or Sunday afternoon, 2 to 3:30 pm. The Poetry
    is for Everyone book club meets monthly on Sunday afternoons, 2 to 3 pm. Both meet at Valerio Coffee
    Roasters. The store also hosts author events and a children's story time.
