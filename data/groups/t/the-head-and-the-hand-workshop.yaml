first_step:
  how: Register on the events page for the next writing group session or Poetry is for Everyone book club
    meeting, then go to the venue named on that listing.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The writing group is open to writers in any genre and at any stage, and the events page says
    to register for each session. It does not allow drop-ins, so the way in is registration. The events
    page does not say who can join the book club.
  what_to_expect: The writing group meets for about 90 minutes with writers at any stage. The poetry book
    club meets for an hour, and members read and discuss one book at each meeting. Prices are not listed
    for these meetings, and registration is required for the writing group.
  first_visit_tips:
  - Register on the event page before you go, since the writing group does not take drop-ins.
  - Call 267-702-6744 or email info@theheadandthehand.com for directions, parking or transit, since the
    site gives none. The contact page also lists (267) 465-1784.
  - Check the events page for changes, since meetings are sometimes rescheduled.
