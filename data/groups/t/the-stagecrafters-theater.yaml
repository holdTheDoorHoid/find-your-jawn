first_step:
  how: Fill in the Volunteer Interest Form on the volunteer page, or email the volunteer address with
    questions.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The volunteer page says no prior theater experience is needed and links an interest form. The
    audition page says the company welcomes performers of all backgrounds, abilities and experiences.
  what_to_expect: Volunteers can help with lights and sound, set building, costumes, ushering and ticketing,
    and marketing. For a show, you book an audition slot, email a headshot and resume, and callbacks are
    by invitation. The page does not say how much time a volunteer commits to.
  first_visit_tips:
  - Watch for the audition form that goes up about a month before each show's auditions.
  - Email the volunteer address with questions about time commitment, since the page does not give it.
  - Membership asks for four meetings a year (at least two to keep voting rights) and at least one volunteer
    shift a year.
