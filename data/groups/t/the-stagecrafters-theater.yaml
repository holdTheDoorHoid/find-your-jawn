first_step:
  how: Fill in the Volunteer Interest Form on the volunteer page, or email volunteer@thestagecrafters.org
    with questions.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The volunteer page says no previous theater experience is necessary and that staff help place
    new volunteers. The join page says the company casts shows from the community, including first-time
    actors.
  what_to_expect: Volunteers help with lights and sound, building sets, costumes, ushering and ticketing,
    and marketing, and no theater background is needed. The page does not say how many hours a volunteer
    gives, so ask the volunteer address before your first shift. Auditions are by appointment, and performers
    send a headshot and resume after choosing a slot.
  first_visit_tips:
  - Park on the street nearby. The page says on-street parking is usually free during most performances,
    but you cannot park on theater property during a show.
  - Watch for the audition form that goes up about a month before each show's auditions.
  - Email the volunteer address with questions about time commitment before you come, since the page does
    not give it.
  - Membership asks for four meetings a year (at least two to keep voting rights) and at least one volunteer
    shift a year.
