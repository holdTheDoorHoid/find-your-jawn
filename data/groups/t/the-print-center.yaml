summary: A free museum of printmaking and photography in Center City, founded in 1915. It shows changing
  exhibitions and runs a yearly competition for artists, and paid memberships bring member events and
  shop discounts.
what_you_do: Visit the free galleries during open hours, or join one of its exhibition tours (listed for
  Oct 23 and Nov 13, 2026). Artists can enter The ANNUAL competition. Individual members and up get invitations
  to members-only events.
