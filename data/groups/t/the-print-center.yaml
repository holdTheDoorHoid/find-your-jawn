first_step:
  how: Come during open hours to see the free galleries, or call 215.735.6090 ext. 1 to book a guided
    tour by appointment.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: The galleries are free, open to the public and need no sign-up, but the site lists no beginner
    classes and tours need a call to book.
  what_to_expect: A visit is a walk through the current exhibition, The Long Ride Home about Black cowboys
    in America, with no sign-up and no admission fee. Exhibition tours run about 30 minutes, and the events
    page gives their times. If you use a wheelchair, plan around the entry step and the stairs to the
    second floor.
  first_visit_tips:
  - 'Parking: the museum points to the Academy House Parking Garage at 251 S. 15th Street, about one block
    away.'
  - Expect limited seating on both floors.
  - Call 215.735.6090 ext. 1 if you need access details or tour times before you come.
