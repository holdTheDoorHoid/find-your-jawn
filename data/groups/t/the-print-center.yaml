summary: A free museum of printmaking and photography in Center City, founded in 1915. It shows changing
  exhibitions and runs a yearly competition for artists, and paid memberships bring member events and
  shop discounts.
what_you_do: Visit the free galleries during open hours, or book a guided tour, which the site offers
  for each exhibition and by appointment. Artists can enter The ANNUAL competition. Membership starts
  at $30 for students and $40 for artists, and the $50 individual level and up includes invitations to
  members-only events.
