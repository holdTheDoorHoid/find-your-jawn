schedule:
  text: Adapted tango series meet weekly for 4 to 10 weeks, about 1.5 hours a session. The Center City
    Parkinson's series meets Wednesday mornings, 10:30 am to 12 pm. The Cherry Hill, NJ series meets Saturday
    afternoons, 12:30 to 2 pm. Older adult series run on weekday mornings and afternoons in Germantown
    and Stapeley. Current dates are posted on the site.
