summary: A group that teaches adapted Argentine tango to people with Parkinson's, stroke survivors and
  others with movement or neurological conditions, and trains volunteers to dance with them.
what_you_do: Join a tango series as a dancer, with a care partner if you like. Or volunteer as a tango
  dancer or movement practitioner after a training, and help during the classes.
