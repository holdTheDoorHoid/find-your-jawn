summary: A group that teaches adapted Argentine tango to people with Parkinson's, stroke survivors and
  older adults, and trains volunteers to dance alongside them.
what_you_do: Join a weekly tango series of about an hour and a half, with a care partner if you like.
  Or take the free volunteer training, whose next session is October 18, 2026 at Center in the Park, and
  help dance with participants during classes.
