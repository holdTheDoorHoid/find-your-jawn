first_step:
  how: Email hello@tangotherapyproject.org to ask about joining the Center City series, which started
    September 16 and runs to November 18, or register for the Cherry Hill series (starts October 10) through
    its Google Form.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Classes are open to people with Parkinson's, stroke survivors and older adults, care partners
    are welcome, and each series has a register link or an email address. The site does not say whether
    late joining is allowed.
  what_to_expect: Each class lasts about an hour and a half and includes a gentle warm-up, rhythm and
    balance work, partner practice, some tango steps, dancing, and time for refreshments and talk. Trained
    instructors lead the class, and volunteers give one-on-one support. The site does not list the class
    fee.
  first_visit_tips:
  - Bring a care partner if you like, since the site welcomes them to class.
  - Ask about parking, seating and wheelchair access before you go, since the site does not cover them.
  - Ask whether you can join a series that has already started, because the site does not say and the
    Center City series began September 16.
  - The Center City class meets at First Presbyterian Church, 201 S. 21st St.
