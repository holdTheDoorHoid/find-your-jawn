first_step:
  how: Watch the homepage for the link to the next free virtual career session, or email rachel@primaverafund.org
    to ask how to apply to the Primavera Artist program.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The free career sessions are open to all young musicians with a registration link, but the Primavera
    Artist program needs financial need, a year of playing and an audition, and its application steps
    are not posted.
  what_to_expect: The free sessions are virtual, with music professionals presenting and taking questions.
    The site describes them as a virtual job fair for students. Session times are not on the site. The
    Primavera Artist program expects weekly private lessons, a weekly orchestra and a smaller ensemble,
    at least two hours of practice a day, and summer music activities.
  first_visit_tips:
  - Know how many years you have played your instrument, since the artist program asks for at least one.
  - The instrument library is for Primavera Artists, and the site gives no loan terms, so ask by email
    or phone.
  - Artist auditions ask for one major scale and its relative minor, then a solo piece, and no accompanist
    is needed.
  - Email rachel@primaverafund.org or call (267) 908-1710 to ask about applying, since the steps are not
    posted.
