first_step:
  how: Watch the homepage for the link to the next free virtual career session, or email rachel@primaverafund.org
    to ask how to apply to the Primavera Artist program.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The career sessions are free and open to young musicians, with a link posted for each one. The
    mentoring program has entry rules and no posted application steps, so it is not an easy first step.
  what_to_expect: Each career session is virtual and free, with presentations from music professionals
    and time for questions. Session times are not on the site. The Primavera Artist program expects weekly
    private lessons, at least one weekly orchestra program and one smaller ensemble, at least two hours
    of practice a day, and summer music activities.
  first_visit_tips:
  - Know how long you have played your instrument, since the program asks for at least one year.
  - If you do not own an instrument, ask about the instrument library, since the site does not say who
    can borrow one.
  - Use the email on the site to ask about the application, since the steps are not posted.
