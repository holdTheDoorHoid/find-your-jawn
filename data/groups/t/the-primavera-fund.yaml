summary: A Philadelphia group that mentors young musicians toward top music schools and careers, and helps
  students with the cost of study. It runs free career sessions for young musicians and keeps an instrument
  library.
what_you_do: Join a free virtual career session for young musicians, or email the fund about the Primavera
  Artist program. That program requires financial need and at least one year of playing, and the site
  does not say how to apply. Applications for spring 2026 are closed, and the next round is not dated.
