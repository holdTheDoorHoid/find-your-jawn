summary: A Philadelphia group that mentors young musicians toward top music schools and careers, and helps
  students with the cost of study. It runs free career sessions for young musicians and keeps an instrument
  library.
what_you_do: Join one of the free virtual career sessions for young musicians, or ask about the Primavera
  Artist program. That program requires financial need and at least a year of playing your instrument,
  and the site does not say how to apply. Spring 2026 applications are closed, and the page does not say
  when the next round opens.
