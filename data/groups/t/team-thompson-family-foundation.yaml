summary: A Philadelphia charity that works against hunger, low literacy, and poor access to hygiene supplies
  among low-income families. Its site names a holiday celebration and a summer basketball month.
what_you_do: You can donate, join the foundation's network of supporters, or email it to ask about helping.
  Each August, Philly Legendary Summer Hoops Month brings basketball events, including a youth camp and
  the Chosen League, where spectators can get wristbands.
