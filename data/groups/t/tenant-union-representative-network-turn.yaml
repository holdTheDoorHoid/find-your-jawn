id: tenant-union-representative-network-turn
name: Tenant Union Representative Network (TURN)
aka: []
leads: []
ein: null
summary: A Philadelphia tenant group that teaches renters their rights, runs eviction and repair clinics,
  and helps tenants form tenant unions in their buildings. It also staffs help lines for renters.
what_you_do: Sign up for a free one-hour tenant rights webinar, in person or on Zoom, call the hotline
  for counseling, attend a repair or eviction defense clinic, or join the Network as a renter who organizes
  with neighbors.
