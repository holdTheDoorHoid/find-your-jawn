first_step:
  how: Register for a webinar by calling 267-635-4130 or using the Zoom registration link on the webinars
    page. For urgent help, call the hotline at 267-635-4100 and press 3.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The webinars are designed to educate tenants, each one ends with questions to an attorney or
    housing counselor, and the site gives a phone line and a join page with clear steps.
  what_to_expect: A webinar lasts about one hour, in person or on Zoom, and covers tenant rights in rental
    housing. It ends with a question and answer period with an attorney or housing counselor. The sessions
    give general information, not legal advice.
  first_visit_tips:
  - Register ahead by phone or online
  - Write down your question about your own lease or repair issue for the question period
  - If you do not have internet access, call 267-635-4130 and staff will sign you up
