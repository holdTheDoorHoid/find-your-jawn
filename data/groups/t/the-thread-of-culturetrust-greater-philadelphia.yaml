summary: A free art installation in Vernon Park in Germantown. Visitors can use a disconnected rotary
  phone to leave a message about grief, healing, or someone they have lost, and recordings may be kept
  in a project archive.
what_you_do: Visit the rotary phone in Vernon Park, or call the story line to leave a story for the archive
  or a message for someone you have lost. The site also has an email news sign-up.
