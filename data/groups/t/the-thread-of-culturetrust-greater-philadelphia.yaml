summary: A community art project in Vernon Park, Germantown, built around a disconnected phone where people
  can leave a message for someone they have lost. Visitors can share a story and follow the project.
what_you_do: Visit the installation in Vernon Park any day, call the listed number to leave a message
  or share a grief or healing story, or subscribe for updates. The site says it is not a helpline.
