first_step:
  how: Visit the rotary phone at Vernon Park, which is open daily, or call (267) 314-7161 to leave a story.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: The park is free and open daily, and anyone can take part by visiting or calling. There is no
    group meeting and no sign-up step.
  what_to_expect: Vernon Park at 5800 Germantown Ave is a place for reflection, remembering, and listening.
    You can use the disconnected rotary phone to leave a message for someone you have lost, or call to
    record a story. The site says submitted recordings may be kept and shared publicly through the archive.
  first_visit_tips:
  - The Thread is not a helpline. The site points to its Resources page for other support.
  - Think about what you want to say before you call, since a recording may be shared publicly.
  - The park is open daily, and the site lists no set hours.
