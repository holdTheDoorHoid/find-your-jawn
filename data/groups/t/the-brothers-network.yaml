summary: A group of artists, writers and community members who meet through art and dialogue to support
  the humanity of Black men. It partners with Moonstone Arts Center on Black Poetry Day in Philadelphia.
what_you_do: Attend Black Poetry Day or another public event on the group's list, or give a tax-deductible
  donation. Events are announced one at a time, so check the events page before you plan a visit.
