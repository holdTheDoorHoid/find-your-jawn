summary: 'Volunteers, formed in 1987, who look after this small historic park in Queen Village. They run
  regular cleanups and planting days, plus summer events: KidFest in June, Movie Nights in July, and Music
  Month in September.'
what_you_do: Join a cleanup or planting day, or help with the summer events. The group asks people to
  email it to learn how to get involved.
