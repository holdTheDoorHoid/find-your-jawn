schedule:
  text: Church on Logan meets outdoors at Aviator Park on the first and last Sunday of each month at 3
    pm, regardless of weather, with a coffee hour afterward. A Tuesday gathering runs from noon to 3:30
    pm at 2111 Sansom Street, with Bible study from 1:30 pm.
