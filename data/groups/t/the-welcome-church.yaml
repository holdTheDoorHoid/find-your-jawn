first_step:
  how: Come to Church on Logan at Aviator Park on the first or last Sunday of the month at 3 pm, then
    stay for the coffee hour.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The About Us page gives a fixed outdoor time and place, a coffee hour afterward, and a named
    contact, and the presbytery page says all are welcome.
  what_to_expect: The service is held outdoors and goes ahead regardless of the weather, so dress for
    it. After the service, coffee hour hosts from different congregations walk around the park offering
    snacks.
  first_visit_tips:
  - Email Rev. Schaunel Steinnagel at rvschaunel@aol.com or call 302-463-0542 to confirm the next service
    date, since it falls only on the first and last Sunday.
  - The church's winter needs list includes knit hats, gloves, hand warmers, and blankets, if you want
    to bring something to donate.
  - The Tuesday gathering at 2111 Sansom Street runs from noon to 3:30 pm, with Bible study from 1:30
    pm.
