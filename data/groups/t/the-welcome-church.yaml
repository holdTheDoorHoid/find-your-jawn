summary: A small church community on the Benjamin Franklin Parkway that welcomes all people, especially
  people experiencing homelessness. It holds an outdoor service on certain Sundays, and it collects winter
  clothing and makes bag lunches.
what_you_do: Come to Church on Logan, the outdoor service at Aviator Park on the first and last Sunday
  of each month, and stay for the coffee hour. You can also help make bag lunches on certain Mondays,
  or donate winter items.
