summary: A Philadelphia organization for queer people of color that offers health care, HIV and sexual
  health services, case management and support groups. It also hosts community events such as an open
  mic night and book clubs, and it makes a video talk series called Conversations.
what_you_do: Get free HIV and STI screenings and safer sex kits, use case management, or ask for referrals
  for mental health care, substance use treatment or PrEP. Ask how to join one of the support groups,
  or ask about the open mic and book club events. The group also gives out free meals and clothing to
  people facing hardship.
