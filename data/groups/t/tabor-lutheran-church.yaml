first_step:
  how: Go to Katie's Cupboard on a Thursday between 10 am and noon, using the back door of the church
    at 4860 N Howard Street.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The pantry is open to anyone facing food insecurity on set Thursday hours, and the church invites
    visitors to Sunday worship. The site lists no newcomer program.
  what_to_expect: The pantry is open Thursdays from 10 am to noon at the back door of the church. Most
    of its food comes from SHARE, and you fill in a registration form for that food. Masks are required
    in the pantry, and bringing your own bags helps because the pantry hands out bags to people.
  first_visit_tips:
  - Wear a mask, which the pantry asks everyone to do.
  - Bring your own bags to take food home, if you have them.
  - Call the church office at 215-455-1706 before you come if you need step-free entry, since the site
    says the sanctuary is not wheelchair accessible.
  - Ask the office what food is available to people who do not register, since the pantry says some food
    can still be given out.
