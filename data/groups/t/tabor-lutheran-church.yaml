summary: A Lutheran congregation in North Philadelphia with Sunday worship at 10:30 am, in person and
  online. The church runs Katie's Cupboard, a food pantry at its building that is open Thursday mornings.
what_you_do: Visit Katie's Cupboard on a Thursday morning for food, or attend Sunday worship at 10:30
  am in person or watch the virtual service.
