first_step:
  how: Buy a single ticket to any concert online or by calling the box office at (215) 545-1739, or sign
    up on the site for news and offers.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Concerts and lectures are open to the public with a ticket, and the site has a clear way to buy
    in, though it has no first-timer guide.
  what_to_expect: Concerts are given in different places, including halls, churches, museums and cloisters,
    so check the venue on your ticket. Weekend concerts listed on the site start at 4 pm. Lectures at
    the Philadelphia Ethical Society run on Sunday afternoons at 2:30 pm and cost $25 per person.
  first_visit_tips:
  - Check the venue on your ticket before you go, since concerts move between halls, churches and museums.
  - If you drive to the Kimmel Center, the garage entrance is just south of the Broad Street entrance,
    and you can only reach it by driving south on Broad Street.
  - The Walnut-Locust station on the Broad Street Line is about two blocks away, and buses 9, 21, 32 and
    42 run nearby.
  - Call the box office at (215) 545-1739 to ask about seating or access, since the site does not describe
    them.
