summary: A 33 musician chamber orchestra that gives over 30 concerts each season in halls, churches and
  museums, with talks led by its music director. The public takes part as audience members.
what_you_do: Buy tickets to a concert or a lecture, subscribe to a season, or watch select performances
  live. The jobs and auditions page has no openings right now and does not describe how auditions work.
