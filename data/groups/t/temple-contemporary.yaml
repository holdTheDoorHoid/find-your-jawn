summary: A free contemporary art gallery on the first floor of Temple's Tyler School of Art and Architecture.
  It has exhibitions, lectures and public events, and anyone can attend.
what_you_do: Walk through the free exhibitions during open hours, or come to an evening public event such
  as a game night or an artist party. The gallery lists no public volunteer, docent, class or workshop
  program.
