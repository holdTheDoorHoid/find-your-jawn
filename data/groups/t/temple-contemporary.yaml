  newcomer_friendliness: 3
  basis: Admission is free and the gallery is open to the public during posted hours, and evening events
    are open to anyone. The site does not mention beginners or a special welcome.
  what_to_expect: 'Open hours are a self-guided visit: you walk through the exhibitions at your own pace
    at no charge. Evening events are more social, such as a game night with board games, puzzles and snacks,
    or an artist party. The events page lists each event''s date and time, so check it before an evening
    visit.'
  first_visit_tips:
  - Enter on Norris Street, between 12th and 13th streets, inside Tyler School of Art and Architecture.
  - Check the events page for the date and time before an evening visit, since evening events are not
    on a fixed schedule.
  - For access questions, call 215-777-9090, the number the site lists for 'not sure where to start' questions;
    the page does not describe gallery access, so ask about step-free entry.
  - Parking and transit are not described on the gallery page, so plan your trip before you go.
