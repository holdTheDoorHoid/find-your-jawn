first_step:
  how: Call (267) 670-5098 or email info@tennesseeprogram.com, and ask about the program you want. The
    contact page says to contact the group to sign up.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: The site asks people to contact the group to sign up but does not describe enrollment steps,
    ages, or start dates, so the way in is unclear. The music class says no prior experience is needed.
  what_to_expect: The auto class has students do hands-on work on vehicles of many makes and models. The
    basics the site lists include changing tires and oil and working on brakes. The music class covers
    recording, mixing, and production with studio equipment. The site does not say how long a session
    runs, what it costs, or where most classes meet.
