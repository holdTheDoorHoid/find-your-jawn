summary: A nonprofit that works with young people on skills, character, and mentoring. Its programs include
  auto technician training, photography, fitness, a lifestyle course, and a music and engineering class.
  It has also run book bag drives and food giveaways for people experiencing homelessness.
what_you_do: Contact the group to ask about joining a youth program or helping on a service day. Past
  service days include book bag drives and food and supply giveaways.
