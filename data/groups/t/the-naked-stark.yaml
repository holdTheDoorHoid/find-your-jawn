first_step:
  how: Email thenakedstark@gmail.com or join the mailing list to hear when the Creative Movement Workshop
    dates are posted.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The Creative Movement Workshop welcomes people with no dance background, and the weekly drop-in
    is open to the public. Neither has a posted day, time or date yet, so the next step is to ask by email.
  what_to_expect: The Creative Movement Workshop is a series of four Sundays at The Cedar Works on Pentridge
    Street, ending with an informal showing for family and friends. It is open to all ages, with or without
    disabilities, and to people with no dance background. The site does not give session start times or
    length, and the group asks for a sliding scale of $5 to $25.
  first_visit_tips:
  - Wear long pants, or sleeves and knee pads, if you will be moving on the floor.
  - Email for the session start time, since the site does not give one yet.
  - Pay what you can within the $5 to $25 sliding scale; the group says no one is turned away.
  - If you use a wheelchair, the Mascher Space entry has three steps and no ramp, so ask about access
    before you come to a class there.
