summary: A West Philadelphia modern dance company that makes close up, immersive dance shows and teaches
  movement classes and workshops, including an all-ages creative movement workshop.
what_you_do: Buy a ticket to a show, drop in to the weekly movement practice at Mascher Space, or take
  the Creative Movement Workshop, which is open to any level of dance experience. A fall Sunday class
  for ages 14 and up, aimed at intermediate and advanced movers, is also listed.
