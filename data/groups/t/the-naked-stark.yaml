first_step:
  how: Email thenakedstark@gmail.com to ask when the Creative Movement Workshop dates are posted, since
    the site lists 2026 dates as coming soon.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The Creative Movement Workshop says it is all levels and welcomes beginners, and the weekly drop-in
    is open to the public. The fall Sunday class is for intermediate and advanced movers, and the workshop
    dates are not yet posted, so the way in is not yet clear.
  what_to_expect: The Creative Movement Workshop is a series of four Sundays at The Cedar Works on Pentridge
    Street. It is open to all ages, with and without disabilities, and to people with no dance background.
    The site lists the space as ADA accessible and asks for a sliding scale of $5 to $25. The site does
    not say how long each session runs.
  first_visit_tips:
  - Wear long pants, or sleeves and knee pads, if you will be moving on the floor.
  - Ask by email for the session start time, since the site does not give one yet.
  - Pay what you can within the $5 to $25 sliding scale.
