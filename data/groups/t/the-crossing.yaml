  what_to_expect: A concert is a seated performance by a professional choir, often in a church. The program
    is new music, and some concerts include other musicians or staging. The season page does not give
    the length of a concert, so check the event page before you buy.
  first_visit_tips:
  - Use the ticket link on the concert's own page, since prices and seating are set per event.
  - Check the start time on your event page, because the season ranges from afternoon to evening starts.
  - Email info@crossingchoir.org with access questions, since the site lists no access details.
