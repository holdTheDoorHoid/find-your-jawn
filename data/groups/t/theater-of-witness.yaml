first_step:
  how: Email teya@theaterofwitness.org to book a screening or workshop for Grand Young Women, or send
    a reflection through the website form.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: The site lists no drop in events, classes, or volunteer roles, and the teen group works by selection,
    so the public way in is booking a screening by email and the way in is unclear.
  what_to_expect: Grand Young Women is a 30 minute film made with five girls of African heritage from
    the African Family Health Organization. The site does not say how a screening or workshop is run,
    how long it lasts, or what it costs, so ask when you book.
  first_visit_tips:
  - Book by email, since the site lists no phone number or office hours.
  - The office is at 1315 Walnut Street, Suite 300, but the site gives no hours for it.
  - To take part before a screening, send a reflection through the website form.
