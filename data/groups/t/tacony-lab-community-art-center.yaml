  newcomer_friendliness: 4
  basis: Classes are free, the open studio runs posted hours, and the monthly open sew says no experience
    is needed. Many events need advance registration, so the group is not rated 5.
  what_to_expect: The open studio is for working on a project you bring or starting a new one, alongside
    the community and staff. Classes are free and cover painting, drawing, sewing, weaving and laser cutter
    design. The site does not say how long a class runs or how often it meets.
  first_visit_tips:
  - Bring a project to work on, or come ready to start something new.
  - Check the events page first, since many events need an advance sign up.
  - Call (267) 686-7420 or email info@taconylab.org with questions about classes, parking or transit,
    since the site does not cover those.
