summary: A community art center in Tacony that is a program of Mural Arts Philadelphia, run in partnership
  with the local city council office. It offers free art classes, an open studio, and a Saturday kids
  club.
what_you_do: Take a free painting, drawing, sewing, weaving or laser cutter class, or use the open studio.
