  notes: 'The main entry is through the parking lot door on the east side. An elevator entrance is on
    the Spring Garden side, so call ahead during business hours so staff can unlock the gate. Nearest
    SEPTA: the Frankford Elevated (''the El''), at the Spring Garden Street stop about five blocks east
    of the building.'
