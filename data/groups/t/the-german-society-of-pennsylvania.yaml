first_step:
  how: Sign up for the mailing list, then come to the second-Wednesday Konversationsabend from 6 to 8
    pm.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The conversation evening page says newcomers from any background are welcome, from beginner to
    advanced speakers, and it explains how to sign up. The class page offers courses from beginner to
    advanced, with a free level change in the first three weeks.
  what_to_expect: About 20 people meet around a set theme. A speaker gives a short talk, then the group
    talks it over, with refreshments. The page does not list a price for the conversation evening, and
    classes are paid per term.
  first_visit_tips:
  - Sign up for the mailing list first, since that is how the group announces the evening.
  - Park only in the Society's own lot behind the black gate, not under the mural, because cars there
    risk being towed.
  - The library is open Tuesday and Thursday from 10 am to 4 pm, and the offices are open weekdays from
    9 am to 5 pm.
