schedule:
  text: The monthly Konversationsabend, a German conversation evening, is on the second Wednesday from
    6 to 8 pm, February to May and September to December. Friday film nights start at 6:30 pm during the
    film season. German classes run in terms of about 8 to 12 weeks. Yearly events include the Stiftungsfest
    gala, a Christkindlmarkt, and St. Martin's Parade.
