summary: A heritage society founded in 1764 to help German immigrants. It now runs German language classes,
  a public library, monthly events and cultural programs for Germans and German lovers in Philadelphia.
what_you_do: Take an evening German class, join a conversation evening or film night, come to a concert
  or book club, or sign up to volunteer through the online form. Membership is the main way to join.
