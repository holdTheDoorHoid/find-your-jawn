cost:
  level: paid
  text: Regular 10-week classes cost $360, and the 8-week online classes cost $180 to $240. Textbooks
    cost about $30 to $70 extra, and private tutoring is $45 an hour. Membership dues start at $30 for
    students and $60 for individuals. The membership page does not say which year these apply to.
