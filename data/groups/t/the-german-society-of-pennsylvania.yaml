schedule:
  text: Monthly events include a Konversationsabend, a Friday film night, a concert series and book clubs.
    Yearly events include Stiftungsfest, a youth music festival, a Christkindlmarkt, St. Martin's Parade
    and Bierfest. Dates are on the calendar, not on the page we read.
