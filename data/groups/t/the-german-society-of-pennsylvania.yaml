summary: A heritage society founded in 1764 to help German immigrants. It now runs German classes, a public
  library, and monthly conversation evenings, film nights and book clubs for anyone who wants to learn
  German or enjoy German culture.
what_you_do: Take a German class, join the monthly conversation evening or a film night, or join a book
  club. Members get library borrowing and invitations to special events.
