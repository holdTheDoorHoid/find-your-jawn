summary: A Jewish social community for people ages 21 to 40 in Philadelphia. Its gatherings include a
  monthly game night, Shabbat dinners, brunches, and hands-on sessions such as cooking or frame drumming.
what_you_do: Pick an event on the calendar, such as game night, a brunch, or a cooking session, and meet
  other young adults. Some events are free and some have a ticket.
