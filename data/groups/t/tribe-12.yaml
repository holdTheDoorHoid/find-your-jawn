first_step:
  how: Choose a monthly event on the events calendar, such as the Wednesday Game Night, and sign up on
    its event page. Some events are space limited.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The FAQ says anyone ages 21 to 40 can join a tribe at any time, that tribes are drop-in, and
    that people who are just exploring are welcome. It also names a contact form to meet staff.
  what_to_expect: Most calendar entries run about two hours and take place in person, indoors. Some are
    small, such as the monthly game night at The Board and Brew, which is capped at about 10 people. Some
    events are free and others are ticketed, and because tribes are drop-in you can come to one event
    and see how it feels.
  first_visit_tips:
  - Check the event page for the exact address, since many calendar entries do not list a venue.
  - Cancel at least 48 hours ahead for a full refund.
  - Ask info@tribe12.org at least two weeks ahead if you need an ASL interpreter or live captioning.
  - Give notice at least 48 hours ahead about food allergies or kosher needs.
