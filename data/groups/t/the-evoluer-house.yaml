summary: A Philadelphia nonprofit for teen girls, especially girls of color in urban areas. It runs eight
  week programs in personal development, job readiness and podcasting, and keeps an alumnae network.
what_you_do: Girls enroll in one of the eight week programs to build confidence, job skills and, for alumnae,
  podcast skills. Families sign up for the email list to hear when registration opens, since there is
  a waiting list.
