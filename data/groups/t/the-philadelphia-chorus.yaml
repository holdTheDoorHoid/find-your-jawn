first_step:
  how: Call 215-995-3118 or email thephiladelphiachorus@gmail.com to book an audition by appointment.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Joining starts with a booked audition by appointment, which includes a sung test, so the way
    in is clear but a newcomer cannot watch a rehearsal first.
  what_to_expect: The audition asks you to sing scales and warm-ups, then one song of your choice in any
    style, and to sight-read a short excerpt. The page does not say how long it takes. Once you join,
    you rehearse on Monday evenings in University City and sing in concerts each season.
  first_visit_tips:
  - Pick a song you know well, and plan on accompaniment if you can, since the chorus prefers it.
  - When you book, ask how long the audition runs and where rehearsals meet, since the site does not say.
  - Book a time first. Auditions are by appointment only.
