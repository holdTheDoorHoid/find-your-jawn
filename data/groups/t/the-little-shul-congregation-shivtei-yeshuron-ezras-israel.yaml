summary: A small South Philadelphia shul at 2015 South 4th Street. It holds Shabbos services once a month,
  on the first Saturday, and on the second Saturday when a holiday falls on the first.
what_you_do: Come to a monthly Shabbos service (no tickets or reservations are needed), join the membership
  list, or sign up for the newsletter. The site also takes donations toward its building and security
  funds.
