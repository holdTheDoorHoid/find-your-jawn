first_step:
  how: Sign up for the mailing list on giftedscholars.org, then check the scholarships page for the next
    application round
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Scholarships need an application, and the advisory committee role is posted only on Instagram,
    so the way in is not fully open.
  what_to_expect: A scholarship is an application through the group's website, and the site does not say
    how long reviews take or what happens after you apply. The academy is still in development, so there
    is no program to attend yet. Adults who want to help with the planned advisory committee are asked
    to message or email the group, and the site gives no meeting schedule.
  first_visit_tips:
  - Read the eligibility on the scholarships page before you apply, since it lists specific criteria.
  - The site has no volunteer page, so email info@giftedscholars.org to ask about the advisory committee.
