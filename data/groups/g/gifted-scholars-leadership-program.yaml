summary: A nonprofit that supports girls of color through mentoring and scholarships, from middle school
  through graduate school. It is also developing a residential leadership academy for girls in foster
  care or facing homelessness, and it gives grants to local and global nonprofits.
what_you_do: Girls can apply for scholarships when a round is open. Adults with experience in education,
  child welfare, mental health, law, finance, or fundraising can contact the group about the planned academy's
  advisory committee.
