summary: A Philadelphia nonprofit that promotes gratitude and appreciation. It runs a Women's Circle every
  two weeks, an arts and crafts workshop for ages 9 and up, and a recognition program at participating
  venues.
what_you_do: Join the Women's Circle by RSVP email, or ask about the arts and crafts workshop through
  the contact form. You can also volunteer, with roles such as community workshops, event coordination,
  youth mentorship and social media work.
