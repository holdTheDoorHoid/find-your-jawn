  basis: The circle takes RSVPs by email from the public. The site does not say whether it has openings
    or who the circle is for beyond its name.
  what_to_expect: The Women's Circle is a regular meetup for planning, support and personal growth. The
    site does not say how long a session lasts, where it meets or what happens on a first visit, so ask
    when you RSVP. The arts and crafts workshop, for ages 9 and up, has people make a rose collage on
    canvas with their own methods, plus verbal rose exchanges and Q&A sessions about healing and equal
    rights.
  first_visit_tips:
  - Email before you come, since the site does not list a meeting place.
  - Ask about the workshop schedule and cost when you reach out, because neither is published.
