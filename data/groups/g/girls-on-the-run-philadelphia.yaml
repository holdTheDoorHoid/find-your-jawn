first_step:
  how: Apply through the coach sign-up link on the program's coach page, or sign up on the volunteer page
    to help at the 5K.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: No running experience is needed to coach, and the 5K volunteer sign-up is open to anyone. Coaches
    must finish training and a background check before the season, and the site does not describe a visit
    first.
  what_to_expect: Coaches lead 90-minute practices twice a week for about 10 weeks, usually in the late
    afternoon, using materials the program supplies. Before the season, coaches complete about 3.5 hours
    of online training and about 3 hours of in-person training with program staff.
  first_visit_tips:
  - Plan for about 3 hours a week of practice time, plus the 5K day.
  - At least one coach per team needs CPR certification, and the program can help arrange it.
  - Team sites are not named on the program pages, so check the locations page for where teams meet.
  - Junior coaches are high school students who help the coaches and serve as role models.
