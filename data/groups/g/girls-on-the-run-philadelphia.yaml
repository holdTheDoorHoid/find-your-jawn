summary: A seasonal running program for girls in 3rd to 8th grade that builds social, emotional, and physical
  skills through running and group talks, led by trained volunteer coaches.
what_you_do: Girls join a 3rd to 5th grade team or a 6th to 8th grade team for a 10-week season that ends
  in a 5K. Adults coach a team, high school students can serve as junior coaches, and volunteers can help
  at the 5K or with one-time and project work.
