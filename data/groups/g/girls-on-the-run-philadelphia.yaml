summary: A program for girls in grades 3 to 5 and grades 6 to 8, called Heart and Sole for the older group,
  that mixes running with life skills lessons. Each season ends with a 5K, and volunteer coaches lead
  the lessons.
what_you_do: Girls meet in teams with volunteer coaches for lessons and running, and train toward a 5K
  at the end of the season.
