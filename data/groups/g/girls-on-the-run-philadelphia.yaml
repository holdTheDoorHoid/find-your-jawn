cost:
  level: paid
  text: Registration is $225 per girl each season. Families with household income under $100,000 a year
    can apply for a reduced fee, and a two-payment plan is offered. The fee covers a shirt, a water bottle,
    practice snacks, lesson materials, 5K entry and a finisher's medal.
