summary: Glen Foerd is a historic riverfront estate at 5001 Grant Avenue, cared for by a nonprofit conservation
  corporation with Philadelphia Parks and Recreation. Neighbors can walk the free grounds, visit the mansion
  free on weekend afternoons, and join storytimes, workshops, yoga, tours and free open boating days.
what_you_do: Keep the estate open, run public tours, classes and events, and raise money for a mansion
  restoration.
