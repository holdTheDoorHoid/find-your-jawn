  notes: A wheelchair lift reaches the front porch or first floor (the page is unclear which). A ramp
    leads to the sun porch. There is no elevator, and upper floors and restrooms are not wheelchair accessible.
    Grounds are mostly level, but riverside gravel paths are hard with mobility devices. Service animals
    are welcome.
