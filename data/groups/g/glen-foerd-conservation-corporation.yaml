first_step:
  how: Come to a free mansion visit on a Friday, Saturday, or Sunday between 10 am and 1 pm, or book the
    second Saturday guided tour (11 am, $10) through the events page.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: The mansion is listed as free and open with no booking step, and events list dates and times,
    though tours are paid and several events have sold out.
  what_to_expect: 'A first visit is usually a self-guided walk: the grounds are a free public park, and
    the mansion is free on weekend afternoons. The second Saturday tour runs 11 am to 12:30 pm and costs
    $10, and you can register on the events page or pay at the door. The page says private events often
    close the estate to the public from 3 pm on many weekends from May through October.'
  first_visit_tips:
  - Check the events page first, since private events can close the estate in the afternoon.
  - Park in the lot across from the community gardens or the lot behind the mansion, and follow the estate
    signs.
  - Wear shoes that handle gravel, since the riverside paths are hard with mobility devices.
  - Book popular tours early, since several events have sold out.
