  gear: A registered therapy dog aged 1 to 10 on a leash. CHOP provides the bandana the dog wears.
first_step:
  how: Read the program's requirements, then send the Application of Interest from its page. The coordinator
    emails within 5 to 7 business days to set an in-person interview, which you attend without your dog.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: An application, an interview, dog screening, health clearances, background checks and an orientation
    all come before the first visit, and the page offers no exemptions.
  what_to_expect: 'The steps run in order: an in-person interview, dog screening at Penn''s veterinary
    hospital, health clearances and background checks, then a two-hour orientation. On your first three
    visits the program coordinator goes with you. Each visit is a two-hour shift in which you and your
    dog go room to room to see children in a calmer, more homelike setting.'
  first_visit_tips:
  - Wash your dog within 24 hours of a visit, and bring it in dry.
  - Skip flea and tick topical treatments for two days before a visit.
  - Keep your dog on a leash and out of strollers or carriers. It wears a CHOP bandana, which the program
    provides.
  - The page has no parking or check-in details, so ask the coordinator where to go on your first visit.
