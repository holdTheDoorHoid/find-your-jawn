summary: A nonprofit that brings together Philadelphia's international community. It runs a World Heritage
  City project, a global directory, a program for emerging international journalists, and a young professionals
  network.
what_you_do: Attend the public talks, artist panels, and town halls the group hosts, join its Young Professionals
  Network, or become a member. The group also lists unpaid internship and volunteer roles.
