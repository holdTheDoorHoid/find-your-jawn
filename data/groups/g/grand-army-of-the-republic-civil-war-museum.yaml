summary: A volunteer-run Civil War museum and research library in Holmesburg. Visitors can tour the exhibits,
  and members and donors can request research help with Civil War veterans and Grand Army of the Republic
  posts. It does not do family genealogy.
what_you_do: Volunteers keep the museum and library open. Visitors can come on a Tuesday or book a guided
  visit, and members and donors can request research. The site does not describe a volunteer sign-up process.
