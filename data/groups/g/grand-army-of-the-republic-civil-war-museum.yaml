first_step:
  how: Come on a Tuesday between 11 am and 4 pm, or email garmuslib1866@gmail.com at least seven days
    ahead to book a guided visit.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: The museum is open to the public on Tuesdays with no admission fee, and the website says how
    to visit. The volunteer process is not described.
  what_to_expect: Guided visits are set up in advance with a volunteer guide, so the museum confirms the
    date after you email. The collection includes Civil War relics, documents and photographs, with displays
    on Lincoln and on Old Baldy, General George Meade's warhorse. Touring is free, and a membership or
    donation is suggested.
  first_visit_tips:
  - Email at least seven days before a guided visit, with the date, arrival time, number of people, and
    a contact name and phone number.
  - Children under 14 must come with an adult.
  - The site does not describe stairs, an elevator, or parking, so call (215) 613-0350 before you come.
