schedule:
  text: Friday night services at 6 pm. Saturday morning services, with separate adult services and children's
    programs, run from 10 am to about 12:30 pm. Weekday services are Monday and Thursday at 7:15 am and
    Sunday at 9 am. Weekly Torah Study with Rabbi Fredi Cooper meets Mondays at 1 pm on Zoom. Adult classes
    run each term, and about half are online.
