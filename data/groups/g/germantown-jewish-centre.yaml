summary: A congregation at 400 West Ellet Street that serves the Jewish community in Northwest Philadelphia.
  It runs Friday night services, weekly Torah study, adult learning, a religious school, a choir, and
  a Hazak group for people 55 and older.
what_you_do: Attend Friday night services, join Weekly Torah Study with the rabbi, take an adult class
  at Koleinu Beit Midrash, or join the men's club, Women of GJC, the choir, or Hazak. Families can enroll
  children in the religious school or early childhood program.
