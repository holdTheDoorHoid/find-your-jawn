first_step:
  how: Call the office at 215.844.1507 or email office@germantownjewishcentre.org before you come, and
    ask to attend a Friday night service or a class. To start membership, use the online membership form.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The join page says prospective members are welcome at a service or program after a call or email,
    and the adult classes page says anyone may take a class and gives a registration link for each.
  what_to_expect: Friday night services start at 6 pm. Adult classes each have their own registration
    page, and about half of the fall classes are online, so you can try one from home. The site does not
    say what dress is expected or how long a service runs, so ask the office before your first visit.
  first_visit_tips:
  - Call the office before you come, since the site does not say whether non-members may attend Friday
    night services.
  - Saturday has separate adult services and children's programs, which run at different times.
  - The congregation is at 400 West Ellet Street, Philadelphia 19119.
  - If you sing, the all-volunteer choir rehearses Wednesdays from 7 to 9 pm and welcomes new members.
