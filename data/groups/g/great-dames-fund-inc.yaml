first_step:
  how: Apply to a peer advisory group through the online form on the peer groups page, or sign up for
    a public virtual event listed on the events page.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Most events are open to anyone, and the site has a clear join link. Peer groups need an online
    application, and no Circle fee is listed.
  what_to_expect: Public events are mostly online, usually on weekday evenings starting at 5:30 pm Eastern,
    and include pitch events and open mic nights where people share stories. Peer advisory groups meet
    online each month with about 10 to 12 women and a facilitator, and talk about work, family, and personal
    growth. Circle members get a vote on the yearly grant and early access to some programs.
  first_visit_tips:
  - Check the events page for the date, since many listings do not say whether an event is online or in
    person.
  - The Nov. 4, 2026 celebration is in person in Greenville, Delaware, not Philadelphia, and tickets are
    reserved through a link on the join page.
  - The peer groups page asks you to confirm cost and availability before you apply, because parts of
    it may be out of date.
