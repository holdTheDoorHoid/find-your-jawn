first_step:
  how: Open greenest.org/careers/all and apply for a remote analyst role, or send a business or product
    to the review request form.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Portal editing requires a volunteer application, so the way in is an application step. The public
    review forms are open to anyone but ask for business details.
  what_to_expect: The site does not say how much time a volunteer role takes, what training is given,
    or how long an application takes. The public review form asks for a business name, a website, and
    a description, and the site does not say how long a review takes.
  first_visit_tips:
  - If no role matches your skills, the careers page says you can send a resume through the Contact Us
    page.
  - The review request form is a way to help without applying for a role.
