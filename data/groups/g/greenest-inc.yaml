summary: Runs Greentool, an online tool for finding products, services, and companies that help or harm
  the environment. Volunteers research and edit its data through an online portal.
what_you_do: Volunteers apply for remote roles on greenest.org, such as Environmental Analyst or Citizen
  Scientist, to research and edit the data in the portal. Anyone can also submit a business or product
  for review through the review request form.
