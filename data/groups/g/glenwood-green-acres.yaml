summary: A large food-growing garden on Glenwood Avenue with 102 individual plots on about 3.67 acres,
  founded in 1983 and preserved in 1997. Neighbors can email the garden to ask about joining.
what_you_do: Grow food in an individual plot, or help with shared upkeep such as weeding, watering, planting
  and grounds work.
