    and gives no waitlist or open-day details.
  what_to_expect: Volunteers help with weeding, watering, planting and general grounds upkeep. Visitors
    can come to the monthly meetings on the second Tuesday in season, but the page gives no meeting time
    or place and no work-day dates, so the email is the place to ask. The page does not cover plot fees
    or gardener rules.
  first_visit_tips:
  - Email first, since meeting times and place are not on the website.
  - Ask about the next work day if you want to help out before getting a plot.
