first_step:
  how: Email the garden's SEAMAAC contact address to ask how to get a plot and whether there is a waitlist.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The garden was set up for newcomers and refugees, but the site gives no steps for getting a plot,
    no waitlist details and no eligibility rules. The only way in is an email address.
  what_to_expect: The site does not describe a typical visit or workday. It says the program works with
    about 150 gardeners, mostly immigrant and refugee, in an update that is not dated. Ask about plots
    and fees before you come, since the site does not list them.
  first_visit_tips:
  - Ask whether there is a plot waitlist before you visit.
  - Ask about fees, and whether tools and water are provided, since the site does not say.
