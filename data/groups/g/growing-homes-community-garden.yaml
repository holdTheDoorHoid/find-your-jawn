summary: A community garden on Emily Street in South Philadelphia, organized by SEAMAAC with partners.
  It was set up to help newly arrived refugees and newcomers eat well, grow familiar crops and settle
  into the neighborhood.
what_you_do: Gardeners grow crops in the community garden with SEAMAAC and its partners, the Neighborhood
  Gardens Trust and the Pennsylvania Horticultural Society. The site does not describe workdays.
