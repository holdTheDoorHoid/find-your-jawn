first_step:
  how: Email info@guidingstars2014.org or use the contact form to ask how a young person can join a program.
    For the youth work program, C2L-PHL, write to C2L@guidingstars2014.org.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: The site invites people to email or use the contact form, but it does not say who is eligible
    or what the first step looks like. The youth work program's 2025 applications were closed.
  what_to_expect: The site does not describe a first session, where programs meet, or how long they last.
    The youth work program places young people at partner sites, and its 2025 partners included Mighty
    Writers, Neighborhood Bike Works, Free to Be Performing Arts Center, and Hunting Park Green. Ask the
    team what a young person would do in the first few weeks before you commit.
  first_visit_tips:
  - The office is at 5356 Chew Ave, Building B, and is open Monday to Friday, 10 am to 4 pm.
  - Call (215) 406-5101 during office hours if you would rather talk than write.
  - The youth work program is for ages 12 to 24, and the page encourages residents of the Northwest Section
    to apply, so check that before you apply.
