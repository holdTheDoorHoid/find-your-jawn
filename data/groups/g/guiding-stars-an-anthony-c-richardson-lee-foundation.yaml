summary: A Philadelphia nonprofit that runs youth programs on health and fitness, career and college readiness,
  and juvenile justice awareness.
what_you_do: Young people take part in fitness and nutrition lessons, career exploration, resume and interview
  practice, college application help, and financial literacy classes. The youth work program, C2L-PHL,
  places young people at partner sites for work experience.
