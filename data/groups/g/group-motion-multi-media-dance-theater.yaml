first_step:
  how: Join the mailing list, which gives you the Zoom link for online sessions, then sign up for an upcoming
    Friday Night Workshop and pay through the PayPal link.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The site says no dance or movement experience is needed and all are welcome, and it spells out
    how to sign up. Drop-in is not stated.
  what_to_expect: A workshop starts with a short guided meditation, then moves into movement you do on
    your own, then group movement and creative exchange. Some sessions have live improvised music. Masks
    are optional.
  first_visit_tips:
  - Wear clothes you can move in.
  - For a Zoom session, join the mailing list first so you get the link.
  - For an in-person workshop, pay ahead by PayPal or bring cash.
