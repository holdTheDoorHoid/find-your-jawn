summary: A cycling program for girls of all ages and abilities, with coaches who run group sessions to
  build confidence.
what_you_do: Girls can join a clinic or Club GiG, or find a ride near them. Coaches receive training in
  safety and the group's curriculum, and volunteers can use the coach link on the site.
