first_step:
  how: Choose a Glide to Ride clinic date on the Greater Philadelphia page and register through its link.
    To coach instead, email info@girlsingear.org.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The Greater Philadelphia page lists a two hour clinic for first-time two-wheel riders with registration
    links, and the coach page says no cycling expertise is needed to coach.
  what_to_expect: Glide to Ride is about two hours and is aimed at riders who are new to two-wheel cycling.
    Coaches run each group session with a focus on confidence and safety. The group's pages do not say
    what to bring, whether you need your own bike or helmet, or what the fee is, so check the registration
    page before you sign up.
  first_visit_tips:
  - Pick a clinic date on the Greater Philadelphia page; each date has its own registration link.
  - Check the registration page for fees and scholarship options before you sign up.
  - Ask the program director by email whether girls need their own bike or helmet, since the site does
    not say.
