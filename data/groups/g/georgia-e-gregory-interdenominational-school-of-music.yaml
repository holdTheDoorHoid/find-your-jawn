summary: A faith-based music and dance school on West Allegheny Avenue, founded in 1999. It teaches piano,
  voice, guitar, drums, strings, handbells, and dance to children, teens, and adults, and runs a summer
  camp for ages 6 to 13.
what_you_do: Take private or group lessons on an instrument or in voice, join a dance class such as praise
  dance or hip hop, or enroll in the summer music camp.
