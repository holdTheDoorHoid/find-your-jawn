first_step:
  how: Call (215) 430-0435 or email gegisom@aol.com to ask about enrolling, the $25 registration fee,
    and which class times are open.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Enrollment is by phone or email, lessons are paid in advance after a $25 registration fee, and
    the site does not describe a trial lesson or a beginner policy.
  what_to_expect: Private lessons run 30 or 60 minutes. Group classes such as strings and dance meet weekly
    on set days through the school year. The site does not describe a trial lesson, so ask about one when
    you call.
  first_visit_tips:
  - Ask about the one-time $25 registration fee and whether a scholarship or subsidy applies.
  - Lessons are paid in advance, so ask how payment works before you start.
  - Classes can be in person or on Zoom, so ask which format a class uses.
  - The events page lists an open house in September, so call to check this year's date.
