first_step:
  how: Come to a Tuesday rehearsal at 8 pm at the Edmund Street clubhouse, or fill in the interest form
    on the join page and a representative will contact you
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The join page says musical experience is not required, non-playing members are welcome, the band
    can teach an instrument, and the form is one way to reach them.
  what_to_expect: Rehearsals are on Tuesday nights at the clubhouse, and the band has members from teens
    to people in their 80s. You can join as a musician, dancer, or marshal, and the form asks which instrument
    you would play if you are a musician. Dues and audition details are not published, so call the band
    before you come.
  first_visit_tips:
  - Call 215-624-9404 before you go to confirm the clubhouse address and rehearsal time
  - Ask about dues and whether there is an audition before you join
  - Plan your trip, since the page does not list parking or transit
