summary: A volunteer string band in Northeast Philadelphia with a clubhouse on Edmund Street. It marches
  on New Year's Day, plays private events, and welcomes members who do not play an instrument.
what_you_do: Play in the band, march, dance, or help as a marshal. Non-playing members are welcome, and
  the band can teach you an instrument.
