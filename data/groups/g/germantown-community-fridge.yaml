summary: Neighbors who keep two free community fridges stocked in Germantown. They take donations, make
  sandwiches, clean the fridges, and tend a small garden in warm months.
what_you_do: Sign up for fridge cleaning shifts, make sandwiches for grab and go drop offs, pick up donations
  by car, do a grocery run (up to $100, reimbursed), or help in the garden on High Street from spring
  through fall.
