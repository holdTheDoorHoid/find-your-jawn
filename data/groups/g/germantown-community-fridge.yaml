first_step:
  how: Fill in the volunteer Google Form linked from the group's site, or email germantownfridge@gmail.com.
    For a cleaning shift, pick a slot on the SignUpGenius sheet.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Anyone can fill in the public volunteer form, and the group contacts you afterward. The site
    does not describe training, orientation, or a first shift.
  what_to_expect: The fridges are open around the clock and self-serve, so anyone can take food without
    signing up. Volunteers fill in the form first, and the group reaches out before you start a role such
    as cleaning, sandwich making, pickups, or the garden.
  first_visit_tips:
  - Bring labeled meals or sealed food; unlabeled meals and opened food are turned away.
  - Donation pickups need a car and free time, so mention your car on the form.
  - Grocery runs are reimbursed up to $100.
  - Cleaning shifts are on a SignUpGenius sheet, so book one there.
