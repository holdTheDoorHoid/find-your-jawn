cost:
  level: low
  text: Wednesday dances are sliding scale, about $7 to $15 or more. First Saturday afternoon workshops
    cost about $10 to $15 or more, and evening dances about $15 to $25 or more. Barn dances cost $5 to
    $10 for adults and $3 to $5 for children and teens. Teen dances cost $5, or $10 to support the live
    music fund. Passes are available for anyone who cannot pay the listed price.
