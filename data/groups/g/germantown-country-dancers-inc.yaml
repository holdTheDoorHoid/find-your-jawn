first_step:
  how: Come to a Wednesday dance at the Merion building, arriving by 7:30 pm for the new dancer orientation.
    You do not need a partner.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 5
  basis: A short orientation for new dancers runs before the Wednesday dance, admission is drop-in, and
    passes are offered to anyone who cannot pay.
  what_to_expect: The evening runs from a 7:30 pm orientation to dancing that ends around 10:15 pm. Every
    dance is taught before it is called, so you learn as you go, and partners change through the evening.
    Admission is on a sliding scale, and no experience or partner is needed.
  first_visit_tips:
  - Wear comfortable, flat-soled shoes that will not slip or catch on a wood floor.
  - Arrive by 7:30 pm for the orientation.
  - The Merion building sits back from Montgomery Avenue and is hard to see from the road. Look for the
    driveway with old-style street lamps.
  - At Summit Presbyterian Church, park on the uphill side of Greene Street only, and do not park on Westview
    Street.
