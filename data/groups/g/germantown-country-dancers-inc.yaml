  notes: 'Nearest SEPTA: Narberth station on the Paoli/Thorndale Line is about a 10 minute walk to the
    Merion building, and the 44 bus stops near its driveway. Upsal station on the Chestnut Hill West Line
    is about three blocks uphill from Summit Presbyterian Church, and the H bus stops one block away at
    Westview and McCallum.'
