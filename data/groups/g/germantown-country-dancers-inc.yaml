schedule:
  text: Wednesday English country dances, with a new dancer orientation at 7:30 pm. First Saturday afternoon
    workshop and evening dance, October to May, at Summit Presbyterian Church. First Sunday barn dances,
    November to April, for all ages. Teen dances for ages 12 to 19 on second Saturdays, October to May,
    at the same church.
