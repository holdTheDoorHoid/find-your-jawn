first_step:
  how: Sign up through the registration link on the next park cleanup post, or email membership@gardencourtca.org
    to ask how to join.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Cleanups and the annual meeting are public, and the membership committee answers questions by
    email. The site does not say whether people from outside the area can join.
  what_to_expect: A cleanup lasts about two hours on a Saturday afternoon, with paths cleared, leaves
    and litter picked up, and flowers planted at Barkan Park. Organizers provide gloves, tools, and refreshments.
    The June 2026 annual meeting was free, with food and drinks, speakers, and board votes.
  first_visit_tips:
  - Gloves and tools are provided, so there is nothing to buy.
  - Cleanups run 2 to 4 pm on a Saturday, so plan for that afternoon.
  - The June 2026 annual meeting was held at West Philadelphia Mennonite Fellowship, 123 South 51st Street,
    1:30 to 3:30 pm.
  - Check the news page for the next cleanup date, since posts show months but not years.
