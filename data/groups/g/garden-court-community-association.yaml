summary: A registered community association for the Garden Court neighborhood in West Philadelphia, active
  since the mid-1950s on neighborhood problems, housing and local gardens. Its news includes park cleanups,
  a school garden donation, and plant and vegetable giveaways.
what_you_do: Join or renew your membership, sign up for a park cleanup or plant giveaway, or serve on
  a committee such as greening, public safety, or communications. Members vote in board elections at the
  June annual meeting.
