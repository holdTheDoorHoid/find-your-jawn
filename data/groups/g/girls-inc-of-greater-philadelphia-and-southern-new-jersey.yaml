summary: A nonprofit that helps girls build confidence and leadership skills through programs such as
  career exploration, science and math, self-defense, money skills and summer camps. Families can enroll
  a girl through the site.
what_you_do: Families can use the Enroll a girl link on the Programs page to sign up for a program. Adults
  can host a career exploration, become an advocate, or join the team.
