summary: A mosque on Germantown Avenue that runs free classes from Wednesday to Sunday, open to brothers
  and sisters. It also has an academy, an enrichment program and a weekly outreach booth downtown.
what_you_do: Come to a free class on any day from Wednesday to Sunday. The Sunday 10 am New Muslim class
  is for men and women. Ask about the youth enrichment program for ages 6 to 16 and the academy, a school
  next to the mosque. The mosque also runs an outreach booth in Downtown Philadelphia.
