first_step:
  how: Submit your email under the Set The Table dinner you want on the group's Set The Table page. Submissions
    are reviewed, and about ten guests are chosen.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Dinner seats are chosen from submissions, so the way in is an application; the event mailing
    list is open to anyone who sends an email.
  what_to_expect: A Set The Table dinner brings about ten strangers with different views together to talk
    about hard topics such as politics, religion and race. Questions are asked anonymously at the table,
    and at the end people may choose to reveal who asked them. Dates are not yet set, and the dinner length
    and place are not stated before you apply.
  first_visit_tips:
  - If you are chosen, expect a $10 reservation fee; the group says it helps make sure guests attend.
  - The exact address is not published online, so call 267-538-1417 to ask where events are held.
  - Each event has its own mailing list, so sign up under the event you want.
