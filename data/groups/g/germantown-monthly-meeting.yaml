summary: A Quaker meeting in Germantown that worships on Sunday mornings, in person or on Zoom. Its 2023
  report describes a children's program for elementary-age kids and a monthly Sunday food distribution
  it hosts.
what_you_do: Join Sunday worship at 10:30 am at the Coulter Street meetinghouse or on Zoom. Ask about
  the monthly Sunday food distribution the meeting hosts for The Center for Returning Citizens, and about
  adult classes, which in 2023 included speakers, book readings, and films.
