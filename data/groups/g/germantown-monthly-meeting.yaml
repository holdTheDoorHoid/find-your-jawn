summary: A Quaker meeting in Germantown that worships on Sunday mornings, in person or on Zoom. Its 2023
  report describes a children's program for elementary-age kids and a monthly Sunday food distribution
  it hosts.
what_you_do: Join Sunday worship at 10:30 am at the Coulter Street meetinghouse or on Zoom. Ask whether
  the monthly Sunday food distribution described in the 2023 report is still running, and ask about adult
  classes, which were restarting in 2023 with talks and a poetry reading.
