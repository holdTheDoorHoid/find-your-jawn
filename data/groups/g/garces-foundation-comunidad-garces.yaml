summary: A nonprofit that runs its own programs for immigrants, including English classes, digital skills,
  free medical and dental care days, and a dental care program. It says it keeps enrolling new students
  in its English classes.
what_you_do: Enroll in an English or digital skills class through its IDIOMA program, volunteer at its
  health days or at IDIOMA, or use its dental care program. Volunteers with medical or dental training
  are especially needed for health days.
