first_step:
  how: Submit the IDIOMA registration form, pay the $60 course fee (or ask about a scholarship or payment
    plan), then take the online English placement test on your phone.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The IDIOMA page lays out each step to enroll, a placement test sets the level, and the site says
    it keeps enrolling new students. It is not a drop-in class, and there is a fee.
  what_to_expect: Your first step is an English placement test on your phone, which sets your level. Classes
    last 10 weeks and meet on weekday mornings or evenings. You can attend online or at the BOK Building
    office in South Philadelphia. The course fee is $60, and scholarships are available. For health days,
    you call the number for your location to book an appointment, and the care is free.
  first_visit_tips:
  - Have your phone ready for the English placement test, since it is taken there.
  - Ask about a scholarship or payment plan before you pay the course fee.
  - Call (267) 648-1398 or message that number on WhatsApp with questions about enrolling.
