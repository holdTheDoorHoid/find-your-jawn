  basis: Camps register through another township's page, after-school programs go by email through a link,
    and the site lists no ages, dates or prices, so the way in is unclear.
  what_to_expect: 'The site does not describe a typical session or a first day. The current summer camp
    is run with Lower Merion Township, so sign-up happens on that township''s page. Volunteers who fill
    in the form are added to a list for events and programs, and the site names two volunteer roles: a
    manager for RPG business development and an administrative coordinator.'
  first_visit_tips:
  - Ask for ages, dates and prices before you register, since the site does not list them.
  - For camp registration, use the Lower Merion Township page that the site links to.
  - The email address on the connect page is hidden, so call (267) 289-2098 or use the inquiry form.
