summary: A Philadelphia nonprofit that works on safe water, sanitation and hygiene around the world. It
  runs field projects and education programs, mentors young water professionals, and hosts talks and an
  annual conference.
what_you_do: Volunteer on field projects, blog writing, events or fundraising, help plan the annual conference,
  or apply to the board. You can also become a member, attend talks, or donate.
