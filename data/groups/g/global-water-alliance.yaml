first_step:
  how: 'Use the Get Involved form on the website to say whether you want to volunteer, write for the journal,
    join the conference, or help another way. Or become a member: $50 a year for professionals, $20 a
    year for students.'
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Membership, volunteer and newsletter routes are listed publicly with a sign up form, and the
    group describes itself as mostly volunteer run. Talks are listed, but the page does not say which
    are open to the public.
  what_to_expect: Most of the group is volunteers, so newcomers usually take part by helping with a project,
    writing for the blog, or helping run an event. The 18th annual conference was a one-day event on March
    26, 2026, from 8:30 am to 4 pm, with breakfast and lunch provided and a reception afterward. The conference
    page does not state the ticket cost.
  first_visit_tips:
  - Check the events page for the next talk and whether it is open to the public.
  - Say which area you want to help with in the Get Involved form, so the group knows where to place you.
