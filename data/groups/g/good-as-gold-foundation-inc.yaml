first_step:
  how: Use the Apply Here form on the Golden Keys page to apply for the homebuying cohort, or attend a
    Golden Workshop listed on the events page.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The events page lists a public interest meeting before the cohort application, and workshops
    link to sign up on the events page. The cohort needs an application and holds 25 people, and the site
    does not say who may attend workshops, so the rating is 3.
  what_to_expect: Golden Workshops cover money topics such as budgeting, taxes, credit, and homeownership,
    in person or online. The Golden Keys cohort meets in 13 to 16 sessions of 1 to 2 hours over about
    nine months, with budgeting, credit education, savings guidance, and one-on-one counseling. The site
    does not say what either one costs, so ask before you sign up.
  first_visit_tips:
  - Email programs@goodasgoldfoundation.org about cost, eligibility, and location before you apply.
  - Choose in person or virtual when you sign up, since the cohort and the workshops are offered both
    ways.
  - Watch the events page for the interest meeting, which lets you learn about the cohort before you apply.
