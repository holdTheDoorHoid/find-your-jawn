summary: A Quaker meeting on West School House Lane in Northwest Philadelphia with Sunday worship in person
  and online, a children's Sunday school, and a library that visitors can use. It says it welcomes all
  people.
what_you_do: Join Sunday worship at 10:30 am, in person or online, then stay for conversation and food.
  Visitors can use the meeting library, which the site says is open to visitors, and can email the secretary
  for the online worship link.
