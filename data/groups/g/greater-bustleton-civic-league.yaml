summary: If you care about what gets built near you, Greater Bustleton Civic League is a City registered
  community organization in the Upper Far Northeast part of the city that hears about zoning and development
  proposals.
what_you_do: Members are volunteer Bustleton residents who talk over public safety, zoning, crime, cleanliness
  and development at monthly meetings, in person or by Zoom.
