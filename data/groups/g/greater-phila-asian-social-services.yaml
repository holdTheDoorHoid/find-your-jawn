summary: GPASS is a nonprofit social service center in North Philadelphia. It runs the Neighborhood Advisory
  Committee for the Olney and Logan area, a City-backed program that connects residents to City services
  and gives neighbors a voice on local needs.
what_you_do: Volunteer on the sub-committee that helps plan the committee's work, or visit the office
  on a weekday to talk with the NAC coordinator about City programs and neighborhood needs.
