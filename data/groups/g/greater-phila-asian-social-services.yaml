first_step:
  how: Call 215-456-1662 or visit the office on a weekday and ask how to join the Neighborhood Advisory
    Sub-Committee.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The NAC page invites residents to join its volunteer sub-committee and says to call or visit,
    but it gives no meeting schedule, so it is not rated higher.
  what_to_expect: A first visit is a talk with the NAC coordinator about City programs and what the area
    needs. The sub-committee helps plan the committee's activities, but the site lists no meeting times,
    so ask when you call. No page we could read says whether there is a charge for the volunteer role.
  first_visit_tips:
  - The office is closed on weekends, so plan a visit Monday to Friday between 9 am and 5 pm.
  - The office is at 4943 North 5th Street, Philadelphia, PA 19120.
  - Call ahead at 215-456-1662 to check that the coordinator is available.
  - The office also hosts community meetings, such as a police district advisory council session the calendar
    listed for September 2026.
