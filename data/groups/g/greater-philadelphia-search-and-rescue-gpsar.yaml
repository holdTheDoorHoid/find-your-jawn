summary: A volunteer group that searches for missing people across Pennsylvania, New Jersey, and Delaware.
  Its searches are free for families, and its volunteers train in search skills and stay on call around
  the clock.
what_you_do: Search teams, land navigation, logistics, search planning, and communications. Members train
  in search skills and help run searches once they are dispatched.
