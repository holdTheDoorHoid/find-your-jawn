  newcomer_friendliness: 2
  basis: The volunteer page sends people to the membership chair before anything else, the application
    questions it mentions do not appear on the page, and the group calls this a serious commitment, so
    the way in is unclear.
  what_to_expect: Expect a serious commitment. Searches can mean late-night call-outs and long days of
    tiring field work. New members learn search skills, land navigation and logistics, and join real searches
    once they are dispatched.
  first_visit_tips:
  - Read the volunteer page first, since the group asks people to apply only if they can fully commit.
  - Plan for late-evening call-outs before you apply.
