summary: A nonprofit cat rescue in Brewerytown that runs Le Cat Café, where visitors can spend time with
  adoptable cats, and places cats with foster homes until they are adopted.
what_you_do: Foster a cat until it is adopted, or visit Le Cat Café to meet the cats. Volunteers work
  from their own homes on trapping, vetting, and fostering, but the site does not list volunteer roles
  or a sign-up step.
