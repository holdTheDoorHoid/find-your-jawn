  basis: The home page says cafe visits are by appointment, and the foster page names a clear first step.
    Fostering needs an approved application.
  what_to_expect: 'Le Cat Café is the rescue''s adoption program, where you can spend time with adoptable
    cats on Girard Avenue. The rescue calls itself not a shelter: its cats live with volunteer foster
    homes, and the cafe is where you meet them. The site does not give the visit length or fee, so ask
    before you go.'
  first_visit_tips:
  - Street parking is on Girard Avenue, so bring quarters for the meter or use the meterUP app.
  - The cafe is closed on Wednesdays, so check the hours before you go.
  - The site does not say whether children are welcome at the cafe, so ask before you go.
