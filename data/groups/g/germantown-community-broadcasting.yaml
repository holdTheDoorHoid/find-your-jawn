summary: The community radio station for Germantown, on the air as G-Town Radio at 92.9 FM (WGGT-LP).
  It airs local music and talk shows, posts podcasts, and runs an artist residency with public gatherings.
what_you_do: Tune in online or on 92.9 FM, follow the podcasts, or come to public gatherings tied to the
  artist residency. Ask the station by email or phone how to help with its programs.
