summary: Germantown's community radio station, heard on 92.9 FM and online. It airs music shows, local
  news, podcasts and community events, and it sometimes hosts open talks with neighbors.
what_you_do: Tune in, sign up for the newsletter, or come to a community talk the station announces. The
  Get Involved page is where the station points people who want to help, but the page we read did not
  show what volunteering involves.
