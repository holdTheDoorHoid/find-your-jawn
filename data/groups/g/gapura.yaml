summary: A community nonprofit serving Indonesian immigrants and their families in Greater Philadelphia.
  It helps with consular papers, bank accounts, and City ID, and runs cultural programs like Gamelan music,
  a youth group, and a summer culture camp for children.
what_you_do: Get help with paperwork and services, join the Gamelan or youth group, volunteer at events
  like the Indonesian Festival, or bring your family to the cultural events.
