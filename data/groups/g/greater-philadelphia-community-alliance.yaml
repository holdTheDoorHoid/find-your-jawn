first_step:
  how: For free Pre-K, use the registration link on the group's preschool page (gpcacares.org/programs/preschool).
    For other programs, call (215) 336-5505 or email info@gpca-phila.org.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Programs are described as free or low cost and open to Philadelphia residents of all ages, and
    the site gives a phone line and an email. Eligibility, hours and sign-up steps are not stated for
    most programs.
  what_to_expect: The site does not describe a typical visit. Programs serve young children, school-age
    kids, teens, parents and adults, and several are free or low cost. Hours, locations and sign-up steps
    are listed for only some programs, so call the office first.
  first_visit_tips:
  - Call the office with the name of the program you want before you go.
  - Ask about eligibility, cost and hours, since the site leaves most of these out.
  - Pick the center nearest you from the contact page, which gives the address for each one.
