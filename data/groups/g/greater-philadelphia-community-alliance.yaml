summary: A South Philadelphia nonprofit that runs family programs, including early learning and free Pre-K,
  after-school and summer camps, benefits and bill help, and adult and parent classes. It also includes
  a Neighborhood Advisory Committee for the area.
what_you_do: Families use its early learning classes, after-school and summer camps, benefits and bill
  help, housing and utility help, and adult classes, including parenting and English as a second language
  classes. The site lists a Neighborhood Advisory Committee but does not say how to join it.
