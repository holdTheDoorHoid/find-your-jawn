summary: A Balinese gamelan ensemble in South Philadelphia that teaches traditional Balinese music to
  community members. Players learn the parts, rehearse as a group, and join the fall concert and community
  events.
what_you_do: Learn to play gamelan parts in a group, rehearse on Thursday evenings, and take part in the
  fall concert.
