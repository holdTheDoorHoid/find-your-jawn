  basis: Community sessions are open to the public and take sign-ups by text, but the site does not say
    whether beginners are welcome or what skill is needed.
  what_to_expect: Sessions are group rehearsals in which each player learns a part of a piece, and the
    whole ensemble plays together on the group's gamelan. The site links practice videos of individual
    parts from each piece's song page, so you can review at home. The site does not list fees or describe
    a first session, so ask by text before you come.
  first_visit_tips:
  - Register by text before you come, since sign-up is by text.
  - Ask the group whether you can use the practice videos on the song pages before your first session.
  - The site gives no parking or transit details for PAX, so check the address before you go.
