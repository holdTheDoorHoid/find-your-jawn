summary: The Girl Scout council for Philadelphia and eight nearby counties. Girls join troops, and adults
  lead a troop, help one, or take council roles such as committee member or awards mentor.
what_you_do: Girls join a troop, which meets at times and places its leaders set. Adults can start a troop,
  help an existing troop with skills, the cookie program or chaperoning, share first aid or outdoor skills,
  join a council committee, or mentor girls working toward the Silver and Gold Awards. Adult volunteers
  must be 18 or older.
