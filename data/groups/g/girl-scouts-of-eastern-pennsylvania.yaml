first_step:
  how: Use the Find a Troop search on gsep.org to get a list of troops near you, or fill in the volunteer
    interest form. Adults who want to lead a troop can start with the leader interest form.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: A girl pays the yearly membership and joins a troop before she sees a meeting, and the site does
    not say whether a visit is allowed. Adult volunteers must clear state checks before a role is approved.
  what_to_expect: Girls join a troop after paying the yearly membership, and each troop sets its own meeting
    times and place. Adult volunteers complete a state compliance packet (police, child abuse and FBI
    checks) and two online courses before a role is approved.
  first_visit_tips:
  - Ask the troop leader whether a girl can visit one meeting before joining.
  - Adult volunteers have 30 days after choosing a role to finish the compliance steps.
  - Gather the 3 to 4 compliance documents before starting, since partial submissions cause delays.
  - Compliance questions go to memberservices@gsep.org with 'Compliance' in the subject line.
