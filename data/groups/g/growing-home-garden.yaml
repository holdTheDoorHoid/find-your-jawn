first_step:
  how: Email gardens@seamaac.org or call (347) 719-1488 to ask about getting a plot.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The page lists an email and phone number to ask about joining, but it does not say how plots
    are given out, whether there is a waitlist, or when new gardeners start, so the way in is unclear.
  what_to_expect: Each gardener works an individual plot in one of two shared gardens, which measure about
    5,360 and 7,862 square feet. SEAMAAC runs the gardens together with the Neighborhood Gardens Trust
    and the Pennsylvania Horticultural Society. The pages we read do not describe a first day, work days,
    garden rules, or costs, so ask the garden contact.
  first_visit_tips:
  - Call or email before you visit, since the pages we read do not list open days.
  - Ask which garden, Mercy Street or Emily Street, has plots open and what the next step is.
  - The Neighborhood Gardens Trust says demand is high and many of its gardens have waitlists, so ask
    about a waitlist early.
