summary: Two food-growing gardens with individual plots on Mercy Street and Emily Street in South Philadelphia,
  run with SEAMAAC, which works with immigrant and refugee communities. The gardens were set up to help
  newcomers grow food from their own cultures.
what_you_do: Grow food in an individual plot in one of two shared gardens. Ask the garden contact about
  getting a plot.
