  newcomer_friendliness: 2
  basis: Membership needs an artist application and a unit purchase. The public way in is the mailing
    list and events, but the site posts no dates, so the way in is unclear.
  what_to_expect: The co-op is a converted warehouse with 15 live and work units on about 1.5 acres, with
    yards, trees, a garden, and a parking lot. Residents are visual artists, theater artists, and writers,
    and they share their work through open studios, events, classes, and workshops. Public dates are not
    posted, so check the mailing list before you plan a trip.
  first_visit_tips:
  - Join the mailing list first, since the site does not post dates for open studios.
  - The site we read does not give a street address or parking details, so ask when you get a date.
  - If no unit is for sale, you can ask to join the waiting list through the co-op's contact form.
