summary: An artist-owned live and work building in Germantown with 15 units, a shared garden, and open
  studios and events. Members are working artists who buy into the co-op when a unit comes up for sale.
what_you_do: Visit open studios and events, join the mailing list for news, or apply for membership when
  a unit is for sale.
