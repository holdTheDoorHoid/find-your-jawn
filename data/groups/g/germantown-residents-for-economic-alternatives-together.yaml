summary: A Germantown neighborhood group that shares seeds and tools, runs a mutual aid fund and time
  bank, and works on housing and emergency preparedness so current residents can stay.
what_you_do: Get on the email list, attend learning circles and events, and take part in projects such
  as the seed library, canning club, and housing outreach. Volunteers can also fill in the volunteer form
  on the site.
