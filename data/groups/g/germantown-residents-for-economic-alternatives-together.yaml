first_step:
  how: Join the email list on the website, then attend an event you hear about, or fill in the volunteer
    form on the Get involved page.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The email list, the volunteer form and the event register links are all public, and the site
    suggests attending an event as a first step. No event times or places are posted and no membership
    step is shown, so the rating stays at 3.
  what_to_expect: The events page and newsletter are where activity is posted, and the site does not say
    how long events run, who attends, or what they cost. The group says many members first came through
    a learning circle, an event, or volunteering. Email greatgtown@gmail.com to ask about the next event
    before you go.
  first_visit_tips:
  - Ask by email for the time and place of the next event, since the events page does not show them.
  - The group's address is a post office box, so the meeting place will come from the event notice or
    the reply to your email.
  - Follow the group on Facebook or Instagram, where event posts go up.
