summary: A Philadelphia group that sells locally grown produce through Black Farmers Markets and weekly
  produce boxes. It also keeps a garden open in West Philadelphia and runs wellness events and workshops.
what_you_do: Shop at the Black Farmers Market on the second and fourth Saturdays, order a weekly Fresh
  Takes box for $25, or visit the garden on Wednesdays and Thursdays during the season.
