first_step:
  how: Visit the Black Farmers Market on a second or fourth Saturday between 10 am and 2 pm, at Freedom
    Greens + Gardens on the 52nd Street Corridor.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The market and garden are open to the public on posted hours, and neither the group's pages nor
    the search listings mention membership or sign-up.
  what_to_expect: The market sells fruits, vegetables, herbs and plant medicines grown by Black and Brown
    farmers, along with food makers and artisans. Most produce is pay-what-you-wish. The group's pages
    do not give the number of vendors or say what else happens on a market day, so check the group's social
    accounts before you go.
  first_visit_tips:
  - The group's pages do not list which payment methods the market takes, so ask at the stand.
  - The market is across from Malcolm X Park on the 52nd Street Corridor.
  - If you want to see the garden, it is open Wednesdays and Thursdays from 12 to 6 pm. The pages do not
    say whether visitors can join garden work.
