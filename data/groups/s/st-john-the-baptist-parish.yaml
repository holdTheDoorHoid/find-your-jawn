summary: A Catholic parish in Manayunk with Sunday Masses at 9 and 11 am and 6 pm, and a weekday Mass
  at 7 am.
what_you_do: Come to Mass. Once you are registered as a parishioner, you can serve in a ministry such
  as ushering or greeting. Adults who are curious about Catholicism can join the Tuesday evening adult
  class (OCIA).
