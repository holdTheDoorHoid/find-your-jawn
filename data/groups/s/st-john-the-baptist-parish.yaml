first_step:
  how: Come to a Sunday Mass at 9 am, 11 am or 6 pm. To start the adult class, register for the session
    that begins Sept. 22, 2026.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The adult class page welcomes adults who are only curious and explains how to sign up; Mass is
    open to anyone. No beginner day or orientation is listed.
  what_to_expect: Mass is free and open to anyone, and the site does not say how long it runs. The adult
    class is a small, informal Tuesday evening group from 6:30 to 8 pm in the Parish Center, where you
    can ask questions about the Catholic faith. You can attend as a curious adult without joining; full
    attendance is required only for adults preparing to become Catholic.
  first_visit_tips:
  - Park in the church lot at the Cresson Street entrance near Pensdale, or use on-street parking on Mass
    days.
  - For the adult class, register through the parish registration page or call the office.
  - Call 215-482-4600 with questions. The office is open Monday to Thursday, 9 am to 4 pm, and Friday
    until 3 pm.
