first_step:
  how: Call the office at 215-922-6590 Monday to Friday, 9 am to 5 pm, or join through the membership
    form on the site. For a first class, register for the Nuts and Bolts course, which is written for
    people new to Judaism and those coming back to it.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The site has a beginner course for people new to Judaism, says all are welcome, and tells visitors
    to call or use the membership form. It does not describe a formal guest or first-visit policy, so
    it stops short of a top rating.
  what_to_expect: Shabbat services are held in the sanctuary on Friday evenings and Saturday mornings,
    and the Saturday service includes a discussion of the week's Torah portion. Adult courses run for
    several sessions, mostly in person, with a Zoom option on some. The site does not describe a guest
    policy or dress code, so ask the office what a first visit looks like.
  first_visit_tips:
  - Free street parking for Friday evening and Saturday morning services is on west 5th Street (Lombard
    to Walnut) and east 6th Street (Spruce to Pine). Those spots are No Stopping lanes, so pick up the
    parking placard in the lobby first.
  - Register ahead for an adult course, which the site recommends. Zoom links and passcodes go to registrants.
  - If you use a wheelchair, enter through the Paula Kline Learning Center door on Spruce Street, and
    use the elevator to reach the first or second floor.
