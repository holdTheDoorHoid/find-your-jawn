summary: A congregation at 418 Spruce Street in Society Hill with Friday evening and Saturday morning
  services, a weekly Monday evening minyan on Zoom, a playschool for children ages 18 months to 5, and
  a Hebrew school.
what_you_do: Join Friday evening or Saturday morning Shabbat services and the meals after them, take an
  adult education course (the Nuts and Bolts introduction to Judaism is written for people new to the
  faith), enroll a child in the playschool or Hebrew school, or join the Monday evening minyan on Zoom.
  Membership and renewals are handled through an online form.
