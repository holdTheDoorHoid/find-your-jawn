summary: A nonprofit that has served the Spring Garden neighborhood for nearly 60 years. It hosts community
  meetings and social events, follows zoning and history matters, and runs a Block Captains network that
  organizes a monthly neighborhood clean-up.
what_you_do: Become a Block Captain to keep neighbors informed and invite them to the monthly Sweep Up
  Saturday clean-up, or join the association as a member. Members get the directory, newsletters, zoning
  information and local business discounts.
