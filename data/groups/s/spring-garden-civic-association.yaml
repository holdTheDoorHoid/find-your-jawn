first_step:
  how: Come to the monthly Sweep Up Saturday clean-up on the first Saturday, 10 am to noon, or use the
    Join link on the Block Captains page to sign up as a Block Captain.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The clean-up is a public monthly event that Block Captains invite neighbors to join, and Block
    Captain sign-up is a web form. The page does not tie the clean-up to membership, which costs $15 to
    $50 a year.
  what_to_expect: Sweep Up Saturday runs from 10 am to noon on the first Saturday of the month. Volunteers
    pick up trash and leaves on the block, then gather for a social stop at Fairmount Tavern. Block Captains
    also keep neighbors informed and share news about the association.
  first_visit_tips:
  - The office is a storefront at 601 N. 17th Street, 1st Floor, if you want to stop by in person.
  - Email sgcaphilly@gmail.com or call 215-236-7334 to find out which Block Captain covers your block.
  - Plan for the clean-up to run 10 am to noon, with the social gathering afterward at Fairmount Tavern.
