first_step:
  how: Fill in the Volunteer With Us form linked from the Take Action page to join a stocking or collection
    shift, or email southphlcommunityfridge@gmail.com with questions first.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The Take Action page says anyone can volunteer and gives an open sign-up form. It describes no
    training and no set shifts, and it does not single out newcomers.
  what_to_expect: Volunteers stock and clean the fridges, meet food drivers who bring donations, and drive
    large donations to other fridges and pantries. There are no set shifts or training described, so you
    pick the time that works for you. The site says anyone can volunteer.
  first_visit_tips:
  - Email southphlcommunityfridge@gmail.com with questions about volunteering, locations or partnerships,
    as the About page suggests.
  - Use the address list on the website to find the fridge nearest you.
  - The site lists no shift times, so ask the group when the next stocking shift is planned.
