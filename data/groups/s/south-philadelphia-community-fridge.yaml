summary: A food-sharing project that keeps community fridges and pantry shelves stocked at eight sites
  across South Philadelphia, with a volunteer list for cleaning, driving and fundraising help.
what_you_do: Clean and organize fridges and pantries, drive large food donations, meet donation drivers,
  buy groceries with donated money, represent the project at community events, or help with social media,
  graphic design or grant writing.
