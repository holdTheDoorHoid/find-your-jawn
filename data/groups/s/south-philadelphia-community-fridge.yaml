summary: Volunteers who keep community fridges stocked with donated food at several sites across South
  Philadelphia. The fridges are open around the clock for anyone who needs food.
what_you_do: Stock the fridges with donated food, help collect food from grocers and restaurants, or drive
  large donations to fridges and pantries. You can also host a food drive.
