summary: Strawberry Mansion CDC is a neighborhood nonprofit, founded in 2004, that works on home repair,
  neighborhood land care, and job help for young adults. Its Neighborhood Action Center is also listed
  by the City as a local advisory group for the Lower North area.
what_you_do: Help with phone or in-person outreach, event tabling, or grant writing, or take part in the
  monthly Zoom call on local work.
