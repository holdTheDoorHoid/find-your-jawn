first_step:
  how: Join the monthly Call to Action meeting on Zoom, 6 to 7:30 pm, through the link on the event page,
    and use the RSVP button if you plan to come.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The monthly meeting is open to the community on Zoom, and the volunteer form is public. No page
    says newcomers are welcome by name.
  what_to_expect: The monthly call focuses on the Outdoor Leadership Program run with Philadelphia Outward
    Bound School. It is aimed at anyone who wants to join the conversation about the neighborhood, and
    the event page does not mention a fee. If you want to volunteer instead, the online form lets you
    pick phone outreach, in-person outreach, event tabling, or grant writing, and the group then contacts
    you.
  first_visit_tips:
  - Open the event page before the call to get the Zoom link and the RSVP button.
  - Plan for an evening, since the call runs 6 to 7:30 pm.
  - Check the Events page for one time gatherings such as community dinners.
  - To volunteer, fill in the online form on the Volunteer page and name the areas that interest you.
