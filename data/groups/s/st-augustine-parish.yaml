first_step:
  how: Come to a Sunday Mass, then download the Registration Form from the parish website and drop it
    in the Sunday basket or email it to the parish office.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The site has a registration form, a Becoming Catholic page for adults, and a young adult gathering
    that invites newcomers to join in. It names the parish phone and email. It does not describe an orientation.
  what_to_expect: Sunday Mass is free and open to anyone, at 9 am, 11 am or 7 pm. Coffee and donuts follow
    the 9 am and 11 am Masses in the parish hall. The young adult group is for adults from about 24 into
    their thirties, mostly gathers at the 7 pm Mass, and invites newcomers to join in with whatever they
    bring to the conversation.
  first_visit_tips:
  - If you want the young adult group, plan on the 7 pm Mass.
  - Stay after the 9 am or 11 am Mass for coffee and donuts in the parish hall to meet people.
  - The church has a ramp entrance and an accessible restroom if you use a wheelchair.
  - Ask the parish office about the 7 pm socials, since the site does not list them.
