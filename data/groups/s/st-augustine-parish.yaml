summary: A Catholic parish near 4th and Vine streets in Old City with Filipino and young adult community
  groups, Sunday Socials and a History Fair. Its ministries include liturgy, music and outreach.
what_you_do: Join the young adult community or the Filipino community, come to Sunday Socials after Mass,
  or volunteer. Volunteer roles include lectors, communion ministers, music, gardening and cleaning, and
  food prep and service for the Gift of Life Family House on Sundays and Tuesdays, offsite. Adults who
  want to become Catholic can join the Becoming Catholic program.
