summary: A Philadelphia group for women who work in food and hospitality. They offer mentoring, networking,
  food fairs, happy hours and workshops.
what_you_do: Women who run or work in food and hospitality can pay yearly dues to join as members, which
  brings monthly meet-ups and question sessions with experts. The group also runs a yearly business and
  leadership day called the Work Shop, with ticket links on its site.
