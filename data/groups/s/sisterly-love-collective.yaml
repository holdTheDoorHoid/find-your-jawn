  basis: Joining means paying yearly dues and meeting an eligibility rule (women working in food and hospitality),
    and the site does not say whether food fairs, happy hours or workshops are open to non-members.
  what_to_expect: Membership is for women, or people who identify as women, who run or work in food and
    hospitality. Members get emails about events, invitations to monthly meet-ups and expert question
    sessions, and discounts on workshops. The Work Shop is a day of panels on running a business, and
    the most recent one listed was on Monday, July 27, 2026 at Fitler Club in Philadelphia.
