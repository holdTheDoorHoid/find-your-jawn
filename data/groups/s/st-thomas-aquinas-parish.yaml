schedule:
  text: Saturday Masses at 4 pm (English) and 6 pm (Spanish). Sunday Masses at 8 am (Vietnamese), 10 am
    (English), noon (Indonesian) and 5 pm (Spanish). Daily Mass at 8:30 am (English) in the Aquinas Center,
    and at 8:30 am in the church on holy days. Confession before Mass, and Saturday 3:30 to 4 pm. Wednesday
    novena at 7 pm. The Adoration Room is open weekdays 9 am to 3:30 pm and on weekends 9 am to noon (archdiocese
    listing, not on the parish site).
