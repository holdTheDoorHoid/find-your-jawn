summary: A Catholic parish at 17th and Morris Streets in South Philadelphia with Masses in Vietnamese,
  English, Indonesian and Spanish. It describes itself as a multicultural, multilingual parish.
what_you_do: Come to Mass in the language you prefer, or pray in the Adoration Room. The Wednesday novena
  to Our Lady of Perpetual Help is at 7 pm in the chapel.
