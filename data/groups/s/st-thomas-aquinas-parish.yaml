first_step:
  how: Come to any Mass in the language you want, or call the parish at 215-334-2312 to ask about joining
    the parish or receiving the sacraments.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The parish says it serves immigrants and people of many languages, and it invites people who
    want to join the parish or receive sacraments to call. The site has no newcomer welcome or orientation,
    so the rating is 3.
  what_to_expect: Mass is free and open to anyone, and it is held in four languages, so you can attend
    in English, Vietnamese, Indonesian or Spanish. The English Mass on Sunday is at 10 am and the daily
    English Mass is at 8:30 am. The Adoration Room is a quiet prayer space; the archdiocese listing gives
    its hours, but the parish site does not.
  first_visit_tips:
  - 'Choose the Mass by language: Vietnamese at 8 am, English at 10 am, Indonesian at noon, and Spanish
    at 5 pm on Sunday.'
  - Confession is available before Mass or by appointment, so call the office if you want a set time.
  - The site does not list parking, transit or wheelchair access, so call 215-334-2312 before you come
    if you need those details.
