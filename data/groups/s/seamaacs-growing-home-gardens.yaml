summary: Two community gardens on Emily and Mercy Streets in South Philadelphia, run by SEAMAAC, an immigrant
  and refugee services nonprofit, with the Neighborhood Gardens Trust. Mostly immigrant and refugee gardeners
  grow vegetables and familiar foods here. We could not confirm current activity.
what_you_do: Rent an individual plot in one of the two food gardens and grow vegetables and familiar foods.
  Ask the gardens office about open plots and any yearly fee before you visit.
