  newcomer_friendliness: 2
  basis: The gardens are meant for newly arrived immigrants and refugees, and a contact is listed, but
    the pages do not say how to get a plot or whether there is a waitlist.
  what_to_expect: The pages we read do not describe a first visit, how plots are given out, or when work
    days happen. The Neighborhood Gardens Trust page says the plots are individual, so you would grow
    on your own plot. Ask the gardens office what the first steps are when you call.
  first_visit_tips:
  - Call or email first, since the pages do not describe a walk-in visit.
  - Ask about open plots, the yearly fee and any waitlist before you go.
  - Ask which languages the gardens office speaks, since the site does not list languages.
