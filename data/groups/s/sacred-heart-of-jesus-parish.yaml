first_step:
  how: Come to any listed Mass, such as the 9:15 am Spanish Mass on Sunday or the 7 am weekday Mass. To
    register as a family or start a sacrament program such as OCIA or PREP, fill out the online parish
    registration form.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Mass is open to anyone and drop in is fine. The parish registration form and its OCIA and PREP
    options give a way in, but the site does not describe how those programs run.
  what_to_expect: Mass is free and open to anyone, and Masses are held in the church unless a notice says
    otherwise. English Masses are on Sunday at 8 am and 11:30 am, and the Spanish Mass is on Sunday at
    9:15 am and Tuesday at 7 pm. The parish page does not describe what happens during Mass or how long
    it lasts.
  first_visit_tips:
  - Pick a time from the schedule. The Spanish Mass is on Sunday at 9:15 am and Tuesday at 7 pm.
  - The church is at 3rd and Reed Streets, at 1404 South 3rd Street.
  - Holy day Mass times are not on the parish page, so check before a holy day.
  - Adults who want to join the Church can ask about OCIA through the registration form.
