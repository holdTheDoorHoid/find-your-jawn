schedule:
  text: Sunday Masses at 8 am, 9:15 am (Spanish) and 11:30 am. Saturday Mass at 8 am and a vigil Mass
    at 4:15 pm. Weekday Mass at 7 am Monday to Friday, plus a Spanish Mass at 7 pm on Tuesday. Holy Hour
    and confession on Thursday from 6 to 7 pm, and confession on Saturday from 3:15 to 4 pm.
