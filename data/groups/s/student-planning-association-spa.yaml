summary: The student group for City Planning students at Penn's Stuart Weitzman School of Design. It speaks
  up for students inside the department and school through class representatives their classmates elect,
  and it plans social events away from class.
what_you_do: Bring a student concern to the group's elected class representatives, or come to one of its
  social events. Past events it lists include bowling nights, pizza parties, a tailgate and a T-shirt
  fundraiser, but the page does not say how to join.
