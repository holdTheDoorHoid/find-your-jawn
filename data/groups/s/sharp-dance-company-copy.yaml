first_step:
  how: Go to the Monday 10 am open company class at Equilibrium Dance Academy, 1802 S. Broad Street. Sign
    the liability form on arrival and pay $10 on site. Email the company first if you want to know the
    class level.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: The Monday classes are open to the public, need no registration, and cost $10 a class, so the
    way in is clear. The page does not say the class level or whether beginners are welcome.
  what_to_expect: Each open company class runs one hour, from 10 to 11 am on Mondays, at Equilibrium Dance
    Academy on South Broad Street. You sign a liability form, pay $10 in cash or by Venmo, and take the
    class, and the page asks everyone to arrive on time. The company does not describe the level of the
    class, so email before your first visit if you are new to dance.
  first_visit_tips:
  - Arrive on time, since the page asks everyone to.
  - Bring cash or the Venmo app for the $10 fee.
  - Sign the liability form before you take the class.
  - Email the company first to ask about level or beginners, because the site does not say.
