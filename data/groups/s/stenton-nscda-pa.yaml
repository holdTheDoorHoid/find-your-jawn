  newcomer_friendliness: 3
  basis: Tours and many events are open to the public and can be booked by phone or email. The site does
    not describe a newcomer program or say whether walk-ins are welcome.
  what_to_expect: A visit is a timed tour of the historic house that starts on the hour. The site does
    not say how long a tour lasts or who leads it, so ask when you book. Adult admission is $10, with
    lower prices for students, children and seniors, and children under 6 are free.
  first_visit_tips:
  - Reserve a spot on a timed tour, since a booking guarantees your place.
  - Arrive a few minutes early, since tours start on the hour.
  - The gate is on North 18th Street, just off Windrim Avenue.
  - Take the Regional Rail to Wayne Junction, or Bus 23 to Windrim and Germantown Avenues.
