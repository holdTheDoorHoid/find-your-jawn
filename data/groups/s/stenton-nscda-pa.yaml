summary: The Stenton historic house museum in North Philadelphia, run by the Colonial Dames of America
  in Pennsylvania. It offers timed house tours, history talks and seasonal family events, such as a fall
  harvest festival.
what_you_do: Book a timed house tour, come to a history talk or a family event such as the Halloween Harvest
  Festival, or support the Friends of Stenton. Volunteer roles are not listed on the site.
