summary: A Catholic parish at Cobbs Creek Parkway and Cedar Avenue in West Philadelphia. It runs religious
  education, parish outreach and a chaplaincy for Francophone African Catholics.
what_you_do: Come to a Sunday Mass at 8 am or 11 am, or a holy day Mass. Families can ask about religious
  education, and newcomers can ask about the outreach work or the Francophone African chaplaincy. The
  site links a parish ministries page.
