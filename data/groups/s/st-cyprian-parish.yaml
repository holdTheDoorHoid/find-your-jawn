summary: A Catholic parish at Cobbs Creek Parkway and Cedar Avenue in West Philadelphia. Its ministries
  include religious education, a food pantry and clothes room, and a Bible study. It also offers an African
  French Mass on Sunday afternoons.
what_you_do: 'Come to a Sunday Mass: English at 8 am or 11 am, Nigerian at 1 pm, or African French at
  3:30 pm. Ask the office about joining a ministry, such as greeting, the choir, religious education,
  or the food pantry and clothes room.'
