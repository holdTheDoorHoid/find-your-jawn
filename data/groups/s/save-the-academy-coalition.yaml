summary: Volunteers working to keep the public museum of the Academy of Natural Sciences open on the Parkway.
  The museum's public doors closed on September 27, 2026, and the campaign is pressing officials to change
  that decision.
what_you_do: Sign the petition, contact city and state officials, make flyers, collect personal stories,
  and join volunteer work for rallies, vigils and events.
