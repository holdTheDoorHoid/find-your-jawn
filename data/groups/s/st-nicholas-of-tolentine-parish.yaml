summary: A Catholic parish at 9th and Watkins Streets in South Philadelphia with Sunday Masses at 9 and
  11 am and daily morning Mass.
what_you_do: Come to Mass, or ask the rectory about the parish's food cupboard, which takes donations
  at the rectory office, or about Aid for Friends, where volunteers prepare meals that are picked up and
  delivered to homebound neighbors. The choir rehearses Wednesdays at 7:45 pm, and a Morning Prayer group
  meets Monday to Friday at 7:45 am before the 8 am Mass. RCIA for adults and adult Bible study are listed
  on the parish website.
