first_step:
  how: Come to the 9 am or 11 am Sunday Mass, then call the parish at 215-463-1326 about the RCIA program
    for adults or the adult Bible study.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Mass is open to anyone, and the parish lists a phone number and separate pages for RCIA and adult
    faith formation, but it does not say what a first meeting is like.
  what_to_expect: Mass is free and open to anyone, so you can come and sit without signing up. The parish
    offers Sunday Masses at 9 and 11 am and a weekday Mass at 8 am. The parish also runs RCIA for adults
    and an adult Bible study and faith formation program, so ask the office which one fits you.
  first_visit_tips:
  - Call the parish at 215-463-1326 to ask about groups; the site lists committees but few contact details.
  - Morning Prayer meets Monday to Friday at 7:45 am, before the 8 am Mass.
  - The Choir rehearses Wednesdays at 7:45 pm if you sing.
