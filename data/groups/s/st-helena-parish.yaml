first_step:
  how: Come to a Sunday Mass (8 am, 9:30 am in Vietnamese, 11:15 am, or 12:30 pm in Spanish), then call
    the office at 215-424-1300 to ask about a ministry or the RCIA sessions.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Mass is open to anyone. The site lists a phone line and an email, and the ministries page says
    to contact the parish to join. No newcomer program is described.
  what_to_expect: Mass is free, and it is offered in English, Vietnamese and Spanish, so you can pick
    the time that fits your language. A guitar group plays at the 11:15 am Mass twice a month. The rectory
    is open 9 am to 5 pm on weekdays, closed noon to 1 pm, if you want to ask about joining.
  first_visit_tips:
  - Rectory hours are Monday to Friday, 9 am to 5 pm, closed noon to 1 pm, so call before you come by.
