summary: A Catholic parish near Fifth Street and Godfrey Avenue with Masses in English, Vietnamese and
  Spanish.
what_you_do: Come to Mass in English, Vietnamese or Spanish. The parish lists ministries you can join,
  including lector, usher, choir, guitar group, catechist for grades 1 to 8, food bank volunteer, and
  volunteer cook for homebound neighbors. Adults who are not yet Catholic can call the rectory about the
  RCIA sessions.
