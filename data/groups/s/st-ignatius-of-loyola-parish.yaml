summary: A Catholic parish near 43rd and Wallace Streets in West Philadelphia with a 10 am Sunday Mass
  and a Tuesday food pantry for people who live in the 19104 zip code.
what_you_do: Come to the Sunday 10 am Mass. Children can join PREP on Sundays after Mass, or sacramental
  preparation on Saturday mornings, through the religious education office. People who live in the 19104
  zip code can apply to the Tuesday food pantry at 636 N. 43rd St., and should bring identification.
