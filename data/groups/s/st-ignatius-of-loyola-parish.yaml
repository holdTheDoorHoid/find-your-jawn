first_step:
  how: Come to the Sunday 10 am Mass at the church at 43rd and Wallace Streets. To ask about religious
    education or the food pantry, call the parish at 215-386-5065.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Sunday Mass is open to anyone. The site has a register option and a phone line, and the food
    pantry page explains how to apply. No newcomer program is described.
  what_to_expect: Mass is free and open to anyone, so you can come and sit. For food help, the pantry
    asks you to show identification and apply before you get a bag of groceries, and pickups happen once
    a month. Children's religious education meets on Sundays after Mass for PREP, with Saturday morning
    classes for sacramental preparation.
  first_visit_tips:
  - Bring identification if you are applying for food help.
  - The parish office is open 9 am to 4 pm, Monday to Thursday, and closed on Fridays.
