schedule:
  text: Sunday Mass at 10 am. Weekday Mass on the first Wednesday of the month at 9:30 am at West Park
    Nursing Home. Holy days at 10 am and 7 pm. Reconciliation before Sunday Mass, 9:15 to 9:45 am, or
    by appointment. The food pantry committee meets Tuesdays 10 am to noon, and the pantry is closed on
    holidays and the fifth Tuesday of the month.
