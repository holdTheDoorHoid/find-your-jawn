summary: An Episcopal parish at Third and Pine streets with a food cupboard open Saturday mornings. No
  eligibility rules are listed, and the choir welcomes amateur and skilled singers.
what_you_do: Get food at the Saturday morning cupboard, sign up to volunteer there, sing with the choir
  on Sunday mornings, or join one of the church's groups, such as the churchyard gardeners or the book
  group.
