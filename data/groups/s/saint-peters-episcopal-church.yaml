first_step:
  how: Come to the 11 am Sunday service, or fill out the parish online welcome form and the parish will
    add you to its email list.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The parish has an online welcome form and holds a Welcome Coffee and Conversation several times
    a year, and its FAQ says you do not need to be Episcopalian to attend.
  what_to_expect: The 11 am service has the choir and organ, and there are 9 am family and spoken services
    as well. The FAQ describes readings and a sermon, then Communion, and it does not say how long a service
    runs. Dress is up to you, and children are invited to join in. The site lists no cost for worship.
  first_visit_tips:
  - On Sundays, park in the church lot at 315 Lombard Street, and move your car after the service because
    the lot locks on Sunday afternoons.
  - SEPTA bus routes 12, 40 and 57 stop at the church.
  - Call the parish office at 215-925-5968 on a weekday, 8:30 am to 4 pm, with questions.
