first_step:
  how: For a clinic, use the sign-up details on the site. For a summer camp or fall program, use its register
    button. For news about sessions, sign up for the mailing list through the contact page.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The FAQ says coaches welcome all skill levels and that clinics are low-stress, and the site has
    register buttons for camps and fall programs. Spots are limited, so sign up early.
  what_to_expect: A clinic runs about an hour, with a coach showing a skill or drill and then players
    working in small groups in a relaxed, fun style. An open shootaround follows, and afternoon sessions
    run from 3:30 to 5:30 pm. Each clinic is limited to 25 to 30 players and is first come, first served.
  first_visit_tips:
  - Bring sneakers and a water bottle.
  - Bring your own ball or lacrosse stick if you have one. Basketballs are provided if needed.
  - Lacrosse players need a mouthguard and goggles, which the FAQ lists for lacrosse only.
  - Indoor clinics are at Old Pine Community Center, on the corner of 4th and Lombard Streets.
