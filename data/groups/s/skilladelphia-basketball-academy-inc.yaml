summary: A basketball and lacrosse academy for girls and nonbinary players ages 6 to 14. It runs skills
  clinics, aftercare, summer camps and a fitness class for kids.
what_you_do: Players join skills clinics, aftercare, summer camps, or the Fit Fun fitness classes for
  kids. Clinics and camps are signed up for on the site, and families can join its mailing list for news
  about sessions.
