summary: The special services district that looks after streets, trees, and green space around the sports
  complex in South Philadelphia. Its programs cover litter and leaf pickup, street trees, and dog waste
  stations for people who live inside the district.
what_you_do: Residents can sign up for phone alerts, ask for a new street tree, and come to community
  events. The district also follows zoning and development plans in the area and shares news about projects
  such as a new arena and a traffic plan.
