first_step:
  how: Call 215-271-1701 and ask to be added to the Autocall phone alert list. Only people who live in
    the district can join.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Most programs and the phone alerts are for district residents, and the site does not say how
    someone from outside the district can take part. The way in is unclear beyond that.
  what_to_expect: 'The district''s work happens on the street: litter pickup, tree care, and dog waste
    stations. The website does not describe a regular meeting or what one is like, so a phone call to
    the office is the best first step. The phone alerts, events, and recycling cart cost nothing.'
  first_visit_tips:
  - Call the office at 215-271-1701 before you go, since no regular meeting times are posted.
  - Have your home address ready, because the phone alerts and community events are for district residents.
  - On event days, follow the overhead signs to the event parking lots.
