summary: An Episcopal parish on Locust Street that serves a Saturday meal called the Soup Bowl to about
  140 guests each week. It also runs a food cupboard and a choir with public concerts, and holds a Newcomer
  Brunch.
what_you_do: Come to the Saturday Soup Bowl (6 to 8 am), sit in on a Sunday service, or attend the Newcomer
  Brunch. Volunteers help make the soup, set tables, serve, and clean up.
