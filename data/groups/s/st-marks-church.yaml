schedule:
  text: 'Saturday Soup Bowl from 6 to 8 am. Saturday Low Mass at 10 am. Sunday: 8 am Low Mass, 9 am Family
    Mass, 10 am Christian Formation (September to June), and 11 am Choral High Mass. Choral Evensong and
    Benediction at 4 pm on the first Sunday of the month, October to June. Monday to Friday: 9 am Morning
    Prayer, 12:10 pm Low Mass, and 5:30 pm Evening Prayer.'
