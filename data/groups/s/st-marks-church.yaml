first_step:
  how: Come to the Newcomer Brunch on Sunday, October 11 at 12:30 pm, or sit in on any Sunday service.
    Call 215-735-1416 with questions.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The home page lists a Newcomer Brunch, and Sunday services are open to visitors; the membership
    page explains how to join but lists no newcomer classes.
  what_to_expect: The parish says its church is for all people. Communion is normally for people who are
    baptized, and others can ask for a blessing at the altar rail instead. Coffee and snacks come after
    the 9 and 11 am services, a good place to meet people. The site does not say how long services last
    or what they cost.
  first_visit_tips:
  - On Sundays you may park on the side of the street that is normally off limits if you display an Attending
    Saint Mark's permit. Ushers hand them out, and they also sit on shelves just inside the main doors.
  - The FAQ says the church is near several public transit options, but the site does not name the lines
    or stops.
  - The site does not explain the Soup Bowl guest rules, so call 215-735-1416 before you come if you want
    to know them.
