first_step:
  how: Attend the second Tuesday meeting at 7 pm at the Walker Lodge, 1290 Southampton Road. The site
    invites Somerton residents to come to a monthly meeting to join.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The site invites residents to attend a monthly meeting in order to join, says new members can
    vote at the meeting after they join, and gives an email contact.
  what_to_expect: The meeting starts at 7 pm at the Walker Lodge and is often joined by invited speakers,
    elected officials or their staff, and a local police meeting. The board meets before each member meeting.
    Dues are $5 a year per household if you decide to join.
  first_visit_tips:
  - Bring $5 in case you decide to join, since dues run September through August
  - Email civicsomerton@gmail.com with questions before the meeting, since the site asks for email rather
    than calls
