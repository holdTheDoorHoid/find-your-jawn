summary: A Lutheran congregation on Ryan Avenue in the Northeast with Sunday worship at 10 am, in person
  and online. Its site has a worship bulletin dated October 2026.
what_you_do: 'Come to Sunday worship at 10 am, in person or online. The church also runs three outreach
  ministries: Feed the Hungry (members make casseroles and bagged sandwiches), Feast of Justice (food
  gifts for families), and Aid for Friends (cooking meals for homebound older adults). The site does not
  say how to join them.'
