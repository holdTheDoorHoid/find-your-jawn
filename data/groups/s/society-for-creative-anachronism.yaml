summary: Penn's student chapter of a volunteer group that recreates crafts, music, dance and combat from
  before the 1600s. Members practice these skills and show them at events and demonstrations.
what_you_do: Members meet for period dance practice, craft nights and workshops. Guests without a PennCard
  must email the chatelaine at least 24 hours before a practice to be added to a name list, and the name
  must match the photo ID shown at the door.
