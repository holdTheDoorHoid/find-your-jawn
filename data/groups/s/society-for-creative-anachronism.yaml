first_step:
  how: Email the chatelaine at chatelaine@ivyeinrust.eastkingdom.org at least 24 hours before a practice
    so your name goes on the list, then come to the European dance practice. Guests who have a PennCard
    do not need the list.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The chapter's page says the chatelaine welcomes newcomers and is their first contact. The dance
    page does not say whether beginners are welcome, so this rating rests on the newcomer note.
  what_to_expect: Practices run about two hours in a campus library room, where a teacher leads 15th and
    16th century European dances with live musicians. Anyone without a PennCard must be on the name list,
    and the name must match the photo ID shown at the door. The chapter does not publish a cost or a dress
    code, so ask the chatelaine before your first visit.
  first_visit_tips:
  - Bring a photo ID that matches the name you sent to the chatelaine.
  - Enter Van Pelt Library, take the elevators to the 2nd floor, and follow the hallway to the room just
    before the arched entry to Lippincott Library.
  - Send your email at least 24 hours before the practice.
