summary: A nonprofit that has helped immigrant and refugee families in Greater Philadelphia since 1984.
  Young people can join an afternoon arts program at Furness High School, and adults can volunteer by
  phone.
what_you_do: Young people can join the Urban Arts Entrepreneurship Program after school at Furness High
  School, with classes in breakdancing, deejaying, music production and visual arts, and summer sessions
  too. Adults can call the main line to talk about volunteering. The group's volunteer teams cover health
  and social services, education, community development and hunger relief.
