summary: A nonprofit that has helped immigrant and refugee families in Greater Philadelphia since 1984.
  Teens can join an afternoon arts program at Furness High School, and volunteers can use the group's
  volunteer page.
what_you_do: Join the Urban Arts Entrepreneurship program after school at Furness High School, with classes
  in breakdancing, deejaying, music production and visual arts. Volunteer through the volunteer page.
  Health and social services and a Mifflin Square Park project are also listed, with no join steps shown.
