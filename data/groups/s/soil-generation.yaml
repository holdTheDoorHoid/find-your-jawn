first_step:
  how: Follow Soil Generation on Instagram, then email soilgen215@gmail.com to say who you are and what
    you are interested in, and ask for an invitation to the listserv.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: The group is not recruiting volunteers now, and its listserv is by invitation on request, aimed
    at Black and Brown community members. The way in is unclear, so a first timer has to ask first.
  what_to_expect: There are no set meetings, classes or shifts to attend. The collective shares its campaigns,
    such as the urban agriculture plan and the threatened gardens campaign, plus cultural projects like
    a manual and a short film, through its website and social media. Garden visits are not offered right
    now because the group has no growing space open to visitors.
  first_visit_tips:
  - Say who you are and what you are interested in when you write, since the group asks for this.
  - Follow Instagram or Facebook for campaign news, because the newsletter sign-up page shows a note that
    its storage is not set up yet.
  - Do not plan a garden visit; the group has no growing space open to visitors right now.
