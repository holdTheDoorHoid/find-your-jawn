summary: A Redemptorist Catholic parish at 5th Street and Girard Avenue, home to the National Shrine of
  St. John Neumann. It offers Mass most days, including a Spanish Mass on Sundays.
what_you_do: Come to Mass, the Wednesday novena to Our Lady of Perpetual Help at 7 pm, or a visit to the
  National Shrine of St. John Neumann.
