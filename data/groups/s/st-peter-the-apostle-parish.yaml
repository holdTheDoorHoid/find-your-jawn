first_step:
  how: Come to any Mass on the schedule, or call the rectory at 215-627-2386 to arrange a visit with a
    priest.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The March 2026 parish bulletin calls the parish welcoming and diverse and asks people to make
    an appointment by phone with a priest. The parish website could not be opened, and no newcomer program
    is listed.
  what_to_expect: Mass is free and open to anyone, and the 11 am Sunday Mass is in Spanish, so choose
    the time that fits your language. If you want to talk with a priest, the bulletin asks you to make
    an appointment by phone first. Weekday Masses are at 7 am, 12:15 pm and 5:30 pm.
  first_visit_tips:
  - Call the rectory at 215-627-2386 before you come if you want to meet a priest.
  - Confession is offered Monday to Saturday at 11:45 am and 5 pm, and on Sunday at 10:30 am in Spanish.
  - The rectory office is open Monday to Friday, 9 am to 5 pm.
  - The parish listing does not describe parking or transit, so ask the rectory before you come.
