summary: A Catholic parish at 17th and Ritner Streets in South Philadelphia with Sunday Masses at 8:30,
  10 and 11:30 am and a Saturday vigil at 5 pm.
what_you_do: Come to Mass, or join a parish group. The Senior Citizens Group (ages 55 and up) meets Mondays
  at 1 pm from September to June in the Senior School cafeteria. Other groups include the Holy Name Society,
  the St. Vincent de Paul Society, and RCIA for adults who want to join the Church. Call the rectory at
  215-334-4170 to ask about any of them.
