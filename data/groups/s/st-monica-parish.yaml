first_step:
  how: Come to a Sunday Mass at 8:30, 10 or 11:30 am, then call the rectory at 215-334-4170 about the
    Senior Citizens Group or RCIA.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Mass is open to anyone, and the parish gives a main phone number for groups such as RCIA, though
    the site has no welcome page.
  what_to_expect: Mass is free and open to anyone, so you can come to a Sunday service without signing
    up. The rectory answers questions about groups, and many of them meet from September to June, so fall
    is a natural time to start.
  first_visit_tips:
  - Confession at St. Monica is on Saturdays from 4 to 4:45 pm; at St. Edmond it is the Saturday after
    First Friday from 3 to 3:45 pm.
  - Eucharistic adoration at St. Monica runs Mondays from 9 am to 3 pm, September through May.
  - Call the rectory first to confirm meeting days, since many groups on the site have no listed times.
