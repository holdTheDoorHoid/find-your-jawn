  what_to_expect: Mass is free and open to anyone. The 10:15 am Sunday Mass is the main one, with choir
    and organ. If you are not yet Catholic, or you are coming back to the Church, the rectory can tell
    you about the adult catechism sessions.
  first_visit_tips:
