summary: A Catholic parish at 47th Street and Springfield Avenue in West Philadelphia with Sunday Masses,
  a Saturday evening Vigil, and weekday morning Mass.
what_you_do: 'Come to Mass, or join a parish group: altar servers, the parish choir, liturgical ministers,
  reading groups, the Legion of Mary (weekly after the 10:15 am Mass in the lower church), or Family Faith
  Formation for parents who teach their children. Call the rectory at 215-222-5819 to ask how to join.'
