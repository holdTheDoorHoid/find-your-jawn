summary: A free running club for South Philadelphia and nearby neighborhoods such as Queen Village, Old
  City and Society Hill. Runners of all abilities meet for weekday morning and Saturday runs, and each
  December the club joins a holiday lights run that ends at a brewery.
what_you_do: Show up at a scheduled run, such as the Tuesday or Thursday 6:15 am or Saturday 8 am runs
  from Front and South Streets, or join the December holiday lights run and the gathering at its finish.
