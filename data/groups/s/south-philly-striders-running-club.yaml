first_step:
  how: Show up at a Tuesday or Thursday 6:15 am, Wednesday 6:30 pm, or Saturday 8 am run, or email the
    club or message its Facebook group with questions first.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The about page says newcomers are always welcome, there are no fees, and you can show up at a
    scheduled run. The holiday run page says all paces are welcome.
  what_to_expect: Typical weekday morning runs cover 2 to 7 miles, and Saturday runs range from 3 to 10
    or more miles, according to the about page. Runners of all abilities are welcome, and there is no
    fee to join. The site names no pace groups or leaders, so ask in the Facebook group which run suits
    your pace before you come.
  first_visit_tips:
  - Meet at Front and South Streets for the morning runs, which the club lists as the start point.
  - Check the club's Facebook group for news on runs, since the site says other runs are posted there
    and on Instagram.
  - For the December holiday run, bring your ID and cross streets only on green lights, as the club asks.
