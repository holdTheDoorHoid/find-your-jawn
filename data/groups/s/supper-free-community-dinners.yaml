schedule:
  text: 'Five dinners a month at four churches, per a 2019 article: St. Martin''s on the second and fourth
    Wednesdays; Christ Church and St. Michael''s on the fourth Saturday, 3 to 5 pm; St. Alban''s on the
    second Tuesday; Grace Epiphany on the third Wednesday. Most run from 6 pm for about an hour.'
