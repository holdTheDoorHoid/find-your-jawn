summary: Free dinners open to anyone at four churches in Northwest Philadelphia. St. Martin-in-the-Fields
  began the program in 2012, and the four churches serve five dinners a month between them.
what_you_do: Help cook and serve, or share music or a talent with guests. Some churches also run a small
  activity table, such as arts and crafts or book giveaways.
