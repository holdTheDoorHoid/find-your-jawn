first_step:
  how: Register for a theatre class by sending the registration form and emergency contact form with payment,
    or buy show tickets through the site's ticket link.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Classes are open to the public by age, with a clear registration step and tuition listed. The
    audition page linked from the site gave no dates or requirements when read.
  what_to_expect: The fall class meets on Mondays for ten sessions, split into two age groups, and ends
    with a student showcase at the Mandell Campus Theater in Melrose Park. Registration is not complete
    until both forms and payment arrive. The site does not describe a trial class.
  first_visit_tips:
  - Early registration costs less, according to the class page.
  - Free parking is available on the theatre grounds and on Melrose Avenue.
  - Turn into the first driveway on the left off Melrose Avenue, then use the door in the middle of the
    building.
