  basis: Mass is open to anyone, and the public parish listing gives a rectory phone number for questions.
  what_to_expect: Mass is free and open to anyone, so you can come in and sit without signing up. Sunday
    Masses are in Q'eqchi at 7 am, Spanish at 10 am and English at noon, so pick the one you follow. Confession
    on Saturdays runs from 3 to 3:45 pm.
