summary: A Catholic parish at Roosevelt Boulevard and Cheltenham Avenue with Masses in Q'eqchi, Spanish
  and English, and Saturday evening Masses for its Brazilian and Neocatechumenal Way communities.
what_you_do: Come to Mass in the language you follow, or join the Thursday adoration, which runs after
  the 8:30 am Mass until 6:30 pm and ends with the rosary. The parish also lists a Brazilian apostolate,
  a Portuguese apostolate and a Neocatechumenal Way Mass, but the listings give no meeting times or contacts
  for the groups themselves.
