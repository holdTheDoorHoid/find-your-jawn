  newcomer_friendliness: 2
  basis: The volunteer page gives one contact and no steps. The subcommittee meets monthly, but the page
    gives no time, place or sign-up for it, so the way in is unclear.
  what_to_expect: The site does not describe what a first visit involves. The office is at 6328 Paschall
    Avenue, and the main office line is 215-729-0800, so a phone call is the best first step.
  first_visit_tips:
  - Call before you go, since the site does not list office hours.
  - Housing counselors are bilingual in Spanish and English, so ask for that if it helps.
  - The after-school program is for students at John Patterson Elementary, so call a program coordinator
    to ask whether it fits your child.
