summary: A community development group serving Southwest Philadelphia since 1987. It offers housing counseling,
  job and workforce help, an after-school program and a summer camp, and it runs the Neighborhood Advisory
  Committee, which gives residents a say in local planning.
what_you_do: Get help with housing counseling, job and workforce services, or money coaching. Families
  can use the after-school program for students at John Patterson Elementary, and neighborhood children
  can join the summer camp. Residents can also take part in the Neighborhood Advisory Committee's planning
  work.
