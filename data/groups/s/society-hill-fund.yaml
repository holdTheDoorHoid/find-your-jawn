summary: A nonprofit that manages money raised for Society Hill neighborhood projects, such as historic
  streetlights, Washington Square plantings and a town watch.
what_you_do: Give to one of the neighborhood projects the fund manages, or send a project idea through
  the contact form to start a new one. The fund's focus areas include safety, education, culture, civic
  engagement, beautification and green work.
