first_step:
  how: Send a project idea through the contact form on societyhillfund.org. A board member then emails
    you the application, and proposals are reviewed on a rolling basis all year.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: Starting a project means sending an idea and then filling in a board application, and the site
    gives no steps for volunteering or donating.
  what_to_expect: The site does not list meetings or events. Projects are run by their leaders, who handle
    fundraising, records and spending under the fund's name, and the board of trustees reviews each proposal
    for mission fit, impact and budget.
  first_visit_tips:
  - 'Have a short project plan ready: a description, goals, a timeline, a budget, expected results, and
    the people who would lead it.'
  - Expect the first reply to come by email from a board member, after you use the contact form.
