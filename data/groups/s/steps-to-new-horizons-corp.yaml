first_step:
  how: Use the Subscribe for Updates form on stnhorizons.com, or email info@stnhorizons.com, to ask about
    the next Financial Foundations session. The events page lists free online sessions, each with a link
    to more details or to register.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The site lists free online money courses for newcomers, but its pages do not say how to sign
    up for them, and only two listed sessions say registration is required.
  what_to_expect: 'The courses run on Zoom, and the Financial Foundations course meets once a week for
    six weeks. Age limits differ by session: Financial Foundations is for adults 18 and up, Money Journey
    for ages 16 and up, and Coaching for ages 21 and up, while Financial Voice is for ages 14 to 18.'
  first_visit_tips:
  - Check the age limit for the session you want, since it differs by program.
  - Coaching is one-on-one, so the appointment button on the coaching page is the place to start.
