summary: A Philadelphia media arts center that teaches video, sound, film and digital media workshops,
  rents production gear to people who can show they know how to use it, and runs community video projects.
  Members get discounts on programs and equipment rental.
what_you_do: Take a video or digital media workshop, rent production gear once you show you can use it,
  or go to the free orientation for new members. You can also join the volunteer list for screenings and
  events.
