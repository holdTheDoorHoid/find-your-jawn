summary: A media arts center founded in 1982 that teaches community filmmaking, runs screenings and a
  youth media program, and offers an equipment center. It also has community radio, WPEB 88.1 FM.
what_you_do: Take a scriptwriting class, come to a screening, or join a youth media program for middle
  and high school students. Community members can reserve equipment through the equipment center form.
  The site lists membership but no fee amounts, and it links an Opportunities page for volunteers that
  was not read.
