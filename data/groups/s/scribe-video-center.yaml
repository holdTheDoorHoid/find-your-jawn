first_step:
  how: Go to the free Orientation to Scribe for new members (the next ones are listed for Nov 9, 2026
    and Jan 11, 2027), or register for an intro workshop such as Introduction to Adobe Premiere.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The center has a free orientation for new members, labels several workshops as introductory or
    suited to first-time filmmakers, and says how to register on its site.
  what_to_expect: 'Most workshops meet in person at the Lancaster Avenue center for one or more sessions,
    usually a few hours each. You can register online, by mail, in person or by phone with a credit card.
    Equipment rental is a separate step: you must show you can use the gear and get approval from the
    facilities manager.'
  first_visit_tips:
  - Call ahead before you visit. The office keeps weekday hours and runs extra nights and Saturdays only
    when workshops are on.
  - Payments are usually not refunded, but you can change your registration up to 5 days before a workshop
    starts at no charge. Check dates first.
  - The directions list the Route 10 or T1 trolley and the Route 43 bus. No stop is named, so check a
    transit app before you go.
  - Take a workshop before you rent gear, since rental needs a skills check and approval.
