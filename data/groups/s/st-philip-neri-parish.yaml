summary: The Catholic parish in Queen Village at 218 Queen Street, with a Saturday vigil at 4:30 pm, a
  10 am Sunday Mass, and weekday Masses at 7:30 am. The parish office helps new parishioners register
  and start RCIA.
what_you_do: Come to Sunday Mass at 10 am or a weekday Mass, or call the parish office about registering,
  baptism classes, or RCIA (the program for adults who want to join the Catholic Church).
