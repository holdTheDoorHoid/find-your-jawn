first_step:
  how: Come to the Sunday 10 am Mass, or call the parish office at 215-468-1922 to register or ask about
    RCIA, which starts each fall for people over 14.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The contact page opens with a hello and welcome, lists what newcomers can start (registering,
    RCIA, baptism), and gives the office number. Mass itself needs no sign-up.
  what_to_expect: Mass is free and open to anyone, and the Sunday 10 am Mass is the one the site lists
    for visitors. For registration, RCIA or baptism, the office asks you to call first. Office hours are
    weekdays from 9 am to 4 pm.
  first_visit_tips:
  - Call the office on a weekday between 9 am and 4 pm if you want to register or ask about RCIA.
  - Sunday confession is offered before the 10 am Mass, and Saturday confession runs 3:45 to 4:15 pm.
  - The site does not describe parking or transit, so ask the office if you need those details.
