  text: Sunday Masses at 9 am, 11:30 am and 5:30 pm. Weekday Mass in the Newman Chapel at 12:05 pm, plus
    5:30 pm Tuesday to Friday during the school year. The young adults and grad students group meets every
    Wednesday at 6:30 pm, and OCIA classes meet on Tuesdays from 6 to 8 pm during the 2026 to 2027 year.
