first_step:
  how: Come to a Sunday Mass, then join the Wednesday 6:30 pm young adults and grad students group at
    the Newman Center, 111 South 38th Street.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The site has a page for new parishioners with an email list and no dues, a phone line for questions,
    a weekly young adult group open to all, and an adult initiation program for people still deciding.
    The full steps on the new parishioner page were not readable, so the rating rests on these named routes.
  what_to_expect: Mass is free and open to anyone, with Sunday Masses at 9 am, 11:30 am and 5:30 pm. The
    young adults and grad students group meets each Wednesday at 6:30 pm at the Newman Center, where the
    site says members grow in faith and serve others together. The page does not say whether you need
    to register before you attend, so ask the group's contact at your first visit.
  first_visit_tips:
  - If you want the young adult group, come on a Wednesday at 6:30 pm.
  - Sign up for the parish email list if you want news; the form asks for a permanent mailing address,
    not a dorm address.
  - The Newman Center and the parish office both use the 111 South 38th Street address, and the church
    is at 38th and Chestnut.
  - Call the parish office at 267-787-5000 if you have questions about groups before you come.
