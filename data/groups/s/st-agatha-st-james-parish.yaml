summary: A Catholic parish at 38th and Chestnut streets that serves students and young adults through
  the Newman Center on its campus. It offers Mass, adult and young adult groups, Bible studies and a homeless
  outreach team.
what_you_do: Come to Sunday or weekday Mass, join the young adults or grad student group, take a FOCUS
  Bible study, or sign up for the homeless outreach team or other service. Adults who want to become Catholic
  can join the OCIA program.
