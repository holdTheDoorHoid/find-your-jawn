summary: A Philadelphia arts group that uses public art and community projects to bring people, neighborhoods
  and causes together. It works through the year with students, neighbors and activists.
what_you_do: Take part in Peoplehood, the yearly community parade and pageant, through art builds, community
  sessions and rehearsals. You can also ask about volunteering, fill in an interest form to join the board
  or advisory council, or donate money or supplies.
