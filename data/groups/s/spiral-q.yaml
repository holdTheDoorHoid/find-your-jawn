first_step:
  how: Fill in the Peoplehood participation list form on Spiral Q's site, or email community@spiralq.org
    or call 215-222-6979 to ask how to take part.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Anyone can fill in the participation form, and the site invites neighbors, students and activists
    to take part. Open hours and regular events are not published, so timing depends on the project calendar.
  what_to_expect: Peoplehood starts with community conversations and creative meetings, moves to art builds
    where people make puppets, banners and screen prints, and ends with a parade and a pageant in a park.
    The process runs about six weeks. The site lists no cost to take part and asks for donations and supplies.
  first_visit_tips:
  - Fill in the participation list form, since individuals join the list before they take part.
  - Read the Art Build info document linked on the Peoplehood page for space, accessibility and parking
    details.
  - The parade starts at The Paul Robeson House, 4951 Walnut Street, and the pageant takes place in Clark
    Park.
