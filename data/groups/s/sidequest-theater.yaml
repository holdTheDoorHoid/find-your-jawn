first_step:
  how: Register for the free 90 minute Intro to Improv workshop through the link on the classes page,
    or ask the theater by email or phone about the next eight-week beginner class (Improv 1). Registration
    runs through linked sites.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The site labels a free 90 minute intro workshop as beginner friendly, says improv is for everyone,
    and lists a beginner eight-week class with a clear way to register.
  what_to_expect: 'Improv 1 is the beginner series: eight Thursday evenings from 7 to 9:30 pm, starting
    with the basics and ending with a short two person scene. Classes are for people 18 and up unless
    a class is marked for minors, and each series ends with a performance for friends and family. Each
    series costs $399, so the free intro workshop is a no-cost way to try improv first.'
  first_visit_tips:
  - Start with the free intro workshop if you are unsure, since the site labels it beginner friendly.
  - Buy show tickets ahead; only a limited number are sold at the door, and you can give your name at
    the box office with no printed ticket.
  - 'Parking: Park America (2027 Sansom St) and Patriot Parking (2102 Sansom St) are the closest lots,
    and street parking is not guaranteed.'
  - The theater is BYO, so you can bring your own drinks. Some shows are for adults only, so check the
    rating on the Shows page first.
