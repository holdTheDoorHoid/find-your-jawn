summary: Neighbors who garden side by side near 25th and Spruce, with about 70 plots, a shared flower
  border by the park, and some of the harvest given to local food programs.
what_you_do: Lease a plot for a year at a time, for up to six years, and grow plants of your choice. Gardeners
  attend three work days each season and help care for the shared flower border along the park.
