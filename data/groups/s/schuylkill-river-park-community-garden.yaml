first_step:
  how: If you live in the Center City Residents' Association area, email the garden at srpcg@srpcg.org
    with your name, address and phone to enter the March plot lottery. To meet gardeners first, volunteer
    at a seasonal work day.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Volunteers can join the seasonal work days and the steering committee meetings, and the garden
    gives a clear email route to a plot. Plots need residence in the Center City Residents' Association
    area, and most plots go to association members.
  what_to_expect: A first visit is usually a seasonal work day, which ran from 9 am to noon in 2026, where
    you help with shared areas and meet gardeners. The site lists new gardener orientation sessions in
    April. It does not list plot fees or dues, so ask the garden about costs before you apply.
  first_visit_tips:
  - Check that you live in the Center City Residents' Association area before you apply for a plot.
  - Work days in 2026 fell on Saturdays from 9 am to noon, so plan a morning.
  - The steering committee meets at the Markward Recreation Center, usually on the first Monday at 7 pm,
    and volunteers are welcome to attend.
  - Email srpcg@srpcg.org or call the voicemail line at 215-867-9435 before you come.
