summary: A Catholic parish at 20th and Locust Streets in Center City with Sunday, weekday and Saturday
  Masses, a chapel open daily for prayer, and a Thursday Holy Hour.
what_you_do: Pray in the chapel, which is open daily from 7 am to 9 pm, or come to Compline at 9 pm or
  the Thursday Holy Hour at 7 pm. The Archdiocese page lists no meals, pantries or groups.
