summary: A Catholic parish at 20th and Locust Streets in Center City with Sunday, weekday and Saturday
  Masses, a chapel open daily for prayer, and a Thursday Holy Hour.
what_you_do: Pray in the Lower Church chapel, which is open most of the day, or come to Night Prayer at
  9 pm. Thursday evenings bring a 7 pm Holy Hour with confessions. The parish page describes a young adult
  group for people in their 20s and 30s that meets Thursday evenings, with adoration and confession at
  7 pm and a faith discussion at 8 pm in the parish hall. Becoming Catholic (OCIA) meets Mondays from
  7 to 8:30 pm in the Parish Hall, and the parish lists pages for its ministry to the poor, pro-life work
  and liturgical ministries, though those pages give no details.
