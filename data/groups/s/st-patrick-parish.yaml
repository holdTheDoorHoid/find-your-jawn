first_step:
  how: Come to any listed Mass or sit in the chapel, then fill out the pre-registration form and return
    it to the office, or give it to a priest after Mass, if you want to join the parish.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The join page explains how a new person starts, with a pre-registration form and then a meeting
    with the parish, and Mass and the chapel need no sign-up; the linked flier's file name includes 2018,
    so confirm it is current.
  what_to_expect: Mass is free and open to anyone, so you can come and sit quietly. Masses are held in
    the Upper Church, and the Lower Church chapel is open most of the day for quiet prayer. If you want
    to join the parish, the next step after sending in the form is a short visit with the parish to get
    to know you.
  first_visit_tips:
  - Grab a bulletin and hymnal on the way in at the Upper Church.
  - The church is at 242 S. 20th St., at 20th and Locust.
  - Call (215) 735-9900 to ask for the current pre-registration form, since the linked flier's file name
    mentions 2018.
