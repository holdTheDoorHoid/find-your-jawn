summary: A Catholic parish at Williams Avenue and Vernon Road with Sunday Masses at 8 and 10 am and weekday
  Masses at 8 am. Its ministries include altar servers, readers, a Bethany welcome team, and outreach
  to people who are hungry or are refugees.
what_you_do: Come to Mass, join the Bethany welcome team or a life group, or sign up for a ministry such
  as altar serving, reading, or music. Outreach includes Feed The Hungry and Refugee Support.
