first_step:
  how: Come to the 10 am Sunday Mass, then call the rectory at 215-549-3760 to ask about a life group
    or the Bethany team, or use the parish volunteer form.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The site has an I'm New section, the Bethany team helps make weekend Mass welcoming, and the
    life groups page invites newcomers to join a group and says how to ask. The welcome and join pages
    did not open, so the rating rests on the pages that did.
  what_to_expect: Mass is free and open to anyone, with Sunday Masses at 8 and 10 am and a Saturday Mass
    at 5 pm. Life groups are small groups of about 5 to 12 people who read the coming Sunday's Scriptures
    together and get to know one another; they form a few times a year. The site does not say whether
    groups take drop-ins, so ask first.
  first_visit_tips:
  - Call the rectory at 215-549-3760 to ask about life groups and the Bethany team, since the site does
    not say whether groups take drop-ins.
  - Saturday confession runs 4 to 4:45 pm, and you can also book a time by appointment.
  - The site does not describe parking or wheelchair access, so ask before you come if you need those
    details.
