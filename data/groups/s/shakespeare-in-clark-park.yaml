first_step:
  how: Check shakespeareinclarkpark.org for the next season's dates, then come to an evening show at the
    Bowl in Clark Park.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Shows are free outdoor performances anyone can walk up to. The site does not describe seating,
    what a first visit is like, or a welcome for newcomers.
  what_to_expect: The 2026 Hamlet ran about 90 minutes with no intermission and started at 7 pm at the
    Bowl. The company describes picnic style audiences, but the site does not say whether seats are provided.
    If weather forces a move, that evening's show goes indoors at Plays & Players Theatre, and the company
    says the show goes on rain or shine.
  first_visit_tips:
  - If it rains, check whether the show has moved to Plays & Players Theatre at 1714 Delancey St that
    evening.
  - Bring something to sit on if you want it, since the site does not say whether seats are provided.
  - Find the Bowl near Chester Avenue and 43rd Street, which is where the shows are held.
