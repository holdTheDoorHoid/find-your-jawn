summary: A theater company that puts on Shakespeare plays outdoors in Clark Park each summer. Audiences
  come to the shows, and the company posts job openings for artists on its site.
what_you_do: Come to a free outdoor show in Clark Park. The company posts paid artist openings under Work
  with Us, and its site does not describe volunteer roles.
