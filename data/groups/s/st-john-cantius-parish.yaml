schedule:
  text: Sunday Masses at 8 am (quiet, with no organ music), 10 am (with organ music) and 11:30 am (in
    Polish). Saturday vigil at 4:30 pm. Weekday Mass at 8 am Monday to Friday, and at 8 am on Saturday
    in Polish. First Friday Mass at 7 pm in Polish. Confessions Saturdays 3:30 to 4:15 pm, before the
    vigil or by appointment. Eucharistic exposition Wednesdays 4 to 7 pm from October to June, with a
    Polish rosary at 6:30 pm.
