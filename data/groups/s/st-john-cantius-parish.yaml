  basis: Mass is open to anyone, and the parish lists a phone line and a ministries page that says to
    call to join. No newcomer program is described.
  what_to_expect: Mass is free to attend, and you can come and sit without signing up. The 8 am Sunday
    Mass is quiet with no organ music, and the 10 am Mass has organ music. The 11:30 am Mass is in Polish.
  first_visit_tips:
  - Call 215-535-6667 to confirm times, because a parish notice says some Mass times differ from the website.
