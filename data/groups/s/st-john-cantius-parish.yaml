summary: A Catholic parish with Sunday Masses at 8, 10 and 11:30 am, some Masses said in Polish, and a
  Saturday evening vigil.
what_you_do: Come to Mass, and ask which Masses are in Polish. The parish lists about 17 ministries and
  groups, including greeters, ushers, lectors, altar servers, a boys' Scout troop on Tuesday evenings
  at 7 pm, senior groups, and Aid for Friends, which cooks and delivers meals for homebound and older
  neighbors. For children and adults preparing for the sacraments, call the parish office at 215-535-6667.
