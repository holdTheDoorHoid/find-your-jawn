first_step:
  how: For Short Shots (ages 2 to 6), register through the registration link on the Short Shots page.
    For Playmakers, RSVP for an application day or open house through the link on the site.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The Playmakers page says all skill levels are welcome, and each program has a sign-up link on
    the site.
  what_to_expect: Short Shots is a 60-minute class once a week for six weeks, held on Saturdays from 11
    am to noon. Each class is an hour of active play, skill building and games for children ages 2 to
    6. The site does not name the class location or say whether parents may stay, so ask when you register.
  first_visit_tips:
  - Register through the Short Shots link before you come, since sign-up is needed.
  - Ask where the class meets when you register, because the site does not name the field.
  - Ask about financial help when you register if cost is a concern.
  - For Playmakers, the fall application days and open houses are listed without a year, so confirm the
    current dates when you RSVP.
