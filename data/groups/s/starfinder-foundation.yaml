summary: A Philadelphia soccer nonprofit with Short Shots for children ages 2 to 6, the Playmakers leadership
  program for students in grades 9 to 12, school and camp programs, leagues and tournaments.
what_you_do: Families sign children up for Short Shots through the registration link on the site. Students
  in grades 9 to 12 apply to Playmakers at application days or open houses. The foundation also hires
  coaches for after-school and evening programs.
