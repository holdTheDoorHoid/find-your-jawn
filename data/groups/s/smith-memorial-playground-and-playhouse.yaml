schedule:
  text: 'Closed Mondays. April to September: Tuesday to Friday 10 am to 6 pm, Saturday and Sunday 10 am
    to 7 pm. October to March: Tuesday to Sunday 10 am to 5 pm. The playground closes at dusk in fall
    and winter, and hours depend on the weather. The site sometimes closes for private events or maintenance,
    so check the website before you go.'
