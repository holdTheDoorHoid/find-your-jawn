first_step:
  how: Visit during open hours, with no sign up needed for a daily visit. To volunteer, email Jim Neal,
    Director of Facilities & Operations, at jim@smithplayground.org or call 215.765.4325 extension 101,
    since he takes all volunteer questions.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: Daily visits are free and open to the public, and volunteer questions go to one named staff contact.
    The site does not describe a newcomer program or a first-visit routine.
  what_to_expect: A daily visit is free and is made for children, and children must always be with an
    adult. The playground covers about six and a half acres with climbing, swinging and spinning zones,
    and the Playhouse has three floors of interactive play. Groups of 10 or more children need to book
    ahead.
  first_visit_tips:
  - 'Check the hours first: the site is closed on Mondays, and the playground closes at dusk in fall and
    winter.'
  - Park in the free lot in front of the Playhouse, or on Reservoir Drive when the lot is full, and do
    not leave valuables in the car.
  - Bring your own food if you want it, since options within walking distance are very limited. Grilling
    and BBQing are not allowed.
  - The site is designed mainly for children 10 and under, and a grown-up must supervise every child.
