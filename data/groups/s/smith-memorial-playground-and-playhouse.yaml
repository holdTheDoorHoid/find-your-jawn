  notes: Service animals are welcome under ADA guidelines, but other animals are not allowed. Bus 32 stops
    at 33rd and Oxford Streets, then about a third of a mile on foot. Bus 3 stops at 33rd and Cecil B.
    Moore Streets, then one block south and about a third of a mile on foot; on weekends during visiting
    hours it runs directly to Smith.
