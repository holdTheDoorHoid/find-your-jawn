summary: A free play space in East Fairmount Park with a giant wooden slide, an indoor playhouse, and
  a nature play area. Volunteers have helped with planting, weeding, mulching, story time, crafts, and
  the yearly appeal mailing.
what_you_do: Help with grounds work, support story time or crafts for families, or help with the yearly
  appeal mailing. You can also suggest a volunteer project to staff.
