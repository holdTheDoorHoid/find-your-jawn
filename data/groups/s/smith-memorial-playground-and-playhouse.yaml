cost:
  level: free
  text: Daily visits are free. Group visits cost $25 for 11 to 25 children, $50 for 26 to 50, $75 for
    51 to 75, and $100 for 76 to 100. Groups of 10 or more children need an advance reservation, and group
    visits run on weekdays, 10 am to 12 pm or 1 pm to 3 pm.
