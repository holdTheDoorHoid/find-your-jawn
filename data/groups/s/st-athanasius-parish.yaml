summary: A Catholic parish at Limekiln Pike and Walnut Lane that shares Sunday worship with St. Benedict
  Church. It offers Eucharistic adoration on Tuesdays, an online faith formation library that the parish
  pays for, and a food pantry listed under the St. Benedict name.
what_you_do: 'Come to Mass: Saturday at 4 pm, Sunday at 8 am at St. Benedict Church or at 10 am here.
  Join the Wednesday Bible study or the Thursday Legion of Mary, both on Zoom at 7 pm. Use the St. Benedict
  food pantry on Monday or Friday from 10 to 11:30 am. Sign up for the FORMED library, which the parish
  pays for.'
