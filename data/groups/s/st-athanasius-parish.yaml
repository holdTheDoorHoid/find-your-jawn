schedule:
  text: Saturday vigil Mass at 4 pm. Sunday Masses at 8 am (St. Benedict Church) and 10 am (St. Athanasius).
    Weekday Mass Monday to Friday at 9 am, livestreamed on YouTube. Adoration on Tuesdays from 9 am to
    6:30 pm. Food pantry on Mondays and Fridays from 10 to 11:30 am at St. Benedict Church. Bible study
    on Wednesdays and Legion of Mary on Thursdays, both at 7 pm on Zoom. St. Vincent Society meets twice
    a month on Sundays at noon.
