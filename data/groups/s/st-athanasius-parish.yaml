first_step:
  how: Come to the 10 am Sunday Mass at St. Athanasius, then call the rectory at 215-548-2700 (weekdays
    9 am to 4 pm) to ask about ministries or parish updates.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: The site gives a rectory line with weekday hours, a way to get parish updates and a ministries
    page, and it lists the food pantry and adult groups. It does not describe a welcome program for newcomers.
  what_to_expect: Sunday Mass is free and open to the public, at 8 am at St. Benedict Church or 10 am
    at St. Athanasius. The site does not say how long Mass lasts or what happens afterward, so a call
    to the rectory before your first visit helps. If you come to the food pantry on a Monday or Friday,
    you sign in, fill out a short self-declaration form, and receive a card for later visits.
  first_visit_tips:
  - Arrive early for the food pantry, since the page says some items may be limited.
  - The pantry does not deliver, so plan to come in person between 10 and 11:30 am on a Monday or Friday.
  - Sign up for the FORMED library with your name and email; the parish covers the cost.
