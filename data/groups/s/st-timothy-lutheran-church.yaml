first_step:
  how: Come to the 9:15 am Sunday service, stay for coffee hour, and ask to meet the pastor or a member.
    You can also call the office on a Tuesday or Thursday morning.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The site has an I'm New page that invites newcomers to come to a service, talk with members at
    coffee hour, or call the office. It does not describe a welcome class.
  what_to_expect: The service runs one hour, from 9:15 am to 10:15 am, and includes Holy Communion, music,
    and a short message for children told as a story by the pastor. Afterward, a coffee hour with bakery
    treats gives you a chance to talk with members. The site does not mention dues or fees.
  first_visit_tips:
  - Park in the large lot across from the Fillmore Street entrance.
  - Dress however you feel comfortable; the site says plenty of people wear business casual, jeans or
    team hoodies, and that showing up matters most.
  - Stay for coffee hour to meet people.
  - Call the office on a Tuesday or Thursday between 9 am and noon if you have questions first.
