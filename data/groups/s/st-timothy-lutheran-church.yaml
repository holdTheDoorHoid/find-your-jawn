summary: A Lutheran congregation on Fillmore Street in Fox Chase with a Sunday 9:15 am service that includes
  Holy Communion. Its site has a section for newcomers.
what_you_do: Attend the Sunday 9:15 am service and stay for coffee hour, read the newcomer page, or stop
  by the office on a Tuesday or Thursday morning. Members also serve through ministries such as a monthly
  free community lunch (Hope's Table) and a group that cooks meals for homebound neighbors.
