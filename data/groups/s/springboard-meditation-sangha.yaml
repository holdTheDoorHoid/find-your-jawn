first_step:
  how: Join a free online session through the Zoom link on the group's schedule page, or email info@springboardsangha.org
    about the beginner orientation class.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 5
  basis: A beginner orientation class exists (it runs once five people register), and the free online
    sessions are open to the public.
  what_to_expect: The online schedule lists meditation sits and discussion or study groups, all free and
    open to the public. The pages we read do not say how long each session runs, so check the schedule
    page before you join.
  first_visit_tips:
  - Ask by email about the beginner orientation class before you come, since it runs only when enough
    people sign up.
  - 'For an in-person gathering, email first: the listings give dates and places but not parking, access
    or what to bring.'
