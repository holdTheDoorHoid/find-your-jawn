first_step:
  how: Come to any Sunday Mass, including the Saturday 4 pm vigil, then meet with the parish after Mass
    to register.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The FAQ says staff meet people after any Sunday Mass to register, and Mass is open to anyone;
    no newcomer program is described.
  what_to_expect: Registration is a meeting with the parish after Mass, which is how new parishioners
    start. The site does not describe a typical Sunday visit, how long Mass runs, or what to wear. Children
    must be registered before the first day of religious education class, and the site says children are
    not registered on the first day.
  first_visit_tips:
  - The rectory is open Monday to Thursday, 9 am to 4 pm, and Friday, 9 am to 1 pm. It is closed on weekends;
    the FAQ says Saturdays are by appointment, which the footer does not match.
  - Register children for PREP before the first class, since the site says no child is registered on the
    first day.
