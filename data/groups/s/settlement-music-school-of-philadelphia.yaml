first_step:
  how: Fill out the inquiry form on the site or call 215-320-2601. A branch staff member will set a phone
    or video appointment, then a registration appointment to recommend a class and sign you up.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The adult page says the school welcomes all ages and skill levels, from beginners up, and the
    enrollment page lays out a clear way to start.
  what_to_expect: You start with a phone or video call with a branch staff member about your interests
    and goals. At a registration appointment, staff suggest a class, teacher, or program, and you pay
    the registration fee and first payment to enroll. Group classes are paid as a deposit and installments
    through the school year.
  first_visit_tips:
  - Think about your goals and the instrument or style you want before the first call.
  - 'Have a payment method ready: the school takes cash, check, Visa, MasterCard, and debit cards.'
  - Check the hours for the branch you choose, since each branch keeps its own schedule.
