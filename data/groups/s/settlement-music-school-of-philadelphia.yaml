cost:
  level: paid
  text: Tuition is charged. Adult classes are listed at $330 for 10 weeks (intro piano and guitar), $630
    for 16 weeks (group piano), and $265 for 10 weeks (musicianship). Individual lessons are $45 for a
    half hour, $67.50 for 45 minutes, or $90 for an hour, each week. The registration fee is $65 for one
    person or $95 for a family, and it is not refundable.
