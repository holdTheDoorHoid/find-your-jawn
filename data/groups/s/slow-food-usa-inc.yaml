first_step:
  how: Buy a ticket from an event listing, or join as a member for $60 a year through the join page. Questions
    go through the contact form on the Contact Us page, since no email address is published.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Events are public and ticketed, and the join page is open to anyone. The site does not say that
    beginners are specifically welcome.
  what_to_expect: Chapter dinners are social evenings for members and friends, with a set menu and a limited
    number of seats. The banquet listing says the meal is gluten free, that guests bring their own drinks,
    and that allergies cannot be accommodated. The listing does not say how the meal is served, so ask
    the chapter before you buy if that matters to you.
  first_visit_tips:
  - If a listing says BYOB, bring your own drinks.
  - Tell the chapter about any food allergy before you buy, because the banquet listing says allergies
    cannot be accommodated.
  - The event listing does not give the venue address, so ask through the contact form before the night.
