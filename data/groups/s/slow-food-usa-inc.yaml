summary: The Philadelphia chapter of the Slow Food movement. It runs social and learning dinners and gives
  a Snail of Approval award to local food businesses that meet its standards for good, clean, and fair
  food.
what_you_do: Buy a ticket to a chapter dinner or workshop, or join as a member for $60 a year to get discounts
  on some events and early notice of new ones. Volunteers can help through partner programs, such as Sunday
  Suppers, Greensgrow Farm (which asks new volunteers to attend an orientation first), or a hoop house
  project that grows food for seniors' meals.
