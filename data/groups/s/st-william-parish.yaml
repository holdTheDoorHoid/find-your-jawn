first_step:
  how: Choose the Mass in the language you prefer, such as the 9 am Spanish Mass, the 2 pm Pakistani-Urdu
    Mass or the 5 pm Haitian Creole Mass, or call the rectory at 215-745-1389 to ask which one fits.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Every Mass is open to the public and the rectory phone is published. No group is described as
    open to newcomers, and the ministries list no meeting times.
  what_to_expect: Mass is free and open to anyone, and the times are grouped by language, so check the
    list for the one you want. Most Masses are in the lower church, while the 12:30 pm and 8 pm Masses
    (October to May) and the 5 pm Creole Mass are in the upper church. The listing does not say how long
    Mass lasts or what happens afterward.
  first_visit_tips:
  - A few Mass times do not name a language, so call the rectory if you are unsure which one to attend.
  - Confession is on Saturdays at 4 pm if you want to speak with a priest before Mass.
  - Check which level of the church your Mass is in, since most are in the lower church.
