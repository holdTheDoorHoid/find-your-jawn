summary: A Catholic parish on Rising Sun Avenue in the Northeast with Masses in Spanish, Pakistani-Urdu
  and Creole, and weekday Masses at 6:30 am and noon.
what_you_do: Come to Mass in the language you prefer. The archdiocese listing names a religious education
  coordinator, a Hispanic ministry priest and a Haitian apostolate chaplain, but gives no group meeting
  times.
