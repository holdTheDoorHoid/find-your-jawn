schedule:
  text: Sunday Masses at 7:30 am, 9 am and 10:30 am in Spanish, at 12:30 pm (October to May), at 2 pm
    in Pakistani-Urdu, at 5 pm in Haitian Creole, and at 8 pm (October to May). Weekday Mass at 6:30 am
    and noon. Saturday Mass at 8 am and vigil at 5 pm. Confession Saturdays at 4 pm and on Thursdays before
    First Fridays from 12:30 to 1 pm.
