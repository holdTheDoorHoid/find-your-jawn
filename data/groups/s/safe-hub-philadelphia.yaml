first_step:
  how: Register a child for EduSoccer through the online registration link on the programs page, which
    is open for fall. Teens ages 14 to 18 who want PlayMaker can contact Andalyn Young at andalyn.young@safe-hub.org,
    since PlayMaker requires an application and an interview.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Open to the public, with an online registration for EduSoccer for ages 4 to 18. The site does
    not show the cost, the session times or whether teams have spots left.
  what_to_expect: EduSoccer teams train twice a week and mix soccer with lessons on respect, teamwork,
    handling emotions and perseverance. Ages 4 to 7 can join FUNdamentals for kids new to soccer, and
    ages 8 to 18 choose Recreational or Footskills FC. Coach roles require attending coach training. The
    site does not show session times, locations or fees, so ask before you register.
  first_visit_tips:
  - 'Pick the level that fits your child: FUNdamentals for ages 4 to 7, Recreational for newer players
    ages 8 to 18, or Footskills FC for players with experience.'
  - Call 610-233-7368 for session times and the campus address, since the site does not publish them.
  - The campus is an indoor soccer field beside Scanlon Playground in Kensington.
  - PlayMaker is for ages 14 to 18 and needs an application and an interview.
