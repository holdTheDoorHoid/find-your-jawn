summary: Soccer and life skills for young people in Kensington and Harrowgate. EduSoccer teams for ages
  4 to 18 and the PlayMaker program for high school students help kids build teamwork and career skills.
what_you_do: Young people train with EduSoccer teams twice a week and build life skills along the way.
  High school students can apply to PlayMaker, which includes a stipend. The Collective Impact program
  connects families to housing and utility help, food distribution and mental health support.
