first_step:
  how: 'Athletes: create an athlete profile on the state portal and finish the health screening. Volunteers:
    start through the volunteer opportunities page and come to the monthly info call first.'
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Athletes and volunteers both have a clear way in, including a no-pressure monthly info call,
    but the site describes no beginner day, and athletes need a formal identification of eligibility first.
  what_to_expect: Staff hold a monthly online info call on the fourth Wednesday, 6:30 to 7:30 pm, to answer
    questions about volunteer roles. Event volunteers help at one-day or multi-day competitions with scorekeeping,
    awards, and setup or cleanup, for about 2 to 8 hours on event day only. Athletes register on the state
    portal, complete a short health screening, and train at no cost.
  first_visit_tips:
  - Join the monthly info call first; it is a question session, not a sign up.
  - Athletes need a formal identification of eligibility from an agency or professional before they register.
  - Every volunteer needs volunteer registration; local program and some coaching roles also need training
    and a background check.
  - Call 610-630-9450 or use the contact page; the state team says it replies within two business days.
