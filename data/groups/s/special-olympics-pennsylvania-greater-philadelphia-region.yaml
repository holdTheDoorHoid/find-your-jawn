summary: The Pennsylvania Special Olympics program covers Philadelphia and four nearby counties. It runs
  year-round sports for athletes with intellectual disabilities, plus free health screenings through its
  Healthy Athletes program.
what_you_do: Train and compete as an athlete, or volunteer in one of many roles, from coaching to event
  help. Unified partners play on teams alongside athletes.
