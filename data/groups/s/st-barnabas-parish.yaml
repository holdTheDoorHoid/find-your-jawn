summary: A Catholic parish on Buist Avenue in Southwest Philadelphia with Masses in English and a Spanish
  Mass on Sundays. It also runs religious education and links to a parish school, St. Barnabas Independence
  Mission School.
what_you_do: Come to a weekend Mass, including the Spanish Mass on Sunday at noon. Families can ask about
  religious education, and the site links to the parish school.
