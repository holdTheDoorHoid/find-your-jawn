first_step:
  how: Watch a film or listen to the Domino Dialogues podcast, or share a story through the La Historia
    Colectiva form, which asks for a written memory and an optional photo or video. Questions go to info@somossociety.org.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: The films, podcast and archive are open to the public, and the site gives two clear ways to take
    part. It does not describe a newcomer program or a first-visit routine.
  what_to_expect: 'A first visit is mostly online: you can watch the films, listen to the Domino Dialogues
    podcast, and browse the archive. To take part, you can submit a story, which the team reviews before
    it is posted, or open the Join the Conversation page. The site does not list office hours, so email
    first if you plan to stop by.'
  first_visit_tips:
  - 'Read the release terms before you send a story: the team may edit it, and your name may be published
    unless you ask to stay anonymous.'
  - Use the newsletter sign-up on the home page to hear about new films and conversations.
