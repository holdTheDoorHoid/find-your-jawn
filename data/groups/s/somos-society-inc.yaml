summary: A Philadelphia nonprofit that collects and shares the stories of the city's Puerto Rican community
  through films and recorded conversations. Anyone can watch, listen, or add a story of their own.
what_you_do: Watch its documentary films, listen to the Domino Dialogues podcast, or share a personal
  story for the community collection. Groups can also request a screening of one of its documentaries.
