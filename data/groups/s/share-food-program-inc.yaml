summary: The farm of SHARE Food Program, which grows fresh fruit and vegetables for donation to the community,
  to SHARE-affiliated pantries, and to mutual aid networks. Volunteers can sign up on the program's page.
what_you_do: Join a Community Farming Day from May through December to prep beds, plant and seed, weed
  and water, mulch, harvest, and clean up the grounds. Food rescues are also claimed in the Philly Food
  Rescue app.
