    have them.
first_step:
  how: Click the Volunteer to Help button on the farm's page to sign up for a Community Farming Day. Food
    rescues are claimed separately in the Philly Food Rescue app.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Anyone of any age can sign up through a clear button, and the page lists the tasks and what to
    bring. It does not say whether beginners are welcome or how a first day runs.
  what_to_expect: A Community Farming Day is fully outdoors, so the weather matters, and the page advises
    checking the forecast the day before. The farm manager, Ellie Kaplan, runs the farm year-round with
    help from others. The page does not give a start time or how long a day lasts.
  first_visit_tips:
  - Wear closed-toe shoes or boots and clothes you do not mind getting dirty.
  - Check the forecast the day before and dress in layers, since the work is outdoors.
  - Bring sun protection, and take care if you are bothered by mosquitoes or stings.
  - For food rescues, you need a cell phone and must be able to lift at least 30 pounds, or bring a friend.
