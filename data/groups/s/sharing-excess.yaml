summary: A food rescue nonprofit that collects surplus food from businesses and passes it on to communities
  in need. It is rooted in Philadelphia and now works in many states.
what_you_do: Volunteer on food rescue pickups, produce sorting at produce markets, pop-up food distribution
  events, or Sharehouse Saturdays at the West Philly Sharehouse. You can also donate money or food, or,
  if you run a community group, request food through the Find Food page.
