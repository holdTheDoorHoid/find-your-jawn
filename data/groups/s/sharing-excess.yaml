first_step:
  how: On the Volunteer page, click Sign Up to Volunteer, then choose an opening such as Sharehouse Saturdays
    or Food Rescue. Each opening has its own Sign Up button.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Sign up is open to the public through the Volunteer page and several roles are listed, but the
    page does not say first timers are welcome and does not give shift times.
  what_to_expect: Most roles are hands on. Food Rescue drivers pick up donated food from stores and restaurants
    with their own vehicle, guided by a mobile app. Sharehouse Saturdays are weekend shifts packing home
    deliveries, moving pallets and loading partner pickups at the West Philly Sharehouse. The volunteer
    page does not say how long a shift lasts, and volunteering is free.
  first_visit_tips:
  - Food Rescue asks volunteers to have their own vehicle.
  - Pick the opening you want first, since each one has its own Sign Up button.
  - Apart from weekend Sharehouse Saturdays, the page lists no shift times, so ask which shifts are open
    before you plan a trip.
