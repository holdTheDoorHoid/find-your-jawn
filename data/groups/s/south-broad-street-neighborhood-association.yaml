  how: Fill in the join form on sbsna.org (name, address and email), then watch for the next meeting post
    and register through its Zoom link if the meeting is online.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Meetings are open, and the site has a clear join form and an email list. Meeting dates are posted
    only a few days ahead, and zoning meetings need a Zoom registration.
  what_to_expect: Meetings usually start at 7 pm and cover zoning and building plans for the area. Zoning
    meetings are held on Zoom, and the site asks attendees to register through the link on the meeting
    post. The site does not say how long meetings run or what they cost, and it lists no dues.
  first_visit_tips:
  - Check the site a few days before, since some months have no meeting.
  - Register through the Zoom link on the meeting post if you plan to join online.
