summary: A nonprofit printmaking studio in Philadelphia that teaches hand printing methods, from stone
  lithography to screen printing, and lets artist members rent studio time. It also holds exhibitions
  and Second Thursday events.
what_you_do: Take an intro or beginner printmaking class, become an artist member and use the studio,
  or come to the exhibitions and Second Thursday events.
