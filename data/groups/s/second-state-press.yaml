first_step:
  how: Register for an intro class from the printmaking classes page, such as Intro to Riso Printing (listed
    for Oct 11, 2026).
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: Many classes are tagged beginner-friendly or labeled intro, and each class has its own page with
    a link to sign up.
  what_to_expect: Intro classes are short, usually a single session of about 2.5 to 5 hours, and teach
    the basics of one method such as riso, screen printing, lino or letterpress. The class list does not
    show prices, so check each class page before you sign up. The studio is in the Crane Arts Building,
    and the site gives no parking or transit details.
  first_visit_tips:
  - Riso printing on your own needs an Intro to Riso class or relevant riso experience, so take that class
    first.
  - The studio is self-guided and members are expected to know their own process, so an intro class helps
    before you rent studio time alone.
  - Several earlier listings are marked sold out, so check the class page for open spots before you travel.
  - Parking and transit are not on the site, so check directions to the Crane Arts Building before you
    go.
