first_step:
  how: Come to the fourth Tuesday meeting at the Southside Church Center, 5058 Wayne Ave, and join the
    group's Google Group for updates before you go.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The group's home page says all are welcome at its monthly meeting and names the day and place
    to start, with a Google Group for updates.
  what_to_expect: Expect a monthly meeting that the group's site says anyone can attend. The site covers
    zoning, business on Wayne Avenue, and the 39th Police District, so those are good topics to ask about.
    The site lists no dues or sign-up for the meeting.
  first_visit_tips:
  - Use the Manheim Street entrance, which the group's site names.
  - Join the Google Group before you come, since an older City listing says in-person meetings were suspended.
  - Use the contact page on the group's site to reach the organizer with questions.
