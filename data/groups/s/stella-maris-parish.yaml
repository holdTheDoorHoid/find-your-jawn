  basis: Mass is open to anyone and the rectory phone is published. No newcomer program is described on
    the archdiocese listing, and the parish's own site could not be opened.
  what_to_expect: Mass is free and open to anyone. Sunday Masses are at 8 am and 10:30 am, with a Saturday
    vigil at 5 pm and weekday Masses at 8 am from Tuesday to Saturday. The listing names parish staff
    but no groups, so calling the rectory is the best way to ask about getting involved.
  first_visit_tips:
  - The church is on the southeast corner of 10th and Bigler Streets.
  - Confession is on Saturdays from 4 to 4:45 pm if you want to speak with a priest.
  - Call the rectory with access questions, since the listing does not cover parking.
