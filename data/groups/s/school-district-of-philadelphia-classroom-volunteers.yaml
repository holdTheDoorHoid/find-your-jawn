first_step:
  how: Ask the school whether it needs volunteers, then start the free clearances and sign up for the
    district's volunteer orientation.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Volunteers must finish clearances, an orientation and a principal's sign-off before they start,
    so you see the classroom only after the paperwork.
  what_to_expect: 'Most of the first stretch is paperwork: the child abuse history clearance, the state
    criminal history check, and either an FBI check with fingerprints or a signed affirmation if you have
    lived in Pennsylvania for 10 years. Next comes the orientation, either an online webinar of about
    45 minutes with a short quiz or an in person session led by a family engagement liaison. The page
    does not say how often volunteers come or how long they stay.'
  first_visit_tips:
  - Check with the school first, because each school decides whether it needs volunteers.
  - Start the child abuse history clearance early, since the page says results can take up to 14 days.
  - Finish the orientation within 45 days of starting, and hand the signed code of conduct to the principal.
  - If you have not lived in Pennsylvania for the past 10 years, pre-enroll with IdentoGo before your
    fingerprint appointment.
