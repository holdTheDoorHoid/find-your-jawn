  newcomer_friendliness: 3
  basis: Anyone can send in the public volunteer form, but the page does not mention a first-time orientation
    or training.
  what_to_expect: Trail sessions last at least three hours and usually run 10 am to 4 pm on weekdays or
    10 am to 1 pm on weekends. The work can include picking up litter, removing graffiti, pulling invasive
    plants, planting, and spreading mulch or gravel. Event help covers setup, checking people in, carrying
    kayaks to and from the water, handing out refreshments and cleanup.
  first_visit_tips:
  - Plan for at least three hours, and check the weekday or weekend hours before you go.
  - Groups of up to 12 can volunteer together, so contact the group first to set up a group day.
  - If you need a different day, ask, since the page says scheduling can be flexible.
  - The email address sits behind a protected link, so use the contact page or call 215-309-5523.
