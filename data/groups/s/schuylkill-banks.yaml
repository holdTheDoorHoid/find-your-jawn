summary: The group that cares for the southern eight miles of the Schuylkill River trail, from Fairmount
  Dam to the Delaware River. It runs public events on the trail and the water, and volunteers help keep
  the trail clean and green and help run those events.
what_you_do: Volunteer on trail care, such as picking up litter, pulling invasive plants, planting and
  spreading mulch, or help with events like kayak tours and movie nights. You can also come to a public
  event.
