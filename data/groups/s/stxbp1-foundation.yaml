summary: A nonprofit started by parents to raise awareness, fund research and work toward a cure for STXBP1-related
  disorder. It gives families information, resources and a contact list.
what_you_do: Parents can join the Contact List and other relatives can join the Mail List. Everyone can
  use the family resources and newly diagnosed pages, and volunteer in roles such as events, fundraising,
  outreach and social media.
