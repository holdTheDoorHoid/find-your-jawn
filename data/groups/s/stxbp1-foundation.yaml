first_step:
  how: 'Parents and primary caregivers: register on the Contact List at stxbp1disorders.org/contact-list.
    Other relatives and community members: join the Mail List instead (grandparents can join the Grands
    Society). To volunteer, fill in the volunteer form or email info@stxbp1disorders.org with the subject
    Volunteer.'
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Parents and caregivers can join a public Contact List, and the volunteer page invites people
    to sign up by form or email. The page does not state time commitments or any requirements for volunteers.
  what_to_expect: The Contact List is a form, and the page says the information is used to share research,
    trial and resource news and to help families connect. The foundation's 2026 family summit ran July
    16 to 19 in Philadelphia, with a family meeting July 17 to 19. Volunteers can choose from ten roles,
    including events, fundraising, graphic design, grant writing, social media and outreach to families.
  first_visit_tips:
  - Use the Contact List only if you are a parent or primary caregiver; other relatives should use the
    Mail List.
  - If the volunteer form does not work, email info@stxbp1disorders.org with the subject Volunteer.
