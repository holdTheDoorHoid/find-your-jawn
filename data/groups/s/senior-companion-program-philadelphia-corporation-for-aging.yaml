name: Senior Companion Program (Philadelphia Corporation for Aging)
aka:
- Senior Companion Program
leads: []
ein: null
summary: Volunteers aged 55 and up who visit older adults living at home who are lonely, isolated or have
  health or sight challenges, offering friendship, steady company and some practical help.
what_you_do: Visit one older adult at home on a regular schedule, keep them company, and help with small
  tasks such as sorting mail, light meals or getting to medical appointments. You complete a background
  check and paid training first.
