  newcomer_friendliness: 2
  basis: You apply, meet an income guideline and pass a criminal background check before service, and
    the site does not say what a first visit looks like.
  what_to_expect: The site does not describe the first visit. Before you serve, you complete a criminal
    background check and paid pre-service training, though the site does not say which comes first. After
    that you get four hours of ongoing training each month while you serve about 20 hours a week.
  first_visit_tips:
  - Check that you can give about 20 hours a week before you apply, because the application asks about
    it.
  - 'Be ready to say how you get around: the application asks about your own car, SEPTA or CCT Connect.'
  - Ask when the background check and paid training start, since the site does not say which comes first.
