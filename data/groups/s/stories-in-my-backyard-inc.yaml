first_step:
  how: Follow the group on Instagram or open its Linktree to find the next exhibit or workshop and RSVP.
    To volunteer or offer a skill, send an inquiry through the Contact Us form on the Take Action page.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Public exhibits and events are posted openly, and the Take Action page lists volunteer roles
    with a contact form. Youth program seats are for students at partner schools, and the site does not
    describe a newcomer program.
  what_to_expect: A first visit is usually a public photo exhibit, which may be outdoors, at a pop-up,
    or online. Some pieces use virtual reality headsets that you can only try in person. Some events are
    free and others ask for a small donation, and some have required an RSVP.
  first_visit_tips:
  - Check the group's Linktree for RSVPs before you go, since some events have required one.
  - Outdoor events go ahead rain or shine, so dress for the weather.
  - Plan to visit the exhibit itself if you want to try the virtual reality headsets.
