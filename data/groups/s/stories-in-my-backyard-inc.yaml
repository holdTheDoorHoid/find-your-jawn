summary: A Philadelphia media arts group that teaches photography, film and virtual reality to Black youth,
  with Black instructors. It also stages public photo exhibits about Philadelphia's Black music history.
what_you_do: Students in the Exposure photography program, which is open to students at predominantly
  Black middle and high schools, learn photography in a blended format. The group also welcomes teaching
  artists, subject matter experts and other volunteers through its Take Action page, and visitors can
  see its outdoor and pop-up exhibits.
