summary: An Episcopal parish in Chestnut Hill with three Sunday services and choirs of almost 80 singers
  across adults and children. It also runs a youth program and a monthly collection for local partner
  agencies.
what_you_do: Sit in on a Sunday service, ask about the choirs or the youth program (S.P.Y.), or bring
  an item to the monthly collection for a partner agency.
