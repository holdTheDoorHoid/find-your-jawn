first_step:
  how: Come to a Sunday service and pick up a visitor card at the registration table in the narthex, or
    call 215-242-2055 to ask about the choirs or the youth program.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The site says all are welcome, encourages visitors to try more than one service, and has visitor
    cards at the narthex table. The choir page also lists steps for getting started. It has no formal
    newcomer class.
  what_to_expect: Services are open to anyone of any age, and the site suggests trying a few to find the
    one that suits you. The 8 am service is quiet and spoken, with no hymns. The 9 am service is informal
    and aimed at families, and the 11 am service has hymns, choral anthems and a sermon. Coffee hour follows
    the 11 am service in Dixon House, and from September to May a Sunday breakfast runs from 8:30 to 9:30
    am in the Parish Hall for a small donation.
  first_visit_tips:
  - Pick up a visitor card at the registration table in the narthex.
  - Parking is in the driveway lot, the stone lot behind Dixon House, or on the street along Bethlehem
    Pike and Chestnut Hill Avenue.
  - Stay for coffee hour in Dixon House after the 11 am service.
  - Call 215-242-2055 with questions about accessibility, since the site does not describe it.
