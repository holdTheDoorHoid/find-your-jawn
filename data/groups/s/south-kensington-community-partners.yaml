first_step:
  how: Email info@southkensingtoncommunity.org to volunteer or to ask about joining one of the five neighbor-led
    committees, then subscribe to the weekly email newsletter for events.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The site invites any neighbor to join a committee or to volunteer by email, and says you can
    stop by the office on weekdays. No page uses the word newcomer or beginner.
  what_to_expect: The site does not post committee meeting times, so an email is the best first step.
    The office keeps weekday hours of 9 am to 5 pm. The committees cover business outreach, fundraising,
    greening, a neighborhood advisory subcommittee, and planning and zoning. The site does not mention
    a fee to take part.
  first_visit_tips:
  - Email first, because no meeting dates or times are posted on the site.
  - On a weekday between 9 am and 5 pm you can stop by the office at 1525 N American Street, Studio 107.
  - Ask which committee needs help right now and when it next meets.
  - Sign up for the weekly newsletter to hear about events before you come.
