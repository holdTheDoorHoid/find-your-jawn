summary: A United Methodist church on Bustleton Avenue with a weekly Tuesday food bank, a volunteer choir
  that welcomes new singers, and space for community recovery groups.
what_you_do: Drop off non-perishable food at the church before or after services. To volunteer at the
  food bank or ask about getting help, use the Somerton Foodbank website, which the church names. You
  can also join the volunteer choir, which has no auditions, or ask the church office about groups and
  ministries.
