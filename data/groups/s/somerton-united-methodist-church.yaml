first_step:
  how: Come to Sunday worship at 10:45 am, or call the church office at 215-673-2745 to ask about joining
    the choir.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The site says visitors are warmly invited whether they are lifelong Methodists or new to faith,
    and the choir needs no audition and takes singers of any experience. The church office is named as
    the place to ask.
  what_to_expect: Sunday worship starts at 10:45 am, and children stay in the regular service with some
    moments made just for them. The pages read do not describe what happens after the service or a first-visit
    routine. The church office is the best place to ask about the choir, volunteering or recovery groups.
  first_visit_tips:
  - Bring a non-perishable food donation if you want, and drop it off before or after the service.
  - From I-95 south, the directions end with about 2 miles south on Bustleton Avenue, with the church
    on your right.
  - For a choir visit, call the office first, since rehearsal days and times are not published on the
    site.
