first_step:
  how: Sign up on the Join Now page with your first name, last name and email, then watch the calendar
    for the next online briefing.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The join form and the public calendar are open to anyone, but the site does not describe a volunteer
    orientation or a welcome for new members.
  what_to_expect: Briefings on the calendar usually run about an hour to an hour and a half, often on
    a Saturday afternoon, and many are held online in Khmer. The join form asks only for a name and an
    email address, and no fee is listed. The site does not describe any volunteer training.
  first_visit_tips:
  - Check the language on each calendar entry, since many briefings are in Khmer.
  - Look for the YouTube link on the event listing, since some briefings stream live there.
  - Most in-person events on the calendar were held out of state or abroad, so online is the usual way
    to take part.
