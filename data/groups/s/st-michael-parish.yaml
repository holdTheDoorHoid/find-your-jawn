summary: A Catholic parish at 2nd and Jefferson Streets with an English Mass and a Spanish Mass on Sundays,
  and a weekday Mass in English.
what_you_do: Come to Mass in English or Spanish, or join a ministry. The parish lists a Welcoming and
  Hospitality ministry, CCD teaching on Tuesdays at 6:30 pm, flower and altar server ministries, and Mission
  in the Streets on Saturdays. A Legion of Mary group meets Mondays from 6 to 7 pm. Most ministry pages
  send you to the parish office for details.
