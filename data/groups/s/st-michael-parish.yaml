first_step:
  how: Come to the 9:30 am English or 11:30 am Spanish Sunday Mass, then call the parish office at 215-739-2358
    about joining a ministry such as Welcoming and Hospitality or CCD teaching.
  drop_in: true
  sign_up_needed: null
