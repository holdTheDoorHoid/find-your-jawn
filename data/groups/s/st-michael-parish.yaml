  basis: Mass is open to anyone, and the parish lists an office phone and address that its ministry pages
    point people to.
  what_to_expect: Mass is free and open to anyone, and you can attend without signing up. Sunday Masses
    are at 9:30 am in English and 11:30 am in Spanish, and weekday Mass is at 8:30 am. Ministry pages
    send new people to the parish office rather than to a sign-up form, so calling or visiting the office
    is the next step.
  first_visit_tips:
  - Confession is Sunday 10:30 to 11:20 am and Thursday 5 to 6:30 pm, or by appointment.
  - The parish office address is 1445 N. 2nd St.
  - The Legion of Mary meets Mondays from 6 to 7 pm, according to the parish announcements page.
