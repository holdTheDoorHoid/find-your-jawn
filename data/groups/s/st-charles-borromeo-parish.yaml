summary: A Catholic parish at 20th and Christian streets in South Philadelphia. It runs a midweek Lectio
  Divina group, a monthly youth gathering with prayer and a shared meal, and regular adoration and evening
  prayer.
what_you_do: Join the Lectio Divina group at the rectory (7 to 8 pm), come to adoration from 5 to 6 pm
  or evening prayer at 5:40 pm (both listed midweek), or come to the youth gathering on the first Sunday
  of the month. The site invites visitors to volunteer through its contact page.
