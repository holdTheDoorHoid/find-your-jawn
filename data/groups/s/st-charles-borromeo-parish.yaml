first_step:
  how: Come to the Sunday 10:30 am Mass, then email stcharlesborromeo@gmail.com or call 215-735-0600 (weekdays
    9 am to 3 pm) to ask about the youth gathering or to volunteer.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: The site gives a parish email, a phone line with office hours and an invitation to volunteer,
    and it marks the youth gathering as open to all. It does not describe a newcomer welcome.
  what_to_expect: Mass is free and open to the public, with a Saturday vigil at 8 pm and a Sunday Mass
    at 10:30 am. The Lectio Divina group meets at the rectory at 902 S. 20th Street from 7 to 8 pm, and
    the site describes it as a Bible reflection session. The first Sunday youth gathering at 4:30 pm includes
    prayer before the Blessed Sacrament and a shared meal.
  first_visit_tips:
  - Call 215-735-0600 on a weekday between 9 am and 3 pm to confirm the day of the week for Lectio Divina,
    since the site does not give it.
  - The site gives no parking or transit information, so plan your route before you go.
  - If you bring a teen, ask about the first Sunday youth gathering, which the site lists for youth from
    this and nearby parishes.
