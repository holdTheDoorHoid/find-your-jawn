schedule:
  text: Saturday vigil at 8 pm, Sunday Mass at 10:30 am, and weekday Mass at 8:30 am. Confession on weekdays
    after daily Mass and on Sundays half an hour before Mass. Adoration from 5 to 6 pm and evening prayer
    at 5:40 pm, with Lectio Divina at the rectory from 7 to 8 pm. The youth gathering is on the first
    Sunday of each month at 4:30 pm.
