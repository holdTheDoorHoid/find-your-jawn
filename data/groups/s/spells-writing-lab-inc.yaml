summary: A Philadelphia nonprofit that helps school-age children build creative and expository writing
  skills through free writing programs, classroom visits, and workshops for teachers.
what_you_do: Apply online to volunteer as a classroom writing mentor, a Write Club tutor (no teaching
  experience needed), or a workshop helper, then attend an orientation. You can also register for a workshop
  or ask for a classroom visit.
