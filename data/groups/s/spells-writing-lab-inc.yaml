schedule:
  text: Write Club workshops run live online on Tuesdays and Thursdays at 11 am during the school year.
    Free workshops run on many weekend afternoons during the school year at the lab and at pop-up sites.
    Classroom mentors work in schools during the day, and volunteer orientations are usually on weeknights
    in Center City.
