first_step:
  how: Submit the online volunteer application on phillyspells.org, linked as Volunteer Now, then attend
    the next orientation once a date is posted.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The Write Club tutor page says no teaching experience is required, offers tutor training, and
    pairs newcomers with experienced tutors. Orientation dates are not posted yet, so the next step has
    no date.
  what_to_expect: Tutors guide young writers through creative and expository forms, with training first
    and a buddy system for newcomers. The Write Club runs live online on Tuesdays and Thursdays at 11
    am and is free for students, while classroom mentors travel to schools to lead workshops in person.
    The site sets no minimum time commitment for tutors, but orientation comes first.
  first_visit_tips:
  - Watch the site's news and events pages for the next orientation date, since none is posted now.
  - Expect an online application first, and the site does not say whether you need a background check.
  - Orientations are usually on weeknights in Center City, with one planned on Drexel University's campus.
  - Classroom mentors work in schools during the day, and the site says daytime availability is wanted.
