first_step:
  how: Create an account on septayac.org, then complete the application on the Apply page. You must be
    18 to 25 and live or go to school in Philadelphia, Bucks, Chester, Delaware or Montgomery county.
  drop_in: false
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: Members must apply online, review runs on a rolling basis with earlier applicants first, and
    the council only contacts applicants it wants to move forward with.
  what_to_expect: Members give SEPTA input on transit, table on campuses, track transit law, and run trainings.
    The site does not say how often members meet, how much time it takes, or whether members are paid.
    It notes that members often juggle full-time jobs or school alongside the council.
  first_visit_tips:
  - Apply early, since review is rolling and earlier applicants get looked at first.
  - Check your age and where you live or study before you start, since both are rules for joining.
  - Send questions to contact@septayac.org before you apply.
  - The events page lists trainings such as the UPass training, a good sample of what members do.
