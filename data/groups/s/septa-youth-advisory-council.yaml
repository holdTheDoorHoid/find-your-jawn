summary: A nonprofit of young transit riders in Southeastern Pennsylvania. Members give feedback to SEPTA,
  educate riders, and push for student transit passes on campuses.
what_you_do: Apply online to join. Members give SEPTA input, table on college campuses, track transit
  laws, and run trainings such as a UPass training. The council also publishes a quarterly newsletter.
