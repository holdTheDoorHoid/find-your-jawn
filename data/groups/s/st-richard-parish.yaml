summary: A Catholic parish at 18th and Pollock Streets in South Philadelphia, serving Catholics since
  1924. It has a Saturday vigil, Sunday Masses at three times (one at the Holy Spirit worship site), and
  a faith formation program (PREP) for children.
what_you_do: Come to Mass, register as a new parishioner online or in person, or ask about faith formation
  (PREP) for children and teens.
