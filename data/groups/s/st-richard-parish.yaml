first_step:
  how: Come to any Mass on the schedule, or register as a new parishioner through the online form on the
    parish site, or visit the rectory at 3010 S. 18th Street.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The Register page walks new households through the form and closes with a welcome, and the home
    page invites visitors to come and see. The parish also accepts registration in person at the rectory.
  what_to_expect: Mass is free and open to anyone. Sunday Mass is offered at three times, and the 10 am
    Mass is at the Holy Spirit worship site, so check the schedule for the right church before you go.
    The online registration asks for household details and whether each person is baptized, confirmed
    or has received Holy Communion, with yes, no or unsure as answers.
  first_visit_tips:
  - Call the rectory at 215-468-4777 if you are not sure which church to attend on Sunday.
  - The parish office is open Monday to Thursday from 9 am to 2 pm and Friday from 9 am to 12 pm.
  - Holy day Masses are announced ahead of time, so check before a holy day.
