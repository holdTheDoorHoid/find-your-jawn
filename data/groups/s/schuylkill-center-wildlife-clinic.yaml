first_step:
  how: For event days such as the Winter Bird Census or a planting day, use the Sign Up link on the event
    page. For the Wildlife Clinic, apply online, attend an information session, sign the volunteer agreement,
    and finish the online ethics and safety courses before a first shift.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The Winter Bird Census page says birders of any skill level are welcome, no experience is needed,
    and it has a sign up link. Clinic shifts need an application and training first, so that route rates
    lower.
  what_to_expect: Event days last a few hours and are free, with hands on tasks such as planting, decorating
    the greenhouse, or counting birds by sight and sound. Wildlife Clinic volunteers go through an application,
    an information session, a waiver and online training before their first shift. Food and drinks are
    provided on the Winter Bird Census morning.
  first_visit_tips:
  - Sign up through the event link ahead of time, since the events list does not show how to register.
  - Bring a donation if you like; the clinic suggests paper towels, cotton balls, trash bags, or dish
    soap.
  - 'Check the age rules first: clinic support starts at 16 and animal care at 18, and group workdays
    need one adult for every 10 to 12 children.'
  - Ask the Center about parking and transit when you call, since the site does not list them.
