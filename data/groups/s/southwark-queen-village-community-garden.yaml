summary: A food-producing community garden on Christian Street with individual plots, founded in 1976
  and protected as a park in 1983. Members tend their own plots and share the orchard, the pollinator
  garden and the compost bins.
what_you_do: Members tend their own plot, attend five garden meetings and take part in five workdays each
  year, and help look after shared areas such as the orchard and compost.
