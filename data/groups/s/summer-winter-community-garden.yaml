summary: A volunteer-run community garden in Powelton Village, near Drexel, where members grow food on
  their own plots and share the work of the common areas. The garden calls itself one of the oldest community
  gardens in Philadelphia.
what_you_do: Grow food on your own plot, keep the plot and the paths beside it weeded, and attend three
  3-hour Garden Days a year.
