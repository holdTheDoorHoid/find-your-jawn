first_step:
  how: Email the garden to ask for an application. Plots are given out first-come, first-served.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: A plot starts with an emailed application, and the pages give no waitlist, open dates or fee,
    so you cannot see the process before you apply.
  what_to_expect: Plot holders get their own plot to grow what they like, and the gardens are mostly organic.
    Expect at least 2 to 3 hours a week in the growing season, plus three 3-hour Garden Days a year. The
    garden's pages do not state dues or fees.
  first_visit_tips:
  - Email for an application before you visit, since plots go first-come, first-served.
  - Plan on 2 to 3 hours a week in the growing season, plus three 3-hour Garden Days a year.
  - Plots must be planted by May 15 and ready for winter by the second week of December.
