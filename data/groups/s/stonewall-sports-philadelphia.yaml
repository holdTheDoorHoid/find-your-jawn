first_step:
  how: Subscribe to the newsletter or follow the group on social media, then register for a league on
    the league registration page when a season opens. Winter 2027 registration is expected to open in
    mid-November.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The group runs new member calls and mixers each season and offers free agent teams for people
    new to its leagues. It does not describe drop-in or first-visit rules, so it is not rated 5.
  what_to_expect: New players can register as free agents, and free agent teams are made up of other new
    players, so no one arrives with a team. Each season has new member calls to ask questions and learn
    how leagues run, plus mixers where newcomers can meet people. The site does not list league fees on
    its pages, so ask before you register.
  first_visit_tips:
  - If you do not have a team, pick the free agent option so the group can help match you to one.
  - Sign up for the newsletter or follow social media so you hear when registration opens.
  - Email info@stonewallphilly.org with questions about fees or a specific league.
  - If cost is a concern, look into the Player Assistance Fund before you register.
