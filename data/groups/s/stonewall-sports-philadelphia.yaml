first_step:
  how: Subscribe to the monthly updates, then register for a league through the league registration page
    when a season opens. Winter 2027 sign ups are expected in mid-November.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The site runs new member calls and mixers each season, offers free agent teams for first-time
    league players, and says no athletic experience is needed. Drop in is not described, so the group
    is not rated higher.
  what_to_expect: The group says no athletic experience is needed. New players can register as free agents,
    and free agent teams are made up of other new players, so everyone starts at the same point. New member
    calls and mixers each season help people meet others and learn how the leagues run.
  first_visit_tips:
  - If you do not have a team, pick the free agent option so the group can match you by skill and interest.
  - Subscribe to the monthly updates so you hear when registration opens.
  - Email info@stonewallphilly.org with questions about fees or a specific league.
  - If cost is a concern, look into the Player Assistance Fund before you register.
