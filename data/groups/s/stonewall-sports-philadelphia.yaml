summary: A recreational sports and social group for the LGBTQIA+ community. It runs leagues in sports
  such as kickball, volleyball, bowling and pickleball, plus trivia and social events.
what_you_do: Sign up for a league as a player, on a team, as a free agent or as a small group, or come
  to new member mixers and community events.
