  newcomer_friendliness: 2
  basis: The site does not say whether non-members can attend meetings. Its clearest ways in are an email
    to the association or a yearly membership.
  what_to_expect: Community meetings are held in the evening at Pennsylvania Hospital's Zubrow Auditorium,
    and board meetings are held in the evening as well. The site does not say whether non-members can
    attend, so ask first. Committees cover zoning, safety, clean-up and membership work, and the association
    will refer a volunteer to a committee chair.
  first_visit_tips:
  - Email the association before you come to ask whether non-members can attend.
  - Check the calendar before a board meeting, since some are held at the Physick House.
  - Membership dues are paid yearly, so ask which level fits before you join.
