summary: A volunteer group that works to keep Society Hill clean, safe and historically intact. It speaks
  up on zoning and development, runs neighborhood clean-up and tree programs, and keeps residents informed
  with a weekly update and a bi-monthly paper.
what_you_do: Members follow zoning and development plans and attend the association's meetings. Neighbors
  can volunteer on committees. Clean and Beautiful organizes spring and fall clean-up days and tree and
  sidewalk subsidies, and Safe and Sound handles traffic, trash and crime concerns.
