first_step:
  how: Call 215-221-6860 to ask how a young player enrolls. To volunteer as a tutor or coach, fill in
    the volunteer form and finish the clearances first.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The site gives a phone line for questions but does not describe how a new player or family joins.
    Volunteers need a form, three clearances and a shift sign up before they can start.
  what_to_expect: Volunteer tutors and coaches work with young players most weekday afternoons, from 4
    to 6 pm, and the schedule is set one on one. Before a first shift you need a child abuse clearance,
    a State Police check and an FBI check, and the site says these last five years. The site does not
    describe what a family does on a first visit, so ask by phone first.
  first_visit_tips:
  - Start the clearances early, since they must be finished before you can volunteer.
  - Call 215-221-6860 before you go, because the site does not describe enrollment steps.
  - Plan around weekday afternoons, when most tutoring and coaching happens.
