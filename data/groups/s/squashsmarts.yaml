summary: A program that pairs squash with fitness training, school help, leadership work and long-term
  mentoring. It is based at the Lenfest Center in North Philadelphia.
what_you_do: Young players take part in squash, fitness, academic support and leadership work. Adults
  can volunteer as tutors or squash coaches on weekday afternoons once their clearances are done, or join
  the Young Friends Network, a group of college students and young professionals who mentor and help out.
