summary: A Jewish community in South Philadelphia for prayer, learning and friendship. The site lists
  a Zoom room for prayer and study, a Slack group for members, and a kiddush sponsorship for family milestones.
what_you_do: Visit in person at 1311 S. Juniper Street, join prayer and learning in the building or on
  the Zoom room, take part in the Slack community, volunteer with a team, or sponsor a kiddush after a
  life milestone.
