  what_to_expect: The site invites visitors to write in before coming, and it can connect you with a community
    guide to talk about life at the Shtiebel. The main room is upstairs, reached by stairs or a chair
    lift. The pages read do not describe the service, dress code or any guest cost, so ask those questions
    by email first.
  first_visit_tips:
  - Email info@southphiladelphiashtiebel.org ahead of time with questions about the neighborhood or about
    a Shabbat visit.
  - The main space is upstairs, so ask about the chair lift when you arrive if you need it.
  - To join the Slack community, email info+slack@southphiladelphiashtiebel.org with the subject line
    Joining Slack.
