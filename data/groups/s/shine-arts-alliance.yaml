summary: A Philadelphia arts group that works with young artists in performing, visual and media arts.
  It runs public fundraising events, and its youth arts initiative is listed as coming soon.
what_you_do: Young artists can take part in the group's arts education work. Its Shine Arts Academic Afterschool
  Initiative is listed as coming soon, with a registration form. The public can buy tickets to its fundraising
  events, such as its annual skate night.
