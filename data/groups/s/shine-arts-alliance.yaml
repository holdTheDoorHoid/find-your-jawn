first_step:
  how: Buy a ticket for the October 22, 2026 skate night fundraiser on the events page, or call 215-651-4763
    to ask about the youth arts initiative.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The youth initiative is listed as coming soon, and no class dates or costs are published, so
    the way in is not yet clear. Its registration form asks whether it is a first visit, which is a good
    sign, and the public fundraiser is open to ticket buyers.
  what_to_expect: The fundraiser is a Thursday evening skate night from 6 to 9 pm at Rolling Thunder Skating
    Center on Roosevelt Boulevard. The ticket is $20 plus a $0.50 service fee and includes admission,
    skate rental and a meal. The site does not describe how youth classes run, how long they last, or
    who attends them.
  first_visit_tips:
  - Call 215-651-4763 before you visit the office, because the site gives no access or parking details.
  - The office is on the 3rd floor, so ask about building access when you call.
  - Skate rental is included with the fundraiser ticket, so you do not need your own skates.
  - Ask whether the youth initiative has opened for sign-ups, since the site lists it as coming soon.
