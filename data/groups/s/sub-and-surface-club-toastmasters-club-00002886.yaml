first_step:
  how: Use the club's online contact form to say you want to visit, then come to a noon meeting at the
    Navy Yard or join online through Google Meet.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: Guests are welcome at any upcoming meeting, the first meeting is free, and the Toastmasters listing
    says there is no pressure to take part until a guest is ready.
  what_to_expect: A meeting runs about an hour at noon. Members give prepared and impromptu speeches,
    practice meeting roles, and give each other feedback. Guests are welcome to sit in, and a guest does
    not have to speak until ready.
  first_visit_tips:
  - Enter through the leasing office, reached from Chapel Way between Constitution Avenue and Normandy
    Place.
  - To join online, use Google Meet; the club's directions page has the link.
  - The club pages do not list parking or transit, so ask through the contact form before you come.
  - Arrive a few minutes early so you can find the entrance.
