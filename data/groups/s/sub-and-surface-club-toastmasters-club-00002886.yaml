summary: A Toastmasters club that meets at noon at the Navy Yard in South Philadelphia, in person or online,
  to practice public speaking. Visits are free, and guests do not have to speak until they feel ready.
what_you_do: Practice short speeches at lunchtime meetings, and take meeting roles such as timer or evaluator.
