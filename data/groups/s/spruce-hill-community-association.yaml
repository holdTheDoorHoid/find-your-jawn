first_step:
  how: Pick a committee from the committees page (nine are listed, including May Fair, Historic Preservation
    and Zoning), or come to a board meeting. To get notices, join the mailing list or pay yearly membership.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Committees say they welcome new members, membership is open to individuals, and board notices
    are public with a Zoom option. The site does not say outright that visitors may attend meetings.
  what_to_expect: Board meetings start at 7:30 pm on a Tuesday at the community center, with Zoom as an
    option. A recent agenda covered event updates, committee reports and a guest speaker. The site does
    not say how long meetings run or whether visitors may speak.
  first_visit_tips:
  - Confirm the date of the next board meeting on the site before you go.
  - Zoom is listed as an option if you would rather join from home.
  - Membership is open to individuals, businesses and institutions with an interest in the neighborhood,
    which runs from about 38th to 46th Streets and Woodland Avenue to Market Street.
