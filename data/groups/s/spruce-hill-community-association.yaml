summary: Neighbors who run the May Fair, historic preservation, zoning and other committees for Spruce
  Hill. They also hold public board meetings and act as a registered community organization that reviews
  nearby building plans.
what_you_do: Pick a committee from the committees page, come to a board meeting, or become a member. The
  association says it is always looking for new members and committee volunteers.
