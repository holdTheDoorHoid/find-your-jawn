first_step:
  how: Drop in at a weekday lunchtime Mass or any Sunday Mass. To join the parish, fill in the online
    registration form on the parish website, or call the office at 215-563-4145.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Mass is open to the public, and the parish has an online registration form and a phone line;
    no newcomer program is listed.
  what_to_expect: Mass is free and open to the public. The site does not describe what a visit is like
    or how long Mass runs. Several Masses are offered each day, so visitors can pick a time that suits
    them.
  first_visit_tips:
  - Go to the church at 21 S. 13th St. for Mass. The parish office is a separate address, 1212 Ludlow
    St.
  - The online registration form has five sections and asks about your household and whether you want
    offering envelopes. A printable PDF is available.
  - The site lists no office hours or parish email address, only a contact form and the phone line.
