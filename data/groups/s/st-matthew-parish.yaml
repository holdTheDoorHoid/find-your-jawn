summary: A Catholic parish at Cottman Avenue and Battersby Street in the Northeast with four Sunday Masses,
  daily Mass, and, according to the archdiocese listing, some liturgies interpreted in American Sign Language.
what_you_do: Come to Mass, or volunteer through the rectory. The Marthas meet each Monday morning after
  the 8:30 am Mass, and lectors, ushers and extraordinary ministers sign up through the rectory. Volunteers
  need background clearances first.
