first_step:
  how: Come to the 9 am or 11 am Sunday Mass, then call the rectory at 215-333-0585 about joining the
    Marthas (they meet each Monday after the 8:30 am Mass) or another ministry.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Mass is open to anyone, and the parish lists a rectory phone for groups such as the Marthas and
    ushers, though it does not say what a first meeting is like.
  what_to_expect: Mass is free and open to anyone, so you can come and sit without signing up. Sunday
    Masses are at 7, 9 and 11 am and 7 pm, and the 11 am Mass is livestreamed on Facebook. Volunteer roles
    need a PA State Police criminal record check and a PA child abuse history clearance, and the parish
    has a safe environment coordinator who can help with them.
  first_visit_tips:
  - Watch the 11 am Sunday Mass livestream on Facebook first if you want to see how the parish runs before
    you go.
  - Ask the rectory about the safe environment coordinator if you want to volunteer; the clearances must
    be renewed every 5 years.
  - FBI fingerprint clearance is only needed if you have lived in Pennsylvania for less than 10 years;
    a disclosure statement is needed if you have lived there 10 years or more.
