summary: Volunteer neighbors for the Graduate Hospital area, between Broad Street and the Schuylkill River
  and between Washington Avenue and South Street. Members vote for the board, join committees on zoning,
  clean and green, Vision Zero street safety, and economic development, and work on street trees.
what_you_do: Join a committee (Economic Development, Clean and Green, Vision Zero, Zoning, SOSNA Impact
  outreach, or Triangles), report empty tree pits, or run for the board.
