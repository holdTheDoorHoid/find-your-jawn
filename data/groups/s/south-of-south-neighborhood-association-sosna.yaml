first_step:
  how: Come to the October 15 general member voting meeting at the Christian St. YMCA Annex, 1724 Christian
    St., 6:30 to 8:30 pm. Anyone can attend.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: Meetings are open to everyone, and joining is a free online form. Voting is limited to members
    who live, own property or run a business in the area, so there is a clear way in for the public.
  what_to_expect: The fall general member voting meeting is a two-hour evening session at the Christian
    Street YMCA Annex. Members vote for board seats at this meeting. Board nominations close online on
    Sunday, October 11, 2026, and self-nominees go on the ballot automatically.
  first_visit_tips:
  - 'Joining online takes a few minutes: you confirm your email with a six-digit code, then give your
    address and your connection to the neighborhood.'
  - Only members vote. Residents, property owners, businesses and nonprofits headquartered in the area
    get full votes; people who live outside the area can join as associates and take part without voting.
