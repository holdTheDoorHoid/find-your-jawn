summary: A Philadelphia association for firefighters and EMS workers that promotes Hispanic and Latino
  representation in emergency services. It also gives out free smoke detectors, teaches CPR and first
  aid, and hosts family events for neighbors.
what_you_do: Neighbors can take part in smoke detector giveaways, CPR and first aid classes, and family
  events. Fire and EMS personnel can join through the membership sign-up page, and friends and supporters
  can join as honorary members.
