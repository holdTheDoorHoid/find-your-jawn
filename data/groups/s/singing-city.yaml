schedule:
  text: The adult choir rehearses Tuesday evenings, 7:20 to 9:50 pm, at Friends Center from September
    through May, with occasional Saturday all-day rehearsals before major concerts. The free youth program,
    Next Generation, meets weekly at Temple Music Prep. The site gives its start as September 12 with
    no year or weekday.
