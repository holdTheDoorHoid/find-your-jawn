first_step:
  how: 'Adults: send the audition request form linked on the auditions page, since auditions are by invitation.
    Young singers: register for Next Generation through the link on the site, with no audition needed.'
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: The adult choir is by invitation after a request form, and the site lists sight-reading and prior
    choral experience as things that help. The youth program has open registration and no audition.
  what_to_expect: Adults send a request form, then audition with one solo of their own choice, sight-reading,
    tonal memory checks, and vocal range exercises. Adult rehearsals are on Tuesday evenings at Friends
    Center. Youth singers join Saturday sessions with no audition, the program is free, and the young
    singers perform in a concert.
  first_visit_tips:
  - Bring a copy of your audition solo for the music director, who plays the accompaniment.
  - Get Friends Center parking validated at the front desk for $24, or use evening parking two blocks
    away for $12.
