schedule:
  text: 'Adult choir rehearses on Tuesday evenings, 7:20 to 9:50 pm, at Friends Center from September
    through May, with occasional all-day Saturday rehearsals before big concerts. The youth program meets
    on Saturdays during the fall term: Youth Choir (ages 11 and under) at 11:15 am and Chorale (ages 12
    and up) at 12:30 pm.'
