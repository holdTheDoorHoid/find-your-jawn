summary: A Philadelphia choral group that says it has sung together since 1948. It has an adult choir
  that rehearses weekly from September through May, and a free youth program called Next Generation for
  young singers.
what_you_do: Adults send a request form to be considered for an audition, then rehearse and sing in the
  choir's four public concerts each season. Young singers can join the free Saturday youth program with
  no audition.
