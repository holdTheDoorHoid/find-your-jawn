schedule:
  text: Sunday Masses at 7:30 am, 9:30 am (with Children's Liturgy of the Word) and 11 am, according to
    the parish website. An Archdiocese listing also shows 6:30 am and 8 am, so call to confirm. Saturday
    vigil at 4:30 pm. Weekday Mass at 8 am Monday to Friday. Holy days at 8 am, 10 am, 12 pm and 7 pm.
    Confessions Saturdays 3:30 to 4:15 pm. The church is open for private prayer 9 am to noon daily except
    Saturday.
