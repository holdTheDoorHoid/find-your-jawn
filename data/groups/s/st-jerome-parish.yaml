summary: A Catholic parish at Holme Avenue and Stamford Street in Northeast Philadelphia with several
  Sunday Masses, a Saturday vigil, and weekday Mass at 8 am.
what_you_do: Come to Sunday Mass or the Saturday vigil. Children can join PREP, the parish religious education
  program, and the 9:30 am Sunday Mass has a Children's Liturgy of the Word. Adults who are becoming Catholic
  can ask about OCIA. The site also lists a food assistance phone line at 215-805-8479.
