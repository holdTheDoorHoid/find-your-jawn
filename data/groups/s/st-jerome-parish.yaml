first_step:
  how: Come to a Sunday Mass, then call the parish office at 215-333-4461 to ask how to register or about
    PREP or OCIA.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Mass is open to anyone, and the office phone is listed. The site has a 'Register with us' page,
    which we could not open. No newcomer program is described.
  what_to_expect: Mass is free and open to anyone, so you can come and sit. The 9:30 am Sunday Mass has
    a Children's Liturgy of the Word for younger children. The church is also open for quiet prayer from
    9 am to noon, daily except Saturday.
  first_visit_tips:
  - Call 215-333-4461 to confirm Sunday times, because the parish site and the Archdiocese listing do
    not match.
  - Confessions are on Saturdays from 3:30 to 4:15 pm.
