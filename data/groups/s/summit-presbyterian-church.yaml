summary: A Presbyterian church on Greene Street with 10 am Sunday worship in person or on Zoom. It runs
  Elder Diner, a home-cooked lunch for people 55 and older, and collects supplies for blessing bags for
  people experiencing homelessness.
what_you_do: Come to Sunday worship, eat at Elder Diner (for people 55 and older), bring a main dish,
  salad, dessert or bread for it, drop off items for blessing bags on Sundays, or join the justice and
  environment committee on Zoom.
