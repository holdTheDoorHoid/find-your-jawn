first_step:
  how: Read the park rules on segerdogpark.org, then use the membership page if you want to join for a
    suggested $50 a year, or $25 for students and seniors.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The rules apply to everyone who enters, and the site names no membership requirement to use the
    park. Joining is through a donation page with no step-by-step sign-up, so the way in is simple but
    not spelled out.
  what_to_expect: 'Bring your dog and follow the posted rules: stay inside the park, keep your dog in
    view and under voice control, and clean up after it. The site does not say how long visits last or
    who usually comes. Membership is a suggested yearly donation that helps pay for upkeep.'
  first_visit_tips:
  - Your dog must be licensed and vaccinated, and the site points to ACCT Philly for licensing.
  - Kids aged 10 or younger are not allowed in the dog run, and those aged 11 to 15 need an adult with
    them.
  - Dogs must wear collars in the run, and leashes must be 6 feet or shorter outside it.
  - The park supplies biodegradable waste bags, and shovels and rakes are kept by the shed.
