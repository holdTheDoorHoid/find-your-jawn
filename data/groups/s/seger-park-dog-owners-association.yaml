summary: Volunteers who look after the off-leash dog park in Seger Park. They run the dog run, organize
  neighborhood cleanups, and host community events with local businesses and musicians.
what_you_do: Dog owners use the park under posted rules and can join the association as members, which
  helps pay for upkeep. The association handles turf care, litter and trash removal, and restocks waste
  bags. Its site does not say how to sign up for a cleanup, so ask by email first.
