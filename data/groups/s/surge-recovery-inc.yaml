summary: A recovery house network for men in Philadelphia who are working through alcohol and drug addiction.
  Residents live on site for a 90-day stay and can take job training, GED and college prep classes, and
  outpatient therapy.
what_you_do: 'Live in the residential program, take the classes and job training it offers, and use its
  health and outpatient services. Residents move through three stages: Step In (a 90-day stay), Step Up
  (taking on a role in the house, such as leading a group, cooking, or managing laundry), and Step Out
  (finishing outpatient treatment with steady income and housing lined up). Alumni can stay connected
  through the program''s alumni services.'
