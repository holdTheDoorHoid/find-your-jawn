summary: Gives away gender-affirming clothing for free to trans and queer adults, and offers community
  care and mutual aid.
what_you_do: Ask for clothing or community resources through the online Get Support form, drop off clean
  donated clothing at 3675 Market St on weekdays, or sign up to help through the Volunteer Interest Form,
  for example by sorting clothes or setting up events. The group also runs pop-up closets and workshops.
