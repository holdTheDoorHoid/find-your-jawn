first_step:
  how: Fill in the online Get Support form on sasproject.org to ask for affirming clothing or help finding
    community resources. It takes about 3 to 5 minutes.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Help starts with a form that the team reviews before offering anything, and the page says a request
    does not guarantee help. The volunteer route also starts with a form and a reply, and no open drop-in
    time is listed.
  what_to_expect: A request is a short online form, and the team reviews it and replies later, not right
    away. Help depends on stock, funding, program availability and team capacity. The group also holds
    pop-up closets and workshops, but the site gives no dates and does not describe what a visit is like.
  first_visit_tips:
  - 'Send only what the form needs: the group asks you not to include ID, Social Security numbers, medical
    records, immigration papers or financial account details.'
  - Expect a reply later; the form is not watched around the clock.
  - For donations, bring clean, gently used clothing only. Undergarments and heavily worn items are not
    accepted.
