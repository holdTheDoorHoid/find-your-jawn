summary: An afterschool learning center in the Strawberry Mansion neighborhood that helps local kids and
  teens with homework and offers mentoring.
what_you_do: Kids and teens ages 10 to 17 join after-school tutoring Monday to Thursday, 3:30 to 6 pm.
  College students and volunteers help with math, civics, and science, and each student gets a snack.
  The center also runs field trips, speaker visits, and a reading camp in July and August. Adults who
  want to mentor or help can ask the center how to get involved.
