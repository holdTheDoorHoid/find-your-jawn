summary: A refugee-founded agency in Philadelphia, operating since 1984, that helps immigrant and refugee
  families with health care access, social services and education. Its Urban Arts Entrepreneurship Program
  offers arts classes for young people after school and in summer.
what_you_do: Young people can join the Urban Arts Entrepreneurship program after school or in summer.
  Adults can sign up to volunteer, apply to join the team, or ask about health care access and social
  services.
