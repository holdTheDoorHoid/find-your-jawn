first_step:
  how: Come to a listed Mass or to the Wednesday novena, or stop by during visiting hours. Call 215-546-8333
    to ask about volunteering, since the shrine asks volunteers to use its form.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Mass, the novena and the shrine are open to visitors and pilgrims, and the site invites people
    to volunteer through a form. The site describes no newcomer program or orientation.
  what_to_expect: The upper and lower shrines are open to visitors during posted hours, and the site lists
    no admission fee. The monthly healing Mass, held at noon on the third Sunday from September to May,
    includes an anointing with holy oil, the novena prayers and a veneration of the relic of St. Rita.
    The site says anyone seeking healing is welcome, and the shrine office keeps weekday and Saturday
    hours.
  first_visit_tips:
  - Park in the C.A.T.C.H. lot on 15th Street for weekend Mass, or use the two-hour street parking on
    Broad Street.
  - Do not park in turn lanes or on striped pavement, because you may be ticketed or towed.
  - Use the elevator in the glassed-in lobby, to the left of the Broad Street entrance, to reach both
    shrines.
  - Visiting hours are Monday to Friday 7:45 am to 5 pm, Saturday 7:45 am to 6 pm, and Sunday 9 am to
    2 pm (the upper shrine closes at 11:15 am on Sunday).
