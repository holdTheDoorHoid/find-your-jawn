summary: A Catholic shrine at Broad and Ellsworth Streets with weekday, Saturday and Sunday Masses, a
  healing Mass once a month from September to May, and a Wednesday novena. Visitors can see the upper
  and lower shrines during posted hours.
what_you_do: Come to Mass, the monthly healing Mass, or the Wednesday novena to St. Rita, or visit the
  shrine during its posted hours. You can also ask about volunteering. Confession is offered on weekdays.
