first_step:
  how: Fill out the Volunteer Application on the volunteer page for the area you want, or email purr@straycatrelieffund.org.
    To foster, use the foster application linked from the homepage.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Volunteers and fosters start with an application form. The pages do not describe an orientation
    or training, or what happens after you apply.
  what_to_expect: The site does not describe an orientation. Volunteer work ranges from one-time events,
    such as a shelter build day or a food drive, to ongoing trapping and cat transport. Fostering means
    caring for one cat at home for an average of 8 to 12 weeks, and the group covers medical care at approved
    vet clinics with prior approval.
  first_visit_tips:
  - Pick the volunteer area you want on the Volunteer page, such as trapping, transport or shelter builds,
    and use its form.
  - Fostering needs reliable transport to vet visits and a safe space apart from your own pets.
  - If you plan to foster, have a short bio and good photos of the cat ready, since the group asks for
    both.
