summary: A nonprofit serving Philadelphia and New Jersey that traps, spays or neuters, vaccinates and
  returns stray cats, looks after cat colonies, and places cats with foster homes and at a small adoption
  center.
what_you_do: Volunteers trap, transport and care for cats, manage colonies and help at events. The group
  also lends humane traps to community members. Fosters care for cats until they are adopted.
