summary: A South Philadelphia nonprofit that traps, neuters, vaccinates and returns stray cats, supplies
  humane traps to community members who help neighborhood cats, and rescues and adopts out cats from its
  adoption center.
what_you_do: Join the trapping team, or drive cats between outdoor colonies, vet clinics and foster homes.
  You can also help build or fix shelters on Shelter Build Days, collect food or donations, or foster
  a cat.
