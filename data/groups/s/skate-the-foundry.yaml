  gear: Bring a traditional skateboard (penny boards and longboards are not allowed), a helmet, and knee,
    elbow and wrist pads. Club board and safety gear can be rented for $5 per class.
first_step:
  how: New skaters book one to three private lessons first, then register for a class round through the
    Register Here links on the class pages.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The FAQ says total beginners are welcome, and there is a beginner kids class and a new student
    discount. Walk-in open skate needs six months of riding first.
  what_to_expect: The school suggests that a total beginner takes one to three private lessons before
    joining a class. Youth Saturday classes run about 75 minutes with up to 10 skaters, and parents are
    asked to step out during class. Open skate is a walk-in session for skaters with at least six months
    of regular riding, and you sign a waiver when you arrive.
  first_visit_tips:
  - Book a private lesson or a class round online before you come, since walk-ins are only welcome at
    open skate.
  - Bring a traditional skateboard, a helmet, and knee, elbow and wrist pads, or rent safety gear for
    $5 per class at the club.
  - Parents are asked to step out during class and may come back 5 to 10 minutes before it ends.
  - Check the school's social media for open skate schedule changes before you go.
