schedule:
  text: Thursday after-school club from 4:30 to 6:30 pm. Saturday youth classes in the morning and early
    afternoon. Open skate on Tuesday, Wednesday and Friday from 4 to 9 pm, and on Thursday from 6:30 to
    9 pm (hours listed for spring 2026). Camps run on school days off, and summer camps are held at Paine's
    Park.
