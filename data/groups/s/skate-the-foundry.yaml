cost:
  level: paid
  text: Paid programs. Recent listings show youth Saturday classes at $390 per round, the after-school
    club at $420 per six-session round (includes a $20 registration fee), open skate at $10 a day (members
    skate free), summer camp at $600 a week in 2026, and holiday day camp at $130 a day. Club gear rental
    is $5 per class. New students get 15 percent off a first private lesson.
