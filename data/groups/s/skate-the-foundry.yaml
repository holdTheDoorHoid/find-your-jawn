summary: A skate school in West Philadelphia that teaches skateboarding and roller skating to kids, teens,
  and adults, with after-school, weekend, and camp options and open skate time.
what_you_do: Kids can join a Thursday after-school skateboard club, Saturday youth classes, or camps on
  school days off and in the summer. Walk-in open skate is for skaters with at least six months of riding
  experience. The site does not list volunteer roles.
