  basis: The site says its workshops welcome people new to tech or building on existing skills, and the
    Join us button gives a clear way in.
  what_to_expect: The website does not say how long a workshop runs, who leads it, or what it costs. Workshops
    cover tech skills such as web development and Salesforce certification, and the group also runs career
    talks and mentoring circles led by professionals in a field.
  first_visit_tips:
  - Expect to make a Meetup account, since the website sends people there to join.
