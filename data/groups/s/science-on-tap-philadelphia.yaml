first_step:
  how: Come to a monthly talk on the second Monday, or write to the series email with questions first.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Talks are open to the public and need no membership. The site describes welcoming, accessible
    programming, but has no beginner program.
  what_to_expect: Expect one expert talking about one topic, usually for about an hour, then time to mix
    with the crowd. The site says events usually draw about 100 people. Admission is free or low cost,
    and the site does not print a price for each talk.
  first_visit_tips:
  - Check the events page for the venue before you go, since special editions can move. The August 2026
    talk was held at Benjamin Franklin Hall.
  - Arrive a little early, since events usually draw about 100 people.
  - The site does not describe step-free access, so email the series ahead of time with any access questions.
