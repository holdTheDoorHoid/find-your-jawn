summary: A monthly talk series for adults curious about science, history and the natural world, run by
  a group of Philadelphia museums. Talks take place on a Monday evening at a bar and restaurant in Old
  City, and the series aims for a lively feel rather than a classroom lecture.
what_you_do: Come listen to a speaker on one topic for about an hour, then mix with the crowd afterward.
