  what_to_expect: The STEM conference runs from 9:30 am to 4 pm on a Saturday at Temple University's Morgan
    Hall. Past teen girls conferences have included workshops on confidence, fashion, and social media,
    plus skits and public speaking. The site does not list prices or describe a first event.
  first_visit_tips:
  - Fill in the online registration form ahead of time, since events and the cohort sign up online.
  - Morgan Hall is on Temple University's campus at 1700 N. Broad Street.
  - The leadership cohort meets at Universal Institute Charter School, 1415 Catherine Street.
