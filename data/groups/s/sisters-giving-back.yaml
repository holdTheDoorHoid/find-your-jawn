summary: A community nonprofit, started in 2011, that helps girls and young women build confidence, plan
  for college, and grow into leaders. It gives scholarships and runs leadership programs and yearly conferences.
what_you_do: Register for the six-month leadership cohort or the STEM conference through the online forms
  on the group's site. Women who want to help can join as members to mentor and fundraise. Three scholarships
  a year go to first-year college students, and applications are accepted through April 30, 2027.
