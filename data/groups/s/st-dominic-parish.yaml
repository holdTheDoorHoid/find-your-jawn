  what_to_expect: Mass is free and open to anyone, so you can come, sit and leave. The adoration chapel
    is open for quiet prayer most days, but it closes during Mass times and after the last Sunday Mass.
    The registration form asks for household details, and the site sends it by email.
  first_visit_tips:
  - The office is open 9 am to 5 pm on weekdays and by appointment on Saturday, so call before you come
    by.
  - Check the adoration hours first, since the chapel is closed during Mass times and after the last Sunday
    Mass.
