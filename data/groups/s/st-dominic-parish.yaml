schedule:
  text: Saturday Masses at 9 am and 4:30 pm. Sunday Masses at 8:30 am and 10:30 am. Weekday Mass at 8
    am in the chapel. Holy days at 8 am and 7 pm. Confessions Saturdays 3:30 to 4 pm or by appointment.
    The adoration chapel is open daily 8 am to 7 pm except during Mass times, and it is closed after the
    last Sunday Mass.
