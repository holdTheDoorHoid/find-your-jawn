summary: A Catholic parish on Frankford Avenue in the Northeast with weekend Masses, a chapel open for
  adoration most days, and a Saturday Miraculous Medal novena.
what_you_do: Come to a weekend Mass, pray in the adoration chapel, or join the Saturday Miraculous Medal
  novena after the 9 am Mass. To join the parish, fill in the online registration form on the site or
  call the office at 215-624-5502.
