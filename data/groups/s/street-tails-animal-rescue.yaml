first_step:
  how: Submit the Adult Volunteer Application on the website, or the Foster Application if you want to
    foster, then attend the mandatory 60-minute orientation.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Volunteers and fosters must apply before they can see the work, and every role starts with a
    mandatory orientation. Visits to dogs are only for approved applicants.
  what_to_expect: Volunteers commit to at least two shifts or one event each month, and shift lengths
    are not listed. Volunteers must be 18 or older, have a current tetanus vaccine, and have no history
    of animal cruelty charges or violent crime convictions.
  first_visit_tips:
  - Check that you are 18 or older and have a current tetanus vaccine before you apply.
  - Plan for the 60-minute orientation, which every role requires.
  - Visits to the dogs are by appointment only, so call or email before you come.
  - The page gives no orientation dates, so ask when the next one is.
