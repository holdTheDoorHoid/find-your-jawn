summary: A Philadelphia dog rescue that cares for overlooked dogs in a kennel facility, places them in
  adoptive homes, and asks for foster homes and adult volunteers.
what_you_do: Volunteers walk dogs, help at events, clean kennels, and help with transport. You can also
  foster a dog, help with events and fundraising, or do photography or content work. Start with the Adult
  Volunteer Application or the Foster Application on the website.
