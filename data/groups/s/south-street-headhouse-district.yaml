first_step:
  how: Go to a public event on the district calendar, such as Tuesday evening yoga at 6 pm, or sign up
    for the district newsletter.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The events calendar lists public events with times and venues, and the site does not ask for
    membership or an application to attend them.
  what_to_expect: A first visit is usually a public event at a local shop, bar or gallery, such as a yoga
    class or a trivia night. Most event listings show a time and place but not a price, so check the event
    page before you go. The site lists no open meetings, members or volunteer shifts for the organization
    itself.
  first_visit_tips:
  - Check each event page for a price, since most listings do not show one.
  - Take the L to 2nd Street Station and walk about 10 to 15 minutes, or ride Route 57 along 3rd or 4th
    Street.
  - Many garages and lots nearby charge by the hour, so transit may be easier.
