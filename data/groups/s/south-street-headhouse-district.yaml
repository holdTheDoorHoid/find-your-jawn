summary: The organization that promotes the shops and businesses of the South Street district. It runs
  public events such as trivia, yoga and gallery nights, and supports painted electrical boxes and banner
  art.
what_you_do: Attend a public event on the district calendar, sign up for its newsletter, or submit a business
  event or apply to vend. The site does not list members, open meetings or volunteer roles.
