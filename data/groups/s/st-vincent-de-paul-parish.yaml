first_step:
  how: Come to the 9 am or 10:30 am Sunday Mass, then call the parish office at 215-438-2925 to ask about
    the New Parishioner Orientation, which the site says is just getting started.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Mass is open to anyone and the office phone is listed. The site mentions a new parishioner orientation
    that is just starting, but gives no date or sign-up steps.
  what_to_expect: Sunday Mass is at 9 am or 10:30 am, and the 10:30 am Mass is livestreamed. Children
    have their own Liturgy of the Word at both Sunday Masses, so families can bring kids. Mass is free,
    and the site does not say how long a Mass runs or what happens afterward.
  first_visit_tips:
  - Families can ask about the children's Liturgy of the Word at the 9 am and 10:30 am Masses.
  - Watch the 10:30 am Mass livestream on the parish website or YouTube first if you want a preview.
  - Look at the ministries list to find a group that meets on a day that works for you.
  - Ask the office about the New Parishioner Orientation before you start.
