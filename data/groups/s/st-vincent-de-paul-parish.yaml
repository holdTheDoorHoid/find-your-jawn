summary: A Catholic parish at Price and Lena Streets in Germantown with Sunday Masses at 9 and 10:30 am
  and weekday Masses at 7 am. It lists nearly 75 ministries.
what_you_do: Come to Mass, then look at the ministries list. Several groups meet on set days, such as
  a weekly food pantry on Tuesday mornings, a Wednesday evening Bible study, a Thursday evening choir,
  and a monthly Centering Prayer group, and most list a contact.
