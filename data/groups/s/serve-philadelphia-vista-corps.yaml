summary: Places full time AmeriCorps VISTA members for a year of paid, stipend supported national service
  inside City offices, for example the Office of Immigrant Affairs.
what_you_do: Serve a full year inside a City department on one project, such as building language access
  tools, writing a community resource guide, or organizing volunteer events for Community Schools.
