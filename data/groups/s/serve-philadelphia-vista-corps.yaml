first_step:
  how: Fill out the City's interest form to be told when the next VISTA cycle opens, and read the benefits
    and requirements page. Questions go to ServeVISTA@phila.gov or (215) 686-0823.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: You must apply to join, and the current application window is closed. The City says the roles
    are entry level and encourages people to apply even if they feel underqualified.
  what_to_expect: Members work full time for one year inside a City department on a project, and the City
    describes the roles as entry level. The pages read do not list the pay, benefits, eligibility rules,
    or start month, so ask the contact or read the benefits and requirements page before you apply.
  first_visit_tips:
  - Read the benefits and requirements page before you fill out anything.
  - Expect the window to be closed for now; the last window we found ended April 30, 2025.
  - Ask the contact about eligibility and the start month, since the public pages do not give them.
