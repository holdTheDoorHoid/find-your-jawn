summary: Support for people who have survived domestic violence, sexual abuse or sexual assault. Programs
  include transitional housing, transportation help, bereavement support, a family bonding program and
  a scholarship for survivors.
what_you_do: Survivors reach the group through its contact form or email, then ask about the programs
  listed on the site. Donors can give through the site's Givebutter page, and the Volunteer button opens
  the same contact form.
