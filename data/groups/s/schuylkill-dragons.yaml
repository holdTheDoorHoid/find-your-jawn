first_step:
  how: Join the mailing list on the Join Us page, then register for the Intro to Paddling class when registration
    opens, usually in April.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: No experience is needed, the team runs a five-week beginner class, and the site gives a clear
    sign-up step. Joining the team itself is by invitation after the class.
  what_to_expect: The five-week class meets on Sunday evenings, usually from late May through June. Coaches
    assess students during the course, and invitations to join the team go out after it ends. Life jackets
    and paddles are provided, and the class costs $150.
  first_visit_tips:
  - Bring a seat cushion, since the page suggests one to help prevent blisters.
  - Watch the team's Instagram and Facebook accounts for the day registration opens, usually in April.
  - Once you join, members are encouraged to come to at least two practices a week.
