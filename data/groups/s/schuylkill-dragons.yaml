schedule:
  text: Practices from April to October on Tuesdays and Thursdays from about 6:15 to 7:30 pm and Saturdays
    from 9 to 10 am, with early Wednesday mornings added in midsummer. The five-week beginner class meets
    on Sunday evenings, usually late May through June. From November to March the team holds weekly group
    weight training and rowing machine sessions, and indoor paddling on Saturdays from January to March.
