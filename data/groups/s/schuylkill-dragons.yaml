summary: A women's dragon boat team founded in 2001 that paddles on the Schuylkill River and trains year
  round, with paddlers from their 20s to their 80s.
what_you_do: Take the five-week Intro to Paddling class in late spring. If invited to the team, join practices
  on the water and winter workouts.
