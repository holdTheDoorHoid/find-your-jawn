first_step:
  how: Email the club at least 48 hours before the meeting to register as a guest, using Toastmasters@septa.org,
    then come to a noon meeting in person or ask for the online link.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The club says guests are welcome at any meeting and gives a clear way to sign up ahead by email.
    The club pages do not say whether guests must speak.
  what_to_expect: Each meeting runs from noon to 1 pm on the 2nd and 4th Wednesdays, in person at SEPTA
    headquarters or online. The club pages do not say whether guests must speak or how a meeting runs
    for visitors, so ask when you register. Visits are listed as free, and membership dues are $70 every
    six months.
  first_visit_tips:
  - Email the club at least 48 hours before the meeting, since building security needs advance notice
    of guests.
  - Bring a government-issued photo ID on the day of your visit.
  - Ask which room to go to, because the club's pages list two different room numbers.
  - If you would rather join from home, ask for the online meeting link when you register.
