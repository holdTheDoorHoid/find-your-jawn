summary: A Toastmasters club that meets at lunchtime at SEPTA headquarters on Market Street, in person
  or online, to practice public speaking. Visits are free, and guests do not have to speak until they
  are ready.
what_you_do: Practice short speeches at lunchtime meetings, and take meeting roles such as timer or evaluator.
