summary: An Augustinian parish at 923 Christian Street with an active young adult ministry. Its events
  include a monthly service night, a biweekly Bible study and a young adult Mass with a social afterward.
what_you_do: Come to the monthly service night at the Friary, a project built around the Corporal Works
  of Mercy (October's project is homelessness), or to the biweekly young adult Bible study. All adults
  are welcome, married or single, and you can come to one event or many. Email youngadults@stpaulphilly.org
  or join the St Paul young adult group on WhatsApp to get the next dates.
