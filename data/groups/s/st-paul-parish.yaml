first_step:
  how: Email youngadults@stpaulphilly.org or join the St Paul young adult group on WhatsApp for the next
    dates, then come to the next service night or Bible study at the Friary.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The young adult page says all adults are welcome, married or single, that you can attend one
    event or many, and lists several ways to get in touch.
  what_to_expect: The Bible study is an evening of scripture, prayer and fellowship at the Friary, held
    every two weeks on Wednesdays at 7 pm. The monthly service night on a Tuesday at 6:30 pm is a service
    project, and October's focus is homelessness. The page gives no cost and does not say how long either
    one runs.
  first_visit_tips:
  - Go to the Friary at 808 S. Hutchinson St. for the service night and Bible study, since both meet there
    rather than at the church.
  - You can come to one event or many, which the page says, so the first visit does not commit you to
    anything.
  - The Homeless Ministry also needs volunteers; the parish asks for emails to office@stpaulphilly.org.
