summary: A volunteer association that brings meals, warm supplies, and rest support to first responders
  at fires, police incidents, and big city events.
what_you_do: Members give about 20 hours a month through on-scene calls, standby details, and work at
  the station, and attend 8 of the 12 monthly meetings each year. Applicants must be 18 or older, hold
  a Pennsylvania or New Jersey driver's license, have a high school diploma or GED, and be able to lift
  20 to 50 pounds regularly.
