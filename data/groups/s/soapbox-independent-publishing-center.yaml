summary: A print shop and zine library in West Philadelphia with public open hours on Wednesday evenings
  and Sunday afternoons. Members use the presses, and the studio teaches printmaking, bookmaking, and
  zine making.
what_you_do: Join as a member to use the presses after orientation and training, take a workshop, ask
  about a custom workshop or private lesson, or browse the free zine library.
