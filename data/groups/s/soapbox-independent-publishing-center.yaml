first_step:
  how: Call the studio phone at (267) 630-1632 during Wednesday 6 to 10 pm or Sunday 1 to 5 pm open hours
    to ask about a visit, and apply for a membership if you want to use the equipment.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Studio access takes a membership, a punchcard or a workshop, plus an application and an orientation
    before you use the presses. The open hours are posted, but the site does not say a visitor can walk
    in.
  what_to_expect: Open hours run on Wednesday evenings and Sunday afternoons, with monitors who answer
    questions but do not teach. Entry takes a membership, a punchcard or a workshop, and you call the
    studio to be let in. Newer members must finish set training hours on each press or tool before they
    use it.
  first_visit_tips:
  - 'Call the studio phone during open hours to be let in: (267) 630-1632.'
  - Masks are encouraged but optional in the studio, according to the site.
  - Use the main entrance on Reinhard Street, which the site describes as accessible.
  - Email studio@phillysoapbox.org before you come if you need an accommodation.
