first_step:
  how: Come to a free Sunday improv jam, or try the free workshop on the group's flyer (it links through
    a QR code), then sign up for a class on the website.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Classes and the free jams are open to the public and there is a free trial, but the pages do
    not say beginners are welcome or who can attend the Queer and BIPOC jams.
  what_to_expect: The site does not describe a jam or a class in detail, so ask how long one lasts before
    you go. Classes only run if enough students sign up, and refunds are not given, but you can move to
    another class that has not started if you email the studio first.
  first_visit_tips:
  - Email or call before a first class to ask about the level and how long it runs, since the site does
    not say.
  - 'Read the class policy first: there are no refunds, and a class can be cancelled if too few people
    enroll.'
  - The page does not say who the Queer and BIPOC improv jams are for, so ask before you go.
  - The entrance and parking are not described, so call 856-332-4951 for directions.
