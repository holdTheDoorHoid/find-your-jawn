first_step:
  how: Email the garden at belarborgarden@gmail.com to ask about joining, and ask in the same message
    about any waitlist, dues, or work days.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: Neither the garden's own site nor the Trust's page for it says how to join, whether there is
    a waitlist, or what work is expected, so the way in is unclear.
  what_to_expect: 'Gardeners share the common work: they turn the compost piles, keep the watering system
    going, and grow vegetables and flowers, some of them for the City Harvest program. The site lists
    no open days or work days, so ask by email before you come.'
  first_visit_tips:
  - Email before you visit, since the garden does not post open hours.
  - Break down large plant material to about a foot long or less before it goes on the compost.
  - Keep diseased or bug-infested plants out of the compost.
  - Shut the water off at the blue pump once you are done, since some connections leak while the pump
    runs.
