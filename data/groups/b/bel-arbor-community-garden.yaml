summary: Neighbors who share a food-growing garden on Kimball Street, started in 1995 and preserved by
  the Neighborhood Gardens Trust in 1999. Members compost, grow vegetables and flowers, and look after
  a beehive.
what_you_do: Turn the compost piles, keep the watering system running, grow vegetables and flowers, plant
  trees with the Tree Tenders, and help care for the bee hive.
