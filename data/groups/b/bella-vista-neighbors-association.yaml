summary: Bella Vista Neighbors Association is one of the community organizations registered with the City
  to review nearby zoning and building proposals in the Central part of the city. Neighbors can follow
  what is planned and speak up.
what_you_do: Join a volunteer committee such as zoning, public safety, beautification, transportation,
  or climate, or come to meetings when they are announced. The zoning committee hosts community reviews
  of nearby variances, development, liquor licenses, and sidewalk cafes.
