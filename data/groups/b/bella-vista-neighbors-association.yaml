first_step:
  how: Email info@bellavistaneighbors.org and ask to be connected with the chair of a committee you care
    about.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: 'The site lists its committees and says how to join: email the office or call and be introduced
    to a chair. Meetings are announced, but the site gives no days or times.'
  what_to_expect: Everything here is volunteer-run, and the site does not say when committees meet. Most
    people start by emailing the office, then talk with the chair of the committee they pick. The zoning
    committee is the one that hosts community reviews of nearby projects.
  first_visit_tips:
  - Email info@bellavistaneighbors.org before you come, since the site does not post meeting times.
  - Ask which committee meets soonest, and ask the chair for the place and time.
