summary: A nonprofit that uses art making, including music, writing and painting, to help children and
  communities that have faced trauma. It runs youth studios and public programs, and it needs volunteers
  and teachers.
what_you_do: Volunteer, teach as a teaching artist, be an ambassador, or apply to the youth advisory board
  (ages 15 to 22) or the board, all through the get-involved page. Attend a public program such as The
  Drummer's Journey, or the free Tones of Home concert and art-making series for all ages. The youth studios
  (music, writing, visual arts, and movement) work with young people, and the site does not list ages
  or cost for them.
