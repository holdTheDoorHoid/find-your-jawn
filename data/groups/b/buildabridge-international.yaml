  newcomer_friendliness: 3
  basis: Anyone can use the public contact form to offer to volunteer or teach, but the site lists no
    training dates, class times, or studio ages.
  what_to_expect: The site does not describe a first visit or what a session looks like. Volunteers help
    at programs and community events, and teaching artists learn the group's trauma-informed model from
    the group itself. The free Tones of Home concerts and the public Therapeutic Percussion programs are
    public ways to see the work first.
  first_visit_tips:
  - Email info@buildabridge.org or call 215.842.0428 to ask for current schedules, since the site lists
    none.
  - 'Use the contact form and pick the option that fits: volunteer, teaching artist, ambassador, or youth
    advisory board.'
  - Youth advisory board applicants are ages 15 to 22, and the board gives priority to youth from five
    listed ZIP codes.
