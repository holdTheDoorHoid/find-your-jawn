summary: A nonprofit that uses art making, including music, writing and painting, to help children and
  communities that have faced trauma. It runs youth studios and public programs, and it needs volunteers
  and teachers.
what_you_do: Volunteer, teach, become an ambassador or join the board through the get-involved page. Attend
  a public Therapeutic Percussion program, such as The Drummer's Journey, or sign up for the newsletter.
  The youth studios (music, writing and visual art) serve children and teens, and eligibility is not stated
  on the site.
