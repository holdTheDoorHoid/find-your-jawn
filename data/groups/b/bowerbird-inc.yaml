first_step:
  how: Attend a studio orientation or the Intro to Synths class on Oct 20, then email SoundLab@bowerbird.org
    to book studio time at least one week ahead.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: 'The studio says all experience levels are welcome and explains how to start: an orientation,
    an intro class, or the first 30 minutes of a first session.'
  what_to_expect: Studio time must be booked, in half-hour blocks up to two hours, and a studio manager
    is on site during open hours. After you sign up you receive an FAQ and sign a user agreement, waiver,
    and code of conduct. The studio has a range of synths, modular systems, a theremin, and small starter
    kits to try.
  first_visit_tips:
  - Email SoundLab@bowerbird.org at least a week ahead with a preferred time and a backup
  - Say whether you have done an orientation or an intro class
  - Park in the free Esperanza lot on Bristol Street, or take SEPTA routes 47, 53, or 4
