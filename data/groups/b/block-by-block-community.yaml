summary: A volunteer-run nonprofit that organizes cleanups against litter and illegal dumping across Philadelphia.
  It also hosts block parties and works with schools and businesses on clean streets.
what_you_do: Sign up for a listed cleanup on the Get Involved page, start a group cleanup of your own,
  or clean your own block and submit your bags through the trash form.
