first_step:
  how: Pick a listed cleanup on the Get Involved page, RSVP through the link on its event page, and meet
    at the posted spot.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The site says events are family-friendly and welcoming to all, and it explains how to join a
    listed cleanup, with an RSVP link on each event page.
  what_to_expect: A cleanup is a group outing at a posted spot and time. Organizers provide vests, gloves,
    tools, and water, and the group gives guidance on the work. The site does not say how long each cleanup
    lasts, so check the event page.
  first_visit_tips:
  - The site says you only need to bring your energy and commitment, since the group supplies vests, gloves,
    tools, and water.
  - The train tracks cleanup recommends ages 18 and up, so check each event page for age guidance.
  - The site gives no parking or transit details, so check the event page or ask the group before you
    go.
