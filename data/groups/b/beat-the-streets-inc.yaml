  newcomer_friendliness: 3
  basis: A first visit to the Mentoring Center is offered by email, and the site has a team finder, but
    the wrestling sign-up steps are not described.
  what_to_expect: The Mentoring Center pairs student athletes with near-peer role models, often from Drexel
    and Penn, for school help. The site does not say how long a first visit lasts or who attends it, so
    ask when you email.
  first_visit_tips:
  - Email or call (215) 454-2255 before you come, since the Mentoring Center's hours are not posted.
  - Sign up for the Mentoring Center list to hear about closures and schedule changes.
  - Ask the team or the office for practice times, since the site does not list them.
  - The main office and the Mentoring Center are at 3700 Market Street, Suite 300.
