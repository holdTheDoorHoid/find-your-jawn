summary: A sports and learning group that uses wrestling, mentoring, and tutoring to help student athletes
  in under-served parts of Philadelphia do well in school.
what_you_do: Students can join a wrestling team or use the Mentoring Center for school help. Mentors are
  often college student athletes from Drexel and Penn, and the group is also recruiting coaches.
