summary: An adult rowing club on Boathouse Row. People new to rowing take a short run of learn to row
  lessons in gig boats, and the club takes members after an application.
what_you_do: Take about five or six gig lessons with a coach, then row gigs on your own. Move to team
  boats after roughly 50 miles in a gig, and later to a more advanced shell with coaching. Members pay
  dues.
