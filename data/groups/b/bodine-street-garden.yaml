summary: Neighbors who share a community garden on South 3rd Street in Queen Village. The garden has no
  open plots, so new people join a long waiting list.
what_you_do: Join the waiting list for a plot. The site says the wait is 4 to 6 years, and the garden
  has no plots available now.
