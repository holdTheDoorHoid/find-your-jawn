first_step:
  how: Fill out the Waiting List Signup form on the Get Involved page, which asks for your name, email,
    and Philly neighborhood.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 1
  basis: The page says there are no plots available and the wait is 4 to 6 years, so a newcomer cannot
    get a plot for years.
  what_to_expect: The site does not describe open days, work days, or a first visit. Joining means getting
    on the waiting list, and the page does not say how or when people are contacted.
  first_visit_tips:
  - Have your Philadelphia neighborhood name ready for the form.
  - Questions that are not about the waiting list can go to the garden's email address or phone line.
