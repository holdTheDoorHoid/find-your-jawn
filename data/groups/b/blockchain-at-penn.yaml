first_step:
  how: Attend the education seminar in the fall or spring, no prior knowledge needed, and join the club's
    listserv for recruiting news through the link on its Penn Clubs page.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The Penn Clubs listing says the education seminar is available to all and needs no prior knowledge,
    and the club gives a listserv route for recruiting news.
  what_to_expect: The education seminar needs no prior knowledge and is aimed at people new to crypto
    and blockchain. The site does not say how long a session lasts, where it meets, or what it costs.
    Committee members get access to club-wide events and trips to conferences and hackathons.
  first_visit_tips:
  - Ask the club by email about the current seminar date and place before you come, since the club's events
    list was empty when checked.
  - This is a Penn student group, so ask first whether non-students can take part. The seminar itself
    is listed as open to all.
