first_step:
  how: RSVP for a free Thursdays on the Stoop Zoom session listed on the events page, then read the financial
    aid page before you register for a paid class.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Free public events and Zoom sessions are open to anyone who RSVPs, and the class FAQ says classes
    suit adults interested in creative writing. The site does not say beginners are welcome.
  what_to_expect: 'A free Thursdays on the Stoop session runs on Zoom from 4 to 5 pm, and the site asks
    attendees to follow its online code of conduct. Creative Coworking is quiet writing time: on Zoom
    your mic stays off during the silent work period. Paid classes typically have 7 to 15 students and
    need at least 7 to run, and if a class cannot run you get a full refund.'
  first_visit_tips:
  - RSVP through the link for the session you want, since most events and Zoom sessions need one.
  - Check the event page for each venue, because in-person venues differ in access.
  - Eligible students get at least 33% off list tuition, so ask before you pay for a class.
