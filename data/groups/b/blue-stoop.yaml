schedule:
  text: Free Thursdays on the Stoop sessions run on Zoom from 4 to 5 pm, listed through November 2026.
    Creative Coworking meets on Zoom about every other Wednesday from 3:30 to 5:30 pm. Fall classes are
    listed on the classes page.
