first_step:
  how: Read the writers guidelines, then email the editor named there for the kind of piece you want to
    pitch. Previews, interviews, and profiles go to the associate editor; reviews, features, and essays
    go to the editor-in-chief.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The writers guidelines say the publication welcomes new writers, suggests starting with previews
    and profiles, and explain how to pitch.
  what_to_expect: A pitch is a short email with an idea about an event, sent about a month ahead. If the
    editors accept it, you send one draft as a Word or Google doc, and the editors help shape ideas that
    are not fully formed. Previews run about 400 to 500 words and pay $50, and the guidelines suggest
    starting with previews and profiles.
  first_visit_tips:
  - Send drafts as a Word or Google doc, not a PDF, and send only one draft.
  - Pitch about a month before the event, not two or three months out.
  - Include at least one landscape jpg or png image with a caption and photo credit.
