summary: A Philadelphia area chapter of Zeta Phi Beta, serving the area since 1944. It runs fundraisers
  for health and community causes, including a St. Jude walk team, a bowling party and a supply drive.
what_you_do: Events labeled 2026 on the page include a St. Jude Walk team, a bingo afternoon, a bowling
  party, a March for Babies fundraiser, a period supply drive and a restoration fundraiser for the sorority's
  founder's house. Ticketed events use online ticket pages. The page does not say how a woman joins.
