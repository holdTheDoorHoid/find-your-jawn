summary: The farm at Bartram's Garden, a 50-acre public park in Southwest Philadelphia. Sankofa Community
  Farm grows food with an African Diaspora focus and invites volunteers to help with seasonal planting
  and outdoor work.
what_you_do: Work with farm staff on seasonal plantings and outdoor care such as weeding, cleaning, pruning,
  and light maintenance. No special skills are needed. Anyone under 18 may help alongside a parent or
  guardian.
