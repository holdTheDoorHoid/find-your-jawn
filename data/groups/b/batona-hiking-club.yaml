summary: A long-running hiking club that leads weekend hikes of about 5 to 15 miles at parks and trails
  around the region. Members also help maintain sections of the Batona, Horseshoe and Appalachian Trails.
what_you_do: Join a hike with a listed leader and check its length and difficulty before you go. Members
  can also join trail maintenance days, the annual dinner and a yearly hike and picnic.
