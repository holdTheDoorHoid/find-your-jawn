summary: A long-running hiking club that goes on short and long hikes in Pennsylvania, Delaware, Maryland,
  and New Jersey. Members carpool to trailheads, and experienced leaders run the hikes.
what_you_do: Join a short or long hike from the club's Meetup calendar, carpool with other members, and
  hike at the group's pace.
