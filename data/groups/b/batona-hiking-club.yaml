first_step:
  how: Join the club's Meetup group and sign up for a hike listed there.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Joining is open through a public Meetup page, and the 2025 article describes led hikes, but the
    club's own site could not be read.
  what_to_expect: Each hike has its own leader, meeting spot, distance, and description, and most cost
    $1. Some hikes cap the group at about 15 people including the leader, so RSVP early. Listings often
    suggest water, snacks, lunch, and hiking boots, and some warn about muddy or strenuous stretches.
  first_visit_tips:
  - The club uses no formal difficulty scale, so read the distance and the description to judge whether
    a hike fits you.
  - Bring water, snacks, lunch, and sturdy hiking boots, since listings often ask for them.
  - Ask the leader before you RSVP whether a first-time hiker or non-member may join.
  - Most hikes are outside the city, so plan your ride from the meeting spot on the listing.
