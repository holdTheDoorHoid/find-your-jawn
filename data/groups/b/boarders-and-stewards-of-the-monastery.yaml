summary: The nonprofit that runs Monastery Stables, six acres of working stables and historic buildings
  beside the Wissahickon. Volunteers and supporters help keep the grounds going, and the group runs programs
  that bring children and families to the horses.
what_you_do: Sign up through the Become a Volunteer page on the site, join the Friends of Monastery Stables,
  or buy tickets for public events such as Lantern Night.
