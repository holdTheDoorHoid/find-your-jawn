first_step:
  how: Register for a Second Saturday workday at loveyourpark.org/volunteer/secondsaturdays, using the
    sign up link on the event you choose.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The Second Saturdays page says no experience is needed, all are welcome, and each workday has
    its own sign up link.
  what_to_expect: A workday starts at 10 am and runs about two hours in a city park. You might plant trees,
    pull invasive plants, or clean up trash and waterways, and some events supply tools and gloves. Nobody
    needs experience to join in.
  first_visit_tips:
  - Sign up on the event page first, since each month's workday is in a different park.
  - Bring water, because some parks have no restrooms.
  - Check the event page before you go, since the Cobbs Creek workday is canceled in heavy rain, thunder,
    or severe weather.
