cost:
  level: low
  text: The pages we read list no fee to volunteer. Foster homes pay for food, litter, and daily care,
    and the rescue covers vet costs for problems. Adoption fees are $150 for one adult cat, $225 for two
    adult cats, $175 for one kitten, and $275 for a pair of kittens, and they are not refundable.
