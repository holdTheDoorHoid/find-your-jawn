first_step:
  how: Fill out the online foster application linked from the Foster page, or the online adoption application
    if you want to adopt. To ask about volunteering, use the contact form or email brendasrescues@gmail.com.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Fostering and adopting both need a written application, and meeting cats happens only after approval;
    the volunteer roles are listed, but the way to start them is a contact form or email.
  what_to_expect: After an adoption application is approved, the rescue arranges a meet and greet with
    the cat at the foster home. A foster keeps a cat for several weeks to several months, provides food,
    litter and daily care, and has vet costs covered for any problems.
  first_visit_tips:
  - Foster applicants must be at least 25 to be the main caretaker.
  - Adopters must be at least 21 and employed, self-employed or retired, and need a veterinarian reference
    and three personal references; incomplete applications are not processed.
  - Adoption preference goes to people living within one hour of Philadelphia.
