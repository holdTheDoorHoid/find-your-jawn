summary: An all-volunteer rescue for stray and abandoned cats. Cats live in foster homes until they are
  adopted, and the rescue also traps, neuters and returns feral cats from colonies.
what_you_do: Foster a cat, adopt from the adoptable list, or help by socializing shy cats, driving cats
  to vet visits, or working at adoption events. Donations go through PayPal or Venmo, and the site also
  lists a barn cat program.
