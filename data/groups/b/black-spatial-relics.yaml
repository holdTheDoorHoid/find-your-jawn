summary: An arts project that supports emerging and mid-career artists, especially Black artists, with
  residencies, grants, and gatherings. Much of its work is new performance about slavery, justice, and
  freedom.
what_you_do: Join the newsletter to hear about open calls and public events. Artists apply to the artist
  in residence program, the Conjure Council fund, or the micro grants when a call is open. The 2025 Conjure
  Council nominations closed in December 2025, so watch the newsletter for the next call.
