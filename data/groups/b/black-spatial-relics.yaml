first_step:
  how: Join the newsletter from the Join Newsletter link on the site. Then ask by email (blackspatialrelics@gmail.com)
    which public events are coming, since the Upcoming Events page lists only a 2023 event.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The newsletter is open to anyone, but the site lists no current public event and does not say
    how to register for one, so the way in is unclear.
  what_to_expect: The site does not describe a typical event, so check each listing for time, place and
    cost. Some past events were set aside for Black participants, and the Conjure Council fund is for
    artists and cultural workers who are descendants of the African Diaspora. The 2023 lab that appears
    on the events page was free.
  first_visit_tips:
  - Check whether an event is open to the public before you RSVP.
  - Email blackspatialrelics@gmail.com with questions about who can attend.
