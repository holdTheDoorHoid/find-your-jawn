first_step:
  how: Read the About page (the New? link on the site) to learn how a first run works, then sign up for
    the weekly trail email from the Mail link.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The site has a New? page that explains a first run and says all paces are welcome, and the trails
    are set to suit slower runners.
  what_to_expect: Expect about 1 to 1.5 hours and 3 to 5 miles, at any pace, in any weather. The run ends
    at a bar, where the group gathers and sings afterward, and beer is central to the group.
  first_visit_tips:
  - Bring $10 in Hash Cash and photo ID.
  - Bring a headlamp; the site calls it a cranium lamp.
  - Dress for the weather, since runs go in any weather.
  - Check the weekly trail email, because the meeting place changes from trail to trail.
