summary: Any Philadelphia resident can become captain of their own block. You collect signatures from
  neighbors on a petition, then organize block cleanups and help with the street's upkeep with the Philadelphia
  More Beautiful Committee.
what_you_do: Keep sidewalks and gutters clear, plant flowers and new street trees, help neighbors with
  fix-up projects, host block parties, and remind people about pickup days.
