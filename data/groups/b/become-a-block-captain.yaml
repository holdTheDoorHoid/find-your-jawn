first_step:
  how: Call the Philadelphia More Beautiful Committee at (215) 685-3971, or use its online form, to ask
    for a clean block petition, which is mailed to you.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: 'Any resident can start, and the city lays out a clear sequence: request the petition, collect
    signatures, then mail it back.'
  what_to_expect: Expect paperwork first. You need signatures from at least 51 percent of the residents
    on your block, with one adult signature per household, and then you mail the completed petition back.
    A clean block officer then contacts you to get started. You can also ask whether your block already
    has a captain.
  first_visit_tips:
  - Call before you collect signatures to find out whether your block already has a captain.
  - Start talking to neighbors early, since the petition needs at least 51 percent of residents to sign.
  - Leave time for the petition to be mailed back and reach the committee.
  - Plan on three organized cleanups over the summer, with tools and supplies from the committee.
