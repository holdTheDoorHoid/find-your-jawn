first_step:
  how: Come to the Wednesday or Friday 10 am playgroup at 1542 E Montgomery Ave, using the alley entrance
    and then the stairs.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The playgroups are open to all families on posted weekly times with no registration listed, and
    the page says to come as you are. It does not say newcomers are specifically welcomed.
  what_to_expect: Playgroup is loosely planned, with free play, circle time, and a snack, and adults can
    get coffee or tea. Parents, grandparents, and caregivers come along, and the sessions last about an
    hour and a half. Staff and other parents share parenting tips while the children play.
  first_visit_tips:
  - Bring a $5 donation if you can; it is suggested, not required.
  - Walk down the alley, go through the white doors, and climb the stairs to the playgroup space.
  - Street parking is usually available during the day.
