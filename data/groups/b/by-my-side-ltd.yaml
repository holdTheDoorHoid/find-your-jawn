summary: A parenting group in Fishtown that runs open playgroups, so families with babies and young children
  can play, learn and meet other parents.
what_you_do: Bring your little one to the Monday baby group (for children 12 months and under, older siblings
  welcome) or the Wednesday or Friday morning playgroup (for children birth to five, older siblings welcome)
  to play and talk with other families. The playgroup asks for a suggested $5 donation.
