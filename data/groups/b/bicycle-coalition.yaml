summary: A cycling team program for teens ages 12 to 18, run by the Bicycle Coalition of Greater Philadelphia.
  Riders start in a Core program at partner sites, then can move up to All Star teams in road, mountain
  bike, race, triathlon, or cyclocross.
what_you_do: Riders go to practices and events such as group rides, and can join a youth advisory council.
  Volunteers help at events, join practices, and keep athletes' bikes in good shape through the BCYC Pit
  Crew and Pedal Partner roles. The group pays its coaches and does not require racing experience for
  them.
