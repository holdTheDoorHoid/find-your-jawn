first_step:
  how: Fill in the online youth application linked from the program page. Staff follow up about team placement.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: A public online application comes first, and the page does not describe a first practice. The
    Core level is the entry point for new riders, which helps, but the application comes before any contact.
  what_to_expect: Riders begin in the Core program at one of eight partner sites, with practices and events
    such as group rides. Moving up to an All Star team, which runs in summer and fall, takes meeting attendance
    goals and passing written and on-bike tests, according to a 2024 post on the group's site. All Stars
    can take a bike home while they stay active in the program.
  first_visit_tips:
  - Ask staff which partner site is closest to you when they follow up about placement.
  - Email habib@bicyclecoalition.org or call 215-242-9253 with questions about the program.
  - If you would rather help first, use the volunteer interest form on the volunteer page.
