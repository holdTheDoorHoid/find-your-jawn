first_step:
  how: Call 267-270-5609 or use the Register Now button on beyondtheexteriorinc.org, and name the workshop
    you want.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: There is a sign-up form, but the pages show no dates, prices, or group sizes for workshops, so
    it is hard to tell what a visit is like.
  what_to_expect: Workshops and trainings are group sessions on topics such as mental health first aid,
    financial literacy, and life skills, and some are built for schools or agencies. The site does not
    give session lengths, group sizes, dates, or prices, so ask before you sign up.
  first_visit_tips:
  - Name the workshop you want when you call, since the site lists most of them by title only.
  - Ask how long a session runs, whether it is in person, and whether there is a fee.
  - Ask who a workshop is for, since the site gives few age ranges.
