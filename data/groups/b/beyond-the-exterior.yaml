summary: An advocacy group that offers support, education, and workshops for people of all ages. Its programs
  cover mental health and well-being, life skills, leadership, and money skills, and it says it has served
  communities for more than 20 years.
what_you_do: Use the Register Now button or the workshop form on beyondtheexteriorinc.org, or call 267-270-5609,
  to ask which workshop fits you. Workshop topics include mental health first aid, financial literacy,
  trauma awareness, and a teen session that sorts facts from myths about health and relationships.
