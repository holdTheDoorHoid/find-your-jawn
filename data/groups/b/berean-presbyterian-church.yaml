  what_to_expect: Sunday worship is at 11 am at the church building on North Broad Street, and it is also
    streamed live on Facebook. The site does not say how long a service runs, whether there is a children's
    program, or what it costs, so the contact form is the best place to ask.
  first_visit_tips:
  - The church is at 2101 North Broad Street, at the corner of Broad and Diamond streets.
  - The site does not describe parking or transit, so check your route before you go.
  - The 11 am stream is on Facebook Live. The site says you may need to send the pastor a Facebook friend
    request to see it.
