summary: A Philadelphia nonprofit theater company that stages affordable plays to reach new audiences.
  It holds open auditions for a short play festival made of staged readings.
what_you_do: Non-union actors can audition for the short play festival, which pays a $50 stipend. Rehearsals
  and performances are in Philadelphia, including at a church in Germantown. The site does not list classes
  or volunteer jobs.
