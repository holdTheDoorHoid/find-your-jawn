first_step:
  how: Go to the Sunday noon Sunny Sunday D ride at the Azalea Garden formal entrance, behind the Art
    Museum. The club calls it a casual ride for people new to group riding. Non-members can ride, and
    you can join the club later through its Join BCP link.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 5
  basis: The club runs a beginner class on the second Sunday of the month (March to October) and a casual
    introductory Sunday ride, and it says non-members are welcome on rides.
  what_to_expect: Rides are grouped by speed, and the club tells newcomers to start a level below what
    they expect. Listed times are departure times, so arrive 10 to 15 minutes early. A volunteer ride
    leader picks the route, and the helmet rule applies on club rides.
  first_visit_tips:
  - Wear a helmet. The club requires one.
  - Bring a flat repair kit, a frame pump, water, and ID.
  - Arrive 10 to 15 minutes before departure.
  - Check the ride's meeting spot on the calendar, since spots vary by ride.
