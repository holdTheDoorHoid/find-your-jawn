schedule:
  text: Rides run on a published ride calendar on most days of the week, at all speeds. Sunday rides leave
    at 12 noon from the Azalea Garden entrance behind the Art Museum. The club meets on the second Wednesday
    of the month at 6:30 pm, unless noted otherwise.
