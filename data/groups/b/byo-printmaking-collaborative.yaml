first_step:
  how: 'Come to a First Friday open studio, 5 to 8 pm, at 12 N 3rd St, #5, and ask a member about making
    your first print. For a visit at another time, email byostudio.philly@gmail.com.'
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The studio says it is happy to teach newcomers, has a Learn with us section for a first print,
    and opens First Fridays to the public. There is no set beginner class, and membership needs an application.
  what_to_expect: First Fridays run 5 to 8 pm. An October 2026 listing describes the evening as an open
    studio with collaborative making, so you can see the studio in use and join in with others. Visit
    costs are not listed, and visits at other times need an appointment.
  first_visit_tips:
  - For a visit outside First Fridays, email the studio first, since those visits are by appointment.
  - Check the calendar page before you go, because the events listed there change.
  - 'The studio is in Old City at 12 N 3rd St, #5. The pages do not give parking or transit details.'
