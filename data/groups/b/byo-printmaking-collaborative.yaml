summary: A printmaking studio in Old City with equipment for screen printing, etching, relief printing,
  and book arts. Members share the studio, and the public can visit it on First Fridays.
what_you_do: Visit on First Fridays (5 to 8 pm) or book another visit, learn from a member or get a lesson
  for a fee, or apply for a studio membership.
