first_step:
  how: Buy a ticket for a concert listed on the performances page, or email michele@blackpearlco.org to
    ask when the next open rehearsal is.
  drop_in: false
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Concerts are open to anyone, and the ticket route is clear online. The open rehearsal welcomes
    all ages, but the site gives no dates or place, so you must email to ask.
  what_to_expect: A concert is a ticketed performance, and you buy tickets online before you go. At an
    open rehearsal you watch musicians work through the music and see how the conductor leads. Sometimes
    audience members get to conduct the orchestra live.
  first_visit_tips:
  - Buy concert tickets online through the link on the concert page.
  - Email michele@blackpearlco.org before an open rehearsal to confirm the date and place.
