summary: 'A Philadelphia chamber orchestra that plays concerts and runs hands-on programs: a conducting
  class for young people, open rehearsals, and a leadership session for business teams.'
what_you_do: Buy a ticket for a concert on the performances page, attend an open rehearsal when one is
  scheduled, or join a program. iConduct! is for young people in Philadelphia public schools. Orchestrating
  Leadership is a live rehearsal for executives and their teams, led by the conductor.
