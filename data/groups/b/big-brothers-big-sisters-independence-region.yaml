summary: A mentoring agency for Philadelphia and six nearby counties in Pennsylvania and New Jersey. Adult
  volunteers, called Bigs, spend regular time with one child through a one-to-one mentoring program.
what_you_do: 'Bigs take part in one-to-one mentoring through one of several programs: community-based
  mentoring, site-based mentoring, Beyond School Walls, an LGBTQ+ program, or POWER Up. A visit lasts
  about two hours, at least twice a month. Bigs must be 21 or older.'
