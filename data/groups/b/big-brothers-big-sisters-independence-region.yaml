summary: A mentoring agency for Philadelphia and six nearby counties in Pennsylvania and New Jersey. Adult
  volunteers, called Bigs, spend regular time with one child through a one-to-one mentoring program.
what_you_do: Bigs take part in one-to-one mentoring through one of several programs. Community-based mentoring
  means outings with a child who is picked up at home. Site-based mentoring happens at a site. Beyond
  School Walls is one-on-one time during the school day with mentors from partner companies. The LGBTQ+
  programs include school groups and Rainbow Bigs. POWER Up is staff-led mentoring in partner schools.
  A visit lasts about two hours, at least twice a month. Bigs must be 21 or older.
