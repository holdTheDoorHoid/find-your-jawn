summary: Neighbors in Brewerytown and Sharswood who review zoning requests for nearby building projects.
  Each month they hold a Zoom meeting where residents hear from applicants and vote, then they send the
  Zoning Board of Adjustment their position.
what_you_do: The zoning committee reviews building projects between 19th and 33rd streets, from Cecil
  B. Moore Avenue south to Girard Avenue, hears from applicants, and sends the Zoning Board of Adjustment
  its position. Residents who register can comment and vote on each request.
