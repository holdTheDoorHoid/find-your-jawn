first_step:
  how: Register in advance for the next Zoom community zoning meeting, using the web form, email, or phone
    number on the zoning page, then join on the third Thursday evening.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The zoning page says any neighbor can register to attend and comment, with three ways to sign
    up, but it does not say newcomers are specially welcomed.
  what_to_expect: The community meeting runs on Zoom from 6:30 to 8:30 pm. Applicants present a project,
    and registered neighbors can ask questions or comment for up to two minutes each. Each registered
    person gets one vote per project, and any vote made after the session ends does not count.
  first_visit_tips:
  - Register ahead using the web form, email, or phone number on the zoning page.
  - Have your name, phone number, and address ready, since the sign-up asks for them.
  - Keep comments short, because each one is limited to two minutes.
  - If you join by phone, you will get voting instructions during the meeting.
