first_step:
  how: Use the Contact Us form on mybetfamily.com to ask which after school or youth program has openings
    now, and how to sign up.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The after school program is described in plain terms, but the site gives no days, times, ages
    or sign-up steps, Lady BET needs an application and a recommendation letter, and the only contact
    route is a form.
  what_to_expect: The after school program offers homework help, tutoring, computer access, and a set
    place to study. It also gives a supervised place for kids to wait until a parent gets home, and students
    can bring a friend. Teachers can refer students who are struggling or need to stay after school, and
    they can ask for proof of attendance.
  first_visit_tips:
  - Ask the contact form for days, times and cost before you go, since the site does not list them.
  - For Lady BET, ask how to get the BET youth application and the adult recommendation letter form.
