summary: A veteran-led community for veterans and their families, with peer support, education and wellness
  resources on topics such as the transition out of military service and suicide prevention.
what_you_do: Sign up for the free online community through the website or the app. Members use a private
  platform for live and recorded education sessions, peer discussion spaces, and wellness resources. Its
  programs cover movement, mental wellness, and education on cannabis and psychedelic-assisted approaches,
  and its events page lists runs, retreats, and social gatherings.
