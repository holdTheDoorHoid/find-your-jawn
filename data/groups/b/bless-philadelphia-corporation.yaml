first_step:
  how: Use the 'I'm interested' button on the volunteer page, or send a message on the Contact page, and
    name the role you want, such as the Wednesday pantry or the ESL classes.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Five volunteer roles are listed, the pantry and showers run on set weeknight hours, and free
    events list a registration form, though the sign-up form itself did not appear in the text I read.
  what_to_expect: A volunteer might pack and hand out food at the Wednesday pantry, help guests use the
    showers, or teach English or GED classes on weekday evenings. The site does not give shift lengths
    or how many hours a month volunteers give, so ask about that first. Pantry food and showers are free
    for people who come to them.
  first_visit_tips:
  - Ask which shift fits, since the site does not list hours for each volunteer role.
  - Expect Monday morning deliveries and weekday evening classes if you pick those roles.
  - Watch the events list for free sessions, which give a registration link.
