summary: Neighbors and community leaders who run a weekly food pantry and shower service, hold block cleanups,
  ran a holiday toy drive, and offer mental health first aid training. Their work on violence prevention
  and job readiness is still mostly in planning.
what_you_do: Help pack and hand out food at the Wednesday evening pantry, help guests use the showers,
  deliver food on Monday mornings, teach English or GED classes on weekday evenings, or pick up litter
  on block cleanups. The group also hosts events and runs community drives.
