summary: Neighbors who share the work of a community garden at Master Street and North 27th Street. Members
  tend plots and help with the season's work, and the garden also runs free family programs on Sundays
  in summer.
what_you_do: Gardeners share the season's work, about half a day a month per household. Plots are full
  for the 2026 season, and the wait list is open to residents of 19121 and nearby Fairmount. The garden
  also runs family programs on Sundays from June through September.
