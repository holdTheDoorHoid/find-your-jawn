summary: A fall course for young professionals who want to learn nonprofit board service. It covers governance,
  fundraising and finance, and ends with a meeting with Philadelphia nonprofits looking for board members.
what_you_do: Attend the course sessions, hear from current board members, and connect with nonprofits
  seeking candidates at the graduation.
