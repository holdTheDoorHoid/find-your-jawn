    and in another that it is open until September 1, and that date has passed.
  what_to_expect: The course covers board governance, strategic planning, fundraising, finance, and the
    legal and ethical duties of a board member. It is for young professionals who want to join a nonprofit
    board or already sit on one, and participants must be at least 21. The course closes with a graduation
    night where organizations recruit new board members.
  first_visit_tips:
  - You must be 21 or older to take part.
  - Watch for the next application window, since the fall 2026 window has closed.
