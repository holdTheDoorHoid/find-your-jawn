summary: A nonprofit that uses music to help Philadelphia youth build skills and confidence, running music
  labs at schools, shelters and community sites.
what_you_do: Young people can sign up for music lessons (bass, drums, guitar, piano or recording) or join
  a youth program such as the Practical Producers Program, the Student Driven Music Academy or the Student
  Teacher Program. Adults can volunteer or donate, and the public can attend student performances and
  youth music showcases.
