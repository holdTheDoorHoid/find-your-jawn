summary: A Presbyterian congregation on East Cumberland Street that describes itself as LGBTQIA+ affirming
  and family-friendly. It holds a worship service and a free community dinner on the first Sunday of each
  month.
what_you_do: Come to the first-Sunday service and stay for the free dinner, volunteer through the Get
  Involved form, or ask about membership by email.
