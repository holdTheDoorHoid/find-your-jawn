first_step:
  how: Come to the 5 pm service on the first Sunday of the month, or email info@thewordatbeacon.org to
    ask about a visit before you come.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The church says visitors are welcome and explains what a first visit looks like, including a
    bulletin handed out on arrival.
  what_to_expect: The service runs about an hour and ten minutes and includes songs, Bible readings, a
    sermon, prayer, and weekly communion. The room is medium-sized, with pews in a half circle around
    the altar, and usually 10 to 15 people attend. Children stay for the whole service, with a children's
    lesson, activity bags, a playroom, and a nursery available. The dinner is free, and you may bring
    a dish to share if you like.
  first_visit_tips:
  - When you arrive, you will be handed a bulletin that outlines the service.
  - Dress however you are comfortable, from formal to casual.
  - Bring a dish to share for the dinner if you like.
  - Children have their own lesson, a playroom, and a nursery, so families can plan around them.
