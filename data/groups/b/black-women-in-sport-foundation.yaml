summary: A nonprofit that works to get Black women and girls into sport. Its youth program offers after-school
  sports and academic enrichment for girls, and it gives college scholarships each year.
what_you_do: Girls take part in after-school and summer sports such as fencing, tennis, lacrosse, and
  soccer, at schools and recreation centers. Volunteers can coordinate a local activity, help run a fundraiser,
  staff an event table, or mentor, tutor, or coach in a program.
