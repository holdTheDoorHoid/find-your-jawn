  what_to_expect: Youth sessions mix sports such as fencing, field hockey, golf, and softball with academic
    enrichment, and they focus on confidence and healthy habits. The group provides equipment to students.
    The site does not say how long a session lasts, how many girls attend, or what it costs, so ask when
    you get in touch.
  first_visit_tips:
