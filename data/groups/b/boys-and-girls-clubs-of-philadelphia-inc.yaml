first_step:
  how: Find the club nearest you on the club locations page and call its phone number to ask how a child
    signs up.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The site lists clubs, phone numbers, and a volunteer email, but gives no sign-up steps, fees,
    or program ages, so the way in is not published.
  what_to_expect: The site does not describe a first visit. Arts programs such as ImageMakers and the
    National Fine Arts Exhibit are for Club members ages 6 to 18 and run year-round, and Kids Cafe serves
    youth ages 5 to 18 who are low-income, at risk, or food insecure.
  first_visit_tips:
  - Call the club nearest you before you go, since the site lists no hours for the clubs.
  - Ask what membership costs and what a child needs to bring to join.
  - Ask whether your child must be a Club member to take part in an arts program.
