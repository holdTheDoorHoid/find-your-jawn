summary: A youth club organization in Philadelphia neighborhoods, offering preschool, after-school and
  teen programs at clubhouses such as Bridesburg, Northeast Frankford, Germantown and Wissahickon.
what_you_do: Children take part in after-school, preschool and teen activities at a neighborhood clubhouse.
  Programs include Kids Cafe meals, literacy, STEM, sports, and arts. Adults and groups who want to volunteer
  email the office with their group size, their interest, and the dates they can help.
