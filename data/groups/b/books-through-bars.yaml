summary: A volunteer-run group that sends free books to people in prison who write asking for them. Its
  office is on Baltimore Avenue in West Philadelphia.
what_you_do: Read request letters, pick library books that fit each request, pack and mail the packages,
  and help with letter logs, donation drives, and library work. New volunteers start at an orientation.
