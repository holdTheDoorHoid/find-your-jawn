summary: A ministry on South Broad Street in Center City that serves a sit-down weekday lunch to hundreds
  of guests, runs a clothing boutique, and offers personal care items. It was formerly Broad Street Ministry.
what_you_do: Help serve lunch at tables, handle mail or phone support for guests, work the clothing boutique,
  or pack personal care items. Each shift starts with an orientation and role training and ends with a
  debrief. Expect to be on your feet for most of a shift.
