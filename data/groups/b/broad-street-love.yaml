first_step:
  how: Sign up for a meal service shift on the volunteer calendar at broadstreetlove.volunteerhub.com/vv2/.
    If you are under 18, email volunteer@broadstreetlove.org first, because the pages give two minimum
    ages.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Shifts are open to the public through a sign-up calendar, and every shift begins with an orientation
    and role training. The pages do not say beginners are welcome.
  what_to_expect: A shift runs from 10:15 am to 2 pm on a weekday and starts with orientation. In meal
    service you greet guests, serve lunch at tables in restaurant style, bus tables, or help with cleanup,
    depending on the day. Each shift ends with a debrief.
  first_visit_tips:
  - Arrive by 10:15 am, when the shift and orientation begin.
  - If you come as a group, or need school or court-mandated hours, contact the team before you sign up.
  - Take the Walnut-Locust station, or plan for limited on-street parking.
  - Cancel your slot online if your plans change.
