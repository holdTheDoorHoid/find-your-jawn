first_step:
  how: Call 267-742-7325 or email Admin@BuildingBrighterFuture.org on a weekday between 9 am and 4 pm
    to ask how to help with Care Kits or events.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The site lists donations, sponsorships, and office contact details, but it has no volunteer steps,
    sign-up process, or current event listings.
  what_to_expect: The site does not say what a helper does at an event, how long a shift lasts, or where
    to drop off Care Kit supplies. The events it lists so far were holiday gatherings from 5 to 7 pm in
    2024, so the donation page is the clearest way to help right away.
  first_visit_tips:
  - Ask the office for the Care Kit drop-off address and days before you bring supplies, since the site
    does not list them.
  - Ask whether volunteers need a background check or training.
  - Office hours are Monday to Friday, 9 am to 4 pm, and phone messages are taken on holidays.
