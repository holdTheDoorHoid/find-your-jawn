summary: A United Methodist congregation in Germantown that describes itself as a Reconciling Congregation,
  hosts a neighborhood meal with the Germantown Community Fridge, and holds a back to school drive.
what_you_do: Come to Sunday worship in person or online, join the Wednesday Bible study on Zoom, come
  to a Neighbor Table meal or the back to school drive, or ask about the women's and men's groups.
