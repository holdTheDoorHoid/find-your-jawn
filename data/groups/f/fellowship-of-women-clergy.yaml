  what_to_expect: The group describes its gatherings as a place for leadership training, support, and
    fellowship among women in ministry. Monthly gatherings happen on Zoom, and in-person ones are held
    in Philadelphia four times a year. The site does not say how long a gathering lasts, what it costs,
    or whether women who are not clergy may come, so ask before you RSVP.
