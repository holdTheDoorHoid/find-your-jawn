summary: Neighbors who support Clark Park in West Philadelphia. They push for the park upgrades the City
  approved, such as nature-based playgrounds and a permanent restroom, and they host events such as Parktoberfest.
what_you_do: Volunteers help with gardening, social media outreach, and tabling at the Saturday farmers
  market. Members pay yearly dues, and anyone can ask for access to the online board meetings.
