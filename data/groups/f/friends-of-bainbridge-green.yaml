  basis: Cleanups are public Love Your Park days, and the group says anyone can ask by email to join its
    volunteer list.
  what_to_expect: 'Volunteer days are hands-on work on the green: cleaning, planting and painting. The
    pages do not say how long a day runs or what to bring, so ask by email before you come. Volunteering
    is free.'
  first_visit_tips:
  - Email first to confirm the day and start time, since the group's pages list only the Love Your Park
    dates.
  - The QVNA events page at qvna.org/events lists each Love Your Park date with its start time.
  - Bainbridge Green runs along Bainbridge Street between 3rd and 5th Streets, with seating at the corners.
