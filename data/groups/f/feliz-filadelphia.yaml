first_step:
  how: Fill in the online soccer registration form, or sign up in person at Hammond Fields. The fall baseball
    sign-up closed August 23, 2026, so email info@felizfiladelfia.org about other seasons.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Sign-up pages are public, soccer takes online or in-person registration, and the group lists
    an email contact. The baseball window has closed for the season, and the site describes no volunteer
    or coaching route.
  what_to_expect: Soccer practices meet on Mondays and Wednesdays from 4:45 to 6 pm at Hammond Fields.
    The registration form asks for the child's details, school, medical concerns, pickup people, and a
    waiver, and the page does not describe tryouts or the first practice.
  first_visit_tips:
  - Have the child's birth date, school, and grade ready for the form
  - Be ready to list who can pick the child up
  - Accept the waiver and photo release, which the form requires
  - Ask by email which team or age group your child fits
