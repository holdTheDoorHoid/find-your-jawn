summary: A Presbyterian congregation in Olney with Sunday worship, a weekly Wednesday Bible study, and
  a women's group that is collecting clothing and supplies for a foster family closet.
what_you_do: Join Sunday worship or the Wednesday Bible study, both at 11 am, take part in the women's
  circle groups or the men's Bible study, or donate to a drive. Youth and senior groups also meet through
  the church.
