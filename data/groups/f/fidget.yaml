summary: Fidget Space is an arts space on North Mascher Street where artists rehearse and perform. It
  hosts evening shows of experimental music, dance and poetry, plus regular meetups for electronic music
  makers and free discussions.
what_you_do: Go to an evening show or a meetup, join a free Fidget Forum talk, rent the space for your
  own practice, or ask about artist residencies and the bartering program.
