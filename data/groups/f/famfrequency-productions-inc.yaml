summary: A Philadelphia nonprofit that prepares young people for careers in music and the creative economy.
  Its 15 Month Fellowship takes Philadelphia high school students in grades 9 to 12, and it also runs
  Spin Academy, FAMCON, and The 808.
what_you_do: Philadelphia high school students in grades 9 to 12 can apply to the 15 Month Fellowship,
  which takes applications each spring. The fellowship includes workshops, internships, performances,
  and mentoring. Spin Academy, FAMCON, and The 808 are listed without details.
