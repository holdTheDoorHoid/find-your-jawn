summary: Neighbors who care for Saylor Grove and the stormwater wetland that feeds Monoshone Creek. They
  keep the area clean and safe and run nature and art education programs.
what_you_do: Come to a spring or fall Love Your Park cleanup to weed, pick up litter, and help with a
  plant sale. Bird talks are often part of these days.
