first_step:
  how: Come to the next spring or fall Love Your Park cleanup at the wetland. Get the date from the group's
    Facebook page or news page, or ask through the contact form on its website. The spring 2026 post asked
    volunteers to register through a GivePulse link.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The group invites neighbors to its cleanups, announces them on its blog and Facebook page, and
    has a contact form. The posts do not describe a first-timer process.
  what_to_expect: A cleanup runs about two hours and can include weeding, litter pickup, native plant
    work, and a plant sale. A bird talk is usually part of the day, and the spring 2026 post says tools
    and bags are provided, with coffee, water and donuts for volunteers. The posts do not say what to
    wear or bring.
  first_visit_tips:
  - Check the Facebook page or the news page for the next date, since each cleanup is posted separately.
  - Register through the GivePulse link on the cleanup post if one is offered.
  - Ask through the website's contact form what to wear and bring, because the posts do not say.
