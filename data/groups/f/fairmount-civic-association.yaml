summary: The neighborhood group for Fairmount. It shares local news, follows zoning and development plans,
  and hosts community events such as Neighbors Nights and a fall stoop sale.
what_you_do: Members meet monthly to talk over zoning and development. Committees cover activities, crime
  and safety, education, neighborhood cleanups, membership, parking and transportation, and zoning. Membership
  dues are $15 a year for one adult.
