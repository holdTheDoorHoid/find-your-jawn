first_step:
  how: Sign up for the newsletter on the FCA site to get the link and details for the next monthly meeting,
    then come to the meeting on the last Thursday at 7 pm at The City School, 860 N. 24th St.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: The FAQ suggests joining is the way to take part in meetings and events, and dues are $15 or
    more. The page does not say whether non-members can attend. The newsletter gives the meeting link,
    which is a clear first step.
  what_to_expect: Meetings open with a social at 7 pm, and the business meeting starts at 7:30 pm. Members
    can vote at monthly meetings if their membership is valid the day before. The group reviews zoning
    and development plans in the area, and the page does not say whether a non-member can speak.
  first_visit_tips:
  - Sign up for the newsletter first, since meeting links go to subscribers.
  - Pay dues by the day before a meeting if you want to vote there; paying at the meeting does not make
    you eligible for that meeting.
  - Arrive by 7 pm if you want the social before the business meeting.
