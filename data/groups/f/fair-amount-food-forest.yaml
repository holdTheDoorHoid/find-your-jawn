summary: A community food forest in Fairmount Park where neighbors plant, tend, and harvest together,
  with plant walks, cooking and preserving workshops, and a farmers market.
what_you_do: Join a planting or tending session, or come to a free workshop on herbs, preserving, pruning,
  or fruit trees. Vendors can apply to sell at the farmers market.
