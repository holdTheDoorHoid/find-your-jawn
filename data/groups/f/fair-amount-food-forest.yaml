first_step:
  how: Come to the first Saturday work party at 10 am, or walk in to a workshop; the events page says
    walk-ins are always welcome, though workshop supplies are limited to 25 people.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The volunteer page says newcomers can join and that all ages and experience levels are welcome
    to the first Saturday program, and the events page says walk-ins are always welcome. No beginner day
    or orientation is listed.
  what_to_expect: Work parties run on the first Saturday of the month from 10 am to 3 pm and include a
    guided harvest. Volunteers are asked to dress for the weather and bring their own water bottle. Workshop
    supplies are limited, with priority for people who registered in advance, so arriving early helps.
  first_visit_tips:
  - Dress for the weather and wear sturdy footwear
  - Bring your own water bottle
  - Arrive by 10 am for the first Saturday work party
  - Do not pick plants or fruit on your own outside a staffed program
