first_step:
  how: Sign up for the free barn mailing list, which carries barn news and volunteer openings, or email
    barnmanager@courtesystable.org to ask about a lesson
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Lessons are booked by email and held until a slot opens, and the site gives no volunteer dates,
    so the way in is unclear.
  what_to_expect: A lesson is one hour, either private or shared with other riders, and you choose how
    often you ride. Before you ride you must sign the rider release form, which you can download and complete
    ahead of time. Riders under 15 need a parent or guardian on site, and lesson payment is due the day
    of the lesson, by cash or check, unless paid in advance.
  first_visit_tips:
  - Wear hard-soled shoes with a heel.
  - Bring a helmet, or ask to borrow one, since a helmet is required whenever you are mounted.
  - Download and complete the rider release form before you arrive.
  - Plan for parking, which is both on-street and off-street.
