summary: A nonprofit that runs a riding stable near the Wissahickon in Fairmount Park, offering riding
  lessons, leasing, and boarding. It also holds monthly volunteer days for barn and park upkeep.
what_you_do: Come to a volunteer day, which the site describes as monthly with no dates posted, to help
  with park and barn work. You can join the free barn mailing list for volunteer openings, or take riding
  lessons. The riding page lists trail rides only as a perk of a lease, and leasing is open to current
  students.
