summary: Neighbors who want the woods at Wister Woods Park kept clean, open and easy to walk. They held
  a litter cleanup in May 2023 and set goals for trails, invasive vines and litter, but we found no newer
  activity.
what_you_do: Litter cleanups around the park edges and the woods. The 2023 goals include a looped trail
  and clearing invasive vines.
