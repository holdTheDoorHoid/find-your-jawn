  basis: The park is public and there is a volunteer form, but the group publishes no meeting days or
    times and recruits through its Facebook group, so the way in is unclear.
  what_to_expect: Volunteers take part in park cleanups and beautification work, and the group joins the
    City's Love Your Park cleanups. Meetings come about every two months, and more often during special
    projects, but the site gives no days, times or location. The site lists no cost, so ask the group
    what to expect before you come.
  first_visit_tips:
  - Email info@qvna.org, the Queen Village Neighbors Association's general address, to ask for the next
    meeting or cleanup.
  - QVNA's mailing address is 709 S 5th Street, if you prefer to write.
  - Watch the events page at qvna.org/events for Love Your Park dates.
