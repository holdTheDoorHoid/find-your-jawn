first_step:
  how: Visit the Saturday farmers market, 10 am to 2 pm, to meet the volunteers. To volunteer, use the
    contact form on the group's volunteer page.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The Saturday market is open to visitors, and volunteers can reach the group through a public
    contact form. The page does not describe what a first volunteer day looks like.
  what_to_expect: The Saturday market runs 10 am to 2 pm, rain or shine, with vendors and some events
    such as live music or a children's story hour. Visitors can browse and listen. The site does not list
    parking, admission or a plan for first-time volunteers.
  first_visit_tips:
  - Dress for the weather, since the market runs rain or shine.
  - Check the events page first, since music, story time and food trucks show up on only some Saturdays.
  - Bring cash or a card, since at least one food truck on the listings takes both.
