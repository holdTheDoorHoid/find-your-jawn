summary: A nonprofit that cares for Pretzel Park in Manayunk and runs the park's Saturday farmers market
  with volunteers. It also hosts drum circles, concerts and kids' story time.
what_you_do: Help with park maintenance days, volunteer at the farmers market or a concert, or join the
  email list for news and volunteer calls.
