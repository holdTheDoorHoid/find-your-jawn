first_step:
  how: Register on the event page for a clean-up or green-up, which includes agreeing to a volunteer waiver.
    To ask about joining the volunteer list, email friends@therailpark.org or call 215-485-2221.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Clean-ups are open to the public with a sign-up on each event page, and supplies and light refreshments
    are provided. The site does not say the events suit first timers specifically, so this is not rated
    higher.
  what_to_expect: A clean-up means picking up litter, removing graffiti and helping with general upkeep
    alongside other volunteers. Supplies are provided and light refreshments are served. Each event page
    lists its own start and end time, so check it before you sign up.
  first_visit_tips:
  - Register on the event page first, since signing up includes the waiver.
  - Enter by the Noble Street entrance, which is step-free. The Callowhill Street side has stairs.
  - There are no restrooms in the park, so plan ahead.
  - Pets are welcome in the open park, but non-service pets are not allowed on guided tours.
