summary: Volunteers and supporters developing the Rail Park, a three-mile greenway on old rail tracks
  from Northern Liberties to Fairmount Park. Phase One is already open, and the group runs clean-ups,
  green-ups and guided tours.
what_you_do: Sign up for a volunteer clean-up or green-up (each event page has its own registration),
  book a small-group tour, or come to a park event.
