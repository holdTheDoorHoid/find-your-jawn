  notes: 'Nearest SEPTA: Broad Street Line to Spring Garden station, about a five minute walk. Bus routes
    2, 4, 16, 23, 45 and 61 also serve the area. The Noble Street entrance is step-free with an accessible
    slope, while the Callowhill Street entrance has stairs only. The park has no restrooms.'
