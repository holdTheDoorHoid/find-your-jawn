first_step:
  how: Start a submission on the submissions page before the issue 4 window closes on Nov 15, 2026
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The open call is public, has a clear deadline and form, and is open to any artist or writer,
    but acceptance is by review and the selection criteria are not stated
  what_to_expect: Submissions go through an external online form, and photo or art work is limited to
    5 to 10 images per edition. Accepted pieces earn a one-time cash payment plus a share of royalties,
    and artists keep ownership of their work. The site does not describe selection criteria or when decisions
    are made.
  first_visit_tips:
  - Read the issue theme on the submissions page before you choose work to send
  - Use JPEG or PNG files at 300 dpi if you can, since 240 dpi is the minimum accepted, each under 10
    MB
  - Buy a past issue in the shop first to see the magazine, with local pickup available
