cost:
  level: paid
  text: Ticket prices are set per show, and standard adult prices are on each ticket page. Most shows
    have a $15 student and 25-and-under ticket, and FringeACCESS card holders can buy up to four $2 tickets.
    Membership is $65 or $100 for 12 months, for one or two 20% off tickets per show.
