first_step:
  how: Buy a show ticket online at fringearts.com, where sales are open 24 hours a day, or email Volunteer@FringeArts.com
    if you want to volunteer and are 14 or older.
  drop_in: false
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Public shows are open to any ticket buyer, and volunteers can sign up by email, but the page
    does not describe a beginner program or first timer event.
  what_to_expect: A first visit is usually a ticketed show or a workshop, and the box office opens one
    hour before showtime. Doors usually open about 30 minutes before the show, and drinks are allowed
    in the theater. The page does not say how long a show runs, and it does not describe what a volunteer
    shift involves beyond ushering, greeting, and handing out programs.
  first_visit_tips:
  - Have your ticket on your phone or printed. You can also check in at the door with your last name.
  - Doors usually open about 30 minutes before showtime, so arrive early.
  - Bring a Student ID if you buy the $15 student ticket.
  - The entrance is in the middle of the Haas Biergarten, facing Race Street, under the large FringeArts
    sign.
