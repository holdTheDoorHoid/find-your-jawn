summary: A Philadelphia venue for experimental and do-it-yourself performance that also runs the Philadelphia
  Fringe Festival. Members of the public come as audience, take a workshop, or volunteer.
what_you_do: Buy tickets to shows and the festival, take a movement workshop, or sign up to volunteer.
  The venue also hosts a restaurant and a membership program.
