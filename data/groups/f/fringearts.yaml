access:
  wheelchair: 'yes'
  languages: []
  notes: The page says the building is wheelchair accessible and mobility device friendly. The main theater
    is a steep raked space with a limited number of ground level seats for people who cannot manage stairs.
    Assistive listening devices are offered for shows with amplified sound. Sensory kits are available
    on request, with fidget toys, noise canceling headphones, earplugs, and weighted lap blankets. You
    may step out during a show to a quieter area. Service animals are welcome with advance notice. The
    page does not mention elevators, accessible restrooms, or ASL or captioned shows.
