summary: A nonprofit group for Julian Abele Park, a small park on 22nd Street in Southwest Center City.
  Members meet about eight times a year, and the group runs a summer concert series.
what_you_do: Join as a general member for $20 a year, attend the group's meetings, or come to the summer
  concerts. Voting members must be 18 or older and meet attendance or service rules.
