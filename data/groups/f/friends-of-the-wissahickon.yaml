  gear: Work gloves, sturdy closed shoes, long pants, sun protection, and a reusable water bottle are
    recommended. The page does not say whether tools are provided.
first_step:
  how: Pick a service day on the Volunteer Service Days page and click its date to register. The meeting
    place and details arrive by email before the day.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: 'Open to the public, with a clear way in: register for any listed service day on the site. The
    pages read do not say whether beginners are welcome, so this is not rated higher.'
  what_to_expect: A service day is a morning of hands-on park work, such as trash pickup, removing invasive
    plants, planting, graffiti removal, and trail fixes, and the tasks change from week to week. The group
    describes service days as fun and educational, and a chance to meet other park stewards. Listed Thursday
    and Saturday events run 9 am to noon, and weather cancellations are posted by 8 am.
  first_visit_tips:
  - Wear long pants, closed sturdy shoes (no open-toed shoes), and clothes you do not mind getting dirty.
  - Bring work gloves, sun protection such as a hat and sunscreen, and a reusable water bottle.
  - Check for a weather cancellation by 8 am on the day. Events are called off for heavy rain or snow,
    thunder and lightning, or high winds.
  - Teens 14 to 18 need a parent or guardian to sign the service day waiver form. Children under 14 must
    come with an adult.
