summary: The Friends of the Wissahickon look after the 2,000-acre Wissahickon Valley Park through volunteer
  work, trail care, and guided hikes. Volunteers do the hands-on stewardship, and Trail Ambassadors lead
  the hikes.
what_you_do: Sign up for a volunteer service day (planting and cleanups are listed), take on individual
  stewardship work, join a corporate or youth crew, or lead or join a Trail Ambassador hike in the Discover
  the Wissahickon series.
