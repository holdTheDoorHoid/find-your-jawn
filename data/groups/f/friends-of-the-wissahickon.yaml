summary: Volunteers who look after the trails, streams and woods of Wissahickon Valley Park. They hold
  public service days to clear drains, fix trails, pull invasive plants and pick up litter.
what_you_do: Join a registered service day to work on trails, plant, pull invasive vines and pick up trash.
  Trained volunteer corps take on longer roles such as trail ambassadors and crew leaders.
