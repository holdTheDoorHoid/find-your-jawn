first_step:
  how: Email kahnparkphilly@gmail.com to ask about the garden team or the next cleanup, then come to a
    free Wednesday summer concert at 7:30 pm. The 2026 concert series ran through Sept 9, so watch the
    events page for next summer.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: The free concerts are open to anyone and list no sign-up, and the site gives an email address
    for questions. No page says newcomers are welcome by name.
  what_to_expect: Concerts run Wednesday evenings from 7:30 pm and are free, with rain dates the following
    Thursday. You can buy a raffle ticket during the show, with prizes from local restaurants and merchants,
    and the money goes to the park's maintenance fund. The site does not say how long a concert lasts
    or what to bring.
  first_visit_tips:
  - Concerts start at 7:30 pm, so arrive a little early to find a spot.
  - If the forecast is bad, look for the rain date on the following Thursday.
  - The park is at 11th and Pine streets. The site gives no parking or transit details, so check a transit
    app before you go.
