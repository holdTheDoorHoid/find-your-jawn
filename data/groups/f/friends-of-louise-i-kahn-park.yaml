summary: Neighbors who help look after Louis I. Kahn Park at 11th and Pine streets. A garden team tends
  its plants and trees, and the group runs free summer concerts, a children's party, a spring cleanup,
  and a Halloween pumpkin contest.
what_you_do: Come to the free concerts and family events, join a park cleanup when one is held, or email
  the group to ask how to help the garden team.
