summary: Volunteers who clean up and restore Mount Moriah Cemetery in southwest Philadelphia. They hold
  clean-up days through the year, and you can come to just one.
what_you_do: Clear brush, trim weeds, pick up trash, plant flowers, and help with historical research
  on the grounds. Groups from colleges and businesses also come to clean-up days, and a group can adopt
  a plot or section to keep it mowed and trimmed.
