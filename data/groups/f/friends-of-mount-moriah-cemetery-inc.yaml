first_step:
  how: Email info@fommci.org to ask about the next clean-up day, or to bring a group or adopt a plot
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The volunteer page says new volunteers are always wanted and tells people to email the group
    to start.
  what_to_expect: You work outdoors on the cemetery grounds with other volunteers, and college and business
    groups also come to clean-up days. The volunteer page does not say how long a day runs, and volunteering
    costs nothing.
  first_visit_tips:
  - Email info@fommci.org before you come, since the volunteer page does not list set dates.
  - On weekends the gates are open about 10:30 am to 4 pm, and rain or snow can keep them shut.
  - If you drive, park on the main roads inside the grounds, keep to 15 mph, and never park on the grass.
  - Bikes belong in the racks near the entrances, not locked to trees, monuments or fences.
