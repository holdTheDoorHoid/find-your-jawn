summary: A nonprofit that supports Penn Treaty Park on the Delaware River waterfront. It runs a volunteer
  program, takes donations, and posts park news and a public events calendar.
what_you_do: Help with park cleanup (litter, recycling, upkeep), plant trees, flowers and shrubs, help
  set up and run events, or serve on the park's leadership board. You can also donate.
