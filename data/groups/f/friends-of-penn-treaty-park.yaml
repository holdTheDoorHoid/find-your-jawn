first_step:
  how: Look at the group's calendar of upcoming volunteer opportunities, then email fopenntreatypark@gmail.com
    to ask how to sign up for the next one
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The volunteer page lists a calendar and an email but no sign-up steps, so the way in is unclear.
  what_to_expect: Volunteer work is hands-on park upkeep such as litter and recycling pickup, planting
    trees, flowers and shrubs, or helping at events. The site does not say how long a shift runs, what
    to wear or whether tools are supplied, and it lists no volunteer costs.
  first_visit_tips:
  - Email fopenntreatypark@gmail.com before you come to ask how to sign up for a volunteer day.
  - 'Parking is free: accessible spaces sit next to the park entrance on Beach Street, and more free parking
    is on E Columbia Avenue, across N Delaware Avenue.'
  - Take the 43 bus to the park entrance, or walk about 15 minutes from Girard station on the Market-Frankford
    Line.
  - The park is open daily from 8 am to 6 pm.
