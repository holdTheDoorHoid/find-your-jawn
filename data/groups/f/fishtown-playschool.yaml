first_step:
  how: Complete the online application and pay the $30 family fee through the link on the apply page.
    Applications are taken all year.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: A family must apply and pay a fee before the class list, and new families then pay a $250 membership
    fee. The pages disagree on whether tours are open before applying, so the way in is not clear
  what_to_expect: Children aged two to five attend Monday, Wednesday and Friday mornings in two age groups,
    2 to 3 and 3 to 5, each with a lead teacher. Each family commits to at least 20 hours a month, including
    classroom helper shifts, a committee, and All Hands meetings. Each child brings a packed lunch, and
    the school has no outdoor play area, so classes walk the neighborhood when the weather allows.
  first_visit_tips:
  - Pack a lunch your child can open alone, since the school asks for containers and packaging that kids
    can manage
  - Plan for classroom helper shifts several times a month, and a committee role for at least one parent
  - Potty training is not required
  - Email info@fishtownplayschool.org to ask whether a tour is open before you apply
