summary: A cooperatively run playschool in Fishtown where young children learn through play, using ideas
  from Reggio Emilia, emergent curriculum and Montessori.
what_you_do: Children attend a play-based class three mornings a week. Families apply online and pay a
  fee, and each family takes part in running the cooperative.
