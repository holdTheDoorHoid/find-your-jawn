  newcomer_friendliness: 2
  basis: The mailing list and email are clear ways to ask, but the site gives no open days or sign-up
    steps for work days, so it is not clear a newcomer can join one.
  what_to_expect: Work days are announced by email and the mailing list, and the site does not list dates
    or describe what a work day involves. The garden is a shared green space, and it closes at dusk.
  first_visit_tips:
  - Leave dogs at home, since the garden does not allow them.
  - Take your trash home with you.
  - Plan to leave before dusk, when the garden closes.
