  basis: The volunteer page is public and gives email addresses to ask. It does not say whether work days
    need approval, orientation or dues.
  what_to_expect: Group leaders run work days through the year, and the tasks listed include weeding shared
    beds and mulching paths. The volunteer page does not give dates, orientation, or what to wear. Volunteering
    has no listed fee.
  first_visit_tips:
  - Email before you come, because work day dates are not posted.
  - To get a garden plot, plan on 15 volunteer hours and one FESPP event the year before. Plots are assigned
    in March.
