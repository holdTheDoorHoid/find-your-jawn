first_step:
  how: Visit the Book Corner at 311 N. 20th Street during shop hours and ask a bookseller about volunteering,
    or call (215) 567-0527 or email freelibraryfriends@gmail.com to ask how to join a neighborhood Friends
    group.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The Book Corner is open to walk in during posted hours, but the site does not say how to volunteer
    or join, so the way into the group is unclear.
  what_to_expect: The Book Corner is a bookshop with new, rare and used books at low prices, staffed by
    paid and volunteer booksellers. The site does not describe a volunteer shift or a membership process,
    so a first visit is mostly browsing and asking questions.
  first_visit_tips:
  - Shop hours are Monday to Saturday, 10 am to 6 pm.
  - Look for the shop on Wood Street, a short walk north of the Parkway, near the Central Library.
  - Call (215) 567-0527 first to ask about volunteering, since the site does not say how.
