summary: An independent nonprofit that backs the city's Free Library through neighborhood volunteer groups
  at its branches. It also runs the Book Corner, a shop for new, rare and used books.
what_you_do: Join or volunteer with a neighborhood Friends group at a branch, or buy books at the Book
  Corner. The site does not say how to join, so contact the group to ask.
