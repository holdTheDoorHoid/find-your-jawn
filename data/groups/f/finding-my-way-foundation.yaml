summary: A nonprofit that offers life skills workshops, career coaching, low-cost therapy, and wellness
  workshops for young adults. The site says these programs serve people ages 17 to 25 who identify as
  a minority, and it shares resources to help them prepare for adult life.
what_you_do: Request a life skills or wellness workshop through the site's forms, book a career coaching
  session through a calendar link, or ask about low-cost therapy. You can also refer a young adult you
  know, or join the mailing list. A mentorship program that pairs young people with adults is listed as
  coming soon.
