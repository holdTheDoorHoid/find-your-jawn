first_step:
  how: Request a workshop through the form on findmywayfoundation.org, or book an interest meeting through
    the calendar link, and ask about the next workshop.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: Workshops are requested through forms and the pages list no dates or formats, so the way in is
    unclear until you ask.
  what_to_expect: The site does not describe a typical workshop, its length, or its group size, so ask
    before you request one. Topics include financial literacy, career planning, wellness and stress management,
    and a small-group book club. Coaching is booked as a session through a calendar link.
  first_visit_tips:
  - 'Call or email during office hours: Monday to Thursday noon to 8 pm, Friday 9 am to 3 pm, Saturday
    11 am to 3 pm.'
  - Give your age when you ask, since the young adult programs are for ages 17 to 25.
  - Ask whether a workshop is in person or online, because the site does not say.
