  basis: Teens aged 14 to 20 who are at least in 9th grade by April and who commit to two years fill out
    an interest form. The way in is clear, but a teen must apply before training.
  what_to_expect: Explorers meet at the Fire Academy every other Saturday from 9 am to 5 pm, April through
    November. Training covers firefighting and EMS basics through classroom instruction and hands-on work
    with local and state agencies. Members also earn community service hours.
  first_visit_tips:
  - If you are under 18, a parent or guardian signs a consent form and attends an orientation.
  - To enroll, bring a copy of your birth certificate and your most recent report card.
  - 'Plan on the uniform: members must wear it neatly at all times.'
