summary: The volunteer group that has looked after Fisher Park in Olney, a hilly, wooded park of about
  23 acres, since the 1980s. The most recent activity we could date is from 2018, so check with the city
  before you plan to join.
what_you_do: In 2018 the group ran park cleanups, tree plantings, a community garden and neighborhood
  events such as movie nights. We could not confirm that this continues.
