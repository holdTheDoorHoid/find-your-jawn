first_step:
  how: Sign up for the park email list on the civic association's park updates page, then come to the
    monthly Woodland cleanup on the second Sunday, 10 am to noon.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The park updates page gives a fixed monthly time and place for cleanups and does not say membership
    is needed to volunteer.
  what_to_expect: A cleanup runs two hours on the second Sunday of the month, at the Woodland, and the
    page describes it as cleanup and restoration work. The page does not list the tasks or what to bring.
    The civic association's monthly meeting is on the third Thursday, 7 to 8 pm, at Pilgrim Church, and
    the page does not say whether non-members can attend.
  first_visit_tips:
  - The page calls the cleanup place 'the Woodland,' not the park, so confirm the meeting spot by email
    first.
  - Sign up for the email list to get reminders about cleanup days.
