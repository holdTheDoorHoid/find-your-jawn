summary: Neighbors who look after Wissahickon Neighbors Park and its Woodland, a green space in the neighborhood.
  They meet each month to clean up and restore the Woodland, through the Wissahickon civic association.
what_you_do: Join the monthly Woodland cleanup on the second Sunday, 10 am to noon. The group also holds
  park events, such as Love Your Park days and art markets.
