first_step:
  how: Register for a volunteer day on Eventbrite, then sign the digital waiver at https://riverfrontnorth.org/waiver/
    before you go.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Anyone can volunteer and all ages are welcome, but each day needs an Eventbrite registration
    and a signed waiver. The page does not say that beginners get extra help.
  what_to_expect: A volunteer day is a hands-on cleanup of the greenway and parks, and all supplies are
    provided. The page does not say how long a day lasts. Workdays usually go on through light rain.
  first_visit_tips:
  - Bring a printed, signed waiver if you can, since it speeds up check-in. Spare copies are on site.
  - Wear long pants and sturdy or closed-toe shoes, and bring sun protection and bug spray.
  - Bring a reusable water bottle and a snack.
