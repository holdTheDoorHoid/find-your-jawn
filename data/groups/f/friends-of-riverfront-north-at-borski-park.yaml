summary: The nonprofit that cares for 11 miles of riverfront parks and trails in Northeast Philadelphia.
  Volunteers clean up the greenway and report dumping or safety problems, and regular volunteers can earn
  Trailblazer status.
what_you_do: Sign up on Eventbrite for a volunteer day, or do a solo cleanup on your own schedule and
  post about it to join the Trailblazer volunteer program.
