first_step:
  how: Send the member request form on the club's site, which asks for your child's birth date and grade.
    Email info@fsurc.com for membership questions.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Families send a request and wait for the club to review it, and under-18 applicants also meet
    by video with a parent and board members. The page does not promise approval or describe a visit,
    so the way in is not clear
  what_to_expect: The club reviews each request and says it follows up within about a week. Children under
    18 meet by video with a parent or guardian and board members before membership is decided. The club
    does not treat verbal membership agreements as binding, so any agreement is put in writing.
  first_visit_tips:
  - Plan for a parent or guardian to come along while the application is pending, since minors may only
    be at the stables with one
  - Weekday hours are by appointment, and weekend hours are 8 am to 2 pm
  - Get any membership agreement in writing
