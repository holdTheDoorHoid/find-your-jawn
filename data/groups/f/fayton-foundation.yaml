first_step:
  how: Come to the Tuesday food program at 5305-15 Germantown Ave between 11 am and 1 pm, or walk in to
    the Sunday Prayer Cafe at 9:30 am at 5305-11 Germantown Ave.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The Prayer Cafe is a drop-in gathering where all are invited, and the food program runs set Tuesday
    hours. The site does not say whether the food program needs registration, ID, or meets any eligibility
    rule.
  what_to_expect: The Prayer Cafe is a short drop-in gathering for a moment of spiritual uplift. The Tuesday
    food program serves meals and offers emergency food, along with clothing and health and social support
    resources, with volunteers serving alongside students from Germantown Friends School. The site does
    not say how long a visit takes or whether anyone has to register.
  first_visit_tips:
  - Arrive during the 11 am to 1 pm window on Tuesdays
  - Ask by email before your first visit, since the site leaves out registration and ID details
  - Expect the Prayer Cafe to be a short drop-in at 9:30 am on Sundays
