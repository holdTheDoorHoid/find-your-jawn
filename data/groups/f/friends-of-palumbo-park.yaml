summary: Neighbors who care for Palumbo Park in South Philadelphia. They do cleanups and planting, push
  for park improvements, raise money through grants and donations, and run community events.
what_you_do: Help replant areas that lost most of their plants, a project the group is running with the
  city, or come to the Love Your Park day. You can also email to ask about volunteering or membership.
