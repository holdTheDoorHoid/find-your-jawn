  newcomer_friendliness: 3
  basis: Membership is free and open to anyone, and there is a clear email to start, but the site does
    not say first timers are welcome at work days.
  what_to_expect: Work days are outdoor planting and clean-up jobs in a small South Philadelphia pocket
    park. The volunteer page does not say how long a work day lasts, what to wear, or whether tools are
    supplied. Membership costs nothing.
  first_visit_tips:
  - Email palumbopark@gmail.com before you come, since the site does not list a regular work day schedule.
  - The park sits next to Fleisher Art Memorial at 723 Catharine Street, but the site gives no parking
    or transit details.
  - The Love Your Park day is on November 14, 10:30 am to 1 pm, the one dated event on the site.
