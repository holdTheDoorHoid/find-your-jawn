first_step:
  how: Call or email the group to ask about the next cleanup. Its events page listed none when we checked.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: Membership is by a mailed paper application with a check, and the cleanup pages do not say whether
    a newcomer can join a cleanup.
  what_to_expect: The site does not describe a typical cleanup. Work covers both the creek and the land
    around it, and the group shares photos of past cleanups. The page does not say how long a cleanup
    lasts, who comes, or what to bring.
  first_visit_tips:
  - Call or email before you come, since the group posts each month's dates as it sets them.
  - Ask what to wear and bring, because the site does not say.
