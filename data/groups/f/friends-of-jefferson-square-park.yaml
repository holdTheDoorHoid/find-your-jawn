first_step:
  how: Come to the second Saturday cleanup at 300 Washington Ave, March through December. No sign-up is
    listed for cleanups.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: Cleanups are announced to the public and anyone can come. The site has no first-time welcome
    or newcomer program, so it does not reach 4.
  what_to_expect: A cleanup lasts about two to three hours on a Saturday morning, weather permitting.
    You pick up litter and tend the planting beds alongside neighbors who look after the park. No fee
    is listed to join, though the group asks for donations.
  first_visit_tips:
  - Cleanups run March through December and stop in winter, so check the events page for the next date
    before you go.
  - Join the email list or the Facebook group to hear about changes to a date.
  - If you have a question first, use the contact form on fojsp.org.
