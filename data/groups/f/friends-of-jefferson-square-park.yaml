summary: Neighbors who look after Jefferson Square Park on Washington Avenue in Pennsport. They hold a
  park cleanup on the second Saturday of the month and welcome ideas for the park.
what_you_do: Join the monthly cleanup to tend the planting beds and pick up litter, come to the park's
  film nights and holiday lighting, or send in an idea for the park.
