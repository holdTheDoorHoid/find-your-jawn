first_step:
  how: Fill in the Volunteer Application on the volunteer page, or the Foster Application if you can take
    an animal into your home.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Volunteering, fostering, and adopting each start with an application form, and adopters meet
    animals only after approval. The site does not say whether anyone can visit before applying.
  what_to_expect: The site lists volunteer roles such as dog walking, cat socialization, animal transport,
    photography, writing pet bios, fundraising events, and grant research. It does not say how long a
    shift runs or whether training is given. There is no shelter to walk into, because the group works
    through foster homes.
  first_visit_tips:
  - Read the foster guide on preparing for a foster dog before you apply to foster
  - Expect the adoption steps to start with an application and reference checks
  - Check your email and spam folder often after you apply, since the adoption steps run by email
