first_step:
  how: Come to the Friends of Harrowgate Park Movie Night on October 16, 2026 at the park, 3455 Kensington
    Ave, from 4 pm, and ask a Friends member how to help.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Events are open to the public on set dates. The site does not explain how to join the group or
    volunteer.
  what_to_expect: The Movie Night runs 3:30 to 8 pm. Activities start at 4 pm, with a DJ, refreshments,
    arts and crafts, face painting, balloon twisters, and a game truck, and the film starts at 6 pm. Bring
    your own blanket or chairs. The event page does not list an admission price.
  first_visit_tips:
  - Bring your own blanket or chairs, as the event page asks.
  - Plan to arrive by 4 pm for the activities; the movie starts at 6 pm.
  - The site has no accessibility details, so call (215) 683-3600 or email the group before you come if
    you need access help.
