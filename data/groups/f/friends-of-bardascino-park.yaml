  basis: The site invites people to help with plantings, cleanups or events, occasionally or regularly,
    and gives an email address to ask how.
  what_to_expect: 'Helping is free: you can give time now and then or on a regular basis, and donations
    are welcome. Cleanups run from November through April, but the site gives no set days, times or what
    to bring.'
  first_visit_tips:
  - Email first, since the site gives no set cleanup days or times.
  - 'The park is carry in, carry out: the site says the trash cans were removed, so take your trash with
    you.'
  - The group posts updates on its Facebook page, according to the site, so check there for the latest
    dates.
