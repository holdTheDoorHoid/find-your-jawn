summary: Neighbors who have looked after Giuseppe Bardascino Park at 10th and Carpenter since 1991. They
  have helped with renovations and tree and bench replacements, and they organize cleanups.
what_you_do: Give time to cleanups, which the group runs from November through April, or donate. Email
  the group to ask how to help.
