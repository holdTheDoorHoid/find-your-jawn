  newcomer_friendliness: 3
  basis: The fridge is open to anyone with no sign up to visit, and volunteers join through a public form.
    The pages do not describe how long a shift runs.
  what_to_expect: Visiting means walking up to the fridge to take food or leave food; the site describes
    no check in. Volunteers do stocking, meal prep (packing containers and making sandwiches), driving
    food to and from the fridge, and upkeep such as cleaning. The site does not say how long a shift runs.
  first_visit_tips:
  - The site does not list hours, so call 215.226.1276 before you go to ask when the fridge is stocked.
  - The location page gives the address only, with no transit or parking notes, so plan your trip before
    you go.
