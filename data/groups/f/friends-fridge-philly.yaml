summary: A free community fridge on West Clearfield Street in the Allegheny West and Nicetown-Tioga area.
  Anyone can take food from it, and neighbors can leave food or sign up to help stock, cook, drive or
  clean it.
what_you_do: Take food you need, leave food you can spare, or sign up on the volunteer form to stock the
  fridge, make meals, drive food to and from it, or help with upkeep.
