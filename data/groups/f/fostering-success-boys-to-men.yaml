summary: A nonprofit that coaches and mentors at-risk boys and young men through workshops, a youth leadership
  academy, and street outreach. It also runs transitional housing.
what_you_do: Young people and their caregivers can ask about the youth leadership academy, the rites of
  passage program, the STEM leaders program, and the workshops. Other named programs include a career
  skills workshop, a talk series on community issues, and street outreach and group home services for
  young people who are runaway, homeless or on the street.
