first_step:
  how: Come to the next open monthly meeting on the third Monday, 6 to 7 pm, on Zoom or in the park, or
    email info@friendsofvernonpark.org to ask how to volunteer.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The site says all are welcome, lists a regular open meeting, and gives an email for questions.
    It does not describe a sign-up step.
  what_to_expect: Meetings run one hour, on the third Monday from 6 to 7 pm. In warm weather you meet
    in the park, so bring a blanket or chair; in cold or bad weather the meeting moves to Zoom. The site
    does not describe who usually attends, and it invites help with time, skills, or money.
  first_visit_tips:
  - In warm weather, bring a blanket or chair for the meeting in the park.
  - In cold or bad weather the meeting is on Zoom, and the mailing list has the details.
  - One page says the meeting is on the second Monday, so confirm the date by email first.
