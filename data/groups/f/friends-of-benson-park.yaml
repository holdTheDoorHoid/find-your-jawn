first_step:
  how: Come to the next monthly meeting on the last Thursday of the month. Anyone may attend, in the park
    in warm months or on Zoom in winter.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The site says all are welcome at meetings, and it gives an email address for joining the Friends
    group.
  what_to_expect: Meetings plan the spring and summer activities, such as movie nights, family picnics
    and cookouts in the park. In winter the meeting is on Zoom, and you RSVP through a Google Calendar
    link on the site. The site lists no fee to attend, and donations are accepted.
  first_visit_tips:
  - Dogs are not permitted in the park, and children must be with an adult at all times, according to
    the park rules page.
  - Sign up for the group's email updates on the site to get each meeting's date and time.
  - In winter, RSVP for the Zoom meeting through the Google Calendar link on the site.
  - Email bensonpark1980@gmail.com or call 267-551-1021 to confirm the place before you come.
