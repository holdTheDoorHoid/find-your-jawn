schedule:
  text: 'Regular volunteer hours are Saturdays, 10 am to 12 pm. Welcome Center desk shifts run daily,
    9 am to 4 pm. Events are posted on the group''s calendar. The park is open daily: 6 am to 9 pm from
    April to October, and 6 am to 6 pm from November to March.'
