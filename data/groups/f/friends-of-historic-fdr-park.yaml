first_step:
  how: Fill out the general volunteer sign-up form on the Volunteer page of fdrparkphilly.org. You will
    then get a monthly newsletter with sign-up links for park work.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The site gives a clear sign-up route and a first-day orientation for Welcome Center volunteers,
    but it does not say beginners are specially welcome.
  what_to_expect: Regular volunteer sessions run Saturdays from 10 am to 12 pm, and Welcome Center desk
    shifts run up to seven hours. Welcome Center volunteers get an orientation on their first day. Group
    and corporate volunteer days need a yearly membership.
  first_visit_tips:
  - The Welcome Center is at 1800 Pattison Ave, and there is a restroom outside it.
  - For a desk shift, sign up through the shift spreadsheet linked on the volunteer page.
  - If you need community service hours, email stewardship@fdrpark.org.
