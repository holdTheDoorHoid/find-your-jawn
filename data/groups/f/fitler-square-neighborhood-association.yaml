first_step:
  how: Email the contact listed for the association, or write to its PO Box 3918, to ask when it next
    meets, since the site lists no meetings.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The FAQ says no dues are needed to get the group's advocacy and information, and a Join link
    exists, but the join page could not be read (HTTP 403) and no meetings or events are listed.
  what_to_expect: The site does not describe a first visit, and its events page lists no upcoming events.
    The news archive covers posts from 2019 to 2023 on traffic, bike lanes and neighborhood history, so
    ask first whether a meeting is planned. The FAQ says no dues are needed to take part in its advocacy,
    information and support.
  first_visit_tips:
  - Check the news page for recent posts before you contact the group.
  - Ask whether non-members can attend meetings, since the site does not say.
  - Ask about the next opportunity to give input on a local project.
