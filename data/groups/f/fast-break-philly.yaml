summary: A sports group for girls and gender-expansive youth in Philadelphia. Its fall volleyball clinics
  run for grades 3 to 8 and its Sunday ultimate frisbee clinics for grades 4 to 9. Clinics are paid by
  the session, with a lower community rate.
what_you_do: Players sign up online for volleyball clinics at Greene Street Friends School or ultimate
  clinics at Edgely Ultimate Fields. Each session is paid separately, and the group keeps an email list
  for news.
