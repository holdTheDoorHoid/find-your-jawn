summary: A girls' sports group in Philadelphia that runs fall volleyball clinics for 3rd to 8th graders
  and Sunday ultimate frisbee clinics. Clinics are sold by the session, and the site lists a community
  rate.
what_you_do: Girls sign up for clinic sessions at Greene Street Friends School or at Edgely Ultimate Fields.
  The group also keeps an email list for news.
