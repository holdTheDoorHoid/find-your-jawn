first_step:
  how: For ultimate, complete the online registration form on the Ultimate Frisbee clinic page for the
    next Sunday session. Volleyball is full, so email info@fastbreakphilly.com to join its waitlist.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: Both clinic pages say all experience levels are welcome and give a public registration form.
    Volleyball has reached its cap and is waitlist only, so its way in is the waitlist.
  what_to_expect: The site does not describe tryouts or a first session in detail. The ultimate clinics
    teach the fundamentals of the game, skill building, and team play, with a focus on confidence. The
    earlier volleyball session for each grade band focuses on fundamentals, and the later one adds more
    game play.
  first_visit_tips:
  - Pick the session that matches the player's grade, since volleyball is split by grade
  - Sixth graders may choose either volleyball session
  - Have the school, grade, level of play, and caregiver contact details ready for the form
  - Join the email list to hear about schedule changes
