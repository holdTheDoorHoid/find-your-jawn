summary: Neighbors who care for Cianfrani Park at 8th and Fitzwater. The group's blog has posted about
  cleanups, tree care, planting, and gardening workshops, and it holds a monthly meeting. Its newest dated
  post is from 2021.
what_you_do: Its past posts describe park cleanup days, tree care, planting, gardening workshops, and
  requests for donations. The group meets on the first Tuesday of each month, at Palumbo Recreation Center
  or in the park when the weather allows.
