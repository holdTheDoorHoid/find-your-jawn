first_step:
  how: Mail a membership form with a check for dues to the Friends at 18 South 7th Street, or join online
    through the Donate button on the group's site. Email friendsindependencebranch@gmail.com first to
    ask whether the group is meeting now.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Joining needs annual dues before you learn what the group does day to day, and the site posts
    no events or volunteer steps.
  what_to_expect: The site does not describe a typical visit, since it posts no meetings or events. Members
    whose dues are paid up can vote at meetings and elections. The newest news post is from 2023, so ask
    the group what is happening before you pay.
  first_visit_tips:
  - Email the group before you pay to ask what is going on at the branch now.
  - If you pay by Venmo, use the group's charity profile and put your contact details in the memo.
  - Expect renewal notices by letter when your dues come due.
