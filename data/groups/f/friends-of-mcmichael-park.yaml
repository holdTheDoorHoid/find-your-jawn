summary: Volunteers who guide upkeep and improvement work at McMichael Park, working with the City and
  the Fairmount Park Conservancy. They run spring and fall cleanups and a few free family events, and
  they answer questions by email.
what_you_do: Join a spring or fall Love Your Park cleanup, come to a free movie night in the park, or
  email the group to ask how to help with upkeep projects.
