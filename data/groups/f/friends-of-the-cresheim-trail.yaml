first_step:
  how: Check the Volunteer Workdays 2026 page for the next date, then email info@cresheimtrail.org to
    ask how to sign up.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Workdays are open to volunteers of every skill level, and the group gives an email address to
    ask how to join. The page does not describe a sign-up step, so this is not rated higher.
  what_to_expect: A workday is outdoor trail work, such as litter pickup, pulling invasive plants, planting
    trees and shrubs, clearing sightlines, and trail repairs, and the group says there is work for every
    skill level. Tools and gloves are provided, and you may bring your own. Some workdays start at 9 am,
    and dates can change.
  first_visit_tips:
  - Email info@cresheimtrail.org before a first workday to ask about sign up and the meeting spot, since
    not every date lists one.
  - Mermaid Park at 7645 Germantown Ave is the usual start point, but check each date because some list
    a different meeting place.
  - Tools and gloves are provided, so you do not need your own, though you may bring them.
  - Check the workday page for weather cancellations before you travel. The group calls off work only
    in severe weather.
