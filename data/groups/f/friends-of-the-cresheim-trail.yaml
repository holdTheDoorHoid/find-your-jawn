summary: A volunteer nonprofit that builds and looks after trails linking Wissahickon Valley Park with
  Fort Washington State Park. Its current project is a rail trail on old railroad land.
what_you_do: Join cleanups and trail workdays, help at fundraisers and booths, or support the group with
  a membership donation.
