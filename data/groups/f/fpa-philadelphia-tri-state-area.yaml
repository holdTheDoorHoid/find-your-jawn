  newcomer_friendliness: 3
  basis: Events are listed publicly with registration links, and the chapter runs a mentorship program
    for newer planners. The page does not say whether non-members can attend, and the mentorship details
    cover only the 2026 round.
  what_to_expect: Chapter events are talks on financial planning topics and social evenings. The October
    14, 2026 event is a one hour virtual talk on private markets, and the December 10, 2026 party includes
    food, drinks and networking; its location is still to be set. The mentorship pairs one newer planner
    with one experienced planner, with monthly meetings from March through August of the 2026 round.
  first_visit_tips:
  - The October 14 talk is virtual, so you can join from home.
  - The December party's location is still to be set, so check for an update before you plan your trip.
