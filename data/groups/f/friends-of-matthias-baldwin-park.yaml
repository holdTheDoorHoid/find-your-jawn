first_step:
  how: Come to the next monthly Saturday cleanup at 10 am (check the date at baldwinparkphilly.org first),
    or join through the membership page at baldwinparkphilly.org/join. Email baldwinparkmembership@gmail.com
    with membership questions.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The site calls attending a cleanup the clearest way to help and links a join page, but it does
    not say beginners are welcome in particular.
  what_to_expect: Cleanups start at 10 am on a Saturday, and the group works to maintain, restore and
    preserve the park. The pages we read do not say how long a cleanup lasts or what to bring, so email
    before your first one.
  first_visit_tips:
  - Check the date first. The site gives the second Saturday as the regular day but also posts cleanups
    on other Saturdays.
  - Email baldwinparkphilly@gmail.com to ask what to bring, since the site does not say.
  - Ask about parking and transit by email, since the pages give no directions.
