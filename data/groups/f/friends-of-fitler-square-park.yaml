first_step:
  how: Come to a summer concert in the park, then fill out the Committee Interest Form on the group's
    committees page, or email friendsoffitlersquarepark@gmail.com to ask about the next cleanup.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: Concerts are open to the public, and the volunteer page explains the cleanup sign-up and the
    committee form, though it gives no set meeting times.
  what_to_expect: Concerts run from 6 to 8 pm and feature live bands. The bands listed on the events page
    play blues, folk, bluegrass, and Irish tunes. The fall fundraiser is an evening of dinner, drinks,
    and music for people 21 and older.
  first_visit_tips:
  - Each concert has a listed rain date, so check the events page if the weather looks bad.
  - Cleanup sign-up forms are posted shortly before each cleanup, so watch the volunteer page before a
    cleanup date.
