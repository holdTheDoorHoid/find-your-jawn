summary: Neighbors who look after Fitler Square Park, a small park on Pine Street between 23rd and 24th
  Streets. They run a summer concert series, a fall fundraiser, and an annual spring event, and they recruit
  volunteers and committee members.
what_you_do: 'Help at the two park cleanups each year, or join one of four committees: communications,
  events, fundraising, or grounds upkeep. Donations and bench adoptions also support the park.'
