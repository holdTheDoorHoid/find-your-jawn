first_step:
  how: Sign up for a volunteer clean-up through GivePulse, or book a public tour with the Book Now button
    on the Book a Tour page.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Volunteers join monthly clean-ups through GivePulse, and public tours are posted with dates and
    a Book Now button. Experience and age rules for clean-ups are not stated.
  what_to_expect: Clean-ups are volunteer work at the park and in the nearby community, held monthly.
    The site does not say how long they run, what time they start, or what to wear, so ask before you
    come. Tours are outdoors with a fair amount of walking, so plan for the weather and wear comfortable
    shoes.
  first_visit_tips:
  - Use the Noble Street entrance, which is step-free. The Callowhill Street side is stairs only.
  - Use a restroom before you arrive, since the park has none.
  - For tours, bring water and wear comfortable shoes, because the tour is entirely outdoors.
  - Public tours start at 2700 Pennsylvania Ave and end near 12th and Callowhill. Buses 49, 32, 7, 43
    and 48 run nearby, and the Broad Street Subway is about 5 minutes on foot from the end point.
