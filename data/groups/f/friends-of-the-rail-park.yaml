summary: A nonprofit building a three-mile greenway from old rail tracks, in three sections across ten
  neighborhoods from Northern Liberties to Fairmount Park. The park is free and open every day, and volunteers
  help with clean-ups and green-ups.
what_you_do: Join a volunteer clean-up or green-up, book a guided tour, or become a member.
