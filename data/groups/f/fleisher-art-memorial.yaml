first_step:
  how: Register for a class through the online class search, by phone at 215-922-3456 ext. 300, or at
    the front desk. Paid classes do not need a membership, but tuition-free classes do.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Classes are open to the public with online, phone and desk sign up. Some tuition-free classes
    are labeled introductory, but most classes are not labeled by level.
  what_to_expect: Each class meets on the dates in its listing, within a term. Tuition depends on class
    length, and studio and material fees depend on the medium. Tuition assistance covers tuition only,
    and the site notes that waiting lists form when classes fill.
  first_visit_tips:
  - Parking is limited. The student lot across from the main entrance is open only during programming
    hours, and paid and free city lots are nearby.
  - Bike racks are along Catharine Street and the lot fence.
  - If you need the lift, call the front desk first.
