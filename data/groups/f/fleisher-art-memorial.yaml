access:
  wheelchair: partial
  languages: []
  notes: 'The main building at 719 Catharine has an elevator, and a lift serves visitors who use mobility
    devices during open hours. Accessible parking is in the lot and in front of the school entrance on
    Catharine Street. The 709 Catharine building has no accessible restroom. Nearest SEPTA: the Route
    47 bus stop at 8th and Christian Streets, about half a block away. For lift help, call the front desk
    at 215-922-3456 ext. 300.'
