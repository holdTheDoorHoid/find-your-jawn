summary: An art center on Catharine Street with adult classes, youth art programs, a free Teen Lounge
  for teens, and community festivals. Tuition-free classes need a membership, and members get a discount
  on paid classes.
what_you_do: Take an adult or youth art class, drop in to the Teen Lounge on Tuesday and Wednesday afternoons
  during the school year, or join as a member to get into tuition-free classes and a discount on paid
  ones.
