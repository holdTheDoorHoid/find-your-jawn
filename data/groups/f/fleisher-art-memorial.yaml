cost:
  level: paid
  text: Membership is $65 a year for adults, $50 for seniors 65 and older, and $120 for a household of
    up to four adults and children. Members get 10 percent off tuition-based classes. Tuition-based classes
    set tuition by length, studio fees vary by medium, and open studio drop in is $10 for students taking
    a class in that medium. Tuition assistance covers tuition only.
commitment: seasonal
