schedule:
  text: Adult and youth classes run in terms. During term, the front desk is open Monday to Thursday 9
    am to 9:30 pm, Friday 9 am to 8 pm, and Saturday 9 am to 3:30 pm. The Teen Lounge meets Tuesdays and
    Wednesdays from 4 to 6 pm during the school year.
