summary: Neighbors who care for Schuylkill River Park. They raise money and push for park upgrades, organize
  volunteer shifts, and host events such as a farmers market, basketball tournaments, and a fall festival.
what_you_do: Work a volunteer shift, look after one part of the park such as a dog run, the courts, or
  the gardens, support events, or serve on the board. Donations go to park projects.
