summary: Neighbors who care for Gorgas Park in Roxborough. They put on park concerts and family events,
  and they hold spring planting and cleanup days.
what_you_do: Sign up for a spring planting or cleanup day, help at a family event or concert, or donate
  to the park. The group also runs a garden club that meets weekly; the site does not say how to join
  it.
