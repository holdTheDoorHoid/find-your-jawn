summary: A golf program for young people in the Philadelphia area. It runs First Tee programs, girls'
  golf, a caddie academy, and Down the Shore programs, and it offers scholarships for participants.
what_you_do: Kids ages 5 to 18 join golf sessions that build golf skills and life skills, and can take
  part in girls golf and other programs. Adults can volunteer as coaches after a background check and
  SafeSport training.
