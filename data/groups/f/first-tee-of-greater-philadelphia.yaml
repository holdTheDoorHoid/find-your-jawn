first_step:
  how: 'For kids: create an account on the Register page, buy the $20 yearly membership, and sign up for
    a session. For adult coaches: contact Jake Ruane, Program Manager, and fill out the information form.'
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The FAQ says no experience is needed and walks through registration, and the volunteer page says
    all experience levels are welcome with training provided
  what_to_expect: Each class lasts one hour and opens with a warm up, then moves into activities that
    build golf skills and life skills. Coaches and volunteers supply the equipment, so kids only need
    comfortable clothes and closed-toe shoes. Adult volunteers observe a class before they start coaching.
  first_visit_tips:
  - Bring a water bottle, comfortable clothes and closed-toe shoes
  - If you bring your own clubs, label them with first and last name
  - Watch for the confirmation email after you register, and a reminder the day before class
