first_step:
  how: Register on loveyourpark.org for a Love Your Park Fall Weekend service day, November 13 to 15,
    2026.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Anyone can register for a service day or join a city volunteer day, and the volunteer page says
    staff bring tools and gloves to the city days.
  what_to_expect: The planting workdays listed run 9 am to noon. On city volunteer days staff bring tools,
    gloves and expertise, and some events provide tools and gloves. Volunteers are asked to bring their
    own water bottle.
  first_visit_tips:
  - Bring your own water bottle, since the loveyourpark site asks volunteers to bring one.
  - Check the event listing for tools and gloves, since some events provide them and others do not.
  - Call 215-988-9334 to ask which park friends group is nearest you and how to get on its list.
