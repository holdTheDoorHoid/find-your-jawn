summary: A citywide network of neighborhood park groups, more than 140 of them, that clean up, plant,
  and garden in Philadelphia parks. The Conservancy and the city help run it, and joining a local group
  is the usual way in.
what_you_do: Join a park friends group near you for regular cleanups and planting, or sign up for a monthly
  city volunteer day or a Love Your Park service weekend.
