summary: Adults 55 and older with limited income who spend their days in pre-K and elementary classrooms,
  giving one-on-one help to children ages 3 to 7 and earning a stipend for their time.
what_you_do: Work in a classroom under a teacher's supervision, giving children one-on-one attention.
  Volunteers attend an information session, pass a background check, and go through orientation before
  starting.
