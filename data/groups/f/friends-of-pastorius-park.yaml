first_step:
  how: Sign up for a workday through the registration link on the volunteer page, or email info@friendsofpastorius.org
    with questions
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The volunteer page says new volunteers are always welcome and gives a sign-up form for each workday,
    plus an email for questions.
  what_to_expect: A workday is outdoor work in the park, such as weeding, mulching, tree care, watering
    and clearing sticks from walkways. The October 2026 workday runs 9 am to noon, with check-in at the
    warming hut, and coffee, water and sweets are provided. The site lists no fee for volunteering.
  first_visit_tips:
  - Wear closed-toe shoes or sneakers and long pants, since ticks, poison ivy and stinging nettle live
    in the park, and bring work gloves.
  - Rakes, shovels and wheelbarrows are on hand at events, but you can bring your own tools.
  - There is no parking lot and no car access inside the park, so plan to park on the nearby streets.
  - Restrooms at the Hut are open spring to fall, from dawn to dusk.
