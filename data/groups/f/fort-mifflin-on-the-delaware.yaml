first_step:
  how: Come during open hours, Wednesday to Sunday from 10 am to 4 pm between March 1 and December 15,
    and join a weekend tour at 11 am or 2 pm.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: General admission needs no sign up, and the Join Us membership gives a clear way to join. The
    site does not describe any volunteer role.
  what_to_expect: A visit is a walk around a historic fort on the Delaware River, with a shaded riverfront
    picnic area and free parking. Weekend tours run at 11 am and 2 pm, and a cannon demonstration happens
    at 1 pm. Some living history events cost extra on top of admission.
  first_visit_tips:
  - Parking is free once you follow the signs into the fort.
  - The site does not describe wheelchair access, so call 856-831-5690 before you come.
  - Leashed pets are welcome on the grounds, though cannon and musket demonstrations may frighten some
    animals.
