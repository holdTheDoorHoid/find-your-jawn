schedule:
  text: Open to visitors Wednesday to Sunday, 10 am to 4 pm, from March 1 to December 15. Weekend tours
    run at 11 am and 2 pm, and a cannon demonstration is at 1 pm. From December 15 to March 1 the fort
    is open only for private events and appointments. School and group tours can be booked in advance,
    seven days a week.
