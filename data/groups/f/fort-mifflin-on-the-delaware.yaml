summary: A historic fort on the Delaware River in southwest Philadelphia, run by a nonprofit. It hosts
  school and scout visits, guided tours, cannon and living history demonstrations, and candlelit ghost
  tours.
what_you_do: Visit the fort on an open day, take a tour, bring a school or scout group, or join as a member
  to support its historic programs and restoration.
