cost:
  level: low
  text: The 2025 admission prices were $16 for adults, $14 for seniors, $12 for veterans, and $10 for
    children 6 to 12. Children 5 and under and active duty military with ID are free. Some living history
    events cost extra. Membership, called Join Us, runs $35 to $275 a year and includes free general admission.
