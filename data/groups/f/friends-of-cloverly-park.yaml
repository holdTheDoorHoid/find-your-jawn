summary: Neighbors who care for Cloverly Park in Northwest Philadelphia. They hold Love Your Park work
  days in May and November, look after the park's trees, and work to protect the Old Tennis Court Farm.
what_you_do: Join a May or November work day, pick up litter, or help with garden weeding and upkeep through
  the growing season. Cash donations are accepted any time, and some years the group holds a plant sale.
