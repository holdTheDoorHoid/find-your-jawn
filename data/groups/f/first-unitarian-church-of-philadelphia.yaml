  notes: The first floor, including the Sanctuary and Parish Room, is wheelchair accessible, with wheelchair
    seating in the Sanctuary. A temporary ramp at the Van Pelt Street entrance was installed in 2023.
    The Sanctuary has a hearing loop for hearing aid users. The site does not say about an elevator, ASL,
    captioning or a quiet room.
