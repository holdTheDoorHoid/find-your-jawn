summary: A volunteer effort of the Jewish Federation of Greater Philadelphia that restores Jewish cemeteries,
  including Har Nebo in Oxford Circle. Volunteers clear brush and trash, help with headstone work alongside
  professionals, and help digitize burial records.
what_you_do: Help with cleanups, which include cutting back vines and weeds and picking up trash, or join
  the headstone and plot work or the records project. Some volunteers help digitize about 26,000 records
  and cards at Har Jehuda.
