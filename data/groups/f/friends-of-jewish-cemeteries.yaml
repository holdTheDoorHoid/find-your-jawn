first_step:
  how: Email Jeffrey Lasday at jlasday@jewishphilly.org and ask to be added to the volunteer mailing list
    for work days.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The group is open to community members and neighbors and gives a named contact and a mailing
    list to join. The page does not describe a beginner program or set work days.
  what_to_expect: Work days are not published, so the first step is a conversation with the group's contact.
    Typical tasks are cutting vines, pulling weeds and picking up trash, and stone lifting and repair
    are done with a certified professional. The page lists no fee to volunteer.
  first_visit_tips:
  - Ask before you come how long a work day lasts, what to bring or wear, and whether children may join,
    because the page does not say.
  - Headstone repair is heavy work done with professionals, so ask which tasks a newcomer would do.
  - Har Nebo is in the Oxford Circle neighborhood of Northeast Philadelphia, and the page gives no street
    address.
