summary: Volunteers who clean up and restore historic Jewish cemeteries in the Philadelphia area, including
  Har Nebo in Northeast Philadelphia. The work is hands-on, and some volunteers help with burial records.
what_you_do: Cut vines, weed trees, pick up trash, support headstone restoration pilots with professional
  conservators, and help digitize burial records at Har Jehuda.
