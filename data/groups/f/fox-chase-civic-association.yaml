first_step:
  how: Come to the second Wednesday meeting at 7:30 pm at Loudenslager Post 366, 7976 Oxford Ave. If you
    live inside the membership area in the by-laws, you can join as a member for $10 a year.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Neighbors can attend the open monthly meeting, and membership is a small, clear step. The site
    does not use newcomer language, so it is rated 3.
  what_to_expect: The monthly meeting is in person at the American Legion post and starts at 7:30 pm,
    held with the Town Watch. The site says you can voice concerns, learn what is new, and meet local
    police, state and city representatives. Membership dues are $10 a year and are for residents inside
    the area set by the by-laws.
  first_visit_tips:
  - Check the meeting dates on the home page first, since there are no meetings in August or December.
  - Watch for orange notices posted outside nearby homes or businesses; they warn of projects that need
    a zoning variance, and the site explains how to read them.
  - Confirm the group's email address before you write, since the site lists two different addresses.
  - Each household can have up to two members.
