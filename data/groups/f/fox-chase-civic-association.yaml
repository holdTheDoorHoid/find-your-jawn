summary: The neighborhood civic group for Fox Chase. It meets monthly with the Fox Chase Town Watch, reviews
  zoning and building proposals near the neighborhood, and works with local police and elected officials.
what_you_do: Neighbors come to the monthly meeting to voice concerns, learn what is new, and meet local
  police and elected officials. Residents can join as dues-paying members, and neighbors can send questions
  about zoning notices to the group.
