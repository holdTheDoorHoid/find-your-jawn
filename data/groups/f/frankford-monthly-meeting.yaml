summary: A Quaker meeting in Frankford with Sunday worship at its meetinghouse and by Zoom, a First Day
  School on Sundays, and family worship on fifth Sundays. The meeting's own page says children are welcome.
what_you_do: Join Sunday worship at 10:30 am, in person or by Zoom (email the meeting for the link). On
  fifth Sundays, children stay with the adults for worship and activities built around a theme. The monthly
  business meeting is held on third Sundays after worship.
