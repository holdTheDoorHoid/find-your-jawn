summary: A Quaker meeting in Frankford that worships on Sunday mornings at its meetinghouse, with Zoom
  worship available on request. The meeting says children are welcome and holds family worship on fifth
  Sundays, but a regional listing says children's programs are suspended.
what_you_do: Join Sunday worship at 10:30 am at the meetinghouse, or email the clerk for the Zoom link.
  On fifth Sundays, children stay with the adults for worship and themed activities. The monthly business
  meeting is held on third Sundays after worship.
