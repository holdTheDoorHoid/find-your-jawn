summary: Neighbors who look after Weccacoe Playground in Queen Village. They keep the playground in shape,
  help with cleanups, and coordinate tennis programs with the South Philly Tennis Association.
what_you_do: Help maintain the playground and its equipment, join cleanup days, and take turns with neighbors
  who open the gates in the morning and close them at night. Ask about the weekly community tennis and
  lessons.
