summary: Neighbors who look after Weccacoe Playground in Queen Village. They keep the playground in shape,
  help with cleanups, and coordinate tennis programs with the South Philly Tennis Association.
what_you_do: Help maintain the playground and its equipment, join cleanup days, and take turns locking
  the park each night and unlocking it each morning. Ask about the weekly community tennis and lessons.
