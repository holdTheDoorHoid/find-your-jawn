first_step:
  how: Start the online volunteer application at laurelhillphl.com/support/volunteer, or email volunteers@laurelhillphl.com
    to join the list for events and planting days.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Volunteering needs an online application with a membership step, and the page describes no beginner
    program. Visitors can walk the grounds free, so a first visit needs no application.
  what_to_expect: The application asks which areas interest you, such as tour guiding, archives, events
    or planting, and which days and times you can come. For a first look, walk the grounds during gate
    hours or join one of the dated public tours on the tours page. The page does not mention an orientation,
    so ask what a new volunteer is trained to do.
  first_visit_tips:
  - 'Check gate hours first: 7 am to 7 pm from spring through fall, and 7 am to 5 pm in winter.'
  - Laurel Hill East is in Philadelphia at 3822 Ridge Ave, and West Laurel Hill is in Bala Cynwyd, so
    confirm which cemetery a tour or event is at.
  - The free audio tour app covers Laurel Hill East and lets you plan a walk on your own.
  - Questions about tours go to tours@laurelhillphl.com or 215.228.8200.
