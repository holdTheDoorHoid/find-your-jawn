summary: A nonprofit that helps look after two historic cemeteries, Laurel Hill in Philadelphia and West
  Laurel Hill in Bala Cynwyd. Volunteers help restore monuments and grounds, and the group runs tours
  and events.
what_you_do: Volunteers help with events, tour guiding, archive and records work, arboretum plantings
  and special projects. Volunteers must be 18 or older, and students can arrange internships.
