summary: A community-led food forest in Fernhill Park in Southwest Germantown. Neighbors plant and tend
  fruit trees, berry bushes, herbs, and vegetables on public land, and neighbors are invited to eat what
  grows.
what_you_do: Volunteer during the Saturday open hours. Volunteers water new trees, weed, spread mulch,
  and help with planting and community work days. Weavers Way Co-op members can earn co-op volunteer hours
  here, and local schools have held student work days.
