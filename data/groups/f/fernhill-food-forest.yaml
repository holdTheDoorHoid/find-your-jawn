  what_to_expect: Saturday hours run from 10 am to noon, and the group says anyone can help. Tasks include
    watering newly planted trees, weeding, spreading mulch, and planting or community work days when they
    are scheduled. The site does not state a cost, and Weavers Way co-op members can count their hours
    here.
  first_visit_tips:
  - Email fernhillfoodforest@gmail.com to confirm the meeting spot before you come, since the article
    gives no street address.
  - Plan on outdoor, hands-on work such as weeding and mulching.
  - Weavers Way Co-op members can count these hours toward their co-op volunteer time.
