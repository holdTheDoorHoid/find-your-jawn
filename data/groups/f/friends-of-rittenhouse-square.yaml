summary: A nonprofit that helps look after Rittenhouse Square in Center City. Donors can adopt a bench
  or sponsor a lawn to help pay for upkeep, and the group runs public events, including a fall craft show
  and a Halloween family day.
what_you_do: Sign up through the volunteer form for the Wednesday morning drop-in, where you help with
  fall garden and leaf work. You can also become a member, adopt a bench, sponsor a lawn, or come to a
  public event.
