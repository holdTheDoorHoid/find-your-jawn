first_step:
  how: Fill in the Volunteer Registration Form on the group's volunteering page, then come to the Wednesday
    9:30 am drop-in at the Guard House.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The group has a public volunteer form and a fixed weekly drop-in, but the page does not say beginners
    are welcome or that training is given.
  what_to_expect: The drop-in runs 9:30 to 11:30 am on Wednesdays at the Guard House. You work alongside
    staff on fall tasks such as gardening, pulling out summer plants, weeding and leaf cleanup. The page
    does not say what to wear or bring.
  first_visit_tips:
  - Complete the Volunteer Registration Form before your first visit, since signup is required.
  - Meet at the Guard House when the drop-in starts at 9:30 am.
  - The group lists public events on its calendar, such as a fall craft show and a Halloween family day,
    if you want a social first visit.
