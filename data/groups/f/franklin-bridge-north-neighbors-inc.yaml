summary: A resident-run neighborhood group for Old City, covering the area from the Ben Franklin Bridge
  north to Callowhill Street and from Letitia Street east to 6th Street. It follows zoning and planning
  and shares neighborhood news, with community meetings and cleanups.
what_you_do: Neighbors reach the group by email or its Facebook group, then come to a community meeting
  or neighborhood cleanup. Membership needs annual dues set by the board, and general meetings and events
  are open to the public.
