first_step:
  how: Email franklinbridgenorthneighbors@gmail.com to ask for the next community meeting or cleanup,
    or join the group's Facebook group, where in person events are announced.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The bylaws say general meetings and events are open to the public and that you do not need to
    be a member to attend. The site does not post meeting times, so a first timer has to ask.
  what_to_expect: The site does not describe a typical meeting or cleanup and does not post meeting times,
    so ask by email first. The bylaws require the membership and the board to meet at least once every
    three months, and you do not need to be a member to come.
  first_visit_tips:
  - Ask by email for the next date, time, and place before you come.
  - Join the Facebook group so you hear about cleanups and meetings when they are announced.
