summary: Frankford CDC is a Neighborhood Advisory Committee listed by the City of Philadelphia, a local
  community organization that works with the City on services and priorities in the Lower Northeast part
  of the city. It is also a registered community organization, so developers are asked to talk with it
  about nearby zoning and building plans.
