first_step:
  how: Call (215) 743-6580 or send a message through the contact form on frankfordcdc.org, and ask how
    to hear about upcoming workshops and volunteer needs.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The site lists a phone line, a contact form, and a newsletter, but no meetings, volunteer roles,
    or visiting hours, so the way in is unclear.
  what_to_expect: The site does not list a regular meeting, volunteer shift, or visiting hours, so a first
    step is a call or a message. Its events calendar showed no events for October 2026 when we checked.
    The group runs business, housing, workforce, and public space programs, and its office is on the second
    floor of the Daral Building. The site does not mention a fee for these services.
  first_visit_tips:
  - Call ahead or send a message first, since no visiting hours are posted.
  - The office is on the second floor of the Daral Building, 4667 to 4669 Paul Street, Philadelphia 19124.
  - Ask whether a business, housing, or job program fits what you need.
  - Sign up for the newsletter to hear about workshops and events.
