summary: Frankford CDC is a community development group in Lower Northeast Philadelphia. It works on small
  business help, affordable and workforce housing, job programs, and keeping vacant lots and corridors
  clean. The City also lists it as a neighborhood advisory group.
what_you_do: The group runs business, housing, workforce, and public space programs in Lower Northeast.
  The site does not list volunteer roles.
