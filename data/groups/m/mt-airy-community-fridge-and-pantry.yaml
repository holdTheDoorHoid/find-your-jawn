first_step:
  how: Come to the covered awning between the two entrance doors that face Stenton Avenue. No registration
    is needed. To volunteer, use the Get Involved page.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: Anyone can take items with no registration and no income check, and the site lists a clear way
    to volunteer.
  what_to_expect: Visit the covered awning, where two fridges and two pantries hold food and hygiene supplies
    that you can take for free. Stock changes day to day with donations, so a particular item may be gone
    when you arrive. Groups or students can contact the pantry to arrange a session on healthy eating
    and food preparation.
  first_visit_tips:
  - Street parking on Stenton Avenue is limited, and the active driveway is not for parking.
  - The site asks visitors to be careful when opening doors on Stenton Avenue.
