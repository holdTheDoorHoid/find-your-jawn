summary: A fridge and pantry under the awning at a site on Stenton Avenue in Mt. Airy. Anyone can take
  items for free, with no sign-up or income check.
what_you_do: Take food and hygiene supplies for yourself, your family, pets, friends or neighbors, or
  volunteer your time at the pantry. The group also offers nutrition education for classes and groups.
