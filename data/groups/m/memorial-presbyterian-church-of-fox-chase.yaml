summary: A Presbyterian church in Fox Chase with an 11 am Sunday service, a children's ministry for children
  of all ages, and Food for Hope, a food pantry that gives out food bags on Saturdays.
what_you_do: Attend Sunday worship at 11 am, enroll children in the children's ministry with the registration
  form, or volunteer through the church's volunteering form. Food for Hope gives food bags on Saturdays
  to people in Fox Chase and nearby who need them, with no ID required.
