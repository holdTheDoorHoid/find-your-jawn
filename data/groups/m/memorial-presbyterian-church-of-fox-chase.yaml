    welcome message or new-here steps.
  what_to_expect: The site does not describe a Sunday visit, so the office is the best place to ask. Worship
    starts at 11 am. The children's ministry is listed for children of all ages, with Sunday School, Junior
    Church, and a program called Jesus and Me, but the site gives no session times.
  first_visit_tips:
  - Call or email before your first Sunday to ask about parking and which entrance to use, since the site
    does not say.
  - For children, use the registration form linked from the children's ministry page.
  - Ask about accessibility before you come, since the site lists none.
