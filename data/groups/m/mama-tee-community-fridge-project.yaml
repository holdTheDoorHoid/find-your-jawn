summary: A volunteer-run network of community fridges across Philadelphia that puts fresh food within
  reach of neighbors. It also runs a pop-up grocery store on Washington Avenue.
what_you_do: Help stock the fridges with fresh produce, organize donations, join a school or company volunteer
  day, or help with projects from home. Volunteers start by sending an email.
