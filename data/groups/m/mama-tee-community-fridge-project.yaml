first_step:
  how: 'Email hello@mama-tee.com with the subject line for the track you want: Volunteer Inquiry for the
    regular volunteer track, Corporate or School Volunteer Inquiry for a group day, or Virtual Volunteer
    Inquiry for remote work.'
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Three volunteer tracks are listed openly with a direct email route, but the page gives no shift
    days, times or training, so the first shift is arranged by email.
  what_to_expect: Regular volunteers help stock the fridges with fresh produce, sort donations, and connect
    surplus food with people who need it. Shift times, training and what to wear are not published, so
    the first step is an email conversation. Fridge food is free and open to any neighbor, and the fridges
    are restocked each week.
  first_visit_tips:
  - Pick the email subject line that matches your track, so the group can send you the right next step.
  - The fridge locations page marks four fridges as out of order and one as relocating, so check that
    page before you go to a site.
  - For the pop-up grocery store at 2203 Washington Ave, call 215-585-2767 to ask about its hours.
