summary: A youth and community center at 11080 Knights Road, run by the Muslim Society of Delaware Valley.
  It offers Friday prayer, Quran reading sessions, a Sunday teen circle, an adult Quran reading circle,
  and occasional events such as a sisters' wellness series.
what_you_do: Pray Jumu'ah on Fridays, join a Quran reading session, or come to the Sunday Teen Seekers
  circle or the adult Quran reading circle. The center also lists a weekend learning program for children,
  a summer camp, and volunteer roles through an interest form.
