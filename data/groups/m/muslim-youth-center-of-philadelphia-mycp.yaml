schedule:
  text: Jumu'ah prayer is every Friday from 1:15 to 2 pm, year-round. The imam holds walk-in office hours
    on Fridays from 4 to 6 pm. Teen Seekers (2 to 5 pm) and an adult Quran reading circle (4:30 to 6:30
    pm) meet on Sundays, and Quran reading sessions run Monday to Thursday, 5 to 7 pm. One-off events
    such as the sisters' wellness series are listed by date on the calendar.
