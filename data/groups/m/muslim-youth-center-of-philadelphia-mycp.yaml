    newcomer program or say who may attend each event.
  what_to_expect: Friday prayer begins with the khutbah at 1:15 pm at the center. The Sunday Teen Seekers
    circle runs 2 to 5 pm, and the adult Quran reading circle runs 4:30 to 6:30 pm. The pages do not describe
    what happens in each session, the cost, or who may attend, so call or email the center before your
    first visit.
  first_visit_tips:
  - Call or email ahead to ask whether a session is open to you, since the site does not say who may attend
    each event.
  - The imam's Friday office hours are walk-in, first come first served, or you can book by email.
  - Plan your trip to 11080 Knights Road, Philadelphia 19154; the site does not give transit or parking
    details.
  - If you want to help, fill out the MYCP Volunteer Interest Form on the volunteering page.
