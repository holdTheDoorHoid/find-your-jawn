summary: A youth and community center at 11080 Knights Road, run by the Muslim Society of Delaware Valley.
  It has Friday prayer, Quran reading sessions, a teen circle and a sisters' wellness series.
what_you_do: Pray Jumu'ah on Fridays, join a Quran reading session or a Teen Seekers circle, or come to
  the Muslim Youth Circle or the sisters' wellness series. The center also lists a weekend learning program,
  summer camp and volunteering.
