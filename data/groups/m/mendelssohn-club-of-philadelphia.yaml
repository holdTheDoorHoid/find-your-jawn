first_step:
  how: Fill out the audition interest form on the Join Us page. The 2026 to 2027 auditions are closed,
    and you will be notified when more information is available.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Singers must audition and pay a season fee, and the 2026 to 2027 auditions are closed. The site
    does not say whether visitors can sit in on rehearsals.
  what_to_expect: 'An audition takes under 10 minutes: you sing a short prepared piece, sight-read a short
    excerpt, and do sing-back and ear exercises at the piano. The chorus is mostly volunteers with about
    125 active members, and it looks for past singing experience and the ability to read music. Accepted
    singers rehearse Wednesday evenings from 7:30 to 10 pm and pay a season fee. Concert tickets listed
    on the site run $15 to $45.'
  first_visit_tips:
  - Rehearsals meet at Settlement Music School on Queen Street, and the site says parking is available.
  - For an audition, bring a short prepared piece, such as a simple song, a choral excerpt, or an aria.
  - Concerts are held at the Church of the Holy Trinity on Walnut Street.
