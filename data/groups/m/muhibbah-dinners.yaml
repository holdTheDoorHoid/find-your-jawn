summary: A yearly communal dinner in Philadelphia where several chefs cook one shared menu. Proceeds go
  to local groups that serve immigrant and refugee families.
what_you_do: Buy a ticket or donation option for the dinner, eat the meal, and learn the menu on the night.
  Volunteers join the crew that helps run each dinner, and the group sends volunteer roles to its mailing
  list.
