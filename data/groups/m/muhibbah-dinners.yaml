    form the crew that helps the dinner run.
  first_visit_tips:
  - Join the mailing list, or follow the group on Instagram at @muhibbahdinners or on Facebook, so you
    hear when the next dinner is announced.
  - Plan on a donation of $25, $50 or $100 when you buy through the tickets page.
  - Ask the group about seating and access before you buy, since the site does not say.
