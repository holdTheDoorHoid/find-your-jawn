first_step:
  how: Email info@thanksgivingparade.org to sign up as a banner carrier, or fill in the parade application
    form (a PDF on the site) and email it to the same address.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Anyone can apply by email to march, carry a banner, or enter a float. The site names no beginner
    program, orientation, or practice.
  what_to_expect: Marchers and banner carriers gather at staging areas along the route before the noon
    start. The site's order of march page says units can begin assembling around 10:30 am, and the committee
    can change the order on the day. The site names no fee and describes no practice session.
  first_visit_tips:
  - Plan to arrive around 10:30 am if you are marching, since units gather early.
  - Staging areas get crowded and parking is limited, so plan a ride or transit.
  - Report to a division captain, who wears an orange vest, when you arrive.
  - Do not hold impromptu performances, since they slow the parade.
