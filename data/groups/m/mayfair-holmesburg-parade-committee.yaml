summary: The volunteer committee that puts on the Mayfair and Holmesburg Thanksgiving Parade each November.
  Neighbors can carry a banner, march, or enter a homemade float.
what_you_do: Carry a banner (7th grade and older; banner carriers earn 6 community service hours), apply
  to march in the parade, or build a homemade float and enter it for a best-float ribbon.
