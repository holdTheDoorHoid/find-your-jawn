first_step:
  how: Buy a timed entry ticket online through the ticket link on moaphilly.org. Booking ahead cuts the
    wait, and walk-up entry depends on availability.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Open to the public with online timed tickets, and the visit page says the experience is designed
    for all ages. Walk-up entry depends on availability.
  what_to_expect: Plan for 90 minutes to 2 hours, with no time limit. Staff greet you about 10 minutes
    before your slot, explain the house guidelines, and then you explore the six stories on your own,
    with performers who respond to what you do. Wear comfortable shoes, and expect steps, uneven floors
    and low lighting in some areas.
  first_visit_tips:
  - Wear comfortable shoes, since the building has many levels and some uneven areas.
  - Leave large bags, backpacks and strollers at home. Lockers are available.
  - Street parking is limited. Nearby garages are listed, and SpotHero or meterUP can reserve a space.
  - Empty water bottles are fine, and there are refill stations inside.
