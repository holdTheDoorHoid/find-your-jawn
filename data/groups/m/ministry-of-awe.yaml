  notes: 'Service animals are welcome. The building is described as ADA compliant, but the two visitor
    pages disagree on elevators: one says every level except the basement, and the other says only floors
    one to four, with no elevator to the basement or fifth floor. Some areas have steps, uneven floors
    and low lighting. Nearest SEPTA stop, per the visitor guide: Market-Frankford Line, 2nd Street station.'
