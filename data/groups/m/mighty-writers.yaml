summary: A free nonprofit that helps Philadelphia kids ages 7 to 14 get better at writing. Volunteers
  help with homework at its after school Academy or mentor one young writer over time.
what_you_do: Writing Assistants help students with homework and writing, one shift of 1 to 4 hours a week.
  Mentors meet their mentee 2 to 4 times a month for at least a year. Big Brothers Big Sisters handles
  screening and matching for mentors.
