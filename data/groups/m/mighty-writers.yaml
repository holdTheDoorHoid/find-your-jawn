first_step:
  how: Submit the volunteer registration form from the group's volunteer page, then email volunteers@mightywriters.org
    with any questions about clearances.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Volunteering starts with a registration form, role-based clearances and an orientation, and the
    site does not say what happens after you apply.
  what_to_expect: Writing Assistants give one 1 to 4 hour shift a week at the after-school Academy, helping
    with homework and writing and sometimes at snack time or outdoor play. Volunteers commit to at least
    six months, and staff walk new volunteers through clearances during orientation. Mentors meet a student
    2 to 4 times a month for at least a year, and Big Brothers Big Sisters handles their screening and
    training.
  first_visit_tips:
  - Ask which center has Writing Assistant openings, since the site does not name the select locations.
  - Plan on at least six months of help, because the group says longer service matters most with young
    people.
  - Mentoring can be done virtually or in person.
