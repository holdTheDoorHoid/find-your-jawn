summary: A free nonprofit that helps Philadelphia kids get better at writing. Volunteers help with homework
  at its after-school Academy, mentor one young writer over time, or help with food and diaper distribution.
what_you_do: Writing Assistants help students with homework and writing, one shift of 1 to 4 hours a week,
  at select locations. Mentors meet their mentee 2 to 4 times a month for at least a year, and Big Brothers
  Big Sisters handles screening and matching. Distribution volunteers work one 3 to 4 hour shift a week,
  unloading deliveries and running food and diaper distribution.
