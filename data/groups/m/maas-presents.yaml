summary: An arts venue in North Philadelphia that presents the MAAS Presents concert series, public nights
  such as monthly Jazz Nights, and a summer outdoor Garden Bars series. It also rents rooms for rehearsals
  and classes and offers no-cost residencies to artists.
what_you_do: Buy a ticket to a MAAS Presents show, or go to a monthly Jazz Night or a summer Garden Bars
  concert. Artists can ask about the no-cost January to March residencies. To rent a room for a rehearsal,
  performance or class, email booking@maasbuilding.com.
