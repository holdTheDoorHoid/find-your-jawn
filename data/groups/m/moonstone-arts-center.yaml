first_step:
  how: Pick a public reading from the events page and come along. To read at an open reading, call the
    center at 215-735-9600 and ask how to sign up.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Events are listed publicly with dates and venues, so anyone can come. The site does not explain
    how to sign up for an open reading.
  what_to_expect: Most events are poetry readings by featured poets, and some include an open reading
    or open mic. The site does not say how to sign up to read, so ask first if you want a turn. Check
    the event page for the venue and whether it is free.
  first_visit_tips:
  - Check the event page for the venue, since events are held at the center, at Fergie's Pub, and at other
    spots.
  - Ask the center by phone how to sign up before you plan to read.
  - The center posts recent readings on its YouTube channel if you want a preview.
