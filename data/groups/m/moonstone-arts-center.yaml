summary: A Philadelphia arts nonprofit founded in 1981 that focuses on literature. It runs about 100 programs
  a year, mostly poetry readings, and publishes books through Moonstone Press. Some events are free.
what_you_do: Attend a public reading, or read your own poem at an open reading when the event offers one.
  The center also lists intern and volunteer roles in publishing, design, film, and grant research.
