first_step:
  how: Call (215) 471-7073 and ask how to join the Jawala Scouts or start volunteering, since the site
    names no volunteer roles.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The site invites visitors to volunteer and lists the Jawala Scouts, but it gives no ages, meeting
    times or sign-up steps for either.
  what_to_expect: The Jawala Scouts are described as a network of Muslim men who mentor young men, teaching
    riding, swimming, shooting, wrestling and small business skills through outdoor experiences. The site
    does not say when or where sessions meet, what the ages are, or what it costs. Ask about those details
    before you come, because the site gives none of them.
  first_visit_tips:
  - Call before you visit, since the site gives no meeting times or ages for the scouts.
  - The email on the contact page shows one address but links to another, so the phone may be the safer
    route.
  - The masjid is at 413 South 60th Street.
