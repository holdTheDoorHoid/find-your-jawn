summary: Mt. Airy Business Improvement District is the business district for Germantown Avenue in Mt.
  Airy. It keeps the commercial strip clean, cares for six small pocket parks, and holds open Zoom meetings
  where neighbors can hear about and respond to development projects.
what_you_do: Cleans the Mt. Airy commercial corridor six days a week and runs projects such as flower
  baskets, holiday decor, and banners. Offers a facade improvement grant for property and business owners.
  The board meets on the second Tuesday of the month, and the zoning page lists public zoning and design
  review meetings for projects along Germantown Avenue.
