first_step:
  how: Register for the next zoning meeting through the Zoom link on the group's zoning page.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Zoning meetings are online, and residents register through the Zoom links on the page. The page
    does not mention membership or fees.
  what_to_expect: Each zoning meeting reviews one development project. The listed zoning discussions ran
    about an hour, and one design review ran 90 minutes. Meetings are held on Zoom with a phone option,
    and the page does not describe how comments are taken or what the group does with them.
  first_visit_tips:
  - Register through the Zoom link on the zoning page, since that is the way in the page lists.
  - Some meetings can also be joined by phone, so use the dial-in on the meeting listing if you prefer.
  - Board meetings are on the second Tuesday at 12:15 pm, but the page gives no Zoom link, so email the
    group for details.
