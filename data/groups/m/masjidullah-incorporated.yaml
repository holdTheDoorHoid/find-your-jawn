first_step:
  how: Call the office at 215-621-7800 or email inquiries@masjidullah.org to ask whether visitors can
    join Friday prayer or the Sunday Islam 101 class.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The site sends people to membership and volunteer forms and does not say whether visitors can
    attend Friday prayer or the classes. A phone line and an email address are listed.
  what_to_expect: Friday prayer is held every week at 1:15 pm at the mosque on Limekiln Pike, and the
    site lists a Sunday Islam 101 class and a Monday evening Seerah series. The site does not describe
    what visitors should do, how long sessions last, or what they cost. The office can answer those questions
    before you come.
  first_visit_tips:
  - The business office is open Monday to Thursday, 10 am to 4 pm, and Friday, 9 am to 1 pm, so call during
    those hours.
  - Ask about the Islam 101 class cost and sign-up before you come, since the site lists neither.
  - The grocery program lists no application steps, so call the office to ask how to get a bag.
