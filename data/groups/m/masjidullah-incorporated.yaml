summary: A mosque on Limekiln Pike with Friday prayer and programs for families. The site also lists health
  and human services and Ramadan programs, and links to a child care center and a learning institute on
  their own sites.
what_you_do: Attend Friday prayer at 1:15 pm, sign up to volunteer through the site, ask the office about
  the child care center and the New Medina Institute, or ask about the free grocery bags through Health
  and Human Services for people with low or no income.
