summary: A Jewish young adult house in Philadelphia for people in their 20s and their friends. It hosts
  about seven events a month, such as talks, learning sessions, a Moishe Eats series, and holiday parties.
what_you_do: Email the house or use the contact form to ask about an event, then come to a gathering such
  as a talk, a nigun circle, or a tasting.
