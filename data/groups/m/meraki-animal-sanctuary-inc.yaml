summary: A registered nonprofit animal sanctuary that cares for animals in need until they can go to permanent
  homes. Volunteers can foster cats, including mother cats and kittens, through its foster program.
what_you_do: Foster a cat, a litter, or a friendly stray for a short stay in your home. The sanctuary
  provides a starter kit, and you can also adopt through the Adopt page or donate supplies or money for
  vet visits. The site does not describe general volunteer shifts.
