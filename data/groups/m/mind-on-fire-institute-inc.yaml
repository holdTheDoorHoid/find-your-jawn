    the site does not say whether seats are open or how a newcomer is placed.
  what_to_expect: Each session is a discussion, not a lecture, and runs 90 minutes to 2 hours. Past sessions
    have covered more than 100 texts, from classical philosophy to modern science fiction. The site does
    not list a price.
  first_visit_tips:
  - Email early, since each group is capped at eight people.
  - Ask whether your group meets online or in person, and where, because the site does not say.
