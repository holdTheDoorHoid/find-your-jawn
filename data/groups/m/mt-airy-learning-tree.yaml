first_step:
  how: Create an online account, pick a class in the online catalog, and sign up online. You can also
    sign up by phone at 215-843-6333 or in person at the office at 6601 Greene St, Monday to Thursday,
    9 am to 2 pm.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Any adult can sign up for a class online, and several listed courses are labeled for beginners,
    but the site does not describe a welcome program for new students.
  what_to_expect: Each class sets its own dates and fee, and you also pay a $6 registration fee each term.
    Classes meet at many sites across Northwest Philadelphia, including churches, schools, and the Greene
    Street office. Some courses show as full with a waitlist option, and the page does not say how large
    classes are.
  first_visit_tips:
  - Read your confirmation email, since some classes meet at other sites and it gives directions.
  - To cancel for a refund, call or email the office at least 2 days before the first class. The $6 term
    fee is kept.
  - You cannot cancel online, so do not rely on the website to cancel.
  - Ask the office about parking and room access before a first class, since the site does not give them
    for every room.
