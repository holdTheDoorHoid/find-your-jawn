summary: An adult learning center in Mt. Airy, called MALT on its site. It offers a large catalog of paid
  classes in three terms a year, covering arts, cooking, computers, fitness, gardens, and more, and it
  holds a yearly garden tour as a fundraiser. Anyone can sign up for a class, and teachers can propose
  one through a form.
what_you_do: Take a class in person or online, propose a course to teach, or help with the garden tour
  and other events. Browse the current catalog by topic, location, or teacher. The site does not list
  volunteer sign-ups or a membership.
