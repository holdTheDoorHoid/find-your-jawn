summary: An adult learning center in Mt. Airy. It runs paid classes in arts, cooking, computers, fitness,
  gardening, and more, and holds a yearly garden tour and a house tour as fundraisers. Anyone can sign
  up for a class, and teachers can propose one through a form.
what_you_do: Take a class in person or online, propose a course to teach, or help with the garden tour
  and other events. The site does not list volunteer sign-ups or a membership.
