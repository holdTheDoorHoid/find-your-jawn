  basis: The Garden Club welcomes youth and adults and takes RSVPs, but its start date is not set yet,
    and cleanup dates go only to volunteers. The way in is unclear.
  what_to_expect: The Garden Club is described as a place to plant flowers, herbs and vegetables and learn
    about gardening, and youth and adults are welcome. Its date, time and place were still to be set when
    we checked, so the site cannot yet say what a visit involves. Cleanups work the streets and gardens
    of Mantua, and the site does not say how long they run or what volunteers should bring.
  first_visit_tips:
  - Ask which cleanup comes next and where volunteers meet, since the site gives no address for cleanups.
  - Watch the Garden Club page for a start date, because none is set yet.
