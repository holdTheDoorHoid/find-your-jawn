summary: A community baseball club in northwest Philadelphia that has run since 1985. It offers fall ball
  for kids ages 7 to 15, spring play from T-ball through age 15, summer travel teams, winter instruction,
  and camps. Parents and other adults can volunteer as coaches or umpires.
what_you_do: Kids register for fall or spring baseball, a summer travel team, winter instruction, or camp.
  Adults who want to coach can mark interest on a child's registration form or email the club, and the
  club contacts volunteers about coaching openings.
