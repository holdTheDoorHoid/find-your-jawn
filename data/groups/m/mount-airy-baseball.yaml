first_step:
  how: For a child, register through the TeamSnap form for fall ball, linked from the fall ball page.
    To coach, mark interest on the registration form or email mtairybaseball@yahoo.com.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Any child in the age range can register online and need-based help is offered, but the site does
    not say whether a child needs prior experience.
  what_to_expect: Fall ball is Sunday games at Mt. Airy fields, with start times between 9 am and 5 pm.
    Kids play in divisions set by birthday, and each player gets a team hat and jersey. Families see game
    times in TeamSnap once teams are set.
  first_visit_tips:
  - Check your child's birth date against the division dates on the fall ball page before you register.
  - Need help with the fee? Email mtairybaseballscores@gmail.com; the club says no child is turned away
    for inability to pay.
  - The site does not list equipment, so ask the club whether your child needs a glove.
  - Adults who want to coach need Pennsylvania child abuse and state police clearances, and head and assistant
    coaches attend clinics before the season.
