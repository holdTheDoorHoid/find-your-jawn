summary: A nonprofit art space in Mt. Airy with a gallery, weekly and monthly art groups, jazz jams and
  concerts, and community festivals. Visitors can see the gallery shows and join its clubs and music nights.
what_you_do: Join the weekly Figure Drawing Group, the Collage Club or the Photo Club (monthly), come
  to the Third Wednesday jazz jam (musicians can play for a small fee) or a concert, or see the gallery
  shows. Volunteers can sign up for weekly or biweekly shifts, or help on one project at a time, by emailing
  the group. To join as a member, download the form and mail it with a check, or pay online and mail the
  form.
