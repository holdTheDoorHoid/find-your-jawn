schedule:
  text: Figure Drawing Group weekly on Thursdays, 6:30 to 9:30 pm. Collage Club on the 2nd and 4th Fridays,
    6 to 8 pm, which the site describes as returning in October. Third Wednesday jazz jam, doors 5:30
    pm and music 6 pm. Photo Club meets monthly, 12:15 to 2:15 pm. Gallery open Wednesday to Saturday
    noon to 6 pm and Sunday noon to 5 pm.
