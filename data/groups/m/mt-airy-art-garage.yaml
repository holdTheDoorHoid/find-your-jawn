summary: A nonprofit art space in Mt. Airy with a gallery, weekly and monthly art groups, jazz jams and
  concerts, and community festivals. Visitors can see the gallery shows and join its clubs and music nights.
what_you_do: Join the weekly Figure Drawing Group, the Collage Club or the Photo Club, come to the Third
  Wednesday jazz jam or a concert (musicians can sit in), or see the gallery shows. The site also has
  pages for membership and volunteering.
