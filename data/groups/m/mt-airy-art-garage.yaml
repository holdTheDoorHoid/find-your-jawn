first_step:
  how: Come to the Collage Club on Friday, October 9 or October 23, 6 to 8 pm, $10. No experience is needed
    and supplies are provided.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The Collage Club says no experience is needed and supplies are provided. The site also gives
    a clear way in for the other groups, such as an email address for the Figure Drawing Group.
  what_to_expect: A Collage Club visit runs two hours, from 6 to 8 pm on the 2nd and 4th Fridays, and
    costs $10. No art background is needed, and the club provides the supplies. The Figure Drawing Group
    meets weekly on Thursdays, and jazz jam tickets are $15 for general admission.
  first_visit_tips:
  - For the Figure Drawing Group, use the driveway and loading dock on the Mt. Pleasant Avenue side.
  - 'Jazz jam: bring your own snacks and drinks, and the group supplies ice and cups.'
  - Photo Club asks members to bring three images on a thumb drive to share.
  - The Collage Club is listed for October, so check the site before planning for later months.
