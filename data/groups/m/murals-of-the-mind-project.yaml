first_step:
  how: Register on the website or social media pages during open enrollment, or email contactmom@muralsofthemind.org.
    You can also call (215) 825-3300 and leave a message. Replies take 24 to 48 hours.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Workshops are open to the public for youth, most are free, and the site gives several clear ways
    to sign up. Spots are limited and filled first come, first served.
  what_to_expect: Youth join a set workshop term, usually six weeks with one or two meetings a week. Attendance
    is not required, but coming often helps because each week builds on the last. A 2025 college and career
    series met from 4 to 5 pm on Tuesdays at Baldi Middle School.
  first_visit_tips:
  - Watch for open enrollment, since spots are limited and go first come, first served.
  - If a workshop is full, ask to go on the waitlist. Applicants are emailed as spots open.
  - After you enroll, expect a confirmation email and a reminder one week before the start date.
  - Use contactmom@muralsofthemind.org, since the site also lists other email addresses.
