summary: A youth group in Philadelphia that runs workshops and mentoring for kids and teens ages 10 to
  17. Workshops cover essay and creative writing, creative performance, college and career exploration,
  and high school readiness.
what_you_do: Youth join set workshop terms, in person or online. Families sign up during open enrollment
  on the website or by email. Volunteers and staff who work directly with youth must pass an FBI and state
  background check and be fingerprinted.
