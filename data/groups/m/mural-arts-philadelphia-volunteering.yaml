  basis: Public murals and events are open to anyone and a phone line handles tours, but the site does
    not say how someone enrolls in the education or civic programs.
  what_to_expect: Public murals are free to see, and you can take a guided walking tour on set dates,
    though some tours have sold out. The site does not give tour prices or the time of each event, so
    call (215) 925-3633 or check the event listing before you go.
  first_visit_tips:
  - Call (215) 925-3633 early for walking tours, since some dates sell out.
  - Check each event listing for its time and location, because the calendar shows dates only.
  - The Mural Arts Center is at 1727-29 Mt. Vernon Street, Philadelphia 19130.
  - Ask about wheelchair or other access before you come, since the site does not describe it.
