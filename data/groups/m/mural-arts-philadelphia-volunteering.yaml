summary: A citywide public art nonprofit. Its programs include art education, public art and civic engagement,
  restorative justice, and Porch Light. It also runs guided walking tours and Mural Arts Month, a set
  of exhibitions, tours, and participatory events in October 2026.
what_you_do: Join a program, take a guided walking tour, visit a mural dedication or Mural Arts Month
  event, or use the Join the Action page to suggest a mural idea or report a mural that needs repair.
