  basis: The Wednesday pantry takes sign-ins, which is simple, but the site does not say how to join the
    elected subcommittee or whether its meetings are open to visitors.
  what_to_expect: The pantry is a weekly sign-in on Wednesday mornings at 9 am. The site does not describe
    a subcommittee meeting, so ask the office about its time and place before you go.
  first_visit_tips:
  - Plan to sign in when you arrive at the Wednesday pantry.
  - Call first to confirm when and where the subcommittee meets.
  - The site lists office hours of weekdays 9 am to 3 pm.
