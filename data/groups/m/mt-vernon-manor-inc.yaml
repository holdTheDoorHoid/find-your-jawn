summary: A community development group in the Mantua area of West Philadelphia, formed in 1977. It runs
  a weekly food pantry, helps residents with rent, utility and property tax costs, and runs the neighborhood
  advisory committee that links residents to City services.
what_you_do: Sign in at the Wednesday 9 am food pantry, ask for help with rent, utilities, property taxes
  or benefits, or take part in the elected neighborhood subcommittee, which meets monthly to name local
  needs.
