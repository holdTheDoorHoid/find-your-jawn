first_step:
  how: Use the Register Today link on the adult percussion classes page (a Google Form) to sign up for
    the free percussion workshop series, or email mamadele@mamadele.com to ask about adult classes at
    Dendezeiros Studio.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The free series is open to people of all backgrounds and has a registration form and an email
    for questions, but the pages do not say whether beginners are welcome.
  what_to_expect: The free percussion series is a four-part workshop led by Dendê Macêdo, covering rhythms,
    movement and history from Candomblé and samba de roda through hands-on practice, demonstrations and
    conversation. The page calls the series intergenerational and open to people of all backgrounds. Session
    times and session length are not published on the pages read, so confirm them when you register.
  first_visit_tips:
  - Ask about session times when you register, since the event listing does not show them.
  - The venue phone is 646-361-6918, but the event page does not link it to registration, so use the form
    or email to sign up.
