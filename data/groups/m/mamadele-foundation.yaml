summary: A Philadelphia arts foundation that teaches and performs the music, dance and culture of Bahia,
  Brazil. Its ensembles perform, it runs adult community classes and youth education programs, and it
  leads trips to Bahia.
what_you_do: Take the free percussion workshop series, ask about adult community classes at Dendezeiros
  Studio, come to a performance by one of the group's ensembles, sign up for the newsletter, or join a
  trip to Bahia. Schools in Philadelphia host semester-long residencies.
