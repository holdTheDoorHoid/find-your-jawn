first_step:
  how: Attend the Day of the Dead family event at the Penn Museum on Oct 24, 2026, from 1 to 4 pm, or
    check the events page for the next public event.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Events are public, the site describes some as free and family friendly, and volunteers apply
    through a form. The site describes no beginner or newcomer route.
  what_to_expect: Events run a few hours, and several are described as family friendly. The Day of the
    Dead event has family crafts like flower making and an altar contest where attendees vote. Event prices
    are not listed on the events page, so check before you go.
  first_visit_tips:
  - Check the events page for each event's date, time and place, since some items are still listed as
    to be determined.
  - The big events run for several hours, so plan for an afternoon.
  - To volunteer, use the volunteer form; you must be 18 or older.
