summary: A Philadelphia nonprofit that helps people without housing, people going hungry, and working
  households that are barely getting by. It links them to everyday needs and local resources, and it invites
  volunteers and partners to help.
what_you_do: Volunteers can sign up through the website's volunteer page, with separate forms for partners,
  advisory board members, and online helpers. The group also runs community tabling events that share
  resources and makes Kindness Kits for kids.
