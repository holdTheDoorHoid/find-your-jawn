summary: A nonprofit theater company that teaches classes in acting, musical theatre, comedy and film
  for children and teens, with camps and after-school programs. It also runs troupes for improv, cabaret
  and acting, and holds auditions for its productions.
what_you_do: Take a class during a fall, winter or spring term, sign a child up for a summer camp or after-school
  program, or join a troupe such as improv, cabaret or comedy. Auditions are held for productions.
