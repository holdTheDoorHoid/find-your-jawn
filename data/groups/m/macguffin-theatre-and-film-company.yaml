first_step:
  how: Sign up for a Fall 2026 class through the enroll page on macguffintf.com, or email info@macguffintf.com
    first to talk through your goals and ask about scholarships.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The classes page says beginners are welcome and invites a call or email to talk through learning
    goals, and the enroll page gives a clear route to sign up.
  what_to_expect: Classes run on Wednesdays and Saturdays during each term, and the After School Program
    meets on Tuesdays and Thursdays. Youth classes are for ages 7 to 10 and middler and teen classes for
    ages 11 to 18. The pages read do not give class length or term prices, so ask the office before you
    pay.
  first_visit_tips:
  - Auditions are held on the second floor at 2030 Sansom Street, behind a purple door, so look for that
    door on your first visit.
  - Ask about a scholarship before you pay. Applications are reviewed on financial need and take 2 to
    3 weeks to process.
  - The company uses an opt-out photo policy, so tell staff early if you do not want to appear in photos
    or videos.
