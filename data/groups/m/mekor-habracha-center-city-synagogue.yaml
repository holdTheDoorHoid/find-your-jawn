  basis: The homepage says visitors are welcome and gives a WhatsApp route and a newsletter sign-up. The
    visit page does not describe a first visit or say whether you must register.
  what_to_expect: The site does not describe a first visit in detail, so the office is the best place
    to ask what to expect. Shabbat morning prayers begin at 9:15 am, and a hot kiddush follows around
    11:30 am. The page says the shul welcomes members and nonmembers alike, but it does not say what visitors
    pay.
  first_visit_tips:
  - Call the office at 215-525-4246 before your first visit to ask what to wear and which entrance to
    use.
  - Check the davening schedule for current times, since winter times differ from summer.
  - If cost is a concern, ask about the payment plans the page says are available.
