  basis: The Find Your Fit page says the classes suit people with no stage experience, and adult dance
    has a $30 drop-in option.
  what_to_expect: Classes meet once a week for about an hour, in groups of 3 to 15, and each ends with
    a short showcase. Adult dance meets on Tuesday evenings and charges $30 a visit or $350 for a full
    session. The site does not say how a first class is booked, so call or email the studio first.
  first_visit_tips:
  - Mention your age or experience when you call, since the class list is split by age and grade.
  - Ask about scholarships or payment plans by email before you sign up, because the site points there
    for both.
  - Read the studio policy on registration and cancellations, which the site links to.
  - The studio is at 1301 Locust Street, zip 19107. The site does not give transit or parking details.
