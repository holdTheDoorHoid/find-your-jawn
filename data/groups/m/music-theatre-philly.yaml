summary: A nonprofit theater school for ages 2 and up that teaches singing, acting, and dance. It also
  runs an adult choir, adult dance classes, and productions for students and adults.
what_you_do: Take a class in singing, acting, dance, or art, or book a private lesson. Each class ends
  with a short showcase, and young performers can join a production; actors are cast at the first rehearsal.
