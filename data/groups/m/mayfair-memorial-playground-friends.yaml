first_step:
  how: Email the city's Parks and Recreation stewardship office at pprstewardship@phila.gov and ask to
    be connected with this Friends group, since the group's site lists no way to join or volunteer.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The site gives no way to join or volunteer, and its newest dated post is from 2021, so the way
    in is unclear.
  what_to_expect: The group's history page describes neighbors doing hands-on work, such as a 2011 build
    day with about 200 volunteers and mulching in later years. Recent volunteer days are not listed on
    the site, so ask by email what is coming up. The playground sits on Abraham Lincoln High School property.
  first_visit_tips:
  - The playground sits on Abraham Lincoln High School property, so ask the Parks office where to meet.
  - The newest posts on the site are from 2020 and 2021, so confirm that a volunteer day is still on before
    you come.
