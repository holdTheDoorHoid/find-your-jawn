first_step:
  how: 'Young men: send a request through the Help Now form on manupphl.org. Volunteer mentors: call 267-748-7818
    or fill in the volunteer form on the site.'
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Participants and mentors both start with a form or a call. The site does not describe what happens
    after the form or what a first meeting looks like.
  what_to_expect: Participants apply, then get a mentor and a support team. The programs page describes
    sessions on the causes of gun violence, life skills, money management and job readiness, plus a group
    session led by a licensed therapist. It does not say how long the program runs or what the first session
    is like.
  first_visit_tips:
  - Have your questions ready for the first call, since the site does not describe the first meeting.
  - Mentor applicants choose a volunteer type and the areas they can help with, such as jobs, education,
    or family support.
  - The site lists no walk-in hours, so start with the form or a phone call.
