summary: A mentoring program that works with young men in Philadelphia who are at high risk of gun violence.
  Mentoring is open to young men from age 13, with a stipend, and local adults can volunteer as mentors.
what_you_do: Young men can ask for help through the Help Now request form. Volunteer mentors can call,
  email or use the volunteer form.
