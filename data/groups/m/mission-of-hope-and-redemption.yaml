summary: A volunteer-run food pantry in Philadelphia where families choose their own groceries. It serves
  about 200 families a week and also runs outreach with essential supplies and school support.
what_you_do: Register in person at the Thursday pantry, then shop for your own food. Volunteers help run
  the pantry, and the group asks people to reach out through its contact page to join.
