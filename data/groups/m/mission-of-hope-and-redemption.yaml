first_step:
  how: Go to the pantry on a Thursday between 11 am and 1:30 pm and register in person with your name,
    address and phone number.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The pantry has a set day, hours and address, and registration happens when you arrive. The site
    does not list eligibility rules or a phone line.
  what_to_expect: You register when you arrive, giving your name, address and phone number. Then you pick
    the foods that fit your household's needs, a shopping style the group calls client choice. The site
    does not say how long a visit takes, whether bags are given, or what else happens there.
  first_visit_tips:
  - Have your name, address and phone number ready for registration.
  - Bring your own bags, since the site does not say whether bags are provided.
  - The site does not list eligibility, so ask at the door if you are not sure you qualify.
