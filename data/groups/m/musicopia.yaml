summary: A Philadelphia nonprofit that brings music and dance to schools and neighborhoods through workshops,
  short residencies, lessons, and student ensembles. It also runs a volunteer program for people 16 and
  older.
what_you_do: Schools and partners host its workshops and residencies, and it offers lessons and student
  ensembles. Volunteers can help at events, repair or move donated instruments, do office and photo work,
  or help the Musicopia String Orchestra.
