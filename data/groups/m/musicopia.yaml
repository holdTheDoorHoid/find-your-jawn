first_step:
  how: Fill in the online volunteer form at musicopia.org/volunteer after reading the Volunteer Handbook.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Volunteers must be 16 or older and clear background checks before in-person work, and most programs
    run through schools and partners, so the public way in is a form or a staff contact.
  what_to_expect: The site does not describe a typical visit. Joining as a volunteer means an online form,
    a handbook to read, and clearance checks before any in-person shift. Roles include event help, thank-you
    calls, instrument repair or transport, office and photo work, and the String Orchestra.
  first_visit_tips:
  - Volunteers must be 16 or older; the form has options for younger people.
  - Start the PA child abuse, PA State Police and FBI clearances early; the FBI check applies if you lived
    outside Pennsylvania in the last ten years.
  - Have a driver's license ready for the form, and your own car if you will transport instruments.
  - Ask about lessons or residencies by email or phone before you visit the office at 1700 Market Street,
    Suite 1005.
