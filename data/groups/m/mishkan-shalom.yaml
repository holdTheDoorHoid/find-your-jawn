summary: A Reconstructionist congregation in Roxborough with Shabbat services, a Hebrew school, a choir,
  a men's group, spiritual direction, and a Rosh Chodesh gathering.
what_you_do: Come to Saturday Shabbat services, in person or streamed on YouTube. Ask the office or the
  rabbi about membership, which Hebrew school requires. Choir, adult education, and the men's group are
  also listed on the site.
