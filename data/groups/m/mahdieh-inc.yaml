summary: A nonprofit Islamic educational center on Haverford Avenue, founded in 2000, that serves Iranian
  American Muslims. Its Friday night program includes prayers, a lecture and a shared dinner.
what_you_do: Come to the Friday night program, which starts at 7 pm with prayers, a talk and a meal. The
  imam is at the center in person on Fridays and on special occasions, and you can email info@mahdieh.org
  with questions.
