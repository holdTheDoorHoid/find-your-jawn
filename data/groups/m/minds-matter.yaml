summary: A three-year college mentoring program for high-potential high school students from low-income
  families in Philadelphia. Volunteer mentors meet with two students on Saturdays during the school year
  to help with college planning and applications.
what_you_do: Each mentor works in a small group with a co-mentor and two students. Mentors give social,
  emotional and professional support toward college, including essays and applications, across the three
  years.
