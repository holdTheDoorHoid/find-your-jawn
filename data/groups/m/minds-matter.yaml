first_step:
  how: Complete the online Volunteer Application linked from the chapter's volunteer page at mindsmatterphilly.org.
    Mentors must be four-year university graduates, and the chapter prefers mentors who stay for the full
    three years.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: You apply through an online form, must hold a four-year degree, and commit to Saturday sessions
    through the school year. The site does not describe an info session or visit before applying.
  what_to_expect: Each mentor meets with a co-mentor and two students on Saturdays from 12:30 to 2 pm
    during the school year. Sessions cover college planning, essays, and applications. The page does not
    say whether there is an interview, training, or a background check.
  first_visit_tips:
  - Keep Saturday afternoons from 12:30 to 2 pm free during the school year.
  - Have your degree details ready for the online application.
  - Email info@mindsmatterphilly.org with questions before you apply.
