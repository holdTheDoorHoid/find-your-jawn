summary: A historic AME church on South 6th Street that marked its 232nd anniversary in 2026. Neighbors
  can join Sunday worship in person or online, and the church runs a museum, takes part in holiday giving,
  and held a Juneteenth community breakfast and celebration in June 2026.
what_you_do: Come to Sunday worship, join the 8 am adult church school or the Tuesday and Wednesday Bible
  studies, take part in the church's holiday giving programs, or book a tour of the Richard Allen Museum
  (tours by appointment).
