summary: A historic AME church on South 6th Street that marked its 232nd anniversary in 2026. Neighbors
  can join Sunday worship in person, and some Sunday classes and a fellowship hour run on Zoom. The church
  also runs a museum, takes part in holiday giving, and held a Juneteenth community breakfast and celebration
  in June 2026.
what_you_do: Come to Sunday worship, join the 8 am adult church school, the Sunday coffee hour, or the
  Tuesday and Wednesday Bible studies, take part in the church's holiday giving programs, or visit the
  Richard Allen Museum on select Saturdays and Sundays or by weekday appointment.
