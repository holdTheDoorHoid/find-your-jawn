first_step:
  how: Come to Sunday worship at 9:30 am at 419 S. 6th Street, or arrive for the 8:30 am coffee hour in
    the Fellowship Hall to meet people first. Fill in the Visitor Form and choose First Time Visitor,
    or call (215) 925-0616.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The visitor page welcomes new guests and has a First Time Visitor option, and the coffee hour
    page says it serves visitors as well as worshippers.
  what_to_expect: Sunday worship runs from about 9:30 to 11 am at 419 S. 6th Street, and the church welcomes
    first-time guests. The website does not describe what happens inside the service, so call ahead if
    you want to know more. Coffee hour before worship is open to visitors, and no fee is listed for worship.
  first_visit_tips:
  - Arrive around 8:30 am if you want the coffee hour before worship.
  - Fill in the Visitor Form and pick First Time Visitor.
  - Call (215) 925-0616 about parking, transit, and wheelchair access, since the site does not list them.
  - If you cannot come in person, the 8 am adult church school and the fellowship hour after worship run
    on Zoom.
