first_step:
  how: Fill out the shelter interest form on the volunteer page, or the Under 18 form if you are 14 to
    17. To foster, complete the foster questionnaire or application on the foster page. Volunteer questions
    go to volunteer@morrisanimalrefuge.org.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: The way in is clear (an interest form and then a volunteer waiver), but the volunteer page notes
    a waitlist dated January 2025, and foster applicants complete counseling before a first pet. An application
    step comes before you see what it is like.
  what_to_expect: The site does not describe a typical shift. Shelter volunteers may help with animal
    care, dog walks, cat socialization, photos and animal bios, transport, or fundraising events, depending
    on the role. Because the volunteer page noted a waitlist dated January 2025, ask about the current
    wait before you plan to start.
  first_visit_tips:
  - Read the volunteer waiver linked on the volunteer page before your first shift.
  - Adoption hours are listed on the site, so you can plan a visit to see the animals at 1242 Lombard
    Street.
  - If you are under 18, plan for an adult to supervise, since the page says minors may need it.
