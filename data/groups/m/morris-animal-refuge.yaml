summary: A Philadelphia animal welfare group, founded in 1874, that runs adoptions, a community cat program,
  and a Philly Pets program. It also places animals in foster homes and uses shelter volunteers.
what_you_do: Volunteer at the shelter (age 14 and up) or in the PetSmart cat role (age 18 and up), or
  foster an animal in your home until it is ready for a new family. Start with the interest form for the
  role you want.
