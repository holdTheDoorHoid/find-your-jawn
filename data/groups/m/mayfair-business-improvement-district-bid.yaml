first_step:
  how: Come to the Third Thursday Night Market at Frankford and Cottman Avenues, or sign up for the newsletter
    at mayfairphilly.com.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The market is a public street event, and the site lists a newsletter sign-up and a contact form.
    It does not describe how residents take part in the organization itself.
  what_to_expect: 'The site lists the Third Thursday Night Market as an evening event from 6 to 9:30 pm
    on Frankford and Cottman Avenues. It does not say what vendors or activities you will find there,
    or whether it is free. The district''s own work is mostly about the shops: cleaning, public safety,
    marketing, and building improvements.'
  first_visit_tips:
  - Check the site for the next market date, since the events list changes over time.
  - The site lists no office hours or public meetings, so call (267) 538-4668 before you visit the office
    at 2990 St. Vincent St, 2nd Floor.
  - If you want to attend a meeting, ask by email, since none are listed on the site.
