  basis: The program is open to adults 50 and older, but the pages give a phone line and a contact page
    rather than steps to enroll in the older adult program, so the way in is unclear.
  what_to_expect: The program offers a grab-and-go lunch, coffee and conversation, games and crafts, art
    and technology classes, fitness sessions, parties and dances, and trips. The pages do not say how
    long a visit runs or what it costs, so ask when you call. Rides and wellness phone calls are also
    listed.
  first_visit_tips:
  - Call (215) 218-0800 first, since hours and fees are not listed online.
  - Ask about the program's transportation when you call, because it is listed as one of the offerings.
  - The program is at 2433 South 15th Street, inside the South Philadelphia Boys and Girls Club.
