summary: A program for adults 50 and older at the South Philadelphia Boys and Girls Club, with a grab-and-go
  lunch, coffee and conversation, games, crafts, technology classes, fitness, and trips.
what_you_do: Come for lunch and conversation, take a tech or art class, join a fitness session, get help
  with resources, or go on a trip. The program also lists rides and wellness phone calls among its offerings.
