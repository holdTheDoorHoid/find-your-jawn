first_step:
  how: Register for a MenschGroup on the Register for a Program page, or email menschgroups@menschwork.org
    with questions first.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Joining a MenschGroup costs $150 for six months before you meet the group, and the retreat asks
    for a deposit, so a paid step comes first.
  what_to_expect: A MenschGroup is a confidential online group for personal sharing that meets about twice
    a month for 90 minutes. Members listen without giving advice or feedback, and the facilitator may
    open with a prompt tied to the weekly Torah portion. The retreat in Falls Village, Connecticut starts
    around 4:30 pm on a Friday and ends by 2 pm on Sunday, with prayer services and small groups of 5
    to 8 men that meet three times.
  first_visit_tips:
  - The Fall 2026 MenschGroup period runs July 1 to December 31, 2026, and the site says new groups are
    forming now.
  - Retreat roommates are assigned unless you name one, and a single room costs extra only when one is
    open.
  - Wassaic station on the Metro-North Harlem line is about a 30 minute taxi ride from the retreat center.
  - The fellowship for men aged 18 to 35 attending their first or second retreat has its own application
    page.
