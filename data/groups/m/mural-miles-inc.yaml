first_step:
  how: Follow the group's Instagram account for the next monthly date, route, and meeting spot. The site
    does not describe a sign-up form.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The runs suit all fitness levels and move at a casual pace, but the group's pages do not say
    how to sign up, and dates are posted only on Instagram.
  what_to_expect: Expect a casual run of about 4 to 5 miles at roughly 10 minutes a mile, with a stop
    at each artwork to learn about it and talk. The group stays together and regroups often. Biking the
    route is allowed, and dogs are welcome.
  first_visit_tips:
  - Carry only what you need, since storage at the start is not reliable.
  - Some runs start at a running store where you may leave items, so check the Instagram post for the
    spot.
  - The runs are meant to be social, so slow down if you are out of breath.
