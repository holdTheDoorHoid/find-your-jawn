summary: A member-owned natural foods store on Baltimore Avenue in West Philadelphia. Members buy in with
  a one-time equity payment, get a vote in the co-op's decisions, and can give a few hours a month as
  working members.
what_you_do: Members buy in with equity and vote on co-op decisions. Working members help run the store
  through shifts or committee service on governance, policy, or education and outreach, and get a 10 percent
  discount. The co-op says it is restarting the working-member program, so ask before you plan on shifts.
