first_step:
  how: Visit the store at 4824 Baltimore Avenue or join online, then pay the $200 equity in one payment
    or in installments.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Anyone can shop in the store, and the join steps and payment plans are published. Voting and
    working roles need membership first.
  what_to_expect: Stop by to look around and ask a staff member how joining works. Joining means filling
    out an application, either in the store, online, or on a printed form, and paying the member equity.
    Working members are asked to give at least four hours a month and get training before their first
    shifts, but the co-op says it is restarting that program.
  first_visit_tips:
  - The store is open every day from 8 am to 9 pm, so you can visit at most times.
  - Ask whether the working-member program is taking new people right now.
  - If the $200 is hard to pay at once, ask about the installment plan or the Food For All option.
