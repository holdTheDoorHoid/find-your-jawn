summary: A support meeting for families of people in prison, run by the Augustinian Defenders of the Poor
  for the Philadelphia area since 1996. In 2021 it met on the second Thursday of each month in Drexel
  Hill, Delaware County.
what_you_do: Attend the monthly meeting to share and listen with others who have a loved one in prison.
  The ministry also runs a pen pal program and a transition team for people coming home.
