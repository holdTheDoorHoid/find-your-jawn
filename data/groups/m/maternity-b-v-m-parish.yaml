  basis: Mass is open to anyone and a phone number is listed. The archdiocese page names no parish groups
    or newcomer program, so the way into a group is unclear.
  what_to_expect: Mass is free and open to anyone, with five Sunday Masses and a Saturday vigil at 4:30
    pm. Weekday Masses are held in the lower chapel, and Saturday confession runs from 3 to 4 pm in the
    same room. The archdiocese page names a Director of Religious Education but no other parish groups,
    so ask the rectory who runs faith formation.
  first_visit_tips:
  - The archdiocese page notes accessible entrances, ramps and van-accessible parking.
  - The Old Church Mass is only held on the first Sunday of certain months, so check the time before you
    go.
  - Confession is on Saturdays from 3 to 4 pm in the lower chapel.
