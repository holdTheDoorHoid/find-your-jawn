first_step:
  how: Call 267-872-4942 on a weekday between 8 am and 6 pm, or use the Book Mad Beatz Philly form on
    the site, and ask whether a class can be set up at your school or whether teacher training is open
    to you.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Classes are booked by schools and programs, and the site does not say individual students can
    join a class, so the way in for a newcomer is unclear.
  what_to_expect: Classes run at partner schools, taught by the group's teaching artists, with equipment
    provided and a goal of performing within about three months. Teacher training is 10 sessions for people
    18 and older, moving from apprenticeship to co-teaching to leading a classroom. The site does not
    describe a drop-in class open to the public.
  first_visit_tips:
  - Have the school's staff make the booking request, since the classes are booked through schools.
  - For teacher training, ask about the pay, the start dates and the 10 sessions before you commit.
  - The office answers the phone Monday to Friday, 8 am to 6 pm, and the site promises a 24-hour response
    to inquiries.
