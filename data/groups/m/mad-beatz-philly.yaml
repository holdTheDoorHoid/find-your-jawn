summary: A percussion education group that teaches drumline to students at schools around Philadelphia
  and trains young people to become music teachers.
what_you_do: Schools book weekly drumline classes for students (the curriculum is aimed at grades 4 to
  8), and adults 18 and older can train as music teachers while earning pay for teaching work. The group
  also books drumline performances for schools, festivals and events.
