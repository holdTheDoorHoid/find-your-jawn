summary: An educational urban farm at 49th and Brown Streets in West Philadelphia, founded in 2005 and
  run as a program of the nonprofit A Little Taste of Everything. It grows and distributes produce and
  runs farm-based learning for all ages.
what_you_do: Fill out the farm's volunteer form (a Google form linked from the site), come to the Saturday
  market when it is open, or ask about a group visit or the after-school gardening club. Volunteers are
  asked to wear hats and protective boots.
