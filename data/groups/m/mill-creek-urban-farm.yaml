first_step:
  how: Fill out the volunteer form linked from the farm's site, or email millcreekfarmphilly@gmail.com
    to ask about workdays or group visits.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The farm lists a clear volunteer form and two ways to contact it, and its FAQ says youth and
    other groups can join volunteer workdays. The site does not describe what a first visit is like.
  what_to_expect: Volunteers join community workdays on the farm and are asked to wear a hat and protective
    boots. Workday dates are not published, so the form or an email is the way to ask. The Saturday market
    runs from 12 to 2 pm, but the site says a farmers market is coming soon, so call first.
  first_visit_tips:
  - Wear a hat and protective boots, which the site asks volunteers to wear.
  - Call 267.279.9679 before a Saturday visit to confirm the market is open.
  - If you are bringing a class, team, or group, ask about visit dates, since the site has no booking
    page.
