first_step:
  how: Fill in the sign-up form on the How to Read Hebrew course page, or call 610-368-4065 with questions.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The How to Read Hebrew course is written for people new to Hebrew, and the page explains how
    to sign up. The home page says Exploring Judaism needs no Hebrew to join.
  what_to_expect: Courses meet on Zoom, and sessions are recorded for anyone who misses one. How to Read
    Hebrew has twelve sessions on Monday evenings from 7 to 8:15 pm Eastern, with all materials provided.
    Exploring Judaism is a discussion led by Rabbi Helen Plotkin, and you get the Zoom link after you
    sign up.
  first_visit_tips:
  - Set up Zoom on your phone or computer before the first session.
  - Fill in the form with your name, email, and a few words about yourself, as the page asks.
  - Call 610-368-4065 if you are not sure which course fits your level.
