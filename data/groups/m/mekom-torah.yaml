summary: An online study group for Jewish adults, with beginner Hebrew courses and reading groups. Its
  Exploring Judaism discussion series is on sabbatical until fall 2027.
what_you_do: Sign up for a Hebrew course or join a reading group. Exploring Judaism, a discussion series
  that needs no Hebrew, is paused until fall 2027.
