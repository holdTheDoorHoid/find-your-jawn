summary: A Philadelphia nonprofit that works on mental health and suicide prevention. It runs community
  events, mentoring, chess and golf programs, and art therapy.
what_you_do: Come to the community mental health events, take part in the chess and golf programs, or
  join the mailing list. Volunteers fill out the Volunteer Interest Form on the group's website, and the
  group contacts people when an opportunity comes up.
