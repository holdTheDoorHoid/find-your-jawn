first_step:
  how: Fill out the Volunteer Interest Form on the volunteer page at mbkcares.com, or join the mailing
    list on the Contact Us page to hear about the next event.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Volunteering starts with an interest form, and the group contacts people only when a match comes
    up. Public events are listed, but the pages do not say how to sign up for them.
  what_to_expect: Events are posted on the website when they are planned, and the pages describe no regular
    weekly meeting. The mental health events, mentoring, and chess and golf programs are named, but the
    age group, time, place, and cost are not stated on the pages read.
  first_visit_tips:
  - Join the mailing list to hear when the next public event is posted.
  - Volunteer roles that involve direct contact with youth need Pennsylvania clearances, including a child
    abuse history clearance, a state police check, and an FBI check when required.
  - Use the Contact Us page on the website, since no phone number or email is listed on the pages read.
  - Ask whether the chess or golf programs meet at the Beaumont Avenue office, since the site does not
    say where they meet.
