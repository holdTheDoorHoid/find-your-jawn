first_step:
  how: Call (267) 275-8087 to ask about the next tafsir or hadith circle and the children's Islamic school,
    since the site gives no class times.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The site says its programs are for all ages and gives a phone line and a contact form. It does
    not give class times, costs or registration steps, and two of its forms link nowhere.
  what_to_expect: The mosque is in the former Commodore Theatre building on Walnut Street. It was founded
    in 1988 by members of a university Muslim students group and serves a diverse congregation. The circles
    cover Quran commentary and the Prophet's sayings, and the children's school teaches Quran, Arabic
    and Islamic character. The site does not say how long sessions run or what they cost, so the phone
    call is the best first step.
  first_visit_tips:
  - Call (267) 275-8087 before you come, because the site gives no visiting hours.
  - The Friday sermon is given in Arabic with an English translation.
  - The mosque is at 4228 Walnut Street in West Philadelphia.
