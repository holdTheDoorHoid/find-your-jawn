summary: A masjid in West Philadelphia that teaches Quran recitation with tajweed, tafsir, hadith and
  practical fiqh, and runs a children's Islamic school. It also has youth programs and weekly tafsir and
  hadith circles.
what_you_do: Join a weekly tafsir or hadith circle, enroll children in the Islamic school, or come to
  a family event with talks, halal food stalls and children's activities. The site gives no date for the
  family event.
