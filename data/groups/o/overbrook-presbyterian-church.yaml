summary: A Presbyterian church on City Avenue with Sunday worship, Sunday School and youth groups, choirs,
  and service projects such as the Kensington Project service day.
what_you_do: Join Sunday worship at 10:30 am, Sunday School for children and youth (September to May),
  the monthly youth group, a choir or handbell rehearsal, or a service day such as the Kensington Project.
  Newcomers can attend worship or call the office.
