first_step:
  how: Come to Sunday worship at 10:30 am at 6376 City Avenue. To ask about a group, email office@overbrookpresb.org
    or call 215-877-2744.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The site says visitors are always welcome, tells newcomers to attend worship or call the office,
    and lists each weekly group with its time.
  what_to_expect: Sunday worship starts at 10:30 am in the Fellowship Hall, where the church meets while
    the sanctuary is restored after a January 2024 fire. Fellowship Hour follows the service, and you
    can also watch online. Nursery care for infants and toddlers runs during Sunday worship, and Sunday
    School takes children and youth from September to May.
  first_visit_tips:
  - A lot beside the church holds about 80 cars, and there is some street parking on Lancaster Avenue.
  - The first floor is wheelchair accessible, and a ramp leads to the main entrance.
  - Volunteers who work with children or youth go through background screening.
  - Call 215-877-2744 or email office@overbrookpresb.org with questions.
