summary: A network that supports people who record life stories as oral historians across the Mid-Atlantic
  region. It runs workshops and local meetups, holds an annual conference, and gives awards.
what_you_do: Sign up for a workshop (the fall 2026 one is online), or join a local meetup or social. Membership
  and volunteer roles are listed on the site. The 2026 annual conference was held in Alexandria, Virginia.
