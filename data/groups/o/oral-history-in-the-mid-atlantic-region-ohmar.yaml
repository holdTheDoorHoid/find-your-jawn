  what_to_expect: Workshops are live classes on oral history skills. The fall 2026 workshop, Interviewing
    New Americans, is a 90 minute Zoom class led by Alana Gomez on Wednesday, October 21, from 6 to 7:30
    pm Eastern. The page does not list its price, so check the ticket page first.
  first_visit_tips:
  - Check the price on the ticket page before you register, since the workshop page does not list one.
  - Members get discounted registration for OHMAR events, so compare the member price if you plan to attend
    more than one.
  - Email ohmar.contact@gmail.com for questions. The site also links to contact@ohmar.org, so check which
    one replies.
