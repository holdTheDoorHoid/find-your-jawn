summary: A Catholic parish on Tulip Street with Masses in English and Spanish, a Latin Mass at 1:30 pm,
  and a Saturday evening vigil.
what_you_do: Come to Mass in English, Spanish or Latin, or join a parish ministry such as the Food Cupboard,
  the Giving Tree Committee or the youth ministries. Children and teens can take part in P.R.E.P. religious
  education, and adults exploring the Catholic faith can join R.C.I.A. The parish also holds a Wednesday
  Rosary at 6:30 pm in the church, open to everyone.
