schedule:
  text: Sunday Masses at 8 and 10:15 am, at 11:30 am in Spanish, and at 1:30 pm in the Latin form. Saturday
    vigil at 5 pm. Weekday Mass at 8 am, and at 7 pm in Spanish on Wednesday; 9 am on federal holidays.
    Saturday confession 4 to 4:45 pm. Wednesday Rosary at 6:30 pm in the church.
