    the form from the website, then send it to the office or call.'
  what_to_expect: Mass is free and open to anyone, with services in English, Spanish and Latin. The site
    does not say how long a Mass lasts or what happens during it. The office is open Monday to Thursday
    and closed on Fridays, so call on those days if you have questions.
  first_visit_tips:
  - The office is open Monday to Thursday, 9 am to 4 pm, and closed Fridays, so plan your call for those
    hours.
  - The parish secretary speaks English and Spanish.
  - Download the New Parishioner Registration form from the website if you want to join the parish.
