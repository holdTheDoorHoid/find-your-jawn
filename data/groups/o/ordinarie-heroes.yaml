summary: A Philadelphia nonprofit that helps young people build leadership, school and career skills.
  It also runs a mobile pantry, an educational farm and nutrition workshops.
what_you_do: Young people take part in weekly in-person leadership sessions, tutoring, film and photo
  workshops, and college and career prep. The Inspire program is for young people aged 11 and up. Adults
  and young people can help with the food pantry, tutoring or office work, and adults can sign up as mentors.
