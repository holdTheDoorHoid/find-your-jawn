summary: A Catholic parish at 3rd and Wolf Streets in South Philadelphia with Sunday Masses at 8 and 10:30
  am, weekday morning Mass, and a children's faith program (PREP/CCD) for grades 2 to 8.
what_you_do: Come to Mass, or register a child for PREP/CCD faith classes. The parish office also helps
  with baptism, marriage preparation, and home communion visits for people who are sick or homebound.
