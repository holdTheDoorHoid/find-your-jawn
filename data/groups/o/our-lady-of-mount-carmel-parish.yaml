first_step:
  how: Come to a Sunday Mass at 8 or 10:30 am, or call the Parish Office at 215-334-7766 if you are new
    to the parish.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: Mass is open to anyone, and the site asks new or relocating residents to call the parish office,
    so the way in is clear.
  what_to_expect: Mass is free and open to anyone, and the site does not describe what happens during
    the service. Children join PREP/CCD classes for grades 2 to 8 through a yearly registration, and the
    2026 to 2027 registration closed on August 31, 2026.
  first_visit_tips:
  - Saturday Mass is at 4 pm, and Sunday Masses are at 8 and 10:30 am.
  - The Parish Office is open Monday to Friday, 9 am to noon, at 215-334-7766.
  - PREP/CCD registration needs the form, the required church documents, and the fee. Call the PREP office
    at 215-789-0849 with questions.
