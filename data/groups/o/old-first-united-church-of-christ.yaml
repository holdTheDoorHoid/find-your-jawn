first_step:
  how: Come to Sunday worship at 10 am, in person or on Zoom. To join the newcomer brunch after service,
    tell the church in advance through the contact form.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 5
  basis: The site has a newcomer page, a newcomer brunch after worship, and a welcoming committee that
    can meet you before your first Sunday, and it says anyone is welcome as they are.
  what_to_expect: Sunday worship starts at 10 am, in person or on Zoom, and the site says you do not have
    to agree to any set of beliefs to belong. The site does not say how long the service lasts or what
    to wear. After service, a newcomer group goes out for brunch or a drink in Center City or Old City,
    and the site does not list a cost for it.
  first_visit_tips:
  - If you want the newcomer brunch after service, tell the church first through the contact form.
  - Worship is also on Zoom if you would rather join from home.
  - The contact page has a parking pass link, so check it before you drive.
  - You can ask for coffee with the pastor before your first Sunday by calling 215-922-4566 or emailing
    admin@oldfirstucc.org.
