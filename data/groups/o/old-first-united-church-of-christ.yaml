summary: A United Church of Christ congregation near 4th and Race streets that worships on Sunday in person
  and on Zoom, hosts Sunday suppers, and runs historical tours.
what_you_do: Join Sunday worship at 10 am or stay for fellowship at 11:15 am, come to a Sunday supper,
  help with the Saturday breakfast or the coat drive, join the newcomer brunch after service, or take
  a historical tour.
