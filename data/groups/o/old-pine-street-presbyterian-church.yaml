summary: A historic Presbyterian church on Pine Street with a 10:30 am Sunday service, Sunday school for
  young children during worship, and a concert program.
what_you_do: Attend the 10:30 am Sunday service, which has staffed childcare for infants and toddlers.
  Send children to Sunday school from September through July, or look into the community and mission programs.
