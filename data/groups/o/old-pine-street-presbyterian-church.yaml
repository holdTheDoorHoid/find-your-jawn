first_step:
  how: Attend the 10:30 am Sunday service in the upstairs sanctuary. To ask about Sunday school for children,
    email Pastor Rebecca at rebecca@oldpine.org.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The site says visitors are welcome and expected, explains childcare and Sunday school, and gives
    the worship time, but names no separate newcomer program.
  what_to_expect: The 10:30 am service is held in the upstairs sanctuary, which has a historic pipe organ.
    A choir sings most Sundays from September to mid-June, an in-house bluegrass band plays at services
    through the year, and coffee hour follows worship. The site does not say how long the service lasts,
    what to wear, or whether there is a cost.
  first_visit_tips:
  - Park in the free lot on the east side of 5th Street between Lombard and Pine, or ask a greeter for
    a placard for on-street parking on Lombard between 3rd and 5th.
  - The loading zone in front of the main entrance at 412 Pine Street can be used to drop off people with
    mobility needs.
  - Staffed nursery care is available for infants and toddlers during worship.
  - Coffee hour follows worship on Sundays, if you want to stay and meet people.
