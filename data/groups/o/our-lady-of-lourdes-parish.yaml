first_step:
  how: Come to a Sunday Mass or to Thursday Adoration. To join the parish, use the registration page on
    the website or call 215-473-1669.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The I'm New Here page is written for newcomers, says families are welcome, and points to the
    parish registration page.
  what_to_expect: Mass and Adoration are free, and visitors are not expected to put money in the offering.
    Families are welcome, and the parish says a restless child is fine; a parent may step out to the vestibule
    and come back when the child settles. The site does not give how long Mass or Adoration lasts, so
    ask the office if you have questions.
  first_visit_tips:
  - There is no parking lot. Park on the street in the Overbrook Farms area and walk to the church.
  - On Sundays and holy days, arrive early, since students from nearby St. Joseph's University sometimes
    take up street spaces during the school year.
  - Call 215-473-1669 about transit or access, since the site does not give those details.
