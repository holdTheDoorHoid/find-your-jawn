schedule:
  text: Sunday Masses at 8 am, 9:30 am (Latin High Mass), 11:30 am and 8 pm. Weekday Masses at 6:30 am
    and 8:30 am, with Lauds at 8 am; times shift a little in summer. Saturday morning Mass and a 4 pm
    vigil. Thursday Adoration after Mass, with a 4 pm Rosary and 7 pm Vespers and Benediction. Confession
    most days, including Saturday 2:30 to 3:45 pm.
