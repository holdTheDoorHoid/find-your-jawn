summary: A Catholic parish at 63rd Street and Lancaster Avenue with Sunday Masses, including a Latin High
  Mass, and weekday Mass with Lauds.
what_you_do: Come to Mass or to Thursday Adoration, which includes Vespers and Benediction at 7 pm. Families
  are welcome. The parish also lists a Lourdes for Life program and pilgrimages, though the site gives
  few details. The site links a 2026 to 2027 registration form for First Penance and First Communion.
