first_step:
  how: Fill in the online Join us form or email join@orchestrasociety.org, then come to a Friday rehearsal
    as a guest for one evening.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The join page invites you to come for an evening or as a guest for a few weeks, but the group
    is for players who read music at sight, so beginners are not the target.
  what_to_expect: Most evenings have about 60 to 75 musicians, all unpaid, working through one program.
    The first half covers the hard passages in each section, and after a short break the group plays the
    whole piece with few stops.
  first_visit_tips:
  - Arrive a little early and use the elevator to reach Room 240 on the second floor.
  - Street parking nearby is well lit and patrolled by Temple police, according to the group's page.
  - Music for the following week can be signed out at the current week's rehearsal.
