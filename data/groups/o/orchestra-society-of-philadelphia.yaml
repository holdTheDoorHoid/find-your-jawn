summary: A community orchestra founded in 1964 for experienced players who read music at sight. It plays
  through big orchestral works and does not give public concerts.
what_you_do: One program is rehearsed each evening. The first half drills the difficult passages, and
  after a short break the group plays the whole piece with few stops.
