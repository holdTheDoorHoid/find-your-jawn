  newcomer_friendliness: 4
  basis: The beginner course page says no prior experience is needed and gives a text number to register
    or join the waitlist.
  what_to_expect: A beginner series runs six weeks plus one make-up class, meeting once a week for about
    three hours in a group of no more than six. Clay, tools, firings and glazes are included, and you
    take home at least three finished pieces. Handbuilding is done at a table, sitting or standing.
  first_visit_tips:
  - Pay in full before you register; cash, check, Venmo and Cash App are accepted.
  - The studio offers no refunds, so confirm the series dates before you pay.
