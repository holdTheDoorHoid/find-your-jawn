summary: A shared clay studio in Mount Airy with six week beginner courses in handbuilding and wheel throwing.
  Membership is for intermediate and advanced clay users, and reduced fees are offered to some Northwest
  Philadelphia residents.
what_you_do: Take a six-week beginner course, or join the studio after four weeks of pre-membership training
  and an interview with the studio manager.
