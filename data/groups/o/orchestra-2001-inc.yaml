  what_to_expect: A pop-up is a small group, such as a jazz trio, string quartet or brass group, playing
    in a market or public space. The group's page says sessions typically run two to three hours. The
    site has no accessibility details, so ask the group before you go if you need them.
  first_visit_tips:
  - Free pop-ups need no ticket, so you can walk up.
  - Check the site for the date and place, since pop-ups move between markets and events.
  - Concert tickets are sold through outside ticket pages linked from the site.
