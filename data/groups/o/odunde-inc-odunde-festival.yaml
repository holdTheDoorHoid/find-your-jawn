name: ODUNDE, Inc. (Odunde Festival)
aka: []
leads: []
ein: null
summary: ODUNDE, Inc. puts on the Odunde Festival, a street festival celebrating African heritage on South
  Street each June, and runs year-round programs under the ODUNDE 365 name. Several hundred volunteers
  and a board help make the festival happen.
what_you_do: Volunteers help run the festival weekend. Vendors, art show artists and 5K runners sign up
  through the website. The site lists no volunteer sign-up, so ask through its contact page.
