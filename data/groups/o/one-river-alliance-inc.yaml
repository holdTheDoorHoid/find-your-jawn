summary: A group that brings neighbors, businesses, and community groups together along the Delaware riverfront.
  It runs the July 4th FreedomFest fireworks festival.
what_you_do: Come out for the free July 4th FreedomFest at Pleasant Hill Park. The alliance also starts
  new events during the year and invites ideas for next year's festival. The site does not describe volunteering
  or membership.
