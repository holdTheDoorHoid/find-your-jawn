first_step:
  how: Come to the free July 4th FreedomFest at Pleasant Hill Park. The next one is set for July 4, 2027,
    and details will be posted on the website as they come out.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: The festival is free and open to the public, with no tickets or registration needed.
  what_to_expect: The festival starts with a flag raising and the national anthem at 5 pm, then has live
    music, food trucks, vendors and family activities, with fireworks at 9 pm. It runs until about 9:30
    pm. Admission is free and no tickets are needed.
  first_visit_tips:
  - Parking is not on the park grounds. Visitors park on State Road and nearby streets, and the group
    suggests a ride share.
  - Plan for the weather, since the festival goes ahead rain or shine.
  - Bring water and check the website before the day for any changes.
