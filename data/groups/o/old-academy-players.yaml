first_step:
  how: Come to a posted public audition (the next listed is Venus in Fur on Saturday, November 7, 2026
    at 10 am), or fill in the contact form and choose the option for volunteering and membership information.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Auditions are open to the public with set dates and a clear sign-in, but the page does not say
    beginners are welcome, and crew sign-up goes through the director.
  what_to_expect: An audition is a sign-in at the theater on a Saturday morning. Bring a short dramatic
    monologue, a headshot, and a theatrical resume, and expect that some people are asked to read a scene
    cold. Every role is unpaid, and you do not need to be a member to take part.
  first_visit_tips:
  - For Venus in Fur, fill in the audition form ahead of time and sign in before 11:30 am.
  - For Bug, check in in person by 12:30 pm, first come, first served. Video auditions are not accepted
    for either show.
  - Parking is free in the private lot behind the theater.
  - Read the role descriptions on the auditions page before you prepare, since many roles list an age
    range or a gender.
