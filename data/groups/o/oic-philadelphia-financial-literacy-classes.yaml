first_step:
  how: Call (215) 236-7700 and ask for the next money skills workshop or coaching session by name. The
    site does not list class dates.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Open to Philadelphia residents, with a phone line and inquiry form, but class dates and format
    are not published.
  what_to_expect: Workshops cover budgets, saving, credit reports, opening a bank account, and debt, and
    coaching is one-on-one. Both are free for Philadelphia residents. Ask on the phone how long a workshop
    runs and whether it meets in person or online, since the site does not say.
  first_visit_tips:
  - Have a valid state ID handy, since the job training programs ask for one.
  - If you are also looking at job training, it asks for a high school diploma or GED and a passing entrance
    assessment.
  - Ask for the financial workshop by name, because the inquiry form is built for job training programs.
