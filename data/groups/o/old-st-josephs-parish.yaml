  basis: Mass is open to anyone, the Archdiocese listing gives a rectory phone, and no newcomer program
    is listed.
  what_to_expect: Mass is free and open to anyone. Sunday Masses are at 7:30, 9:30 and 11:30 am, and weekday
    Mass is at 12:05 pm on Tuesday, Wednesday and Thursday. The Archdiocese listing says you ask the priest
    presiding at daily Mass to hear your confession, and it does not say how long Mass runs or what to
    wear.
  first_visit_tips:
  - The church is at 4th and Walnut Streets; the Archdiocese lists the rectory at 321 Willings Alley.
  - The church has an assistive listening system, as the Archdiocese listing describes.
  - Call the rectory at 215-923-1733 to confirm holy day times before you come.
