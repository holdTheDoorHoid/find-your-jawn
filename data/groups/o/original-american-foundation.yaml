summary: A Philadelphia nonprofit that aims to help low-income American Indian and people of color households
  become more self-sufficient, with gardening and home repair help.
what_you_do: Request a consultation on home or community gardening, or on home repair and renovation,
  through the website. You can also order homemade smoothies for pickup by phone, or donate through GoFundMe
  or Cash App. Gallery photos show past garden and community-building workshops from 2023 and 2024.
