summary: A community garden in Germantown on Wissahickon Avenue where members grow food on their own plots
  and share about 8 hours a season of upkeep.
what_you_do: Join the waitlist for a plot (the garden is full for 2026). Members grow food on their plots,
  help with shared upkeep, and many donate produce to Germantown groups.
