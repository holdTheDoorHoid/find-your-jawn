first_step:
  how: Join the waitlist through the Google form on the membership page, since the garden is full for
    2026, or email oldtenniscourtfarm@yahoo.com with questions.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Membership is closed for the 2026 season; the only listed way in is a waitlist form, and the
    page gives no wait time or open dates.
  what_to_expect: Members get a plot of about 12 by 12 feet (some are half that size) and volunteer about
    8 hours a season on shared work such as weeding, mowing, compost, trash pickup, snow removal, and
    website work. The page welcomes gardeners of every experience level and children of all ages. It does
    not state a membership fee, workday dates, or open days.
  first_visit_tips:
  - The page lists no open days, so email before you plan a visit.
  - Join the waitlist even though the garden is full for 2026, since that is the only listed way in.
  - If you join, plan on about 8 hours of shared work each season.
