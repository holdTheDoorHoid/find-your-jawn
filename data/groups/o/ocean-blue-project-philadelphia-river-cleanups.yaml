first_step:
  how: Watch the Philadelphia River Cleanup listing on the group's site for a date, then join that cleanup.
    You can also email the office to ask about upcoming Philadelphia dates.
  drop_in: false
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The group says no experience is needed and cleanups suit all levels, and it offers a way to join,
    but no Philadelphia date is posted right now.
  what_to_expect: A cleanup lasts about 1 to 2 hours along a riverbank, and you pick up litter with a
    group. Supplies are handed out at the start, with a kickoff briefing. Every volunteer signs a release
    and waiver that is brought to the site on the day, and a minor needs a parent or guardian to sign.
  first_visit_tips:
  - Wear closed-toe shoes and comfortable outdoor clothes, and bring a reusable water bottle.
  - Fill in the release and waiver before the day and bring it with you.
  - Bring sun protection or rain gear, since cleanups go ahead rain or shine.
  - Ask the office for the meeting spot if the listing does not show one.
