summary: A Philadelphia group founded in 2003 to explore and share Mexicayotl culture, a tradition from
  Mexico before the Spanish arrived. It runs events, a radio show and an Indigenous Peoples Day celebration.
what_you_do: Come to the group's festivals and celebrations, follow the Nika Tlaka radio show, or volunteer
  on the board, in marketing and social media, or in dancing and music. Donations are also welcome.
