summary: A Philadelphia group founded in 2003 to explore and share Mexicayotl culture, a tradition from
  Mexico before the Spanish arrived. It runs events, a radio show and an Indigenous Peoples Day celebration.
what_you_do: Attend the group's events and programs, such as the 14th Philadelphia Indigenous People Day,
  or follow the Nika Tlaka radio show. The site has pages for volunteers and members, but they do not
  yet show steps, terms or fees. You can also read the blog and history pages, or donate.
