first_step:
  how: Fill in the volunteer sign-up form from the Volunteer button on the Sunshine House page, then call
    (267) 804-7166 or email to ask about hours and a first shift.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: A volunteer sign-up form is posted and training workshops are offered, but the site does not
    describe what a volunteer shift involves.
  what_to_expect: Sunshine House on Kensington Avenue is a safe indoor place to rest, with a messaging
    center where you can call or leave messages for family, clothing and hygiene supplies, snacks, and
    wound-care supplies. Overdose-reversal training and volunteer education workshops are offered. Volunteers
    help run these services, so the sign-up form is the way in.
  first_visit_tips:
  - Confirm hours by phone or email before you come, since the website does not list them.
  - Ask about the overdose-reversal (Narcan) training when you sign up; the Sunshine House page links
    to a training sign-up.
  - Ask the group about the best way to get there, since the site gives no transit directions.
