summary: Runs Sunshine House in Kensington, a support space for people dealing with addiction. It also
  does outreach, community clean-ups, food drives and overdose-reversal (Narcan) training.
what_you_do: Sign up through the Volunteer button on the Sunshine House page, or contact the group to
  ask what help is needed right now.
