summary: A Philadelphia alumnae chapter of Alpha Kappa Alpha, chartered in 1926. Its foundation gives
  scholarships and grants, and the chapter runs public programs such as health fairs and voter events.
what_you_do: Scholarships go to high school seniors and college students, and the application is linked
  from the chapter's About Us page. A yearly Day of Sharing gives community grants and scholarships. Members
  serve on chapter committees, and joining is a separate process.
