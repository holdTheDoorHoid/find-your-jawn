schedule:
  text: Saturday vigil Mass at 5 pm and Saturday Mass at 8 am. Sunday Masses at 6:30, 8 and 10 am and
    at noon, plus a 6 pm Mass in February, April, June, October and December. Weekday Mass Monday to Friday
    at 6:30 am (September to June) and at 8 am. Saturday confession 3:45 to 4:45 pm, or by appointment
    at the rectory.
