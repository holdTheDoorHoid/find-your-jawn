summary: A Catholic parish on Knights Road in the Far Northeast with Sunday Masses, a weekday morning
  Mass, a Saturday vigil and Saturday confession.
what_you_do: Come to Mass, or join a parish ministry such as the Adoration Chapel, the ushers, the choirs,
  the Knights of Columbus or the Legion of Mary. The parish also runs a school, and the ministries page
  lists a contact person for each group.
