first_step:
  how: Book a tour from the Book Your Tour button on the group's tours page. Bookings run through Beyond
    the Bell Tours.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Tours are open to the public with a clear booking button, though the price is not shown on the
    page.
  what_to_expect: The group's tour page says a tour takes two hours and covers less than a mile on South
    9th Street, led by a local community guide. The booking page lists 90 minutes, so check the length
    when you book. You hear the market's history and stories, use a free digital tour app with old photos,
    and see murals, updated produce stands, and light boxes.
  first_visit_tips:
  - Tours are offered in English, Spanish, and Vietnamese.
  - The route starts at 9th and Christian Streets and ends at 9th and Federal Streets.
  - Some storefront entrances have steps, so ask about the route before you book if you need step-free
    access.
