first_step:
  how: Come to the Sunday 10 am Mass or the Saturday 4:30 pm vigil, or call the rectory at 215-923-7930
    to ask about parish life.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Mass is open to anyone and the rectory phone is listed; no newcomer program is listed on the
    site or the Archdiocese page.
  what_to_expect: Mass is free and open to anyone. Sunday Mass is at 10 am, the Saturday vigil at 4:30
    pm, and weekday Mass at 7:30 am Monday to Friday in the chapel of the former convent at 5th and Locust.
    Confession is heard on Saturdays at 4 pm, and neither the parish site nor the bulletin page we could
    read lists any groups for newcomers.
  first_visit_tips:
  - Weekday Mass is held in the chapel of the former convent at 5th and Locust, not in the main church.
  - For baptism information, call the rectory at 215-923-7930.
  - The rectory is at 252 S. 4th Street.
