summary: Neighbors in Overbrook Farms who run a civic club founded in 1892. They care for local history
  and historic preservation, follow nearby building and zoning plans, and host a block party and fall
  events.
what_you_do: Members vote for the club's board, weigh in on neighborhood decisions, and volunteer on local
  projects. Neighbors can also join events such as the block party and History Night, some of which need
  an RSVP or tickets.
