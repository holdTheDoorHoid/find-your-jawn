first_step:
  how: Email the club's executive committee in advance to say you plan to attend a member meeting; non-members
    are welcome at them.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Membership needs a home inside the club's area and a board vote, and member meetings need an
    advance email. Public events and the neighborhood listserv give a lower-stakes first look.
  what_to_expect: Most meetings in 2026 are held on Zoom, and members get the invitation by email before
    each one. Non-members are welcome at member meetings if they email ahead, and the site does not list
    dues. Club events such as the block party and History Night are a lower-pressure way to meet neighbors,
    though some need an RSVP or tickets.
  first_visit_tips:
  - If you are a member, watch your email for the Zoom invitation before the meeting.
  - The neighborhood listserv has posting rules, including no partisan or personal posts, so read them
    before you write.
  - Some club events need an RSVP or tickets, so check the event details before you plan to go.
