first_step:
  how: Call (215) 226-7860 and say whether you need help for yourself, a family member, or a youth. You
    can also use the contact form on odaatphilly.org.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The Monday giveaway and the Friday gathering have set times and addresses and are open to individuals,
    families, and community members, and each service lists a phone line, though the site does not say
    whether you must register.
  what_to_expect: The Monday food giveaway runs noon to 2 pm at the Broad Street address and hands out
    fresh produce and groceries while supplies last. The site does not say whether any service costs money
    or how intake works for recovery, housing, or youth programs, so ask on the phone what happens next.
  first_visit_tips:
  - Arrive early in the noon to 2 pm window, since the giveaway runs while supplies last.
  - Call (215) 226-7860 before you come to ask about intake, costs, and what to bring.
  - Ask which services are open to people who do not live in a recovery house, because the site ties some
    support to house residents.
