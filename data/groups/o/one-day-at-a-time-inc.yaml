summary: A Philadelphia nonprofit that helps people and families dealing with addiction, housing loss
  and money hardship. Its services include housing help, health care, job and reentry help, and youth
  programs.
what_you_do: Call or email to ask for help with recovery, housing, health, jobs, or reentry. Youth programs
  serve ages 7 to 16, and the group runs a weekly Monday food giveaway and a support group.
