schedule:
  text: 'The after-school program runs Monday to Friday, 3:30 to 6 pm, during the school year. Adult English
    classes run each semester: beginners meet Monday and Wednesday mornings, and intermediate students
    meet Tuesday and Thursday evenings. Food distribution is on Thursdays, except the second Thursday
    of the month.'
