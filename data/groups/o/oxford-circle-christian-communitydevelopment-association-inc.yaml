summary: A faith-based nonprofit in the Oxford Circle neighborhood. It runs an after-school program at
  Carnell Elementary, adult English and job training classes, family resource centers at two schools,
  and a regular food distribution.
what_you_do: Get free food on a distribution Thursday, enroll a child in the after-school program, take
  an adult English or job training class, or ask about the family resource centers.
