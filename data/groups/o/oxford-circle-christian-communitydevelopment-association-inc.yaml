first_step:
  how: Walk up to the food distribution at 900 E Howell St on a 1st, 3rd, or 5th Thursday, 1 to 4 pm.
    No registration is needed.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: Food needs no registration or prerequisites, and the adult English classes list a beginner level
    with an intake form, but the after-school program is only for Carnell students.
  what_to_expect: Food is handed out as free grocery bags, about 400 households a week. The site says
    no registration or prerequisites are required for food. For adult classes, you fill out an intake
    form first, and then the class meets at its set time; the site does not list costs or who qualifies.
  first_visit_tips:
  - Walk-up runs 1 to 4 pm and drive-up runs 10 am to 1:30 pm on the 1st, 3rd, and 5th Thursdays at 900
    E Howell St.
  - On the 4th Thursday, people line up at 10 am at M&T Bank, 6500 Castor Avenue, until supplies run out.
  - For adult classes, use the Student Intake Form on the adult education page, in English or Spanish.
  - The after-school office is at (215) 400-3150, option 6, and is open Monday to Wednesday, 8:45 am to
    2:45 pm.
