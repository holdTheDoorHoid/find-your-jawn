  newcomer_friendliness: 3
  basis: Events are public, the calendar shows each one, and the site offers an email update sign-up.
  what_to_expect: Events celebrate the neighborhood's many cultures with youth arts, a community dinner,
    and performances by local artists. Each calendar listing shows the venue, the time, and whether the
    event is free.
  first_visit_tips:
  - Check the calendar listing for the venue and time before you go, since events move between places.
  - The group's office is in Center City, so go by the event listing rather than the office address.
  - Join the Get Updates list in the footer so new events reach you.
