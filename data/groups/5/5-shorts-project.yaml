summary: A Philadelphia film group that helps local residents make their own short films, with no filmmaking
  background needed. It also runs teen film programs and a yearly teen film festival.
what_you_do: Work through the free filmmaking tutorials on the Learn Filmmaking page, join a teen summer
  session that makes a film, or attend the Teen Film Fest.
