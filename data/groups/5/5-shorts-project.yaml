  basis: The tutorials list no prerequisites, the homepage says no experience is needed, and the teen
    program explains how to apply by email.
  what_to_expect: The tutorials each cover one filmmaking skill, such as writing a script, planning shots,
    sound, lighting, or editing, and they cost nothing. Teen sessions run about 5 hours at a time, twice
    a week in summer, with a stipend and meals. The site does not describe a first-day routine, so ask
    the team what to expect.
  first_visit_tips:
  - Email hello@5shorts.org for the application and the next session dates
  - Ask where Germantown sessions meet and how to get there
  - Look at the Teen Film Fest page to see what the group's films look like
