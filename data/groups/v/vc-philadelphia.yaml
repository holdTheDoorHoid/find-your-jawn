summary: The Philadelphia chapter of the Video Consortium, a network for nonfiction filmmakers. Each month
  it holds an in person gathering, such as a screening, panel, workshop or social evening.
what_you_do: Come to a monthly gathering to meet other nonfiction filmmakers and hear about jobs and resources.
  Members also get a jobs board, a directory profile and a weekly newsletter.
