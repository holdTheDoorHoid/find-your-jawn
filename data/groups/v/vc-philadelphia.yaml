first_step:
  how: Email philadelphia@videoconsortium.org to ask whether a non-member can come to a gathering. If
    you work or study in nonfiction video, you can also apply for an Essential membership at videoconsortium.org/join.
    The $10 fee is one time, and reviews take about 2 to 5 business days.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Joining needs an application that is reviewed before you become a member, and eligibility is
    limited to people who work or study in nonfiction video. The site does not say whether a non-member
    can attend a gathering.
  what_to_expect: Gatherings are monthly, in person and social. A typical evening, as one listed gathering
    shows, starts with about an hour of mingling, then a short film screening, a talk with the filmmakers,
    a raffle, and time to network, with light refreshments. The site does not say how long a gathering
    lasts overall.
  first_visit_tips:
  - Bring ID, which the event listing asks for.
  - Check the events page for the date, time and venue before you go.
  - Apply well before a gathering, since reviews take about 2 to 5 business days.
