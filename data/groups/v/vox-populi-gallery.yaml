access:
  wheelchair: partial
  languages: []
  notes: Reaching the first floor landing takes five steps from the street, and the passenger elevator
    starts there. Its door is 29 inches wide, so it may not fit every wheelchair or motorized chair. The
    third floor has no further steps. A ramp is available if you contact the gallery ahead. Personal care
    attendants and service animals are welcome. The restroom door is 34 inches wide and has grab bars,
    but the page does not say whether the restroom is step free.
