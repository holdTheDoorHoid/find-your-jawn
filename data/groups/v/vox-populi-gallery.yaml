  newcomer_friendliness: 3
  basis: Open to the public on set days, with a clear events calendar and a mailing list. Internships,
    board seats and open calls are listed, but no beginner or volunteer program is.
  what_to_expect: Open hours let you see the current exhibition on the third floor, which runs October
    2 to November 15, 2026. The site does not state an admission charge for open hours. Performances and
    screenings have their own times, and some are ticketed.
  first_visit_tips:
  - If you need the ramp, call 215-238-1236 or email events@voxpopuligallery.org before you come.
  - Check the events page for performances and screenings, which have their own times and tickets.
  - The gallery spaces use window air conditioners, not central air.
  - To visit outside open hours, email director@voxpopuligallery.org to book an appointment.
