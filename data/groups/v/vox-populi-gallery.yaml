  notes: Five steps from the street to the first floor landing, where the passenger elevator starts. The
    elevator door is 29 inches wide and may not fit every wheelchair or motorized chair. The third floor
    has no further steps. Ramp access is available if you contact the gallery ahead. Personal care attendants
    and service animals are welcome. The restroom door is 34 inches wide and has grab bars; the page does
    not say whether the restroom is step free.
