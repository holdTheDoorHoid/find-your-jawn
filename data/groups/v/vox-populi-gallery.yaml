summary: An artist-run gallery in North Chinatown with exhibitions, performances, film screenings and
  community events. It also runs open calls for artists and offers space rentals.
what_you_do: Visit during open hours, or come to an opening, performance or screening. Artists can apply
  to open calls, and supporters can give monthly through the Vox Circle or join the board.
