summary: A nonprofit that turns vacant lots and shared spaces into green space, and gives young people
  hands-on training in landscaping and environmental work. Its three program areas are Youth Development,
  Creative Environment Learning, and Community Greening.
what_you_do: Teens can join a Saturday landscaping academy, a paid summer lawn care job, or a semester
  or summer internship. Kids can join art and plant workshops. Neighbors can help turn vacant lots into
  gardens through monthly cleanups and planting days.
