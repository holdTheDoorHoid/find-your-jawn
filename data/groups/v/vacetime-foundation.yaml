first_step:
  how: Pick a program on the Programs page and use its Learn More link or the Join A Program form. To
    volunteer, use the sign-up form on the Get Involved page.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The volunteer page says people with or without gardening experience are welcome and gives a sign-up
    form to start.
  what_to_expect: Volunteers help with youth skills, neighborhood projects, and senior care, and the site
    welcomes people with or without gardening experience. The site does not describe an orientation or
    a time commitment, so ask staff what a first shift looks like. Most programs do not list a fee, and
    some pay teens or give fellows a stipend.
  first_visit_tips:
  - Choose one program first, since age ranges differ, such as kids 5 to 13 and teens 13 to 18.
  - Dress for outdoor work, because most programs are hands-on gardening.
  - Ask whether a background check applies to volunteers, since the site does not say.
