first_step:
  how: Fill in the Philly HEALs sign-up survey linked from the city's grief support page to get the meeting
    link. To ask questions, call Philly HEALs staff at (215) 982-0959.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The group is open to men with this kind of loss, it is free, and the city page gives a clear
    sign-up route.
  what_to_expect: Each session runs one hour, 6 to 7 pm Eastern on Mondays, online. It is for men grieving
    a loss that carries stigma, and you meet other men with similar losses. The page does not say which
    online platform is used, whether cameras are on, or who leads the session.
  first_visit_tips:
  - Sign up early so the meeting link reaches you before the session.
  - Choose a quiet, private spot with a good internet connection for the hour.
  - Ask Philly HEALs ahead of time which platform is used, since the page does not say.
