first_step:
  how: Email the completed volunteer application to pdp.volunteer@prisons.phila.gov. The form is a PDF
    linked from the city's volunteer form page.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Volunteer Services reviews every application and accepts only people whose skills fit a current
    program need. Accepted applicants then complete training and a background check before they start.
  what_to_expect: Accepted volunteers first finish 16 hours of training at the Department of Prisons training
    academy, which contacts them to begin a background check. After that, volunteers give educational
    or spiritual support inside a facility. The site does not describe a typical first visit or how often
    training classes run.
  first_visit_tips:
  - 'Check the rules first: applicants must be 21 or older with a valid state ID, and anyone who was incarcerated
    must wait six months after release.'
  - If a relative is held in the system, say so on the application. You will not be placed at the facility
    where that relative is held.
  - General volunteer questions go to 215-685-8149. Religious volunteer questions go to 215-685-8385.
