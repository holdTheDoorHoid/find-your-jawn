first_step:
  how: Email the volunteer application to pdp.volunteer@prisons.phila.gov. The form is on the City's form
    page at phila.gov/documents/philadelphia-prisons-volunteer-form/.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Applicants must be approved by the Volunteer Services Division, then complete 16 hours of training
    and a background check before they start. Applications that do not fit a program need are turned down.
  what_to_expect: Accepted volunteers first finish 16 hours of training at the Department of Prisons training
    academy, and the academy contacts them to start the background check. After that, volunteers give
    educational or spiritual support inside a facility. The page does not describe what a first visit
    looks like.
  first_visit_tips:
  - 'Check the rules before you apply: volunteers must be 21 or older with a valid state ID, and people
    who were incarcerated must wait six months after release.'
  - Relatives of people held in the system must say so on the application and are not placed at the same
    facility.
  - Questions go to 215-685-8149. Religious volunteer questions go to 215-685-8385.
