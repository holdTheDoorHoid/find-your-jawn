first_step:
  how: Come to any Mass on the schedule. To ask about joining as an adult, call the parish office at (215)
    634-1133.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Masses are open to anyone, and the parish lists a phone number and an email for questions. The
    parish pages do not describe a newcomer program for adults, so the adult program needs a phone call.
  what_to_expect: Mass is offered in Spanish, English or Vietnamese, depending on the service you pick.
    The parish lists no sign-up for attending Mass. The parish pages do not say how long Mass lasts or
    what happens afterward, so ask the office if you want to know more.
  first_visit_tips:
  - 'Pick the language you want: Spanish at 8 and 10 am on Sunday, English at 9:30 am and Saturday at
    5 pm, Vietnamese at 11 am.'
  - Call the office at (215) 634-1133 for directions, since the parish pages give two addresses.
  - Confession is on Saturday from 4 to 5 pm, or by appointment, if you want it before Mass.
