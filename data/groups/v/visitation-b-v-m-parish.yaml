summary: A Catholic parish on Kensington Avenue with Sunday Masses in Spanish, English and Vietnamese,
  and a Saturday evening Mass in English.
what_you_do: Come to Mass in Spanish, English or Vietnamese. The parish also runs a religious education
  program for children and names an adult welcome and initiation program (R.C.I.A.) on its site.
