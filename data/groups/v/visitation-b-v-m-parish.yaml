schedule:
  text: Sunday Masses at 8 am (Spanish), 9:30 am (English), 10 am (Spanish, in the upper church) and 11
    am (Vietnamese). Saturday vigil Mass at 5 pm in English. Weekday Mass Monday to Saturday at 8:30 am,
    and a Spanish Mass at 7 pm on Tuesday and Wednesday. Confession on Saturday from 4 to 5 pm.
