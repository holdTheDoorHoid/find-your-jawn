summary: A mentoring nonprofit for young people in Philadelphia. It pairs boys in grades 2 to 12 with
  mentors, runs leadership and financial literacy programs, and offers a college prep group for students
  heading to Lincoln or Cheyney University.
what_you_do: Youth enroll online for the Leadership Academy, the mentorship program and financial literacy
  classes for grades 7 to 12. The group also runs workshops on professional skills, resumes and mock interviews.
  The site does not say whether adults can volunteer as mentors.
