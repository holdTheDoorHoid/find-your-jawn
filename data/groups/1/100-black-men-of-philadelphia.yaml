  newcomer_friendliness: 3
  basis: A public form on the site lists each program to choose from, so the youth way in is clear. The
    site does not say how a non-member adult can mentor.
  what_to_expect: The Leadership Academy is for young men in grades 2 to 12, grouped by age and led by
    mentors. Topics include character, conflict resolution, goal setting and leadership. The site does
    not give the place, the length or the fee for sessions.
  first_visit_tips:
  - Have a parent or guardian's name, phone number, email, school and grade ready, since the form asks
    for them.
  - Ask the office for the place and start time, because the site does not list them.
  - To ask about adult volunteering, call (267) 424-2444 or email office@100blackmenphilly.org.
