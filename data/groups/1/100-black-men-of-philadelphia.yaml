summary: A mentoring nonprofit for young people in Philadelphia. It pairs boys in grades 2 to 12 with
  mentors, runs leadership and financial literacy programs, and offers a college prep group for students
  heading to Lincoln or Cheyney University.
what_you_do: Youth sign up through the Mentee (Youth) Participation Request form on the site and pick
  a program, such as the Saturday Leadership Academy. The group also runs financial literacy classes for
  grades 7 to 12 and workshops on professional skills, resumes and interviews. Men who are 25 or older
  and live in Philadelphia can apply for membership. Members volunteer at least 40 hours a year, through
  mentoring, committees or other work, and pay yearly dues.
