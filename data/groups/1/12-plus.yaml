summary: A college and career readiness nonprofit that works inside partner Philadelphia high schools,
  helping students plan for college and jobs after 12th grade.
what_you_do: Volunteers can sit on panels at the yearly career and higher education fairs, act as mock
  interview partners, or present at information sessions. Working professionals can also apply to the
  10-month Fellows program, which places fellows full time in school-based centers.
