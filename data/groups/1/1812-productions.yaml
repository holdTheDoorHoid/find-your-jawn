first_step:
  how: Buy a ticket to one show on the site, then go to Plays & Players Theatre at 1714 Delancey Place.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Anyone can buy a show ticket on the site, and the box office takes questions by phone and email.
    No audition was scheduled when we checked, so the ticket is the clearest way in.
  what_to_expect: Shows at Plays & Players Theatre are seated comedy performances about community, history
    and people. The orchestra level has the most step-free rows, so ask for seats there if you need them.
    Tickets are paid, and prices were not on the pages read.
  first_visit_tips:
  - Check each show's own page for its dates and prices, since the season list shows no dates.
  - Wheelchair and companion seats are not sold online, so call 215-592-9560 or email info@1812productions.org
    to book them.
  - Free listening headsets are picked up at the box office window, first come, first served, with no
    reservation.
  - The lower level restrooms are not wheelchair accessible.
