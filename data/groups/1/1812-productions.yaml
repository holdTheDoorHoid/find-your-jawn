access:
  wheelchair: partial
  languages: []
  notes: A ramp from the sidewalk reaches the lobby. Orchestra rows B to G have no steps, rows H to M
    have one step, row N has two and row O has three. The mezzanine and lower level are reached only by
    stairs. Wheelchair and companion seats are booked by phone or email, not online. Some shows are open
    captioned, and free listening headsets are at the box office. The lower level restrooms are not accessible.
    The site does not list ASL or sensory-friendly shows.
