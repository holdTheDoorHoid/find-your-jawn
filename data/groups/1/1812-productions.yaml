summary: A Philadelphia theater company that makes comedy and comic theater about community, history,
  and people. Besides its shows, it runs training programs and holds auditions.
what_you_do: Buy a ticket to a show or a season subscription, or use a ticket discount. Auditions are
  held for productions when they are scheduled; none were listed when we checked. 1812 Education brings
  weekly theater workshops into two Philadelphia public schools. The apprenticeship is a paid full-time
  job, and its listed application deadline, April 13, 2026, has passed.
