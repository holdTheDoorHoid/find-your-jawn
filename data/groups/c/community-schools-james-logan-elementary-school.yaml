first_step:
  how: Call the school's main line at (215) 400-3670 to ask which volunteer shifts are open, and check
    the City's volunteer portal for listed shifts.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Shifts are posted on a public City portal and the school publishes a phone line, but the City
    pages do not say whether a first shift needs clearances.
  what_to_expect: The City describes the school's work as family forums, school events, resource fairs
    and resource distributions, and volunteer shifts support that work. The City pages do not say how
    long a shift runs, so ask when you call. No page we could read mentions a cost for volunteering.
  first_visit_tips:
  - Ask whether the shift you pick needs the district's volunteer clearances before you start, since the
    City pages do not say.
  - Call on a weekday, when the community school coordinator's office is open from 8:30 am to 5 pm.
  - The coordinator, Eli Prosper, can be reached at eli.prosper@phila.gov or (215) 301-2376.
