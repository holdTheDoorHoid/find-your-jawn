summary: The Chabad house for the University of Pennsylvania on Spruce Street. It offers Shabbat dinners,
  holiday gatherings and learning for students, has pages for graduate students and alumni, and posts
  weekly candle lighting times.
what_you_do: Sign up for the Chabad Bot by text for event updates, join the mailing list or the Students
  Weekly Newsletter, or RSVP for a general event, Family Weekend or the High Holidays. Contact the house
  through its contact page.
