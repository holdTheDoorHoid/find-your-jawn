  newcomer_friendliness: 2
  basis: The site invites neighbors to join and links a membership sign-up form, but the form page did
    not show its questions when checked, and the site lists no open hours, work days, or dues, so you
    cannot see what joining involves first.
  what_to_expect: The site does not say how long a visit lasts, what you do there, or what it costs. The
    Neighborhood Gardens Trust profile describes the garden as food producing, so ask the garden by email
    what it is like to take part before you go.
  first_visit_tips:
  - The site lists no open hours, so email before you come.
  - The garden's Facebook group and Instagram are linked from its site if you want to see recent posts
    first.
