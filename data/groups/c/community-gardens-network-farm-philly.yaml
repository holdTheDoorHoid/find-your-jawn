  newcomer_friendliness: 3
  basis: The city page gives a clear way to find a garden and contact it, and says Farm Philly runs workshops
    and training for growers.
  what_to_expect: Each garden is a shared growing space on Parks and Recreation land, and about 500 neighbors
    grow food together across 19 sites. Farm Philly supplies land access, compost, mulch, wood chips,
    and supplies, and its staff teach workshops. The city page does not say what a garden charges or when
    members meet, so ask the garden you contact.
  first_visit_tips:
  - Contact the garden before you visit, since the city page does not list visiting hours.
  - Ask about fees, plot rules, and how new members join.
  - Ask Farm Philly about workshops if you are new to growing food.
