summary: The city's network of 19 community gardens on park land, where about 500 residents grow food
  together. Farm Philly provides land access, compost, mulch, supplies, workshops, and training.
what_you_do: Grow food in a shared garden alongside neighbors, and take part in the workshops and training
  Farm Philly offers growers.
