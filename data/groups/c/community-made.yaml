  newcomer_friendliness: 3
  basis: The volunteer page has a contact form and an email address, and the FAQ says anyone can get involved
    by sending a message. The site does not describe what a first shift looks like.
  what_to_expect: The site does not say how long a first shift runs or who you would work with. The listed
    roles include delivering meals and doing check-ins with homebound older neighbors, helping at festivals,
    and stocking and checking community fridges.
  first_visit_tips:
  - Email before you come to ask which role suits a first-timer.
  - Watch the event list for porch conversations and festivals, which are a way to meet the team in person.
