summary: Neighbors in East Oak Lane who connect residents, local businesses, and groups to help the area
  live and work well together. Volunteers and youth prepare and deliver meals to older neighbors each
  week, and the group runs weekly wellness check-ins.
what_you_do: Help prepare and deliver meals to older neighbors, do wellness check-ins, stock and check
  the community fridges, or help at porch conversations, pop-up events, and festivals.
