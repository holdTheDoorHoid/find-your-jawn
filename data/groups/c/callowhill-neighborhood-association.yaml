  basis: Membership is open and the dues are listed, but the site does not say when meetings happen or
    what members do, so you must pay or ask before you can see what it is like.
  what_to_expect: The site does not describe meetings, volunteer roles, or events. You join by paying
    yearly dues online or by check, and you can sign up for neighborhood emails about zoning, public meetings,
    and events. Ask the group for the next meeting date before you pay.
  first_visit_tips:
