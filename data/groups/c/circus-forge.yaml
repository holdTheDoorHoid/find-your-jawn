first_step:
  how: Join the mailing list at circusforge.org to hear about the next public jam, then attend one before
    you apply for membership.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: Public jams are open to visitors, but none is listed as upcoming, and membership needs an application
    and monthly dues before you see the full group.
  what_to_expect: Public jams are evening sessions, and one listing ran from 6:30 to 11 pm. The join page
    says no high level of skill is required and that the group is looking for artists who want to build
    community. Membership starts with an application form on the site, and dues are $10 a month.
  first_visit_tips:
  - Check the events page or the mailing list for the next jam, since the site currently lists no upcoming
    events.
  - Past jams asked people to RSVP so the group could estimate attendance, so RSVP if a listing asks.
  - Membership starts with the Apply Now form on the join page.
