summary: A nonprofit working to make intermediate and advanced circus arts easier to reach in Philadelphia.
  It has hosted community flow arts jams and offers memberships, and flying trapeze classes are taught
  by a partner business.
what_you_do: Come to a community flow arts jam when one is announced, follow the mailing list or Discord
  for news, or apply for a membership at $10 a month. Flying trapeze classes are booked directly with
  Wahoo Trapeze, a separate company that offers classes at the group's East Johnson Street space.
