first_step:
  how: Join the group's Discord and introduce yourself, RSVP for a session on Meetup, and bring a laptop.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The onboarding page says no experience is needed and lists three steps for new people. It does
    not describe a formal orientation or buddy program.
  what_to_expect: A session is a work time where members code side by side on their own projects, a course,
    or a shared challenge such as practice problems. Bring a laptop and something to work on. The page
    suggests introducing yourself to at least one person, and the group also runs workshops, AI paper
    discussions, and a quarterly hackathon. Sessions need no application, and the page lists no fee.
  first_visit_tips:
  - Introduce yourself in the Discord intro channel before the session, so people know who you are.
  - Bring a laptop and a project or practice problem you want help with.
  - Check Meetup for the time and place, since the group does not name a fixed weekly venue.
