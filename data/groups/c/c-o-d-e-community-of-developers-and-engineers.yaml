summary: A community for people who build software in Philadelphia. Members meet for weekly coding sessions
  to work on problems side by side, and the group runs a hackathon every quarter.
what_you_do: Bring a laptop, work on your own code or a challenge with others, and help newer members
  get unstuck. Some weeks focus on practice problems.
