first_step:
  how: Attend the Zoning Committee meeting, held on the 4th Tuesday of the month at 7 pm by Zoom and open
    to the public.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The monthly zoning meetings are open to the public. Joining the committee itself needs CCRA membership
    and a short resume, which is less casual.
  what_to_expect: Zoning Committee meetings are held monthly by Zoom on the 4th Tuesday at 7 pm and are
    open to the public. Committee members review project materials before each meeting, and the co-chairs
    call on people in turn. The site does not say how long a meeting lasts or how many people usually
    attend.
  first_visit_tips:
  - Read the agendas and reports page first to see which projects are on the list.
  - Keep comments to zoning code and quality of life topics, and wait for the co-chair to call on you.
  - To sit on the committee, send a short resume and a statement of interest by email; you must be a CCRA
    member first.
