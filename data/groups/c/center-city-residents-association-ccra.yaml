summary: A neighborhood group the City of Philadelphia has registered to be consulted on zoning and development
  in the Central part of the city, Center City Residents Association (CCRA) gives neighbors a place to
  hear about projects and respond.
what_you_do: Members follow zoning and development plans in the area. Members who serve on the Zoning
  Committee review posted project materials, visit proposed project sites, and attend the monthly meeting.
