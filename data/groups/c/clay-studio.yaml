summary: A ceramics studio with classes for beginners through advanced makers, kids' summer camps, free
  public clay sessions, and a gallery and shop open to visitors. Tuition help and a sliding scale are
  available.
what_you_do: Take a handbuilding or wheel class, join a workshop or summer camp, come to a free Hands
  on Clay session, or visit the gallery and shop. The second Thursday of each month brings extended evening
  hours, from 5 to 8 pm.
