  gear: Clay is bought at the studio's school store, and most adult classes do not supply personal tools.
first_step:
  how: Sign up for a class online on the studio's class page, or call 215-925-3453 extension 106. To try
    clay first, watch for a free Hands on Clay session, which is open to all ages.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Beginner classes are listed with online sign up, a waitlist and a sliding scale, and free clay
    sessions are open to all ages. Classes do not take drop-ins.
  what_to_expect: Adult classes run in terms of 5, 8 or 10 weeks, and each meets on one weekday for about
    three hours. In the fall term, Intro to Handbuilding meets Wednesday evenings from 6:30 to 9:30 pm,
    and Intro to Wheel Throwing meets Wednesday mornings from 10 am to 1 pm. Students buy their clay at
    the school store.
  first_visit_tips:
  - Clay must be bought at the school store, so pick it up there before your first session.
  - Open studio is only for enrolled students, so you need a class before you can use the studio on your
    own.
  - Drop-in visits to classes are not allowed, so sign up for the term before you come.
