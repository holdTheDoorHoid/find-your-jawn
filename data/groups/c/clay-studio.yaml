  notes: 'Step-free entry, and an elevator serves all floors. Restrooms are accessible on every floor,
    and water fountains are accessible on floors 2 to 4. Service dogs are welcome, and guided tours can
    be arranged ahead to suit needs. Nearest SEPTA: the Market-Frankford Line to Girard station, about
    a 10 minute walk. Bus 5 stops at 2nd and Girard, about a 6 minute walk, and bus 57 stops at Germantown
    Avenue and Master Street, about a 3 minute walk.'
