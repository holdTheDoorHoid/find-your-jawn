  text: Class prices are not shown on the class list. Tuition assistance for classes, workshops and camps
    needs a short application. A sliding scale with three options (Community Supported, Standard, or Clay
    It Forward) needs no application, and you choose what to pay. Payment plans require a $100 non-refundable
