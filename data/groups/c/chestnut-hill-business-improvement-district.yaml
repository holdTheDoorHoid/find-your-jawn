summary: The Chestnut Hill Business District runs public cleanups and street events in the Chestnut Hill
  shopping area. It is also one of the City's registered community organizations, so it reviews variance
  requests for projects inside its district.
what_you_do: Pick up litter at the public cleanup days, or come to district street events such as Halloween
  on the Hill.
