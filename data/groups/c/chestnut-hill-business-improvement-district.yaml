first_step:
  how: Pick a public cleanup or street event from the district's events calendar and come at the listed
    start time.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Cleanups and street events are posted publicly with times and meeting spots, and the listings
    give no sign-up step.
  what_to_expect: A cleanup on the calendar runs from 9 am to noon and is a morning of picking up litter
    in a park or along a street, with other volunteers. The listings do not say what to bring or whether
    tools are supplied. The calendar does not list prices for most events.
  first_visit_tips:
  - For the Pastorius Park clean-ups, check in at the warming hut and arrive for the 9 am start, since
    the listing says it begins promptly.
  - Some listings name a rain date, so check the calendar the day before you go.
  - The district office at 10 East Springfield Avenue is open Monday to Friday 8:30 am to 5 pm and Saturday
    10 am to 4 pm; call 215-247-6696 to ask what to bring.
  - The Chestnut Hill East and West Regional Rail lines serve the area, according to the district's resident
    FAQ.
