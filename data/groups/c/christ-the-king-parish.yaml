summary: A Catholic parish at Morrell Avenue and Chesterfield Road in Northeast Philadelphia. It runs
  CYO sports for children, religious education and adult faith formation, and sends parish news through
  Flocknote.
what_you_do: Register as a new parishioner at the rectory, come to a Sunday Mass, or join the parish news
  list on Flocknote. Children ages 3 to 8 can join Little Peoples' Church at the 10 am Mass. Religious
  education for grades 1 to 6 is for children who attend public or charter school. CYO soccer is for grades
  5 to 7, and adults can join faith formation such as marriage preparation (Pre-Cana), the Lenten program,
  or parish missions. CYO questions go to christthekingcyoathletics@gmail.com.
