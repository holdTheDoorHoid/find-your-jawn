schedule:
  text: Saturday vigil Mass at 5 pm. Sunday Masses at 8 am and 10 am; the archdiocese listing also shows
    a noon Mass, so confirm with the parish. Weekday Mass at 8 am, Monday to Saturday. Confession on Saturdays
    from 3:30 to 4:30 pm. Religious education for grades 1 to 6 meets on Sunday mornings from 11:15 am
    to 12:30 pm, September through May. Little Peoples' Church meets at the 10 am Mass on Sundays.
