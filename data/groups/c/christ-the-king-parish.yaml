summary: A Catholic parish at Morrell Avenue and Chesterfield Road in Northeast Philadelphia. It runs
  CYO sports for children, religious education and adult faith formation, and sends parish news through
  Flocknote.
what_you_do: Join the parish news list on Flocknote, come to a Sunday Mass, sign children up for CYO soccer
  or religious education, or take part in adult faith formation. The parish also holds a Blue Army Fatima
  Holy Hour for world peace.
