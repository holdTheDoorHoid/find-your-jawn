  sign_up_needed: null
  newcomer_friendliness: 4
  basis: 'The parish has a set newcomer step: a rectory visit that gives a New Parishioner Welcome Packet
    on getting involved, and Masses open to all. No separate newcomer program is described.'
  what_to_expect: Mass is open to all visitors. Families with children ages 3 to 8 can come to the 10
    am Mass, where children go to the school for a child-focused Liturgy of the Word led by catechists.
    Newcomers who register at the rectory receive a welcome packet about getting involved in parish life.
  first_visit_tips:
  - The rectory is at 3252 Chesterfield Road, across from the church's front door.
  - Children ages 3 to 8 can join Little Peoples' Church at the 10 am Mass.
  - Religious education is for children in grades 1 to 6 who attend public or charter school.
