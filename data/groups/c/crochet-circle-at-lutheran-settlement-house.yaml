summary: A weekly crochet circle at the Lutheran Settlement House Fishtown office for adults 55 and older.
  Volunteer instructors help people make friends, get better at crochet, or learn from the start.
what_you_do: Come on a Thursday morning to crochet with others and get help from volunteer instructors.
  No registration is needed.
