summary: The Scouting America council for Philadelphia, Montgomery and Delaware Counties. It runs Cub
  Scouts, Scouts BSA, Venturing, Sea Scouts and Exploring through local units, and it checks the adults
  who lead them first.
what_you_do: 'Youth join a local unit by age: Cub Scouts for ages 5 to 10, Scouts BSA for ages 11 to 17,
  Venturing and Sea Scouts for ages 14 to 20, and Exploring for ages 10 to 20. Adults can take unit roles
  such as Scoutmaster, Cubmaster or committee member, after youth safety training and Pennsylvania clearances,
  with an online application at beascout.org that carries a fee.'
