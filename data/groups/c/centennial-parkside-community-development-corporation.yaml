summary: Centennial Parkside Community Development Corporation works to preserve and revitalize East Parkside
  with residents, local businesses, and institutions. It is also a Registered Community Organization (RCO),
  so neighbors can have a say in nearby zoning and building plans.
what_you_do: Attend the group's monthly public meetings. The group works on healthy living, civic engagement,
  the arts, and stronger ties to Fairmount Park, and neighbors can review nearby zoning and building plans
  with it.
