first_step:
  how: Come to the Wednesday 7:15 pm Beginner's Meeting at The Hart of Catering, 2101 Sansom St, or call
    the 24-hour helpline at 855-638-4373 with questions.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 5
  basis: A weekly Beginner's Meeting is built for newcomers, anyone can attend, and no dues are charged.
  what_to_expect: The Wednesday Beginner's Meeting is built for newcomers, and people who have been clean
    for less than a year get preference when sharing. The fellowship follows the Twelve Step model, so
    meetings center on sharing and listening. The newcomer page suggests going to many meetings early
    on and finding a sponsor. The site does not say how long a meeting lasts.
  first_visit_tips:
  - Go to The Hart of Catering, 2101 Sansom St, in Center City for the Wednesday 7:15 pm Beginner's Meeting.
  - Call the 24-hour helpline at 855-638-4373 if you want to ask questions first.
  - Attending is free. There are no dues or fees, and the basket is optional.
  - The only online meeting is the Saturday 5 pm speaker meeting, which runs on Zoom.
