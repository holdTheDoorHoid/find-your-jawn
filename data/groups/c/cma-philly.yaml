schedule:
  text: Meetings run every day of the week in Philadelphia, most at 7:15 pm. Center City meetings are
    at The Hart of Catering, 2101 Sansom St. Fishtown meetings are at Hope on Girard, 126 W Girard Ave,
    on Tuesday at 8:30 pm and Friday at 9:30 pm. The Saturday 5 pm speaker meeting is online.
