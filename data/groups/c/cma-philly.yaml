summary: A peer fellowship for people who want to stop using crystal meth. Members meet every day of the
  week in Center City and Fishtown, and anyone can come to a meeting.
what_you_do: Come to any meeting to listen or share. The group follows the Twelve Step model, and newcomers
  can start with the Wednesday Beginner's Meeting.
