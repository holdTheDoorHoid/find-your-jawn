first_step:
  how: Call Jared Beck, the Community School Coordinator, at (215) 400-7670 or email jared.beck@phila.gov
    to ask about the club volunteer roles.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The volunteer listing says school volunteers must clear background and child abuse checks and
    sign district forms before starting, so the way in takes approval rather than a drop-in visit.
  what_to_expect: The coordinator's listed office hours are weekdays, 8:30 am to 5 pm. Before a first
    shift, volunteers who work with students need background and child abuse clearances, per the volunteer
    listing. The school's programs include after school learning, family events, and student support,
    so ask which club or event you would help with.
  first_visit_tips:
  - Call during the coordinator's weekday office hours, 8:30 am to 5 pm.
  - Ask which clearances apply before you plan a first shift, since the City page does not list them.
