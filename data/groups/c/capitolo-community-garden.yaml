first_step:
  how: Email capitologarden@gmail.com or use the Join the Waitlist form on the How to Join page to get
    on the plot waitlist, and ask when the next common bed workday is.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Anyone can join the waitlist, and community members are welcome to help with the common beds.
    The page gives no dates for those workdays, and plots typically wait 3 to 4 years, so the way in is
    unclear.
  what_to_expect: Helpers weed, water, and mow the common beds, and members also take turns on shared
    chores such as moving garden trash to the curb. The garden is organic and focused on sustainability.
    Children are welcome, and child sized tools are available.
  first_visit_tips:
  - Ask by email when the next common bed workday is, since the site does not list dates.
  - Ask about parking and access before you come, since the site does not describe them.
  - If you have limited mobility, ask about the three raised beds, which the site sets aside for that.
