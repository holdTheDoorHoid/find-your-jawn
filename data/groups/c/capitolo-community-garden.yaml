summary: A community garden in Capitolo Playground at Tenth and Federal Streets, founded in 2009. It has
  54 in-ground plots and three raised beds, and members share the garden's upkeep.
what_you_do: Members keep a plot, attend two workdays and two meetings each year, and take turns on shared
  chores such as watering the common beds and taking garden trash to the curb.
