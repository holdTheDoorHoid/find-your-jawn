summary: A Pennsylvania advocacy group that pushes lawmakers to invest in children living with poverty
  and hardship. It publishes election guides and candidate questionnaire answers so families can see where
  officials stand.
what_you_do: Read the 2026 Election Center and Child Care Voter guide, including candidate answers on
  child care and family issues. Sign up for updates in the 'Be a Part of the Action' section, and follow
  the group on Facebook or Instagram.
