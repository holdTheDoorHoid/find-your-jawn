  basis: 'Open to the public: the guides are free to read and sign-up for updates is clearly marked, though
    no meetings or volunteer steps are described.'
  what_to_expect: There are no meetings or events listed. A first visit means reading the 2026 ballot
    guide, which covers candidate answers on child care, pre-K, paid leave, and the child care workforce,
    and using the voter tools to check or register. There is no fee to read the guides, though the site
    also asks for donations.
  first_visit_tips:
  - The Election Center lists Pennsylvania voter deadlines for the November 3, 2026 election, starting
    with registering by October 19, 2026.
  - Use the voter tools on the Election Center page to check your registration or find your polling place.
