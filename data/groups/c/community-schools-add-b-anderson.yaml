first_step:
  how: Call or email the Community School Coordinator, Lyndell Mason, at (267) 226-5850 or lyndell.mason@phila.gov,
    and ask about the open volunteer roles.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The City's school page names a coordinator to contact, and the volunteer listing is open to the
    public. Whether clearances apply to this school was not confirmed this run.
  what_to_expect: The coordinator's listed office hours are weekdays, 8:30 am to 5 pm, so that is the
    best time to call. The school's programs include after school learning, family events, and student
    support. The site does not say how long a shift runs, so ask the coordinator.
  first_visit_tips:
  - Call the coordinator on a weekday between 8:30 am and 5 pm, when the listed office hours run.
  - Ask what paperwork or clearances come before a first shift, since the City page does not list them.
