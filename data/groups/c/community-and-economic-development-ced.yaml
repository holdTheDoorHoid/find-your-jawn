summary: A department of the Urban Affairs Coalition that helps lower and moderate income families with
  homebuying, foreclosure prevention and money skills. It offers free financial education workshops that
  groups can request, and a free hotline for homeowners who are behind on payments.
what_you_do: Request a free money workshop for your group through the site's form, call the homeowner
  hotline, or sign up for a homebuyer seminar through Eventbrite.
