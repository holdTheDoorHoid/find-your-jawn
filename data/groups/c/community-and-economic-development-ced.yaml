first_step:
  how: Call the hotline at 215-334-4663 if you are behind on a mortgage or property tax, or email cedphilly@uac.org
    to ask for a free money workshop for your group.
  drop_in: false
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The hotline and free workshops are open to the public, and the group request route is clear,
    but the site lists no workshop dates or hotline hours.
  what_to_expect: The hotline is for homeowners who are behind on a mortgage or property tax, facing foreclosure,
    or dealing with a tangled title. The site does not say what happens after the call, beyond pointing
    to an online intake form at Philadelphia Legal Assistance. A money workshop is set up for a group,
    which picks the topic and dates and provides the room. Individuals who need one-on-one help are referred
    to other services.
  first_visit_tips:
  - The office is at 1650 Arch Street, Suite 2701, open 9 am to 5 pm, Monday to Friday.
  - Workshops are for groups such as organizations, churches, clubs, and schools.
  - The site lists no parking, transit, or accessibility details, so ask before you visit.
