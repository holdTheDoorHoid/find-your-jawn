first_step:
  how: Email info@phillynokill.org to ask about the next pet pantry or how to volunteer.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: The pantry needs an application and agreement before a first visit, and the site describes no
    volunteer steps, so the way in is unclear.
  what_to_expect: The pantry gives free food and supplies for cats and dogs kept mainly indoors, at monthly
    events in different Philadelphia neighborhoods. Before the first visit you complete an application
    and a pet pantry agreement, and bring a valid ID, proof of residency such as a utility bill or lease,
    and proof of your pets such as vaccination records or photos. To become a repeat participant, owners
    must agree to spay or neuter their pets.
  first_visit_tips:
  - Bring a valid ID or driver's license, proof of residency, and proof of how many pets you have.
  - Breeding households are not eligible, and community cat feeding is not covered.
  - The help desk handles stray or lost pets and rehoming questions, and the same email address can answer
    them.
