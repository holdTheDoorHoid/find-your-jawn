summary: A nonprofit that works to save healthy and treatable pets in Philadelphia shelters. It runs free
  community pet food pantries and helps owners find rescues instead of surrendering pets.
what_you_do: Donate pet food or supplies at a pantry event, or email info@phillynokill.org to ask how
  to help. The site does not list volunteer roles, so ask first. The free pet pantry serves low-income
  households with pets, and the help desk can point owners to help with stray or lost pets, or to a rescue
  for a pet they can no longer keep.
