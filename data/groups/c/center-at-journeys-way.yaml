first_step:
  how: Call 215-487-1750 to set up a membership appointment, which is how new members start, then fill
    out the registration form.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The membership page speaks to new and returning members directly, asks them to call for an appointment,
    and offers a free basic membership to people 55 and older.
  what_to_expect: New members book an appointment with staff by phone, then fill out a registration form
    and show proof of age. The center serves adults 55 and older with a café style lunch, fitness and
    art classes, trips and social activities. Basic membership is free, and the paid Classic and Premier
    levels add fitness center access and discounts on classes and tickets.
  first_visit_tips:
  - Bring proof of age for the registration form
  - Ask staff which activities are open to people who are not yet members
  - Parking is free on site
