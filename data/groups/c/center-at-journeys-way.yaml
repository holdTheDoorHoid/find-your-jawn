summary: A community center for adults 55 and older in Roxborough, run by Intercommunity Action, with
  a café style lunch, fitness and art classes, and volunteer roles.
what_you_do: Eat lunch in the dining room, take a fitness class or an art or learning class, volunteer,
  or join social activities during open hours.
