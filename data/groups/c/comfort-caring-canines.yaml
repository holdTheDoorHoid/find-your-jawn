summary: A Collegeville nonprofit that brings certified therapy dog teams to nursing homes, hospitals
  and reading programs across southeastern Pennsylvania. It also runs a crisis support team for school
  districts.
what_you_do: A handler and dog visit residents, patients or children in reading programs. Handlers choose
  when to visit, and each new facility must approve the visit first.
