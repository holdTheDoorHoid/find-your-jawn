  how: Email info.cdag@gmail.com to confirm the next monthly meeting is still on, then come to the second
    Thursday meeting at 6 pm.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Meetings are open to the public and the group lists a clear contact address. The newest dated
    post on the site is from 2021, so confirm the meeting is still happening before you go.
  what_to_expect: The meeting is in person, once a month on a Thursday evening, in the community room
    at Society Hill Towers. The group is a coalition that follows the Central Delaware waterfront and
    zoning plans, so expect talk about those projects. There are no dues, and optional donations are accepted.
    The site does not say how long a meeting runs.
  first_visit_tips:
  - Confirm the meeting is on before you go, since the newest dated post on the site is from 2021.
  - Arrive a little early to find the community room, which is near the mini market in Society Hill Towers.
