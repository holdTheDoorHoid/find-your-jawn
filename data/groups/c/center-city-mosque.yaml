first_step:
  how: Come to the 1:50 pm Friday prayer, which is open to men and women, or call 267-817-4433 or email
    centercitymosque@gmail.com to ask about classes.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The contact page invites visitors to come for prayer, ask a question or join the community, and
    gives a phone number and email. The Friday page has arrival tips, but there is no formal orientation.
  what_to_expect: Each Friday session lasts about 25 minutes and includes a short talk (khutbah) followed
    by the prayer. The page asks visitors to arrive 10 to 15 minutes early, find a quiet place and listen
    to the talk quietly.
  first_visit_tips:
  - Arrive 10 to 15 minutes early to find a quiet spot.
  - Silence your phone and dress modestly.
  - Parking nearby is limited, so allow extra time.
  - The 1:10 pm session is for men only, so women and families should come to the 1:50 pm session.
