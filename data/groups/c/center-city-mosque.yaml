summary: A small mosque on Walnut Street that holds daily prayers, Friday prayers and weekly Quran circles
  for children, youth and adults. It also holds Ramadan iftar gatherings and Eid prayers.
what_you_do: Come to the second Friday prayer, which is open to brothers and sisters, or ask about the
  Quran circles. Special programs include Ramadan iftar gatherings, Eid prayers and community service
  projects.
