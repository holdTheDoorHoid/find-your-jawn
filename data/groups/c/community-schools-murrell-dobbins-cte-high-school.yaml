summary: Murrell Dobbins is a career and technical high school for grades 9 to 12 and one of the City's
  Community Schools. Volunteers help with the school's food distribution, its pantries, and events such
  as resource fairs.
what_you_do: Hand out groceries each week to students and families, help run the food and clothing pantries,
  and help at school events.
