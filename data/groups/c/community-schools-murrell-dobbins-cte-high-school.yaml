first_step:
  how: Call the school at (215) 400-7050 and ask the Community School Coordinator about the next grocery
    or pantry shift, and which clearances to complete first.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Volunteers need district and state clearances and a city release form before a first shift, and
    the school site does not explain how to start. The way in takes paperwork and a call to the coordinator.
  what_to_expect: Expect a paperwork step before your first shift, since the volunteer listing asks for
    district and state clearances and a city release form. Shifts involve handing out groceries each week,
    working the food and clothing pantries, and helping at events such as resource fairs. Neither the
    school site nor the city page gives shift length, so ask the coordinator.
  first_visit_tips:
  - Ask the coordinator which entrance to use and where to check in.
  - Ask early which clearances must be finished before your first shift.
