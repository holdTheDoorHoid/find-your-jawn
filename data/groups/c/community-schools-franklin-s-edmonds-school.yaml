first_step:
  how: Sign up through the city's volunteer portal, or ask the school's community school coordinator,
    Oanye Sims (oanye.sims@phila.gov, (215) 400-3370), about open shifts.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Volunteers must clear background and child abuse checks before they work at the school, and the
    city page does not say what a first shift looks like.
  what_to_expect: 'Before any shift, volunteers sign the district''s code of conduct, get a district volunteer
    certificate, and complete clearance checks: the state child abuse history check, the state criminal
    background check, a city release waiver, and either an FBI waiver or fingerprinting. Open roles have
    included weekly help with grocery handouts for families and occasional help at special events.'
  first_visit_tips:
  - Start the clearance paperwork early, because it has to be finished before your first shift.
  - Ask the coordinator which day and time the grocery handouts run.
  - Ask the coordinator where to check in on your first day.
