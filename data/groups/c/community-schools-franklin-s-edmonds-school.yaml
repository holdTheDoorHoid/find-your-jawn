summary: A Community School partnership between the City, the School District and neighbors, Franklin
  S. Edmonds School welcomes volunteers through the City's volunteer portal.
what_you_do: Volunteers help with the school's programs for students and families, such as weekly grocery
  handouts for families and help at special events. The school also runs family forums, adult education
  classes, parent cafes, and after school and summer programs for young people.
