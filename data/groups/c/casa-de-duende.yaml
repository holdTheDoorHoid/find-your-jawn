first_step:
  how: Check the Current and Upcoming Programs page for a public event, such as a reading, or send an
    enquiry to ask how to attend.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Public readings say everyone is invited and give a date, time, and venue, but no sign up route
    is printed. Other routes, such as exhibitions, press, and performances, start with an email enquiry.
  what_to_expect: Events are public readings, exhibitions, and performances, and the press publishes in
    English and Spanish. The March 2026 anthology reading ran at 5 pm at Samuel S. Fleisher Art Memorial,
    and the page says everyone is invited. Prices are not printed, so check with the organizers before
    you go.
  first_visit_tips:
  - Confirm the time and place by email before going, since the office lists no visiting hours.
  - Look for the venue on each event listing, because the office and the events are in different places.
  - The office is at The Philadelphia Building, 1315 Walnut Street, Suite 300, but ask before you visit.
