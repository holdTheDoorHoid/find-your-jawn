first_step:
  how: Call the school at (215) 400-3100 and ask for a community school coordinator, then ask which volunteer
    roles are open right now.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Volunteers must complete school and city clearances before they start, and the way in runs through
    the coordinators.
  what_to_expect: Before any shift, you finish a packet of school and city paperwork that includes Pennsylvania
    child abuse history and criminal background checks. Volunteers support after school and family programs,
    along with student access to groceries and the garden. Shift times and length are not on the pages
    we could read, so ask the coordinators.
  first_visit_tips:
  - Ask which role needs help before you start the paperwork
  - Gather the documents for each check, since the packet lists several
  - Ask what days and hours the shifts run, since the pages do not say
