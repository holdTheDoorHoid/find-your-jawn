first_step:
  how: Email the school's community program contact to ask about current reading coach openings and the
    next training date.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Reading coaches make a weekly commitment, and neither the volunteer listing nor the city page
    we could read gives a start date or training steps, so the way in is not clear.
  what_to_expect: Reading coaches sit one on one with a student in grades K to 3 for at least an hour
    a week, after school. The city's November 2023 program page says no experience is needed and volunteers
    must be 16 or older, though the current cycle may differ. Ask the school contact for the current checks,
    training, and session times before you commit.
  first_visit_tips:
  - Confirm the current checks and training with the school contact before you sign up.
  - Plan for a regular weekly hour, since the role asks for steady attendance.
  - Ask which days and hours your session would be before you commit.
