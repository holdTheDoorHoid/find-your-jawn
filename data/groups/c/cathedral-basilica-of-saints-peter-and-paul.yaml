summary: The mother church of the Catholic Archdiocese of Philadelphia, open to anyone who wants to pray
  or attend Mass. Its website lists weekend and weekday Mass times and a public phone line.
what_you_do: Attend Mass in the Basilica or the Cathedral Chapel, including a Spanish Mass on Sunday.
  The site also lists nine volunteer ministries, from greeters and lectors to music and visits to the
  sick.
