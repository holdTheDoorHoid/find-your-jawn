summary: The city's cathedral at 18th Street and the Benjamin Franklin Parkway, which also houses the
  shrine of St. Katharine Drexel. It holds Masses every day, a Spanish Mass on Sundays and a Saturday
  novena after the noon Mass.
what_you_do: Join the Spanish Mass community on Sundays at 12:30 pm, come to a weekday Mass at 7:15 am
  or 12:05 pm, or call the parish office at 215-561-1313 about volunteer opportunities. The site also
  lists a pastoral council, liturgical music and sacramental preparation for children.
