schedule:
  text: Sunday Masses at 8, 9:30 and 11 am (the 11 am Mass is livestreamed), a Spanish Mass at 12:30 pm
    in the Cathedral Chapel, and a 6:30 pm Mass. Weekday Masses at 7:15 am and 12:05 pm, a Saturday Mass
    at 12:05 pm, and an anticipated Saturday Mass at 5:15 pm.
