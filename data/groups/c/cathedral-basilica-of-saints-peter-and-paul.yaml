first_step:
  how: Come to any Mass on the schedule. To ask about joining or registering, call the parish office at
    (215) 561-1313 or talk with a priest after Mass.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The site has a Welcoming Committee that calls newly registered families, a clear way to register,
    and Mass open to anyone. It describes no separate class for visitors.
  what_to_expect: Mass is held in the Basilica or the Cathedral Chapel at set times, and a Spanish Mass
    is offered on Sunday. The site does not say how long Mass runs or where to sit, but greeters are there
    to welcome and seat people. You do not need to sign up to attend.
  first_visit_tips:
  - On Saturdays, Sundays, and Holy Days, visitors can park in the parish lot at 222 North 17th Street.
  - Use the door off the main parking lot, which has the automatic push button.
  - The 11 am Sunday Mass is livestreamed if you cannot come in person.
  - Call the parish office at (215) 561-1313 with questions before you come.
