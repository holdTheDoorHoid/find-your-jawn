summary: A Torah study center in Rhawnhurst that offers classes, a weekly newsletter of Torah insights,
  and study sessions. Its Wednesday evening class on Jewish law is live on Zoom, with a join link on the
  site.
what_you_do: Join the Wednesday Zoom class, read the weekly newsletter, or watch recorded talks on the
  site. Two other listed programs are for teen boys and for businessmen, and the site gives no times or
  costs for most programs.
