first_step:
  how: Pick a networking event or course on the events page and RSVP, or email info@cultureworksphila.org
    with questions.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Events are listed publicly and some are free, but most listed events need an RSVP or registration.
    Desk space needs membership and fiscal sponsorship needs an application.
  what_to_expect: Networking events and mixers bring cultural workers together at CultureWorks on Walnut
    Street, and some mixers serve light bites and drinks. Courses run for several weeks and need registration
    ahead of time. Most listings do not state a price, so check the event page before you sign up.
  first_visit_tips:
  - Check whether the event is in person (Suite 300 or Suite 320) or on Zoom, since the listings name
    both.
  - Register early, because courses close when they fill.
  - Ask about the price before you register, since most listings do not give one.
