summary: A horse stable in Fairmount Park run by a nonprofit that cares for horses and protects the Wissahickon
  Valley. People can take riding lessons, ride the trails, and join monthly volunteer days.
what_you_do: Take private or semi-private riding lessons in the lighted outdoor ring, or ride the trails.
  Come to a monthly Volunteer Day to help beautify the parks and the stable. Boarding is also offered.
