  gear: Hard-soled shoes with a heel, and a riding helmet whenever you are mounted. The stable provides
    a helmet if you do not have one.
first_step:
  how: Email barnmanager@courtesystable.org to ask for a first lesson, or call 215.482.8108. The stable
    keeps your email until a slot opens and then contacts you.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The site says all levels are welcome, the first lesson includes an evaluation, and there is a
    clear email route. Lessons are booked as slots open, so the wait time is not stated.
  what_to_expect: The first lesson includes an evaluation and covers grooming, tacking, mounting, and
    walking. Private and semi-private lessons run one hour with one instructor, and students must be at
    least 8 years old. Riders under 15 need a parent or guardian on the premises, and adults stay for
    the whole lesson.
  first_visit_tips:
  - Fill out the Rider Release Form, a PDF on the site, and bring it with you. Riding requires it.
  - Wear hard-soled shoes with a heel, and bring your own helmet with a harness and chin strap if you
    have one.
  - Leave pets at home, and do not smoke in or around the barn.
  - Ask about the price before you book, because lesson rates are not printed.
