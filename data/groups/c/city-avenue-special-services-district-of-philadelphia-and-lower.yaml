first_step:
  how: Look at the events calendar at cityave.org/events, pick a community event such as a movie night
    or festival, and call 610-747-0311 with questions.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The site lists community events but does not say whether they are free or open to everyone, and
    many events are for professionals. Proposing an event has a clear route, but attending a public event
    does not.
  what_to_expect: Events include networking happy hours for professionals, monthly Lunch and Learns, a
    gathering on the district's growth held since 2016, and community events such as block parties and
    food trucks. The website does not give prices or places for most of them.
  first_visit_tips:
  - The office is in Bala Cynwyd, outside Philadelphia, so check where an event is held before you go.
  - Read each event's description, since many are for professionals.
  - Call 610-747-0311 to ask whether an event is open to the public.
