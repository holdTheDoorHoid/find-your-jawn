summary: A special services district that works mostly with businesses and property owners along City
  Avenue in Philadelphia and Lower Merion. It also runs community events such as block parties, food trucks,
  and a movie night, and it is a Registered Community Organization (RCO) that developers consult about
  nearby zoning and building plans.
what_you_do: Attend district events, from networking happy hours to community events like block parties
  and movie nights. Anyone who lives, works, or does business in the district can propose an event by
  contacting the office.
