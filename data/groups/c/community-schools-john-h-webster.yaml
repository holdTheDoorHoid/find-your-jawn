  newcomer_friendliness: 2
  basis: A first shift needs several school and state clearances, so the way in is paperwork first. The
    school's own site describes no volunteer route.
  what_to_expect: Volunteers must finish the clearances before their first shift, so the first step is
    paperwork rather than a visit. The listing does not say how long a shift lasts.
  first_visit_tips:
  - Start the clearances early, since they must be finished before any shift.
  - Ask the Community Schools office which opening is current before you sign up.
