summary: A shared neighborhood garden on Chester Avenue, run by its gardeners. Gardeners work together
  on monthly work days and on volunteer teams for compost, herbs, mowing, orchard, flowers and more. Neighbors
  can email the garden to ask about joining.
what_you_do: Come to the monthly work day, usually a Saturday morning, to help with tasks that benefit
  the whole garden. The site also lists volunteer teams with named members, such as compost, herbs, lawn
  mowing, orchard and CSA pickups.
