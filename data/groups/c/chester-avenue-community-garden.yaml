first_step:
  how: Come to a work day on the third Saturday of the month, and email chester.ave.garden@gmail.com to
    ask about joining.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: Work days are posted with set times, but the site only invites gardeners to come help. It does
    not say whether non-gardeners can join a work day or how to become a gardener.
  what_to_expect: A work day runs about three hours in the morning. Teams work on shared tasks such as
    compost, herbs, mowing, shoveling and pest care, and the site asks gardeners to help with tasks that
    serve the whole garden.
  first_visit_tips:
  - Check the site's 2026 work day list for the coordinator who leads that month.
  - On very hot days the work day starts at 8 am and ends at 11 am.
  - Hours are logged in a shared Google Sheet linked from the volunteer hours page.
