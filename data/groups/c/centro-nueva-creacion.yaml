  what_to_expect: The after school program runs 3 to 6 pm on weekdays, September through June, and serves
    more than 50 elementary students a year. Each afternoon has a healthy snack, 15 minutes of play, about
    45 minutes of homework help or tutoring, and about 45 minutes of arts projects with teaching artists.
    The arts projects use poetry, photography, drumming, and dance to explore family traditions and Latino
    culture. The site does not list a current fee.
