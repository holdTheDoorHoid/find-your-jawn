summary: A nonprofit founded in 1995 in the Fairhill area. It runs an after school program for elementary
  students, a summer camp, and arts and photography projects rooted in Latino culture.
what_you_do: Elementary students join the weekday after school program for a snack, homework help, and
  arts projects, or take part in the summer camp or the Goodlands photography project. The summer camp
  includes breakfast and lunch, swimming, and weekly field trips, and ends with a public show of student
  work. Families call or email to ask about enrollment.
