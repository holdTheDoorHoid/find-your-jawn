summary: A Philadelphia nonprofit that makes Spanish-language radio, TV and online programs about gender
  equality and violence against Latinas. Its Centro also runs workshops, group talks and women's circles,
  and lists remote counseling.
what_you_do: Watch or listen to its Spanish-language programs, follow its news and social channels, or
  use the contact form to ask about a project or about becoming an ally. Its Centro page mentions workshops,
  courses and women's circles, but gives no dates or sign-up steps.
