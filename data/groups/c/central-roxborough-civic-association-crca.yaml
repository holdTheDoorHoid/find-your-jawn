first_step:
  how: Attend the next monthly meeting on Thursday, November 5, 2026, at 7:30 pm (doors open 7 pm), in
    Wolcoff Auditorium at Roxborough Memorial Hospital.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Monthly meetings invite neighbors to join, and the group publishes a mailing list and a contact
    address. The site does not use the words newcomer or beginner.
  what_to_expect: A meeting opens with approval of the last meeting's minutes, then works through the
    agenda. The November 2026 agenda includes two zoning appeals. Visitors can follow the discussion and
    bring feedback on land use, zoning, safety, and sustainability, and detailed minutes are posted afterward.
    The site does not say a fee is needed to attend.
  first_visit_tips:
  - Arrive by 7 pm, when doors open, to find your seat before the 7:30 start.
  - Enter off Rector Street, to the left of the emergency entrance, or from Jamestown Street.
  - Read the minutes and the agenda on the site before you come.
  - Most meetings are on Zoom and the site does not print a link, so email the group before a Zoom meeting.
