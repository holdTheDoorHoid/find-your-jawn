summary: Central Roxborough Civic Association (CRCA) is one of the community organizations registered
  with the City to review nearby zoning and building proposals in the Lower Northwest part of the city.
  Neighbors can follow what is planned and speak up.
what_you_do: Neighbors come together to review nearby building and zoning proposals and share the group's
  view with the City and developers.
