schedule:
  text: Shabbat morning services begin at 9 am, after a parsha class at 8:30 am. Moms & Tots runs every
    Shabbos and Yom Tov morning, and children's groups meet on select Shabbos mornings. Weekday morning
    minyanim are around 6:20 to 6:45 am, and Mincha and Maariv are in the evening. The site posted these
    times for a September week, so confirm before you go.
