summary: A Northeast Philadelphia synagogue with daily prayer services, weekly Torah classes, and youth
  groups on Shabbat. The site has a page for visitors who want to spend a Shabbos there.
what_you_do: Pray at Shabbat or weekday services, attend a Torah class, bring young children to Moms &
  Tots on Shabbos and Yom Tov mornings, or bring older children to the Shabbos morning groups. You can
  also sponsor a kiddush or Shalosh Seudos meal, or fill in the online membership form.
