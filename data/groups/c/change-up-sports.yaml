summary: A free softball and baseball group that runs clinics, camps, leagues and training for young people
  and adults. Its Philadelphia programs run through rec centers and community groups, and it also runs
  programs in Sierra Leone and Belize.
what_you_do: Players can join free youth and adult clinics, camps and leagues, including an entry-level
  program with local partners. Coaches, community members and youth workers can take free CPR, first aid
  and lifesaving training. Supporters can donate equipment, host a drive or join a service trip abroad.
