summary: Cathedral Park Community Development Association works on affordable housing and neighborhood
  improvement in West Philadelphia. It is also a Registered Community Organization (RCO), a group the
  City asks developers to consult about nearby zoning and building plans, so neighbors can have a say
  through it.
what_you_do: Neighbors review nearby building and zoning proposals and share the group's view with the
  City and developers. The website also shares information on affordable homes and mortgages.
