summary: A community association for the Cedar Park neighborhood of West Philadelphia, open to households
  and businesses there. It holds public community meetings, runs committees such as parks and holiday
  baskets, and sends a weekly newsletter.
what_you_do: Members can vote in board elections and join a committee such as parks or transit. Board
  meetings are open to members, and the public part runs from 7 to 7:30 pm.
