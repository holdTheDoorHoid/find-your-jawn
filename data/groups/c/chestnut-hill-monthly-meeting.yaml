schedule:
  text: Sunday worship from 10:30 to 11:45 am in the meetinghouse or on Zoom, with Sunday School from
    10:45 to 11:30 am. Hymn singing runs from 9:30 to 10:30 am on the third to fifth Sundays. Midweek
    worship is on Zoom on Tuesdays from 9 to 10 am, and Spanish language worship is on Zoom on Mondays
    from 6:30 to 7:30 pm. Adult classes meet on most first and second Sundays from 9 to 10:15 am, September
    through June.
