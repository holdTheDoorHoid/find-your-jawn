  newcomer_friendliness: 4
  basis: 'The site invites anyone to join and says how to start: come to Sunday worship or email for the
    Zoom link. It has no separate new visitor page.'
  what_to_expect: Sunday worship runs from 10:30 to 11:45 am, including announcements, in the meetinghouse
    or on Zoom. Children start in worship, then leave for their classes at 10:45 am and come back around
    11:30, so parents can stay for the whole time. Year-round nursery care is offered for the youngest
    children, and after worship families can share food in the social room. No fee is listed, and giving
    is by donation.
  first_visit_tips:
  - Park in the lot beside the meetinghouse on East Mermaid Lane.
  - On some Sundays there is outdoor worship from 9 to 10 am, so bring your own chair.
  - The Wyndmoor station on SEPTA's Chestnut Hill East line is about a 10 minute walk from the meetinghouse.
