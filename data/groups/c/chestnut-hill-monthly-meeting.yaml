summary: A Quaker meeting in Chestnut Hill with Sunday worship in its meetinghouse and on Zoom, a Sunday
  School, hymn singing, and adult classes. The site invites anyone to join.
what_you_do: Join Sunday worship at 10:30 am, a hymn sing on the third, fourth, and fifth Sundays at 9:30
  am, or an adult class on most first and second Sundays from September to May. Children join Sunday School
  at 10:45 am. Email the worship contact to get the Zoom link.
