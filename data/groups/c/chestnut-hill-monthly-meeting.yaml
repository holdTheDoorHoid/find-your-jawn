summary: A Quaker meeting in Chestnut Hill with Sunday worship in its meetinghouse and on Zoom, a Sunday
  School, hymn singing, and adult classes. The site invites anyone to join.
what_you_do: Join Sunday worship from 10:30 to 11:45 am, a hymn sing on the third, fourth, and fifth Sundays
  at 9:30 am, or an adult class on most first and second Sundays from September through June. Children
  start in worship, then go to Sunday School at 10:45 am. To get the Zoom link, email the worship contact.
