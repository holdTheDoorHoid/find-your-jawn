first_step:
  how: Come to Sunday worship at 11 am at 1501 Cherry Street, or join on Zoom by asking the office for
    the link.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: 'The site has a page written for visitors, invites newcomers to worship and community life whether
    or not they are members, and says how to start: come on a Sunday or join by Zoom.'
  what_to_expect: Worship lasts about an hour and is held in silence, with no planned hymns or sermon.
    Anyone may stand to speak if moved to, and visitors are not asked to. Afterward there is a social
    time with refreshments.
  first_visit_tips:
  - Plan on about an hour for worship, then stay for refreshments and conversation.
  - Zoom is an option if you would rather join from home; ask the office for the link.
  - Call 215-241-7260 or email office@cpmm.org about parking, entrances or accessibility, which the site
    does not cover.
  - Ask the office about children's classes before you bring children, since the site's dates are mixed.
