summary: A Quaker meeting that worships on Sunday mornings in the meetinghouse at Friends Center in Center
  City, in person or on Zoom. It offers children's religious education and toddler childcare during the
  school year.
what_you_do: Join Sunday worship at 11 am, or ask about youth religious education and childcare for toddlers.
  The site invites visitors and newcomers to worship whether or not they are members, and it lists committees
  on peace and social concerns, pastoral care, and community life.
