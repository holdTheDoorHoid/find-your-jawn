summary: A Quaker meeting that worships on Sunday mornings in the meetinghouse at Friends Center in Center
  City, in person or on Zoom. It offers childcare for young children and religious education for school-age
  children.
what_you_do: Join Sunday worship at 11 am, stay for the social time afterward, or ask the office about
  children's religious education and childcare. The site also lists committees on peace and social concerns,
  pastoral care, and community life.
