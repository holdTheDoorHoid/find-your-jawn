first_step:
  how: Use the district volunteer sign-up linked from the school site, or call (215) 400-7030 to ask the
    Community School Coordinator about the next grocery or pantry shift.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: The school invites families to volunteer and links to the district form, but the volunteer listing
    asks for clearances and a city release before a first shift, so the way in takes paperwork.
  what_to_expect: The school site invites families to volunteer and links to the district's sign-up page.
    The volunteer listing asks for district and state clearances and a city release form, so plan for
    paperwork before a first shift. Shifts cover weekly groceries, the on-site food pantry, and school
    events, and neither source gives shift length.
  first_visit_tips:
  - Ask the school which clearances you need before the first shift.
  - Call the school to ask where to check in on your first day.
