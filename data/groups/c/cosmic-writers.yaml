first_step:
  how: Reserve a virtual slot for Friday Night Writes with the sign-up form on the Cosmic Writers site
    when the program is running, or go in person to Gutmann College House, 211 S. 40th St. Coaching sign-ups
    are closed for fall 2026 and reopen in January 2027.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Friday Night Writes is a public drop-in with a simple slot reservation for virtual visits. The
    page does not describe a welcome for first timers. Coaching is closed until the new term.
  what_to_expect: Friday Night Writes runs from 4 to 6 pm on Fridays during the fall. You can get feedback
    on your writing, including college essays and entries for the Scholastic Art and Writing Awards. Visits
    happen online or in person at Gutmann College House, and the page does not give a price.
  first_visit_tips:
  - Reserve a virtual slot ahead of time with the form on the site.
  - Bring a piece of writing you want feedback on.
  - You can drop in on Friday Night Writes even if you already work with a Cosmic Coach.
