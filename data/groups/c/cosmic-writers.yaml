summary: A nonprofit that uses writing to help children become creative and critical thinkers. It offers
  free one-on-one coaching for young writers, a drop-in writing night, and classroom help for teachers.
what_you_do: Young writers can get free one-on-one coaching (matched to a coach who knows their genre,
  with sign-ups reopening in January 2027), or drop in on Friday Night Writes (Fridays 4 to 6 pm, online
  or in person at Gutmann College House). Families can also buy a writing activity book for $9.95 and
  try it at home.
