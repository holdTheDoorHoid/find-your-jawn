schedule:
  text: Monthly Friday evening Kabbalat Shabbat with a community dinner before, a monthly Shabbat morning
    service, and a monthly Rosh Chodesh gathering for women. Shamanu Sessions meet online each week for
    members. Exact dates and times are on the event calendar.
