  newcomer_friendliness: 3
  basis: Events and a join form are listed publicly, but the site does not say whether guests may attend
    before joining, and membership is described as including access to programs.
  what_to_expect: Friday services are monthly and include a community dinner before and a community social
    hour (oneg) after, led by the rabbi and one other spiritual leader. The site does not say how long
    a service runs, what to wear, or whether guests pay anything.
  first_visit_tips:
  - Ask the office whether a guest can come to a Friday service before you join.
  - Most programs also run on Zoom, so ask about joining online if that is easier.
