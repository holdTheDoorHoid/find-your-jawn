summary: A small Reconstructionist congregation that meets mostly at the Ethical Society building near
  Rittenhouse Square. Members take part in worship, holiday events, adult classes, social justice work,
  and the choir.
what_you_do: Join Friday services and holiday events, take part in adult education (mostly on Zoom), sing
  in the Kol Ha'Leyv choir, or join a social justice project. The congregation says it has affordable
  dues options.
