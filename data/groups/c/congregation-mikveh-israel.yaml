schedule:
  text: 'Weekday Shacharit at 7:15 am on Mondays, Thursdays, and Rosh Chodesh, and Minha at 2 pm Monday
    to Thursday. Shabbat services are weekly, so check the site for the current Friday evening and Saturday
    morning times. Also weekly: a Thursday 7:30 pm Zoom class and a Monday 4 to 5 pm after-school class
    for children ages 5 to 12.'
