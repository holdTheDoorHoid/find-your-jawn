summary: A historic congregation at 44 North Fourth Street. It offers weekday morning and afternoon prayer
  services with a free breakfast or lunch, Shabbat services, public tours, and a museum exhibit.
what_you_do: Join the weekday morning Shacharit or the afternoon Minha minyan, book the historic synagogue
  tour, see the Faith and Freedom exhibition, join the Thursday evening Zoom class, or sign a child up
  for the Monday after-school class.
