first_step:
  how: Come to the 7:15 am weekday minyan on a Monday or Thursday, where breakfast is free afterward,
    or call the office at 215-922-5446 to book a public tour.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The Rabbis' Welcome page invites visitors to come in person to Shabbat, a daily minyan, or the
    exhibits, and the site lists how to book a tour and how to join the WhatsApp group for the minyan.
  what_to_expect: Services follow the congregation's Spanish-Portuguese tradition, which the site describes
    as formal and orderly, with careful Hebrew pronunciation. Members often attend the morning service
    so there is a minyan for those saying Kaddish, and free breakfast or lunch follows the weekday minyanim.
    The site does not say how long services run or what to wear.
  first_visit_tips:
  - Call or email the office first, since it is open Monday to Thursday 9 am to 5 pm and Friday 9 am to
    3 pm.
  - Parking is free with the weekday minyanim.
  - Arrive a few minutes before 7:15 am for the morning minyan.
