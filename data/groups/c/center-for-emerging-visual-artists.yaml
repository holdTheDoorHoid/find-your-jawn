summary: A Philadelphia nonprofit, founded in 1983, that supports emerging visual artists through a fellowship,
  citywide exhibitions, and community outreach. It also runs the Philadelphia Open Studio Tours, where
  visitors see artists' studios.
what_you_do: Tour artists' studios on the Philadelphia Open Studio Tours, or volunteer for the tours.
  You can also see the exhibitions, go to events such as the ART PARTY and auction, or join as an artist
  member. The site lists outreach to older adults and a Hand-in-Hand community program.
