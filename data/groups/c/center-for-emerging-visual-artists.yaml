first_step:
  how: Pick studios on the online POST map and visit on a tour weekend in October, noon to 6 pm, free
    and self-guided.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The tours are free and self-guided, visitors may bring friends or family, and the site lists
    several public ways in, including a mailing list, tours, volunteer shifts and memberships.
  what_to_expect: Visitors choose their own route and move from studio to studio. The 2026 tours run October
    10 and 11 west of Broad Street and October 17 and 18 east of Broad Street. Some stops also have exhibitions,
    demos, workshops, talks or receptions.
  first_visit_tips:
  - Use the online map to plan a route that keeps your stops close together
  - The page also lists a printed tour directory at participating studios and Free Library branches
  - You can go with friends, family, students or colleagues
