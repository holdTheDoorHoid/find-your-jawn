first_step:
  how: Choose your child's program on the club's Registration page and fill out the form. A confirmation
    email follows. In-house programs start at age 3.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Registration is open online and in-house programs take young children, but the site does not
    give practice times, tryout rules, or a welcome page for new families.
  what_to_expect: Kids play in-house or on travel teams at home sites and other fields across the city.
    Practice days and times are not published, so ask the club when the first practice is. Fees vary by
    program, and the fee page does not say which year it covers.
  first_visit_tips:
  - 'Read the Code of Conduct before you register: it sets sportsmanship rules for parents at games.'
  - Ask the club when practices start, since the site does not post them.
  - Ask how travel team tryouts or evaluations work, because the site does not explain them.
  - Check which year the fee page covers with the club before you pay.
