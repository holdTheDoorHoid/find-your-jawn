cost:
  level: paid
  text: In-house programs are $90 or $110. Travel teams are $165 or $185. Tackle football and competition
    cheer are $210 or $230. A girls AAU volleyball listing shows an $800 flat fee. Online registration
    adds a $5 to $7 fee. The fee page does not say which year it covers.
