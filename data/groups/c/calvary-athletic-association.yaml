summary: A Northeast Philadelphia youth sports association with in-house and travel teams in baseball,
  softball, basketball, football, cheer, volleyball, and lacrosse. Young kids can start in in-house programs
  at age 3.
what_you_do: Kids play on in-house or travel teams. Families can also volunteer for board seats or the
  parents' clubs; the board positions are voluntary.
