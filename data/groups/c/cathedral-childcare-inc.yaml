summary: The cathedral of the Episcopal Diocese of Pennsylvania in Center City. It holds a Sunday 10 am
  service and noonday services on Wednesdays and Fridays, and it has a newcomers form and a survey to
  help people find a ministry.
what_you_do: Come to Sunday Eucharist at 10 am or a noon Eucharist on a Wednesday or Friday, fill out
  the newcomers form, or take the survey to find a ministry. Volunteers can also help with the food pantry
  and other Cathedral Table Ministries.
