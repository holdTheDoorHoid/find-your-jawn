first_step:
  how: Attend the 10 am Sunday Holy Eucharist, or fill out the newcomers form linked on the site.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The site invites newcomers to fill out a newcomers form, has a ministry survey to help people
    find a place to serve, and says everyone is welcome at coffee hour.
  what_to_expect: The Sunday service is a Holy Eucharist at 10 am that follows an ancient order of worship.
    The music for each Sunday is listed on the site, and a service leaflet is available as a download.
    The site does not give the length of the service, and coffee hour and adult formation follow.
  first_visit_tips:
  - Download the service leaflet from the site before you come.
  - On Sundays, street parking near the Cathedral needs a permit from the ushers or the printable link
    on the site. The LAZ lot at 39th and Market is not available for worship.
  - If you take transit, ride the Blue Line to 40th Street and walk to 38th Street.
  - Stay for coffee hour after the 10 am service.
