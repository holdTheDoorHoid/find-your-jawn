first_step:
  how: Email Madeline Cerulli at Madeline.Cerulli@phila.gov to ask about open shifts, then start the clearance
    checks before your first shift.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Volunteers must finish background clearances and have the principal certify their code of conduct
    before they start, so you cannot just show up. The contact route is clear, so the way in is at least
    open.
  what_to_expect: 'Expect paperwork first: the clearance checks, a short orientation (about 45 minutes,
    online or in person), and a signed code of conduct that the principal certifies. The listing says
    volunteers help with groceries, the gaming room, and special events, but it does not say how long
    a shift lasts.'
  first_visit_tips:
  - Ask the school's Family Engagement Liaison for the Volunteer Checklist, since the district says the
    liaison helps with the forms.
  - The child abuse and state criminal checks are free, and the child abuse result arrives by email within
    14 days, so start early.
  - If you have not lived in Pennsylvania for the past 10 years, book a fingerprint check through IdentoGo
    first ($23.25, and you must pre-enroll).
