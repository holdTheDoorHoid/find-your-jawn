first_step:
  how: Contact the school's Community Schools office at (215) 834-6277, or email the address on the City
    listing, to ask how to start the clearances before you can volunteer.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: A volunteer must get several state and federal clearances before helping, so a first visit is
    paperwork rather than a walk-in.
  what_to_expect: 'Before you can help inside the building, expect paperwork: the City listing asks volunteers
    for a school district code of conduct and certificate, state and federal background checks, and a
    City release waiver. Once cleared, volunteers help hand out weekly groceries, keep the in-school pantry
    going, help at school events, or mentor students. Hours and any fee are not in the record we hold.'
  first_visit_tips:
  - Start the clearances early, since you need them before you can volunteer.
  - Ask the coordinator which role fits your schedule before you fill in the forms.
  - The school is at 5000 Oxford Avenue in the Frankford neighborhood, so check your route before you
    go.
  - Check the City volunteer listing for the full list of forms before you start.
