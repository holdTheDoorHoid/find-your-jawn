summary: A shelter and support program for adults experiencing homelessness, with case management, life-skills
  help and transitional housing. Anyone can volunteer through a form on its site, and the group runs public
  events such as Hoops4Hope games and a Hope Shop opening.
what_you_do: Volunteer through the Get Involved form, donate, or check the site for games and openings.
  Shelter stays are for single adults referred through the City, according to the UAC partner page.
