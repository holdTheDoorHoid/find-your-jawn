summary: A senior center on Germantown Avenue with classes, exercise and health programs, meals, and an
  ombudsman program that visits care homes. Volunteers have helped with office work, environmental projects,
  and that ombudsman program.
what_you_do: Join exercise or art classes, card games, line dancing, or meals. Volunteers can help in
  the office, with environmental projects, or as ombudsman volunteers after training.
