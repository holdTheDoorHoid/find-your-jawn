first_step:
  how: Browse the online viewing library and the blog, then join with the Become a Member link to get
    the monthly feature and members' viewings. Public in-person screenings are listed on the Events page,
    so check there for a date to attend.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Anyone can see the membership sign up link, and public screenings are listed on the Events page.
    The page does not say whether non-members can watch the library.
  what_to_expect: Most of the group's work happens online. Members watch a monthly feature and members'
    viewings on the group's online viewing platform, and each viewing usually runs about a month. Public
    events include in-person screenings in Philadelphia and artist talks, with dates and years on the
    Events page. The page does not say how long talks last or whether they are free.
  first_visit_tips:
  - Check the Events page for in-person screenings in Philadelphia before you plan a visit, since dates
    change.
  - Send questions to the director using the contact page.
