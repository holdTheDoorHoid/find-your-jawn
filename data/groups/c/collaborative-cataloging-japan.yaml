summary: A nonprofit that preserves and shares Japanese experimental film and video. It runs an online
  viewing library, publishes essays and books, holds exhibitions, and hosts artist talks.
what_you_do: Watch works in the online viewing library, join the members' viewings and the monthly feature,
  or attend a public screening or talk when one is scheduled. The site does not mention classes, workshops
  or volunteer jobs.
