summary: A coalition of Greater Philadelphia medical schools that works to bring more people from diverse
  backgrounds into medicine. It runs a yearly equity summit, a pre-med pathway for college sophomores,
  and a mentorship network.
what_you_do: Register for the yearly summit, or apply to the PADMed pathway if you are a college sophomore
  at a Greater Philadelphia university. PADMed asks for a 3.2 GPA or higher and a grade of B minus or
  better in core science courses. Scholars also get access to the mentorship network.
