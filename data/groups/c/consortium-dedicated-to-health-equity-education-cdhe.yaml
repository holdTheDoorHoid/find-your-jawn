first_step:
  how: Register for the summit through the events page, or, if you are a college sophomore, use the Apply
    Today button on the PADMed page.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The summit is open to anyone who registers. PADMed needs an application and grade requirements,
    so it is not an open door.
  what_to_expect: A summit visit is a full day, 8 am to 4 pm, with a keynote, interactive workshops such
    as restorative practices and cultural humility, and a poster competition. The site does not say what
    the summit costs. PADMed scholars meet an advisor each semester and attend monthly programming.
  first_visit_tips:
  - Read the full agenda before you register so you can pick the workshops you want.
  - Email programs@philacdhe.org with PADMed questions before you apply.
