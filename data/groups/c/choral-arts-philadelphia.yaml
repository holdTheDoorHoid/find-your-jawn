first_step:
  how: Email the group at the address under Audition Announcement on the Auditions page, with your voice
    part and singing experience. To see the choir first, buy a ticket to a 2026 to 27 concert from the
    season page.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Joining means emailing to request an audition, and the page says most volunteer singers have
    music training or college singing. Concerts are open to ticket buyers.
  what_to_expect: A first visit is a concert at one of three churches near Rittenhouse Square, with start
    times of 4 pm or 5 pm. You buy tickets online for one show or a subscription. The auditions page does
    not describe what an audition involves, so ask by email before you apply.
  first_visit_tips:
  - Check the start time on each concert, since the holiday concert starts at 5 pm.
  - A subscription lets you pick three to five concerts, and subscribers get seats held for New Year's
    Eve and Carols by Candlelight.
