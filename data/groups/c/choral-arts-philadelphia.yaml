summary: A choir that has sung in Philadelphia since 1982, with most singers volunteers. It gives a season
  of concerts from October to May, mostly in Rittenhouse Square churches, with holiday programs such as
  Carols by Candlelight.
what_you_do: Sing in the choir after an audition, usher or greet at concerts, help with events or office
  work, or attend a concert. Volunteers can also help through the group's Volunteer page.
