first_step:
  how: Join the shop's free Discord server, open its Events tab, and click the green check box on a D&D
    session to save your seat.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The events page lists a D&D 101 beginner session and one-shot games, and the sign-up guide explains
    how to get a seat, so newcomers have a clear way in.
  what_to_expect: Each D&D session runs from 12:30 to 3 pm on Sunday, so a visit is about two and a half
    hours. Sessions include a D&D 101 beginner session and one-shot games, so you can play a single game
    without joining a longer campaign. The page does not list a price for D&D, so ask staff when you sign
    up.
  first_visit_tips:
  - Sign up for a seat ahead of time on the shop's Discord, since the page asks players to do this so
    games have enough people.
  - To give up a seat, remove your green check box and message the staff on Discord so someone else can
    take it.
  - If Discord is a problem, call (215) 305-9230 or stop by the shop for help.
  - The store is open 11 am to 9 pm on Sundays.
