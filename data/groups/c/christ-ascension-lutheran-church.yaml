access:
  wheelchair: partial
  languages: []
  notes: The sanctuary is not fully wheelchair accessible. Kimes Hall, the parish hall, is fully accessible.
    The small lot holds about 10 cars, and there is a driveway between the sanctuary and Kimes Hall. Free
    street parking is on Southampton and in front of Jenks School on Germantown, but only when school
    is not in session. A pay lot is up Germantown.
