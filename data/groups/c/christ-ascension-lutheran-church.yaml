first_step:
  how: Come to the 9:30 am Sunday service in the sanctuary to the left of the driveway, or call the office
    on a weekday morning first.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The site says all are welcome, explains what a first visit is like, and says fellowship follows
    worship. It has no separate newcomer program.
  what_to_expect: Sunday worship starts at 9:30 am with Holy Communion, piano and organ music, and an
    adult choir during the program year. Visitors can join in as much or as little as they like, and the
    site suggests arriving between 30 minutes early and just before the start. Fellowship with conversation
    and snacks follows, and it is fine to leave early.
  first_visit_tips:
  - The lot holds about 10 cars, so plan for street parking or the pay lot up Germantown.
  - Communion is open to all Christians, and gluten-free bread and grape juice are offered.
  - Keep your phone on silent, and ask permission before taking photos.
  - Ushers can give you a children's bulletin, and there is a quiet space with toys and books for young
    children.
