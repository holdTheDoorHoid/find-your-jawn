summary: A member-run rowing club on the Schuylkill River at Boathouse Row. Adults join through member
  sponsorship and can row at any level, and young people can take part in summer and junior rowing programs.
what_you_do: Members row the club's boats on the river at any level, from novice to masters. The club
  also runs youth summer and junior rowing programs. The riverfront path in front of the boathouses is
  public and free year round.
