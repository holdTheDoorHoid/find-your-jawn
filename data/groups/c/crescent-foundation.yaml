summary: A member-run rowing club on the Schuylkill River at Boathouse Row. Adults can join and row at
  any level, and young people can take part in summer and junior rowing programs.
what_you_do: Members row the club's boats on the river, from a first outing up to masters racing. The
  club also runs junior and summer rowing programs. Anyone can walk the public riverfront path, which
  is open year round.
