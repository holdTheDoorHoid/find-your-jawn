first_step:
  how: Send the membership inquiry form on crescentboatclub.org, or apply to a summer youth program through
    RegattaCentral. Questions go to board@crescentboatclub.org.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Adult membership needs two member sponsors and annual dues before a first row. The youth Novice
    program is written for people who have never rowed, but it also needs an application and a fee.
  what_to_expect: Adult members can row at any level, but coaching is not part of membership, so people
    who have never rowed arrange their own coaching, and several members coach privately. Summer youth
    programs include a Novice program that teaches boat handling and crew rowing, and parents attend an
    organizational meeting. The page does not describe a first outing for adults.
  first_visit_tips:
  - Read the By-laws, Rules and Safety page before your first practice, since the club requires athletes
    and parents to read it.
  - Racing uniforms are not included in the development and junior programs, so plan for that cost.
  - Walk the public riverfront path in front of the boathouses to see the setting before you apply.
  - Contact board@crescentboatclub.org before you pay if you are not sure which summer program fits.
