first_step:
  how: Email the school's community program contact to ask which volunteer roles are open, then start
    the clearance paperwork.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Volunteers must finish background clearances before starting, so the first step is paperwork
    rather than an open door.
  what_to_expect: 'Before a first shift you will need several checks: state child abuse history and criminal
    background clearances, an FBI waiver or fingerprinting, a school district code of conduct and certificate,
    and a city release form. Some roles also ask for an orientation. The volunteer listing does not give
    a shift length or a cost.'
  first_visit_tips:
  - Start the clearance paperwork early, since the listing requires it before volunteering.
  - Ask the school contact which roles need an orientation and when the first shift can start.
