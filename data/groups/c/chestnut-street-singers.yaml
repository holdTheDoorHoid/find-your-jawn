first_step:
  how: Submit the audition application form on the group's Auditions page, or email auditions@chestnutstreetsingers.org
    to ask when the next audition window opens. To hear the choir first, look for the November 14, 2026
    concert at 7 pm at the Church of the Holy Trinity; the page does not say how tickets are sold.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Joining needs an application form and a short audition, and the page says not every applicant
    is auditioned, so the way in is selective.
  what_to_expect: An audition lasts about 20 minutes. You sing scales to show your range, sing a short
    excerpt from a set piece with ensemble members, sight-read a passage, and talk briefly about why you
    want to join. Rehearsals then run Monday evenings for two hours at the school, with two concerts each
    season.
  first_visit_tips:
  - Learn measures 1 to 19 of the set excerpt from the score linked on the audition page before you go.
  - Rehearsals are Monday evenings, 7 to 9 pm, at the school at 1212 S 47th St.
  - You may miss no more than two rehearsals in a cycle, so check the dates before you apply.
