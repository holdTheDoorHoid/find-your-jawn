summary: A cooperative chamber choir that sings a wide range of music, from Renaissance works to new pieces.
  Singers are unpaid volunteers who audition, rehearse on Monday evenings, and perform two concerts a
  season.
what_you_do: Audition to join the choir, then rehearse and sing in the two concerts each season. Singers
  also help run the group, and the page lists roles such as receptions, graphics, and marketing for members.
