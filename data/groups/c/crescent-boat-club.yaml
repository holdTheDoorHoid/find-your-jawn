summary: A member-run rowing club at 5 Kelly Drive on Boathouse Row, founded in 1867, that welcomes people
  with no rowing experience and offers summer coaching at every level.
what_you_do: Newcomers can start with an inquiry and take summer coaching from novice to sculling development.
  The club also has junior, under-23 and masters crews. Youth rowers apply through RegattaCentral.
