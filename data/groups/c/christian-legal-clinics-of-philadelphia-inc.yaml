summary: Volunteer lawyers give free first consultations and legal help on housing, child custody, domestic
  abuse, wills, estates, and clearing criminal records, at clinics across the region. The group is a Christian
  legal ministry, and its clinics also have volunteers who offer prayer and chaplain support.
what_you_do: Get legal help by calling 215-399-0064 or filling out the consultation form, and the clinic
  calls you back. Lawyers can volunteer at a clinic once a month for three to four hours, and non-lawyers
  can help with prayer, hospitality or chaplain work.
