first_step:
  how: Call 215-399-0064 and choose the clinic nearest you, or fill out the Schedule a Consultation form
    on the site and describe your legal problem.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Anyone can ask for a consultation by phone or online, and the first one is free. The page does
    not say who qualifies, and it reports a wait of one to three months.
  what_to_expect: After you send the form, the clinic says it will call you. The site does not say how
    long that call takes or whether the first meeting is in person. The group describes itself as Christian,
    and clinic volunteers include chaplains and people who pray. The clinic reports waits of one to three
    months, and for urgent problems the site suggests other legal aid groups.
  first_visit_tips:
  - If you have a pending case, have your household size, income, and the other side's name and contact
    information ready for the call.
  - Pick the clinic closest to you when you call, since each clinic has its own phone extension.
  - If your problem is urgent, ask about other legal aid groups while you wait; the site suggests this
    itself.
