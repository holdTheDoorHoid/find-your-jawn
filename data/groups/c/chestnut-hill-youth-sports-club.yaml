summary: A community youth sports club that runs travel basketball for grades 4 to 8 and travel soccer,
  with intramural basketball coming soon. Volunteers help with coaching, team management, fundraising,
  field upkeep, and the snack bar.
what_you_do: Players try out for travel basketball. Volunteers can coach, manage teams, maintain fields,
  run the snack bar, or serve on the board. All coaches must submit Pennsylvania clearances, which are
  valid for 5 years.
