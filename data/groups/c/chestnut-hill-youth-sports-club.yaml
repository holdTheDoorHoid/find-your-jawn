first_step:
  how: Sign up on the travel basketball tryout form and attend at least one tryout session for your child's
    age group.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Travel teams are reached through tryouts that need an online sign-up, and intramural basketball
    has no dates yet. A contact list is the only other way in.
  what_to_expect: Tryout sessions are split by age group, with two dates for each group on the tryout
    page, and players must attend at least one session to be considered. The tryout table lists boys'
    age groups for grades 4 to 8. The tryout fee is $10, and the page lists a $400 team fee for a selected
    team, plus uniform fees and a family membership fee if the family is not a member.
  first_visit_tips:
  - Enter at Door B2 at Sister James Anthony Hall, or at Door B3, which is down the hill by the outdoor
    basketball court.
  - Plan for the $10 tryout fee.
  - Coaches need Pennsylvania clearances first. The FBI check costs $22.95 for volunteers if you have
    not lived in Pennsylvania for the last 10 years, and clearances last 5 years.
  - Use the inquiries option on the tryout page to reach the coach with questions.
