summary: Volunteer advocates who build a relationship with one child and speak up for that child's needs
  in court and in the community. Volunteers make a two-year commitment and start with a 30-minute information
  session.
what_you_do: Attend an information session to see whether the role is a good fit, complete the training,
  and then work one child's case. Volunteers commit for two years.
