first_step:
  how: Book the 30 minute information session through the Information Session button on the volunteer
    page, which opens an outside booking page
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Anyone can book the public information session, and the volunteer page says no law or social
    work background is needed. Training and a two year commitment come before any child is matched.
  what_to_expect: The information session lasts 30 minutes and explains what a CASA volunteer does. After
    that comes training, which the site calls extensive, and then a match with one child or sibling group
    for two years. Volunteers get to know the child, gather information and tell the judge what the child
    needs.
  first_visit_tips:
  - Book the information session ahead of time through the link on the volunteer page
  - Think about the two year commitment before you sign up, since the group asks for it
