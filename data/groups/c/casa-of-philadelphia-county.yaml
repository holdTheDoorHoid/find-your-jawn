summary: A volunteer advocate program for children in foster care. Trained volunteers get to know one
  child or sibling group and report to the Family Court judge about what the child needs.
what_you_do: Volunteers listen to the child, talk with foster parents, parents, teachers and doctors,
  review records, and write recommendations for the judge. The group asks for a two year commitment and
  an information session first.
