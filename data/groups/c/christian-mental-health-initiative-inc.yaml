first_step:
  how: Subscribe to the newsletter on the group's website, or send a question to team@christianmentalhealthinitiative.org
    about a seminar for your church or group.
  drop_in: false
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: Anyone can subscribe to the newsletter or watch the recorded seminars. Trainings are requested
    by a church or group, so the way in for an individual is limited.
  what_to_expect: 'For an individual, most of what the site offers is online: three recorded seminars,
    a resource page of hotlines, finding-help sites and faith-based reading, and a newsletter. Live trainings
    and response team setup are aimed at churches and organizations, which request them by email or the
    contact form.'
  first_visit_tips:
  - If you need help right away, call 988, the Suicide and Crisis Lifeline listed on the resources page.
  - The resources page also lists the Crisis Text Line for people who prefer texting.
