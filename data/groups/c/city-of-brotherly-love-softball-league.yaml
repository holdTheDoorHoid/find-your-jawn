  how: Register for the current season on the league's registration page, or email join@cblsl.org to ask
    which division fits you.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The league says all skill levels are welcome, from beginners to advanced players, and it runs
    new player clinics, though the site gives no clinic dates. You can register online or email to ask
    how to start.
  what_to_expect: You sign up for a season, pay a player fee of about $65, and get placed on a team in
    a division that fits your skill level. The fee covers league play, field upkeep, and umpires, and
    jerseys cost extra. The site does not describe what a first game or practice is like, so ask the league
    before your first game.
  first_visit_tips:
  - Ask join@cblsl.org which division fits your skill level before you register.
  - Plan to buy your own jersey, which costs extra and is set by your team manager.
  - Fall Ball games are at FDR Park, entered from Pattison Avenue just west of Broad Street.
