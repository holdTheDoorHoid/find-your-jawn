summary: A slow pitch softball league for LGBTQIA+ players and their allies. Divisions run from recreational
  to competitive, and the league offers new player clinics and social events.
what_you_do: Register for a season, get placed in a division that matches your skill level, and join a
  team. Each team has its own manager, and jerseys cost extra.
