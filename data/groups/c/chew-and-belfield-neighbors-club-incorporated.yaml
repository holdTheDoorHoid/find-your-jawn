  basis: Services are free and the site invites people to get in touch about upcoming events, but it does
    not say whether monthly meetings are open to non-members.
  what_to_expect: Monthly meetings are at 6 pm on the last Wednesday in the Wissahickon Charter School
    gymnasium. Cleanups happen about every other Wednesday, and tutoring runs October through April for
    students aged 7 to 99. Membership is $12 a year for the household, and the services are free.
  first_visit_tips:
  - Call the club to confirm the date of the next meeting or cleanup before you come
  - Ask about access when you call, since the site does not describe it
  - Have $12 ready if you decide to join as a member
