summary: Chew and Belfield Neighbors Club is a nonprofit founded in 1981 that runs neighborhood cleanups,
  free tutoring and classes, and job help, and holds a free summer clothing and furniture giveaway.
what_you_do: Neighbors volunteer on cleanups, tree plantings and block work, and can get free tutoring,
  GED help, and job or resume help. The club meets monthly, and membership is $12 a year for the whole
  household.
