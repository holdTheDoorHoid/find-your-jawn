first_step:
  how: Call the school at (215) 400-3350 or email the Community School Coordinator at ijnanya.newman@phila.gov
    to ask which volunteer help is open this season.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The city program page describes the school's work but not how a volunteer signs up, and the required
    clearances must be on file before a first shift.
  what_to_expect: Volunteers support the school's family and student programs and events, working with
    the Community School Coordinator. The city page lists events, resource fairs, family forums, and adult
    classes, but it does not describe what a volunteer shift looks like. Any adult volunteer needs a child
    abuse history clearance and a PA criminal record check on file before starting.
  first_visit_tips:
  - Get your two clearances on file before your first shift.
  - Ask the coordinator which events need help this season, because the city page does not list volunteer
    roles.
  - Call during office hours, 8:30 a.m. to 5 p.m. Monday to Friday, as the city page lists them.
