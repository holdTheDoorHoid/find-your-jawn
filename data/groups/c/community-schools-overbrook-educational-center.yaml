first_step:
  how: Call the school at 215-400-7540 to ask whether it needs volunteers, then start the District's volunteer
    steps from the Volunteer page linked on the school's website.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Volunteers must clear background checks and finish an orientation before they start, so a first
    visit needs approval first. The steps are clearly listed.
  what_to_expect: A first step is paperwork, not a shift. Volunteers complete two state checks and an
    FBI check (a signed affirmation can replace the FBI check if you have lived in Pennsylvania for 10
    years), then a Volunteer Orientation within 45 days of starting, which takes about 45 minutes online
    or in person, and sign a Volunteer Code of Conduct. The District page gives no time commitment or
    required number of hours.
  first_visit_tips:
  - Ask the school whether it needs volunteers before you start the clearance paperwork.
  - If you have not lived in Pennsylvania for the past 10 years, plan for an FBI fingerprint check, which
    costs $23.25.
  - The school day runs 8:15 am to 2:54 pm, so plan any visit around it. The website gives no parking
    or entrance details.
