summary: Volunteers who clean up and care for Cobbs Creek Park. They run registered cleanups by zone,
  hand out plants, and host a yearly summer festival at Whitby Park.
what_you_do: Register for a cleanup through the group's Register link, then meet your zone's ambassador
  at the listed spot. Past cleanups have collected from a few bags up to 71 bags of litter.
