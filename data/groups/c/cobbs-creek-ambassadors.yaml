first_step:
  how: Pick your zone on the Schedule and Map page at cobbscreekparkambassadors.org, register for an upcoming
    cleanup through the Register link, and meet your zone's ambassador at the listed spot. Email CobbsCreekParkAmbassadors@gmail.com
    with questions.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: 'The Schedule and Map page says the group loves new volunteers, and it explains how to start:
    choose a zone, register, and meet the ambassador at the listed spot.'
  what_to_expect: Each cleanup runs about two hours, usually 9 to 11 am on a Saturday or 2 to 4 pm on
    a Sunday, and starts at a meeting spot named by cross streets. Each zone has its own ambassador, and
    the group welcomes new volunteers. The page does not list costs, what to bring, or what the group
    supplies.
  first_visit_tips:
  - Email the zone's ambassador or the group address before you come, since the page does not say what
    to bring or wear.
  - Meeting spots are cross streets, such as Upland Street and Cobbs Creek Parkway for zone 14.
  - The Schedule and Map page links a SEPTA route for each zone, starting from 40th and Spruce.
