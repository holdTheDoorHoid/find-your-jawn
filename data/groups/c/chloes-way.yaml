summary: A community nonprofit that helps families and individuals in hardship with food boxes, clothing,
  and hygiene kits. In the summer it sponsors lunches for local kids and runs a youth enrichment program
  for 4th to 6th graders, and it offers scholarships to high school seniors.
what_you_do: Volunteers can help at food distributions and community events, pack and sort food boxes,
  clothing, and hygiene kits, deliver groceries to older neighbors, and help with summer meals (meal help,
  set-up, and clean-up). Donors can give through the donate page.
