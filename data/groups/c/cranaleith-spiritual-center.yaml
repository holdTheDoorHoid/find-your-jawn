first_step:
  how: Send the volunteer form from the Join Our Team button on the volunteer page, or call or email the
    center to say what kind of help you would like.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The volunteer page welcomes individuals and groups of all ages and skill levels and gives a clear
    form, but it does not describe an orientation or a set schedule.
  what_to_expect: The page lists garden, grounds, bee, greeter, and event jobs, and asks you to say how
    you would like to help. It does not say how long a shift lasts, whether there is an orientation, or
    what to wear, so ask when you make contact.
  first_visit_tips:
  - Tell the center the kind of job you want, such as the garden, the greeter desk, or events.
  - Ask about parking when you call, since the center's site says free onsite parking is offered for its
    conference center.
