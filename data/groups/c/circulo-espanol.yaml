summary: A club for Spaniards and friends of Spain in the Philadelphia area, founded in 1976. Members
  gather for holiday dinners, members' meetings, and Spanish cultural events, and the club says it helps
  newcomers settle into life here.
what_you_do: Join as a member, then come to members' meetings and holiday gatherings. Take part in cultural
  events such as the Spanish flag-raising at City Hall and a ceremony at Sister Cities Park.
