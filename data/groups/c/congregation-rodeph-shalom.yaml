summary: A Center City congregation on North Broad Street with Friday evening and Saturday morning services,
  Saturday Torah study, and a Wednesday morning food and supply distribution called Breaking Bread on
  Broad.
what_you_do: Come to Friday evening or Saturday morning services, or join Saturday Torah study. Newcomers
  can take one of two introductory courses on Judaism. Services are also livestreamed for people who would
  rather watch from home.
