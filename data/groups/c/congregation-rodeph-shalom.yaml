  newcomer_friendliness: 4
  basis: The New to Judaism page lists two beginner courses and names a membership contact for newcomers,
    and the site invites everyone to Friday and Saturday services with no sign-up listed.
  what_to_expect: Friday evening starts with a social gathering at 5:30 pm, followed by a 6 pm service.
    Saturday has Torah study at 9:15 am before the 10:45 am service, and the choir sings at some Friday
    services. The site does not say how long services last or what to wear.
  first_visit_tips:
  - Arrive by 5:30 pm if you want the pre-Shabbat gathering before the 6 pm service.
  - Use the Green Street entrance at 1339 Green St., as the site directs.
  - Watch the livestream first if you would like to see a service before going in person.
  - Office hours are weekdays 8:30 am to 5 pm, if you want to ask questions by phone at 215.627.6747.
