summary: A Tibetan Buddhist center on North Marshall Street with a Sunday sangha that includes silent
  meditation and a dharma talk, in person and on Zoom. It also runs an online Thursday study group.
what_you_do: Join the Sunday sangha, with silent meditation from 9 to 9:45 am and teaching from 10 am,
  in person or online. The site says the sangha is recommended for beginners. The Thursday online study
  group is open to anyone who wants to join at any time.
