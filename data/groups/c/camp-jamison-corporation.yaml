summary: A one-week overnight summer camp for kids 8 to 15 from the Philadelphia area. Campers hike, swim,
  paddle on the lake, play sports, make art, and sit around the campfire.
what_you_do: Campers spend a week at camp each summer. The camp also hires cabin counselors and activity
  specialists, and donors can help fund campers through a memorial scholarship.
