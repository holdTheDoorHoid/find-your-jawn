first_step:
  how: Fill in the online registration form for the summer session, linked from campjamison.org, or join
    the waiting list for updates.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Registration for kids 8 to 15 runs through a public form with a clear link, although the site
    also offers a waiting list, so spots may be limited.
  what_to_expect: Campers stay seven days and six nights at a camp with a lake, campground areas, and
    hiking trails. The site lists canoeing, kayaking, lake swimming, hiking, basketball, GaGa ball, arts
    and crafts, and campfires with s'mores.
  first_visit_tips:
  - 'Bring the listed items: a sleeping bag, a twin fitted sheet, two pairs of sturdy sneakers (one that
    can get wet), and a reusable water bottle.'
  - Leave electronics, toys, snacks, and scented items at home, since the list bans them.
  - Label all belongings, because the camp is not responsible for lost items.
  - Ask for drop-off and pick-up times when you register, since the site does not list them.
