first_step:
  how: Register for an intro workshop from the events page, or email info@calmclarity.org with questions.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Intro workshops have open public registration and the site lays out the steps to start, but the
    site is written for organizations and does not say beginners are welcome.
  what_to_expect: The 90 minute virtual intro workshop introduces the group's brain pattern framework.
    The site aims its training at leaders, managers, and HR or learning staff, so expect a room of working
    professionals. The site lists no price for the workshop.
  first_visit_tips:
  - Listings show Eastern Time, so work out the start time in your own zone before you register.
  - Take the free brain pattern self-assessment first if you want a taste of the material.
