first_step:
  how: Email or call the Community School Coordinator, Undretta Williams, at undretta.williams@phila.gov
    or (267) 438-7945 to ask how to volunteer.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: Neither the school nor the City page says how volunteers sign up, so a newcomer has to make contact
    first.
  what_to_expect: The City page does not describe a volunteer visit, so ask the coordinator what a first
    day looks like and what role is open. The listed activities include school events, resource fairs,
    family forums, parent cafes, and after-school programs. The coordinator's office hours are 8:30 am
    to 5 pm, Monday to Friday.
  first_visit_tips:
  - Ask which clearances or background checks you must finish before a first visit.
  - Call during weekday office hours, 8:30 am to 5 pm.
  - The school is at 6801 Cottage St., Philadelphia, PA 19135.
