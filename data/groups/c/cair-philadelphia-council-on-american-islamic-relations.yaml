first_step:
  how: Sign up for the email or text list on the CAIR Philadelphia website (pa.cair.com/mailing-list/).
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Anyone can sign up for the list on the site, and the events list shows many workshops and talks,
    but the site does not say how to register for each one.
  what_to_expect: The events page lists many dated workshops, trainings, and community talks from 2020
    to 2026, including know your rights sessions. The site does not list costs or registration steps for
    most of them, so the list signup is the clearest first step.
  first_visit_tips:
  - Check the events page for the newest dates before you plan a visit.
  - The office is at 1501 Cherry Street, but the site does not list office hours, so call or email first.
  - Contact by email at info@philadelphia.cair.com, by voicemail at 267-515-6710, or by text at 215-253-3608.
