summary: The Philadelphia chapter of a civil rights group for Muslim communities. It helps people report
  discrimination, publishes know your rights guides, runs a youth leadership program, and shares voter
  registration information.
what_you_do: Join the email or text list, report discrimination through the reporting form, attend seminars
  and workshops, or give monthly. The know your rights guides are free downloads.
