  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Families start with a booked consultation, and the site lists no prices, class times or session
    locations.
  what_to_expect: The first step is a booked consultation, where the team offers tailored guidance on
    educational goals. Tutoring for ages 3 to 10 is one on one and starts from a learning plan made for
    the child. The site does not give the length of a consultation, the cost, or where sessions are held.
  first_visit_tips:
  - Have your child's age and reading goals in mind before you book.
  - Ask whether sessions are in person or online, since the site does not say.
  - Ask about fees before you book, since none are listed.
