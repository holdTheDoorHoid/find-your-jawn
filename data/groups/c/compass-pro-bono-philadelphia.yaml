  basis: Volunteers apply through a portal and are matched. Public information sessions are listed, but
    the page does not say what the application or matching involves.
  what_to_expect: Consulting work takes a few hours a week, and team projects run four or eight months.
    One-on-one guidance runs eight weeks. Board members receive training, but the page does not say how
    long it runs or what it costs, and it does not say what the application asks or whether there is a
    fee.
  first_visit_tips:
  - Attend an information session first, since the page lists several with registration links.
  - Ask about training length and the hours a board seat takes before you apply, since the page does not
    give them.
