first_step:
  how: Call (215) 858-4957 or email cefnphila@gmail.com to ask how to join the next senior program or
    event, since the programs page lists no sign-up steps.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: Programs and events are for older adults, but the site gives no sign-up steps or ticket details,
    so the way in is unclear.
  what_to_expect: Events include live music, a DJ, catered food, health and wellness vendors and a raffle.
    The yearly fall ball has a dress code of elegant evening wear. Programs include nutrition and healthy
    cooking and a seated exercise class. The site does not list times, places or prices, so call before
    you come.
  first_visit_tips:
  - Ask about the venue, start time and ticket price before you come, since the site does not list them.
  - Volunteers attend a short briefing before each event starts.
  - To help out, use the interest form on the volunteer page, or call or email the group.
