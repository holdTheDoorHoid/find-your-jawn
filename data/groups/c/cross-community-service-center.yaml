first_step:
  how: Call 267-466-6439 and ask when the Adult Career Program next starts and how to enroll.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The site lists an adult career program, but its Join page is about working at the organization,
    and the site gives no enrollment steps, dates, costs or eligibility.
  what_to_expect: The website does not describe class times, how long a course runs, what it costs, or
    what a first session is like. The phone, email and office address are the only ways in that the site
    publishes, so expect to ask about each part on the first call.
  first_visit_tips:
  - Ask about cost, class times, and who the program is for on your first call, since the site does not
    list them.
