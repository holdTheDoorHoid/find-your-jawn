summary: A nonprofit that runs science, technology, engineering, and math (STEM) learning, trains teachers,
  provides educators to K to 12 schools, and helps adults build work skills.
what_you_do: Adults can join the career program, which covers computer and information technology skills,
  resume and cover letter writing, programming practice, and professional leadership. Schools can use
  the group for educator training and staffing in computer science, math, ESL, and world languages. The
  group also runs K to 12 STEM programs for children and youth.
