first_step:
  how: Pick a show from the Audience Paths 2026 list or the Philly Fringe lineup filtered for Cannonball,
    then buy tickets through that show's own ticket page. If you perform, read the Artist Open Call before
    you apply.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Shows are open to the public and sold through Philly Fringe ticket pages, and the audience guide
    groups picks for first time Fringe goers. Buying a ticket is the only sign up, so the way in is clear.
  what_to_expect: The festival runs in weeks, and its audience guide groups the shows by theme. Expect
    circus and performance art, and note that some shows are for adults only. The festival pages we read
    do not print exact dates, prices, or access details, so check each show's ticket page.
  first_visit_tips:
  - Read each show's age note before you buy, since one listed show is 21 and over and several have adult
    themes.
  - Check times and prices on each show's ticket page, because the festival home and visit pages do not
    print them.
  - Each venue has its own access page on the festival site, so check it before you go.
