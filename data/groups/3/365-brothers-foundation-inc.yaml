  what_to_expect: Clean-ups are spring and fall work days where volunteers pick up litter, do some landscaping,
    and help improve public spaces. The page does not say how long a clean-up lasts, where it meets, or
    who leads it on the day. The Haircuts On Us program runs all year and welcomes volunteers as mentors
    or helpers, which may suit someone who wants a steady role.
  first_visit_tips:
