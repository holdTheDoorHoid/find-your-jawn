summary: A monthly online group at Fox Chase Cancer Center for people with neuroendocrine tumors. Members
  learn coping skills and get support from others, which can help with loneliness and worry.
what_you_do: Join the online meeting on the third Wednesday, 4 to 5 pm, to talk with others and learn
  coping skills.
