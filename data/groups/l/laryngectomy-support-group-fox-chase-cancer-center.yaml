first_step:
  how: Call Fox Chase at 215-728-2668 (support group and social work questions) or the main line at 888-369-2427,
    and ask to join the neuroendocrine group. The group's page names two facilitators to contact.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: The page names facilitators to contact before you join, and it does not say who may join or what
    a session is like.
  what_to_expect: The group meets online on the third Wednesday of each month from 4 to 5 pm, led by two
    licensed social workers. The page says sessions aim to reduce loneliness and anxiety, teach coping
    skills, and share practical information about treatment. Fox Chase's support pages say groups are
    for patients, their families and people in treatment elsewhere, but this page does not say who may
    join, so ask first.
  first_visit_tips:
  - Call the support line before the session to confirm how to join, since the page does not say
  - Ask for the printable schedule the group's page links to, to see the full year
  - Use a device with sound and a steady internet connection, since sessions are online
