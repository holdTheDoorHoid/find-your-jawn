  basis: No current meeting time or welcome page was found. The only web address on file is a Facebook
    group, so the way in is unclear.
  what_to_expect: We could not find a current meeting time for this group. The City list gives St. William's
    Social Hall at 6200 Rising Sun Avenue as the meeting place, but we could not confirm it is still used.
    The group's listed work is reviewing nearby zoning and building proposals, and we found no fee information.
  first_visit_tips:
  - Call or email before you go, since no current meeting time was found.
  - The City list says to enter the hall at the corner of Robbins and Argyle Streets.
  - Ask whether the meetings are open to neighbors who are not members.
