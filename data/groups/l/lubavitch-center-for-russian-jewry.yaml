  newcomer_friendliness: 4
  basis: The site says the congregation welcomes all people regardless of level of religious practice
    or background, and gives a phone number and a question form to start. It does not describe what a
    first service is like.
  what_to_expect: Services are led by Rabbi Sholom Goldshmid. The Friday service is listed as 6:30 to
    7 pm, and Shabbat morning services start at 10 am and are followed by kiddush at 12:30 pm. The site
    does not describe seating, dress, or how guests are greeted, so ask when you call.
  first_visit_tips:
  - Call 215-514-0729 before you come to ask about dress and seating, which the site does not cover.
  - 'Plan your ride: the site does not mention parking or transit.'
  - Arrive a few minutes before the service starts.
