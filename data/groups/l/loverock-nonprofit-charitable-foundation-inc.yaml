summary: A small charity that helps people in Philadelphia who are homeless or short of money. Volunteers
  take meals and hygiene gift bags out to people on the street and to shelters, and the group also helps
  with clothing and medical needs.
what_you_do: Helpers pack meals and care packages into cars and drive them out to people on the streets
  and in shelters. Call the group to ask how to join the outreach, or how to get help yourself.
