first_step:
  how: Buy a ticket for a listed screening at the box office or online, or join as a member for $5 tickets.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Public screenings are open to anyone with a ticket, and the site lists membership options with
    prices.
  what_to_expect: A screening is shown in Bok Auditorium inside the BOK building on South 9th Street.
    Many films are repertory, nonfiction, experimental or international titles that the site says are
    not otherwise screened in the city. General tickets are $14, with lower prices for students, seniors,
    members and ACCESS card holders.
  first_visit_tips:
  - Use the visitor entrance at 821 Dudley Street, which is an ADA entrance.
  - Bring a photo ID if you use the ACCESS discount, along with your PA ACCESS, EBT or Art-Reach ACCESS
    card.
  - Street parking is hard to find, so take the Broad Street Line, a bus or a ride share. Ride share drop-off
    is marked Bok at 1901 S 9th Street.
  - Bike parking is on the 9th Street sidewalk, and an Indego bike share kiosk is at 8th and Mifflin Streets.
