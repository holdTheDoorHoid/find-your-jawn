summary: A Philadelphia nonprofit cinema that shows repertory, nonfiction, experimental and international
  films and works to restore important older films. Anyone can buy a ticket to a screening, and members
  pay less.
what_you_do: Buy a ticket to a listed screening at the box office or online through Ticketleap. Members
  pay $5 per ticket, and yearly memberships start at $60 for students and $75 for individuals.
