summary: Neighbors in Logan Square who meet monthly to talk about zoning, safety, transportation and building
  plans, then share the group's views with the City and developers. The group has operated for about 50
  years.
what_you_do: Come to the monthly board meeting, ask to join a committee (such as zoning, transportation,
  or planning and design), or join in neighborhood events.
