first_step:
  how: Come to the monthly board meeting on the second Tuesday at 7 pm. The place changes, so check the
    email list or the events page first. You can join as a member online, or print and mail a form.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: The monthly meeting is open to neighbors and the site explains how to join, but it does not say
    how a new person gets onto a committee.
  what_to_expect: The board meets once a month, on the second Tuesday at 7 pm, at a place that changes
    around the neighborhood. Neighbors who live in the area can attend without paying dues, and only dues-paying
    members vote in the June election. The site does not describe the agenda or how long a meeting runs.
  first_visit_tips:
  - Look up the meeting place before you go, since it changes.
  - Email info@lsnaphilly.org to ask which committees take new members.
  - Only dues-paying members can vote, so you can attend first and decide about membership later.
