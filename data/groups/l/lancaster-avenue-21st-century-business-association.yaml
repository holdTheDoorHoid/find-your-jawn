summary: A community development group for the Lancaster Avenue corridor in West Philadelphia. It helps
  small businesses start and grow, and as a registered community organization it gives neighbors a place
  to hear about zoning and development projects and respond.
what_you_do: Business owners can use training, startup and growth programs and one-on-one office hours.
  Neighbors hear about zoning and development projects in the area and can respond through the group's
  community role.
