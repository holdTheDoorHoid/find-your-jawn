  basis: The gallery's pages say it is free and open to visitors, so a first visit needs no sign-up. Group
    and school tours do need an email request first.
  what_to_expect: Entry is free, and you can look at the exhibition on your own at your own pace. Group
    and school tours need an email to gallery@drexel.edu before the visit.
  first_visit_tips:
  - Call 215.895.2548 or email gallery@drexel.edu with questions before you come.
  - Check the Exhibitions and Events section for the current show's details.
  - The gallery's pages do not describe the entrance, so call ahead if you need step free access.
