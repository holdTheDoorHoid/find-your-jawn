first_step:
  how: Email info@laosinthehouse.com or fill in the volunteer sign-up form on the site. For the summer
    camp, watch the camp page and register there, since space is limited.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The volunteer form and the camp registration are public and clear, but the site does not describe
    how to join its ongoing activities.
  what_to_expect: The summer camp runs for one week, 8:30 am to 3:30 pm, with breakfast, lunch and snacks
    included. Campers are grouped by age and learn music, dance, customs, Lao phrases and cooking from
    teaching artists, then perform a recital at the end. Families can come on the first day.
  first_visit_tips:
  - The mailing address is c/o CultureTrust, so confirm the meeting place with the group before you visit
  - Register early, since the camp has limited space
  - Ask whether the next camp dates are set, because the site lists none yet
