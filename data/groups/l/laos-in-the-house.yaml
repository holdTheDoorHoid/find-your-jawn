summary: A nonprofit that uses storytelling and the arts to bring together Lao and Laotian Americans.
  It has run a summer camp for children that covers Lao music, dance, customs and cooking, keeps a volunteer
  sign-up form, and invites people to share their own stories.
what_you_do: Sign up to volunteer through the form on the site, send in a story through the submissions
  page, or come to an event the group announces. The group also sells merchandise and takes donations.
