first_step:
  how: Come to the second Saturday meeting at 11 am in Classroom 2 at Cathedral Village. Guests are welcome.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The home page says all are welcome and that guests can attend, and each meeting opens with introductions,
    so a newcomer knows what the start looks like.
  what_to_expect: Each meeting opens with introductions, when members share the project they are working
    on and may show a finished piece. Afterward, people ask questions and follow up on each other's work.
    Members knit, crochet, quilt, embroider, needlepoint and sew, and many make items for local charities.
  first_visit_tips:
  - Bring a project you are working on, or a finished piece, if you want to share during introductions.
  - Meetings are monthly, so plan on the second Saturday at 11 am.
  - Allow a few extra minutes to find Classroom 2 inside Cathedral Village, 600 East Cathedral Road.
