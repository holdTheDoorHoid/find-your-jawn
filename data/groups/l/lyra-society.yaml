first_step:
  how: Email info@LyraSociety.org with your résumé or LinkedIn profile and the committee you want to join.
    To see the group first, attend a public concert or benefit listed on the events page.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Volunteer roles start with an emailed résumé or LinkedIn profile and a committee choice, which
    is a light application. Public events are open to the public, but many need a ticket or a reservation.
  what_to_expect: Each committee has its own job, such as planning fundraisers, managing the budget, or
    helping students apply to college. The site does not give committee meeting days, times, or places,
    or how much time a volunteer should expect. A public concert or benefit is a simpler first look at
    the group, but tickets or reservations are often needed.
  first_visit_tips:
  - Check the events page for a ticket or reservation before you go.
  - Name the committee you want in your email, and attach a résumé or LinkedIn profile.
