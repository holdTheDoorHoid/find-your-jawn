summary: A harp nonprofit that teaches harp and helps students with college applications at partner Philadelphia
  public schools, at no cost to them. Adults can volunteer on its committees and attend public concerts
  and benefits.
what_you_do: Join a volunteer committee (college guidance, development and marketing, events, finance,
  technology and website, or the Young Friends group for ages 21 to 65), or attend a public concert or
  benefit. Students at partner schools take part through the Glissando Program.
