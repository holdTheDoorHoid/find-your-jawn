first_step:
  how: Send a message through the Contact Us page and choose 'Become a Liberty City Artist'. The form
    asks for a resume, your voice type or instrument, and a link to a recent recording.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: The home page describes the vocal training as free, but the site gives no schedule or class steps,
    and the way in is an inquiry form that asks for a resume and a recording.
  what_to_expect: The public shows are ticketed evening performances at venues such as The Latvian Society
    and Trinity@22. The site does not describe a training class format, so ask through the form how training
    works before you plan around it.
  first_visit_tips:
  - The events page does not show prices, so open each show's Read more page before you go.
  - The events list shows only September 2026 shows, which have passed, so check the page for new dates.
  - Artists can ask about complimentary tickets through the contact form.
