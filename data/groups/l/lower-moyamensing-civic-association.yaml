first_step:
  how: Join the free email list, or email lomophilly@gmail.com to ask when the next general meeting is.
    Membership ($15 a year, for adults 18 and up who live or own property in the area) gives you a vote
    in board matters.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Volunteer work is open to residents, costs nothing, and has a clear way in through the email
    list and contact, but meeting times and whether non-members can attend are not posted.
  what_to_expect: The site does not say how long a meeting runs or who usually comes. The easiest first
    step is a block cleanup, where the group can help with supplies, or a quick litter check on trash
    nights. Check the calendar or the email list for the next date before you come.
  first_visit_tips:
  - Check the group's calendar page or email list for the next date.
  - Ask whether general meetings are open to people who are not members.
