summary: A volunteer civic group for Lower Moyamensing in South Philadelphia, the blocks roughly from
  Broad to 7th Streets and Snyder to Oregon Avenues. Members run a spring and fall flea market, a holiday
  tree recycling drive, and an environmental committee that organizes cleanups and tree care.
what_you_do: Volunteers help run the flea markets and the tree drive, join litter checks and block cleanups,
  and help care for trees and neighborhood gardens. Paying members also vote in board elections and on
  other questions the board puts to the membership.
