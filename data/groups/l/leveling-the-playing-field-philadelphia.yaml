summary: A youth sports charity that collects donated sports equipment and gives it free to kids who need
  it. Volunteers sort and check gear at a Philadelphia-area warehouse.
what_you_do: Volunteers book a shift of about two hours to sort and inventory donated gear, check that
  it is in good shape, and keep the warehouse in order. Individuals and groups may sign up. Volunteers
  must be at least 10, and an adult must be with anyone under 15.
