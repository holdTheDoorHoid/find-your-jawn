first_step:
  how: To volunteer, book a shift through the VolunteerHub link on the volunteer page, or email info@levelingtheplayingfield.org.
    To get gear, a school or sports program submits the online grant application, which is reviewed before
    a site call or visit.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Volunteer shifts are booked online through a clear route. No training is required, though basic
    knowledge of sports gear is preferred. The gear grant is for programs, not individual families.
  what_to_expect: A shift lasts about two hours at the Sharon Hill warehouse. You sort donated gear, check
    that it is in usable shape, and help keep the shelves in order. No training is required, and individuals
    and groups both come.
  first_visit_tips:
  - The warehouse is in Sharon Hill, outside the city, so plan travel time
  - Anyone under 15 must come with an adult, and volunteers must be at least 10
  - Book your shift in advance, since volunteering is by appointment only
