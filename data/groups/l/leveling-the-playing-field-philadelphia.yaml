summary: A youth sports charity that collects donated sports gear and gives it free to schools and programs
  that serve kids in under-resourced communities. Volunteers sort and check gear at its Philadelphia warehouse
  in Sharon Hill.
what_you_do: Volunteers book a shift of about two hours, by appointment, to sort and inventory donated
  gear, check that it is in good shape, and keep the warehouse in order. Individuals and groups may sign
  up. Volunteers must be at least 10, and an adult must come with anyone under 15.
