summary: A tennis and education program based at the LEGACY Tennis Center on Ridge Avenue. It offers junior
  clinics, camps, private lessons, tournaments, and after-school programs at partner schools.
what_you_do: Kids join junior clinics, summer camps, and the after-school program. Adults can take clinics
  and lessons. Volunteers can coach in the after-school program, help at events, or join the summer program
  for a three-week term.
