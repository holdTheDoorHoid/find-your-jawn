summary: A nonprofit that teaches and practices restorative justice, an approach focused on healing and
  taking responsibility for harm. Its work reaches prisons and Philadelphia.
what_you_do: Ask through the contact form about its Intro Restorative Justice Workshop, a ten-session
  course with a two-day mini version. Volunteers can fill in an interest form to help with inside workshops,
  and the group holds a yearly A Call to End Harm event. You can also donate or buy its book.
