first_step:
  how: Visit Monday to Thursday, 10 am to 4 pm, during the school term, or email artmuseum@lasalle.edu
    to book a visit outside the term.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The museum lists open hours and an email for visits and bookings, and it is open to the public.
    The site does not describe beginner programs or tours.
  what_to_expect: A visit is a walk through the galleries during open hours. School groups in grades K
    to 12 can book a free themed gallery lesson for up to 35 students, with one adult for every 5 students
    in grades K to 5 and one for every 10 students in grades 6 to 12. The hours page does not list an
    admission price, so ask before you go if cost matters.
  first_visit_tips:
  - The museum is in the lower level of Hayman Hall. Turn onto 20th Street at the campus guardhouse and
    ask the guard for directions.
  - Parking is assigned on arrival, as space allows.
  - Email artmuseum@lasalle.edu before any visit outside the term, since the museum then opens by appointment.
