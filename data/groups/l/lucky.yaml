summary: A youth organization that pairs young people with mentors for school, leadership and career planning.
  It also offers educational opportunities, arts and culture activities, and trips.
what_you_do: Families can email mentoring@luckymp.org with the subject 'Mentoring Request' to ask for
  a mentor. People who want to help can email development@luckymp.org with the subject 'Volunteer Opportunities',
  and volunteers upload child abuse and criminal clearances on the Volunteer Corner page. Mentoring tracks
  cover leadership, academics and career planning.
