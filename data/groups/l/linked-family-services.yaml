first_step:
  how: Call 215-703-7756 during office hours to ask about the waitlist for basic goods and the next parenting
    class. You need to be pregnant or raising a child aged 0 to 8, and live in Philadelphia County.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: The goods program is full with a waitlist, the parenting class cohort that was open has closed,
    and new families start with a referral form and an in-person intake, so there is no walk-in step.
  what_to_expect: After you send the online Referral and Interest Form, a Care Coordinator contacts you
    to set up an in-person intake, where eligibility is decided. The parenting class page says it suits
    caregivers who self-refer or are referred by an agency, including families involved with child welfare
    or family court. It does not say how long a class runs or whether children come along.
  first_visit_tips:
  - Have your child's age and your Philadelphia address ready, since eligibility depends on both.
  - 'Call during office hours: Monday and Thursday 12 to 7 pm, Friday 10 am to 3 pm.'
  - The page does not say how to get there by bus or where to park, so ask when you call.
