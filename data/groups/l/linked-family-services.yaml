summary: Helps families in Philadelphia County who are pregnant or raising a child aged 0 to 8. It offers
  diapers and other basic goods, parenting classes, family support, and events.
what_you_do: Join the waitlist for the basic goods program, which is full right now, or ask the office
  when the next parenting class opens. Volunteer through the group's volunteer page or by calling the
  office.
