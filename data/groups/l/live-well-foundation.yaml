summary: A peer-led, volunteer-run nonprofit for people living with depression. Its free online peer support
  groups meet on Zoom, and its in person Philadelphia groups are paused for now.
what_you_do: Join a free online peer support group for adults, people in recovery, teens, or seniors,
  or come to a public talk or workshop when one is scheduled. Volunteers with lived experience can train
  as peer facilitators to run the groups.
