first_step:
  how: Pick an online group on the support groups page and join it through the Zoom link at its listed
    time. The FAQ says no registration is needed.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: The FAQ says the groups are open to the public with no registration, insurance or diagnosis needed,
    and each group is listed by who it is for. The page does not say newcomers are specifically welcomed.
  what_to_expect: Groups are run by trained peer facilitators, and most last about 75 minutes. You can
    join by Zoom or by phone, and latecomers can enter for up to 15 minutes after the start. The groups
    are free and confidential. LiveWell does not provide emergency services, so in a crisis, call or text
    988.
  first_visit_tips:
  - Use the Zoom link or phone line listed for the group, and join a few minutes early.
  - Check the age range on the group page, since adult groups start at 19 and teens and seniors have their
    own groups.
