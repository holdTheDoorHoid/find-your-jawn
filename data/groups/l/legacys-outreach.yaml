first_step:
  how: Fill in the Apply form at legacysoutreach.com with your name, email, and phone, and say which services
    you need.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Services start with a web application, and the site does not say what the application involves
    or how long it takes to hear back.
  what_to_expect: The form asks for your name, email, and phone number, plus an optional question about
    the services you need. A staff member says they will reach out to collect the information they need.
    The site does not say how long that takes, whether there are documents or fees, or what a visit looks
    like.
  first_visit_tips:
  - Have your name, email, and phone number ready for the online form.
  - The site lists no office hours, so call (215) 839-6898 before you go to the office.
  - The ESL, tutoring, GED, school age, and summer programs are marked coming soon, so ask before planning
    around them.
