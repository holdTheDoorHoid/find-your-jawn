summary: A community nonprofit that offers family events, childcare, life skills and job readiness help,
  and referrals for health and mental health care. Its website lists these services without dates or costs,
  and its education classes are listed as coming soon.
what_you_do: Apply for services through the online form on the website, or attend a community event. The
  group also trains community members and childcare professionals. Its ESL, tutoring, GED, school age,
  and summer programs are listed as coming soon.
