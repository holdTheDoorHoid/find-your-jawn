first_step:
  how: Email volunteer@luvnbunns.org to ask about volunteer roles, or email bunnies@luvnbunns.org to ask
    for a foster or adoption application
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Adoption and fostering start with an application that is reviewed before you can meet any rabbit,
    and the site describes no public visiting day.
  what_to_expect: The rabbits live in private foster homes, so there is no public place to visit them,
    and the first contact is by email. Adoption happens on a weekend adoption day after your application
    is approved, and you take your rabbit home that same day. The rescue says fostering is its biggest
    need, and it also asks for help with vet transport, events, and care at its adoption center.
  first_visit_tips:
  - Have a pet carrier and your home set up before adoption day, since you take the rabbit home the same
    day.
  - Expect email replies to take a few days, so start early.
  - If you plan to bring a child under 18 to the adoption center, tell the rescue first.
