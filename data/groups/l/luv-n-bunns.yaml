summary: A rabbit rescue that takes in domestic rabbits from shelters, strays, and hoarding cases and
  places them in foster and adoptive homes in the Philadelphia area. It also arranges veterinary care
  and holds rabbit care outreach events.
what_you_do: Foster a rabbit until it is adopted, volunteer through the application on the site, or adopt
  after an emailed application and screening.
