first_step:
  how: Choose a work day from the events list at loveyourpark.org. Where the listing says to register,
    use its Learn More link. Individuals can also ask for a solo cleanup kit.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Anyone can take part, and each work day lists a time and meeting spot, but some listings need
    registration first.
  what_to_expect: Work days usually run about two hours, such as 10 am to noon. Volunteers pick up trash,
    clear trails, weed, mulch and restore native plants. Tools and gloves are provided at some sites,
    and both individuals and groups can take part.
  first_visit_tips:
  - Bring your own water bottle, since the site asks volunteers to bring one.
  - Some listings give only a park name, so allow time to find the meeting spot before the work day starts.
  - Some events are cancelled in heavy rain, thunder or severe weather, so check the listing before you
    go.
