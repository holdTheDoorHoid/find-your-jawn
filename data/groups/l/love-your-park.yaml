summary: A citywide volunteer program for Philadelphia's parks, with cleanup days each spring and a Fall
  Weekend of service each fall. The Fairmount Park Conservancy and Philadelphia Parks & Recreation run
  it with park partner groups.
what_you_do: Pick a cleanup, trail or planting day from the events list. Individuals can get a solo cleanup
  kit, and groups can join a park friends group, start one, or organize their own event.
