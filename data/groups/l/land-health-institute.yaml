first_step:
  how: Start the volunteer sign-up on the Become a Volunteer page, which opens an email to the nursery
    team to request the volunteer waiver. Then join a volunteer day listed on the group's calendar.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Volunteer sign-up is public and posted on the site, with a waiver step by email, and the group's
    events are open to the public. The site does not describe orientation or a minimum age.
  what_to_expect: Volunteers help at the group's woodland site in West Parkside, where the work includes
    removing trash and debris, controlling invasive plants, and planting native trees. You first request
    a waiver by email, then come on a listed volunteer day. The site does not say how long a shift lasts,
    whether training comes first, or what to bring.
  first_visit_tips:
  - Request and sign the volunteer waiver before your first day.
  - Check the group's calendar for the next volunteer day, since the volunteer page does not list dates.
  - Ask the group what to wear and bring, since the site does not say.
