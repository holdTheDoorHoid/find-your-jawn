summary: A basketball league for boys and girls ages 6 to 18, with an adult division for players 19 and
  up. It runs a winter league and a summer season, and each player receives a jersey.
what_you_do: Players register for a season, are placed on teams through a draft, and join scheduled league
  games, including Saturday games in the winter league. Volunteers can coach, help plan events, or do
  outreach.
