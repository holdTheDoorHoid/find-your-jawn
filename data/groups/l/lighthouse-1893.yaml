first_step:
  how: Call 215-425-7800, the number the site lists for getting started, and ask about the league, the
    STEM program or Recreation Over Violence. For the 2026 STEM program, use the enrollment button on
    its page.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: The site lists a phone number and a membership page, but does not say how children sign up, when
    programs start, or whether there is a tryout, so the way in takes an extra step.
  what_to_expect: The site does not describe a typical practice, class or session length. The 2026 STEM
    program for kids aged 8 to 13 covers six weekly topics, including body systems, brain science and
    movement. Ask the phone line about start dates, cost and whether a child needs a membership to play.
  first_visit_tips:
  - Call before you visit, since the site does not list program times
  - Ask whether a membership is needed before a child can play
  - 'Check which building your program uses: the Somerset Building or the Lighthouse Sports Complex'
