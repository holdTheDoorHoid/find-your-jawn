summary: A Fairhill community organization founded in 1893 as a preschool and afterschool program. It
  runs youth sports leagues, a STEM program for kids 8 to 13, and Recreation Over Violence, an affordable
  sports program for children and families. Its Lions Elite teams play at several age levels.
what_you_do: Kids can join sports leagues, the STEM program or the summer camp. Families can take part
  in Recreation Over Violence. Adults can volunteer through an online form, and membership is a monthly
  donation that funds the programs.
