first_step:
  how: Email info@lwvphilly.org or membership@lwvphilly.org to ask about the next tabling shift or public
    event, since the events page listed no upcoming events on this check. To join, use the Join button
    on the website, which opens the chapter's membership portal.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Public events are open to anyone and tabling shifts are open to volunteers who sign up, and the
    chapter lists public email addresses. Membership dues and the join steps are on a portal the site
    does not describe.
  what_to_expect: A first shift is usually a table at a public event, where you hand out voter information
    and help people with voter registration. The site does not say how long a shift lasts or whether training
    comes first. Membership is a separate step through the join portal, and the site does not list dues.
  first_visit_tips:
  - Ask the chapter whether a short training comes before your first shift.
  - Confirm the date, time and venue on the event listing before you go.
