first_step:
  how: Walk in to a weekday class such as Enhance Fitness, chair yoga, art or card hour. Most need no
    registration. For the $5 Bingo or the Spanish class, register first by calling 215-426-8610 ext. 1206.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: Most classes are drop-in for adults 55 and older with no sign-up, but the site does not say it
    welcomes beginners in particular.
  what_to_expect: Listed classes run about an hour, such as Enhance Fitness from 9:30 to 10:30 am. Most
    are drop-in, and some activities, like the monthly community dinners, Mat Yoga and the Spanish class,
    are open to the wider community.
  first_visit_tips:
  - Call 215-426-8610 to confirm the week's classes, since the site lists event times only.
  - For the $5 Bingo, bring $5 and register first with the activities coordinator at ext. 1206.
  - For Morning Bingo, bring your own coins and bills.
