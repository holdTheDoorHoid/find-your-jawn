schedule:
  text: More than 20 weekly classes and activities on weekdays, mostly in the morning and early afternoon.
    Enhance Fitness meets Mondays and Fridays, chair yoga on Wednesdays, and card game hour on Tuesdays.
    Call to confirm the current week.
