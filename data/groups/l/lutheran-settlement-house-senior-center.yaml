summary: A senior center for adults 55 and older at Lutheran Settlement House in Fishtown, with more than
  20 weekly classes and activities such as fitness, art, line dancing and card games. Most classes need
  no sign-up.
what_you_do: Join a weekly class such as Enhance Fitness, chair yoga, art or card hour, or come to a monthly
  community dinner. Staff can help with benefits and community resources, and members volunteer at the
  food pantry.
