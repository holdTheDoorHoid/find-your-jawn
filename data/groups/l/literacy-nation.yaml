first_step:
  how: Register for a free masterclass on the group's website, or visit the next book fair. To volunteer,
    use the Join a Committee link for the committee you want.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The book fair is free and open to the public, masterclass registration is free on the website,
    and each committee has a join link. The site does not say what a masterclass is like or whether you
    can attend a committee meeting first.
  what_to_expect: At the book fair, independent authors sell their own books at tables, and a few vendors
    sell book accessories, literary merchandise, educational products, and art or crafts. The pages we
    read do not give public hours, parking, or accessibility details, and the masterclass page does not
    describe topics or format, so ask when you register.
  first_visit_tips:
  - Email contact@literacynationinc.org or call (646) 721-1358 to confirm the fair's hours and entrance
    before you go.
  - When you register for a masterclass, ask how long it runs and whether it is in person or online.
  - Ask a committee chair how much time a member is expected to give.
