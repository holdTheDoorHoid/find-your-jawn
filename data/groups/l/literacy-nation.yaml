summary: Helps independent authors and readers. It runs a yearly indie author book fair, offers free masterclasses,
  and gives awards for independent books.
what_you_do: Visit the book fair when it is held, register for a free masterclass on the website, or join
  one of seven standing volunteer committees, such as library, marketing or fundraising.
