first_step:
  how: Fill in the Program Interest Form on the website to hear about fall dates, or use the Story to
    Screen application link if you are ready to apply.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Programs need an application, and the fall dates are marked coming soon, so the way in is not
    yet clear.
  what_to_expect: Story to Screen is an interactive course where you learn acting, camera, sound and directing,
    then make a short film. Real to Reel is a 3 month project where a group develops and produces its
    own short film, and each cohort's film is premiered and sent to film festivals. Paid internships have
    interns work with staff on business needs while they build portfolios.
  first_visit_tips:
  - The office is open Monday to Friday, 10 am to 6 pm, and is closed on weekends and major US holidays.
  - The home page lists Story to Screen for ages 11 to 18, but the program page says 13 to 18. Confirm
    by email at info@lilfilmmakersinc.com before you apply for a younger teen.
  - Subscribe to the newsletter to hear when fall applications open.
