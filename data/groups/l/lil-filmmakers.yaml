summary: A nonprofit that teaches filmmaking and media skills to young people from communities that are
  underrepresented in film, with mentoring and paid internships for young adults.
what_you_do: 'Apply for a filmmaking program: Story to Screen (an entry level course for youth), Real
  to Reel (a 3 month film project for ages 13 to 24), or a paid internship (ages 18 to 24). Fall dates
  are marked coming soon, so use the program interest form to hear first.'
