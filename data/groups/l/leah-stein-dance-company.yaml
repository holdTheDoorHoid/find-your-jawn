  newcomer_friendliness: 4
  basis: The company's site has a guide for new people, says anyone is welcome at the monthly party, and
    explains how to RSVP for workshops. It does not describe a beginner class series.
  what_to_expect: A Dance It Up night is a monthly party from 6 to 9 pm at the studio. Guests dance with
    DJs, snacks are provided, and guests bring their own drinks. The suggested donation is $10 or more
    and helps support the studio, while workshops cost $10 to $35 on a sliding scale and need an email
    RSVP.
  first_visit_tips:
  - Bring your own drinks, since the party is BYOB.
  - Most events are on the second floor, so ask about stairs before you come.
  - Email to RSVP for a workshop, since space is limited.
