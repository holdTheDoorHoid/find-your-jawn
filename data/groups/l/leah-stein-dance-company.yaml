summary: A Philadelphia dance company, founded in 2001, that makes performances blending movement, sound,
  and place. It runs the Art Room Studio, which hosts workshops, shows, and dance parties open to the
  public.
what_you_do: Take a workshop with Leah Stein or a guest artist, come to a Studio Works show or a Dance
  It Up dance party, or share your own work at Studio Works.
