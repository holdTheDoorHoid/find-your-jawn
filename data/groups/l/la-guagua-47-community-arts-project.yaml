first_step:
  how: Call Taller Puertorriqueño at 215-426-3311 or email info@tallerpr.org to ask about the next workshop
    or free performance. The project's own site does not list dates.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The residency page invites neighbors to join workshops, but it gives no workshop dates, sign-up
    or RSVP steps, so the way in is unclear.
  what_to_expect: Residency workshops are open spaces where you help shape the show through storytelling,
    music, dance, visual art or cultural memory. The page says they are not auditions or performances,
    and it gives no times, length or sign-up steps. Past community events included a parade float workshop
    and an intergenerational flower-making workshop, but the cost of a workshop is not stated.
  first_visit_tips:
  - Confirm the date, time and place with Taller before you go, since the project pages list none.
  - The residency is based at Taller Puertorriqueño, 2600 N 5th St.
  - The musical is bilingual with some Spanish throughout; the language used in workshops is not stated.
