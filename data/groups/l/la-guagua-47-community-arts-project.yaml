summary: A multi-year arts residency at Taller Puertorriqueño that helps neighbors shape La Guagua 47,
  a bilingual Puerto Rican musical about migration and belonging in Philadelphia. Workshops in storytelling,
  music, dance and visual art invite neighbors, youth, elders and families, and the group also presents
  concerts and street performances.
what_you_do: Join a workshop in storytelling, music, dance, visual art or cultural memory, help make parade
  floats or decorations, or come to a concert or street performance. The workshops are open spaces where
  community members shape the show, not auditions.
