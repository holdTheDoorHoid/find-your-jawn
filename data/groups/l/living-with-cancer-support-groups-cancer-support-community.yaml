summary: Free, closed peer support groups for adults in cancer treatment or up to 18 months after treatment,
  run by Cancer Support Community Greater Philadelphia. Members meet weekly to share what daily life with
  cancer is like.
what_you_do: Join as a member, have a short talk with a program staff member, then attend a weekly peer
  support session. Sign up for each session in the group's online calendar.
