first_step:
  how: Fill out the free New Member Information Profile on the center's website. Then attend a new member
    orientation, in person or online, or call 215-879-7733 to schedule a New Member Meeting. After that,
    sign up for a session in the online calendar.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: The groups are closed, you need a member profile, and you talk with program staff before attending,
    so you cannot just walk in. The steps are clear and membership is free.
  what_to_expect: Expect a short talk with a program staff member before your first group, then weekly
    peer support sessions. The page asks members to commit to attending regularly. Family members or friends
    may come with you to a new member meeting.
  first_visit_tips:
  - Finish the member profile first, since orientation details are emailed after you complete it.
  - Pick the location that fits you, since the Tuesday and Thursday sessions meet in different places.
  - Bring a friend or family member to the new member meeting if you want support, since the page says
    they may come along.
