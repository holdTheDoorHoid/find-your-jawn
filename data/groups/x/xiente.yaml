  newcomer_friendliness: 3
  basis: The volunteer sign-up is a short form with a follow up, and workshops are open to the public
    with registration. The site describes no beginner program.
  what_to_expect: Volunteering starts with a short online form, and the team follows up from there. Some
    workshops are online, such as the pre-purchase housing workshop on November 12, 2026, which runs on
    Zoom from 5:30 to 7:30 pm Eastern after you register. The pages we checked list no fee, and spots
    for workshops may be limited.
  first_visit_tips:
  - Register through the link on a workshop page; the Zoom details arrive by email.
  - For questions about in person visits, call the main office at (215) 426-8734; the site does not describe
    what a visit involves.
