summary: A Philadelphia nonprofit that helps families move up through education, housing, workforce and
  money skills programs. It runs community leadership, youth and volunteer programs, and it hosts homebuyer
  and housing workshops.
what_you_do: Volunteer with Xiente, join its community leadership or networking programs, or register
  for a workshop. A first-time homebuyer class is listed for October 22, 2026, and a pre-purchase housing
  workshop for November 12, 2026. Most programs use a registration form on a third-party site.
