summary: A Philadelphia nonprofit that helps families move up through education, housing, workforce and
  money skills programs. It runs community leadership, youth and volunteer programs, and it hosts homebuyer
  and housing workshops.
what_you_do: Volunteer roles include mentoring a youth or adult in career exploration, supporting early
  education or after school programs, helping run networking and advocacy events, and serving on a community
  advisory group. You can also join the community leadership or networking programs, or register for a
  workshop.
