first_step:
  how: Use the contact form on philomusicachorale.org, or email philomusicaoffice@gmail.com, to request
    an audition time or a rehearsal visit.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The site calls the audition friendly and low stress, says all voice types and ages are considered,
    and explains how to arrange an audition or a rehearsal visit.
  what_to_expect: 'The audition is friendly and low stress: you sing a song of your choice, do some warm-ups,
    and sing an excerpt the music director sends ahead of time, with possibly a short sight-reading exercise.
    Monday rehearsals run 7 to 9:30 pm and include a break with snacks and conversation. The site says
    reading music matters, but it sometimes considers singers who read less well. It does not say how
    long the audition lasts.'
  first_visit_tips:
  - Arrange your audition or rehearsal visit in advance, since the site asks visitors to request one first.
  - Choose one song you know well to sing, and plan to warm up before you audition.
  - Rehearsals are at Widener Hall in the Presbyterian Church of Chestnut Hill, on Germantown Avenue.
    Some sessions are on Zoom.
  - Ask early about the suggested contribution if cost is a concern, since the chorus says money does
    not stop a successful auditioner.
