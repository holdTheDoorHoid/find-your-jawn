summary: A nonprofit civic association for the Packer Park area of South Philadelphia, north of Pattison
  Avenue and west of Broad Street. It works to improve living conditions and civic pride in the area,
  and the City lists it as a Registered Community Organization that is consulted on nearby zoning and
  building proposals.
what_you_do: The group reviews nearby building and zoning proposals with the City and developers, and
  sends neighbors emails and call alerts about local issues.
