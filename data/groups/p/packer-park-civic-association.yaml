first_step:
  how: Sign up for the association's emails and call alerts on its website, and ask the group where its
    next meeting is. Membership, if you want it, starts at $25.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The email sign-up and membership are clear, but the site posts no meeting times and its newest
    news is from 2022, so it is unclear what a newcomer would find.
  what_to_expect: The site does not describe a typical meeting or event, and its events list shows no
    meetings after 2021. Signing up for emails and call alerts is the simplest first step. Ask the group
    what is happening now before you go.
  first_visit_tips:
  - Ask whether meetings are still being held, since the site lists none after 2021.
  - Confirm the meeting place before you go, because the address comes from the City list.
