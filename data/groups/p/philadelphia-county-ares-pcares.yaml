name: Philadelphia County ARES (PCARES)
aka: []
leads: []
ein: null
summary: Volunteer ham radio operators who provide emergency communications for the Southeastern Pennsylvania
  Red Cross, run radio nets, and train for disaster response.
what_you_do: Check into the Sunday evening net, take part in drills and Red Cross station activations,
  and train for emergency response. The group's site says no amateur radio license is required to join,
  and it lists a Groups.io mailing list as its only contact route.
