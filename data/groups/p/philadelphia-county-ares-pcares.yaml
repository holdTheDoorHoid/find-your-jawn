first_step:
  how: Listen to the Sunday 8 pm net on 147.030 MHz, or join it by EchoLink (node W3QV-R) or ALLSTAR (node
    47970). Send questions to the group's Groups.io list, the only contact route the site gives.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The site says no amateur license is needed to join the group, and the Sunday net is a regular,
    open entry point, but it lists no training steps or meeting place.
  what_to_expect: The Sunday evening net runs at 8 pm on a local repeater, and the group says it trains
    for local disasters such as storms, floods, fires and building collapses. The site does not describe
    a first meeting, a training calendar or a meeting place, so ask through the Groups.io list before
    your first net.
  first_visit_tips:
  - The site says no license is needed to join the group, but it does not say whether one is needed to
    transmit on the net.
  - Red Cross membership is not required, but the site says it can help with access to facilities.
  - The site lists no sign-up form, so taking part in the net itself is the first step.
