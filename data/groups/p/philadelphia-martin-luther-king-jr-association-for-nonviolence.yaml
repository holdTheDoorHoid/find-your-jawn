first_step:
  how: Call 215-751-9300 or use the contact form on philadelphiamlk.org to ask about the next College
    for Teens session or the monthly food distribution. For the toy drive, follow the application steps
    on the toy page.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Workshops and food help are listed, but the site gives no workshop dates, food distribution times
    or sign-up steps. College for Teens and the toy drive use applications and eligibility rules.
  what_to_expect: College for Teens is aimed at low-income students from minority communities, starting
    around age 12 in grade 7, and it runs through college. Its parts include after-school tutoring, a
    summer residency on a college campus, and year-round mentoring and career exposure, at no cost to
    students. The food distribution and toy drive are for families who qualify, and the toy drive needs
    an online application with proof that the children live with you and proof of income.
  first_visit_tips:
  - The office is on the 7th floor at 3001 Walnut Street, according to the site footer.
  - For the toy drive, gather proof that the children live with you and proof of your income before you
    apply.
  - Ask about College for Teens session dates by phone or the contact form, since the site does not list
    them.
  - Watch for the toy drive email, which the page says arrives in early December, and check your spam
    folder.
