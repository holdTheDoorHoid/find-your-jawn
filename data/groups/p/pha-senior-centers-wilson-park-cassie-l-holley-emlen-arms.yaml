  basis: The page says the centers are open to seniors in the wider community as well as PHA residents,
    and it gives a phone number to call. The enrollment steps are not described.
  what_to_expect: The centers offer a meal, dance and exercise classes, walking, movies, music and trips
    around the city, and the page says the services are free. It does not say how long a visit lasts or
    what time activities start, so call ahead.
  first_visit_tips:
  - Call 215-684-3959 first, since the page lists no days, hours or sign-up form.
  - 'Pick the center nearest you: Wilson Park at 2500 Jackson St, Cassie L. Holley at 2100 Dickinson St,
    or Emlen Arms at 6733 Emlen St.'
  - The general PHA line is 215-684-4000, open 9 am to 5 pm every day, according to the senior programs
    page.
