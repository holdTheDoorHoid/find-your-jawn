first_step:
  how: Pick a free Out of School Time workshop for Philadelphia students and register through its sign-up
    link, or call 215-665-9226 with questions.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: Several workshops are listed for beginners or for all levels, each has a sign-up link, and the
    programs are free for Philadelphia students. The site does not describe drop in visits.
  what_to_expect: Most workshops meet on Wednesdays or Saturdays for four to six weeks, and the Day Off
    camps are one full day each. Students go from a first idea to a first draft, and the Duchamp workshop
    has its monologues performed by professional actors. The programs cost nothing for Philadelphia students,
    and the site does not list start times.
  first_visit_tips:
  - Start times are not listed on the program pages, so call 215-665-9226 before you plan the trip.
  - Workshops meet at different sites, including the Asian Arts Initiative, the Philadelphia Museum of
    Art and The Rotunda, so check the location for your program.
  - The office is on the second floor at 1219 Vine Street if you need to visit in person. The site lists
    no office hours.
