summary: A nonprofit that brings playwriting to young people through classes, school programs and a yearly
  playwriting festival. It also stages showcases and productions of young writers' work.
what_you_do: Join a free Out of School Time workshop for Philadelphia students, or a one-day Day Off camp.
  Students can also submit a play to the annual playwriting festival (the 2026 deadline was June 1, 2026)
  and can attend performances in the 2026 to 2027 season. Volunteering and membership are not listed.
