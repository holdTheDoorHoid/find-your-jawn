summary: A youth volunteer group for teens that cares for the gardens and house at Grumblethorpe, a historic
  house in Germantown run by PhilaLandmarks. Members farm, bake, keep bees, and help at events, with adult
  mentors.
what_you_do: Meet with the group monthly on the second Saturday, September through May. Work on garden
  cleanups, food preservation, and family events. A paid summer farm stand job for teens 14 and up is
  listed separately.
