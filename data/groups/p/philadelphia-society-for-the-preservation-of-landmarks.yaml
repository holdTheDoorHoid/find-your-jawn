first_step:
  how: Email gyv@philalandmarks.org to ask about the next second-Saturday meeting, its start time, and
    where it meets.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The page gives a direct email and describes no application, though it does not say what a first
    meeting is like.
  what_to_expect: The group meets once a month on a Saturday, September through May, and teens decide
    and run their own projects with adult mentors. Past work includes garden cleanups, food preservation,
    baking, beekeeping and helping at family events. The page does not say how long a meeting lasts or
    what time it starts.
  first_visit_tips:
  - Ask by email for the start time and meeting place before you come, since the page lists neither.
  - The Grumblethorpe house is open to visitors on second Saturdays, May through October, from noon to
    4 pm, so you can see the place first.
  - Teens 14 and up can ask about the paid summer Youth Farmstand job, which the page calls a common next
    step.
