first_step:
  how: Pick an ensemble on the auditions page, submit the online audition form with your preferred date
    and time, then wait for the office to confirm your appointment.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Every ensemble starts with an audition booked by appointment, and registration comes only after
    the audition.
  what_to_expect: Expect an online form, then an audition booked by appointment. The flagship orchestra
    asks for scales, a solo of your choice and orchestral excerpts for your instrument. Its Saturday rehearsals
    run 8:30 am to noon, and the season's tuition is $2,195.
  first_visit_tips:
  - Practice the required scales, a solo of your choice, and the orchestral excerpts for your instrument
    before your audition.
  - 'Check the age range first: the flagship orchestra takes ages 15 to 22, and the Philadelphia Young
    Artists Orchestra takes ages 13 to 18.'
  - Ask the office about financial aid, which comes after the audition for students who show need.
  - Check whether a concert needs a museum ticket; the jazz orchestra's Please Touch Museum show does.
