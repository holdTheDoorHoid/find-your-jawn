summary: The music school of the Philadelphia Youth Orchestra. It gives music education to young players
  through auditioned ensembles and lessons.
what_you_do: Audition for one of the youth ensembles, or try a summer camp. You can also study an instrument
  with the institute. Anyone can attend the public concerts or sign up for the newsletter.
