first_step:
  how: Submit the online application for the program you want (docent, special events, Volun-TEENS or
    internship), then wait for the email that schedules your interview.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Every program needs an online application, an interview, clearances and training before the first
    shift.
  what_to_expect: After the interview you finish paperwork, a PA criminal background check and a child
    abuse clearance, plus fingerprinting if you lived outside Pennsylvania in the past 10 years. Next
    comes online orientation and onsite training that includes a zoo tour, and then you sign up for shifts.
    Most volunteer roles ask for a one year commitment.
  first_visit_tips:
  - 'Apply for a program that fits your age: docents are 21 and up, Volun-TEENS are 14 to 17, and special
    events take 13 and up for family events.'
  - Plan for paperwork before your first shift, since shifts open only after you are cleared.
  - Ask the zoo about the background check for special events, because the page gives two different answers.
  - Most programs ask for a one year commitment, so decide before you apply.
