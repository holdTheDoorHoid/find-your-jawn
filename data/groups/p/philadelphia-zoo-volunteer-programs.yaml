summary: The Philadelphia Zoo runs several volunteer programs, from docent training to shifts at special
  events and internships in animal care and conservation education.
what_you_do: Train as a docent to lead visitor tours (21 and up, with about 50 service hours a year),
  work shifts at special events (13 and up for family events), join the teen Volun-TEENS program (14 to
  17), or take a college internship.
