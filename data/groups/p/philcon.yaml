first_step:
  how: Email volunteers@philcon.org before the convention with what you would like to help with, or go
    to the Crystal 1 office during the event and tell the first desk you want to volunteer.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The volunteer page says most roles need no experience and that the convention trains volunteers,
    and it gives two clear ways to start.
  what_to_expect: You can volunteer as much or as little as you like, and the volunteer page does not
    list shift lengths. Before the event you might help with publicity, proofreading or programming. During
    the event you could staff registration or the office, help with tech for the main stage, or work at
    the art show, gaming room or con suite. Each volunteer signs a liability release, and department heads
    sign off on an hours log.
  first_visit_tips:
  - Download the volunteer release form from the volunteering page. Minors need a parent or guardian to
    sign it.
  - Keep your hours log current, since department heads sign off on your hours.
  - Hotel parking is free and mostly covered, according to the FAQ.
  - If you are under 16, come with a parent or legal guardian, as the FAQ requires.
