summary: A science fiction, fantasy and horror convention run by the Philadelphia Science Fiction Society,
  a nonprofit. It turns 90 in 2026 and depends on volunteers to staff its art show, stage tech, registration,
  gaming room and con suite.
what_you_do: Before the convention, volunteers help with publicity, social media, program planning or
  proofreading. During the convention, volunteers staff registration, run stage tech, load equipment in
  and out, and help with the art show, masquerade, green room, con suite and gaming room.
