  what_to_expect: Kids and teens join a program at the Sixth Man Center on Wissahickon Avenue, such as
    a basketball academy, a camp, a clinic or a recreation night. Summer camps run weekdays from 8 am
    to 5 pm and are priced by the week, with scholarships available. The site does not describe what a
    first practice or rec night is like, so ask the staff before the first day.
  first_visit_tips:
  - Check the Programs page for the age or grade range, since each program lists its own.
  - Ask about the sliding scale before you register, because fees depend on household income.
  - The site does not name a nearby SEPTA stop, so check a transit map before you go.
  - Use the accessible spaces in the lot behind the building if you need them.
