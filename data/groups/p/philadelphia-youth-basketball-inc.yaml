summary: Basketball, learning and mentoring programs for children and young people in Philadelphia, from
  kindergarten up to age 29, with summer camps, holiday clinics and job skills training for older teens
  and young adults.
what_you_do: Kids join basketball academies, camps and clinics, and teens can take part in recreation
  nights, business workshops or trades training. Older teens and young adults can also get mentoring and
  work-based learning. Volunteers can help at cleanups, speak as guests, keep score or referee, or serve
  on a planning committee.
