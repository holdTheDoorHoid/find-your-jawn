first_step:
  how: Come to a monthly meeting at the McLean Library, doors open at 6 pm. For a Zoom meeting, email
    philbotclub@gmail.com by 10 pm the day before to get the link.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The meetings page says the talks are open to the public and that all are welcome, and it explains
    how a non-member can request the Zoom link.
  what_to_expect: Doors open at 6 pm, and a short business meeting comes first. A guest speaker gives
    the talk from about 6:30 pm, and the room closes around 7:30 pm. Some people stay on for an optional
    dinner at a restaurant across the street.
  first_visit_tips:
  - Check the meetings page first, since some evenings are Zoom only or hybrid.
  - To join, pay online or mail the membership form to the club's mailing address, which the membership
    page gives.
  - Arrive around 6 pm, when doors open.
