summary: Plant lovers who have met since 1891 to learn about the region's plants. The club hosts free
  botany talks at monthly meetings from September to May, and it also runs volunteer-led field trips and
  publishes a yearly journal.
what_you_do: Come to a free monthly talk, join a volunteer-led field trip, or join as a member for the
  journal Bartonia and member events.
