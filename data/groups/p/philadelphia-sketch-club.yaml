summary: An artists' club on South Camac Street that runs weekly figure drawing open studios six days
  a week. Anyone can come for a small fee, and members pay less. Some sessions use a nude model.
what_you_do: Bring your own supplies and draw from a live model at a weekly open studio. Monitors collect
  the fee after the first twenty minutes.
