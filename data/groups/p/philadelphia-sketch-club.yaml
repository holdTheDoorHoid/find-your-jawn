  what_to_expect: Each session runs three hours. Most sessions use a nude model, and the Thursday afternoon
    session uses a costumed model. Tipping the models is encouraged.
  first_visit_tips:
  - Bring your own supplies and cash, since monitors collect the fee after the first twenty minutes.
  - Check sketchclub.org before you go, because sessions close on holidays and during bad weather.
  - Turpentine is not allowed; only odorless solvents are, and you must take them with you.
