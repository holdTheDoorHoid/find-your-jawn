first_step:
  how: Call 215-765-5118 or use the contact form on the contact page of centeronline.com to ask about
    the program you want. Volunteers can use the volunteer form on the site.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The site has a program list open to people with disabilities, a contact form and a phone number.
    The eligibility document it links needs a sign-in to read, so the full steps to join are not known.
  what_to_expect: The site does not say how long a session lasts or what a first day looks like. It says
    participants receive equipment, instruction and training, and volunteers help at cycling and rowing
    days.
  first_visit_tips:
  - Ask which program fits you first, since the site lists adult and youth programs separately.
  - The Boathouse at 1233 Martin Luther King Jr Drive has bike racks and free parking, according to the
    volunteer page.
  - The eligibility document needs a Google sign-in, so ask the office for a copy if you need one.
