schedule:
  text: About 13 programs run through the year, and rowing runs May to October. Dates and times vary by
    sport, so check each program page. Volunteer cycling days are Saturday mornings in Philadelphia and
    Sunday afternoons in Chester County, April to October, weather permitting.
