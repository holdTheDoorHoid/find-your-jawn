summary: A Philadelphia nonprofit for people with disabilities. It runs about 13 sport and wellness programs
  year round, including rowing, cycling, kayaking, skiing, climbing, sitting volleyball, yoga and youth
  track and field.
what_you_do: Join one of the sport and wellness programs, such as rowing, cycling, kayaking or youth track
  and field, or volunteer on cycling and adaptive rowing days.
