summary: A woodshop in Philadelphia where beginners and experienced woodworkers take classes, use the
  shop with a membership, and send kids to workshops and summer camps.
what_you_do: Take a one-day or evening class, learn the tools in an intro session, or join as a shop member.
  New members complete a safety certification before using the shop. There is a women-only shop introduction.
