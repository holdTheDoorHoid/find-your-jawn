first_step:
  how: Sign up for a beginner class on the class calendar. Classes do not need a membership.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The shop lists several intro sessions for beginners and says classes need no membership or safety
    certification, but the site does not describe drop in visits.
  what_to_expect: A full-day intro class runs about eight hours, with an instructor, on the shop's professional
    tools. The women's intro includes a cutting board made from rough lumber in the morning and turning
    on a lathe in the afternoon, and you take home several finished pieces. Materials cost extra on top
    of tuition.
  first_visit_tips:
  - Plan for a full day, since the intro classes run about eight hours. The class page does not say whether
    lunch is included, so ask when you call.
  - The shop has private off-street parking, and the Ivy Ridge SEPTA stop is across the street.
  - You can reschedule a class only if you ask at least 14 days before it starts.
  - Call (267) 331-5880 or email the shop to ask what to bring or wear, since the class pages do not say.
