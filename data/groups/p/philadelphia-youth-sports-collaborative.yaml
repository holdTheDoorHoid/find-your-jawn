first_step:
  how: Open the Find A Provider member map, pick a sport tab, and contact a program from its own website.
  drop_in: false
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: Families can search the member list and contact programs with no sign up, and the trainings ask
    for a simple email to join.
  what_to_expect: The member map lists programs by sport and links to each program's own website. It does
    not show addresses, schedules, ages or fees, so families check each program before signing up. Coaches
    and volunteers can join free trainings on topics such as first aid, mandated reporting and trauma
    informed coaching.
  first_visit_tips:
  - Choose a sport tab first, since the map filters by sport only.
  - Check each program's own website for ages, schedule and fees.
  - The city's Program Locator covers city run recreation by age, activity, location and season.
