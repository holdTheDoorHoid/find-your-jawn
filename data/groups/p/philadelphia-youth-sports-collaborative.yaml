summary: A network of more than 170 youth sports programs across Philadelphia. It trains coaches and referees,
  shares safety guidance, and helps families find a sports program near home. It also works with the city
  on accessible recreation.
what_you_do: Families can search the member map by sport, then contact a program from its own website.
  Coaches, staff and volunteers from member groups can take free trainings (email membership@pysc.org).
  Groups can apply to join the network for free through its Apply Now form.
