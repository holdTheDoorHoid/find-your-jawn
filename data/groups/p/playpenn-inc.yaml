  basis: The classes page welcomes theatre makers of all experience levels, and each class has a Register
    link. No auditions or applications are listed for classes, though one course is named as advanced.
  what_to_expect: Classes are paid online courses on playwriting and stage craft, with a start date and
    a Register link for each course. The pages read did not give class length, weekly times, or how many
    people are in a class.
  first_visit_tips:
  - Check the Register page for each class's level, length and times, since the class list does not show
    them.
  - Read the refund policy and ask about a payment plan before you pay.
  - Most classes are online, so plan on a quiet place to work and a reliable internet connection.
  - Call PlayPenn at 267-807-8234 with questions before you register.
