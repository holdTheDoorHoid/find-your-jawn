first_step:
  how: Come to a meeting as a guest, free and as often as you like. To ask questions first, use the contact
    form on the club's website.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: Guests are explicitly welcome and can attend free as often as they like before joining. The site
    also asks newcomers to arrive a few minutes early.
  what_to_expect: Meetings usually start on time, so arrive a few minutes early to meet members. The club
    learns by doing, and members build skills at their own pace in a social, friendly room with a mix
    of people. Street parking is on most nearby streets, but read the signs.
  first_visit_tips:
  - Arrive a few minutes early so you can meet members before the meeting starts
  - Bring nothing special, since guests need not bring anything
  - Read the parking signs on nearby streets before you park
