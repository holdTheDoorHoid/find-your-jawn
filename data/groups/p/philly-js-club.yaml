first_step:
  how: Pick the next talk or hack night on the events page and go; if its listing has an RSVP link, use
    it first. You can also fill in the sign-up form linked from the Join Us page.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The About page says the club is for developers of all skill and experience levels, and the Join
    Us page links a sign-up form. Some listings link to RSVP pages.
  what_to_expect: Meetings are usually once a month, most often on a Thursday, at Indy Hall. Expect a
    short talk on a web tool or framework, time to meet other developers, and, at some meetings, a hack
    night or a showcase of what members built. The events page does not give start times, and some listings
    use RSVP pages.
  first_visit_tips:
  - Check the events page for the date, and whether the listing asks you to RSVP.
  - If you go to a hack night, bring a project or idea you want to work on.
  - The events page does not give street addresses or start times, so email organizers@phillyjs.com before
    you go if you need them.
