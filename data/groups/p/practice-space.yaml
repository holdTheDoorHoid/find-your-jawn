summary: A theater collective that makes plays, a podcast and performance projects about social and economic
  change, including stories from Philadelphia schools. It also runs creative workshops and storytelling
  circles for organizations.
what_you_do: Organizations, workplaces and schools book its creative workshops, storytelling circles,
  or a live performance of its piece about collective action. The group also makes a podcast with Philadelphia
  students and educators.
