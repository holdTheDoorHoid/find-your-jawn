summary: A West Philadelphia nonprofit that offers mentoring, tutoring, food help and life skills to youth,
  families and older adults, with a focus on young people affected by violence.
what_you_do: Pick a program from the Get Help page, or call to ask which one fits. Services run at partner
  sites such as recreation centers and libraries. Volunteers sign up through a form on the Volunteer page,
  which lists about 40 roles from event helpers to youth mentors and grant writers.
