first_step:
  how: Sign up for a shift on the VolunteerHub portal linked from the volunteer page, or make Notes of
    Sunshine cards at home and mail them to 3616 S. Galloway Street.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Shift sign-up is public online and by email, and the cards can be made from home. The volunteer
    pages do not describe an orientation before a first shift.
  what_to_expect: A warehouse repacking shift means packing and sorting food at the Hunger Relief Center
    in South Philadelphia, in the morning or afternoon. Friends, family and coworkers can sign up as a
    group through a separate form. The pages do not say how long a shift runs, what to wear, or whether
    there is training before a first shift.
  first_visit_tips:
  - Sign up through VolunteerHub before you come, since shifts are booked online.
  - Groups of friends, family or coworkers can book together through the group form.
  - The pages do not list parking or entry details, so call (215) 339-0900 before a first shift.
