summary: A regional food bank that supplies community partners across Philadelphia and nearby counties
  in Pennsylvania and New Jersey. Volunteers can pack and sort food, cook in its community kitchen, or
  make cards from home.
what_you_do: Sign up for a packing and sorting shift, help prepare meals in the community kitchen, or
  make cards for the Notes of Sunshine project and mail them to the volunteer department.
