first_step:
  how: Join a first-Thursday meeting at 7:30 pm in Media or by video, then ask for a membership form.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Monthly meetings are open and can be joined by video, and the site has a New Cavers page, but
    the site does not say whether guests can come along or what a first trip is like.
  what_to_expect: A first visit is the monthly evening meeting, from 7:30 to 9:30 pm on the first Thursday,
    in person in Media or on video, and the site says you get a membership form there. Caving is physically
    demanding, and the site says beginners should go with experienced cavers and that members should be
    fit, healthy, sober and properly equipped. The site does not say whether guests can attend or what
    a first trip is like.
  first_visit_tips:
  - 'If you plan to go caving, wear synthetic layers: caves stay around 55 degrees Fahrenheit with near
    100 percent humidity.'
  - Check the club's Equipment page before any cave trip, since the site links to one.
  - Go on trips with experienced cavers, as the site advises for beginners.
