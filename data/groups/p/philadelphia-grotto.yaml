summary: A caving club founded in 1947 and part of the National Speleological Society. Members care for
  caves, explore them, teach others and do research.
what_you_do: Attend the monthly meeting, learn caving from members, and go on trips with more experienced
  cavers. The club also guides youth groups on caving trips.
