summary: A community kitchen at 1149 South 9th Street that cooks free meals for people in need and runs
  a community fridge. A 2023 news report described daily volunteer kitchen shifts.
what_you_do: A 2023 news report said kitchen volunteers unload deliveries, cook, and hand out meals beside
  a trained chef. The group's website lists office help, garden plot care, and special-event help for
  group and corporate volunteers.
