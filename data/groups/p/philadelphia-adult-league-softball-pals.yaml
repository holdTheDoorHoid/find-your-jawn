  newcomer_friendliness: 2
  basis: The current season is full, so the only way in is a waitlist by email, and players must register
    as a team or as a free agent.
  what_to_expect: Games are on weeknight evenings and Sunday days at the Tiffany Fletcher Rec Center,
    in two ten-game seasons with a single-elimination playoff. Umpires are provided, and every team is
    guaranteed at least one playoff game. Teams get 15 shirts and a scorebook when the season begins.
  first_visit_tips:
  - Men use wooden softball bats only. Women and non-binary players need USA or ASA approved bats.
  - Wear plastic or molded cleats, since metal cleats are not allowed.
  - There is ample free street parking around the rec center.
  - Teams need four or more women or non-binary players, counting the roster and the field.
