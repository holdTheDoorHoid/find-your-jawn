summary: A large animal shelter and rescue with a Philadelphia headquarters on Erie Avenue. It places
  animals in foster homes and welcomes adult volunteers for animal care, adoption events and special events.
what_you_do: Volunteers socialize dogs and cats, help at adoption and special events, or support office
  work. Foster homes care for animals until they are adopted, and the shelter provides food, supplies
  and vet care at no cost.
