first_step:
  how: Choose the Philadelphia headquarters on the volunteer page and apply online through Volgistics.
    You must be 18 or older.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The volunteer application is online, and the shelter holds public adoption and fundraising events
    where you can see the work first. The page does not state how long training lasts.
  what_to_expect: Expect an online application for the location you pick, then training. Once trained,
    volunteers must work with minimal supervision, and the roles include dog or cat socialization, adoption
    and special events, and office support. The pages do not state training length or hours per week.
  first_visit_tips:
  - Expect animal dander and cleaning chemicals in the work areas, and be ready for an emotionally charged
    setting, as the volunteer page warns.
  - Public adoption and special events are a way to see the shelter before you apply.
  - Volunteers must be 18 or older.
