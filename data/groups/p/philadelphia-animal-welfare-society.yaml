  basis: The volunteer page lists roles and how to apply, and the foster page explains the sign-up form
    and onboarding video
  what_to_expect: Volunteers start with an application, and the site does not say what orientation includes
    or how long a shift lasts. Fostering comes with medical care paid by PAWS and supplies if you want
    them, but you provide a safe, separate space for cats and a way to keep dogs apart from resident pets.
    Typical foster stays run three to eight weeks or longer.
