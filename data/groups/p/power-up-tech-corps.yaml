first_step:
  how: Check the program page for the volunteer application, which is closed for now because volunteer
    spots are full. When it reopens, fill it in and take the 20-minute screening call. Questions about
    reopening can go to digital.equity@phila.gov.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: A volunteer application, a 20-minute screening call and background checks come first, and the
    application is closed with no reopening date.
  what_to_expect: Before any placement you take a 20-minute screening call that matches you to a role.
    You then submit the background checks and complete an orientation that is offered regularly through
    Teams. Last, you meet your site supervisor, confirm your schedule, and finish any site or city training
    your role needs.
  first_visit_tips:
  - If you are 14 to 17, you need a parent or guardian's permission.
  - Some partner sites also ask for an FBI check. Pennsylvania residents who have lived here more than
    10 consecutive years can ask for it to be waived.
  - Watch the program page for the reopening date, since the page gives none.
