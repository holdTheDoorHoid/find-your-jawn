summary: A City of Philadelphia volunteer program that helps residents build online skills, like applying
  for jobs online and getting in touch with family. Volunteers work in libraries, rec center computer
  labs and community sites.
what_you_do: Monitor a computer lab, help a City Digital Navigator in a class, or teach a lesson from
  the city's digital skills curriculum. No advanced tech skills are needed, because training is provided.
