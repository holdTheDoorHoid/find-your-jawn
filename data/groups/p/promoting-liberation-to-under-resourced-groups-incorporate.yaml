summary: A Philadelphia group that connects people with fewer resources to schooling, jobs, money skills,
  and wellness help. Its youth program, the Blueprint Social Development Institute, gives high school
  students mentors and a look at careers.
what_you_do: Teens in the Blueprint program learn career readiness, money skills, crisis mediation, and
  trade skills. Community members can ask to be connected to services through the Get Plugged In page.
