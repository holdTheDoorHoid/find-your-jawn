summary: A community group for Point Breeze in South Philadelphia. It holds a monthly meeting, runs committees
  on housing, jobs, safety, quality of life and youth, and is a City registered community organization
  that talks over zoning and development plans.
what_you_do: Members follow zoning and development plans in the area and meet to talk them over. Pick
  a committee on housing and land use, business and jobs, safety, quality of life, history and culture,
  youth services, or community organizing and advocacy.
