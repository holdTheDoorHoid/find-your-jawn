summary: A nonprofit that teaches capoeira, a Brazilian style that blends fighting moves, music, dance
  and acrobatics, to people of all levels. It also runs kids classes, arts programs in schools and libraries,
  and public events such as Brazilian Day Philadelphia.
what_you_do: 'Take a weekly class at the Race Street studio: all-levels classes on weeknights, or Saturday
  classes split by age for kids from age 4 and up. Private lessons, workshops and performances can be
  booked, and donations are accepted. The site lists no volunteer or membership programs.'
