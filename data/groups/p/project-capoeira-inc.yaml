summary: A nonprofit that teaches capoeira, a Brazilian style that blends fighting moves, music, dance
  and acrobatics, to people of all levels. It also runs kids classes, arts programs in schools and libraries,
  and public events such as Brazilian Day Philadelphia.
what_you_do: Take a weekly class at the Race Street studio (all levels, or kids on Saturdays from age
  4), or book a private lesson, workshop or performance. Public events are also listed, and donations
  are accepted. The page lists no volunteer or membership programs.
