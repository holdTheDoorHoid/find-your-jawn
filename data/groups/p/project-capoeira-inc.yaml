schedule:
  text: 'Weekly classes at the Race Street studio. Monday and Wednesday from 6:30 to 8 pm and Tuesday
    and Thursday from 6 to 7:30 pm are all-levels classes. Friday from 6:30 to 8 pm is open gym, kicks
    and roda (the playing circle). Saturday classes are split by age: ages 4 to 6 from 12:20 to 1 pm,
    ages 7 to 12 from 1 to 2 pm, and all levels from 2 to 3:30 pm.'
