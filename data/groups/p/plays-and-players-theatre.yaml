first_step:
  how: Buy a ticket through the link on a public show, comedy night or open mic listing on the site. To
    join as a member, fill out the membership application linked from the membership page.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Shows, comedy nights and open mics are open to the public with posted dates and ticket links,
    and membership applications are reviewed by a committee each month.
  what_to_expect: Many nights start at 8 pm at Quig's Pub, which is part of the building at 1714 Delancey
    Place, and shows are ticketed through links on the site. The site does not say how long a night runs,
    what the seating is like, or what to wear. Membership gives access to the pub and to member events.
  first_visit_tips:
  - Buy your ticket through the link on the event listing before you arrive.
  - The site does not give parking, transit or step-free access details, so plan your route to 1714 Delancey
    Place ahead of time.
  - If you want to join, compare the three membership tiers on the membership page first.
