first_step:
  how: Check the events page for the next listed reception (the next one is Saturday, November 14, 2026,
    3 to 5 pm, at 6401 Germantown Avenue), or sign up for the newsletter to hear about new shows.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Shows, openings and some free events are listed publicly, and the newsletter is a clear way to
    hear about them. There is no membership or volunteer route on the current site, and the site does
    not say whether every opening is open to walk-ins.
  what_to_expect: Shows are held in historic houses and sites, and an opening is a few hours long. Past
    events included artist talks, walks and family days. The site does not say how long a show stays up
    or what the visiting hours are, so check the events page for each show before you go.
  first_visit_tips:
  - Look up the venue address on the event listing, since shows move between historic houses and sites.
  - Ask ahead about visiting hours, because the site does not list them.
