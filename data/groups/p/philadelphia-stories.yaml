summary: A nonprofit that publishes a free literary magazine every quarter and runs writing masterclasses,
  contests and readings for writers and readers in the Philadelphia area.
what_you_do: Read the free magazine or sign up for the newsletter. Writers who live in or come from Pennsylvania,
  Delaware or New Jersey can submit fiction, poetry, nonfiction or art. You can also take a paid masterclass
  in novel writing or poetry. A pitch event called Pitch Fest is planned for 2027.
