  newcomer_friendliness: 3
  basis: Anyone can read the free magazine and subscribe to the newsletter, and the site gives a clear
    route for writers to submit. There is no in-person visit, and masterclasses are paid.
  what_to_expect: The site has no in-person visit to plan for. The magazine is free to download, and submissions
    have no reading fee. Paid online masterclasses in novel writing and poetry are booked through separate
    ticket pages.
  first_visit_tips:
  - Read the submission guidelines before you send work, since submissions are open to writers and artists
    who live in, grew up in, or have lived in PA, DE or NJ.
  - The window for the Winter/Spring 2027 issue opens November 15, 2026 and closes February 1, 2027, as
    the page prints it.
