schedule:
  text: Open for the season, usually May to late October, weather permitting. Dig nights are most Wednesday
    nights in season, followed by a barbecue. Ladies-Only and 5 and Under sessions run from 10 am to noon
    before the track opens, with dates posted on the group's social media. Pumpjam, the season kickoff,
    is usually the first Saturday in May.
