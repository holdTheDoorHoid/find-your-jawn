summary: A bike pump track on Parkside Avenue in West Fairmount Park, where riders practice on a looping
  course. Volunteers keep the track in shape at dig nights, most Wednesday nights in season.
what_you_do: Ride when the track is open, after signing the waiver on arrival (a parent or guardian signs
  for riders under 18). Volunteers can join dig nights, where gloves and tools are provided.
