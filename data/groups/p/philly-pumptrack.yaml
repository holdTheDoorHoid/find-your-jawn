first_step:
  how: Visit during open hours or on a dig night and sign the waiver on arrival. Under 18s need a parent
    or guardian to sign, and the form can be downloaded ahead of time.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The site says newcomers can simply show up to dig nights, where gloves and tools are provided,
    and riders sign a waiver at the track.
  what_to_expect: Dig nights are a work session on the track followed by a barbecue, and the group says
    new and old volunteers are both welcome. For riding, you sign the waiver on arrival and ride while
    the track is open.
  first_visit_tips:
  - Download the waiver ahead of time or sign it on arrival.
  - Under 18s need a parent or guardian to sign.
  - Dig nights provide gloves and tools, so you do not need your own.
