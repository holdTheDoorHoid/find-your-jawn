summary: A nonprofit bike park on Parkside Avenue with a beginner loop and a larger track with several
  lines. Volunteers keep the track and bikes in shape, and the group also runs dirt jump sessions and
  summer camps.
what_you_do: Come to a volunteer dig night, usually on Wednesday evenings, to help build and fix the dirt
  track. Gloves and tools are provided.
