first_step:
  how: Find your nearest park on the map on the city's Park Friends groups page, then contact that group
    directly.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Any resident can find a group on the city map or call the city's Stewardship Office, but the
    page does not list each group's sign-up steps.
  what_to_expect: What a first visit looks like depends on the group you pick. Typical activities include
    park cleanup and beautification days, fundraisers, recreation and education programs, and advocacy
    for park improvements. The city page does not list age rules, waivers or supplies, so ask the group
    about those.
  first_visit_tips:
  - Use the map to find the group that covers your park, since each group runs its own events.
  - Ask the group what to wear or bring, because the city page does not list supplies.
  - Ask about age rules before bringing children.
