summary: A husband and wife team, a dancer and a composer, who make new dance works about social issues,
  mixing live jazz, projections and jazz dance improvisation.
what_you_do: Come to a performance and stay for the open conversation with the artists afterward. The
  group also runs Free Form Body Motif workshops in its jazz dance improvisation method, and you can ask
  about the next one through the contact form.
