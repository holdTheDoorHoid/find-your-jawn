first_step:
  how: Check the upcoming performances and workshops on the site, then send a message through the contact
    form, choosing Other, to ask when the next workshop or show is.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The site listed no upcoming performances or workshops when we checked, and it does not say how
    to sign up for a workshop, so the way in is unclear.
  what_to_expect: The group makes new dance works about social issues, with live jazz, projections and
    jazz improvisation. Performances are followed by an open conversation between the artists and the
    audience, so you may be invited into the discussion. Recent shows were presented by Philadelphia Dance
    Projects, and the site does not give run times or ticket prices.
  first_visit_tips:
  - Look for the presenter's ticket page for a show, since recent shows were sold through Philadelphia
    Dance Projects.
  - Call 267-713-9783 to ask about upcoming workshops. The site lists this number for bookings and publicity.
  - Plan to stay after the show, since the artists hold an open conversation with the audience.
