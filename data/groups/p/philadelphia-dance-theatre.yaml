summary: A classical ballet school and performing company in Mount Airy, founded in 1998. Its training
  runs from preschool through adult classes, and its company dances an annual Nutcracker and a spring
  new-works show.
what_you_do: Take the free trial class, then enroll in ballet classes for ages 3 and up. Boys who take
  ballet can join the tuition-free boys' program, or come to the company's Nutcracker and spring shows.
