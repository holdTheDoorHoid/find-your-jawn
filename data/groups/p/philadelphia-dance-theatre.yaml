first_step:
  how: Fill out the trial class form on the website to get a class recommendation, take the free trial
    class, then get placed in a level and register through the studio's Dance StudioPro portal.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: 'The studio has a set path for newcomers: a free first class, a recommendation form, and faculty
    placement. Classes are open to the public, and the site explains each step.'
  what_to_expect: The free trial class lets a dancer try the studio while faculty choose the right level
    and classes. Afterward, faculty suggest a schedule, and you register online through the studio's portal.
    Classes are grouped into preschool, primary, pre-professional, and adult divisions.
  first_visit_tips:
  - Fill in the trial class form before you come, since it starts the class recommendation.
  - Check the dress code page before the trial class, and contact the office about anything the site does
    not cover.
  - Parking and transit are not listed on the site, so ask the office before your first visit.
