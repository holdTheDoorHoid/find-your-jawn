cost:
  level: paid
  text: The first class is free. Monthly tuition runs from $95 for pre-ballet to $475 for the top levels,
    billed over nine months from September to May, plus a $50 registration fee per student each year.
    Siblings get 15 percent off family tuition. Boys in the tuition-free program pay no tuition when they
    meet its weekly class minimums, but they still pay the $50 registration fee.
