schedule:
  text: 'Ballet classes run through the school year in four divisions: preschool (ages 3 to 6), primary
    (ages 7 to 12), pre-professional (ages 13 to 18), and adult (18 and up). Class times are posted as
    an image on the class schedule page, so call the studio to read them. The company performs A Philadelphia
    Nutcracker each December and a spring new-works show.'
