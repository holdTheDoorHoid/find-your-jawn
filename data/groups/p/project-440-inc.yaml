summary: A nonprofit that runs creative leadership and college and career programs for young people in
  Philadelphia. In its semester program, teams plan arts-focused service projects in their neighborhoods.
what_you_do: Young people register for Doing Good, a semester-long afterschool program where teams plan
  arts-focused service projects, or for Instruments for Success, a six-week college and career readiness
  program. Past participants can join the Youth Advocacy Council. The site lists no volunteer roles.
