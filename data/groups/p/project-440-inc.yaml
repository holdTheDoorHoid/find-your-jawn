first_step:
  how: On the Doing Good page, click Apply for Doing Good and fill in the online form. Seniors can use
    the Instruments for Success form instead.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: You must apply through an online form before you can take part. Doing Good is limited to 30 students
    per semester, and the page does not say how students are chosen.
  what_to_expect: Doing Good starts with a few weeks of skills such as budgeting, marketing and event
    planning. Teams then pitch an arts-focused service project to a panel of experts and receive up to
    $500 to carry it out. Sessions meet Monday and Thursday from 4:30 to 6:30 pm, and students who meet
    the attendance rules earn a stipend at the end of the semester.
  first_visit_tips:
  - Ask for a SEPTA pass if you need one, since the program provides them.
  - Meals are provided, according to the site.
  - Several SEPTA lines and buses stop within one block of the Temple campus at 1515 Market Street.
  - Send travel questions to Marcus Bryant at mbryant@project440.org.
