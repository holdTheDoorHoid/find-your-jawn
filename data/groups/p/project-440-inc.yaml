summary: A nonprofit that runs creative leadership and college and career programs for young people in
  Philadelphia. In its semester program, teams plan arts-focused service projects in their neighborhoods.
what_you_do: Young people apply to Doing Good, a semester program where teams plan an arts-focused service
  project, or to Instruments for Success, a fall program that helps high school seniors with college and
  career applications. Alumni and School District of Philadelphia students can also join the Youth Advocacy
  Council, which meets twice a month and pays a stipend.
