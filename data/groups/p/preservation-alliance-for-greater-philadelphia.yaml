summary: A nonprofit that works to protect Philadelphia's old buildings and neighborhoods. Its volunteer
  guides lead walking tours on weekends from May into November, each one covering a different part of
  the city.
what_you_do: Buy a ticket for a walking tour, usually led by a volunteer guide, or train to become a volunteer
  guide. Guides attend training and pass a written certification exam.
