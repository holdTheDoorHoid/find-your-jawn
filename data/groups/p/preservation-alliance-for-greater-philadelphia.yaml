first_step:
  how: Open the upcoming tours page, choose a tour, and click Register to buy a ticket in advance. To
    ask about becoming a guide, email info@preservationalliance.com or call 215-546-1146.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Public tours are open to anyone who buys a ticket in advance, and each listing has a Register
    button. Becoming a guide takes training and a written exam, so that path is less open.
  what_to_expect: A public tour usually runs 1.5 to 2 hours, rain or shine. A volunteer guide leads the
    group and talks through a headset, and you hear through an earpiece or through your own wired headphones.
    Bring water and wear comfortable clothing.
  first_visit_tips:
  - Check the meeting spot on the tour's listing before you go, since it changes from tour to tour.
  - Bring wired headphones with a standard headphone jack if you want your own. Bluetooth headphones and
    Apple's own headphone jack do not work with the tour audio.
  - Dress for the weather, because tours run rain or shine.
