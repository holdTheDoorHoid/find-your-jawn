first_step:
  how: Fill out the volunteer interest form on the center's Volunteer page, or call (267) 416-9453 to
    ask about volunteering and the wait-list.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Volunteers apply through an interest form and go on a wait-list because the center is at capacity,
    and the page gives no timeline.
  what_to_expect: 'Volunteers are adults, 18 and older, who take a regular four-hour shift each week all
    year. The work is mostly care: preparing food, feeding, cleaning cages, dishes, and laundry, with
    some help for clinic staff. Visits are by appointment only, so call before you come.'
  first_visit_tips:
  - Call (267) 416-9453 or email info@phillywildlife.org before you visit, since admission is by appointment.
  - Ask about the wait-list and shift times when you call, because the site does not give either.
  - Call staff before you bring in any injured or orphaned animal, since the center asks for a call first.
