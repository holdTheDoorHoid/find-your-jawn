summary: A licensed wildlife rehabilitation center that takes in injured and orphaned wild animals from
  Philadelphia and nearby counties. Its volunteers do much of the daily feeding and cleaning.
what_you_do: Prepare food, feed the animals, clean cages, and wash dishes and laundry on a regular weekly
  shift. Some volunteers help clinic staff with animal care.
