first_step:
  how: Email info@philmfactory.org to ask when the next beginner class opens. The spring 2026 applications
    were due by March 24, 2026.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: Beginner classes are written for total beginners, and each class page has an application form
    to fill in before you start.
  what_to_expect: Each beginner course runs about six weeks in weeknight sessions, and students make a
    short film or script as a group. Payment is due up front or on an installment plan, and the intro
    film course starts with a mandatory orientation. Studio days happen in Clifton Heights, so plan your
    own ride, and the adult courses are for people 18 and older.
  first_visit_tips:
  - Bring a laptop or tablet if you have one, since the intro course calls it highly recommended.
  - Bring a notebook, folders and pens.
  - Plan your own ride to the studio days in Clifton Heights, PA.
  - Plan to attend the mandatory orientation at the Cambridge Innovation Center, 3675 Market St, 8th floor.
