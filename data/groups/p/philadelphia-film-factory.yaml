cost:
  level: paid
  text: Beginner classes are paid courses, and each round sets its own price. The 2026 Intro to Filmmaking
    page listed $1,250, or $1,000 for paying in full early, and the Intro to Screenwriting page listed
    $500. Take One offers paid internships.
