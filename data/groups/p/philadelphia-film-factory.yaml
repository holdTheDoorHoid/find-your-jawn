summary: A film education group for local independent filmmakers. It runs beginner classes on making films,
  writing scripts and acting on camera, plus Take One, a youth film program that offers paid internships.
what_you_do: Take a beginner class such as Intro to Filmmaking or Intro to Screenwriting, come to a networking
  event, or ask about Take One, the youth program with paid internships.
