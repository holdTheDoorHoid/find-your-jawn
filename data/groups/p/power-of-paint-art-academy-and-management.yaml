summary: A nonprofit art academy that teaches painting to children in paid workshops and runs paint parties.
  It describes its approach as trauma-informed arts education for young people and their communities.
what_you_do: Sign a child up for a multi-week painting workshop (you pay to reserve a spot), book a paint
  party, or apply to volunteer through the online form on the volunteer page. The volunteer form includes
  a background check.
