summary: A nonprofit art academy that teaches children to paint in multi-week workshops and books paint
  parties for birthdays and other events. It describes its teaching as trauma-informed arts education.
what_you_do: Sign a child up for a multi-week painting workshop (you pay to reserve a spot), book a paint
  party, or apply to volunteer through the online form on the volunteer page, which asks whether you are
  willing to submit to a background check.
