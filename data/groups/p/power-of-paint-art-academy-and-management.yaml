first_step:
  how: Email help@popartacademy.org or use the contact form to ask about the next children's workshop
    and whether adults can join. To volunteer, use the application form on the volunteer page.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The children's workshops are described as suited to beginners and can be reserved online, but
    the site does not say whether adults can join, so the way in for adults is unclear.
  what_to_expect: Each session runs about 2 hours, and the courses are built for new artists and for people
    coming back to art after a break. Students learn art history and the basics, and they work with acrylic,
    watercolor and oil on canvas. The course is paid in advance to reserve a spot, at $650 for the 5-week
    course or $1,300 for the 10-week course.
  first_visit_tips:
  - Ask about adult spots and session times when you email, since the site does not list them.
