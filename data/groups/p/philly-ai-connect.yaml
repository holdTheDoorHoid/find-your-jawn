summary: A Philadelphia community for people interested in artificial intelligence and machine learning.
  It runs talks, speaker sessions, workshops, and networking, and welcomes volunteers and speakers.
what_you_do: Attend talks, summits and hands on AI demos. Volunteer, speak or sponsor through the forms
  on the events page, and use the group's Meetup page to find out about upcoming events. The group describes
  open source work on Discord.
