summary: A Philadelphia nonprofit that has offered free lectures on Polish history, culture and tradition
  for more than 100 years. Anyone can attend the monthly talks from October to April at the Associated
  Polish Home, and some talks are also offered on Zoom.
what_you_do: Attend a monthly lecture, watch past talks on the group's YouTube channel, or join the mailing
  list for event news. The sign-up form may not be working yet.
