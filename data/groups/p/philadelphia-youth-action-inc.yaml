first_step:
  how: Call 215-867-9464 or email inspire@youthactionteam.org to ask whether applications for your grade
    are open this school year.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Each program asks students to apply through an online form, and the pages do not describe the
    selection or confirm that applications are open for the current year.
  what_to_expect: The pages do not describe a first session or an information night. Once in, students
    attend leadership sessions about twice a month, meet a mentor one on one, and help plan events, and
    Junior Youth Action students can log up to 20 hours of service. Volunteer trips to help local organizations
    happen about once a quarter.
  first_visit_tips:
  - Ask which program and application round are open, since the program pages still name the 2024 to 2025
    service year.
  - Ask where sessions meet, because the pages list only a P.O. Box.
  - Ask about costs and scholarship help, which the pages mention without amounts.
  - Ask whether a parent or guardian needs to take part in the application.
