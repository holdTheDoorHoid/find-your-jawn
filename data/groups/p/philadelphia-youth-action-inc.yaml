summary: A youth leadership group for middle and high school students in Philadelphia. It trains students
  in civic leadership, pairs them with mentors and funds student civic projects.
what_you_do: 'Students join one of three programs: Junior Youth Action for 7th and 8th graders, Inspiring
  Leaders for 9th and 10th graders (a two-year program), and Service Leaders for graduates of the first
  two. Adults can apply to be facilitators, who get training to coach and mentor students.'
