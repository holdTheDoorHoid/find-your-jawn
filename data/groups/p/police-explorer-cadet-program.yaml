summary: A program for teens considering a police career, teaching law enforcement skills through mentoring,
  classroom instruction and hands on training.
what_you_do: Train on Saturdays with mentoring, classroom lessons and drills, including tactical and agility
  training. Cadets also help at official events such as parades, memorials and charity runs, and can join
  optional summer camps.
