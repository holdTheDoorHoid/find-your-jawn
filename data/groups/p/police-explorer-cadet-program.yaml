first_step:
  how: Apply online at ppdexplorers.org, or download the PEC-991 paper pack, sign it and mail it to 8501
    State Road. Watch your email for a call from a recruitment officer, which the site says comes within
    five business days.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Teens need an application, a clean background check, a fitness and agility test, an interview
    and a yearly fee before they see the program, so the way in is clear but selective.
  what_to_expect: Cadets train on Saturdays from 10 am to 5 pm, with classroom lessons, mentoring and
    hands-on drills. They also help at official events such as parades and memorials. Applicants under
    18 need a parent or guardian at testing and interviews.
  first_visit_tips:
  - Check your email often after you apply, since physical assessment dates are sent there.
  - Applicants who are 14 must be enrolled in high school to apply.
  - Budget for the $50 yearly fee and about $350 for probation uniforms.
  - Keep Saturdays free, since training is mandatory from 10 am to 5 pm.
