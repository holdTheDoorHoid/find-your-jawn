first_step:
  how: Come to the third Saturday meeting at 9 am, at the Price Street Tot Lot in good weather or at Rittenhouse
    Soundworks otherwise. The next listed meeting is October 17, 2026.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: 'Meetings are open, and the site lays out a clear path: residents inside the boundaries join
    for free after attending one open meeting, but the welcome depends on living in the area.'
  what_to_expect: Expect neighbors from the blocks around Knox and Rittenhouse Streets. The group talks
    over zoning and development plans in the area and works with the City on renovating the Price Street
    play lot. On a first visit you can simply listen, and joining as a member is free.
  first_visit_tips:
  - Check the group's website calendar before you go, since the meeting place changes with the weather.
  - Bring your name, address, and a way to reach you if you want to register as a member.
  - Plan to arrive by 9 am, when the meeting starts.
  - Ask to be added to the email list to hear about changes between meetings.
