summary: If you care about what gets built near you, Price-Knox Neighbors Assn. is a City registered community
  organization in the Upper Northwest part of the city that hears about zoning and development proposals.
what_you_do: Members follow zoning and development plans in the area, meet once a month, and work through
  committees on streets and beautification, voting, safety, events, and the Price Street play lot.
