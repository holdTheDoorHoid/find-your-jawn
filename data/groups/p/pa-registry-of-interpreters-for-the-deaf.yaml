first_step:
  how: Sign up for a committee through the group's online form, or email membership@parid.org to ask about
    joining.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Committee sign-up and membership questions have clear public contacts, and non-members can register
    for the summit, but membership needs an application and the site does not say whether non-members
    may attend board meetings.
  what_to_expect: Its board and membership meetings are held on Zoom, and the November board meeting is
    conducted in ASL only, so you will need to register through the event page. The regional summit in
    Pittsburgh on October 9 and 10, 2026 is a two-day paid conference with workshops, and non-members
    can register at a higher rate than members.
  first_visit_tips:
  - Register through the event page, since the Zoom link comes in the confirmation email.
  - If you need access support, email recorder@parid.org before the accommodation deadline printed on
    the event page.
  - Ask about the free one-year membership if you recently earned a first national interpreter certification
    or graduated from a Pennsylvania interpreter training program.
