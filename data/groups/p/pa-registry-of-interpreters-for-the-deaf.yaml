summary: A volunteer-run Pennsylvania group that supports sign language interpreters and works to improve
  communication access for Deaf, hard of hearing, and DeafBlind people. It holds regional summits, board
  meetings, and an annual membership meeting, many of them on Zoom.
what_you_do: Sign up for one of four committees (communications, Deaf interpreters, emerging interpreters,
  or professional development) through the group's online form, attend a board meeting or the annual membership
  meeting on Zoom, or apply for membership online or on paper.
