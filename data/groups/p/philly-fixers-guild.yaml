first_step:
  how: Bring a broken household item to a Thursday evening Repair Fair at NextFab. Email the volunteer
    contact or join the Repair Fair list to hear about each fair.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: Fairs are open to anyone with an item to fix, and the group says volunteers without repair skills
    are welcome and that a Fixer guides you through the repair.
  what_to_expect: You stay with your item and do the troubleshooting yourself, with a volunteer Fixer
    guiding each step. Check-in happens at a triage table before the repair. The fair runs for two hours,
    from 6 to 8 pm, and costs nothing. Repairs are done by volunteers who are not necessarily licensed,
    and nothing comes with a warranty.
  first_visit_tips:
  - Bring the whole item and any spare part you already know you need.
  - Plan to stay for the repair, since dropping an item off is not allowed.
  - Join the Repair Fair email list to hear about each fair's date.
  - If you cannot make a fair, use the Ask a Fixer page to get advice on fixing the item at home.
