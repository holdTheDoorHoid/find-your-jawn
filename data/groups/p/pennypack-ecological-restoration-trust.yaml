summary: A land trust that cares for a nature preserve along Pennypack Creek in Huntingdon Valley, just
  over the city line from Northeast Philadelphia. Volunteers pull invasive vines off trees and help staff
  with restoration projects.
what_you_do: Free-A-Tree workdays cut invasive vines off trees on the first Saturday of the month, October
  through April. Service Day mornings work on an active restoration project with staff. Bring gloves and
  pruning shears, or borrow theirs.
