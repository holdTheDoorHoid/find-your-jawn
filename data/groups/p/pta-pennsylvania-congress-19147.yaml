summary: Parents, teachers and neighbors who support George W. Nebinger School. They plan school events,
  fundraisers and volunteer days, and anyone can come to the general meetings.
what_you_do: Come to a general meeting, sign up for a volunteer shift on the school's volunteer calendar,
  or help plan events. Members also help with teacher appreciation, fundraising and the school Book Fair.
