first_step:
  how: Come to a general membership meeting, which needs no membership. Volunteers who work with students
    without a teacher present need school clearances first.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Anyone can attend the general meetings with no membership, and the site gives a clear way to
    join through its online shop. It describes no newcomer program.
  what_to_expect: The site does not say how long a general meeting runs or who attends. Minutes and slides
    from the 2026 to 2027 meetings are posted online. Volunteers help with school events, teacher appreciation,
    fundraising and the Book Fair.
  first_visit_tips:
  - Email president@nebingerpta.org to ask the date, time and place of the next general meeting, because
    the site does not list them.
  - If you plan to volunteer alone with students, start the clearances early. The FBI check costs $23.25
    and the two state checks are free.
  - Watch the volunteer orientation, a webinar of about 45 minutes followed by a short quiz, and keep
    the certificate for your clearance packet.
