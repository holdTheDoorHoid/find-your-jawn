summary: The Philadelphia alumnae chapter of Delta Sigma Theta, with about 700 members. It works on education,
  health, economic development and civic life in the city, and it opens some of its events to the public.
what_you_do: Public events have included a voter forum, a shredding and electronics disposal drive, health
  and cybersecurity webinars, and a concert. Some events take registration. Members work through chapter
  programs in education, health and emergency response, and some events are for members only.
