first_step:
  how: RSVP for a Budget 101 workshop listed on the events page. Most sessions ask for an RSVP.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: Budget 101 is a beginner workshop on how the city budget works, and the events page gives a clear
    way to attend (an RSVP for most sessions). Office hours are listed, but the page does not say whether
    they are drop-in.
  what_to_expect: Budget 101 sessions run about two hours in neighborhood venues across the city and explain
    how the city budget works. Most ask you to RSVP, and some have offered food and childcare. The site
    does not state a fee for any session, and some sessions are held online.
  first_visit_tips:
  - RSVP on the events page before you go, since most sessions ask for one.
  - 'Check the events page for newer dates: the 2026 sessions listed run from April 6 to June 2.'
  - Some sessions are online, so you can join from home.
