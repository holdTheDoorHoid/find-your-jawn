summary: A Philadelphia group that helps residents understand the city budget and push for public money
  for the services people need. Anyone can attend a Budget 101 or Budget 201 workshop or monthly office
  hours, take the budget survey, or join the newsletter.
what_you_do: Attend a Budget 101 or Budget 201 workshop (most ask you to RSVP), join the monthly office
  hours, take the budget survey, or sign up for the newsletter.
