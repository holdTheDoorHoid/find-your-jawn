  basis: Public volunteer and PEACE PATROL forms are linked from the site, though the pages do not say
    what training, gear, or pay a patrol involves.
  what_to_expect: Patrols run in short, hourly stretches of no more than 30 minutes, starting from set
    meeting points on regular routes. Teams include justice-impacted men, and the site also names community
    members and police personnel as participants. The site does not say what gear, training, or pay is
    provided, so ask before a first shift.
  first_visit_tips:
  - Call 267-458-7823 to ask what a patrol shift involves, since the site does not explain it.
  - Use the PEACE PATROL form for patrol work, and the general volunteer form for other help.
