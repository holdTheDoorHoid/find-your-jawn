summary: A nonprofit that trains and supports women affected by incarceration, both inside and outside
  prison. It also serves their families and works with churches and local service providers.
what_you_do: Volunteer as a transitional coach or in another Chill Out role, donate, or request a speaker.
  The site describes the Chill Out mentorship program but does not say how to enroll.
