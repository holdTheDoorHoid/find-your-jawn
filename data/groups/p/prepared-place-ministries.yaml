first_step:
  how: Fill out the online volunteer form on the Volunteer page and pick a Zoom orientation; someone from
    the ministry then contacts you.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: The way in is a web form and a Zoom orientation, but the orientation dates have no year and the
    site footers read 2016, so the next step is unclear.
  what_to_expect: The volunteer role described is sharing faith with people behind prison walls and supporting
    prisoners, their families and their communities. Orientation for transitional coaches is held on Zoom,
    and the site does not say how long it runs or what it covers.
  first_visit_tips:
  - The group lists a mailing address, a phone line and a contact form, but no office hours, so call or
    write before you plan anything.
  - The orientation dates on the volunteer page have no year, so confirm the next date before you plan
    around it.
  - Chill Out Church services meet every 5th Sunday inside the Philadelphia Industrial Correctional Center,
    and the page invites churches and groups to contact the ministry to take part.
