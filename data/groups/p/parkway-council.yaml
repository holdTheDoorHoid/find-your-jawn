first_step:
  how: Go to a free Tuesday evening jazz concert in Maja Park, 6:30 to 8 pm, and bring a blanket or chair.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: The concerts are free, open to all, and need no registration; the council gives an email address
    for questions about getting involved.
  what_to_expect: Each week a jazz trio is joined by a different featured soloist, and most people sit
    on their own blanket or chair. Concerts are weather permitting, and the council posts any cancellations
    on Instagram.
  first_visit_tips:
  - Bring a blanket or chair, and a picnic if you like.
  - Check the council's Instagram on the day, since weather can cancel a concert.
  - The council's site links to PHLASH and SEPTA information for getting to the Parkway.
