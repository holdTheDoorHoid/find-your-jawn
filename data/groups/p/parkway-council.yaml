summary: A not-for-profit that works to turn the Benjamin Franklin Parkway into a park for everyone. It
  runs summer programs in Maja Park and a yearly art installation on the Parkway.
what_you_do: Go to a free Tuesday evening jazz concert in Maja Park, or to a summer festival day on the
  Parkway such as the Oval Minifest. The council lists no volunteer sign-up, so ask by email.
