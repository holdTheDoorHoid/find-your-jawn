summary: Doctors, nurses, and other health workers who speak up about pollution, climate, and energy in
  Pennsylvania. They hold public webinars and virtual meetings, run air monitoring and watchdog projects,
  and organize action campaigns.
what_you_do: Join a virtual meeting or public webinar, sign up for the newsletter and action alerts, or
  help with a project such as air monitoring or the concerned health professionals group.
