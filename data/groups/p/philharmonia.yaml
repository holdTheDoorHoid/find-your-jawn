summary: A Philadelphia choir of mixed voices, founded in 2013, that sings classical and modern a cappella
  music and gives concerts, some of them free.
what_you_do: Hear a concert, some of which are free. Singers join through an audition with a brief scales
  warmup, a tonal memory exercise, sight singing and a solo of their choice. Auditions for future seasons
  are planned for August 2027. You can join the mailing list or sign up for the audition list through
  a Google form linked on the site.
