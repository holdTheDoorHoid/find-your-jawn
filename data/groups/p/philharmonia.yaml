first_step:
  how: Attend the free fall concert on November 7, 2026 at the Free Library's Parkway Central branch,
    or if you sing, fill in the audition list Google form linked from the site's auditions section.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: Hearing a concert is open to anyone, but joining the choir takes an audition, and the next one
    is planned for August 2027.
  what_to_expect: 'A concert visit is simply attending the show. Evening concerts list doors at 7:30 pm
    and music at 8 pm, and the free fall concert runs twice, at 1:30 and 3:30 pm. Singers who want to
    join take a brief audition: scales, a tonal memory exercise, sight singing and an unaccompanied solo
    of their choice.'
  first_visit_tips:
  - The free fall concert is at the Parkway Central branch of the Free Library, so plan the trip there.
  - Pick the 1:30 pm or 3:30 pm show for the fall concert.
  - For evening concerts, arrive at the 7:30 pm doors time.
  - Join the mailing list on the site to hear when auditions open.
