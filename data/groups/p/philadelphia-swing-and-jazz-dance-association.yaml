first_step:
  how: Arrive at 8 pm on a Thursday for the Lindy 101 beginner lesson, before entry closes at 8:15 pm.
    No partner is needed.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 5
  basis: A beginner class, Lindy 101, runs before every Thursday dance, is drop-in each week, and needs
    no partner or experience.
  what_to_expect: The beginner hour runs 8 to 9 pm and covers the dance's history, basic steps, and simple
    turns, starting from the ground up. You can come alone, since lessons rotate partners and you are
    invited to ask anyone to dance during the social hour. The page suggests taking the beginner lesson
    three to six times before moving on to the monthly level series.
  first_visit_tips:
  - Wear comfortable clothes you can move in, with closed-toe shoes that grip; the page says no sharp
    heels.
  - Arrive a few minutes early to stretch, because lesson entry closes at 8:15 pm.
  - Parking is on the street or in nearby garages; the group's dancers suggest the SpotHero app for cheaper
    spots.
  - If money is tight, a pay-it-forward pass is available at the table, and it gets you in free.
