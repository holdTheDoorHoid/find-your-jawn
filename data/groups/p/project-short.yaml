summary: A student-led nonprofit that gives free admissions help to STEM students from under-resourced
  backgrounds who are applying to medical or graduate school. Each applicant is matched one on one with
  a graduate student mentor in their field.
what_you_do: Mentees get at least two rounds of feedback on application materials such as personal statements,
  plus practice interviews. Mentors are graduate students who give that help in their own field.
