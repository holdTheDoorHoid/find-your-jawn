summary: A nonprofit that stocks diapers and passes them to partner charities that work with families
  facing emergencies. It runs diaper drives and volunteer work to keep supplies coming.
what_you_do: Ask about Heart 2 Heart volunteering through the Contact Us page, join a diaper drive, or
  follow the group's Instagram for pop-up events. Diapers go only to partner nonprofits, not to individual
  families, so a family in need cannot request diapers here directly.
