  gear: Plastic cleats only, since metal cleats are not allowed. The league provides the ball, and gear
    that gives an advantage, such as receiving gloves or steel toes, is not allowed.
first_step:
  how: Register for the season through the league's registration page. Choose the free agent option if
    you do not have a team, and sign the liability waiver before you play.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The 2026 registration page recommends a no-cost exhibition game for new players, regardless of
    experience, with rules, kicking basics and a short scrimmage, and it offers a free agent option for
    people without a team.
  what_to_expect: Games run on Sundays from 2 to 6 pm on the Starr Garden field, with up to 10 players
    on the field and substitutes allowed for up to half a regular season roster. Each team needs a mix
    of players, and a team that cannot field at least eight players forfeits. Rain and storm calls are
    made up to an hour before game time, and games can be rescheduled for poor air quality.
  first_visit_tips:
  - Arrive on time, because a player who is more than 10 minutes late can leave the team short or cause
    a forfeit.
  - Wear plastic cleats only; the league provides the ball.
  - Sign the liability waiver after you register, before you play.
  - Check the league site for weather and heat calls before you travel.
