  newcomer_friendliness: 3
  basis: Public talks are open to anyone, and a general email is posted. Several talks need registration
    first, and membership is $15 a year.
  what_to_expect: Talks cover Philadelphia's burial grounds, digs and historic sites, and are given by
    archaeologists and other specialists. Some are online, and the state historic preservation office's
    lunchtime lectures run about 20 minutes and end with questions.
  first_visit_tips:
  - Check each listing for registration, since several talks use Eventbrite.
  - Museum talks are ticketed through the museum's own site.
  - Membership forms are downloaded from the website and mailed with dues.
