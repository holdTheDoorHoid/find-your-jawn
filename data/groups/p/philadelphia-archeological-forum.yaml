summary: A group that shares Philadelphia's archaeology with the public and speaks up to protect historic
  sites. It hosts public talks, runs a historical burial grounds map and database, and invites people
  to join advocacy actions.
what_you_do: Attend public talks, sign petitions, and send public comments to the City Planning Commission
  during its reviews. Membership is open to anyone interested in archaeology, history or related fields.
