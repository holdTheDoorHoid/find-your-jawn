summary: A festival that brings young dancers together for three days of master classes and a chance to
  perform. It runs in Philadelphia and in the Lehigh Valley.
what_you_do: Dance companies apply through an online form and pay a $50 company fee, then submit up to
  two pieces for review. Each company performs one piece of up to 4.5 minutes, and each dancer takes four
  to six master classes. Scholarship audition classes are held at each festival.
