first_step:
  how: Ask your dance company's director to submit the online company application and the $50 fee by November
    1, 2026. Dancers then join through their company.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Dancers perform only through a company that applies and pays fees, and the FAQ says non-performing
    dancers are wait listed at the Philadelphia festival, so there is no open walk-in path.
  what_to_expect: A festival weekend is mostly master classes taught by guest teachers, with Saturday
    classes running from 9 am to 6 pm. Each company gets a short tech rehearsal on stage with the lighting
    designer before its one piece. The dancer fee covers the classes, the performance, a custom T-shirt,
    and photos and video of the show.
  first_visit_tips:
  - Companies submit up to two pieces for review in January, and each performing company is guaranteed
    one piece once the festival selects it.
  - Credit card payments carry a 3 percent processing fee; checks are the other option.
  - Dancer registration forms and the participation fee are due by February 12, 2027.
  - Email philayouthdancefest@gmail.com to ask about the waitlist for dancers who are not performing.
