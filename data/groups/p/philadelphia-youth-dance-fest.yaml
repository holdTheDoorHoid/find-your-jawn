summary: A festival that brings young dancers together for three days of master classes and a chance to
  perform. It runs in Philadelphia and in the Lehigh Valley.
what_you_do: Dance companies apply through an online form. Dancers take four to six master classes and
  perform one piece of up to 4.5 minutes. Scholarship classes are held at each festival.
