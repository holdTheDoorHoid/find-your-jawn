first_step:
  how: Go to a session and ask for a lesson. A 2025 news report named a walk-in teaching block on Saturdays
    from noon to 2 pm, so check the club's website for current times first.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 5
  basis: Recent news says volunteers teach brand-new visitors at meetups and the club holds lessons, and
    a 2025 news report describes a weekly Saturday walk-in teaching block for players of all levels. The
    article does not say whether you must reserve a spot.
  what_to_expect: Newcomers can take part with volunteers or officers teaching the game to walk-in visitors.
    The club holds lessons, and some members enter club tournaments. Non-members pay a $10 day fee at
    the Saturday teaching block, according to the 2025 report. The news reports do not say how long a
    visit lasts.
  first_visit_tips:
  - Ask for a lesson as soon as you arrive, since volunteers teach first-time visitors.
  - Expect a $10 day fee if you are not a member, according to the 2025 report.
  - The clubhouse is on the second floor, and the reports do not say whether there is an elevator, so
    ask before you go.
  - Check the club's website first, because the 2025 hours may have changed and 2026 reports name board
    game cafes as meetup places.
