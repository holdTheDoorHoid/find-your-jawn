schedule:
  text: Weekly play. A July 2025 news report listed clubhouse sessions on Friday evenings (7 to 11 pm),
    Saturdays (noon to 8 pm) and Sundays (2 to 8 pm), plus Wednesday evenings (6:30 to 10 pm) at the King
    of Prussia Bridge Club. Times may have changed, and 2026 reports say weekly meetups also happen at
    board game cafes.
