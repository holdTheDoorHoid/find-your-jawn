cost:
  level: low
  text: An introductory membership is $20 for the year. Members then pay $10 for each day they play, and
    non-members pay the $10 day fee at the Saturday teaching block. A $60 yearly membership adds a stamp
    card that makes the 10th visit free and access to members-only tournaments. Figures are from a July
    2025 news report.
