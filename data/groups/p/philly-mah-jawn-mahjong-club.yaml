summary: A Philadelphia mahjong club that meets every week for players of all levels. It has a clubhouse
  in Old City, teaches newcomers, and its president said in August 2026 that weekly crowds had grown to
  about 50 people.
what_you_do: Learn to play mahjong, including the Japanese riichi style, join the weekly play, and take
  part in club tournaments.
