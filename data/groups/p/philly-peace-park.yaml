summary: A neighborhood-run ecology campus in North and West Philadelphia with free urban farming, education
  and wellness programs. It also runs a weekly market for local sellers of natural products.
what_you_do: Come to a free monthly Self-Care Saturday, shop the weekly market, or bring a school group
  for a planting or composting visit.
