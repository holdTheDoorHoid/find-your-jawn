summary: A humanist community at Rittenhouse Square that holds free Sunday talks with a guest speaker
  and live music. The talks are open in person and online, with dialogue on making Philadelphia more ethical.
what_you_do: Come to a free Sunday talk at 11 am, in person at Rittenhouse Square or online. To become
  a member, attend events for a while, fill out the interest form, and talk with members and the board
  about applying.
