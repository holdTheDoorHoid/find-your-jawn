first_step:
  how: Walk in to the drop-in center on a weekday between 9:30 am and 4 pm, or email the drop-in coordinator,
    Amira Cason, at acason@ppponline.org to ask about current services and any ID or sign-up needs.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The drop-in center is open to the public on weekdays, and the group says it welcomes people of
    all backgrounds without judgment. The site gives a named coordinator to contact.
  what_to_expect: The drop-in center is open Monday to Friday, 9:30 am to 4 pm, and the group says it
    aims to be free of judgment. Services include case management, mail, coffee, clothing and hygiene
    items, and drug and alcohol referrals. Ask the coordinator ahead of time whether you need any ID or
    sign-up before your first visit.
  first_visit_tips:
  - Come on a weekday between 9:30 am and 4 pm, since the drop-in center is open Monday to Friday.
  - Take the Market-Frankford Line to the Somerset stop, as the contact page suggests, and use the entrance
    on Monmouth Street.
  - Email the coordinator before a first visit to ask what to bring and whether ID is needed.
