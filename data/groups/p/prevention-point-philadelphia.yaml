summary: A nonprofit that serves people who are homeless or who use drugs. It runs a weekday drop-in center,
  a mobile unit called Wellness on Wheels, HIV prevention, medical and behavioral health services, and
  a clinic for opioid treatment.
what_you_do: Stop by the weekday drop-in center for coffee, case management, mail, clothing and hygiene
  items, and referrals. You can also use its medical and behavioral health services, or volunteer or intern
  through its volunteer program.
