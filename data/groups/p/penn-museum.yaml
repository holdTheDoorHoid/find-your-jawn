  notes: Ramps or power-assisted doors at the Main and East entrances, borrowable manual wheelchairs,
    and accessible restrooms on the Lower Level. The third floor Etruscan Italy and Greece galleries are
    reached by stairs, and staff can point you to a lift. The museum page says it is near SEPTA Penn Medicine
    Station, and the line is not named.
