  newcomer_friendliness: 2
  basis: Volunteers must apply for a listed role, applications are reviewed on a rolling basis, and the
    page describes no beginner training.
  what_to_expect: You set up a cart of five to ten objects that share a theme tied to one gallery, then
    talk with visitors of all ages about each object. Shifts run Tuesday to Sunday, 10 am to 4 pm. The
    page does not describe training, so ask what a first shift looks like before you commit.
  first_visit_tips:
  - Apply first, since the museum reviews applications on a rolling basis.
  - 'Parking may be tight: the museum garage on Convention Avenue is under renovation, with Penn Park
    Garage and Chestnut 34 Garage as backups.'
  - Weekend volunteers are especially needed, so say if you can do weekends.
