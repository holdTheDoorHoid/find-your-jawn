first_step:
  how: Buy a timed ticket online for a visit during opening hours, Wednesday to Monday, 11 am to 6 pm.
  drop_in: false
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Open to the public at set hours with posted prices, though timed tickets often sell out. The
    site also lists tours, volunteering and membership.
  what_to_expect: A visit is a timed, self-guided walk through the mosaic installation and museum. Staff
    can lend a folding chair on request, and sensory bags are available if you want them. Guided tours
    and Family Jams are also offered.
  first_visit_tips:
  - Reserve a timed ticket online before you come, since slots often sell out.
  - Last admission is 15 minutes before closing, and the site is closed on Tuesdays.
  - For sensory bags or other access help, call 215-733-0390 ext. 120 or email info@phillymagicgardens.org.
  - Family Jams are free with museum admission and run on Sundays from noon to 4 pm.
