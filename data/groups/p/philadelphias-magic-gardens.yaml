access:
  wheelchair: partial
  languages: []
  notes: Indoor galleries and parts of the sculpture garden are reachable, but the page calls wheelchair
    access somewhat limited. The tour basement and garden have narrow passages and stairs, and no ramp
    or elevator is listed. Loaner manual wheelchairs, a rollator and a cane chair go out first come, first
    served. Free sensory bags (noise canceling headphones, fidget toys, sunglasses) are at the front desk
    if you leave an ID, and reserving ahead is advised. Service animals are welcome on a leash. The pre-visit
    video has captions and an ASL interpreter. Touch tours for blind and low vision visitors, ages 14
    and up, need a reservation.
