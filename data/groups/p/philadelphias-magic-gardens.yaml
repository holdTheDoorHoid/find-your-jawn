summary: A mosaic art installation and museum on South Street, with guided tours, events, exhibitions
  and an artist residency. It also runs volunteer and membership programs.
what_you_do: Visit the mosaic installation during opening hours, or join a guided tour. Volunteers, who
  must be 18 or older, help with public programs, gallery installation and festival outreach. Families
  can join the Family Jams, hands-on art sessions on Sundays.
