first_step:
  how: Email the RSVP contact listed on the group's FAQ page to get the jam location, then go on the second
    Thursday to play or listen.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The FAQ says beginners are welcome and encouraged at the Center City jam and gives a clear RSVP
    route. The venue is shared only after an RSVP, so you cannot just show up.
  what_to_expect: The jam runs two hours, 7 to 9 pm, on the second Thursday of the month. You get the
    venue only after you RSVP. The group welcomes beginners, but the pages do not say whether you need
    your own instrument or whether there is any charge.
  first_visit_tips:
  - RSVP ahead of time, since the venue is shared only after you reply.
  - Ask when you RSVP whether to bring an instrument, because the pages do not say.
  - If the Center City date does not suit you, the calendar lists other jams and shows across the region.
