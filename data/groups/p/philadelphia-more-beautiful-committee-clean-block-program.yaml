summary: Block captains and the city's More Beautiful Committee organize Saturday cleanups by police district
  each spring and summer, working with the Department of Sanitation. A yearly Clean Block Contest judges
  a set of registered blocks, and every contest block receives cash.
what_you_do: Join your block's Saturday cleanup and bag the litter for pickup, or ask PMBC for a block
  captain petition, which needs signatures from 51% of the residents on your block, one adult per household.
