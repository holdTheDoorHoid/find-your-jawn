first_step:
  how: Call PMBC at (215) 685-3971 to find out whether your block has a captain and when your police district's
    Saturday is.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Residents join through their block captain, and PMBC publishes a phone line to find one, so the
    way in is clear but needs a call first.
  what_to_expect: A cleanup is a Saturday on your block, run by your block captain with the clean block
    officer for your police district. PMBC can provide tools, supplies, and street cleaning help, and
    residents pick up litter and bag it for pickup. The site does not give a start time or how long the
    cleanup takes.
  first_visit_tips:
  - Bag the litter and set the bags at either end of the block for pickup.
  - Do not sweep trash or dirt into storm drains, and keep cars off the street while you work.
  - Bulk or household trash is not collected on cleanup Saturdays, so keep it out of the bags.
