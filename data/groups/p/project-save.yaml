first_step:
  how: Email referrals@projectsavephilly.com with 'Referral Request' in the subject line, or call or text
    215-703-8441, and ask about the drop-in Creative Healing and Community Wellness Group or other support.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The drop-in group and a referral email or call or text line give a clear way in, and education,
    advocacy and community events do not need eligibility. The site does not describe what a first session
    or intake looks like, so it does not reach a 4.
  what_to_expect: The drop-in Creative Healing and Community Wellness Group meets in the evening, 6 to
    7:15 pm, at the Henry Avenue office, with creative and wellness activities. The page does not say
    how many people attend, whether you must register, or what it costs. Some direct services have eligibility
    rules, while education, advocacy, wellness and community events are open to anyone.
  first_visit_tips:
  - The suite number differs between pages (227 on the events page, 354 on the contact page), so confirm
    the room when you call.
  - Ask about virtual options when you call; the site says some services are offered online depending
    on staff availability.
  - Direct services have eligibility rules, so ask which services fit you before you come.
