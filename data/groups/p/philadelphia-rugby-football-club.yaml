first_step:
  how: Email recruiting@philadelphiarugby.org to say you want to join, since the site sends interested
    players there.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The FAQ says no experience is needed and the club welcomes every skill level. The practice page
    sends interested players to a recruiting email. No beginner session or open practice is listed.
  what_to_expect: Practices run about two hours on Tuesday and Thursday evenings, and the club trains
    players at all levels. Expect a season fee, a USA Rugby registration before your first match, and
    a few stadium shifts over the season.
  first_visit_tips:
  - Bring a mouth guard and cleats; soccer cleats are fine.
  - Ask the treasurer about a payment plan before you pay the full season fee.
  - Practice is at Scanlon Rec Center, 1099 E Venango St, Philadelphia, PA 19134.
  - Weather or field problems can move practice to another spot, and the club gives notice.
