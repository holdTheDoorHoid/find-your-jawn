summary: A rugby club founded in 1976 that began as a women's club and now welcomes players of any gender
  identity. It fields Division I and Division III 15s teams and a summer sevens program.
what_you_do: Train at Tuesday and Thursday evening practices, play 15s in the fall and spring or summer
  sevens, and work a few stadium game day shifts each season.
