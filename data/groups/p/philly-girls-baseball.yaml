first_step:
  how: Register for the instructional package through the group's LeagueApps registration page, which
    takes sign-ups on a rolling basis.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The instructional package says all experience levels are welcome, registration is rolling, and
    the site gives a clear route for coaches and for scholarship requests.
  what_to_expect: The instructional package covers practices, clinics and scrimmages, plus a jersey, a
    hat and a team weekend called Big Baseball Weekend with DC Girls Baseball. Tournaments cost extra
    for instructional players, so ask about the fees before you sign up. Practices fall on Sunday afternoons
    from late March through June, and on weekday evenings in summer.
  first_visit_tips:
  - Bring your own glove, cleats, helmet and equipment bag, since helmets are not shared.
  - Wear baseball or athletic pants that allow sliding, with no shorts or leggings, and a forward facing
    cap.
  - Families provide the pants, belts and socks; the group provides the jerseys and hats.
  - Ask in advance for a team bat if you do not have one.
