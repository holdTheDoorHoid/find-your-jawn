summary: A nonprofit all-girls baseball program in Philadelphia for players ages 8 to 18, with teams,
  tournaments, and a need for volunteer coaches.
what_you_do: Girls join teams called the Philly Flames, practice in the spring and summer, and play tournaments
  through the fall. The group is adding volunteer coaches, who must complete a background check, abuse
  awareness training and Pitch Smart training.
