summary: A monthly discussion group for atheists, agnostics and other non-religious people, meeting at
  the Unitarian Society of Germantown in Northwest Philadelphia. It talks through issues that affect non-religious
  people and works toward a more welcoming congregation.
what_you_do: Join a conversation with other non-religious people about the issues that matter to them,
  and help the group's push for inclusion in the congregation.
