summary: A nonprofit, founded in 2000, that helps families get the school support children with disabilities
  need. It offers free help with IEPs, runs networks for parents and self advocates, and works for children
  to learn in their neighborhood schools.
what_you_do: Register for a free IEP clinic session online, use the free education modules, or ask about
  becoming a Parent Consultant, a trained parent who gives free peer support to families.
