first_step:
  how: Register for a free IEP clinic session through the online form, or email info@paedforall.org to
    ask about joining the Parent Consultant Network.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The site explains its free IEP support, how to register for a clinic, and how a parent can ask
    about joining its network.
  what_to_expect: An IEP clinic session is a 60-minute video call with two IEP consultants. Before it,
    families send the student's IEP to the group, and the consultants talk through concerns, review the
    plan, and finish with advice and suggested next steps. The clinic is free and open to families across
    Pennsylvania.
  first_visit_tips:
  - Join the video call 15 minutes before your session time.
  - Send the IEP ahead of time and confirm the deadline, since one flyer shows an older date.
  - Write your top questions down, because the session is only an hour long.
  - Ask the group about interpreters or captioning before the session, since the clinic page does not
    say.
