summary: The Philadelphia chapter of the Gaelic Athletic Association. Its site covers Gaelic football,
  hurling and camogie, and it has a youth page for young players.
what_you_do: Play Gaelic football, hurling or camogie with one of the clubs on the Teams page, or sign
  a young player up through the youth program, which runs through five youth clubs. The group's pages
  do not describe trial sessions, so ask a club or an officer how to start.
