summary: A nonprofit that runs youth choirs for boys, girls and a combined group, along with instrument
  and music classes. Its choirs hold public concerts across the year.
what_you_do: 'Audition for one of the three choirs: the Philadelphia Boys Choir and Chorale, the Philadelphia
  Girls Choir, or the Commonwealth Youth Choir. Each has its own audition booking page for the 2026 to
  2027 season. You can also take private lessons or musicianship classes, or attend a public concert.'
