first_step:
  how: Open the audition page for the choir that fits your child, linked from the Auditions menu, and
    book an audition for the 2026 to 2027 season.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Joining a choir takes an audition, so families learn what a choir is like only after auditioning.
    Auditions are open for the 2026 to 2027 season.
  what_to_expect: Each choir has its own audition booking page, and the auditions landing page does not
    say how long an audition lasts or what to prepare. The girls choir places singers in ensembles by
    age and skill after the audition, so a child joins a group that fits their level. Public concerts
    are a way to hear the choirs first.
  first_visit_tips:
  - 'Book at the right audition site: the boys and girls choirs audition at 1336 Spring Garden Street,
    and the Commonwealth Youth Choir at 8855 Germantown Avenue.'
  - Find Your Instrument is run with partner schools, so ask your child's music teacher about it rather
    than signing up directly.
  - Call 215-222-3500 or email info@pycemusic.org to ask about tuition, since the pages do not list it.
