summary: A City of Philadelphia early reading program. Volunteers sit one on one with a student in grades
  K to 3 during after school sessions at city out of school time programs.
what_you_do: Coaches read with one student for at least one hour a week. No teaching experience is needed,
  and the city trains volunteers.
