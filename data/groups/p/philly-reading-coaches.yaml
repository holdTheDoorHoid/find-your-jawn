  newcomer_friendliness: 4
  basis: The city's program article says no prior experience is required and volunteers get trained, and
    it explains how to apply.
  what_to_expect: Before your first session you complete an orientation and a mandated reporter training
    module. You also complete the clearances the program lists, including state and child abuse history
    checks, an FBI waiver or fingerprint check, and a sex offender registry check for adults.
  first_visit_tips:
  - Volunteers aged 16 and 17 need a parent or guardian to sign a release form.
  - You can read more about the program on the city's page before you apply.
