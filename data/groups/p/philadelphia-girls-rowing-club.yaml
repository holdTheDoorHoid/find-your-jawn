summary: A women's rowing club on Boathouse Row that trains adult novices in a yearly program and pairs
  each new rower with a mentor.
what_you_do: Learn to row on machines and then on the river, pass a skills and safety test, and help with
  the club's main fundraiser, the Braxton Regatta.
