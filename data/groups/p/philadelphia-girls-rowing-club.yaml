first_step:
  how: 'Email pgrcmembers14@gmail.com with ''ATTN: Membership Chair'' in the title, saying why you want
    to join, your rowing background and how you could help the club.'
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Applicants write a letter or email, may be invited to a spring information session, and pay a
    fixed fee, so the way in is clear but not open to walk-ins.
  what_to_expect: 'If you are invited, you attend the information session, then train on rowing machines
    before moving to the river. The program ends with a skills and safety test and a mentor for the year.
    It is physical work: you lift and carry boats, get in and out of them, and must be able to swim.'
  first_visit_tips:
  - Include your home address, email and phone number in your letter, since the club asks for them.
  - Be ready to pay the $950 novice fee on the first day of training.
  - Be a confident swimmer, since the club says you must be able to swim if a boat flips.
