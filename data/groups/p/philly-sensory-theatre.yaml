summary: Makes original, inclusive, immersive live theatre for families. Its current show, Quack Quack
  Philly! A Sensory Musical, follows a duck that gets lost after a river flood and travels across Philadelphia.
what_you_do: Buy a ticket to a show. Each audience member gets a bag of props to use during the show.
