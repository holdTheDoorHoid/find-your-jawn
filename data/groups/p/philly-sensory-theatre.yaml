  what_to_expect: Quack Quack Philly! is a sensory musical for families, and each audience member gets
    a bag of props to use during the show. The group's site does not print dates, venues or run times
    for the current show, so check each listing.
  first_visit_tips:
  - Check the listing for the show date, venue and ticket price before you go.
  - Ask the venue about accessibility before the show, since the group's site does not list ASL, captioning
    or sensory-friendly performances.
