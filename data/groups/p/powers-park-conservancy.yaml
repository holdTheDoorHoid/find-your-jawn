summary: A neighbor-run group that formed in 2013 to keep Colonel Thomas J. Powers Park in Port Richmond
  safe, clean and welcoming. The most recent activity we could date is from 2018, and current activity
  could not be confirmed.
what_you_do: Past volunteer days painted park furniture and trash cans, planted bulbs and helped run events
  such as a dog costume parade and movie nights. Current work days could not be confirmed, so ask the
  group before you plan a visit.
