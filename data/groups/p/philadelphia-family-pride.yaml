summary: A membership group for LGBTQ+ families in the Philadelphia area. It hosts get-togethers and family
  events, runs resource fairs, and offers classes for people thinking about becoming parents.
what_you_do: Come to the informal get-togethers and family events, take a prospective parent class, or
  join as a member. Members get discounted outings, parenting education and the newsletter.
