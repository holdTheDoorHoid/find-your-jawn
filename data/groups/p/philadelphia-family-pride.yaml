first_step:
  how: Check the Events menu for get-togethers and resource fairs, then join or renew through the site's
    Join or Renew page. To sign up for a prospective parent class, use the Google form linked on the class
    page when the next series is posted.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Public events and resource pages can be read without signing in, and the site has a clear join
    button, but the pages do not say which events need membership.
  what_to_expect: Informal get-togethers and family events are posted on the site as they are planned.
    The 2025 prospective parent series was held in person and covered adoption, surrogacy, sperm donation
    and legal questions, with social time to meet other prospective parents. The class page did not show
    dates for a newer series when we read it.
  first_visit_tips:
  - Ask before you go whether an event is open to non-members, since the site does not say.
  - The class series has a YouTube playlist of past classes, which you can watch before you decide.
  - The group offers to connect people with professionals and current parents, so you can ask through
    the site's contact page.
