summary: A nonprofit that brings working artists and scientists into schools and community sites for hands-on
  arts and STEAM lessons. Families can enroll students in its STEAM afterschool program, and artists can
  apply to teach.
what_you_do: Enroll a student in the STEAM Afterschool Program, apply on the website to become a STEAM
  Educator (a teaching artist or scientist role), or ask a school to become a participating organization.
