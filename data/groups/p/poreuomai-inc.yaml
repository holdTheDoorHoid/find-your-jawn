first_step:
  how: Fill out the volunteer sign-up form on poreuomai.org and wait for the group to contact you, or
    call (301) 518-3856.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: The volunteer and internship routes both start with a form and a review or contact step, and
    the site does not say what the work involves or who can apply.
  what_to_expect: The site does not describe a typical volunteer shift or how long one lasts. Hands-on
    work is described as serving churches, schools, and communities, and the listed trips go to partner
    churches in Jamaica and Tobago. The group contacts you after you send the form.
  first_visit_tips:
  - Ask about cost, trip length, and who can go before you apply, since the site does not list them.
  - The site also lists a WhatsApp number, (876) 471-1808, for questions.
