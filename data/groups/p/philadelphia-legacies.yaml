first_step:
  how: Buy a ticket to the next awards gala, a dinner or a tour on the Buy Tickets page, or use the Get
    Involved link on the contact page to ask about events.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Events are open to the public but sold as tickets, prices are not shown on the pages read, and
    the Get Involved path leads mostly to sponsors and donors.
  what_to_expect: The awards gala is an evening event at the Restaurant School at Walnut Hill College,
    where community leaders receive commissioned portraits and awards. Single tickets and tables are sold,
    and the ticket page offers tables of ten. Historic tours cover sites in Germantown, Center City and
    South Philadelphia, and Wynnefield and West Philadelphia, but the tour pages give no dates, meeting
    places or prices.
  first_visit_tips:
  - Check the Buy Tickets page for current prices before you plan.
  - Plan for a long evening, since the gala runs from late afternoon into the night.
  - Ask through the contact page about tour dates and meeting places, since they are not posted.
  - Decide between a single ticket and a table, since both are sold.
