first_step:
  how: If you are 14 or older, fill in the sign-up form on the Philadelphia Adaptive Rowing page.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The rowing page says no skill is needed and gives a sign-up form, but it also links an eligibility
    document that could not be read, so the rating stays at 3.
  what_to_expect: Rowing sessions run on weekday evenings from 5:30 pm until dusk, and the page says equipment,
    coaches and volunteers are provided at every session. Beginners are served alongside experienced rowers
    who want to race. Fees are not listed on the pages read.
  first_visit_tips:
  - Read the eligibility document the rowing page links before your first session, since its text could
    not be summarized here.
  - Free parking and bike racks are at the boathouse, weather permitting.
  - To volunteer instead, use the volunteer page; no minimum hours are required.
