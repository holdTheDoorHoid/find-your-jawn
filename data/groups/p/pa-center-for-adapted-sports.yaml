schedule:
  text: Adaptive rowing for athletes meets Tuesday and Wednesday evenings from 5:30 pm until dusk, May
    through September or October. Volunteer cycling runs Saturday mornings from 9 am to 1 pm in Philadelphia
    and Sunday afternoons from 1 to 3 pm in Chester County, April through October, weather permitting.
