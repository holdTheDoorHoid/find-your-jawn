summary: Five Philadelphia jazz groups working together to collect, save, and share the city's jazz history.
  It also records life-story interviews with musicians and neighbors.
what_you_do: Send photos, concert programs, clippings, or recordings from Philadelphia jazz history through
  the online submission form, or call the project director to talk about giving materials.
