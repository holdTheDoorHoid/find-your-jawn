  newcomer_friendliness: 3
  basis: The submission form is public and anyone can offer materials, but the site does not say how the
    public can volunteer or take part in interviews.
  what_to_expect: 'There is nothing in person to plan for: the form asks for your name, email, an optional
    phone number, a file, and a description of what you are sending. Talks and listening sessions are
    posted on the site with dates. No fee is listed for contributing.'
  first_visit_tips:
  - Have a short description of each item ready, since the form asks for one.
  - Call the project director, Suzanne Cloud, at (610) 745-3011 if you want to talk before you send anything.
  - The project also collects materials from Trenton, Camden and Atlantic City, not only Philadelphia.
