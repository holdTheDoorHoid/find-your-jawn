first_step:
  how: Come to a Friday meeting, on Zoom or in person at St. Mary's at Penn or the Rotunda, then email
    info@psfs.org to get on the announcement list.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: Meetings are free and open to anyone, membership is not needed to attend, and the page gives
    an email contact. It does not describe a welcome for newcomers.
  what_to_expect: Meetings usually feature a guest speaker, such as a physicist or an author, and some
    are in person while others are on Zoom. Attending is free and you do not need to be a member. If you
    want to join later, the page says you become eligible for membership after three in-person meetings,
    which can be spread over months or years.
  first_visit_tips:
  - For the three in-person meetings that count toward membership, pick St. Mary's at Penn or the Rotunda.
  - Check the meetings page before you go, since some meetings are virtual.
  - At St. Mary's at Penn, the meeting room is in the parish building behind the sanctuary.
  - Email info@psfs.org if you want the announcement list or have questions.
