summary: The Philadelphia alumni chapter of Kappa Alpha Psi. It runs the Achievement Academy, a youth
  mentoring program, and funds scholarships through its Achievement Foundation. The chapter is based at
  the Achievement Center in Germantown.
what_you_do: The Achievement Academy works with young people on daily living skills, wellbeing, college
  exposure and budgeting. Guide Right is a mentoring program linked to a college tour. The Achievement
  Center can be booked for events through a request form. General chapter meetings are for the fraternity's
  brothers.
