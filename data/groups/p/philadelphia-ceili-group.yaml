first_step:
  how: Come to the first-Friday Irish music session at 7:30 pm at The Irish Center, 6815 Emlen St, or
    to Ceili OG, the free monthly ceili. Check the group's site for the next Ceili OG date, since none
    was published when we read it.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Ceili OG is free, instructed and open to young people and adults, and the session has a set time
    and place, but the site does not say beginners are welcome.
  what_to_expect: Ceili OG is a free dance session where the steps are taught, with live music from The
    Next Generation Session. The first-Friday session is a traditional Irish music night that starts at
    7:30 pm and is hosted by Hollis Payer. The site does not give the length of either event or the cost
    of the session.
  first_visit_tips:
  - Check the group's site for the next Ceili OG date and start time before you go.
  - Members get discounts on many Ceili Group events, according to the membership page.
  - The site lists no parking or transit details for The Irish Center, so check before you go.
