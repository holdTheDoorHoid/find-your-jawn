summary: An Irish music and dance group in Philadelphia, founded in 1958. It runs a free monthly ceili
  for young people and adults, a first-Friday Irish music session, and an annual Irish music and dance
  festival.
what_you_do: Dance at the free monthly Ceili OG, play or listen at the first-Friday session at The Irish
  Center, buy festival tickets, or join as a member. Volunteers can sign up for festival work or year-round
  help through the group's Volunteer page.
