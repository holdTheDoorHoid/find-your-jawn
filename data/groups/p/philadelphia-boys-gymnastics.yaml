cost:
  level: paid
  text: Monthly tuition is $130 for preschool or beginner girls classes at one class a week, with extra
    days at $125 a month each. Boys competition levels run $230 to $450 a month. A trial lesson costs
    $30. A summer policy reduces a month's tuition for boys competition families who miss training in
    July or August.
