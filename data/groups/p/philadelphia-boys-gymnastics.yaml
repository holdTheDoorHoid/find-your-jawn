summary: A gymnastics school with preschool classes, beginner girls classes and a boys program that trains
  toward USA Gymnastics competition. New families can book a $30 trial lesson before they join.
what_you_do: Kids take gymnastics in sessions across fall, winter and spring. Boys who want to compete
  train in the men's development program. New students fill out an application and a medical liability
  form.
