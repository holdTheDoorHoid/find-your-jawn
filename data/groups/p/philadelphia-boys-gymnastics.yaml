  basis: The site lists beginner and preschool classes and a $30 trial lesson, and it explains how a new
    family starts.
  what_to_expect: Preschool classes last 45 minutes and beginner girls classes last 55 minutes, once a
    week to start. Preschool has a low student-to-teacher ratio, and the higher levels are by staff invitation.
    The site does not describe a first class, so the trial lesson is the best way to see one.
  first_visit_tips:
  - Use the Directions page on the gym's site. The separate PDF directions are marked as incorrect.
  - Ask which level fits your child before you book, since advanced levels are by staff invitation.
  - Call (215) 204-7452 or email info@philadelphiaboysgymnastics.org if you have questions before you
    come.
