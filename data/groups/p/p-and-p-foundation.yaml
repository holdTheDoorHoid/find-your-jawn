  newcomer_friendliness: 2
  basis: The mentorship program and events are described, but the site gives no application step, eligibility,
    or sign-up page, so the way in is unclear.
  what_to_expect: The site does not describe a first visit. Events and training take place at the Pen
    & Pencil Club building on Latimer Street. The awards cover beat, investigative, sports, visual, and
    audio journalism about Philadelphia.
  first_visit_tips:
  - Ask in your email whether there is a fee, and what the mentorship program asks of people who join.
  - The site lists only an email address and a mailing address, not a phone number.
  - Mentorship pairs are described as newer journalists with experienced local reporters, so say what
    stage you are at in your email.
