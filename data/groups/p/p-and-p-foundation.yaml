summary: A Philadelphia nonprofit that promotes journalism. It runs the yearly Philly News Awards, events
  with local newsmakers, training for reporters and editors, and a mentorship program that matches newer
  journalists, including students, with experienced local reporters.
what_you_do: Email the foundation to ask about its mentorship program if you are a student or early-career
  journalist. You can also watch for the yearly awards, which take entries about Philadelphia reporting,
  and for events with local newsmakers.
