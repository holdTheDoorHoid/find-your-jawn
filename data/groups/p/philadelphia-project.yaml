summary: A faith-based nonprofit that runs free home repairs for homeowners in several Northwest Philadelphia
  ZIP codes, including Germantown and Mt. Airy. Volunteers join short service trips, and volunteer teams
  do most of the repair work.
what_you_do: Sign up for a service trip such as a day of service, a blitz weekend, or a summer of service,
  or apply for a repair through the Home Repair page if you own and live in an eligible home.
