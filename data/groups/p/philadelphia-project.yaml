first_step:
  how: Use the 'Tell Me More' inquiry form on the service trips page to ask about a day of service or
    a summer trip that fits your group.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Trips are listed publicly and open to groups of many kinds, and the inquiry form is the way in,
    but the page does not say what skills are needed or what happens after the inquiry.
  what_to_expect: A trip lasts from one day to a full week, and groups can be small, corporate, family,
    or intergenerational. Volunteers work on home repairs, church projects, children's programs, or service
    at food banks and shelters, and each trip includes an evening worship session. The site does not say
    what trips cost or where groups stay.
  first_visit_tips:
  - 'Pick a trip that fits your age: a day of service is open to all ages, summer trips and blitz weekends
    are mostly for grades 6 to 12, and spring break is for college students.'
  - Ask the office what a trip costs and where people sleep, since the site does not say.
  - For a home repair, check the eligibility list on the Home Repair page before you apply.
