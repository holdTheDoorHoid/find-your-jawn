    not say outright that neighbors may attend.
  what_to_expect: Meetings review nearby zoning and building proposals, and the group shares its view
    with the City and developers. The site lists the first Tuesday of the month from 7 to 9 pm on Zoom.
    Suggested dues help pay for event permits, legal fees, and newsletter printing, and the site does
    not describe how a meeting runs.
  first_visit_tips:
  - Confirm the next meeting by email before you log on.
  - Dues are suggested, not required, and the site says a check can be mailed or dropped off.
  - The site's footer lists a Facebook group and an Instagram account, which may carry newer meeting details.
