first_step:
  how: Search the certified residence directory on the group's site for a house near you, or email f.way@parronline.org
    to ask about membership or the scholarship.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The directory and scholarship notices are public, but membership and certification run through
    applications. The pages do not give the cost, who may apply, or the deadlines.
  what_to_expect: There is no drop-in group or meeting to attend. The public part of the work is the directory
    and the scholarship notices, and the membership and certification routes are for recovery house operators.
  first_visit_tips:
  - Use the directory first, but call the house to confirm, because the directory page warns that addresses
    and phone numbers change often.
  - Check the home page for the scholarship notice, which says the scholarship is available in 2026 through
    The Bridge Foundation.
