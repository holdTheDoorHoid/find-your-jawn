summary: A statewide alliance based in Philadelphia that certifies recovery houses to national standards,
  publishes a directory of certified houses, and offers education, advocacy and scholarships for people
  in recovery.
what_you_do: Look up a certified recovery house in the directory, or watch for the recovery house scholarship.
  Recovery house operators can apply for membership or for certification.
