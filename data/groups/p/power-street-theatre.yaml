first_step:
  how: Watch the Land and Body page and the newsletter for the next adult course, since spots go first
    come, first served. For the Sunday open mic, RSVP free on Eventbrite and come to watch or step up
    to the mic.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The adult courses say no experience is needed, and the open mic lets anyone just watch. The site
    says how to hear about the next course and how to RSVP for events.
  what_to_expect: The open mic starts at 2 pm at Two Locals Brewing Co. Artists and fans make up the crowd,
    and you can step up to the mic or simply watch. Adult Land and Body courses are free, but you must
    attend every session, with one absence allowed if the teaching artist is told ahead of time.
  first_visit_tips:
  - The open mic is at Two Locals Brewing Co., on 37th and Market streets.
  - Latin Social happy hours have been held at The Lawn, at 37th and Filbert streets, so check the RSVP
    listing for the place.
  - Plan to attend every session of a Land and Body course, since one absence is allowed only with advance
    notice to the teaching artist.
