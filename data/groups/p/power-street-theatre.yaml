summary: A West Philadelphia arts group that runs a free monthly Sunday open mic, a free community happy
  hour, free bilingual adult acting courses, and a new-play reading series that asks for donations.
what_you_do: Take a free adult acting course (open to ages 18 and up, taught in English and Spanish),
  step up to the mic or watch at the Sunday open mic, or come to a free happy hour. RSVP on Eventbrite
  for events.
