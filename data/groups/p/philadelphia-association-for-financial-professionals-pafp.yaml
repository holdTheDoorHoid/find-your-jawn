cost:
  level: paid
  text: Membership is $195, or $350 with the Learning Day. Members pay $175 to $195 for the Learning Day
    alone, and non-members pay $225 to $250. Education, retired and in-transition people pay no fee but
    volunteer for the association. Events outside a membership level have an extra registration fee.
