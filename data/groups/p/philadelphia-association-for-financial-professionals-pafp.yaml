first_step:
  how: Register for a lunch and learn through the registration link on the events page, or start a membership
    application with the Join Now link.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Events have public registration links and membership is open to individuals, students, and retired
    or in-transition people, but the site does not say whether non-members can join the monthly meetings.
  what_to_expect: Sessions are educational talks for finance, treasury and accounting people, with time
    to network. Meetings run both virtually and in person, and members get discounted registration and
    access to member-only events.
  first_visit_tips:
  - Check the registration page for the price before you sign up, because the site does not list event
    prices.
  - The session listed on the events page is virtual, so you can attend from home.
  - The only street address on the site is the Conshohocken office, which is outside the city.
