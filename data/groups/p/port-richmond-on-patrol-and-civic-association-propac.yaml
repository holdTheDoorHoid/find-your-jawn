first_step:
  how: Email propac19134@gmail.com or call (215) 380-9783 and ask when the next meeting is and whether
    it is held at the Columbia Social Club on Almond Street.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The only public page we could open is a Facebook group that showed its name and member count
    without logging in, with no posts or meeting times, so the way in is unclear. The City list gives
    an email, a phone number, and a contact name.
  what_to_expect: We could not find a public description of a meeting, so we do not know how long it runs,
    who attends, or what it costs. The contact can tell you what the next meeting will cover.
  first_visit_tips:
  - Ask the contact for the meeting date, time, and room before you go.
  - Ask whether the meeting is open to anyone who lives nearby.
