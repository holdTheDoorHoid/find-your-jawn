summary: The St. Patrick's Day Observance Association puts on the Philadelphia St. Patrick's Day Parade
  each March. The route runs from John F. Kennedy Boulevard down Market Street to Penn's Landing. Marching
  groups apply online, and volunteers can serve as marshals.
what_you_do: Marching groups and vehicles apply through the site's participant pages, and the association
  posts its rules and judging criteria. Individuals can help as marshals through the marshal section,
  which lists meeting dates, duties and assignments.
