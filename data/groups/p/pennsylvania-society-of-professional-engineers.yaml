first_step:
  how: Email the chapter's meeting reservation address to hold a seat at the next monthly talk, or watch
    a free recorded talk first.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Courses are offered to non-members and recorded talks are free to watch, but the page does not
    say whether non-members can attend the monthly talks, so the rating stops short of 4.
  what_to_expect: Monthly talks are presentations by working engineers on a single topic, and the October
    talk is listed for 7 to 8 pm. The chapter serves licensed professional engineers, so expect a room
    of engineers, and it also runs site tours and short courses. Online courses cost $5 per professional
    development hour, and some recorded talks are free to watch first, while the page gives no fee for
    monthly talks.
  first_visit_tips:
  - Email the reservation address before a talk to hold a seat.
  - Watch a free recorded talk first if you want to see the format.
  - Check the event list for the meeting place, since the page does not give one for the October talk.
