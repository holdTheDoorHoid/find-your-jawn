  notes: The accessibility page describes the Market Street building (5212 Market St), not the Cambridge
    Street Project Space where The Vibrary meets. It says that building has its public spaces on the first
    floor, no stairs or elevators, a wheelchair accessible restroom, cushioned seating on request, and
    welcomes service animals. Sign language interpreters attend some events, so check each event page.
    Confirm access at Cambridge Street before you visit.
