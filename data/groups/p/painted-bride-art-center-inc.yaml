first_step:
  how: Come to a Wednesday session of The Vibrary between 1 and 4 pm at 4029 Cambridge St; you can stay
    15 minutes or the whole afternoon.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: Regular Wednesdays are drop in, the page welcomes curious people, and it says no art experience
    is needed for workshops.
  what_to_expect: The Vibrary is a relaxed afternoon with books, conversation, coffee and tea, and listening
    sessions. Some weeks have a featured guest, and other weeks the people who come set the mood. Workshops
    and special events need an RSVP, but regular Wednesdays do not.
  first_visit_tips:
  - Bring a book or a mug to donate if you like; the space collects books for its Little Free Libraries
    and mugs for the tea service on Wednesdays.
  - For a workshop, RSVP through the link on the event listing.
  - The parking and transit notes on the site are for the Market Street building, so ask about Cambridge
    Street before you drive.
