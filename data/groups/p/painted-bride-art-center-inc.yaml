summary: A contemporary art center with a 56-year history. It hosts exhibits, screenings, artist exchanges
  and a weekly Wednesday program called The Vibrary.
what_you_do: Drop in on a Wednesday afternoon at The Vibrary, see an exhibit or screening, or RSVP for
  a workshop. The volunteer page had no open roles when checked, so check back there later.
