summary: A Philadelphia nonprofit that works to keep families together when poverty, substance use or
  contact with public systems puts them at risk. Its team has social workers, attorneys, peer mentors
  and people with lived experience of the system.
what_you_do: Reach out through the contact form on the website, or by email or phone, to ask about getting
  involved or partnering. The group builds coalitions and offers mentorship, advocacy and direct support,
  and it names partners such as JMAC For Families and Temple Legal Aid Office. The site does not describe
  a volunteer schedule or an intake process.
