summary: A volunteer group that visits people held in federal and military prisons across the United States,
  a service it says it has provided since 1968. Trained volunteers visit about once a month, keep up brief
  correspondence, and write a short report after each visit.
what_you_do: Become a volunteer visitor and commit to at least two years of visits, or give money to help
  recruit and train volunteers.
