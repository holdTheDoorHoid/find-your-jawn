first_step:
  how: Download the fillable visitor application from the Become a Visitor page, then talk with PVS staff,
    complete training and wait for facility approval before your first visit.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: The way in is a written application, a staff conversation, training and facility approval with
    fingerprinting and a background check, then a match. The group asks for at least two years, so it
    is not a drop-in group.
  what_to_expect: After approval, you are matched with one person from a waiting list and visit that same
    person about once a month for at least two years. Visits are face to face inside federal or military
    prisons; the person sets the agenda, and you listen with respect without preaching. Between visits
    you send brief correspondence and file a short online report.
  first_visit_tips:
  - Expect fingerprinting and a background check before you can visit anyone.
  - Use the Bureau of Prisons facility locator the group recommends to see whether a federal prison is
    near you.
  - Plan for a two year commitment, and tell PVS early if you need to stop so it can notify the prison
    and the person.
