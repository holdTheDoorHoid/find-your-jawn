first_step:
  how: Email autumn@phillywomenstheatrefest.org with the subject Volunteer Opportunities to offer to usher
    or help with set up and take down.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The site says it always needs volunteers and gives one email address to ask, so the way in is
    clear. It names no beginner program or orientation, so it is rated 3.
  what_to_expect: Volunteers help with ushering, set up, and take down for the festival. The site does
    not say how long a shift runs or what time it starts, so ask when you send your email. To see a show,
    you buy a ticket online first.
  first_visit_tips:
  - Use the subject line Volunteer Opportunities so your email is easy to find.
  - Ask for the shift time, the place, and how long it lasts before you say yes.
  - Join the email list on the site to hear when the next audition call opens.
