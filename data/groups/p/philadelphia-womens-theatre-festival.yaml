summary: A two-week festival held in August that shows plays and performances by local women, with a panel,
  a monologue night, and an industry brunch. Auditions for each festival are posted on its website.
what_you_do: Audition for a festival production, volunteer to usher or help with set up and take down,
  or buy tickets and attend the shows.
