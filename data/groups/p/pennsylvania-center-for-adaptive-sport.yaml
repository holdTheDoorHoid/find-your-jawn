summary: A nonprofit that runs sports, recreation and wellness programs for people with disabilities,
  from rowing and kayaking to yoga and skiing, plus youth camps and volunteer days.
what_you_do: People with disabilities can join listed programs such as rowing, cycling, climbing, yoga
  or pickleball. Volunteers help with cycling and the adaptive rowing program, and with a spring garden
  cleanup.
