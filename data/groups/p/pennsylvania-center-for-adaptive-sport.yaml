schedule:
  text: 'Volunteer shifts repeat each season from April to October, weather permitting: cycling on Saturdays
    (9 am to 1 pm) and Sundays (1 to 3 pm, on a Chester County trail), and rowing Monday to Thursday (5
    pm to dusk), mostly at the boathouse. Program times for athletes are not listed on the site.'
