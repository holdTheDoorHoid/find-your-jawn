first_step:
  how: Use the Learn More form on the contact page to ask about a program, or sign up for an adaptive
    rowing volunteer training through the form on the rowing volunteer page.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The rowing volunteer page says no rowing experience is needed, that training and orientation
    are provided for new volunteers, and that sign-up is by a linked form. Participant eligibility is
    in a document the page links to but does not show, so the athlete route is less clear.
  what_to_expect: Volunteers greet athletes and sign them in, ride or row alongside them, and help set
    up equipment and adaptations. The 2026 rowing volunteer training sessions were listed for April 21,
    22, 28 and 29, 5:30 pm to dusk, and no minimum volunteer hours are required. Participant fees are
    not listed on the site.
  first_visit_tips:
  - The boathouse at 1233 Martin Luther King Drive has free parking and cycle access, according to the
    rowing page.
  - Ask through the form about the next training date, since the 2026 sessions were held in April and
    no 2027 dates are posted.
