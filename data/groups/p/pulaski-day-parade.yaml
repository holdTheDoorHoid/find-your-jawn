summary: The Pulaski Day Parade is a Polish American parade on the Benjamin Franklin Parkway each October.
  The Polish American Congress's Eastern Pennsylvania Division sponsored it in 2017, and the Polish American
  Cultural Center helped host the 2024 edition.
what_you_do: Marchers walk or ride in the parade. The last listing we could read (2017) said participants
  meet at 20th Street and the Parkway. No current sign-up was found.
