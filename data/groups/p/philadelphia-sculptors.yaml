first_step:
  how: Go to the RE:FORM show at Art on the Ave, 3808 Lancaster Ave, listed through October 30, or to
    the Philadelphia Open Studio Tour on Saturday, October 10 or Sunday, October 11, from noon to 6 pm.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Shows and the studio tour are open to visitors, and the membership page gives a clear way to
    join. The group's listing pages are empty, so confirm dates first.
  what_to_expect: A visit means walking through sculpture shows at your own pace. The group's pages do
    not give visitor admission, gallery hours, or whether guests must book, so check those before you
    go.
  first_visit_tips:
  - Email the group before you go, since its exhibitions and upcoming events pages both show no results
    right now.
  - The studio tour runs noon to 6 pm on both weekend days, October 10 and 11.
  - The office at 1315 Walnut St is not the show space; the RE:FORM show is at 3808 Lancaster Ave.
