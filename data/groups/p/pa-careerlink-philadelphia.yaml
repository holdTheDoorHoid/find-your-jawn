first_step:
  how: Call 1-833-750-5627, or use the appointment link on the contact page to book a career appointment.
    To attend a workshop, register through the workshops calendar.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The site lists a Welcome to PA CareerLink orientation workshop for first visits, plus a phone
    line and online appointment booking, all at no cost.
  what_to_expect: Start with the Welcome to PA CareerLink orientation, which runs about an hour at a library
    or center. Staff then help with resumes, interviews, LinkedIn and job searches, and many sessions
    are offered in Spanish. Workshops are free but need a PA.gov account to sign up.
  first_visit_tips:
  - Create your PA.gov account before you register, since the site says workshops need one
  - Ask for Spanish-language sessions or other help when you book, since aids are available on request
  - Confirm the time on the event page, because some listings show unusual end times
