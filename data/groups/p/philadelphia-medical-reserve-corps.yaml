ein: null
summary: A city volunteer unit that helps during public health emergencies, disasters, and big public
  events such as the marathon. You do not need a medical background to join.
what_you_do: Register online with the state, pass a background check, and attend an orientation, which
  is strongly encouraged before any deployment. Then take trainings and get called for deployments when
  needed. Medical volunteers give screenings, medicines, or vaccines; others answer phones, do data entry,
  or interpret.
