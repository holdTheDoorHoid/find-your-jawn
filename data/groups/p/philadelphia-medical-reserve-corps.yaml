first_step:
  how: Register on the state volunteer site (serv.pa.gov), choose Philadelphia MRC, and pass the background
    check before you attend orientation.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Open to adults 18 and up, but you apply, pass a background check, and get accepted before orientation,
    so you see the work only after approval.
  what_to_expect: Acceptance can take a few days or weeks after you apply, since the background check
    runs first. Orientation is held one or two times a year, in person or online, and it is strongly encouraged
    before any deployment. After that you are invited to trainings, exercises, and real deployments as
    they come up, so the work varies.
  first_visit_tips:
  - Use your legal first and last name exactly as on your birth certificate or photo ID, because the check
    matches it.
  - Have your date of birth and your occupation ready for the online form.
  - Watch your email, since acceptance and training notices come that way.
