summary: An all-volunteer group of Powelton Village residents that is also a Registered Community Organization,
  so developers talk with it about nearby zoning and building plans. It also organizes clean-ups and social
  events.
what_you_do: Members vote on the association's decisions and leadership. Neighbors review nearby building
  and zoning proposals and share the association's view with the City and developers. Volunteers also
  run clean-ups and social events and care for parks, playgrounds and sidewalks.
