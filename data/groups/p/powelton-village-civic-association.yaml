first_step:
  how: Fill out the online membership form on the group's membership page.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Any Powelton Village resident, owner or renter, can join through an online form, and meeting
    dates are posted publicly. The site does not say whether non-members can attend meetings.
  what_to_expect: The association reviews nearby building and zoning proposals, and its membership meetings
    run 7 to 8:30 pm. Some meetings are by video, and the link is sent by the neighborhood email list
    before each one.
  first_visit_tips:
  - Get on the neighborhood email list so you receive the video link before a virtual meeting.
  - For an in-person meeting, the church is at 3500 Baring Street.
  - Current residents who are members can vote on the association's decisions and leadership.
