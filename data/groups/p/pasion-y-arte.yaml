  basis: Classes are open to the public at listed drop-in prices with a clear sign-up link, but the page
    does not say that beginners are welcome.
  what_to_expect: 'Elba Hevia y Vaca, the company''s artistic and executive director, teaches the classes
    at the studio on Overbrook Avenue. Every level covers the same core areas: posture and placement,
    footwork, and music, including rhythm and clapping. A drop-in class is $18, or $96 for a card of six,
    and students and dance professionals can ask about a discount.'
  first_visit_tips:
  - Check the Classes page for the current day and time grid before you come.
  - Email info@pasionyarteflamenco.org if you are unsure which level suits you.
  - Students and dance professionals can ask about a discount when you sign up.
