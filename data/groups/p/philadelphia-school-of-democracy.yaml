first_step:
  how: Fill out the interest form on phillyfreeschool.org, then come to an Open House (children are welcome)
    or book a virtual Q and A.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: 'The site lays out the steps for new families: an interest form, an Open House, an application
    with a $50 fee, a conversation with the family, and a trial week at the school.'
  what_to_expect: The first conversation is an informal talk with the parents or guardians and the prospective
    student, not a typical school interview. It is followed by a full trial week at the school so both
    sides can check the fit. The school day runs 8:30 am to 4 pm, Monday to Friday, and tuition is set
    on a sliding scale by family finances.
  first_visit_tips:
  - Bring your child to the Open House, since children are welcome there.
  - If you cannot visit in person, ask about a virtual Q and A session.
  - Apply for tuition help through FACTS, since the scale depends on family finances.
  - Plan transport for the 8:30 am to 4 pm school day, and ask about extended care if you need it.
