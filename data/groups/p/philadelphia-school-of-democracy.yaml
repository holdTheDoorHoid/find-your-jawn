cost:
  level: paid
  text: Tuition is a sliding scale set through a third party called FACTS. For 2025 to 2026 the range
    was $1,800 to $17,800 a year, and a $50 application fee applies. The school says scholarships and
    programs help families for whom the lower end is still hard to pay.
