first_step:
  how: Pay the membership dues by PayPal or by check, wait for the registration form, then email it with
    your resume to membership@pwift.org.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Membership needs dues and a registration form before you get to the member events, and the events
    list shows no current public events to try first.
  what_to_expect: Individual membership is for people working in film, video or related media. Joining
    is a yearly payment, then a registration form and resume go to the membership team. Members get free
    admission to members-only events, reduced prices on special events and workshops, a bi-monthly newsletter,
    and access to a members' Facebook group.
  first_visit_tips:
  - Email info@pwift.org with questions before you pay, because the public events list is out of date.
  - Students need a valid student ID for the $25 rate, and the student tier is tied to schools in the
    Greater Philadelphia area.
  - The Palmer Enfield grant for first-time female directors closed for 2026 on February 28. Watch the
    grants page for the next round.
