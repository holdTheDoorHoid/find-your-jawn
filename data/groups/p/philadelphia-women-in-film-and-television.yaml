summary: A nonprofit that supports and recognizes women working in film, TV, video and multimedia in the
  Philadelphia area. Members get networking and reduced prices on workshops, can join committees, and
  the group runs a grant for first-time female directors.
what_you_do: Pay yearly dues to become a member, join one of the group's committees, and take part in
  member events when they are listed. The events page lists no current events; its newest listings are
  from 2024.
