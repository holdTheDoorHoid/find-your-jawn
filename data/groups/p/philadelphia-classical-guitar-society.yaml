first_step:
  how: Come to a free guitar salon on a Sunday afternoon (it starts at 1:30 pm at Settlement Music School,
    416 Queen St), or buy a ticket to a Sunday concert.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: Salons are free, listeners are welcome, and the page says some players are performing for the
    first time. Players sign up with a short form at least 24 hours ahead, which is a clear way in. The
    Concert Ensemble is for intermediate and advanced players only.
  what_to_expect: A salon is an informal Sunday afternoon session where members play short pieces, up
    to 10 minutes each, for a listening audience. Some players are trying a piece out for the first time,
    and some come to get feedback. The salon is free and in person, and the concert that follows at 3
    pm needs a ticket.
  first_visit_tips:
  - The salon is free, but the concert after it needs a separate ticket.
  - If you want to play, fill out the performer form at least 24 hours before the salon, or announce your
    piece on the day.
  - Questions about salons go to the board members who run them, whose contact details are on the salon
    page.
