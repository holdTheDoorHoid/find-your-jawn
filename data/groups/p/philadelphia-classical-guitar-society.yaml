summary: A nonprofit that presents classical guitar concerts, a festival, and a competition in Philadelphia
  and Newtown, PA. It also runs a guitar ensemble and hosts guitar salons.
what_you_do: Buy tickets for the concert season, or drop in on a free Sunday guitar salon, where members
  play short pieces for listeners. Intermediate and advanced players of any age can apply to the Concert
  Ensemble, a guitar orchestra for PCGS members, after an audition.
