summary: An LGBTQ and ally mixed voice chorus in Philadelphia that holds two audition windows a year and
  also welcomes non-singing members.
what_you_do: Audition to sing with the chorus, or join as a non-singing member, by emailing the membership
  team. Rehearsals are on Tuesday nights in Center City. The chorus also has a table at public events
  where members sign people up for auditions.
