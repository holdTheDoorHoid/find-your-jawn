first_step:
  how: Email membership@pvop.org to sign up for an audition, or to join as a non-singing member.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: There is a clear, low-bar way in by email, no training is required, and non-singers can join
    too. Singing members still need the audition.
  what_to_expect: Rehearsals are on Tuesday nights at Resurrection Philadelphia in Center City. The join
    page gives no start time and does not say how long a rehearsal runs, so ask by email first. Singers
    must audition before they join, and the site lists no dues or fees.
  first_visit_tips:
  - Email membership@pvop.org before you come, since the site does not give rehearsal start times.
  - Prepared music is optional at the audition, so you do not need to learn a piece first.
  - Stop by the PVOP table at a public event such as the Philly Pride Festival or OURFest, where members
    sign people up for auditions.
