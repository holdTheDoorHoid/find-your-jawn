  newcomer_friendliness: 3
  basis: Concerts are public and the mailing list form is open to anyone, but the site names no volunteer
    roles, so the ways to help are general.
  what_to_expect: A PRISM concert is a performance by four saxophonists, sometimes with a guest musician
    such as a pianist. Programs mix classical and jazz music, and recent releases include spoken word.
    The Concerts page lists the date, city and venue for each show but does not give ticket prices, so
    check the Find Out More page for the event before you go.
  first_visit_tips:
  - Check the Find Out More link on the concert listing for the venue and any admission details.
  - Email info@prismquartet.com with questions, since the site does not list ticket prices.
