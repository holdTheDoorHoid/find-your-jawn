first_step:
  how: Join the Discord chat, or sign up for the newsletter, to hear about the next monthly Playtest Night
    or game jam.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The home page says the group supports developers at every level and names a Discord chat and
    a newsletter as ways in, but it does not say whether events are open to the public.
  what_to_expect: Playtest Nights are where creators show a game in progress and get feedback from other
    developers. Game jams are short builds that run from a few days to a few weeks. The site does not
    say whether events are open to the public, what they cost, or where they meet, so check the Discord
    or newsletter for details before you go.
  first_visit_tips:
  - Say hello in the Discord first, since it is the group's main way to connect with members.
  - Ask in the Discord whether a playtest night is open to newcomers before you go.
  - If you have a game to test, bring it to a playtest night, where creators show their games and get
    feedback.
  - The group also posts on Meetup, which may list dates that the website does not.
