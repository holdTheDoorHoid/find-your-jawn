first_step:
  how: Email info@phillyjusticeproject.org to talk about which volunteer role fits your skills, interests
    and availability.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The group invites anyone to start with an email about volunteering. The site names no application
    steps, open roles or training, and its internships are unpaid and aimed at students.
  what_to_expect: Your first step is an email conversation about your skills, your interests and how much
    time you can give. The site does not describe shifts, training or a time commitment, so ask about
    those in your first email. Internships are unpaid and hybrid, with in-person meetings, court hearings
    and sometimes visits to prison and jail facilities.
  first_visit_tips:
  - Write a short email about your skills and the hours you can give.
  - Ask about time commitment, training and whether a role is remote or in person, since the site does
    not say.
  - 'For an internship, check eligibility: the page lists law students, graduate students in the social
    sciences, and advanced undergraduates.'
  - For an internship, expect travel to court hearings and to prison and jail facilities.
