summary: A Philadelphia nonprofit that works to stop punishing women and girls who are survivors of gender
  violence. It gives legal help, pushes for policy change, trains court and police staff, and takes on
  volunteers and interns.
what_you_do: Volunteers bring skills such as legal help, research, counseling, teaching, photography and
  fundraising. Interns do research and writing, outreach, advocacy campaigns, and parole and commutation
  paperwork.
