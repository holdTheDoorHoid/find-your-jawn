summary: Philadelphia's lower-voice a cappella chorus. Singers rehearse each week, perform in concerts,
  and take part in chapter quartet contests.
what_you_do: Audition year-round to join the chorus and sing at weekly Tuesday rehearsals. Prospective
  singers can visit a rehearsal first, and the events page lists concerts and showcases.
