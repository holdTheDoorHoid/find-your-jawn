first_step:
  how: Fill in the guest registration form on the Visit page, then come to a Tuesday rehearsal. When you
    are ready, audition through the Audition page.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The site invites prospective singers to a rehearsal, says you can audition on a first visit,
    and says sheet music reading is not required.
  what_to_expect: 'A rehearsal runs from 7:15 to 9:45 pm on Tuesdays at the Philadelphia Ethical Society,
    and visitors are invited after they register. The audition has three short parts: singing a memorized
    section of a provided song on a voice part you choose, singing up to 30 seconds of any song a cappella,
    and learning a simple barbershop tag with others.'
  first_visit_tips:
  - Audition materials are in a linked folder, so you can prepare at your own pace.
  - On the second Tuesday of the month, rehearsal starts in the second-floor community room and moves
    to the main floor at about 8:15 pm.
  - Some metered street spots are free after set hours, and many are free after 6:30 pm; evening lots
    run about $13 to $24.
