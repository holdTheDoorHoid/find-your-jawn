summary: Recruits several hundred trained volunteers for one night each January to canvass the city overnight
  and count and survey people experiencing unsheltered homelessness.
what_you_do: Walk an assigned zone with a team overnight, ask people living outdoors if they will take
  a short survey, and record answers through a secure online link.
