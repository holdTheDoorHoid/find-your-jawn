first_step:
  how: Sign up through the city's online volunteer form before its deadline (in 2025 it closed January
    6, about two weeks before the count), then complete the OHS training before the night.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Open to the public through a yearly online form, and OHS says all volunteers get training; a
    2026 city post describes a first-time volunteer, but no page says newcomers get a special welcome
    or that you can just show up.
  what_to_expect: 'The count is one long night: teams check in, get a short briefing, and then go out
    in assigned zones. The overnight count runs from 10 pm to 4 am, though a 2026 volunteer''s team finished
    around 1:45 am. That volunteer described the night as emotional and fulfilling, and said an experienced
    outreach worker led their team.'
  first_visit_tips:
  - Plan for about five hours out, since one 2026 volunteer's shift ran about four and three quarters
    hours.
  - Watch the OHS training videos before the night, as a 2026 volunteer did.
  - Arrive for check-in before the 10 pm start, since the team reviews materials and assigns drivers first.
  - Past volunteers often wore a blue shirt with the year's theme, so check what the organizers ask you
    to wear.
