summary: Neighbors in Pennsport who meet most months with city and state officials to hear about zoning
  and building projects. The group also runs neighborhood cleanups and park volunteer days.
what_you_do: Members follow zoning and development plans in the area and meet to talk them over. Members
  can also join the cleanups and park volunteer days.
