first_step:
  how: Come to the second Wednesday general meeting at 7 pm at EOM Athletic Association, 144 Moore St.
    There is no meeting in July or August.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: The group's site says in-person attendance is the best way to take part and that anyone who lives
    in Pennsport counts as a member. No sign-up step is listed, but the site does not say newcomers are
    specially welcomed.
  what_to_expect: Meetings are held in the hall at EOM Athletic Association on Moore Street. Recent meetings
    covered updates from city and state offices, utility construction work, and zoning variance requests,
    so you can listen before you speak. The site does not say how long a meeting runs.
  first_visit_tips:
  - Plan around the summer break, since there are no meetings in July or August.
  - Come in person, because the group says that is the best way to take part.
