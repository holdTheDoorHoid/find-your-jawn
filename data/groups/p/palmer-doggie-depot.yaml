summary: A free, volunteer-run dog park in Fishtown. The New Kensington Community Development Corporation
  built it at the Shissler Recreation Center, and it asks visitors for donations to keep it open.
what_you_do: Visit with your dog after reading the park rules. To help, email palmerdoggiedepot@gmail.com
  about clean-ups, event setup, grant writing, or board committees. You can also join as a Bark Ranger
  supporter.
