first_step:
  how: Read the park rules, then visit with your dog. To volunteer, email palmerdoggiedepot@gmail.com.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: The park is free and open to dogs and owners who follow the rules, and the volunteer and Bark
    Ranger pages give a clear way to get in touch or sign up.
  what_to_expect: The park is run by volunteers, with no attendant on duty, so visitors use it at their
    own risk. Owners must keep dogs supervised at all times, and leashes come off when you enter. Children
    10 and under may not come in, and children 11 to 15 must have an adult with them.
  first_visit_tips:
  - Dogs must be licensed and vaccinated under city law. Puppies under 4 months, unneutered males, females
    in heat, and sick dogs are not allowed in.
  - Collars must stay on, and prong, choke, heavy chain link, and spike collars are banned.
  - Only standard tennis balls are allowed as toys, and owners must dispose of dog waste properly.
  - No smoking, food, or alcohol is allowed in the park.
