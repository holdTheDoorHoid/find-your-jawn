first_step:
  how: Come to Sunday worship at 10 am at 8855 Germantown Avenue, or call 215-247-8855 or email info@chestnuthillpres.org
    first to ask about visiting.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: A Warm Welcome page says all are welcome and invites people to visit, with a phone line, an email
    address and a contact page for questions. There is no newcomer class or first-timer event, so it does
    not reach a 5.
  what_to_expect: A Sunday visit starts with worship at 10 am, with scripture, preaching and music. Children
    through grade 5 leave for church school before the sermon, while youth and adults stay in worship.
    Coffee and fellowship follow around 11:15, and an adult education hour called Second Hour runs at
    11:30. The site does not say how long the service lasts or what to wear.
  first_visit_tips:
  - Children through grade 5 go to church school before the sermon; sixth graders can choose church school
    or staying in worship.
  - Coffee is served after worship, and fellowship starts at 11:15.
  - The weekly bulletin shows the week's service, and a livestream is offered if you want to watch first.
