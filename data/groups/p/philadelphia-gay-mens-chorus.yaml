first_step:
  how: Book a singer audition through the link on the audition page, which opens a few weeks before each
    round, or email membership@pgmc.org to ask for the next date.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Anyone who sings tenor, baritone or bass can book an audition, but the site does not say whether
    visitors can sit in on rehearsals.
  what_to_expect: An audition is one on one with the director and takes about 5 minutes. You do range
    and pitch exercises, sing a familiar song the director picks, and then sing your part from a piece
    you probably do not know. The page says you do not need a prepared piece.
  first_visit_tips:
  - You need basic note names, sharps, flats and time signatures, but you do not need to read music perfectly.
  - When you book, give your name and a phone number or email, and write again if you have no reply within
    about a week.
  - The audition page gives no parking or transit details, so ask when you book.
