summary: A men's chorus that performs concerts, does outreach with students, and takes bookings for events,
  with a focus on LGBTQ+ acceptance. It seeks tenor, baritone and bass singers, and has a separate dancers
  page.
what_you_do: Audition to sing tenor, baritone or bass (about 5 minutes, one on one with the director),
  or ask the volunteer contact about helping out. You can also come to a concert or the 80s Prom Night
  fundraiser, or become a member or donor.
