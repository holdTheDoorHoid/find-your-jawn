first_step:
  how: Email Parks and Recreation's stewardship office (pprstewardship@phila.gov) and ask to be connected
    with this Friends group and whether beds are open.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The garden's own website now leads to an unrelated site and the newest coverage found is from
    2021, so the only route we could confirm is an email to the city's stewardship office.
  what_to_expect: We could not confirm what a visit is like today. In 2021 news coverage the garden was
    still being built on the playground grounds, with a goal of 50 raised beds rented each year. Ask the
    stewardship office whether beds are open and when work days are, before you travel to the site.
  first_visit_tips:
  - Confirm with the stewardship office that the garden is operating before you go.
  - The garden is on the grounds of Pleasant Playground at 6757 Chew Ave.
  - Ask about the current bed fee, since the only price found is from 2021.
