summary: A hiking club founded in 1931 that leads hikes most weekends in Philadelphia and nearby counties,
  from easy walks to strenuous outings. Non-members can join public hikes.
what_you_do: Join a led hike, check its difficulty rating, and over time members can train to lead hikes
  themselves. The club also supports trail maintenance and outdoor education.
