summary: A nonprofit hiking club, founded in 1931, that leads hikes most Saturdays and Sundays. Most hikes
  run 5 to 10 miles in Philadelphia and the nearby counties.
what_you_do: Pick a public hike from the club's list, contact its leader, and hike with the group. Members
  can also join member-only excursions, which have included trips abroad.
