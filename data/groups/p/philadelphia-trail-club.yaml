first_step:
  how: Choose a public hike from the club's public hike list, then contact its leader directly and give
    a phone number for updates.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Non-members can join a few public hikes as guests, and each hike lists its difficulty and length
    so a newcomer can pick one.
  what_to_expect: A public hike is a day hike with a club leader, usually 5 to 10 miles, and each one
    has a difficulty rating and mileage. Everyone, members and guests, signs a waiver that the leader
    passes around before the hike starts. Start times and meeting places are not on the public hikes page,
    so the hike listing or the leader supplies them.
  first_visit_tips:
  - Start with a Class 1 hike, or Class 1+ if you are comfortable with some hills; the scale runs from
    1 to 4.
  - Bring your own water, and lunch if the hike description says so, and wear proper footwear.
  - Give the leader a phone number when you sign up so you get last-minute changes.
  - Expect to sign a waiver before the hike starts.
