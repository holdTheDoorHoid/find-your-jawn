summary: Passyunk Square Civic Association is a volunteer-run nonprofit for the Passyunk Square neighborhood,
  which runs from Broad Street to 6th Street and from Washington Avenue to Tasker Street. It works on
  local history and character, neighborhood events, and small business support, and it follows zoning
  and development plans in the area.
what_you_do: Neighbors can attend the monthly general membership meetings and the free zoning meetings,
  join the yearly tree plantings and tree-cycling, and fill in the get-involved form so a volunteer can
  follow up.
