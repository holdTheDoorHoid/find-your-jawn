schedule:
  text: General membership meetings are held on the first Tuesday of most months (not July or August)
    at 6:30 pm. Tree plantings happen each April and November, tree-cycling each January, and board elections
    each May. A sidewalk sale runs twice a year. Zoning meetings are free and open to the public, but
    the site does not give their day or time.
