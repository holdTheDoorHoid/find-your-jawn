first_step:
  how: Come to the general membership meeting on the first Tuesday of the month at 6:30 pm at the older
    adult center on Passyunk Avenue, or fill in the get-involved form on passyunk.org or email contact@passyunk.org.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The group says any resident or business owner can take part, whether longtime or new to the area,
    and it gives a form and an email to start. General and zoning meetings are free and open to the public.
  what_to_expect: General membership meetings are held in person at the South Philadelphia Older Adult
    Center, and speaker notices usually go out by email and Facebook the Friday before. Zoning meetings
    are free and open to the public. The site does not say how long meetings run.
  first_visit_tips:
  - Watch for the speaker notice by email or Facebook the Friday before the meeting.
  - Ask where the zoning meetings are held, since the site does not list a place.
