summary: An all-volunteer youth baseball league with five age divisions, from 3 year olds to 12 year olds.
  Its fall 2026 in-house season is underway, and volunteers coach, umpire and keep the fields up.
what_you_do: Kids play weekly practices and Friday or Saturday games. Adults can coach, umpire, help maintain
  the fields or raise money, after a background check.
