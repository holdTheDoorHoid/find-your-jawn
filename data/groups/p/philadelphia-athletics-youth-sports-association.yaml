first_step:
  how: Email PAYSACommissioner@gmail.com to ask about the next season and fee help before you register,
    then watch the site for the next sign-up form. The fall 2026 sign-up closed on August 15.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Any child in an age division can sign up through a public form each season, but the page does
    not describe a program for first-time players.
  what_to_expect: Kids play one weekday evening practice and one game a week. Practices run about 6 to
    8:45 pm depending on division, and the youngest group meets on Saturday mornings. Adult volunteers
    coach, umpire and help keep the fields ready, and every volunteer must pass background checks. The
    page does not give time commitments for volunteers.
  first_visit_tips:
  - 'Check the age cutoff: divisions use age as of May 1.'
  - If the fee is a problem, email the commissioner before you register.
  - Volunteers need a Pennsylvania State Police criminal history report and a Child Abuse History certification.
    Coaches and volunteers also take an online abuse-reporting course, though sign-up for it was not open
    when the page was read.
