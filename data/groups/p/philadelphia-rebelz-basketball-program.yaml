first_step:
  how: Fill in the registration form at rebelz.club/register for the 16U or 17U AAU team, then attend
    the tryout when the dates are sent to you.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Team places need a registration, a tryout and a coach's selection before payment, so this is
    not a drop-in. The register form itself is public.
  what_to_expect: Coaches teach the basics of the game and focus on teamwork and discipline, and the teams
    play in competitive events. The site does not say how often teams practice, where they meet, or what
    a tryout involves.
  first_visit_tips:
  - 'Check your birth year first: the AAU teams are 16U (born 2008) and 17U (born 2007).'
  - Ask where practices and tryouts are held, since the site gives only a mailing address.
  - Tryout dates are sent to you after you register, so watch for a message.
