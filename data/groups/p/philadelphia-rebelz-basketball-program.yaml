summary: A North Philadelphia basketball program for young players. It fields teams, runs coaching, hosts
  clinics and tournaments, and gives away gear to the community.
what_you_do: Try out for an AAU team (16U for players born in 2008, 17U for players born in 2007), play
  in the Grindhouse League, or come to a free gear giveaway, clinic, or 3v3 tournament. Some events are
  for 18 and over or invitation only.
