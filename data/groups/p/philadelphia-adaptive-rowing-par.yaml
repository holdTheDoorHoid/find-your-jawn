first_step:
  how: Fill in the rower form on the PCAS rowing page at centeronline.com/adapted-rowing. You can also
    call 215-765-5118 to ask first.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The page says rowers at every level are welcome, that equipment and coaches are provided at each
    session, and it gives a form to start. Rowers must be 14 or older.
  what_to_expect: Sessions run on the river on Tuesday and Wednesday evenings from 5:30 pm until dusk
    in season. Coaches and volunteers staff each session, and volunteers help rowers into and out of the
    boat and row with them. Equipment is provided, and no fee is listed.
  first_visit_tips:
  - Confirm the day and season before you go, since the PCAS pages do not agree on either.
  - The boathouse has free parking and bike racks, according to the volunteer pages.
  - Ask ahead how a wheelchair user takes part, since the rowing page does not say.
