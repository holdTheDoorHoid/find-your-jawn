summary: Rowing for people with disabilities on the Schuylkill River, run by the Pennsylvania Center for
  Adapted Sports. Members can row for fun or race, with coaches who have college and national team experience.
what_you_do: Row on the Schuylkill with coaches and volunteers in season, which the program page gives
  as May through October. Equipment is provided, and some rowers go on to regattas.
