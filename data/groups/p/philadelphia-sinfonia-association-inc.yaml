first_step:
  how: Fill in the audition registration form on the auditions page, or email info@philadelphiasinfonia.com
    to ask for an immediate audition.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Volunteer and event contacts are published, but playing in an ensemble requires an audition,
    so the first step for a player is registering for one.
  what_to_expect: 'An audition is a short test: major scales, two contrasting pieces for the top two ensembles,
    and sight-reading of music the group provides. The youth string ensemble takes students ages 10 to
    16, and the page does not say whether adults may audition. The auditions page lists an extended audition
    on Saturday, October 24, from 12:30 to 2:30 pm, for the 2026 to 2027 season.'
  first_visit_tips:
  - Prepare major scales up to four flats and four sharps, plus two contrasting pieces if you are trying
    out for the top two ensembles.
  - Expect sight-reading at every audition, using music the group provides.
  - The mailing address on the site is not the rehearsal room; rehearsals are at 1212 Wood Street.
