summary: A nonprofit that gives young musicians in the Delaware Valley high-level orchestra playing experience.
  It runs four ensembles and puts on concerts and events the public can attend.
what_you_do: Young musicians audition for one of four ensembles and rehearse at The Howard Center for
  the Arts. Listeners can attend the group's listed concerts, and volunteers help keep tuition low.
