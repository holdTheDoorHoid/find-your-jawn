summary: A Renaissance music ensemble that plays on period instruments in concerts in Philadelphia, Wilmington,
  DE, and online. It also teaches recorder and early wind instruments in classes and workshops.
what_you_do: Go to a concert, buy a season pass, or take a class or workshop such as Recorder Fest, the
  early double reed and brass workshop, or a recorder class. The site also lists volunteer roles and a
  newsletter. Membership and auditions are not mentioned.
