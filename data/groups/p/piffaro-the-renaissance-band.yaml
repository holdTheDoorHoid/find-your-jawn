summary: A Renaissance music ensemble that plays on period instruments in concerts in Philadelphia, in
  Wilmington, DE, and online. It also runs a free recorder class for students at one school, and it needs
  volunteer ushers for its concerts.
what_you_do: Go to a concert, usher at one for free admission, or watch for the next Recorder Fest or
  early music workshop on the site.
