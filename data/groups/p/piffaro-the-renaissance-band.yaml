first_step:
  how: Buy a ticket for the October 16 or 17 concert through the Get Tickets link on piffaro.org/concerts,
    or send the usher volunteer form.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Concerts are open to the public with a ticket, and ushers are recruited through a public form.
    No public classes or ensemble auditions are listed.
  what_to_expect: The October concerts are held in churches and play Renaissance music on period instruments.
    Ushers arrive about 45 minutes before the performance and stay 15 to 20 minutes after it ends, and
    they get free admission.
  first_visit_tips:
  - Ask for wheelchair or walker friendly seats when you order your ticket.
  - Full-time students with ID and youth can get free tickets, so have your ID ready.
  - The October 16 concert is at Church of the Holy Trinity in Rittenhouse Square, and the October 17
    concert is at Presbyterian Church of Chestnut Hill.
  - For questions the FAQ does not answer, such as late seating and refunds, email info@piffaro.org or
    call 215-235-8469.
