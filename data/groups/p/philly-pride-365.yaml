summary: Philly Pride 365 puts on the Philadelphia Pride March and Festival and runs OURfest, a National
  Coming Out Day festival. It also holds civic forums and year-round programs for LGBTQ+ visibility and
  economic inclusion in the city.
what_you_do: Volunteers can carry balloons in the march, and performers can register for the color guard.
  Both 2026 listings are closed, so watch the site for the next volunteer calls.
