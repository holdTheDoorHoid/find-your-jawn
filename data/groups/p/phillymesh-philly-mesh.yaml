first_step:
  how: Join the Philly Radio and Mesh Discord, with the invite link on phillymesh.net, then start with
    the Getting Started guide and ask questions in the chat.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The Getting Started guide is written for people setting up their first node and gives step-by-step
    starts, and the MeshCore intro is aimed at people new to it. The public Discord is open to chat. The
    site does not say that meetups welcome newcomers.
  what_to_expect: Most of the activity happens in the Discord, where local Meshtastic and MeshCore users
    answer questions. The guide walks you through a cheap starter node set up by a window for several
    hours, then a battery node later. The site lists no membership fee, but you will need to buy radio
    hardware.
  first_visit_tips:
  - Read the Getting Started guide first, and check its date, since the guide says some parts may be out
    of date.
  - Ask questions in the Discord before you buy hardware.
  - Watch the Discord meetups channel for the next local event.
