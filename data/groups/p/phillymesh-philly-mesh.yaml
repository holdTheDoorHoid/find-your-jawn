summary: Hobbyists who build and run Meshtastic and MeshCore radio nodes across the Philadelphia area,
  and who share how-to guides for newcomers. They also experiment with AREDN mesh networks.
what_you_do: Join the Philly Radio and Mesh Discord to ask questions and meet local people, follow the
  Getting Started guides to set up a node, and try mesh experiments with other members. Local meetups
  are announced in the Discord.
