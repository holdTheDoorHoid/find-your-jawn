first_step:
  how: Send an inquiry through the volunteer form on paaff.org/volunteer, or ask about volunteering at
    a screening or talk.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The volunteer page says film experience is not required and gives an inquiry form to start, so
    it explicitly welcomes newcomers.
  what_to_expect: Festival volunteers help with programming and screenings during the 11-day festival,
    and staff volunteers join committees that plan the work year-round, such as sponsorship, marketing,
    programming, guest services or volunteer coordination. The site does not say how long a shift runs
    or how many people it needs, so ask in your inquiry.
  first_visit_tips:
  - 'Say which role you want in your inquiry: a festival shift or a year-round committee.'
  - Ask about shift length before you commit, since the site does not give it.
  - Each shift earns a volunteer shirt, one free ticket to a paid event, and food.
