summary: A nonprofit that runs a yearly film festival and year-round screenings and talks about Asian
  American, Native Hawaiian and Pacific Islander stories. Volunteers help run the festival and the year-round
  work.
what_you_do: Volunteer for festival shifts or on a year-round staff committee (sponsorship, marketing,
  programming, guest services or volunteer coordination) through the inquiry form on its site. Or attend
  a screening or talk.
