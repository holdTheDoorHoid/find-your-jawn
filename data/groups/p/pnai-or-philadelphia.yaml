  notes: 'The regular Shabbat space has steps and is not immediately wheelchair accessible. High Holy
    Day services may be held in Fellowship Hall, which has a ramp at the Westview Street entrance. Nearest
    SEPTA: Upsal Station on the Chestnut Hill West Regional Rail line, about 3 blocks away, and the H
    bus stops about 1 block away. The visit page names Rabbi Marcia Prager as the contact for access help.'
