first_step:
  how: Come to a Saturday morning service, in person or on Zoom. For the Zoom Torah study, read the Torah
    Study info sheet linked on the site first.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The site says all are welcome, including people who are not Jewish and people with questions
    or doubts, and it explains how a newcomer can join the Zoom Torah study.
  what_to_expect: The prayer style is lively and participatory, mixing Hebrew and English songs with time
    for reflection. The Shabbat service runs from 10:30 am to about 1 pm, and a potluck lunch follows.
    New people can join the Zoom Torah study from home, which runs 9:15 to 10:15 am, after reading its
    info sheet.
  first_visit_tips:
  - Enter by the Greene Street entrance. Look for the large sign on the lawn, go to the end of the walkway,
    and enter through the two red doors. Go down the steps, through the double doors, turn right, and
    the Common Room is the first door on your left.
  - Do not park on the 500 block of Westview next to the church, out of respect for the neighbors.
  - The Chestnut Hill West train has reduced weekday service and no weekend service, so on a Saturday
    take the H bus, which stops about one block away.
  - Bring a dish to share for the potluck lunch after the service, if you can.
