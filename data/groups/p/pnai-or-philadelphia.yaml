summary: A congregation in West Mount Airy that meets in the Common Room of Summit Presbyterian Church.
  Its Saturday services include morning prayer and a Torah service, followed by a potluck lunch and a
  Zoom option.
what_you_do: Come to Saturday morning services in person or on Zoom, join the Torah service and breakout
  discussion, bring a dish to the potluck, or join the Zoom Torah study from home led by the rabbi.
