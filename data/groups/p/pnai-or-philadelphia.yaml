schedule:
  text: 'Saturday mornings: Shabbat service from 10:30 am to noon, a Torah service with breakout discussion
    to 1 pm, then a potluck lunch, in person and on Zoom. A Zoom Torah study from home runs 9:15 to 10:15
    am, and a Zoom Shabbas Shmooze is sometimes held at 2:30 pm.'
