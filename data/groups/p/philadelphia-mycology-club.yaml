summary: A free club for people curious about mushrooms and other fungi in Philadelphia. Members go on
  guided forays, learn to log their finds online, and join park cleanups.
what_you_do: Join a guided fungus walk, log your finds on iNaturalist, or help with the monthly cleanup
  at Cobbs Creek Park.
