first_step:
  how: Pick a listed foray or the first-Sunday cleanup at Cobbs Creek Park, then RSVP through the event
    page if it has one.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The volunteer page says beginners are welcome, the events page says the forays are free and open
    to everyone, and the club publishes an email address and a mailing list for newcomers.
  what_to_expect: A foray is a guided walk through a park or preserve, led by experts, and most are free
    and open to everyone. The monthly cleanup at Cobbs Creek Park runs from 2 to 4 pm on the first Sunday.
    The club says both experienced mushroom people and beginners are welcome, and it is funded by donations.
  first_visit_tips:
  - Check the event page for the exact meeting spot, since some forays are outside the city, such as Ridley
    Creek State Park.
  - If you do not have a ride to an out-of-city foray, ask about carpooling through the club's email or
    its Facebook group.
  - Bring a phone if you want to log your finds in the iNaturalist app, where the club keeps a project.
