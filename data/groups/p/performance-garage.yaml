summary: A dance center in a renovated former stable on Brandywine Street. It hosts classes taught by
  resident companies and instructors, youth and education programs, performances, and a 105-seat theater.
what_you_do: Take a class taught by a resident company or instructor (ballet, Bollywood, Bharatanatyam,
  or early childhood music), or see a performance at the center.
