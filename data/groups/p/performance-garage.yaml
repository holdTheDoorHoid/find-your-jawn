first_step:
  how: Pick a class on the classes page, then contact that instructor or company directly for dates, ages
    and prices. The center's phone is 215-569-4060.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Classes are listed with their teachers, but the site gives no ages, levels, dates or prices,
    so the way in is unclear. Rehearsals are closed to the public.
  what_to_expect: The site does not say how long a class runs, who attends, or what it costs, so ask the
    teacher. Performances are held in the center's 105-seat theater through the year.
  first_visit_tips:
  - Call or email during weekday office hours, 10 am to 5 pm, to confirm the class and its first date.
  - Take the Broad Street Line to the Spring Garden station, or the number 2 or number 43 bus.
  - 'Parking is in a garage on 15th Street between Brandywine and Spring Garden Streets, under a grocery
    store: $15 before 5 pm and $8 after 5 pm.'
  - Rehearsals are closed to the public, so check with the teacher before you come to watch.
