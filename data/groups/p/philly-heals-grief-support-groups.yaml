first_step:
  how: Use the sign-up survey linked from the city's grief support page to ask which peer group fits your
    loss, or call the program line at 215-516-9429.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Open to people grieving a Philadelphia resident's substance-related death, with a clear first
    step (a sign-up survey or a phone call), though the pages do not say what happens after the survey.
  what_to_expect: The city page does not give meeting times for each group or describe a typical session,
    so ask the program what the first meetings look like. Peer groups meet online, usually by video or
    phone. The program is free and needs no insurance.
  first_visit_tips:
  - Ask the program which group fits your loss, since the pages do not explain how the groups differ.
  - Find a quiet, private spot with a reliable connection for an online group.
  - The city page lists 988 (24 hours) for crisis help, and the NAMI Philadelphia Warmline at (844) 745-4673,
    weekdays 9 am to 5 pm, for support between groups.
