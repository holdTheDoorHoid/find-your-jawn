summary: The City of Philadelphia's bereavement program for people grieving a loss linked to substance
  use. It runs free online peer groups.
what_you_do: Pick the group that fits your loss. The city page names a drop-in group, a parents group,
  Hot Widows' Club, GRANDS, a Spanish-language group (Hay Otros en Duelo), and Writing Grief. The program
  also offers grief counseling for adults and youth, and workshops.
