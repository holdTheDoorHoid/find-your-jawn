summary: The City of Philadelphia's bereavement program for people grieving a loss linked to substance
  use. It runs free online peer groups.
what_you_do: 'Pick the peer group that fits your loss from the city''s list: a drop-in group, a parents
  group, Hot Widows'' Club, GRANDS, Hay Otros en Duelo (a group with a Spanish name), and Writing Grief,
  a time-limited group that uses creative writing. The program also offers grief counseling for adults
  and youth, and workshops.'
