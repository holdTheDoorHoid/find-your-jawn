summary: A yearly parade and street festival on the Ben Franklin Parkway that honors veterans. Veterans
  started it about 12 years ago, and bands, groups and organizations can apply to march in it or run a
  table at the festival.
what_you_do: Groups march in the parade or staff a festival table. Anyone can come watch the parade and
  visit the festival.
