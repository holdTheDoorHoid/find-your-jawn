first_step:
  how: Come watch the parade on the Ben Franklin Parkway at noon, or apply online by October 21, 2026
    to march or run a festival table.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Watching is open to anyone with no sign-up, and marching or running a table needs an application
    that the organizers approve.
  what_to_expect: Watching means finding a spot along the Ben Franklin Parkway for the noon start. The
    parade ends at Eakins Oval, where the festival ran from 12:30 to 3:30 pm in 2026. Approved groups
    get their own staging times, and marchers are asked to arrive between 10:30 and 11 am.
  first_visit_tips:
  - The parade is televised on Channel 6 if you would rather watch from home.
  - Approved groups should follow their own staging times, which differ by vehicle type.
  - Send questions about an application to the contact named on the approved participant page, since the
    site has no phone number.
