summary: A yearly parade and street festival on the Ben Franklin Parkway that honors veterans. Veterans
  started it about 12 years ago, and bands, groups and organizations can apply to march in it or run a
  table at the festival.
what_you_do: Groups and organizations apply through one online form to march in the parade, run a festival
  table, or both. The approved participant page also names individual veterans as possible registrants.
  Anyone can come watch the parade and visit the festival.
