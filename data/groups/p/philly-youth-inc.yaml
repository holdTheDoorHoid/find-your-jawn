summary: A Philadelphia youth development group. It runs a youth program with self-care, book club discussions
  and leadership, a monthly virtual book club, a feature that shares young people's stories, and trips
  abroad for teens.
what_you_do: Teens ages 12 to 17 can register for the youth program, which covers self-care, book club
  discussions, leadership, college and career readiness, and travel. Teens ages 13 to 17 can join the
  monthly virtual book club. Young people can apply to be featured in the Top Influencers stories, which
  the feature page says is for ages 25 and under. Volunteers can help with travel recruiting, the app,
  outreach, fundraising or marketing.
