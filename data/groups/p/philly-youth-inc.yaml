first_step:
  how: Sign up for the youth program through the Register Today form on the Events page, or for the virtual
    book club through the sign-up form on its page. Email info@phillyyouthinc.com with questions.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The youth program and the book club both have open online sign-up forms with no tryout or approval
    step listed. The site does not describe what a meeting is like or give meeting times.
  what_to_expect: After you sign up for the virtual book club, you get a welcome kit with the book of
    the month and login details. Meetings are online once a month, with a facilitator, discussion of the
    book and challenges tied to it. The site gives no meeting times and no fee for the book club.
  first_visit_tips:
  - Read the month's book before the online meeting, since the discussion is about the book.
  - Have a device with internet access for the online meetings.
  - Ask whether donating is required to join, since the book club page does not say.
