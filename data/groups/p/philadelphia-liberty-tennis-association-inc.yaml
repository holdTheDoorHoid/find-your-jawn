summary: A tennis group open to LGBTQ+ players and allies across the Philadelphia area and the wider Delaware
  Valley. It runs drills and events and is a USTA community tennis association.
what_you_do: Members play tennis with the group, practice in drills at Riverwinds Golf and Tennis Club
  in West Deptford, New Jersey, and take part in indoor winter and outdoor summer leagues and social events.
