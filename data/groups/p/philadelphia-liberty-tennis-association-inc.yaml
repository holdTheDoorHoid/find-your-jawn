first_step:
  how: Join through the JOIN US link on the website, then book a Riverwinds drill on the CourtReserve
    booking site that the drills page points to.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The group invites non-members to its social events and runs one drill group for all levels, but
    drills need a current membership and a booking first.
  what_to_expect: Drills bring together players of every level in one group, and each session costs $35.
    The page asks you to update your playing level on your member profile, and to email the board if you
    are unsure of your level.
  first_visit_tips:
  - Email board@philadelphialibertytennis.org if you are not sure which level to choose.
  - Keep your membership current, because lapsed memberships do not qualify for drills.
  - Pay in the app ahead of time or at the club on the day.
  - Cancel early, since a no-show or last-minute cancellation is charged.
