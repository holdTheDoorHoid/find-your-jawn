summary: A City of Philadelphia program that connects families affected by substance use, including families
  of babies born with withdrawal symptoms, to support groups, recovery help, doula referrals and overdose
  prevention training.
what_you_do: Families get referrals for food, baby supplies, clothing, housing and job help, plus support
  groups and recovery services. Community giveaways and celebrations are open to all families, not only
  people enrolled.
