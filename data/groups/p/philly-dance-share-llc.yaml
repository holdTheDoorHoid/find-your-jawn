cost:
  level: low
  text: Pay what you can. Each class offers a price from $0 to $20, and no one is turned away for lack
    of funds. Floorwork suggests $15 to $20. An optional $1 donation covers card fees. Payments are not
    refundable, but you can email before class to move a payment to another class.
