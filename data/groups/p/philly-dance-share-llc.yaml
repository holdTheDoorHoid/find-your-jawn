    for most classes.
first_step:
  how: Pick a class on the class schedule page, register online ahead of time, and choose the amount you
    can pay when you sign up.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The site says classes take everyone from absolute beginner up, a levels guide points beginners
    to the beginner class, and the site explains how to register online.
  what_to_expect: The classes are contemporary, experimental or floorwork based, and most run 90 minutes.
    The collective is artist led, and the schedule lists levels such as all levels, beginner intermediate
    or intermediate. The Pixelations workshop needs no movement experience.
  first_visit_tips:
  - Wear long sleeves and pants for floorwork classes, and consider knee pads, which the site recommends.
  - Classes meet at & Space, 1021 Hamilton Street, third floor (some listings say room 302), or at Mascher
    Space, 1170 South Broad Street.
  - Email phillydanceshare@gmail.com before class to move a payment to another class or to ask about access
    needs.
  - Masks are optional for most classes.
