first_step:
  how: If you play wind, brass or percussion, submit the online substitute musician application, which
    asks for your date of birth, a one-page resume and playing videos.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Regular seats are closed for the 2026 to 2027 season, and substitutes must send an online application
    with a resume and videos, so there is no walk-in way in. The public can still attend concerts.
  what_to_expect: Public concerts are the easiest way to hear the band first. The site does not say what
    a substitute's first rehearsal is like, but rehearsals are a few volunteer sessions in the two weeks
    before each concert.
  first_visit_tips:
  - Check the concerts page for each concert's venue and time, since they change from one concert to the
    next.
  - Have playing videos ready that show both a fast technical piece and a slow lyrical one, because the
    application asks for both.
  - Email the band to ask for the rehearsal schedule, since the site lists no rehearsal times or place.
