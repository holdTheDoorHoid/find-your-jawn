first_step:
  how: Visit during public hours or at a First Friday opening, or email info@practicegallery.org to book
    another time. To ask about joining the governing group, send the email described on the New Member
    Call page with a letter of intent.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Public hours and openings are open to anyone, and the site lists how to book a visit. Joining
    the governing group takes a written application.
  what_to_expect: During public hours you can look at the current show at your own pace. On First Fridays
    the gallery holds openings. The site does not say how long a visit takes or whether staff are on hand.
  first_visit_tips:
  - Check the site for the current show and its run dates before you go.
  - Go during public hours, or email ahead to book a time on other days.
  - The site does not describe stairs, an elevator or step-free access, so email ahead if access matters
    to you.
  - The New Member Call page lists an October 25 deadline with no year printed, so confirm the current
    round before you apply.
