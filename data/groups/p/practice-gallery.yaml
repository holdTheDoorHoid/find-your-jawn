summary: An artist-run contemporary art gallery at 319 North 11th Street. Members choose the shows together,
  and the space is open to visitors on First Fridays, on Saturdays and Sundays from 2 to 6 pm, and by
  appointment.
what_you_do: See the shows during public hours or at a First Friday opening. Artists who want to join
  the governing group can follow the New Member Call page and apply.
