    can join partway through a series.
  what_to_expect: Each session runs an hour and a half on Zoom on Wednesday evenings, starting at 6:30
    pm Eastern. The group is for parents who have lost a child to a drug-related loss, and the sessions
    are a place to talk about that loss with other parents. Nothing is charged to take part.
