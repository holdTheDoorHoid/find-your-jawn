  basis: The site gives hours and an email, but no waitlist, plot, work day or membership details, so
    the way in is unclear.
  what_to_expect: The garden is an organic community garden and permaculture fruit orchard, supported
    by the Germantown Mennonite Historic Trust. The site describes shared growing and sharing seeds and
    recipes, and it lists a music series with no details. It does not say how a first visit works or whether
    visitors can walk in.
  first_visit_tips:
  - Ask by email before you come, since the site does not say whether visitors can walk in.
  - 'Check the hours first: 8 am to 6 pm in winter and 8 am to 8 pm in summer.'
