summary: Free, volunteer-led coding clubs for young people ages 7 to 17. Sessions meet on Zoom on Saturday
  mornings, and kids choose what to build while learning from each other and from mentors.
what_you_do: Kids register once, then join Saturday Zoom sessions to build projects with volunteer mentors.
  Adults sign up through the volunteer form and then complete an onboarding step.
