first_step:
  how: Fill in the one-time Dojo Registration form for the young person, linked from phillycoderdojo.com.
    After that, Zoom links for upcoming sessions arrive by email.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The site says beginners often start with Scratch or with a simple website, and one registration
    covers all upcoming sessions.
  what_to_expect: Sessions run for about an hour on Zoom, from 11 am to noon on Saturdays. Each dojo picks
    its own topic, kids work through projects with volunteer mentors and each other, and parents may observe
    or help, especially with younger kids. Sessions are free.
  first_visit_tips:
  - Have a charged laptop ready before the session
  - Create a Unity account and verify its email before anything else
  - Install Unity Hub and Unity 2022.3.51f1, plus Visual Studio Community 2022 (or Visual Studio Code
    on a Mac)
  - Read the Ninja Registration attendee agreement before joining
