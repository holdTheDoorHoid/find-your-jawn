summary: A group that puts on Pride celebrations for LGBTQ people of color in Philadelphia. Its main festival
  is held during the Penn Relays Carnival at the University of Pennsylvania, and it also runs year-round
  programs and a fund that takes donations.
what_you_do: Attend the PRIDE 2026 celebration (workshops, seminars, awards and nightlife events), book
  through the official host hotel link, or sign up for monthly updates.
