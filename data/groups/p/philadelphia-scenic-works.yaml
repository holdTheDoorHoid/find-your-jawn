summary: A nonprofit scene shop that builds sets and scenery for arts groups and trains people who want
  backstage careers. It runs a free High School Tech Theatre Club and free one-day skills workshops for
  the public.
what_you_do: Join the free High School Tech Theatre Club on Wednesdays, take a free one-day skills workshop,
  or join the mailing list to hear about apprenticeships and openings.
