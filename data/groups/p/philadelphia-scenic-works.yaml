  basis: The club page says no experience is required and gives a sign-up form, and the club is free.
  what_to_expect: The club meets on Wednesdays for about an hour and a quarter during each school term,
    at InterAct Theatre at The Drake. You learn tech theatre skills such as scenery, props, stage management,
    lighting, sound, and costumes. The club is free, and the page says no experience is needed.
  first_visit_tips:
  - Sign up through the form before the term starts, since the page does not list session dates.
  - The club meets at 302 S. Hicks Street, not at the Yeadon shop.
  - Send questions to the general email address on the contact page.
