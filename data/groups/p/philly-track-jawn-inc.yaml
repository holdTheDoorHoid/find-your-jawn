first_step:
  how: Fill in the free Sign Up form on the group's site, then come to the Tuesday 7 pm track workout
    at the Temple University Sports Complex.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Open to anyone through a free sign up form, and sessions are set up for different fitness levels,
    but the site does not say beginners are specifically welcome.
  what_to_expect: The Tuesday workout is free and starts at 7 pm at the Temple University Sports Complex.
    Certified coaches lead it and adjust the work for different fitness levels, so you can go at your
    own pace. The club's Strava page describes pace groups, so you can join a group near your own speed.
  first_visit_tips:
  - Fill in the sign up form first, since the group asks people to do so for planning.
  - Weekend run and walk times are not listed on the site, so ask the group before you plan a weekend
    visit.
