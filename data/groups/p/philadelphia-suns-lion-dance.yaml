first_step:
  how: Come to a Sunday practice at 227 N 10th St, from 1 to 2:30 pm. Email liondance@phillysuns.org first
    if you want to ask questions.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The page says anyone who wants to learn is welcome, at all ages and skill levels, and it gives
    a practice time and an email address.
  what_to_expect: Practice runs about 90 minutes on Sundays, from the weekend after Labor Day until Lunar
    New Year. Sessions cover drumming and the instruments, basic lion moves such as stalking and walking,
    and routines for performances. The page does not state a fee, what to wear, or how often you need
    to come.
  first_visit_tips:
  - The practice is at 227 N 10th St in Chinatown; the page gives no parking or transit details.
  - The page gives no dress rules, so ask by email what to wear before your first practice.
  - The season begins the weekend after Labor Day, so practices run only a few months before Lunar New
    Year.
