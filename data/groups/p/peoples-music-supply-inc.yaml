summary: A Philadelphia nonprofit for collectively improvised music. It runs open improvisation labs on
  Tuesday evenings and a concert series on Wednesdays, and its events page also lists shows by members
  that the group does not run.
what_you_do: Musicians can take part in the open improvisation labs on Tuesday evenings. Listeners can
  come to the Wednesday concerts. Some events link to a registration page, but the events page does not
  say whether signing up is needed.
