summary: A youth development group with free sports, learning, character-building and cultural programs
  for kids ages 6 to 18. Its 15 community sites each have an on-duty police officer, and 3 school sites
  run during the school year.
what_you_do: Kids take part in free sports, learning and character programs at a site near them. Adults
  18 and older can volunteer for at least 2 hours per event, and the Programs Department reviews each
  volunteer request first.
