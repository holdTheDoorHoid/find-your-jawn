first_step:
  how: Call PAL headquarters at (215) 291-9000 and ask which of the 15 centers is closest to you and how
    to enroll your child. Volunteers 18 and older can ask the Programs Department about a volunteer request.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: Programs are free and open to kids 6 to 18, and all 15 center addresses are listed, but the site
    does not describe how to enroll or whether you can walk in, so a phone call is the first step.
  what_to_expect: Most visits happen at one of the 15 community centers, each supervised by an officer,
    where kids join programs such as homework club, computer lab, basketball and flag football. The site
    does not give hours, days or group sizes, so ask the center when your child can start. Programs are
    free to attend.
  first_visit_tips:
  - Ask the phone line which programs your child's nearest center offers, since each center runs a different
    mix.
  - Ask about hours and sign-up forms before you go, since the site does not list them.
  - Check the center's street address on the programs list before you travel.
  - Ask the front desk how to reach the officer in charge of your center.
