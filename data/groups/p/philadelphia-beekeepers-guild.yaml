first_step:
  how: Come to the third Thursday guild meeting at St. James School, or join the free virtual Bee Chat
    on a first Tuesday.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Meetings and Bee Chats are listed as free and public, with a clear membership page, but the site
    does not say beginners are welcome.
  what_to_expect: Monthly meetings run from 7 to 9 pm on the third Thursday at St. James School, and many
    are listed as hybrid so you can join online. Some meetings have a named speaker, and the Bee Chat
    is a free virtual evening on some first Tuesdays. The classes page listed no events when checked on
    2026-10-08, so a beginner class is not scheduled right now.
  first_visit_tips:
  - Use the RSVP link on the event listing, since each meeting has one.
  - Check the listing for whether you can join online, because meetings are listed as hybrid.
  - Arrive for the 7 pm start, since listings run until 9 pm.
