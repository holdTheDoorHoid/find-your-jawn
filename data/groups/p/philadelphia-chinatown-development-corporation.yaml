first_step:
  how: Join the PCDC newsletter and say you want to volunteer, or email info@chinatown-pcdc.org.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The Get Involved page says volunteer requests go out to the newsletter list and gives an email
    and a phone line. Senior sports are open to anyone 65 and older for a small fee.
  what_to_expect: Volunteer jobs are tied to PCDC events and are mostly one time. Senior morning sports
    run three mornings a week at Crane Community Center for $3 a session.
  first_visit_tips:
  - Call 215-922-6156 before you come, since the pages checked do not list office hours.
  - Check the events page for dates, because at least one summer event moved to a new day.
  - The PCDC office is at 301-305 North 9th Street. The Crane Community Center street address is not on
    the pages checked.
