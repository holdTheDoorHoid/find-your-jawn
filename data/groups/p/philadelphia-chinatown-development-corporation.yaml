summary: The community development group for Chinatown. It builds affordable housing, offers housing counseling
  and help getting benefits, runs the Crane Community Center, and hosts events such as the Night Market.
  The City also names it a Neighborhood Advisory Committee, which links residents to City programs.
what_you_do: Volunteer at neighborhood events, join or use the programs at Crane Community Center, or
  ask the Neighborhood Advisory Committee about City help with housing, energy bills, jobs and youth programs.
