summary: Philadelphia's public access media nonprofit, where residents learn video production and submit
  their own programs for the public access channel.
what_you_do: Attend the required orientation, then take a workshop such as field production, production
  planning, or Premiere Pro editing. Equipment checkout also requires the orientation.
