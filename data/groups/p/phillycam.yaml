first_step:
  how: Join as a member at phillycam.org/join, then register for the next TV Orientation (6 to 8 pm, in
    person at 699 Ranstead Street or on Zoom).
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Membership dues come first ($30 a year for individuals) and TV orientation is required before
    most workshops, so you pay and attend an evening session before you can take a class, although the
    path is clearly listed.
  what_to_expect: TV orientation is a two hour evening session, in person at the Ranstead Street office
    or on Zoom. It is required before you register for most workshops or submit a show. After that, you
    can take a course such as Basic Field Production or Premiere Pro, which cost between $50 and $100.
  first_visit_tips:
  - Choose TV orientation for classes and TV shows, and Radio orientation only if you want a radio show
    on WPPM.
  - Watch your email for the Zoom link, since PhillyCAM sends it before a virtual session.
  - Bring your own SD card and spare batteries if you plan to shoot on location.
