first_step:
  how: Pick a Saturday hike on the events calendar, then message the group on Instagram before you go
    to ask how to join. Some hikes share details through an RSVP link or a group chat.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The About page says beginners and all fitness levels are welcome, and the Join Us page has a
    Sign up now button, but the page does not spell out the sign-up steps.
  what_to_expect: Most listed hikes are Saturday morning outings, usually starting between 8 and 9:30
    am, on a trail in the city or the nearby suburbs. Some are easy loops of a few miles and others are
    longer out and back walks, so check the event listing for the pace. The site does not list a fee for
    hikes or dues for members. The group also runs fitness challenges and social outings.
  first_visit_tips:
  - Check the event listing for the meeting place, start time and pace before you go.
  - Some events share details by RSVP link or in a group chat, so ask for the chat when you sign up.
  - Wear shoes that can handle trail mud and bring water.
  - Arrive a few minutes early so you can find the group before the start time.
