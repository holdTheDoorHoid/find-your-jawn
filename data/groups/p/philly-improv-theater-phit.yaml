  basis: The site offers beginner clinics and a 90 minute beginner workshop, and says no improv experience
    is needed to join the Community Night open jam.
  what_to_expect: 'Community Night is a low pressure evening: a short set of performances by students,
    alumni and local improvisers, then a host runs the open jam. You can watch, join the jam or just hang
    out. Classes are short courses that need registration first, and the site does not list class prices.'
  first_visit_tips:
  - Check the ticket or reservation page before you go, since the site lists an advance reservation link
    as coming soon.
  - The October 2026 Community Night was 21 and older with valid ID, so check the age rule for each night.
  - For the October event, check-in and seating started at 6:15 pm.
