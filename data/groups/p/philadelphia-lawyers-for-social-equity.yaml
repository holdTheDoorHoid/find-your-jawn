first_step:
  how: Email info@plsephilly.org to book help or ask about the next intake clinic, since the office does
    not take walk-ins.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Help is free for people who qualify and volunteer trainings are open to the public, but you must
    book ahead, and the phone line is down during the office move.
  what_to_expect: You contact the office before you come, since walk-ins are not taken. Intake happens
    at clinics announced on the Events page, and the clinic schedule and sign-up sit in an outside portal
    the page links to. The site says a volunteer training takes about 45 minutes.
  first_visit_tips:
  - Email first, because the phones are out of service during the office move.
  - Check the Events page for the next intake clinic and follow its registration link.
  - Confirm the new office address before you go, since the group is moving.
