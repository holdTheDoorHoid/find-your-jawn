summary: A nonprofit that gives free legal help to low-income Philadelphians clear old criminal records
  so they can get jobs and housing. It also trains volunteers and works with community partners on pardon
  help.
what_you_do: Attend a short volunteer training (the site says about 45 minutes), get help with an expungement
  or pardon if you qualify, or invite the group to speak to your organization.
