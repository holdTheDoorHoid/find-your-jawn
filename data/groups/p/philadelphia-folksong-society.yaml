summary: A nonprofit that runs the Philadelphia Folk Festival each August, a Folk School in Roxborough,
  and concert series. The festival includes song circles, jam sessions, and open mic time.
what_you_do: Buy a day pass or camping ticket for the festival, go to a concert, or volunteer for a festival
  committee. A volunteer ticket also counts as your registration.
