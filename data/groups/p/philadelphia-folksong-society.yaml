first_step:
  how: Buy a day pass or concert ticket on the festival's tickets page, or sign up to volunteer through
    the volunteers page.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The festival and concerts are open to anyone with a ticket, and volunteer committees name jobs
    for first-timers. The pages checked describe no beginner program.
  what_to_expect: The festival is an outdoor, multi-day event with music on seven stages from 11 am into
    the evening, plus camping, crafts, food, and family activities. You can attend for a single day. Camping
    has its own arrival days and a wristband to enter, and a golf-cart shuttle runs on the grounds.
  first_visit_tips:
  - Read the parking and camping pages before you go, since the site is temporary and the ground is rough.
  - Pets are not allowed, except licensed or registered service dogs.
  - The FAQ says amplified instruments and drumming are not allowed.
  - Camping ticket holders get staggered entry days, so check your ticket before you travel.
