first_step:
  how: Buy a ticket for a story night through the ticket link on the events page. To tell a story, use
    the teller application or open call when one is listed.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Public shows are open to anyone with a ticket link, and teller calls are listed separately, but
    the page does not say how beginners are helped to tell a story.
  what_to_expect: 'A story night is a live show: a host introduces several tellers, and each one tells
    a story aloud while the audience listens. Showcases usually run about an hour to two hours, and some
    shows add an open mic. Most shows are free or pay what you can, and some suggest $15.'
  first_visit_tips:
  - Buy your ticket ahead through the link on the events page, since many shows need one.
  - Many shows are pay what you can, so bring what fits your budget.
  - Start times vary from early afternoon to 7 pm, so check the event page for yours.
