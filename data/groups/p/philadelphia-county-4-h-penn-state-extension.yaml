summary: Penn State Extension's county 4-H program for young people ages 5 to 18. Its project clubs cover
  areas such as animal science, civic leadership, the arts, environmental science, health, and STEM.
what_you_do: Pick a project club that fits your interests, enroll through the county educator, and take
  part in that club's projects and events with other youth. Ages 5 to 7 join as Cloverbuds, which does
  non-competitive activities.
