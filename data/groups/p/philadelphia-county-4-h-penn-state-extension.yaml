first_step:
  how: Choose a project club from the county's club list, then contact the county 4-H educator at PhiladelphiaExt@psu.edu
    or 215-471-2200 to enroll. Enrollment is done online through the state 4-H enrollment system, or with
    the educator's help.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Open to all youth ages 5 to 18, with a clear enrollment path through the county educator. Enrollment
    and material fees come before the first meeting, and the pages do not describe a first meeting.
  what_to_expect: 'The pages do not describe a first meeting. The first step is a conversation with the
    county educator, who helps you choose a club and complete enrollment. Clubs are project based: Cloverbud
    activities for ages 5 to 7 are non-competitive, and members ages 8 to 18 can take part in competitive
    events.'
  first_visit_tips:
  - Call the county office before you go, since it is staffed remotely and closes from 1 to 2 pm.
  - Ask the educator about a club's meeting times and fees before you enroll.
  - If the fee is a barrier, ask about the financial help the program offers.
  - If your project is not offered, a new club needs at least five youth from two families and an adult
    leader, so ask the educator.
