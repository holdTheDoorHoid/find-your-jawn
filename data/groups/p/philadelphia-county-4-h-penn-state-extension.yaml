summary: The Philadelphia County branch of Pennsylvania 4-H, run by Penn State Extension. Young people
  join project clubs in areas such as STEM, animal science, civic engagement and healthy living.
what_you_do: Members choose a project club, meet with it on a regular schedule, and pay a fee for educational
  materials. Adults help run clubs as screened volunteers, and a new club needs at least two screened
  adult volunteers.
