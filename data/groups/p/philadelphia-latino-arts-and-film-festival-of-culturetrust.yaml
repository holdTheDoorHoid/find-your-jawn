first_step:
  how: Buy a ticket for the next Tuesday People's Cinema Club screening on Eventbrite, which the site
    links to.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Screenings are public and listed every week with online tickets, and the site has a volunteer
    and intern page, but it does not say whether first timers need anything more.
  what_to_expect: A screening is a film on a Tuesday evening at 6:30 pm in Center City, hosted at the
    Village of Industry and Art with partner groups. Tickets are sold online, and the site does not list
    prices. It does not say how long a screening runs or whether there is a talk afterward.
  first_visit_tips:
  - Tickets are sold on Eventbrite, so look there for the week's screening.
  - Plan to arrive for the 6:30 pm start.
  - The volunteer and intern page is at phlaff.org/volunteer-intern. Its listing names the 2026 edition,
    so ask whether 2027 openings exist before you apply.
