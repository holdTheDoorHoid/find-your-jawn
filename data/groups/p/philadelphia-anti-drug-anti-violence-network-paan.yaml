summary: A Philadelphia nonprofit that works to reduce drug use and violence among young people and their
  families through prevention services, crisis intervention, counseling and job readiness. It has held
  open events such as a men's breakfast and takes sign-ups for its mailing list.
what_you_do: Join the mailing list, call the office, or send a question through the site's contact form.
  The site lists Intensive Prevention Services and Crisis Intervention as its programs.
