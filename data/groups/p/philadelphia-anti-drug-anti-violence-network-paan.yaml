first_step:
  how: Call 215-940-0550 or send a question through the contact form on paan1989.org to ask how to join
    the mailing list or attend the next open event.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The mailing list is open to anyone, and the site lists a phone line and a contact form. The site
    does not describe intake for its programs or say how events are announced.
  what_to_expect: A first step is a phone call, a contact form message, or a mailing list sign-up. The
    site does not say what intake for its prevention or crisis programs looks like, how long it takes,
    or who qualifies. It describes a men's breakfast that about 30 men attended, but gives no date, time
    or cost for it.
  first_visit_tips:
  - Call before you go, since the site does not list office hours.
  - Ask whether an event is for men only or open to everyone, since the site does not say.
  - Confirm the office address first, because a directory listing gives a slightly different street address
    for the same suite.
