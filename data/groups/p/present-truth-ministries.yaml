  basis: The site says its doors are always open and gives clear service times and a phone line, but it
    does not describe a newcomer welcome or program.
  what_to_expect: A Sunday visit starts with worship at 10 am. Children stay for the first part with their
    parents, then go to a Bible class during the message, and youth have their own class at the same time.
    Thursday Midweek Manna is a prayer and Bible study at 7 pm. The site does not say how long the service
    runs or what to wear.
  first_visit_tips:
  - Children join the first part of Sunday worship, then leave for their class during the message.
  - The site lists no office hours, so call 215-873-1230 or use the Contact Us form to ask about visiting
    first.
  - A Get directions link is on the site, but no parking or transit notes are given.
