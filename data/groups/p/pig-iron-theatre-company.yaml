first_step:
  how: Go to a student showing on the school events page to see the work first, or pick a beginner workshop
    such as Intro to Clown from the school page and use its apply link.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Workshops are open to the public with a learn more and apply link, and the company lists beginner
    classes, but the pages read do not give prices, age rules or the steps after applying.
  what_to_expect: Workshops are short, multi-day sessions taught by company faculty, such as Emmanuelle
    Delpech for Intro to Clown and Neutral Mask. Classes use movement, improvised scenes and physical
    games, so expect to move and play with others. The pages read did not give tuition, daily hours or
    class size, so ask the school before you sign up.
  first_visit_tips:
  - Read the workshop description on the school page to check that it is for beginners.
  - Ask about tuition and daily hours before you apply, since the pages do not list them.
  - Wear clothes you can move in, since the classes are physical.
  - Call the company at 215-425-1100 if the apply page leaves questions open.
