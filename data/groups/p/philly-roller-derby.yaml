  newcomer_friendliness: 4
  basis: The site has a bootcamp for adults with no skating skills, says how to register, and lists volunteer
    and officiating roles that take people with no experience.
  what_to_expect: The adult bootcamp meets for eight weekly sessions and starts on a Sunday afternoon.
    You practice stopping, learning to fall safely, weaving, crossovers, and backward skating, and the
    last session is a review with a fun dance. Expect a gear check in week one and a $60 fee paid up front.
  first_visit_tips:
  - Plan to sign the league and rink waivers.
  - Spots are limited, so register early.
  - Allow travel time, since the bootcamp is in Springfield, PA, outside the city.
