first_step:
  how: Email Projectalwaysreceiving@gmail.com, or send an inquiry through the general volunteer form on
    the Volunteers page, to ask about the next event.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Events are public, and the Volunteers page welcomes volunteers of any background and offers a
    form and an email. No upcoming events were listed when checked and the last one was in August 2025,
    so the way in is currently a form or email.
  what_to_expect: Past events ran as afternoon community gatherings, from noon to 3 pm or from noon to
    7 pm, with giveaways, a health and wellness fair and an open mic night. Open mic performers signed
    up through a form. The page does not say whether events cost money or need registration.
  first_visit_tips:
  - Check the events page before you go; no upcoming events were listed when we checked.
  - Open mic performers sign up through a linked form, so plan ahead if you want to perform.
  - Past venues have street addresses on the site, but no transit or parking details are given.
