summary: A business council that links Mid-Atlantic companies with partners in Eurasia, mostly through
  trade events, seminars and delegations. It also holds public cultural and remembrance events, including
  programs about people who rescued Jews during the Holocaust.
what_you_do: Attend a Carl Lutz event (the site invites the public to some of them), register for a seminar
  or trade event, or apply for a company membership by mail. The site also lists internships.
