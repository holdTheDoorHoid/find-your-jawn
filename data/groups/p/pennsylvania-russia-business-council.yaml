first_step:
  how: Register for a public Carl Lutz event on the site, or call 484-467-7444 or email info@ma-rbc.org
    to ask about attending a seminar.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Public events have registration links and the council lists a phone and email, but membership
    is an application aimed at companies.
  what_to_expect: Public events are mostly talks, seminars and commemorations rather than hands-on activities.
    The October 2026 Carl Lutz program lists remarks by a speaker and a film screening, and many listings
    leave out the time or fee. Read the linked flyer before you go.
  first_visit_tips:
  - Register from the event listing when one is given, since some events use a Zoom sign-up link.
  - Look in the linked flyers for the start time and fee, because the event pages often leave them out.
  - Ask the council before you apply for membership, since the form is for companies and is mailed with
    a check.
