  newcomer_friendliness: 3
  basis: Events are open to the public, several have registration links, and the office has a newsletter
    sign up. The site names no volunteer sign up.
  what_to_expect: Welcoming Week events are public sessions across the city, such as exhibits, civic resource
    workshops, arts festivals and a wellness workshop. They are aimed at immigrants and the wider community,
    and the office's pages do not give event prices. Check each listing for the time, place and whether
    you need to register.
  first_visit_tips:
  - Pick an event from the Welcoming Week list and check whether it asks you to register.
  - Sign up for the newsletter to hear about new events as they are posted.
  - Call (215) 686-0876 or email OIA@phila.gov if you have questions about city services.
