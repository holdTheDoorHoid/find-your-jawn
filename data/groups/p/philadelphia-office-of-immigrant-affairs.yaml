summary: The City of Philadelphia office that creates programs for immigrant residents and helps them
  connect to city services and civic life. Each September it runs Welcoming Week, a set of public events.
what_you_do: Attend a Welcoming Week event in September, come to the yearly Welcoming Awards, or sign
  up for the office newsletter.
