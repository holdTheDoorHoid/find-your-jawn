first_step:
  how: Subscribe to the free newsletter on the site, or email contact@pa-pha.org to ask whether an event
    is open to non-members.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Anyone can subscribe to the free newsletter, so you can see the work before paying dues. The
    site does not say whether non-members can attend events.
  what_to_expect: A first step is reading the free newsletter, which covers events, announcements and
    analysis, and the membership pages describe training, policy and funding topics. Membership is a yearly
    subscription with automatic renewal, and members get conference discounts and a chance to join work
    groups. The site does not say how events run or whether non-members can attend, so ask before you
    register.
  first_visit_tips:
  - Subscribe to the newsletter first to see what is coming up.
  - Membership is handled on a separate sign-up site linked from the Membership page, so check the fee
    for your situation before you sign up.
  - Ask contact@pa-pha.org whether an event you want is open to non-members before you pay.
