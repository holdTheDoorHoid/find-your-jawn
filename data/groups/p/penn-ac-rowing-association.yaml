first_step:
  how: Register for a Learn to Row level on RegattaCentral (a free account is needed) before the level
    starts. Walk-ins are not accepted, and questions go to ltr@pennac.org.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The Learn to Row page is written for adults with no rowing experience and explains how to register
    online, though it does not take walk-ins.
  what_to_expect: Learn to Row is for adults aged 21 and older with no rowing experience. Each level meets
    for 90 minutes twice a week, one weeknight and one Saturday, over several weeks, and you finish level
    1 before level 2. If a class does not fill it may be moved, and a canceled class is refunded in full.
  first_visit_tips:
  - 'Register early: applications close the day before each level starts, and walk-ins are not accepted.'
  - The page does not list what to wear or bring, so email ltr@pennac.org before your first class.
  - Start with level 1, since the levels must be taken in order.
