first_step:
  how: Go to Lloyd Hall on Boathouse Row on a Saturday morning, or join the group's mailing list through
    the join form on its website first.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The group's site welcomes all running abilities and walkers, the calendar listing says open to
    all paces, and the site has a join form to start.
  what_to_expect: The listed session runs one hour, from 9:40 to 10:40 am, and you choose a 1, 3 or 5
    mile route or walk it at your own speed. Members of all paces take part, and the listing says it is
    free. The group usually goes to brunch at Little Pete's afterward.
  first_visit_tips:
  - Look at the 1, 3 or 5 mile routes on the group's Strava club page before you come.
  - Plan to arrive for the 9:40 am start at Lloyd Hall.
  - Stay for brunch afterward if you want to talk with members; the group usually goes to Little Pete's.
