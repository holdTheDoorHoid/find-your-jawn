first_step:
  how: Come to a Monday pickup at Chew Playground (6:30 to 8:30 pm) as a guest, sign the non-member waiver,
    then register for a membership on the club's LeagueApps site to keep playing.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The pickup page says all skill levels are welcome, non-members can try one session, and it explains
    how to register after that.
  what_to_expect: Pickup is an outdoor game on a grass field, and all skill levels are welcome. Bring
    a light shirt and a dark shirt plus water, and wear cleats outdoors. The page does not say how many
    players attend or how teams are formed.
  first_visit_tips:
  - Bring a light shirt and a dark shirt, plus water.
  - Wear cleats for the outdoor game, and indoor shoes if you come to futsal.
  - Non-members sign a waiver, which is linked from the Play menu on the club's site.
  - Email sportingactivities@phillyfalcons.org with questions before you come.
