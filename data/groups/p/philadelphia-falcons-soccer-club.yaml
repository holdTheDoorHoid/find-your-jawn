summary: A soccer club in Philadelphia whose members are mostly LGBTQIA+ players. It runs weekly indoor
  and outdoor pickup games, leagues and tournaments, and welcomes anyone who wants to play.
what_you_do: Play a weekly pickup game, which non-members can try once, then join the club to keep playing.
  The club also runs leagues and tournaments.
