first_step:
  how: Fill out the online 2027 tryout form on the Tryouts page, or the camp and clinic form for a session.
    Choose Boys or Girls and the grade, then pay the fee.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Camps and clinics take online registration with listed prices, so a newcomer can join without
    a tryout. Team places come through 2027 tryouts, and the site does not explain what tryouts involve.
  what_to_expect: The site does not describe a session day, the coaches or start times. The registration
    forms ask for the player's grade and school, and a parent's name, phone and email. Tryouts cost $10
    or $20, and camps and clinics cost $70 to $175.
  first_visit_tips:
  - Register online before the session, with a parent's phone and email ready, since the forms ask for
    them.
  - Ask which gym hosts your session, since the site does not say which gym hosts which session.
  - Pay by Venmo to @PhillyRevHoops with the player's name and session in the memo, or bring cash or a
    check to the door.
