cost:
  level: paid
  text: Tryouts cost $10 for grade school teams and $20 for high school teams, paid at tryout. One-day
    clinics are $70, two-day clinics are $100, and a weekly camp is $175. Camp and clinic fees can be
    paid by Venmo, or in cash or by check at the door.
