summary: An AAU basketball club with tryouts for boys and girls in grades 4 to 11, plus camps and clinics
  for younger players in grades 1 to 8.
what_you_do: Players register through the online forms on the site, pick Boys or Girls and a grade, and
  pay the fee. The club runs weekly camps and one-day and two-day clinics at gyms it lists, one in Philadelphia
  and two outside the city.
