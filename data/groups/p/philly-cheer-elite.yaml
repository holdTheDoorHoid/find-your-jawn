first_step:
  how: Fill out the interest form linked from the join page to be added to the recruitment list for upcoming
    recruitment events.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: The only published way in is an interest form that adds you to a list, and the pages do not describe
    tryouts or what happens after the form, so the way in is unclear.
  what_to_expect: The team describes its members as LGBTQIA+ and ally adults, and calls itself all-volunteer.
    Practices run Monday evenings from 7:30 to 10:30 pm, and the team says it will tell people about recruitment
    events. The pages do not describe tryouts, skill requirements, dues, or time commitment, so ask before
    you commit.
  first_visit_tips:
  - Fill out the interest form first, since it is the only route the site publishes.
  - Email info@phillycheerelite.org to ask whether a tryout or skills check comes before the first practice.
  - Ask for the exact practice address, because the site gives only a mailing address.
  - Plan for three hours on Monday evenings, since practice runs 7:30 to 10:30 pm.
