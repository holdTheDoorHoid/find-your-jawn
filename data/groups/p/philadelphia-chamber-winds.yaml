first_step:
  how: Apply as a substitute through the auditions page, which asks for a one-page resume and videos of
    your playing, or email Music Director Joe Higgins at higgins@philadelphiawindsymphony.org with questions.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Seats are filled by audition and the 2026 to 2027 auditions are closed, so the way in is clear
    but needs a resume and playing videos before you learn what it is like.
  what_to_expect: Members are volunteers who play about six concerts a season at venues around the Philadelphia
    area. Substitutes are called as needed and rehearse three or four times in the two weeks before a
    concert. The site does not say how many rehearsals a substitute must attend or whether substitutes
    are paid.
  first_visit_tips:
  - Check the auditions page in June or July, when the group usually posts the next audition dates.
  - Have your resume and playing videos ready, since the substitute application asks for both.
  - Ask the music director how many rehearsals a substitute is expected to attend before you accept a
    concert.
