summary: A volunteer wind band of about 50 players that gives around six concerts a season. Players join
  by audition, or sign up as substitutes.
what_you_do: Play in the season concerts, which run from fall into early summer. Substitutes can apply
  on any wind, brass or percussion part, whether or not that part is open, and they are called in as needed.
