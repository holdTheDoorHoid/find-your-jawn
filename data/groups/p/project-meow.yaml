first_step:
  how: Open the Volunteer page at projectmeow.org and fill out the volunteer application. To foster, use
    the Foster Form on the fostering page, and a volunteer will get in touch.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The volunteer application and Foster Form are public and need no dues, and the fostering page
    says no cat experience is required. The site lists no orientation dates or training steps.
  what_to_expect: The site does not describe orientation or a first shift. Roles run from a few hours
    a week of admin help to a weekly colony feeding near Clark Park that takes about an hour and needs
    a vehicle. Fostering needs no cat experience, and the site says easy cats are available for beginners.
  first_visit_tips:
  - The cat-care shifts at the group's space require being able to lift 20 pounds.
  - Fosters take kittens to vet visits, and kitten vaccines can mean several trips over two to three months.
  - Send questions about fostering to fosters@projectmeow.org and general questions to rfa@projectmeow.org.
