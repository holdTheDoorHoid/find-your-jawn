summary: An all-volunteer cat rescue in West Philadelphia. It traps, neuters and returns community cats,
  cares for kittens and sick cats, and fosters and adopts out friendly cats.
what_you_do: Volunteer, foster a cat or kitten, help a community cat caretaker, or adopt from the adoptable
  cats listed on the site.
