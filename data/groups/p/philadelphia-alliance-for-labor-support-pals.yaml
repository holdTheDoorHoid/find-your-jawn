first_step:
  how: Join the training waitlist through the form on the Become a Doula page. If you already hold a doula
    training certificate, use the Volunteer with PALS sign-up form instead.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Volunteers need a doula training certificate before they sign up, and training is limited with
    a long waitlist, so a newcomer cannot try the work first.
  what_to_expect: Volunteer doulas are on call from two weeks before to two weeks after a client's due
    date, take prenatal clients, and pick up hospital on-call shifts of 6, 8 or 12 hours from a shared
    calendar. Each client has a consent form, and each birth needs a birth record form afterward.
  first_visit_tips:
  - Have a photo of your doula training certificate ready, since the volunteer form asks for one.
  - A mentorship sign-up form exists for mentors and mentees, and the site calls it optional.
  - The site strongly encourages a hospital orientation, but does not say it is required.
