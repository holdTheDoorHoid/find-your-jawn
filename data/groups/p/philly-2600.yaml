first_step:
  how: Come to the first Friday meeting at Iffy Books, 404 S 20th St, around 6 pm. The site lists no sign-up
    step.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The site says to come as you are, that you can join in or just listen, and that a pseudonym is
    fine. There is no sign-up step, but the page does not use the word beginner.
  what_to_expect: Arrive any time around 6 pm and leave when you like. Talk breaks into several small
    groups at once, on topics such as hacking, sysadmin work and security, and you can join in or just
    listen. You do not need a topic or a real name, and guests are welcome. The after-meeting venue may
    be 21 and over, and under-21 attendees can ask the group to find a suitable place.
  first_visit_tips:
  - Check the group's Mastodon link for location changes before you go, since the site's blog shows no
    dated posts after 2016.
  - Use a nickname if you like, since the group does not ask for real names.
  - Under-21 attendees can tell the group ahead of time so it can find a suitable after-meeting place.
  - Guests are welcome, so you can bring a friend.
