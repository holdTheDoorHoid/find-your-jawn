first_step:
  how: Subscribe to the newsletter, or read the free reporting guides. Survivors who want to learn about
    the Survivor Connection can leave a message through the site's Get connected page.
  drop_in: false
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The guides and newsletter are open to everyone, but the site describes no volunteer, membership
    or meeting path, and it does not say how to book the survivor workshop.
  what_to_expect: The group does not run regular meetings or drop-in sessions. The site's ways in are
    reading its guides, subscribing to the newsletter and going to announced events. Survivors who join
    the directory first complete an introductory workshop on trauma, media literacy and public health.
  first_visit_tips:
  - Subscribe to the newsletter to hear about events, since they are announced there and on the site.
  - Journalists can register on the site to search the survivor directory and map.
  - If you are a reporter, start with the reporting toolkit, the site's most visited resource.
