summary: Researchers, journalists and gun violence survivors working to make news coverage of gun violence
  more accurate and fair. The group publishes studies and reporting guides, keeps a directory of survivors
  who will speak to the press, and hosts events.
what_you_do: Read the free reporting guides and research, sign up for the newsletter, and attend events
  the group hosts. Journalists can use the survivor directory, and survivors can ask to learn more about
  joining it, which includes an introductory workshop.
