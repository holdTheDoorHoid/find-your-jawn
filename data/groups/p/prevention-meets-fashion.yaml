summary: Uses fashion, advocacy and public education to share sexual and menstrual health information
  with Black, LGBTQIA and non-binary communities.
what_you_do: Come to a yearly public event such as the February condom fashion show, the April 30 Denim
  Day, or the free December wreath-making and toy drive. Volunteers aged 14 and up help run programs and
  events, and the group also runs free support groups for adults 18 and older.
