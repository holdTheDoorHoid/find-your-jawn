  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The yearly events are open to the community, and volunteering takes a short form and a one-hour
    training for people 14 and older.
  what_to_expect: Volunteers must be at least 14, give about 4 hours a week including some evenings and
    weekends, and complete a one-hour training first. Past volunteer work includes the condom fashion
    show, Menstrual Health Day, and PRIDE Month.
  first_visit_tips:
  - Expect a one-hour volunteer training before your first shift.
  - Check the Upcoming Events calendar on the site for dated opportunities.
