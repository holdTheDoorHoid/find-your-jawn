summary: A professional dance company that performs in Philadelphia, run alongside a dance school for
  children and adults. The school teaches ballet, modern, jazz, tap and hip hop.
what_you_do: Take a class at The Philadelphia School of Dance Arts, which teaches students from age 4
  and adults, or come to a company show. Dancers ages 15 to 23 can be chosen for the apprentice company
  after an evaluation.
