first_step:
  how: Call (215) 387-8202 to ask about open class spots and times, then sign up for a class at the studio
    you choose.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The school lists classes from beginner level up, including adult classes, and tells people to
    call about openings. It does not describe a trial class or a drop-in day.
  what_to_expect: Young children start with pre-dance and acrobat classes, and students from age 7 take
    classical ballet, modern jazz, and tap. Classical ballet runs from beginner to advanced levels, and
    adults can take ballet, modern, tap, jazz, or hip hop. Pointe is offered from age 10, once a dancer
    is physically ready. Call first to confirm open spots, class times, and tuition before you come.
  first_visit_tips:
  - Call (215) 387-8202 first to confirm open spots and class times, since the site does not post them.
  - Ask which studio has your class, because the two studios have different hours.
  - The Oak Lane studio lists a different phone number on the school page, so check it before you call.
  - Ask about tuition before you sign up, because prices are not posted.
