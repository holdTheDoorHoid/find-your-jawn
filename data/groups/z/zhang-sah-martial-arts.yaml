summary: A martial arts school with youth, teen and adult classes, plus camps, an after-school program
  and a school program for young children. It has locations in Queen Village and in Mt Airy and Germantown.
what_you_do: Families submit the online sign-up form, then take an entry exam and tour before joining.
  Youth classes (ages 4 to 14) focus on Tae Kwon Do with Judo; teen and adult classes include Budo, Aikido
  and internal arts.
