summary: A Philadelphia chapter of Omega Psi Phi that runs youth education work, an HBCU college tour
  and health and community action projects. Its Epic Day Party is open to the public and raises money
  for the chapter's foundation and community causes.
what_you_do: The chapter runs youth education and development work, a talent competition for young people,
  a college tour for HBCUs, and health and social action projects. The Epic Day Party is open to the public.
  The site does not say how volunteers take part or how a man joins.
