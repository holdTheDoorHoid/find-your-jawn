summary: A charity that brings healthy food to Philadelphia schoolchildren and their families. It runs
  a pantry for about forty member families, and volunteers pick up produce, pack meals and deliver them
  each week.
what_you_do: Volunteers can pick up produce on Friday mornings, or pack meals and drive deliveries on
  Saturday mornings. Families can ask about joining the pantry, and anyone can give through the donate
  page.
