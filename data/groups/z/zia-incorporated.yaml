first_step:
  how: Fill in the form on the Volunteer With Us page at ziafood.org with your name, phone and email,
    then pick a Friday or Saturday shift.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The volunteer page has a clear form and posted shift times, and it allows as little as one shift
    a month, but it does not say whether new volunteers get training.
  what_to_expect: Volunteers pick up produce, pack meals, or drive deliveries in short morning shifts.
    The volunteer page says the work is run out of First Presbyterian Church in Philadelphia, and it gives
    no street address.
  first_visit_tips:
  - Pickup and delivery volunteers need their own vehicle.
  - Shift times are 9 to 11:30 am Friday for produce, 9 to 11 am Saturday for packing, and 10 am to noon
    Saturday for deliveries.
  - Ask for the street address before your first shift, since the site gives none.
