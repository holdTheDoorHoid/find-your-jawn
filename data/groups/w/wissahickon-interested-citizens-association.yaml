summary: Wissahickon Interested Citizens Association is one of the community organizations registered
  with the City to review nearby zoning and building proposals in the Lower Northwest part of the city.
  Neighbors can follow what is planned and speak up.
what_you_do: Members follow zoning and building proposals, send neighborhood concerns to the association,
  and join committees on parks, schools and beautification. The group also runs summer events such as
  movie nights and music in the park.
