first_step:
  how: Register in advance on the meetings page for the next Zoom general membership meeting, the second
    Wednesday at 7 pm.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: 'Meetings are open to the public and the site says all are welcome, with a clear way in: register
    in advance to get the Zoom login.'
  what_to_expect: A meeting runs about an hour on Zoom, from 7 to 8 pm. Agendas list committee reports
    and other business, such as proposed bylaw updates. Joining costs $15 a year for one person or $25
    for a household, and members can vote starting one month after they join.
  first_visit_tips:
  - Register on the meetings page ahead of time to get the Zoom login details.
  - Members must live inside the association's boundaries and be over 18, so check the boundaries on the
    membership page first.
  - Voting starts one month after you join, so join before a meeting if you want a say.
