first_step:
  how: Go to Clark Park at 44th and Baltimore Avenue for the Wednesday night group run, pick a 2, 4 or
    6 mile loop, or subscribe for weekly run news on the club's site.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The club calls itself welcoming and inclusive, says it is open to beginners and experienced runners
    alike, and names where the Wednesday run starts and how to get weekly news. It does not say whether
    you must sign up before a run.
  what_to_expect: The Wednesday run starts at Clark Park and ends at a local bar, and you pick a 2, 4
    or 6 mile route. All paces are welcome, though most runners keep at least a 12-minute pace. The site
    gives no start time for the regular run.
  first_visit_tips:
  - Clark Park, at 44th and Baltimore Avenue, is where the Wednesday run starts.
  - 'Pick your distance before you start: 2, 4 or 6 miles.'
  - If you want more speed work, the Monday speed workout is at 6:30 pm in Penn Park.
