first_step:
  how: If your primary home is in Washington Square West, apply for garden membership through the association's
    waitlist page at washwestcivic.org/community-gardens/waitlist, choosing a first and second garden.
    Otherwise, come to a public open garden day if one is announced.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 1
  basis: Members must have a primary home in Washington Square West, and the waitlist page says some members
    wait three years for a plot.
  what_to_expect: The association has held public Open Garden Days at this garden, including one in May
    2026 during Love Your Park Week. Membership requires following the garden rules and having a primary
    home in the neighborhood. The garden page does not describe a typical visit or work day.
  first_visit_tips:
  - When you apply, you pick a first and second choice garden, and you are added to both waitlists.
  - The garden page mentions the garden rules but does not link them, so ask the association for a copy.
