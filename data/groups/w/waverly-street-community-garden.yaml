first_step:
  how: If your primary home is in Washington Square West, use the waitlist link on the association's community
    garden page and choose a first and second garden. Otherwise, watch for an Open Garden Day.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 1
  basis: Plots go to residents from a waitlist that the page says can take three years. Open Garden Days
    are the only visit route, and the listings do not say whether they are open to the public.
  what_to_expect: Plots here go to residents of the neighborhood through a waitlist, and the page says
    some people wait three years. The association held an Open Garden Day at this garden on May 9, 2026,
    from 10 am to 2 pm during Love Your Park Week. The garden page does not describe a usual work day.
  first_visit_tips:
  - When you apply, pick a first and second choice garden. You are added to both waitlists.
  - The association defines the neighborhood as the area bounded by Market, Broad, South and 7th Streets.
    If you live close by but outside it, check the FAQ.
  - The garden page mentions garden rules without linking them, so ask the association for a copy.
