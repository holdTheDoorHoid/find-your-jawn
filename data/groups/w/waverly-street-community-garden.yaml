summary: One of the Washington Square West Civic Association's community gardens, at 839 South St. Plots
  go to people whose primary home is in the neighborhood, and the waitlist can be very long.
what_you_do: Plot holders follow the association's garden rules. The association also holds Open Garden
  Days here, and you can find them through its site or Love Your Park listings.
