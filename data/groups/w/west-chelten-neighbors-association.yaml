summary: West Chelten Neighbors Association is a nonprofit, membership-based neighborhood group in West
  Germantown. It works on safety, zoning, cleanliness and beautification, and an annual block party, and
  it is a City registered community organization.
what_you_do: Members help shape the group's work on safety, zoning, cleanliness and beautification, and
  community events such as an annual block party. Neighbors also share their views on nearby zoning and
  building plans with the City and developers.
