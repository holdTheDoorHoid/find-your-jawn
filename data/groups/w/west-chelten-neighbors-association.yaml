first_step:
  how: Fill out the free membership form on the group's membership page, or email membership@westchelten.org,
    then come to the next general meeting, usually at 6:30 pm at the Weavers Way Germantown office.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Anyone can join for free, and associate members can attend meetings and join committees, but
    the site does not say whether non-members can come to a meeting.
  what_to_expect: General meetings are evening gatherings at the Weavers Way office on Chelten Avenue,
    where members handle group business and hear neighborhood updates such as block party plans. The fall
    meeting also has an open floor for new topics. Full members vote and can serve on the board, and associate
    members can attend and join committees.
  first_visit_tips:
  - Fill in the membership form before the meeting so you are on the list as an associate member.
  - Check the group's news page for the date, since general meetings happen only a few times a year.
  - Go to the community room in the Weavers Way Germantown office at 326B W Chelten Ave.
