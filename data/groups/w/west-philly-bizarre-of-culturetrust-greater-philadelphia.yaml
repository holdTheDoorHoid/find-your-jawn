summary: A nonprofit makers market that gives local artists, crafters, and culture creators low-cost or
  free places to sell, mostly for West Philadelphians from underserved communities.
what_you_do: Shop or sell at the Clark Park market on select Saturdays, take a workshop such as the spring
  nail class, or apply as a vendor. The site says it puts Southwest and West Philly residents first at
  Clark Park.
