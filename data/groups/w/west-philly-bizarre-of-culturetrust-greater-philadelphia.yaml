first_step:
  how: Visit the Clark Park market on a select Saturday from April to November, or sign up for the newsletter
    to hear when vendor applications open.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The market is open to anyone, and the vendor page explains how applications work through Marketspread,
    with walk-up spots first come, first served.
  what_to_expect: The Clark Park market runs outdoors on select Saturdays, April through November, with
    no rain dates. Nothing is provided for vendors there, so sellers bring their own tables, racks, chairs,
    and tents. Shoppers can browse and buy from local makers.
  first_visit_tips:
  - Check the events calendar for the Saturday market dates, since they are announced there.
  - If you plan to sell, read the vendor page first. Applications run through Marketspread, and Clark
    Park applications were closed when we checked.
  - Bring your own shade and seating if you plan to sell, because nothing is provided at Clark Park.
  - Vendors with financial hardship can write to market@westphillybizarre.com.
