summary: West Central Germantown Neighbors is a neighborhood group that holds community meetings and potlucks,
  helps with the Tulpehocken Station Garden, and follows zoning and development in the area.
what_you_do: Neighbors take part in community meetings and potlucks, help with the Tulpehocken Station
  Garden, share ideas on how vacant land could be used, and offer to help when they can. The group also
  works on local history, including the Tulpehocken Station Historic District.
