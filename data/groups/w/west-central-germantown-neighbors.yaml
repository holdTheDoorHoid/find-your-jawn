first_step:
  how: Come to a community meeting, or email the board at wcgnboard@gmail.com with an idea or an offer
    to help.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: The volunteer page invites ideas and offers of help and lists attending a meeting as a first
    step, but the site does not list meeting dates or places.
  what_to_expect: Neighbors come to the community meetings, and families with kids have been part of them.
    Last fall's potluck meeting at Wyck drew about 40 neighbors, including costumed kids and dogs. Ask
    the board for the next date and place, since the site does not list them.
  first_visit_tips:
  - Email the board for the next meeting date and place before you come.
  - Sign up for the free online newsletter to hear about the next meeting.
  - If the meeting is a potluck, bring a dish to share.
