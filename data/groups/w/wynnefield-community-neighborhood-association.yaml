summary: Wynnefield Community Neighborhood Association is a Registered Community Organization (RCO) in
  the West Park part of the city. The City asks developers to talk with RCOs about nearby zoning and building
  plans, so this is a way for neighbors to have a say. The group is also a nonprofit that runs community
  events, voter education and youth programs.
what_you_do: Neighbors review nearby building and zoning proposals and share the group's view with the
  City and developers. The group also runs community events, fundraisers, youth programs and voter education,
  and its home page points to volunteer and team roles.
