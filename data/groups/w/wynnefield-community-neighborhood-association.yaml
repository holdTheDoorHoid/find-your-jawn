first_step:
  how: Fill in the online membership application linked from the group's home page, then ask for the Zoom
    link to the next community meeting.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: The site lists a public zoning meeting on Zoom and an online membership form, and says new members
    get a free t-shirt. It does not say newcomers are specially welcomed.
  what_to_expect: The zoning meetings are held on Zoom, so you can attend from home. Expect neighbors
    to talk over nearby building and zoning proposals and to share the group's view with the City and
    developers. The site does not give a meeting length and does not list any dues.
  first_visit_tips:
  - Ask the group for the Zoom link, because the site does not list one.
  - For meeting details or membership, call 215-600-8701 or email wcnarcoinfo@gmail.com, as the site advises.
  - In-person special events are held at Mingle Event Studio, 1905 N. 54th Street.
