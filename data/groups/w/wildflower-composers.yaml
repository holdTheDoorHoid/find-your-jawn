first_step:
  how: Students aged 13 to 19 who are female, transgender, nonbinary or genderqueer can apply through
    the Google form on the festival page, if they can read music in at least one clef. That page still
    shows the July 2026 session, which has already happened, so email erin@wildflowercomposers.org to
    ask when the next session opens. Mini-course questions can go to the same address.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: The festival takes applications. The online mini-courses are rolling, but the 2025 sessions were
    full and the page says to check back, so the way in is unclear.
  what_to_expect: The festival runs July 6 to 17 on Temple University's campus. Days include seminars,
    private composition lessons and expert workshops, and students workshop their pieces with Network
    for New Music musicians. Each composer writes a new piece that is premiered and recorded on the last
    day.
  first_visit_tips:
  - The final premiere concert at Rock Hall is free and open to the public, needs no advance registration,
    and is livestreamed.
  - Chaperones walk students between buildings at all times.
  - Tell the program about any dietary restrictions or allergies, since it says it can accommodate them.
