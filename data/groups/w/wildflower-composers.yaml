first_step:
  how: If you are 13 to 19, read the festival page and apply while admissions are open, which is until
    spots fill. Adults can ask about the mini-courses by emailing erin@wildflowercomposers.org.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Entry is by application. The festival and the mini-courses both take applications, and the mini-course
    page does not describe the application steps.
  what_to_expect: The festival runs about two weeks in July on the Temple University campus. Students
    take daily seminars and private composition lessons with a mentor, workshop a piece with Network for
    New Music musicians, and write a new piece that is premiered on the last day. Tuition is $900, plus
    room and board for students who live on campus, and the premiere concert is free and open to the public.
  first_visit_tips:
  - The final premiere concert at Rock Hall is free and needs no advance registration, so you can hear
    what the festival makes.
  - Chaperones walk students between buildings at all times.
  - Tell the program about any dietary restrictions or allergies, which it says it can accommodate.
