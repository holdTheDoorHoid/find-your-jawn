summary: A mentoring program for early-career composers who are women, transgender, nonbinary or genderqueer.
  It runs a summer festival each July at Temple University and offers six-week online mini-courses.
what_you_do: Students aged 13 to 19 in the program's groups can apply to the summer festival, which runs
  about two weeks at Temple University. Composers in the same groups can take an online six-week mini-course
  at any age from 13 up. The final festival concert in July is free and open to the public.
