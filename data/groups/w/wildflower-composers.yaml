summary: A mentoring program for early-career composers who are women, transgender, nonbinary or genderqueer.
  It runs a summer festival each July at Temple University and offers six-week online mini-courses.
what_you_do: Apply to the summer festival if you are 13 to 19, take an online mini-course, or come to
  the free premiere concert each July. The site also lists a lab and a resident composer placement.
