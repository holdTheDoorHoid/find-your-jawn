summary: A community center for adults 50 and older in West Philadelphia, run as part of Liberty Lutheran's
  family services. Members use the computer and fitness rooms, take exercise and dance classes, and join
  clubs such as quilting and sewing.
what_you_do: Take exercise, dance or pottery classes, join the quilting and sewing club, use the computers,
  or attend financial and retirement planning seminars.
