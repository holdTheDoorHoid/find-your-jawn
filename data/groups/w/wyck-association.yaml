summary: Wyck is a National Historic Landmark house, garden and farm in Germantown, run by the Wyck Association.
  Visitors can walk the grounds for free during posted hours, take a house tour, or join the Home Farm
  Club to help grow food.
what_you_do: Walk the grounds and gardens during open hours and take a house tour. Join the Home Farm
  Club, a kitchen garden where you learn skills and help grow food, or come to a monthly Second Saturday
  workshop on gardening, cooking or history. Volunteers can sign up for the garden newsletter for tasks,
  train as house docents, or help with a committee, and you can become a member.
