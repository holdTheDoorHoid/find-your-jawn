summary: The group that cares for Wyck, a National Historic Landmark house, garden and farm in Germantown
  that the Wistar and Haines families lived in for nine generations. It runs history, garden and urban
  farming programs.
what_you_do: Walk the free grounds, take a house tour, come to a Second Saturday workshop, or join the
  Home Farm Club, a volunteer kitchen garden where helpers share the produce. The site also lists membership
  and rentals.
