schedule:
  text: Grounds are free to walk Tuesday to Friday, 10 am to 4 pm, and Saturday, noon to 4 pm. House tours
    run Thursday to Saturday, noon to 4 pm (fall hours). The Home Farm Club meets on Tuesdays and Fridays
    in season, and Second Saturday workshops run monthly, mostly 11 am to 12:30 pm.
