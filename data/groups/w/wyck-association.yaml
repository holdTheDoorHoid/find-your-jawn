first_step:
  how: Walk onto the grounds during posted hours, or come to a Home Farm Club session on the Tuesday or
    Friday time posted for the season, entering through the Walnut Lane entrance. No registration is needed
    for the Home Farm Club.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The Home Farm Club says no prior experience is needed and no registration is required, children
    can come with a parent, and each visit starts with short lessons. The site does not name a separate
    newcomer program, so this is a 4 rather than a 5.
  what_to_expect: A Home Farm Club visit starts with a short lesson, then hands-on work in the kitchen
    garden, such as weeding, pruning and harvesting. There is no time commitment, and volunteers take
    home a share of the fresh produce. Most Second Saturday workshops run from 11 am to 12:30 pm and need
    an online sign up.
  first_visit_tips:
  - Enter the farm at the Walnut Lane entrance, as the site directs.
  - Free parking is on W. Walnut Lane, E. High Street and nearby side streets; metered spots are on Germantown
    Avenue.
  - For a Second Saturday workshop, sign up online early, since seats are limited and registration opens
    up to two weeks before.
