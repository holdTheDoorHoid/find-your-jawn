first_step:
  how: Come to Community Mondays game night on the first Monday at St. Luke's and the Epiphany, or add
    your name to the Volunteer Mailing List for one-time roles.
  drop_in: false
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: Game night says all are welcomed and is described as low stakes, and the volunteer page explains
    how to sign up for one-time roles and regular shifts.
  what_to_expect: 'Community Mondays are evening events for LGBTQIA+ adults 18 and up: board and card
    games at game night, an open mic for LGBTQIA+ performers, and a monthly craft night. The page does
    not say how many people come or whether you need to register, so plan on the 6 to 8 pm window.'
  first_visit_tips:
  - Call 215-732-2220 to confirm the date and whether you need to sign up.
  - Bring a game of your own if you want to play one in particular; bringing your own games is allowed.
  - Go to the volunteer page if you want to help; one-time roles need only a mailing list sign-up.
