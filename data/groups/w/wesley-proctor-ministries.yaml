    in use, and the community center is still described as planned.
  what_to_expect: The site describes help filing for tax-exempt status, aimed at churches and nonprofits,
    and it does not describe a class or meeting for individuals. The community center is described as
    planned, with study space, computer training, and food, but no opening date is given. Ask what is
    running before you plan a visit.
