first_step:
  how: Come to the Saturday 1 to 2 pm session at Calvary Community Center, 4740 Baltimore Ave, or email
    the group to ask about the weekday sits.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The sits are open to all and the page invites questions by email, but it does not say whether
    you need to register first.
  what_to_expect: 'The Saturday session runs about an hour: a guided meditation, then a talk and time
    for questions, then tea. The weekday sits are two 30 minute sits, and you can come to one or both.
    The classes are free, and the page lists no fee or donation.'
  first_visit_tips:
  - Use the red double doors on Baltimore Avenue, and look for the chalkboard sign out front.
  - Climb the stairs on your left after the door, and the room is at the top.
  - Cushions, blankets and yoga mats are kept in a glass cabinet in the room.
