summary: A nonprofit that paints murals and beautifies public walls with neighbors, artists, and businesses.
  Its work centers on giving voice to communities that are often left out.
what_you_do: Community groups can request a mural through the Free Mural Program, which takes open calls.
  Anyone can stop by a paint day to help, artists can join the free network and look for paid mural projects,
  and businesses can commission team-building painting.
