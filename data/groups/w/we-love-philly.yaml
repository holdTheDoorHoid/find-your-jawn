summary: A nonprofit that works to transform education for Philadelphia students through paid digital
  marketing and cybersecurity pre-apprenticeships. Adults can volunteer, join a committee, or mentor.
what_you_do: Students gain hands-on work experience in the classroom and earn wages through the pre-apprenticeships.
  Adults can start on the Get Involved page by taking the volunteer survey, booking a tour, or signing
  up through the Become a Mentor page.
