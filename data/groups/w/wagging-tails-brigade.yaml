summary: A volunteer program at Philadelphia International Airport where certified therapy dog teams spend
  about two hours a week in the terminals, helping travelers and staff relax.
what_you_do: A handler and dog walk the terminals and visit with passengers, who can take home a trading
  card with the dog's picture. Handlers fill out an interest form to join.
