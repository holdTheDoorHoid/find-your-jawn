summary: A Penn student group that helps women and underrepresented people build and fund young companies,
  through speaker events and investment and consulting committees.
what_you_do: Penn undergraduates sign up for the club listserv to take part in speaker events, workshops
  and mentoring. Students can also apply to the consulting committee, which takes on 10-week projects
  for Penn-affiliated startups and Philadelphia-area women business owners, or to the investments committee,
  which teaches venture capital basics and builds pitches.
