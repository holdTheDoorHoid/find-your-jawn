first_step:
  how: Send a message through the Connect form on wedreamdoyou.com and ask whether the summer camp is
    running this year and what it costs.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The site has forms and a camp registration document, but no current dates, prices, or locations,
    so the way in is unclear.
  what_to_expect: The camp is described as an affordable day camp for children, with reading, arts and
    crafts, public speaking, and team building. The site gives no current camp dates, hours, location,
    or price, so ask before you plan a visit. TGIF mentors and mentees sign up through forms on its page.
  first_visit_tips:
  - Ask whether the camp runs this year before you download the registration form.
  - Ask where the camp meets, since the site does not name a location.
  - For TGIF on another campus, use the contact address listed on the TGIF page.
