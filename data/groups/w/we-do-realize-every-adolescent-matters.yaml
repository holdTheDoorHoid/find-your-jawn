summary: A youth nonprofit that runs a summer day camp for children and TGIF, a mentoring program for
  female college students of color. Its website lists a boys' program too, but the page for it gave no
  details.
what_you_do: Children can sign up for the summer day camp, which the site calls affordable and which covers
  reading, arts and crafts, teamwork, and community service. Female college students of color can sign
  up for TGIF mentoring as mentees, and mentors can sign up too. The site does not say what the boys'
  program involves.
