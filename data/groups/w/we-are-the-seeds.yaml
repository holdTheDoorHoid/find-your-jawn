summary: A Native-led arts and culture group, a project of CultureTrust Greater Philadelphia. It shares
  contemporary Indigenous arts through a yearly Philadelphia weekend, a listening garden, workshops, and
  a podcast.
what_you_do: Go to the Seeds Philly weekend, which has an art show, live painting, short films, workshops
  and artist talks. Visit the Seeds Indigenous Listening Garden in West Philadelphia. Schools and organizations
  can request an Indigenous arts workshop through the request form on the site.
