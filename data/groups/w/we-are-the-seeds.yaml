summary: A Native-led Philadelphia project that shares and teaches Indigenous arts and cultures. It runs
  the Seeds Philly weekend, a podcast, and an Indigenous listening garden in West Philadelphia.
what_you_do: Go to a Seeds Philly weekend when one is held, listen to the group's podcast, or ask the
  group to bring an Indigenous arts workshop to your school or organization.
