first_step:
  how: Ask the group, through its website, to bring a workshop to your school or organization. Watch its
    site and Instagram for news about a future Seeds Philly weekend.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The festival was open to the public, but organizers say it may not return for the foreseeable
    future, and the garden has no published address or hours.
  what_to_expect: Seeds Philly is a two-day weekend with talks, live painting, short films, workshops
    and an Indigenous art show. The 2026 festival was held at Cherry Street Pier in September. In September
    2026, organizers told the Inquirer it may be the last Seeds Philly for the foreseeable future because
    the money has run out.
  first_visit_tips:
  - Check with the group before you plan a trip, since the festival's future is uncertain.
  - The listening garden's street address and hours are not published, so ask the group before you visit.
  - Follow the group on Instagram or read its Substack for updates.
