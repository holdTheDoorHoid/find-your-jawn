first_step:
  how: Watch the group's site for the next Seeds Philly weekend, or use the site's request form to ask
    for a workshop for your school or group.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The festival is open to the public, and the site explains how schools and groups can request
    a workshop. No volunteer roles or beginner program are listed.
  what_to_expect: Seeds Philly is a two-day weekend with talks, live art, short films, workshops and an
    Indigenous art show. The 2026 weekend was pay what you can, with a $20 suggested donation. A September
    2026 Inquirer report said organizers may not hold the festival again for the foreseeable future, because
    the money has run out.
  first_visit_tips:
  - Check with the group before you plan a trip, since the festival's future is uncertain.
  - The garden's street address and hours are not published, so ask the group before visiting.
  - Follow the group on Instagram or its Substack for updates.
