summary: A Native-led group in Philadelphia that shares and teaches Indigenous arts and cultures. It runs
  a yearly Seeds Philly weekend, a podcast, and an Indigenous listening garden in West Philadelphia.
what_you_do: Go to the Seeds Philly weekend, listen to the podcast, or ask the group to bring a workshop
  to your school or organization. The listening garden has no published street address or hours.
