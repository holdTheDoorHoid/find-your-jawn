  gear: A front white headlight and a rear red reflector or tail light after dark, a bike kept in good
    repair, and a basic repair kit with a spare tube. Bring water in summer and warm layers in winter.
first_step:
  how: Pick a posted ride on wednightrides.org, check its start point and route, and show up with lights
    and a bike in good shape.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The site says everyone is welcome regardless of experience, and every ride is posted in advance
    with a start point and route, so a newcomer knows where to show up.
  what_to_expect: A ride is a group trip through Philadelphia on a posted route, with rides running roughly
    6 to 9.5 miles, some of them hilly. Each ride post names a start, a route, and an end spot, often
    a park or a brewery. Riders are asked to follow traffic rules, stop at red lights, and look out for
    pedestrians.
  first_visit_tips:
  - Read the ride post for the start point and route before you go, since they change from ride to ride.
  - After dark, bring a white front light and a red rear light or reflector, which Pennsylvania law requires.
  - Bring a basic repair kit, water in summer, and warm layers in winter.
  - Arrive sober, and stay to the right and out of the way of traffic.
