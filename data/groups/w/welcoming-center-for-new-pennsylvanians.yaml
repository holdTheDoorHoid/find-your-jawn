first_step:
  how: Fill out the waitlist or interest form on the English and digital skills page for the class you
    want, or call 215-557-2626 to ask which level fits you.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: The classes are free and aimed at immigrants, but most are waitlist only, and some need intermediate
    English first. Enrolling means a form or a call, so walk-ins are not the way in.
  what_to_expect: Classes are free and start on set dates. For General English, Level 1 meets in person
    in Center City twice a week from 9:30 am to 12 pm, and higher levels mix in-person and Zoom. Joining
    the waitlist does not guarantee a spot, so ask the office when the next start is.
  first_visit_tips:
  - Call 215-557-2626 first, since the site does not list office hours or walk-in rules.
  - If English is not your first language, ask for help in your language when you call.
  - The office is on the 4th floor of 211 N 13th St. The site does not say whether there is an elevator,
    so ask when you call.
