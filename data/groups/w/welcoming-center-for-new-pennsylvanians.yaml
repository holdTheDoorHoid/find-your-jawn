summary: A Philadelphia nonprofit that helps immigrants build jobs, businesses, and English and digital
  skills. Its programs include English and digital skills classes, work readiness tracks, business courses
  and the Immigrant Leadership Institute, and it offers translation and interpretation help.
what_you_do: Join an English or digital skills class, a work readiness track, a business planning course,
  or the Immigrant Leadership Institute. Translation and interpretation help is available. Volunteers
  can help with mock interviews, resume help and career guidance.
