summary: A Philadelphia nonprofit that spreads small acts of kindness through pop-up events, community
  projects and a scholarship program. It also recruits volunteer Kindness Ambassadors who can help mostly
  from home.
what_you_do: Kindness Ambassadors are volunteers who do a fixed number of kind acts each month and spread
  the group's projects online, by email, or by text. Most of the work can be done from home, and volunteering
  is optional. The group also runs seasonal donation drives, a Christmas breakfast project for families
  in need, and a book scholarship (a bookstore gift card) for college students.
