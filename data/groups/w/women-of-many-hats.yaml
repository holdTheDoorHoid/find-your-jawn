summary: A Christian-based group that supports sheltered services helping families move toward stability,
  with a focus on women who have survived domestic violence. It also holds an event called the Show Me
  Love Luncheon.
what_you_do: Volunteer, give a monthly gift through the Partner Circle, or donate. The Aid Distribution
  Program gives out food, diapers, formula and clothing, but the site does not say how to ask for it.
