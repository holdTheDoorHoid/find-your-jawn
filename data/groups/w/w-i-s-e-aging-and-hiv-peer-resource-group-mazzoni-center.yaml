summary: A free group of eight sessions for LGBTQ+ adults, 18 and older, about healthy and affirming relationships.
  It looks at romantic, friendship, family and work connections.
what_you_do: Join the eight-session group to talk about what healthy relationships look like, using discussion
  and creative art. Participants receive journals, art supplies, SEPTA passes and snacks.
