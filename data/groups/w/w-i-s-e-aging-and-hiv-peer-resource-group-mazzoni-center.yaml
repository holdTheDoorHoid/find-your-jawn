summary: A free eight-week group for LGBTQ+ adults, 18 and older, about healthy and affirming relationships.
  It looks at romantic, friendship, family, and work connections.
what_you_do: Join the weekly group for eight weeks, talk about what healthy relationships look like, and
  take home journals, art supplies, SEPTA passes, and snacks.
