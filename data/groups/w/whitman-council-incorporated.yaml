first_step:
  how: Call (215) 468-4056 or email whitmancouncilinc@gmail.com to book an appointment at the office on
    S 3rd Street.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The site says the council helps anyone who asks, and it gives office hours and a phone number
    to book a visit.
  what_to_expect: Visits are usually booked ahead, since the office prefers appointments. Staff can help
    with utility assistance, property tax and rent rebates, and LIHEAP or PACE applications. The site
    does not list costs for these services.
  first_visit_tips:
  - Call during office hours, Monday to Friday, 8 am to 4:30 pm, to book a time.
  - Ask about parking and transit when you book, since the site gives no directions for either.
  - The office is on S 3rd Street at the same address listed for the 2025 board meetings.
