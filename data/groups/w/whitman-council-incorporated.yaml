summary: A neighborhood advisory council for the Whitman area of South Philadelphia, serving the community
  since 1977. Its office helps neighbors with utility bills, property tax and rent rebates, senior programs,
  and other housing questions.
what_you_do: Staff help residents apply for utility assistance, property tax and rent rebates, and the
  senior property tax freeze, and answer questions about SEPTA schedules and zoning. The council also
  lists its board meetings and community events on its calendar.
