summary: A nonprofit cooperative of member-run collectives in Philadelphia that does mutual aid. Its collectives
  cover food and land work, health and addiction care, a laundry for people without stable housing, a
  car-share network, art, and worker education and media.
what_you_do: Choose the collective that fits your skills, such as land and food work, media and economic
  education, art, the laundry, or health and addiction care. Then say which one you want on the Worker
  Introduction form, or on the contact form under the Joining WRC topic.
