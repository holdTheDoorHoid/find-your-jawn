summary: A group that works with people who say they were wrongly convicted, along with their families
  and lawyers, through Pennsylvania's post-conviction process. It also runs talks, courses, and workshops
  on wrongful convictions and restorative justice.
what_you_do: Attend a talk, film discussion, or course the group takes part in. The site lists a wrongful
  convictions course with Mt. Airy Learning Tree on October 22, 2026, and past talks at a Rotary club
  and several universities.
