first_step:
  how: Open the Upcoming Workshops page on waymoorejustice.org and use the Register Here link for the
    October 22, 2026 wrongful convictions course. That link goes to the Mt. Airy Learning Tree registration
    page.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The course page says anyone interested in civics, social justice, or the legal system can take
    it, and it gives a register link. One past talk was for members and guests, and the site does not
    say what the course costs.
  what_to_expect: The course is listed at Essential Community Connections on Germantown Avenue, taught
    by Tricia Way and Yahya Moore. The site does not say how many sessions it runs, how long each one
    lasts, or what it costs.
