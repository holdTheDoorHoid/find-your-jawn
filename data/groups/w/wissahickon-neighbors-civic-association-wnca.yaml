first_step:
  how: Come to the next neighborhood meeting, the third Thursday at 7 pm at Pilgrim Church, 3815 Terrace
    St.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Meetings are open to neighbors in person, and the site has a Join page and an updates sign-up,
    which together make a clear way in.
  what_to_expect: Meetings run an hour at Pilgrim Church, and neighbors are welcome to attend. Woodland
    cleanups are held on Sunday mornings, a hands-on way to help the park while meeting neighbors. Membership
    dues are $25 a year for one person, and members are the ones who can vote on neighborhood matters.
  first_visit_tips:
  - Sign up for the newsletter on the site to hear about meetings and events.
  - Woodland cleanups are on the second Sunday of the month, so plan around that date.
  - Join online through the Join Today page if you want to vote.
