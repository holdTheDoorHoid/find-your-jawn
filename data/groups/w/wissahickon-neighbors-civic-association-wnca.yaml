summary: Wissahickon Neighbors Civic Association (WNCA) is a Registered Community Organization (RCO) in
  the Lower Northwest part of the city. The City asks developers to talk with RCOs about nearby zoning
  and building plans, so this is a way for neighbors to have a say.
what_you_do: Neighbors meet monthly, review zoning and building plans nearby, and help care for Wissahickon
  Neighbors Woodland through monthly cleanups. Members vote on neighborhood matters.
