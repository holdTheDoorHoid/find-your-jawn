summary: A six week pre-apprenticeship for women who want skilled jobs in construction, manufacturing
  or transit. It offers safety training, education, mentoring and help with job applications.
what_you_do: Take safety training and education classes, get mentoring, learn about the trades, and get
  help with applications for apprenticeships.
