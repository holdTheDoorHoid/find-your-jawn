first_step:
  how: Click Apply Now on womenbuildpa.org, email winc@fti.edu, or call 267-939-0035, a number the program's
    home page lists for an intake contact. The next cohort starts in October 2026.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: 'You apply first, and the program lists requirements before you start: age 18 or older, a valid
    driver''s license, a high school diploma or GED, and a passing drug test.'
  what_to_expect: This is a six week pre-apprenticeship, with classes Tuesday through Thursday from 8
    am to 4:30 pm at the Finishing Trades Institute on Horning Road. Training covers safety, education,
    mentorship and help with job applications, and you learn about different trades. Orientation sessions
    are held in person at the training site, and the site does not say whether taking part costs anything.
  first_visit_tips:
  - 'Check the requirements first: 18 or older, a valid driver''s license, a high school diploma or GED,
    and passing a drug test.'
  - Philadelphia residents get priority in the program.
  - Orientation is held in person at the training site, so plan to go there.
