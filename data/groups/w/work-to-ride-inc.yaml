summary: A horsemanship program for young people in Philadelphia, based at the Chamounix Equestrian Center
  in Fairmount Park. It runs a summer camp and one-day farm and horse programs for kids. The group says
  its riding is free for under-resourced youth.
what_you_do: Kids learn horsemanship and equine sports; volunteers help with programs at the stables.
