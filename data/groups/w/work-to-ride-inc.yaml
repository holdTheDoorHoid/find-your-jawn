first_step:
  how: Email wtr@worktoride.net or call (215) 877-4419 to ask about the next session, or fill in the volunteer
    form if you are over 14.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The site lists a phone number, an email address, a camp registration form, and a volunteer form,
    so the way in is clear. It does not describe a join process for youth.
  what_to_expect: Camp days run 9 am to 4 pm, with lunch from 12 to 1. Campers do barn chores, learn about
    animal care and safety, ride twice a day, and explore Fairmount Park, with games and arts and crafts.
    Groups of about five rotate through stations with the same counselor all week.
  first_visit_tips:
  - Confirm the age range and session dates before you register, since the site lists them in more than
    one way.
  - Plan for a full day, 9 am to 4 pm.
  - Camp fees are not refundable, and changing weeks costs $10 if space allows.
  - Registration is not complete until payment is made; you can pay by card over the phone or by check.
