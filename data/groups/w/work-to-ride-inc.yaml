schedule:
  text: Summer camp runs in one-week sessions through the summer, with dates posted each year on the camp
    page. Riding camp is for ages 8 to 13, a little kids camp for ages 5 to 7, and polo camp for ages
    8 and up. Other programs run on a schedule the group announces.
