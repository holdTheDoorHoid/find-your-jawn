summary: The neighborhood civic association for Washington Square West. It describes itself as Philadelphia's
  first civic association, runs community gardens, and co-hosts Love Your Park garden days with Farm Philly.
what_you_do: Come to the monthly board meeting, which is open to the public, or help at a Love Your Park
  garden day. Membership joins and renewals are handled online.
