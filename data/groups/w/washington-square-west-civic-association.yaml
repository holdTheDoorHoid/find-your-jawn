summary: The civic association for the Washington Square West neighborhood. It runs three community gardens
  and co-hosts Open Garden Days with Farm Philly, the city's gardening program.
what_you_do: Come to the monthly board meeting, which is open to the public, or attend a garden day. Membership
  joins and renewals are handled online.
