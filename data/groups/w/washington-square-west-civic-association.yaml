first_step:
  how: Attend the board meeting on the second Tuesday at 7 pm. The site does not name the room, so call
    or email the association first to confirm where it meets.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Board meetings are open to anyone and membership joins online, but the meeting room is not on
    the site, so the first visit takes one call or email.
  what_to_expect: The board meeting is a public monthly meeting on the second Tuesday at 7 pm. The site
    does not describe the agenda or how long the meeting runs. Garden days are a hands-on way to meet
    the association's volunteers, and the association co-hosts them with Farm Philly.
  first_visit_tips:
  - Call 267-603-1318 or email info@washwestcivic.org to confirm the meeting room. The phone line is voicemail
    only.
  - The contact page lists an office at 1100 Walnut, Room B113, but the site does not say board meetings
    happen there.
  - Renters can join, and membership is handled through an online form. The site does not list dues.
  - Ask about the next Open Garden Day, which the association co-hosts with Farm Philly.
