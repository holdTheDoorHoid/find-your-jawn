first_step:
  how: Register for a free visit on the institute's Eventbrite page, or walk in during museum hours, Tuesday
    to Friday.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The visit page says walk-ins are welcome, that scavenger hunts guide first-time visitors, and
    that staff are available to answer questions.
  what_to_expect: 'A visit is self-guided: you walk through the specimen hall at your own pace past fossils,
    minerals, and mounted animals. A themed scavenger hunt is one way to start, and staff can answer questions.
    Admission is free, and the institute also runs adult talks and evening courses.'
  first_visit_tips:
  - Register on the Eventbrite page first, since it speeds entry; walk-ins are also welcome.
  - Check the hours before you go, because the first Saturday schedule is listed two different ways.
  - The museum is up a flight of stairs, so ask info@wagnerfreeinstitute.org about access before you come.
  - Pencils and paper are available for sketching in the hall.
