summary: A free natural history museum and science education institution in North Philadelphia, founded
  in 1855, with a Victorian-era specimen hall of more than 100,000 items and regular talks and courses.
what_you_do: Visit the museum for free and walk through the specimen hall, come to a Weeknights at the
  Wagner talk or the First Saturday Open House, take an evening course, or join as a member.
