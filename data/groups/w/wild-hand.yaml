  basis: Fiber Folk Night is free, walk-ins are fine, and the page says first timers and people still
    learning are welcome. Beginner classes are also listed, but the site does not describe a separate
    newcomer program.
  what_to_expect: Fiber Folk Night is a weekly, free evening where people bring their own fiber project
    and work on it alongside others, from knitting and crochet to spinning. Everyone is welcome at any
    skill level, and you can walk in without signing up. The page does not say whether tables and seating
    are provided.
  first_visit_tips:
  - Bring a project you can work on, since the page asks visitors to bring one.
  - There is no lot, but free street parking is usually within one block.
  - Check the shop's email and social media for last minute changes.
