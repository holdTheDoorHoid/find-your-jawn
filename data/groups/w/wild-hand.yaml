  how: Come to Fiber Folk Night on a Wednesday from 5 to 7 pm at 606 Carpenter Lane, bringing a project
    to work on. For a class, open the class list on the shop's site and sign up there.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: Fiber Folk Night is free and walk-ins are fine, and the shop says it welcomes every skill level
    and helps people at any stage of learning. Beginner classes are listed, but the site describes no
    separate newcomer program.
  what_to_expect: Fiber Folk Night is a free, two hour evening where people bring their own fiber project
    and work on it together, from knitting and crochet to spinning. You can walk in without signing up;
    registering is optional and gets you reminders. The page does not say whether tables, seating or supplies
    are provided.
  first_visit_tips:
  - Bring a project you can work on, since the shop asks visitors to bring one.
  - The 53 bus stops about a 5 minute walk away at Wayne Avenue and Carpenter Lane.
  - Check the shop's email and social media for last minute changes.
