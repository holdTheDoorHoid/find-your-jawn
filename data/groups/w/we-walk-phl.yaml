first_step:
  how: Register for a walk near you through the program's sign-up link, or call 215-309-5523. Registration
    is recommended for the Bartram's Garden walk, which meets Thursdays at 5 pm at the Welcome Center.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Free, open to people of all ages and abilities, led by trained local leaders, with a phone line
    and a sign-up link. The pages do not say whether first-time walkers get extra help or whether registration
    is required before the first walk.
  what_to_expect: Each walk lasts about an hour and a trained local leader guides it through a park near
    you. Walk leaders greet and guide participants, and the pages do not give the pace or distance, so
    ask the program before you go. The walks are free, and registration is recommended for the Bartram's
    Garden walk.
  first_visit_tips:
  - Go to the Bartram's Garden Welcome Center at 5400 Lindbergh Boulevard for the Thursday walk, and look
    for the walk leaders at the start.
  - Ask the program about pace and distance if you want an easier walk.
  - Check the park and time before each walk, since the schedule varies by park.
