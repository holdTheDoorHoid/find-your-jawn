summary: A free walking group run through Philadelphia Parks and Recreation that meets in public parks
  across the city. Trained local leaders guide about an hour of walking, one to three times a week depending
  on the park.
what_you_do: Walk with neighbors for about an hour in a park near you, and get to know people who walk
  the same route.
