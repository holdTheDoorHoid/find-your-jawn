first_step:
  how: Find the walk nearest you on the We Walk PHL registration page on GivePulse, or call 215-309-5523.
    The Bartram's Garden walk meets on Thursdays from 5 to 6 pm at the Welcome Center.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Free and open to the public, with a registration portal and a phone line. The pages do not say
    whether first time walkers get any extra help, and they do not say whether registration is needed
    before the first walk.
  what_to_expect: Each walk lasts about an hour and is guided by a trained local leader. The pages do
    not describe the pace or distance, so ask the program before you go. Walks are free.
  first_visit_tips:
  - At Bartram's Garden, walk leaders greet people at the start, so go to the Welcome Center at 5400 Lindbergh
    Boulevard.
  - Ask the program about pace and distance if you want an easier walk.
  - Check the park and time before each walk, since the schedule varies by park.
