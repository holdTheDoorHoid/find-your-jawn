summary: A free walking group that meets in public parks across Philadelphia. Trained local leaders guide
  about an hour of walking, one to three times a week depending on the park. The program is supported
  by Parks and Recreation, the Fairmount Park Conservancy and the Department of Public Health.
what_you_do: Walk with neighbors for about an hour in a park near you, and get to know people who walk
  the same route.
