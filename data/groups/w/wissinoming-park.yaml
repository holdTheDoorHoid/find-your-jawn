  basis: The group's own website did not open for us, so we could not confirm how to join. The City's
    stewardship office is the only route we found, so the way in is unclear.
  what_to_expect: The most recent cleanup we found was a November 2023 fall event, which drew over 100
    volunteers. They planted trees and bulbs, raked, mulched, swept and picked up trash before winter.
