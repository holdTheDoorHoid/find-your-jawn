summary: The Friends of Wissinoming look after Wissinoming Park in Northeast Philadelphia. The last public
  report we found is a November 2023 fall cleanup, where volunteers planted trees and bulbs, raked, and
  picked up trash with the city and the Fairmount Park Conservancy.
what_you_do: Join park cleanups and planting days. In 2023 the group took part in the citywide Love Your
  Park weekend with the city and the Fairmount Park Conservancy.
