first_step:
  how: Fill out the Donate and Volunteer form on the website (name, phone, email, then choose Volunteer
    My Time), or email give@welovetogive.org, before you come to help.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The giveaways and Love Park servings are open to the public and first come, first served, and
    the site gives a form, an email and a phone line to start. It does not describe a special welcome
    for new volunteers.
  what_to_expect: Come to a Saturday giveaway or Love Park serving, or ask to help on a shift. Volunteers
    help with things like serving meals and organizing donations, and even occasional help counts. The
    site gives no street address for Beloved St. John or Love Park, and the giveaways and servings are
    free.
  first_visit_tips:
  - Call (267) 433-2227 or email give@welovetogive.org for the address and check-in time, since the site
    lists no street address for either place.
  - At Love Park, look for the group's tent.
  - Servings are weather permitting and first come, first served, so arrive early.
