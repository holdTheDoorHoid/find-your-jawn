schedule:
  text: Grocery giveaway at Beloved St. John on the 2nd and 4th Saturdays, 12 to 1 pm. Love Park servings
    on the 1st and 3rd Saturdays, noon to 1 pm or until the food runs out, weather permitting. Community
    fridge refilled on the 15th of each month.
