summary: A Philadelphia nonprofit that gives out groceries, meals, clothing, and hygiene items to neighbors
  facing hunger or housing trouble, and keeps a community fridge stocked.
what_you_do: Volunteer at a grocery giveaway, a Love Park serving, or a community fridge refill, or help
  with the Game Day visits to senior neighbors that run all year. Donations of food and goods are also
  welcome. People in need can come to the giveaways and servings.
