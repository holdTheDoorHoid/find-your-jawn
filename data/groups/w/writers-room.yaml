summary: Drexel University's literary arts program for students, alumni and neighbors. It runs a monthly
  writing workshop, free readings, a writing course and community storytelling projects, and everything
  it does is free and open to all.
what_you_do: Come to the monthly Second Tuesday workshop, where Drexel students and neighbors share stories
  and build community together. You can also attend free events, join the mailing list, or take the WRIT290
  writing course. Community projects such as Crossing Streets link West Philadelphia and Chinatown.
