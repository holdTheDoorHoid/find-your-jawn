summary: An arts nonprofit in West Philadelphia that runs after school art, dance, theater and guitar
  classes for young people, plus summer camps and a yearly outdoor arts festival.
what_you_do: Sign a child up for an after school class or a summer camp. Anyone can come to the June West
  Park Arts Fest. Adults can volunteer, donate, or shop at the gift shop.
