first_step:
  how: Pick a class on the program pages and use its Register now or Learn more link, or call 215-473-7810
    to ask about class times and fees.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Programs and the June Arts Fest are open to the public, and each program page has a way to register.
    The site does not describe a beginner program.
  what_to_expect: Afterschool classes meet during the school year, and the visual art class for ages 10
    to 13 meets Tuesdays and Thursdays from 4 to 5:30 pm at Martha Washington School. Fees differ by program,
    so ask before you sign up. Volunteers for the ceramics class must have criminal and child abuse clearances.
  first_visit_tips:
  - Call or email ahead to confirm class times, since not every program page lists them.
  - Ask about fees and financial help when you register.
  - Go to the June Arts Fest first to see the center's work before you sign up.
