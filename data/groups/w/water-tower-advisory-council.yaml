summary: A 501(c)(3) nonprofit that guides how the Water Tower Recreation Center is developed and used,
  working with Philadelphia Parks & Recreation and the local community. The center has gyms, courts, ball
  fields, a playground, and classrooms.
what_you_do: The main way to take part is to join the Advisory Council. The site says council meetings
  are open to the public and listed on its calendar, but the calendar showed no meetings when we checked.
  The center's programs page lists an after school program, pickleball, gymnastics, and a youth sport
  club, with details on linked pages.
