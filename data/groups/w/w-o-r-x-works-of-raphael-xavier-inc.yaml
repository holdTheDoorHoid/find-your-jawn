summary: A nonprofit that brings arts training to young people, with a focus on Breaking, the dance form
  from hip hop culture. It runs youth programs, often with local schools, and hosts community jams.
what_you_do: Young people take part in music, dance, theater and live skills programs, often through local
  schools. Community members can attend the Core Creek Flatland Jam, with riding, dancing, games and a
  cookout.
