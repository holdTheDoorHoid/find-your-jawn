first_step:
  how: Visit the Farm Market during its hours and shop without joining. To become a member, use the Join
    Now button on the membership page.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: The Farm Market is open to anyone without membership, and the membership page explains how to
    join through a Join Now button. The site does not describe a newcomer session.
  what_to_expect: The Farm Market is open to the public, so you can walk in during its hours and shop
    without joining. Members get extra perks, such as a 5 percent discount on Weavers Way Farms produce
    and member-only sales. Fees are not listed on the pages we read, so call the Farm Market before you
    join.
  first_visit_tips:
  - 'Check the hours first: Tuesday and Friday 11 am to 7 pm, Saturday 10 am to 4 pm.'
  - The site links a parking map rather than describing parking, so look at it before you drive.
  - Call 267.876.3101 with questions about membership before you sign up.
  - If you join, a working member owes six volunteer hours per person each year (anyone over 16), due
    in the first four months.
