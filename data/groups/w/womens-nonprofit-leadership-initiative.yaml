first_step:
  how: Download a model letter from the Get Involved page and send it to a university or hospital board
    chair.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Model letters, board tips and the mailing list are open to anyone, and the site gives a clear
    way in. It describes no member events or volunteer roles.
  what_to_expect: There is no meeting or event listed on the site, so a first step happens online. Most
    people start by reading the group's research on who sits on large hospital and university boards,
    then sending a letter to a board leader. The site lists no cost for the letters, the board tips or
    the mailing list.
  first_visit_tips:
  - 'Choose the model letter that fits the institution: higher education or healthcare.'
  - The model letters can go to a board chair, a university president, or another board leader.
