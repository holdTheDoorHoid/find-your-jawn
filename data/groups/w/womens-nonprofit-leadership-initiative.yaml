summary: Researches who sits on the boards of Greater Philadelphia's largest colleges and hospitals, and
  pushes for more women and people of color in those seats. Anyone can use its ready-made letters to board
  leaders and its tips for joining a board.
what_you_do: Send one of the model letters to a university or hospital board chair, read the tips for
  joining a higher education or healthcare board, or sign up for the mailing list to follow the research.
