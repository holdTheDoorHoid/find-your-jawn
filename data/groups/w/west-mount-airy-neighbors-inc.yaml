first_step:
  how: Join the Zoom zoning meeting on the first Wednesday at 7 pm. The link is on the group's zoning
    page.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 3
  basis: The zoning page says the meetings are open to anyone and gives a regular Zoom time, but it has
    no newcomer welcome and its listed meeting dates use a different start time.
  what_to_expect: Zoning meetings run on Zoom, and anyone can join to hear the cases the group is following.
    The group hosts public meetings where developers present plans, then sends the Zoning Board a letter
    with the vote and neighbors' concerns. You can listen, and anyone can testify at a Zoning Board hearing
    even without joining the group.
  first_visit_tips:
  - Join a few minutes early and check your Zoom setup first.
  - Check the zoning page for the date, since the listed meetings used 7:30 pm rather than the usual 7
    pm.
  - Have the address of the project you care about ready, since the group lists cases by address.
