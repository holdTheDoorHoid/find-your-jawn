summary: West Mount Airy Neighbors is the City registered community organization for West Mount Airy.
  It follows zoning and building proposals and runs committees on the environment, historic preservation,
  traffic calming, and neighborhood diversity.
what_you_do: Neighbors follow zoning and building plans at Zoom meetings. When a project is refused approval,
  the group hosts a public meeting where the developer presents and then sends the Zoning Board of Adjustment
  a letter with the vote and neighbors' concerns.
