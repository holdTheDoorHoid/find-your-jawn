first_step:
  how: Join through the Join Now button on the membership page, or send a message through the chapter
    contact link to ask about the next networking event.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Member only events need a membership login, and dues come before you can see them. The chapter
    lists no meeting dates, and the site does not say whether non-members can attend chapter events.
  what_to_expect: The chapter does not post its meetings on its page, so the first step is to ask. Most
    network events are one hour online sessions on Zoom, often at lunchtime, and the events page does
    not list a price for any of them.
  first_visit_tips:
  - Email the chapter first, since no chapter meeting is posted.
  - Students and early career members pay the lowest dues, $20 a year.
  - Ask about a dues grant if cost is a barrier; the site says grants are available.
