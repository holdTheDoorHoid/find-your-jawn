summary: The Delaware Valley chapter of Women in GIS, an international network for women who work with
  maps and location data. The chapter covers Philadelphia, southeastern Pennsylvania, southern New Jersey
  and northern Delaware, and offers networking for its members and other women in the field.
what_you_do: Meet other women who work with maps and location data through the chapter's networking. Some
  network events are for members only, and the wider network also runs mentoring programs.
