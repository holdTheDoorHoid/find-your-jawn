summary: A neighborhood garden project that creates shared spaces for growing, learning and gathering
  in the city. It started with raised beds, flowers, herbs and places to sit.
what_you_do: Sit in the Poetry Parklet, see and touch the plants, and take part in planting days when
  they are announced. You can share ideas through the project's survey, or support the project with donations,
  materials or a partnership.
