first_step:
  how: Come to worship on the first or third Sunday at 10:30 am, entering from 48th Street and going upstairs
    to the Samaritan Room, or join from home using the Zoom link posted on the website.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Worship is open to the public at a set time, with a room and a Zoom option, but the site does
    not describe a welcome for newcomers and the yearly meeting listing has no first-visitor notes.
  what_to_expect: Worship lasts one hour, from 10:30 to 11:30 am, and it is silent, so you can sit and
    listen. The site does not say whether visitors are expected to speak, or whether anyone greets people
    at the door. No cost is listed.
  first_visit_tips:
  - Arrive a few minutes early so you have time for the stairs to the Samaritan Room.
  - If stairs are a problem, join by Zoom, since the listing says the meeting room is not wheelchair accessible.
  - Call 267-405-2302 or email wpfmclerk@gmail.com to ask about access before you go.
