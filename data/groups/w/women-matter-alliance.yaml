summary: A group that supports domestic violence survivors with legal advocacy, social and mental health
  help, and job coaching. It serves survivors of all genders, including LGBTQ+ survivors, and welcomes
  volunteers with skills such as legal advice and social media.
what_you_do: Survivors can ask about the group's legal advocacy, social and mental health services, and
  job coaching. Volunteers bring skills such as legal advice, social media, accounting, or help recruiting
  advisors and board members.
