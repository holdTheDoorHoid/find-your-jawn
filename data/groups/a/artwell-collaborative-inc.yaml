summary: A Philadelphia nonprofit that helps young people make art and poetry. Its work runs through school
  and library programs such as We the Poets, EcoArts and student art shows, and its public workshops,
  family days and poetry and art show are listed on its events page.
what_you_do: Email the program director through the Get Involved page to volunteer in development, design,
  finance or community engagement, go to a public workshop or family day from the events page, or apply
  to the board through the Join the Board page. Schools and groups can request a youth program or pop
  up workshop through a form.
