first_step:
  how: Watch the events page for a public workshop or family day, then go. To volunteer, email the program
    director listed on the Get Involved page.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Public events are listed with dates and times, and the volunteer roles name a contact to write
    to. The event listings do not say whether you must sign up before you attend.
  what_to_expect: Public skill builds have usually run about two hours on a Saturday afternoon, with hands-on
    poetry, art or self-care sessions. Lunch and learn talks run about an hour and are often online. Family
    days run most of the day, and the events page does not say how many people attend.
  first_visit_tips:
  - Open the event's own page for the exact address, since past events were held at the ArtWell office
    on West Oxford Street and at partner venues.
  - For a school or youth group, use the Request a Program form on the site or call 215-220-6253.
  - Ask the program director by email before you come to volunteer for the first time.
