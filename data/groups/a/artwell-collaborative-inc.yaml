summary: A Philadelphia nonprofit that gives young people a place to make art through writing, music,
  poetry, visual arts and performance. Most of its work happens in schools and community groups, and its
  free family days are open to the public.
what_you_do: Volunteer in development, design, finance or community engagement by writing to the contact
  on its Get Involved page, attend a free family day, or come to its poetry and art show. Board members
  can apply through the board form on the site.
