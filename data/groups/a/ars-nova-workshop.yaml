first_step:
  how: Buy a ticket to an upcoming show through the ticket link on the What's On page, or join the mailing
    list first to hear about new dates.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Concerts are sold to anyone through ticket links, and the volunteer form is open to the public.
    The site has no beginner program, so this is about attending shows rather than learning a skill.
  what_to_expect: Most shows are evening concerts at Solar Myth, usually starting at 8 pm. Tickets are
    bought through linked ticketing pages, and some shows sell out, so buy early. Members get early access
    and discounts if you plan to come often.
  first_visit_tips:
  - Plan for an evening start, since most listed shows begin at 8 pm.
  - Buy tickets ahead through the ticket link, since some shows sell out.
  - If you want to help at events, use the online volunteer form; it places you in a pool of volunteers.
