first_step:
  how: Walk in during open hours, or call 215-898-2083 to request a guided tour.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Free and open to the public, with posted hours, talks, and guided tours for all ages that you
    can request by phone. The site names no newcomer program.
  what_to_expect: A visit is a walk through free exhibitions in the historic Frank Furness building, where
    the gallery sits inside the Fisher Fine Arts Library. Talks are led by artists or curators, and tours
    are led by gallery staff, interns, or student guides. Check the posted hours before you come, because
    the site lists two different sets.
  first_visit_tips:
  - Call 215-898-2083 to confirm the hours before you visit.
  - Park in a campus garage. The site names Chestnut 34 at 3335 Chestnut St as the closest option.
  - If you use a wheelchair, enter at the south side at 232 S. 34th Street and call the front desk when
    you arrive.
