summary: A nonprofit that helps women and girls with criminal justice histories find work, housing, and
  health care, and rebuild family life. It runs housing for women coming home from incarceration, job
  training, mentoring, and reentry classes.
what_you_do: Fill out the Volunteer Interest Survey to offer time, or ask for a guest speaker for your
  group. Women who want housing ask for the application packet by phone or email, then send a questionnaire
  and a short letter and complete a virtual interview.
