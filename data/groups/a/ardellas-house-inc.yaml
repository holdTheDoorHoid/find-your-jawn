first_step:
  how: Fill out the Volunteer Interest Survey linked on the site, or call 267-249-3642 to ask how you
    can help.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: 'The volunteer survey is public and easy to find, but the site does not say what happens after
    you send it. The housing route is longer: a questionnaire, a letter and a required virtual interview.'
  what_to_expect: 'The site does not describe a volunteer shift or how long a visit takes. Housing works
    as an application, not a walk in: you request the packet, send it back, and complete a virtual interview
    before any acceptance. Staff review each application for fit, and accepted women may get help planning
    their release if they need it.'
  first_visit_tips:
  - For housing, have your questionnaire and a short letter about your goals ready before you contact
    staff.
  - The site lists two phone numbers, 267-249-3642 on the contact page and 267-228-4169 for requesting
    housing materials. Ask which one fits your question.
