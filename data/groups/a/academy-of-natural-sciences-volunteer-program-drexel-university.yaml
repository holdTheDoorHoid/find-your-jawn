summary: The Academy of Natural Sciences of Drexel University recruits adult and teen volunteers for its
  collections, labs, bird collision monitoring and nature walks. Most roles need a steady weekly schedule
  for at least a year.
what_you_do: Help with specimen collections or lab support, monitor for birds hurt by building collisions
  and transport them, or support nature walks and community science projects.
