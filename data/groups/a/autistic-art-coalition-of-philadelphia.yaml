  what_to_expect: You can work at your own pace, and no art background is needed. The page does not say
    how long a class runs, what supplies are provided, or what each session covers, so call the hotline
    before your first visit.
  first_visit_tips:
  - 'Check the studio hours first: open Monday, Tuesday, Thursday, and Friday, and closed Wednesday and
    Sunday.'
