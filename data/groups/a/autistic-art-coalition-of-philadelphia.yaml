summary: An autistic-led group that runs free art classes, exhibitions, and community events for autistic,
  neurodivergent, and disabled artists in the Delaware Valley.
what_you_do: Take a free art class, show your work in an exhibition, or come to a community event such
  as the Community Paint Day or The Infinity Ball. Ask about volunteer roles through the mailing list.
