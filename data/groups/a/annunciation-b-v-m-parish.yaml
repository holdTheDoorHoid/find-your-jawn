  text: Saturday Mass at 5 pm in English. Sunday Masses at 9 am (Spanish) and 11 am (English). Weekday
    Mass Monday to Friday at 7:30 am in the chapel, with Spanish Mass on Monday and Thursday at 7 pm.
    Spanish-speaking groups meet on several weeknights, and English classes for Spanish speakers meet
    Tuesday and Thursday at 12:30 pm.
