first_step:
  how: Come to a Saturday or Sunday Mass, then email the parish office at annunciation19147@gmail.com
    or call 215-334-0159 to ask about a program.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The adult initiation page says people exploring the Catholic faith can start at any time, and
    it gives an email and phone number to ask. Masses are open and free, but the site does not say how
    a newcomer starts most other programs.
  what_to_expect: Mass is free and you can come in without signing up. The Saturday Mass is in English,
    the Sunday 9 am Mass is in Spanish, and the 11 am Mass is in English. Adults who want to join the
    Catholic Church can start the OCIA program at any time; its sessions meet Wednesday evenings at 7
    pm for about an hour, from September to the Easter Vigil.
  first_visit_tips:
  - Confession is heard Saturdays 4 to 4:45 pm and Thursdays 6 to 6:45 pm, and at other times by appointment
    through the rectory.
  - The parish is on the southeast corner of 10th and Dickinson streets, and the rectory is at 1511 S.
    10th Street.
  - The site does not list ramps, elevators, or parking, so call 215-334-0159 before you come if you need
    access help.
