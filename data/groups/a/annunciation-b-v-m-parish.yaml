summary: A Catholic parish at 10th and Dickinson streets with Masses in English and Spanish, a Hispanic
  ministry and an adult faith formation program. It also runs religious education for children and hosts
  parish events such as a St. Nicholas Italian Festival.
what_you_do: Join a Mass in English or Spanish, sign children up for religious education, take part in
  adult faith formation such as the Lent movie series or a Bible study, or start the adult initiation
  program (OCIA) for people who want to join the Catholic Church. The site also links the FORMED online
  faith library.
