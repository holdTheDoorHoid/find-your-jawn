first_step:
  how: Join the Zoom meeting on the second Wednesday at 7 pm; the link is on the home page. To become
    a member, pay annual dues by PayPal or by check to the P.O. Box, and send your name, phone, email
    and mailing address.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The home page publishes the Zoom link for the monthly meeting and the site lists membership steps,
    but it does not say whether non-members may attend or who may join.
  what_to_expect: The monthly meeting is held on Zoom at 7 pm on the second Wednesday, and the October
    14, 2026 meeting will cover City registered community organization issues. Recent speakers have included
    city council members, a state representative, a city department head, and the arboretum director.
    Dues are paid once a year, from $10 for members 65 and older to $50 for a business.
  first_visit_tips:
  - Open the Zoom link a few minutes early to check your connection
  - Email aaneighbors@mail.com if you are not sure whether guests are welcome
