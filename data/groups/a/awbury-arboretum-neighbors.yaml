summary: Awbury Arboretum Neighbors is a neighbors group for East Germantown, founded in 1974, that sends
  out newsletters and meeting notices and meets online each month to talk over local issues, including
  zoning and development.
what_you_do: Members and neighbors hear from speakers at a monthly Zoom meeting, read the newsletter and
  meeting notices, and talk over zoning, development and neighborhood news.
