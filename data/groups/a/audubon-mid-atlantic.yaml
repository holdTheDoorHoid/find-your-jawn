first_step:
  how: Pick a Philadelphia walk or tour on the events page and register through the link on its listing.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Walks are open to the public with a registration link on each listing, but the page does not
    say whether beginners are welcome or whether walks are drop-in.
  what_to_expect: Walks listed for Philadelphia run about two hours, usually on weekend mornings. The
    page does not say how many people come or what gear to bring, so check the listing before you go.
    Entry to the Discovery Center itself is free.
  first_visit_tips:
  - The Discovery Center is closed on Mondays. Its summer hours run through October 15, and winter hours
    start October 16.
  - A free parking lot sits at the center, and bike racks are at the front walk.
  - The Route 32 bus stop at 33rd and Oxford is about a 4 minute walk away, and the Route 3 stop at 33rd
    and Cecil B. Moore is about 5 minutes.
  - Binoculars, bird guides, and historical information can be borrowed free of charge.
