summary: The Mid-Atlantic office of the National Audubon Society. In Philadelphia it runs the Discovery
  Center in the Strawberry Mansion neighborhood and leads public bird walks and tours in city parks.
what_you_do: Join a public birding walk or tour, borrow the binoculars the Discovery Center lends for
  free, and sign up for event updates.
