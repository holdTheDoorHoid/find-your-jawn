summary: A feminist choir in Philadelphia, founded in 1975, that sings songs on feminist and LGBTQ+ themes.
  It welcomes new singers through auditions and produces two major concerts each year.
what_you_do: Audition to join as a singer, come to one of the two major concerts each year, or volunteer
  during a concert or in another role. You can also give a donation.
