summary: A dance, circus and theater company in Philadelphia. It makes shows, offers free Helpful Hints
  workshops, and runs AlmanAcro, an open acrobatics class on Monday evenings.
what_you_do: Take the open AlmanAcro acrobatics class on Monday evenings, join a free Helpful Hints workshop,
  buy a show ticket, or offer behind the scenes help such as stage management or production work.
