first_step:
  how: Book a session of AlmanAcro through the Book a session link on its page, or fill in the Airtable
    sign-up form on the Almanac site to join a free Helpful Hints workshop.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: AlmanAcro is open to everyone and you book online. The free workshops are open to the public
    with a sign-up form. The class page does not say the class is for beginners.
  what_to_expect: AlmanAcro runs for two hours and starts with a warm-up, then skill practice, partner
    and group work, open training, and a short group creative exercise. It is aimed at performers who
    want to learn bases, flying and tumbling, and at acrobats who want more ease with performing and improvising.
    The Helpful Hints workshops are free sessions that pair older and younger people to build short duets
    together.
  first_visit_tips:
  - Wear clothes you can move in, and bring a water bottle.
  - The AlmanAcro studio is up stairs, so plan ahead if you need step-free access.
  - Confirm the room when you sign up for a Helpful Hints workshop, since the site does not list the room.
