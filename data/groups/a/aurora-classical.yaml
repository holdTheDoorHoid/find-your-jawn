  newcomer_friendliness: 3
  basis: Concerts and the open mic are public. The home page says performers may play any classical piece
    and listeners are welcome, but it does not say beginners are welcome.
  what_to_expect: At the Classical Open Mic Matinee, performers play any classical piece with a pianist
    provided, and people can also come just to listen. The page does not say how long a slot lasts or
    how to book one, so email the group first.
  first_visit_tips:
  - Check the home page for the date and venue before you go.
  - The open mic listed for Oct 17, 2026 is at the Philadelphia Ethical Society, 1906 Rittenhouse Square.
    Venues can change, so check the listing.
  - Email admin@auroraclassical.org with questions about playing or about the grocery bags.
