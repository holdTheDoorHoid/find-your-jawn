first_step:
  how: Sign up for AFSC news and actions on the website, then register for a public event listed on the
    events page.
  drop_in: false
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The events page lists events with sign-up links, but it does not say which are in Philadelphia,
    whether they are online, or what a first event is like.
  what_to_expect: The website does not describe a first visit to the Cherry Street office, and it lists
    no open house or Philadelphia volunteer shift. The weekly Friday Action Hour starts at noon Eastern
    time, and the events list links each event to its own page or a sign-up page. Ask the office at 215-241-7000
    what an event involves and whether it costs anything before you register.
  first_visit_tips:
  - The Action Hour starts at noon Eastern time, which is 9 a.m. Pacific.
  - Ask whether an event is online or in person before you sign up.
  - The office does not list walk-in hours, so call before you come to 1501 Cherry Street.
