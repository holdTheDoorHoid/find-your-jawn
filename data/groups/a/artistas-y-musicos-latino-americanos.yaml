summary: A music group that teaches Latin American and Puerto Rican music to children and adults. Offerings
  include guitar, cuatro, and percussion classes, private and group lessons, an after-school program,
  and a Latin Music Clubhouse.
what_you_do: Book private or group lessons on an instrument, take a class such as youth guitar, Puerto
  Rican cuatro, or Latin percussion, or join the after-school program. After-school classes are free for
  enrolled Esperanza Academy students.
