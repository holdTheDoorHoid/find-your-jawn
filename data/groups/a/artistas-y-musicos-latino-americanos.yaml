first_step:
  how: Fill out the online registration form at amla.org, choosing an instrument, lesson day, and lesson
    length, then book the required 30-minute orientation.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Anyone can register for private or group lessons, including adult beginners, and the 30-minute
    orientation comes before any payment. Youth after-school spots are for enrolled Esperanza Academy
    students, and final group class registration closed October 3, 2026.
  what_to_expect: Expect private or group lessons at the music studios inside Esperanza, usually on Tuesdays
    or Thursdays between 4:30 and 8 pm. Lessons can cover technique, reading music, ear training, and
    performance, in Latin American traditions as well as classical, jazz, and pop. Start with the orientation,
    then pay the registration fee and the first four weeks of lessons.
  first_visit_tips:
  - Use Esperanza's main doors on Bristol Street near 5th Street. The site gives two floor levels for
    the music space, so confirm when you book.
  - Book the orientation before you pay, so you can see what the lessons are like first.
  - Pick your lesson length carefully, since 30, 45, and 60 minute lessons are priced differently.
