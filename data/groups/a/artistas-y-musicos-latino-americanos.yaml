cost:
  level: paid
  text: Private lessons are billed every four weeks for four lessons. 30 minutes is $160 for adults and
    $120 for youth, 45 minutes is $240 and $180, and 60 minutes is $320 and $240. A registration fee is
    also charged, and its amount is not on the page. Automatic payment is preferred, and you can cancel
    with four weeks' notice. After-school programs are free for enrolled Esperanza Academy students.
