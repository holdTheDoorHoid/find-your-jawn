summary: A birding program for people with disabilities, run by the Pennsylvania Center for Adapted Sports.
  Each outing visits a park or nature site in the region, mostly on paved or firm paths, and every outing
  needs its own registration.
what_you_do: Register for an outing, complete the waiver and forms if you are new, then walk the trail
  with the group and look for birds.
