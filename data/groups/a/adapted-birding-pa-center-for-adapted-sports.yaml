first_step:
  how: Fill in the birding sign-up form for an outing on the program page. First-time participants then
    hear from the team about waivers and paperwork.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Any member of the public can register for an outing through a form, and the page explains the
    first-time paperwork. It does not say beginners are welcome, and space is limited.
  what_to_expect: Outings are group walks on park and nature trails, mostly on weekend mornings. Before
    your first outing you sign the waivers and paperwork, and the team contacts you after you register.
    The pages do not list the fee or how long a walk lasts, so ask when you sign up.
  first_visit_tips:
  - Register for each outing on its own, since some park outings need a second sign-up with the partner
    site.
  - Ask where to meet, because some outings send the meeting spot by email after you register.
  - Bring sun protection and bug spray, since some sites have little shade and at least one can be buggy.
  - If you use a manual wheelchair and the trail has steep sections, plan on a helper, as the group advises
    for one site.
