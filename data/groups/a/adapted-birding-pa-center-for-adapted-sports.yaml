summary: A birding program for people with disabilities, run by a nonprofit that serves people with disabilities.
  Guided outings take place on accessible trails across the Philadelphia region, and each walk needs registration.
what_you_do: Register for a guided outing, sign the waiver and forms the first time, then walk an accessible
  trail with a group and look for birds.
