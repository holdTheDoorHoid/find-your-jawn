first_step:
  how: Pick a production from the 2026 to 2027 season list on artcityopera.org and buy a ticket through
    its ticket link.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: Anyone can attend a show, but the site shows no dates or prices, its ticket link is labeled as
    a donation, and it does not explain how to audition or join a workshop.
  what_to_expect: A production is a full staged opera that runs about two hours, according to a festival
    listing for one of the company's shows. The company's own site does not post ticket prices, but that
    listing showed $35 for general admission with pay-what-you-can seats from $10.
  first_visit_tips:
  - The festival listing for one production recommended ages 13 and up and warned about violence, audience
    interaction, and sexual content, so read the listing for the show you pick.
  - Some links on the company's site labeled Donate lead to a ticketing page, so check that you are buying
    a ticket for the show you want.
