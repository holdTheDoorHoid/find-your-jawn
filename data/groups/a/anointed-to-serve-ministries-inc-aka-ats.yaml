first_step:
  how: Send a question through the Questions or Comments form on anointed2serve.org, or email info@anointed2serve.org,
    and ask what help is available for an older adult.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The site lists services and a contact form but no intake steps, fees, or hours, so the way in
    is unclear.
  what_to_expect: Your first step is a message through the contact form or by email. The group describes
    in-home help that comes to the person's home, plus help with paperwork, technology and home repairs.
    The site does not say how long a visit takes, when the office is open, or what other services cost.
  first_visit_tips:
  - The contact form asks for a name and email; a message is optional.
  - The form needs JavaScript turned on in your browser.
  - Ask about fees for services other than in-home support, since the site does not list them.
