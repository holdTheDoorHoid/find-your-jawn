summary: Helps older adults stay safe and independent at home with personal help, connections to services,
  and protection from exploitation.
what_you_do: Older adults and family members can ask about help at home, such as home repairs and utilities,
  technology and online government forms, basic legal and money guidance, and referrals to screened contractors.
  In-home support is free for seniors. The contact form is the way to ask.
