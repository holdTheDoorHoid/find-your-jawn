summary: A student coalition that brings together Asian and Pacific Islander student groups at Penn, speaks
  to the university on their shared interests, and promotes API culture.
what_you_do: Ask the board by email for the time and place of the next general body meeting, which the
  coalition holds every other Tuesday. The site lists events and an annual festival but gives no dates.
  Committee applications open at the start of the spring semester.
