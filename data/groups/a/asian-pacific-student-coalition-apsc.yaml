  newcomer_friendliness: 2
  basis: The site names a meeting schedule but gives no time, place, or joining steps, so a new student
    has to email the board first. The directory listing says events are open to all students.
  what_to_expect: The coalition is run by an executive board and representatives of its member groups,
    and it describes itself as a space for discussion and action. The site does not say how long a meeting
    runs or what a first visit involves, so ask the board what the next general body meeting covers.
  first_visit_tips:
  - Ask the board for the room and start time before you go.
  - Check the coalition's Instagram or Facebook for event posts, since the website lists events without
    dates.
