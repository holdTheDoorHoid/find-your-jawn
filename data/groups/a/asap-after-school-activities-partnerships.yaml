first_step:
  how: Find a club on ASAP's program locator at phillyasap.org/asap-directory/, or email scrabble@phillyasap.org
    to ask about joining.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Youth and parents in Philadelphia are invited to find a club on the locator or to email the program.
    The pages do not say whether a club has open seats.
  what_to_expect: Club members play Scrabble with other students once a week in a school or library, using
    boards and materials ASAP supplies to the site. The league plays matches from November to February,
    and elementary and middle school teams get rides to after school matches. The pages do not say how
    long a club session lasts.
  first_visit_tips:
  - Ask the club leader or site staff when and where the club meets, since ASAP's pages do not list those.
  - Ask whether the club is taking new players this season.
