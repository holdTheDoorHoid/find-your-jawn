summary: The Scrabble program of ASAP, a Philadelphia nonprofit for after-school and summer activities.
  Students play Scrabble each week in school, library and rec center clubs, take part in citywide events,
  and can join a school league that runs from November to February.
what_you_do: Students join a weekly Scrabble club at a school, library or rec center and play in citywide
  events. Students in grades 3 to 12 can compete in pairs, and early readers in grades K to 2 can take
  part in events such as read alouds and Scrabble SLAM.
