schedule:
  text: Open Gallery runs on the second Thursday of each month, 6 to 8 pm. Gallery hours are Tuesday to
    Friday, 10 am to 6 pm. A monthly games and community afternoon (Finjan Fil-Bustan) falls on a Friday
    near the end of the month. Adult and kids Arabic courses run in 10 and 15 week terms.
