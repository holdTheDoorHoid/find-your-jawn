first_step:
  how: If you are new to Arabic, register for Beginner I on the adult courses page, which meets Monday
    and Wednesday evenings on Zoom. To see the work first, come to Open Gallery on a second Thursday.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The adult and kids courses name a beginner level as the starting point and explain how to register.
    A placement test is needed only above Beginner I, and the gallery is open to visitors on second Thursdays.
  what_to_expect: Adult beginner courses meet live on Zoom on Monday and Wednesday evenings from 6 to
    7 pm, for 10 weeks, with about three hours of study outside class for each course. Open Gallery is
    an evening open house from 6 to 8 pm on the second Thursday, and visitors can attend in person. Course
    prices are per term, so check the course page before you sign up.
  first_visit_tips:
  - Set up Zoom and Google Classroom before the first class, since the course uses both.
  - Email arabic@albustanseeds.org to confirm start dates, since the course pages do not list term dates.
  - Plan to buy the textbook separately, and check its price before the course starts, since the page
    does not show it.
  - Plan to arrive early on gallery evenings, which run 6 to 8 pm.
