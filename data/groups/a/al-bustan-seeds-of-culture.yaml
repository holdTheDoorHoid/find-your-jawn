summary: An Arab arts and language group in Philadelphia. It runs after-school art and drumming for students,
  Arabic classes for kids and adults, and gallery shows on the second Thursday of each month.
what_you_do: Take an Arabic class, come to a gallery exhibition, volunteer through the group's volunteer
  page, or join arts programming for students.
