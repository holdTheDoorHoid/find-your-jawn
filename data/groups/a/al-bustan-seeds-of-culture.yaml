summary: A Philadelphia arts and language organization rooted in Arab culture. It offers Arabic classes,
  art and film events, and arts programs for students.
what_you_do: Take an Arabic class (for adults and kids, in person or online), join the monthly Second
  Thursday open gallery, or come to film screenings, workshops (such as Tatreez embroidery and Know Your
  Rights sessions) and talks. Students can join the after-school or in-school arts programs, and adults
  can sign up to volunteer.
