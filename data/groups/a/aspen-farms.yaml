summary: A Philadelphia group that supports community gardens. It keeps a garden map so residents can
  find a garden to join, though many gardens have waiting lists.
what_you_do: Find a community garden on the garden map, open its More Info section for the best contact,
  and ask about a plot. Demand is high and many gardens have waitlists. The site does not describe volunteer
  work days.
