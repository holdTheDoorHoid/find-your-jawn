first_step:
  how: Open the garden map on the site, pick a garden near you, click More Info, and contact the garden's
    listed person about a plot
  drop_in: false
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: The steps are clear and anyone can ask, but the site says many gardens have waiting lists.
  what_to_expect: Each garden lists its own contact person, who is the one to ask about plots, waitlists,
    and fees. The site does not describe a first visit, work days, or plot costs.
  first_visit_tips:
  - Pick two or three gardens from the map, since many have waiting lists.
  - Ask the garden contact about plot fees and any work days before you sign up.
