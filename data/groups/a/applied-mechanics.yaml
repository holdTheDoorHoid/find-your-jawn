summary: A Philadelphia theater company that builds original immersive plays about social change with
  its performers and director. It also teaches workshops for theater makers and runs sessions for teams.
what_you_do: Performers and a director build original plays for live audiences. You can buy tickets to
  a show, take one of the company's workshops, or sign up for the mailing list to hear about new productions.
