first_step:
  how: Buy a ticket to Run Ben Run through the Ticketleap link on the home page, or sign up for the mailing
    list on the Contact page.
  drop_in: false
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Shows are open to the public and tickets are sold online. The workshops page lists classes that
    suit theater people, but it gives no date for the next one and no way to join the company itself.
  what_to_expect: A visit is a live staged play performed by the company's performers and directed by
    its director. The current show is a satire built around the painting American Progress. The pages
    we checked did not give the running time or the price, so confirm both on the ticket page.
  first_visit_tips:
  - Buy tickets ahead on Ticketleap, since the pages we checked do not say whether tickets are sold at
    the door.
  - Read the digital program on the Run Ben Run page before the show. It covers the painting behind the
    play.
  - Email appmechsinfo@gmail.com with access questions, since the site lists no accessibility details.
