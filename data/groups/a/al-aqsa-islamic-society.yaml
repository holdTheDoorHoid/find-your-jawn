summary: A mosque and community center in Kensington with a Youth Club, an Interfaith program and an Outreach
  program. The society has been operating since 1989.
what_you_do: Kids ages 7 to 16 can join the Youth Club for service projects, art and trips. The Outreach
  program works with partners on arts, service and planting projects, including free mural workshops open
  to the public. The Interfaith program has helped host the Interfaith Peacewalk for about 20 years.
