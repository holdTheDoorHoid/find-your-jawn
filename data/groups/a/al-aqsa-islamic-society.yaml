first_step:
  how: Call the mosque at (215) 765-2743 to ask about joining. For the Youth Club, call the youth coordinator
    at (215) 765-0607 and ask about open spots, since spaces are limited.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The free mural workshops are open to the public, and the Youth Club has a named coordinator to
    contact. Youth Club spots are limited, and the site does not describe visitor steps for the other
    programs.
  what_to_expect: For kids, the Youth Club mixes service projects, such as making care packages and visiting
    senior homes, with art and fun activities. Parents are invited to help on trips and service days.
    The Peacewalk provides shuttle buses, so walkers can park and ride to the start.
  first_visit_tips:
  - Parking is available, according to the Outreach page.
  - Call ahead, since the site does not post program times or visiting hours.
