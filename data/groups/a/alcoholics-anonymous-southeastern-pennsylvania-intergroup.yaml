first_step:
  how: Call the 24-hour help line at 215-923-7900, or find a beginners' meeting in the meeting finder
    and go to see what it is like.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 5
  basis: The site runs a beginners' meeting finder and a 12-Step Call that connects newcomers with a local
    member, and newcomers may attend meetings for free without having to share.
  what_to_expect: Newcomers can attend meetings for free and listen without speaking. If you want to share,
    you may tell your own story or read from AA literature, and nothing is required. The site does not
    say how long meetings last or how many people attend.
  first_visit_tips:
  - Check the meeting finder for the address, format and time before you go, since times vary by group.
  - If you would like to talk first, call the help line to speak with a local member.
