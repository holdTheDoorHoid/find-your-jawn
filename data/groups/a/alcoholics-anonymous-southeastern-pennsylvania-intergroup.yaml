summary: The local service office for Alcoholics Anonymous groups in five southeastern Pennsylvania counties,
  Philadelphia included. Volunteer members answer a 24-hour help line and help newcomers find a meeting.
what_you_do: Call the 24-hour help line to talk with a local member, or use the meeting finder to pick
  a meeting. Members can also take service roles, such as committee and 12-step volunteer work.
