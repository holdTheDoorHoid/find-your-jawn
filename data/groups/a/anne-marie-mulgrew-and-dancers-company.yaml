summary: A Philadelphia modern dance company, founded in 1986 by Anne-Marie Mulgrew, that makes experimental
  dance theater mixing dance with music, technology and art. It also teaches a free adult yoga class on
  Tuesday evenings at the Whitman Library.
what_you_do: Join the free adult yoga class on Tuesday evenings at the Whitman Library, or come to one
  of the company's shows, such as the Koresh Artist Showcase.
