first_step:
  how: Sign up for a watering shift at Kern Park through the group's sign-up link, or email info@arcadiacommons.us
    to ask about other volunteering.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The volunteer page invites neighbors to take part and posts a sign-up link. It does not describe
    what a volunteer shift is like.
  what_to_expect: Watering Kern Park is the only task the volunteer page names. The site does not say
    how long a shift runs, what to bring, or whether children can help, so ask before you go. No fee is
    listed for volunteering.
  first_visit_tips:
  - Kern Park is on Kern Street between East Huntingdon and East Sergeant streets.
  - Ask the group what to bring, since the site lists no gear or age rules.
  - Confirm the shift time and place by phone or email, because the sign-up page did not show a readable
    sheet on this visit.
