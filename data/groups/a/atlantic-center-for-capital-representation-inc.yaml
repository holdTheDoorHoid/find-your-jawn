summary: A Philadelphia legal group that fights death sentences and other extreme punishments. It represents
  people directly, brings test cases, and trains lawyers on the same work.
what_you_do: Use the volunteer form on the site to offer help. The center says any skill can help and
  especially needs attorneys for post-conviction appeals and compassionate release cases in Pennsylvania
  prisons. Internships apply by email, and training webinars and donations are also available.
