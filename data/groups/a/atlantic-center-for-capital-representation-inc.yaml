  basis: The site has a public volunteer form, says any skill can help, and describes no application or
    interview for volunteers.
  what_to_expect: The site does not say what a first volunteer task looks like or how much time it takes.
    Its training is mostly online webinars of about 90 minutes for defense professionals, and the volunteer
    work it names is legal help such as post-conviction appeals.
  first_visit_tips:
