first_step:
  how: See Let Freedom Ring at Cherry Street Pier, on view through November 1, 2026, or open a walking
    tour's own event page from the events page for its time, meeting place and cost.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The outdoor artworks are public, and each event has its own page. The events list does not show
    sign up steps, so check each event page to see whether you need to register.
  what_to_expect: Public artworks are outdoors, so a visit is a walk to the site, with the artwork page
    listing Friday to Sunday hours from 2 to 8 pm for Let Freedom Ring. Walking tours, talks and family
    days appear on the events page, and each links to its own page with the details. The events list does
    not say how many people attend.
  first_visit_tips:
  - Open the public art map to find artworks, then open each artwork's own page for its dates and site.
  - Check each event page for the start time and meeting spot, since the events list shows only dates.
