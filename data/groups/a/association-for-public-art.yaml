summary: A Philadelphia organization that runs public art projects, including Art on the Parkway, and
  keeps a public art map and a digital archive of public art from 1872 to 1980.
what_you_do: See public artworks on view outdoors, such as Let Freedom Ring at Cherry Street Pier and
  Franklin Thread in Maja Park, join a walking tour, talk or family day from the events page, or browse
  the public art map and archive. The pages read do not describe class or volunteer roles.
