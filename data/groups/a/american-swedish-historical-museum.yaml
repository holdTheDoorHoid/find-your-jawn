first_step:
  how: Visit during open hours, Tuesday to Sunday, 10 am to 4 pm. To volunteer, email the contact listed
    for the role you want on the volunteer page.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The museum is open to visitors with posted hours and prices, and each volunteer role lists a
    contact to email. The page does not say whether beginners can volunteer, except that the gift shop
    role offers training.
  what_to_expect: A visit means walking through the museum's exhibits on Scandinavian history and culture
    during open hours. Admission is charged except for members, children under 5, and visitors on the
    free second Sunday of the month.
  first_visit_tips:
  - Check the hours first, since the museum is closed on Mondays and on major holidays.
  - Ring the doorbell at the back entrance to be let in.
  - Service dogs are welcome, but emotional support, comfort and therapy dogs are not.
  - Visit on the second Sunday of the month if you want free admission.
