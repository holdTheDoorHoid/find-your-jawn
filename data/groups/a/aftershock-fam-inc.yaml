summary: A nonprofit that runs music and arts workshops for kids, including DJ, beatmaking and music production
  camps, and pairs young people with one-on-one mentors. It also connects artists who want to mentor.
what_you_do: Kids can join the NoChaser Kidz DJ Cafe, a Wednesday workshop in music and art, or ask about
  the summer music camps. Kids who have attended a workshop can be matched with online one-on-one mentoring,
  and artists can join the Creative Network after mentor training.
