  newcomer_friendliness: 3
  basis: Open calls for material and portfolios each say how to send work, and public events list registration
    links, but the site does not describe a newcomer program or a first visit.
  what_to_expect: Most of what the group offers is a call for material or a public screening. If the team
    picks items from a personal collection for a film, it says it will offer an honorarium that you agree
    on first. Outdoor screenings in parks often ask you to register ahead.
  first_visit_tips:
  - Check the events page for the date, place, and whether you need to register
  - Ask about usage and credit before you send your material, since the call does not say
  - Email with questions before you send files so you know what format they want
