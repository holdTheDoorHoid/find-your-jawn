summary: A media arts group in the Philadelphia region that makes collaborative documentaries and runs
  a multimedia hub about arts work by Latinx, BIPOC, and immigrant artists. It also asks the public for
  archive material and works with videographers.
what_you_do: Send photos, videos, or audio of rumbas for the Philly Rumba archive call, or send a portfolio
  if you are a videographer. The events page lists screenings and gatherings, and some of them are free.
