summary: A nonprofit that helps disabled people take part in arts and culture. It offers an ACCESS Card
  that gets $2 admission at partner museums, theaters and gardens, runs free learning pages, and advises
  arts groups on access.
what_you_do: Register for an ACCESS Card to pay $2 admission at partner arts sites, read the free Community
  Learning pages, or sign up for paid accessibility workshops made for arts staff. Arts groups can also
  ask for accessibility training or consulting.
