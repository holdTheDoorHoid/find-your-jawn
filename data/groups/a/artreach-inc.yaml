  newcomer_friendliness: 3
  basis: Anyone who qualifies can get the card through a public online form, and the free learning content
    is open to all. The page does not describe a group or class to try first.
  what_to_expect: 'The ACCESS Card gets $2 admission at partner museums, theaters and gardens. Art-Reach
    is an organization rather than a group that meets, so a first step is usually online: the card form,
    the newsletter, or a free learning page. The page does not say how the card is shown at the door.'
  first_visit_tips:
  - Check art-reach.org for current partner sites before you go, since the site gives different counts
    on different pages.
  - If you qualify through a state ACCESS or EBT card, bring that card with you.
