first_step:
  how: Come to Sunday worship at 10:45 am, then email info@archstreetpres.org to ask about a small group,
    the choir, or family programs.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Worship is public with a Zoom option, and the choir and the Zoom Bible group say everyone is
    welcome and give a way in. The site has no page that spells out a visitor welcome.
  what_to_expect: The pages do not describe a Sunday service, but children are welcome in the 10:45 am
    worship and a nursery is available. The Good Book Club is a Zoom session every Wednesday from 12:10
    to 1 pm, and the choir welcomes anyone who wants to learn, with no audition mentioned. The pages read
    give no cost for worship, groups, or the choir.
  first_visit_tips:
  - Free street parking on the west side of 18th Street, between Arch and Cherry, is for Sundays from
    9 am to 6 pm only, and you need a placard from the sanctuary or the website.
  - The home page links a childcare registration form, so register ahead if you need the nursery.
  - The office is open Monday to Thursday, 8 am to 4 pm, at 215-563-3763. The pages do not cover accessibility,
    so ask there.
  - The directions page recommends SEPTA, including Suburban Station and the City Hall stops, with a short
    walk to the church.
