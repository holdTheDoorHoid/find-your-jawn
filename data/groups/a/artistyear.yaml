  basis: The way in is a formal application that asks for an arts degree or comparable experience, U.S.
    citizenship or legal residency, and passing background checks.
  what_to_expect: A fellow works full time as a teaching artist in a school, teaching standards-based
    arts lessons, leading at least one community arts project a year, and attending required training.
