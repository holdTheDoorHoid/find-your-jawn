first_step:
  how: Check the eligibility rules on the Apply Now page, then submit the online application for the 2026
    to 2027 program year. Most regions are full, and the page names open spots only in Piedmont, SC and
    the Roaring Fork Valley, CO, so check that page for current openings before you apply.
