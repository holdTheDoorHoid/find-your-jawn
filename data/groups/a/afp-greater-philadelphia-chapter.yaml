first_step:
  how: Pick an event on the chapter's events page and use its Register link. If you are not sure a non-member
    can attend, ask through the chapter's contact form first.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Events are listed publicly with registration links, but the pages do not say how a non-member
    signs up or whether a first-time guest is welcome. Membership needs a fundraising role, and joining
    runs through the national association.
  what_to_expect: Coffee talks run from about 8:45 to 10 am at office sites, in the suburbs or in Philadelphia,
    and last about 75 minutes. Virtual workshops run about an hour over Zoom at midday. Evening events
    are held at hotels in Center City. Event prices are not shown, so check the registration page before
    you sign up.
  first_visit_tips:
  - Check the price on the registration page before you sign up, since the pages do not show non-member
    prices.
  - Ask the chapter whether a non-member can attend before you pay for an event.
  - The coffee talks in the suburbs need travel outside the city, so check the venue address when you
    register.
  - Parking and transit are not listed on the event pages, so check the venue before you go.
