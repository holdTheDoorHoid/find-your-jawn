first_step:
  how: Go to the public show WEIRDOFEST at Philadelphia Brewing (the site lists October 17, 2 to 10 pm,
    without the year), or send a question through the contact form about a workshop or the MoveMakers
    camp.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Shows are public and the contact form is open to anyone. The site has no class sign up or membership
    steps, so the way in is to attend a show or ask about a workshop.
  what_to_expect: A show is a blacklight performance that mixes masks, puppetry, storytelling, and music,
    and the company describes its shows as suitable for audiences of all ages. The site does not list
    ticket prices, running times, or seating, so ask before you go. Workshops are booked by request.
  first_visit_tips:
  - Call 610-574-6037 or use the contact form to ask about tickets and timing.
  - The site does not print the year for WEIRDOFEST, so confirm the date before you go.
  - The site says shows are for all ages, but ask about the running time before bringing very young children.
