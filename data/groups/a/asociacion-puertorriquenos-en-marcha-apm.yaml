summary: A Latino-based nonprofit in North Philadelphia that offers health and behavioral health care,
  foster care and adoption, family and children's services, early childhood education, and community and
  economic development.
what_you_do: Call the main office about the program you need, such as early childhood, foster care, or
  behavioral health. Volunteers can fill out an interest form for events such as the Sugar Cane Festival,
  the toy drive, or clean-up days.
