first_step:
  how: Call 267-296-7200 or email info@apmphila.org and ask for the program you need. For early childhood,
    call 267-296-7357 or fill out the online enrollment form.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: There is a public phone line, office address, and interest form, but eligibility rules differ
    by program and are not all posted.
  what_to_expect: 'These are services for clients, so a first step is a phone call or an online form rather
    than a walk-in visit. Eligibility depends on the program: income for Head Start and Pre-K Counts,
    or insurance for mental health and treatment. The volunteer form is an interest form, so expect a
    follow-up call rather than an immediate placement.'
  first_visit_tips:
  - Have household income and insurance details ready when you call
  - Ask which languages staff speak before you visit
  - Expect a follow-up after you fill out the volunteer interest form
