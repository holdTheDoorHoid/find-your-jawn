first_step:
  how: Fill out the volunteer application linked as Apply Now on the volunteer page, then attend the next
    virtual orientation listed on the site.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: A public application and an orientation come before any client match, so the way in is clear
    but not drop in.
  what_to_expect: You start with an online application that asks for your contact details, two emergency
    contacts, and your date of birth, and it asks a yes or no question about criminal history. Orientation
    is a virtual meeting listed on the site, and a client match comes after it. The site does not give
    the length of orientation or a time commitment.
  first_visit_tips:
  - Be 18 or older and out of high school, which the application requires
  - Have two emergency contacts ready, with a name, phone number, and relationship for each
  - Call 215-981-0088 with questions before you apply
