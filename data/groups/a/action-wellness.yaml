summary: Trained volunteers called buddies offer friendship, emotional support and some help with everyday
  tasks to people living with HIV, matched one to one with a client.
what_you_do: Visit or call a matched client on a regular basis, offer companionship, and help with small
  daily tasks. Buddies take part in monthly support meetings with other buddies.
