summary: An outdoor club with about 4,500 local members that runs more than 800 hikes, paddles, bike rides,
  backpacking trips and trail work days a year. Most activities are free and led by trained leaders.
what_you_do: Join a hike, paddle or bike ride led by a trained leader, or volunteer on trail work, conservation
  or shelter watch.
