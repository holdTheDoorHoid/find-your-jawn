first_step:
  how: Pick a trip on the chapter's activities calendar, register through the AMC Outdoors Connector listing,
    and show up. Most trips are free.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Trips are open to the public, mostly free and led by trained leaders, and the 20s and 30s page
    says to register for an event and show up. The chapter pages do not explain trip difficulty or whether
    beginners are welcome.
  what_to_expect: Most trips are free and led by trained, experienced leaders. Trips run around Greater
    Philadelphia, the Lehigh Valley, New Jersey and Delaware, so check each listing for the meeting place.
    Trail crews work on an open basis, so you do not have to attend every session, and you can email the
    Trails Chair to learn about a crew.
  first_visit_tips:
  - The chapter pages do not explain trip difficulty, so read each listing closely before you sign up.
  - Sign up for the weekly email bulletin, which lists the next eight days of trips.
  - For trail work, ask the Trails Chair what to bring, since the page does not list tools or clothing.
  - The chapter's join page presents free hikes as a member benefit, so ask the chapter whether non-members
    can come to a first trip.
