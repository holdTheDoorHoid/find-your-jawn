first_step:
  how: Browse the online calendar, choose a junior program, lesson, or adult class, and register online.
    Contact the team for help, especially if it is your first time.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The site says all levels are welcome, the summer camp takes beginners, and it invites first-timers
    to contact the team for help.
  what_to_expect: Players are grouped by age and skill, from beginners up to competitive juniors. Summer
    camp runs 9 am to 3 pm for full days or 9 am to noon for half days, with lunch provided and optional
    care until 5 pm. Prices are not listed on the pages read, so ask before you book.
  first_visit_tips:
  - Plan on non-marking sneakers and eyewear; the center lists both among the items you can borrow or
    buy.
  - Summer camp drop-off can start at 8:30 am.
  - 30th Street Station is about two blocks away, according to the visit page.
  - Metered street parking is nearby, and the visit page lists garages at 3440 Market Street and 3386
    Chestnut Street.
