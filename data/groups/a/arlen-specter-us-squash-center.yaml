summary: A squash center that runs junior programs, a summer squash camp for players of every skill level,
  lessons, and club events.
what_you_do: Kids and teens can join junior programs, lessons, and the summer squash camp, and adults
  can take lessons too. You can book a court online. The site also lists memberships and venue rentals,
  and it does not list volunteer coach or mentor roles.
