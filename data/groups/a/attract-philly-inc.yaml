summary: A Philadelphia nonprofit for young people that runs mentoring and leadership programs, including
  literacy, mock job interviews, and a scholarship. It also runs service events such as a toy drive and
  a movie night.
what_you_do: Join a signature program such as Born to Lead, Literacy for Leaders, or Queen's Code, take
  part in a service event, or ask about volunteering or an internship.
