first_step:
  how: 'Email attract.philly@gmail.com and ask which program has open registration now: Born to Lead (boys
    ages 10 to 16), Queen''s Code (girls ages 10 to 16), or Literacy for Leaders (Pre-K through fifth
    grade).'
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: The program pages give ages and a 10-week format, but the registration and history dates we found
    are from 2016 and 2019 and no current sign-up dates are posted, so the way in for a young person is
    unclear.
  what_to_expect: Born to Lead and Queen's Code are 10-week mentoring programs for boys and girls ages
    10 to 16. Queen's Code adds information sessions on life skills and service projects. Literacy for
    Leaders is a reading program for children from Pre-K through fifth grade. The site does not say where
    or when sessions meet, or what they cost now, so ask before you plan a visit.
  first_visit_tips:
  - Ask for the meeting place and times before you go, since the program pages do not list them.
  - If you want to volunteer instead, use the volunteer form on the site, which asks for your contact
    details and a position.
