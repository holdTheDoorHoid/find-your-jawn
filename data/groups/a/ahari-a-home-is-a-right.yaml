summary: Helps veterans and their families with housing and support services. It runs a yearly Veteran
  Stand Down, where community volunteers help alongside government agencies and nonprofits.
what_you_do: Volunteer at the Veteran Stand Down, which offers screenings, legal help, meals, and referrals
  to veterans. Veterans who need help can start on the Services page. The group also takes donations and
  sponsorships.
