summary: A group working to make Pennsylvania's fiber and textile trade fairer and more sustainable. It
  connects fiber growers, makers and businesses, runs a book club, and hosts the Philly Fiber Fest.
what_you_do: Join the online book club, come to Philly Fiber Fest to shop, learn and meet makers, volunteer
  on research, admin, events, social media or marketing through a form on the site, or become a member.
