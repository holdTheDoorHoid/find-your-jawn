  newcomer_friendliness: 3
  basis: The book club is open to anyone who fills in its sign-up form, the Fest is open to visitors,
    and there is a mailing list. The site does not say whether one book club session is a fine first step.
  what_to_expect: The book club meets online for about an hour and talks about each pick. The Fest is
    a one day fair with more than 30 vendors, a fiber art show, demonstrations, and optional paid workshops.
    Visitor tickets are not posted yet, so check the Fest page before the day.
  first_visit_tips:
