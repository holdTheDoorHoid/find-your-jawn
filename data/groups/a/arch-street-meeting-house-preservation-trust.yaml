  newcomer_friendliness: 4
  basis: The pantry page says all are welcome to request help and gives a phone, text, and email to start.
    Its requirements line is unclear, so confirm what is needed when you call.
  what_to_expect: A Sunday pantry pickup is a one hour appointment from 1 to 2 pm, booked by phone, text,
    or email. The fridge is open on weekdays from 8 am until dusk, and drop-offs depend on whether the
    meetinghouse grounds are open. Bulk food and household donations are arranged by calling or texting
    the same number.
  first_visit_tips:
  - Book your Sunday pickup ahead of time by phone, text, or email
  - Ask what to bring and whether you need proof of need, since the page does not say
  - Check museum hours before a weekday fridge visit, because drop-offs depend on when the grounds are
    open
  - Call (215) 413-1804 ext. 103 for museum hours
