summary: A Mill Creek-Parkside nonprofit that turns vacant lots into gardens, greenhouses and gathering
  places. It grows food through farming and hydroponics and runs wellness and hands-on STEAM skill building
  for youth, families and seniors.
what_you_do: Join one of the listed sessions, such as a Saturday midday session at the Tiffany Fletcher
  Recreation Center, or email support@anewdawnincorporated.org to ask about the garden and programs. Donations
  are accepted.
