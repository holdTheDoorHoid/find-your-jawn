first_step:
  how: Register for the next monthly meeting on the group's registration page to get the Zoom link, then
    join for the 6 pm social hour or the 6:30 pm talk.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The October 2026 talk is titled Beginning Your Genealogy, the page calls it a free event that
    welcomes visitors, and it links to a registration page. Other monthly talks are not described for
    beginners.
  what_to_expect: Meetings are free and held on Zoom, so you can join from home after you register. A
    social hour starts at 6 pm and the speaker talk starts at 6:30 pm. The October 2026 talk covers genealogy
    tools and techniques, with some attention to Southern and African American records.
  first_visit_tips:
  - Register ahead on the group's site to get the Zoom link.
  - Members-only workshops need a membership; the monthly talk is open to visitors.
  - Joining online is immediate, while a mailed membership form takes 5 to 7 business days.
