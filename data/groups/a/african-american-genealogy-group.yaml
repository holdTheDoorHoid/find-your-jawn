summary: A nonprofit that helps people trace African American family history. It holds free public meetings
  with a speaker most months, and members can also join members-only workshops and interest group meetings.
what_you_do: Come to a free general meeting on the second Tuesday of the month, except July and August.
  The social hour is at 6 pm and the talk starts at 6:30 pm. The meeting is on Zoom, so register on the
  group's site to get the link. Membership is optional and unlocks members-only workshops.
