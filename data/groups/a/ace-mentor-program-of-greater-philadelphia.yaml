summary: A free after-school program that puts Philadelphia-area high school students on teams with architects,
  engineers, and construction professionals. Teams work on mock and real design challenges and attend
  career and professional development sessions.
what_you_do: Students apply online and return a parent consent form. Professionals can register as mentors,
  then complete a background check and training before joining a team.
