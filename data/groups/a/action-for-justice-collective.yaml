first_step:
  how: Fill in the volunteer application at afjcollective.org/become-a-volunteer or email volunteers@afjcollective.org,
    and say which youth program you want to help.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 2
  basis: Volunteers apply, the team reviews the application, and then calls for an interview before any
    work starts. No schedule or sign-up steps for young people are posted.
  what_to_expect: The page says anyone from any background or experience level can apply to volunteer,
    and that the group provides the training volunteers need. Before you start, you apply, the team reviews
    the application, and you are contacted for an interview. The site does not say how long a first shift
    lasts, where volunteers serve, or what a typical week looks like.
  first_visit_tips:
  - Be ready for an interview after you apply, and think about which kind of help you would like to give.
  - Email volunteers@afjcollective.org with questions about where you would serve, since the site does
    not say.
