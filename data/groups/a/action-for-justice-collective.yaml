summary: A youth nonprofit that runs a school-based mentoring program and works with partners on a gaming
  and esports program for youth affected by gun violence. Its site also lists a partner program for young
  women ages 12 to 21.
what_you_do: Young people take part in mentoring at schools, gaming and esports activities, and life skills
  or career exploration. Volunteers sign up through the group's volunteer page.
