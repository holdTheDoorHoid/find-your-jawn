summary: The French cultural center in Philadelphia. It teaches adults French from A1 (beginner) to C1
  (advanced), and it runs French conversation meals and book clubs for adults and teens.
what_you_do: Take a French class at any level from A1 to C1, online or in person, join a French Tables
  meal to practice with native speakers, or come to a book club.
