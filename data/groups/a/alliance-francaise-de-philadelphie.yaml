first_step:
  how: Open the adult classes page, pick a class at your level, and register. If you have studied French
    before, take the short placement test first.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The adult classes page says complete beginners can check the class schedule and register, and
    that the placement test is for people who have studied French or spent time in a French-speaking country.
  what_to_expect: Classes meet once a week for 1.5 to 2 hours, with no more than 8 students, in person
    in Center City or online. A 10-week session costs $375 and must be paid in advance, with materials
    extra. The Alliance also runs French Tables meals where you practice with native speakers.
  first_visit_tips:
  - A refund needs a call to the office more than a day before the first class.
  - Events are held at different venues, so check the event page for the address before you go.
  - Sessions run each season (fall, winter, spring and summer), so pick the term that starts next.
