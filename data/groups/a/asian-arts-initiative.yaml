first_step:
  how: Visit the gallery on a Thursday, Friday or Saturday between 2 and 6 pm, when entry is free. For
    a youth program, use the email or interest form linked from the Get Involved page.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: The gallery is open to walk in visitors during posted hours, and events are sold to the public.
    The youth programs take inquiries by email or an interest form, but the enrollment steps are not spelled
    out.
  what_to_expect: A gallery visit is free and open during posted afternoon hours, with exhibitions to
    walk through. The building is described as mobility accessible, with restrooms on every floor. Performances
    and community nights need a ticket, and seating is set up for programmed events.
  first_visit_tips:
  - Use the map link on the Visit page to plan your route, since the site does not describe the entrance.
  - If you need an accommodation, contact the group in advance using the address on the Visit page.
  - If fragrances bother you, mention it ahead of time, since a fragrance free space is not guaranteed.
