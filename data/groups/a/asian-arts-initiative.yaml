summary: An arts center on Vine Street with a free gallery, exhibitions, performances and community nights.
  It also runs youth arts programs for middle and high school students, and takes volunteer sign ups and
  gallery tour requests through forms on its site.
what_you_do: Visit the free gallery on a Thursday, Friday or Saturday afternoon, buy a ticket to a performance
  or community night, request a gallery tour or volunteer through the forms on the site, or ask about
  the Youth Arts Workshop or the Youth Leadership Initiative.
