first_step:
  how: Call (215) 248-0546 or email info@allenslane.org to ask which fall classes are open, then register
    for one online.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Classes are open to the public with online sign-up, and phone and email are listed for questions.
    The adult class page showed no upcoming classes when it was read, so confirm before you register.
  what_to_expect: Adult and youth classes run in seasonal terms, and sign-up is online. The pages we read
    do not show how many weeks a class runs, the class times, or whether materials are included, so ask
    the center before you register. Kids' classes are listed separately from adult classes.
  first_visit_tips:
  - Ask whether the class you want has openings, since the adult class page showed none when it was read.
  - Ask about scholarships or per-week discounts, since class scholarships are not listed on the pages
    read.
  - Ask whether membership makes sense if you plan to take several classes, since members get tuition
    discounts on workshops.
  - The office is at 601 W Allens Lane and is open Monday to Thursday, 10 am to 5 pm.
