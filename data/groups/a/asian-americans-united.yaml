summary: A Philadelphia nonprofit, founded in 1985, that builds leadership in Asian American communities.
  It runs youth leadership programs, a yearly Mid-Autumn Festival in Chinatown, culture and storytelling
  projects, and civic and immigrant rights work.
what_you_do: Sign up for the volunteer form on the Get Involved page, help run activities at the Mid-Autumn
  Festival, ask by email about its Youth Leadership Development Programs, or join its civic and immigrant
  rights work. Friends can also sign up for the newsletter or give through the site.
