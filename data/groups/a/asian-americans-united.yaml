first_step:
  how: Go to the Mid-Autumn Festival in Chinatown on the date on its festival page (check first, since
    the stage schedule may change), or sign up on the volunteer form linked from the Get Involved page.
  drop_in: true
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: It is a public, family friendly street festival, and the site gives a volunteer form and an email
    address. Youth leadership deadlines and steps are not listed on the pages read.
  what_to_expect: The main stage runs from noon into the evening, and the festival ends with a lantern
    parade. Visitors can make lanterns or try calligraphy and carnival games, watch performances such
    as lion dances and dance groups, and eat from local restaurants. The page describes it as drawing
    thousands of families.
  first_visit_tips:
  - Check the festival page for the latest date and stage times before you go.
  - Plan for most of an afternoon if you want to see the parade at the end.
  - Look up transit or parking separately, since the page does not describe either.
