  basis: The chapter welcomes new athletes with a clear registration step, but the page does not describe
    a beginner session or say whether a first visit can be drop in.
  what_to_expect: Saturday sessions start at 9 am at the fitness center on the fourth floor of Liberty
    Place. The chapter describes its program as athletic activity plus social time, such as a weekly walk
    or ride in the park. Ask the chapter before you come how long a session lasts and whether there is
    a fee.
  first_visit_tips:
  - Email the chapter before you register to ask whether you can try a session first
  - Arrive a few minutes early to find the fourth floor fitness center
  - Wear comfortable clothes and bring water for a walk or ride
  - Tell the chapter ahead of time about any access needs so they can plan with you
