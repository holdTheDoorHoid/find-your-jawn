summary: The Philadelphia chapter of Achilles International, which helps people with disabilities walk,
  run, and race. Members set goals such as a first mile and train with volunteer guide runners.
what_you_do: Come to the Saturday morning session at the fitness center, work toward a goal, and join
  group walks or rides. Volunteers can sign up as guide runners.
