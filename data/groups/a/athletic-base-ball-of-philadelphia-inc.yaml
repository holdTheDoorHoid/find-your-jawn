summary: A nonprofit club that plays and teaches base ball the way it was played in the 1860s. It puts
  on live games and demonstrations for the public, and it welcomes new players and umpires.
what_you_do: Play in period style games, umpire them (the club calls its umpires arbiters), or join as
  a non-playing supporting member who backs the club's mission.
