summary: Free groups for unpaid family members and friends who care for someone with Alzheimer's or another
  dementia. Trained facilitators lead them by phone, video or in person.
what_you_do: Talk through the hard parts of caregiving, get practical tips, and hear from others in a
  similar spot. The chapter also runs early-stage groups for people with a diagnosis, and some groups
  are tailored to younger-onset needs.
