first_step:
  how: Call the 24/7 helpline at 800.272.3900, or use the find a support group search on alz.org, then
    call the group's contact to confirm its next date.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Open to any unpaid caregiver, free to join, with a 24/7 helpline and a group finder. Early-stage
    groups need a diagnosis and a prescreening call first.
  what_to_expect: A trained facilitator leads each group, which can meet by phone, by video, or in person.
    Caregiver groups are for unpaid family members and friends, not paid caregivers. Early-stage groups
    are for people with a doctor's diagnosis and require a prescreening before you join.
  first_visit_tips:
  - Call ahead to confirm the day, time and format, since group details change.
  - Ask about phone or video options if travel is hard.
