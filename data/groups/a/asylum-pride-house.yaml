summary: Helps LGBTQIA+ asylum seekers and immigrants with transitional housing, case help, legal support,
  and donated supplies. Volunteers and supporters can take part through volunteer calls, events, and trainings.
what_you_do: Join the email list for volunteer calls, donate supplies through the group's registry, or
  come to a public event such as the Welcome Walk. Groups can also ask for a speaker or a tabling event.
