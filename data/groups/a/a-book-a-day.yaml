summary: A Philadelphia nonprofit that gives books to children and families. It runs programs in medical
  settings, family events, and a children's writing and illustration program.
what_you_do: Come to an open family event, such as Children's Day or the Freedom to Learn fundraiser,
  or see an exhibit at The Study. The site does not describe how to volunteer, though it mentions past
  service days. Kids can enter the Philly Writers contests, but none was open when this was checked.
