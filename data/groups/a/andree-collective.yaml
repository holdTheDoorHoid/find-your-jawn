summary: A Philadelphia nonprofit that uses weddings and celebrations to offer jobs and counseling referrals
  to women who survived intimate partner violence or human trafficking. Supporters can give monthly or
  attend its annual gala.
what_you_do: Buy a ticket to the Celebrations for Freedom Gala, join the monthly Party 29 giving program,
  or apply through the group's Opportunities page for its board, its Emerging Leaders Council (ages 18
  to 35), or an unpaid part time marketing internship.
