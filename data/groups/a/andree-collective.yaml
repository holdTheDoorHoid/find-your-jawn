first_step:
  how: Buy a ticket to the 2026 gala through the group's ticket page, or use the I'm Interested button
    on the Opportunities page to ask about a board or council seat.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Anyone can buy a gala ticket, and board and council roles have a clear interest button. The pages
    do not describe what a first board meeting or council event is like.
  what_to_expect: The 2026 gala is a gala and silent auction at The Arts Ballroom, 1324 Locust Street,
    with thanks to its sponsors. The page gives no start time, no program details, and no list of who
    attends, and it shows photos from the 2025 event. Board members meet about six times a year, including
    a retreat, and are asked to make a personal gift.
  first_visit_tips:
  - Early-bird gala pricing ends October 8, so buy before prices rise.
  - The gala page has no accessibility details, so contact the group about wheelchair access, quiet space,
    or ASL before you go.
  - The board and council use the same I'm Interested button, and no deadline is listed.
