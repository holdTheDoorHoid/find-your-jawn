first_step:
  how: Call the front desk at (215) 748-8800, or visit the office at 5901 Market Street, Suite 410 Monday
    to Thursday, and ask how to volunteer for mentoring, workshops, tax help, or home preparation.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: The volunteer page lists several kinds of roles and three ways to start (call, email, or visit),
    but it names no application, time commitment, or screening step.
  what_to_expect: Volunteering here is mostly skills and mentoring work, such as helping parents with
    job and money goals, leading a workshop on budgeting or parenting, or helping with tax returns and
    resume reviews. Some volunteers help prepare a home for a family, which can mean cleaning, painting,
    or small repairs. Community events are on hold for now, so ask which roles are open.
  first_visit_tips:
  - Call ahead on a weekday, since in-person hours are Monday to Thursday.
  - Ask which volunteer roles are open now, because community events are on hold.
  - Friday is a virtual day, so plan any in-person visit for Monday to Thursday.
