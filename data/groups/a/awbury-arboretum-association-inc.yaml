first_step:
  how: Register for an upcoming work day on the Philadelphia Orchard Project events page with the Register
    Now button, or email volunteer@awbury.org to ask about other ways to help.
  drop_in: false
  sign_up_needed: null
  newcomer_friendliness: 4
  basis: The Philadelphia Orchard Project listing says volunteers of all ages and skill levels are welcome
    at planting and orchard care events, and that registering gets you directions.
  what_to_expect: A work day is a morning session, such as 9 am to noon, spent helping care for the food
    forest. The listing does not say what tools or clothing to bring, who leads the day, or whether children
    may come, so ask when you register.
  first_visit_tips:
  - Register first. RSVPing is how you get the detailed directions and updates.
  - The food forest is at 6336 Ardleigh St, a different address from the Awbury office on One Awbury Road.
  - One Awbury page shows a volunteer phone number that differs by one digit from the main number, so
    email volunteer@awbury.org first if you are unsure which to call.
