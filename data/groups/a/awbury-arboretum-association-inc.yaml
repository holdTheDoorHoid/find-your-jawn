summary: A nature sanctuary in Germantown, once the home of a Quaker family. The grounds are free to visit
  every day, and the group runs walks, children's camps, a farm and an art gallery.
what_you_do: Walk the grounds for free with a self-guided map, join a guided walk such as the Buckeye
  Harvest forage walk on October 10, 2026, or sign up a child for a camp such as School Day Off Camp.
  The site also links a volunteer page and a membership page.
