summary: A youth soccer and fitness program in North Philadelphia that serves low-income kids. Camps,
  practices, and weekly community service trips are the main activities, and volunteers help with rides,
  gear, and snacks.
what_you_do: Kids take part in soccer camps and practices. Volunteers chaperone trips and collect equipment
  and donations. Coaches and trainers help out at camps and practices on a volunteer basis.
