first_step:
  how: On the regular courses page, click Enroll on a 101 course, the beginner level. If you are new and
    want a higher level, take the placement test first.
  drop_in: null
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The courses start at a beginner level (101) with a plain enroll button, and the conversation
    classes include a beginner class that starts October 14, 2026.
  what_to_expect: Regular courses run 12 weeks with one 90-minute class a week, in person or online, and
    a course will not start with fewer than 4 students. Conversation classes meet for an hour a week for
    12 weeks at beginner, pre-intermediate, intermediate and advanced levels. New students take a placement
    test first.
  first_visit_tips:
  - Books for levels 101 to 203 are pickup only at the school.
  - New students who want a level above 101 must take the placement test, and its fee comes off tuition.
  - Class recording is not allowed.
  - Call 215-735-3250 or email the front desk to choose a level before you enroll.
