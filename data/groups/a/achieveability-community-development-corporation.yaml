summary: A West Philadelphia nonprofit that works to lift families out of poverty through education, affordable
  housing, and support services. It runs family programs and invites volunteers.
what_you_do: Volunteer for office support, skills workshops, tax help, resume feedback, house makeovers,
  block cleanups or donation drives. You can also ask about its family programs, such as the Family Self-Sufficiency
  Program, which has strict eligibility rules.
