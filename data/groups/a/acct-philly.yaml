first_step:
  how: Complete the online orientation and quiz on the Become a Volunteer page, then fill out the volunteer
    application. Approval can take up to a week.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Clear public steps are posted and the site says how to apply, but volunteers need an online orientation,
    a quiz, and an approved application before the first shift.
  what_to_expect: Shelter volunteers take an online orientation first, then are approved for a role such
    as cat socialization, dog walking, or photographing animals. Individual volunteers get specialized
    training before they handle animals, and shelter volunteers commit at least 3 hours a month. Groups
    and corporate teams do not handle dogs or cats, and corporate sessions run about 2 to 3 hours with
    a shelter tour.
  first_visit_tips:
  - Finish the online orientation and quiz before you come in
  - Park in the small lot outside the animal adoption center, closest to the entrance
  - Plan a visit between 10 am and 6 pm, when the lobby is open
