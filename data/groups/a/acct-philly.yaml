summary: The city's open intake animal shelter on Hunting Park Avenue. Volunteers walk dogs, help at adoption
  events, and care for cats at adoption centers, and people can foster animals until they are adopted.
what_you_do: Walk dogs or care for cats at the shelter, help at adoption events, staff the in-store adoption
  centers, bring a group for a laundry or food pantry project, or foster an animal.
