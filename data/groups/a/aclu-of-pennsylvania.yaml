first_step:
  how: Use the sign up link on the ACLU of Pennsylvania volunteer page, which opens an outside volunteer
    form, or email info@aclupa.org to ask about the Greater Philadelphia chapter.
  drop_in: false
  sign_up_needed: null
  newcomer_friendliness: 3
  basis: Volunteer and chapter sign up is open to people across the state, with a form and a chapter email,
    but the site gives no detail on a first step or an orientation.
  what_to_expect: 'The site lists four kinds of volunteer work: community outreach, direct action, lobbying
    elected officials, and behind the scenes support. It does not say how much time that takes, so ask
    the chapter what a typical month looks like before you sign up.'
  first_visit_tips:
  - Sign up for the newsletter to hear about local events
  - Email info@aclupa.org with the county you live in to ask about the Greater Philadelphia chapter, which
    covers Bucks, Chester, Delaware, Montgomery, and Philadelphia counties
  - Ask about the next chapter event and whether a first timer can join it
