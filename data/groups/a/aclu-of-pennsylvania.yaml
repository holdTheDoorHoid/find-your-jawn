summary: The state chapter of the American Civil Liberties Union. It works on free speech, voting rights,
  immigrants' rights, LGBTQ equality, and fair treatment in the justice system, and it has volunteer and
  local chapter roles.
what_you_do: Sign up to volunteer through the group's form, join the Greater Philadelphia chapter, or
  sign up for the newsletter to hear about events and ways to take action. Volunteers can help with community
  outreach, direct action, lobbying elected officials, and behind the scenes support.
