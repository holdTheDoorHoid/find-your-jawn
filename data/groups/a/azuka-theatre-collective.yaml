first_step:
  how: Reserve a Pay What You Decide seat online or by phone for the next production, then pay the amount
    you choose after the show.
  drop_in: false
  sign_up_needed: true
  newcomer_friendliness: 3
  basis: Anyone can reserve a flexible-price seat with an email confirmation, and the New Play program
    takes work from emerging Philadelphia writers. The page does not say how a first visit works.
  what_to_expect: Shows are at The Theaters at The Drake on South Hicks Street. For Pay What You Decide,
    you reserve a seat in advance at no cost, check in at the box office under your name, and pay after
    the show by cash, check, card, or Venmo. Unclaimed seats are released 15 minutes before each performance,
    so arrive early.
  first_visit_tips:
  - Check the production page to see which theater door to use, since both theaters are on Hicks Street.
  - Reserve early, because unclaimed seats are released 15 minutes before the show.
  - Take the B Line to Walnut-Locust, about 2 blocks away, or check the directions page for bus and trolley
    stops.
  - Pay after the show using the envelope basket or the box office.
