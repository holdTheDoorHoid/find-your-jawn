summary: A Philadelphia theater company that stages productions and develops new plays with writers. Its
  New Play Development program offers readings, events, and a way to submit scripts.
what_you_do: See a production and pay what you decide afterward, come to a New Play event when one is
  listed, or send a script through the online New Play Development form. The site does not describe classes,
  usher volunteering, or open rehearsals, so ask the company.
