summary: The city's adult education program, run with community partners. It trains volunteer tutors to
  help adults build reading, writing, math, computer, and English skills.
what_you_do: Tutors work one-on-one with a learner or serve as classroom aides in reading, writing, math,
  basic computer skills, or English. Tutors take a free training before they are matched with a learner.
