cost:
  level: low
  text: Many festival events are free, and some free events need an RSVP. Ticketed events are $26 standard,
    or $13 for students, children, seniors, and arts and industry workers, and $2 for EBT card holders.
    All ticket sales are final, and cancelled shows get full refunds.
