first_step:
  how: Sign up for the newsletter at artphilly.org and follow the group's Instagram, then pick a project
    from the next festival's list when it posts.
  drop_in: null
  sign_up_needed: null
  newcomer_friendliness: 2
  basis: Festival events are open to the public and tickets are sold online, but the site shows no class,
    membership, or volunteer path, and no festival is running now, so the newsletter is the only way in.
  what_to_expect: A visit is one festival project, which can range from theater and music to dinners and
    events in parks, museums, and theaters. Standard tickets are $26, and some events are free. Each project
    lists its own venue and time, so check the project page before you go.
  first_visit_tips:
  - All ticket sales are final, so check the date and venue before you buy.
  - Door sales are first come, first served, and some shows sell out, so buy ahead if you can.
  - Write to info@artphilly.org about date changes, since changes are not guaranteed.
