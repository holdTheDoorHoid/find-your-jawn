  basis: The site has an email contact and lists its programs, but it shows no dated events, sign-up steps,
    or places, so the way in is unclear.
  what_to_expect: The site is mostly education pages on learning disabilities, dyslexia, and special education,
    written for families and teachers. It does not say how a talk or training session runs, how long it
    lasts, who attends, or what it costs. Ask by email before you plan to come.
  first_visit_tips:
  - Ask whether a talk is in person or online.
  - Ask about cost and registration in your first email, since the site lists neither.
