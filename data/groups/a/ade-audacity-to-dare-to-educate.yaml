summary: Works for fairer special education for children from groups that are often left out. It helps
  families see learning differences and neurodiversity in a more positive light, and it offers reading
  help and training for schools.
what_you_do: Email the founder to ask about talks, training, or the L.A.B. reading program, or book reading
  help through the scheduling link on the Programming page. The F.R.E.E. and F.A.R.M. programs have not
  started yet.
