first_step:
  how: Pick a program on the Participate page, then register on its event page. For programs set up by
    arrangement, email info@artzphilly.org.
  drop_in: true
  sign_up_needed: true
  newcomer_friendliness: 4
  basis: The FAQ says you can join one program at a time and drop in or out, and the site explains how
    to start and welcomes people who are new. Event listings still say registration is required, so register
    ahead.
  what_to_expect: Most programs last about an hour. Groups are small, about 6 to 8 people online and 15
    to 16 in person, led by a trained facilitator, and the talk is mostly conversation, sometimes with
    hands-on art or music making. You can take part as much or as little as you like.
  first_visit_tips:
  - Register on the event page first, because the event listings ask for it.
  - Check whether the session is online (Zoom) or in person, since in-person event pages give the venue
    address and transit notes.
  - Note any needs on the questionnaire that new participants fill in, or email info@artzphilly.org.
  - Ask whether masks are recommended before an indoor session, since the FAQ's mask advice may be out
    of date.
