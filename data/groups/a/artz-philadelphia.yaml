summary: A nonprofit that brings arts programs to people living with dementia and their care partners.
  Programs include museum conversations, music and art sessions, and caregiver cafes, held online and
  in person.
what_you_do: Join a program as a person living with dementia or as a care partner, or go to a public event
  such as an ARTZ at The Museum visit. Volunteers help with phone reminders, tech support calls, blog
  posts, event help and kit assembly after a training session, and the organization also has a board you
  can join.
