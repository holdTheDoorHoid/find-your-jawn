summary: A Quaker meeting in Old City where people sit together in silent worship on Sunday mornings,
  in person or on Zoom. Families can use a children's program during the school year.
what_you_do: Join Sunday worship, the monthly adult education series, or the Wednesday evening worship
  on Zoom. Greeters welcome newcomers on Sundays, and refreshments follow worship. Ask the office how
  to get involved in the meeting's committee and outreach work.
