summary: A Quaker meeting in Old City where people sit together in silent worship on Sunday mornings and
  on Wednesday evenings on Zoom. Families can use a children's program during the school year.
what_you_do: Join Sunday worship in person, the Wednesday evening worship on Zoom, or the adult education
  series on fourth Sundays. Greeters welcome newcomers on Sundays, and refreshments follow worship. Ask
  the office how to get involved in committee and outreach work.
