first_step:
  how: Come to Sunday worship at 10:30 am, where a greeter will meet you. Children from Pre-K through
    8th grade can join the Children's Meeting on the first to third Sundays.
  drop_in: true
  sign_up_needed: false
  newcomer_friendliness: 4
  basis: The site has a Newcomer Resources page, greeters meet visitors on Sundays, and visitors are invited
    to attend. It has no orientation or first-timers event on the pages read.
  what_to_expect: Sunday worship lasts an hour, from 10:30 to 11:30 am, and it is held in silence with
    no leader or planned program, though someone may speak. A greeter meets you, the hour ends with a
    handshake, and a social time with refreshments follows. On the first to third Sundays, children can
    join the free Children's Meeting, and younger children can use free childcare during worship.
  first_visit_tips:
  - Free, limited parking is on site during worship. The lot entrance is on 4th Street, halfway down the
    block from Arch Street.
  - Check septa.org for current transit routes, since the pages do not name a stop.
  - The website suggests watching an introductory video about Quakerism before a first visit.
  - The Wednesday Zoom link is in the weekly bulletin and the calendar, not on the pages read.
