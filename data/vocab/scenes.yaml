# The quiz's picture cards (docs/DESIGN.md section 2.2, questions 1 and 2).
#
# Read by: the quiz (shows the cards, shuffled), the matching engine (turns picks into interest,
# role and format signals), the simulation that tests the quiz, and whoever finds the pictures.
#
# Three sets:
#   saturday_scenes  the twelve "Pick the Saturday mornings that sound good" cards (question 1)
#   extra_scenes     eight more, shown when the first picks are few or mixed
#   moments          ten "When did you last lose track of time?" cards (question 2)
#
# Each card:
#   id            stable, snake_case
#   text          one short, concrete sentence, plain words, readable by someone learning English
#   icon          one emoji, used until pictures exist
#   interests     tag ids from interests.yaml with a weight from 0 to 1 (1 is the heart of the scene)
#   roles         role ids from roles.yaml, strongest first
#   formats       format ids from formats.yaml, strongest first
#   picture       null until we have a photo or drawing (piloted both with and without pictures)
#   picture_credit  null until we have a picture; then the credit line to show
#   picture_brief a short note for whoever finds or draws the picture
# Between them the cards cover every interest family except the support flow, every role and every
# format (checked by pipeline/tests/test_vocab.py: a family counts as covered when a card gives one
# of its tags a weight of 0.5 or more).

version: 1

