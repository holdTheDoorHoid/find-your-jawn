# Interest families and tags for Find Your Jawn.
#
# A family is a tile in the quiz ("What are you into?"). A tag is one specific interest under a
# family. Groups carry families in `categories` and tags in `interests` (docs/DATA_MODEL.md).
#
# Rules for editing this file:
# - Family ids (kebab-case) and tag ids (snake_case) are stable forever once committed. Change a
#   label freely; never change an id. To retire a tag, leave it here and stop using it.
# - `aka` lists words a research agent might write. The importer maps them to the tag.
# - `edges` is the adjacency graph behind "one step sideways" stretches (docs/DESIGN.md section 4).
#   Edge types: same_skill, same_crowd, same_place, same_cause, same_topic.
# - The family `support-recovery` has `support_only: true`. It is used only by the separate support
#   flow. It is never shown in the quiz tiles and never offered as a stretch.

version: 1

