# The five ways in: five different ways to take part in the same interest.
#
# Read by: the matching engine (the "same thing, new way in" stretch keeps the interest and changes
# the way in, DESIGN section 4), the interest pages, and research agents (each group lists the ways
# in it offers in plain words under what_you_do).
#
# `ways` defines the five. `by_family` gives, for every interest family, example tags and a plain
# sentence for each way in. The tags are ids from interests.yaml. The sentences are what a visitor
# sees when the site explains a stretch, so they are written for people.
# The support recovery family is used only by the separate support flow and is never a stretch.

version: 1

ways:
  - id: do_it
    icon: "🙌"
    label: "Do it"
    description: "Take part as a regular member, player or participant."
  - id: learn_it
    icon: "🎓"
    label: "Learn it"
    description: "Take a class, a beginner night or a workshop and build the skill."
  - id: teach_it
    icon: "🧑‍🏫"
    label: "Teach it"
    description: "Share what you know. Coach, lead a session or mentor a beginner."
  - id: serve_it
    icon: "🤲"
    label: "Serve it"
    description: "Help from the side. Set up, sort, cook, drive or care for the place or the people."
  - id: lead_it
    icon: "🧭"
    label: "Lead it"
    description: "Take a bigger role. Organize, chair a committee, captain a team or run a project."

