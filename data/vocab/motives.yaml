# The six reasons people give for joining and volunteering (the Volunteer Functions Inventory).
#
# Read by: the quiz (question 5, "Which reason is MOST like you, and which is LEAST?"), the matching
# engine (motive score), and the research agents (each group lists the motives it serves well).
# The ids are fixed. The labels are the plain words the quiz shows. There are no wrong reasons:
# building a resume, needing hours or getting out of the house are all good reasons.
# `vfi` is the name used in the research papers, for people who want to look it up.

version: 1

motives:
  - id: values
    vfi: Values
    label: "Do something that matters"
    description: "You want to help people, animals, a place or a cause you care about."
    group_offers: "Work that clearly helps someone or something, and a cause you can name."

  - id: understanding
    vfi: Understanding
    label: "Learn something"
    description: "You want to learn new things and try out what you know."
    group_offers: "Classes, practice, new places and people who like to teach."

  - id: social
    vfi: Social
    label: "Meet people"
    description: "You want to spend time with other people and make friends."
    group_offers: "Regular meetings, shared meals or games, and a friendly crowd."

  - id: career
    vfi: Career
    label: "Build skills for work"
    description: "You want skills, experience or contacts that help with a job or school."
    group_offers: "Real tasks for a resume, training, references or a signed hours form."

  - id: protective
    vfi: Protective
    label: "Get out of my head and feel better"
    description: "You want a break from stress or worry, and a way to feel lighter."
    group_offers: "A calm, active or absorbing routine, time outside, or good company."

  - id: enhancement
    vfi: Enhancement
    label: "Feel good about myself"
    description: "You want to grow, feel proud and know you are making progress."
    group_offers: "Goals you can reach, thanks from others and progress you can see."
