# Philadelphia neighborhoods, planning districts, regions and ZIP codes.
#
# Read by: the importer (checks every `neighborhood` on a group location), the build (adds
# `planning_district` to each location, from the neighborhood or else from the ZIP), the coverage
# estimates (slices by planning district and region), "Your neighborhood" and the neighborhood
# sweep research agents (one agent per planning district).
#
# Sources and how this file was made (2026-10-08):
#   neighborhoods  OpenDataPhilly "Philadelphia Neighborhoods" (159 areas), Creative Commons
#                  Attribution 4.0, attribute to Abaca Labs (the set Azavea first published).
#                  https://github.com/opendataphilly/odp-data-storage/tree/master/philadelphia-neighborhoods
#   districts      City of Philadelphia "Planning Districts" layer. All 18 names match the City's.
#   zips           City of Philadelphia "Zipcodes_Poly" layer (48 ZIPs with an area on the map).
#   Each neighborhood and ZIP was assigned to the planning district it overlaps most (map overlap
#   computed once with shapely, not at build time). `also_in` lists any other district that holds
#   at least a fifth of the area. For ZIPs, parks, the airport and industrial land were left out of
#   the count, so the district shown is where people live.
#   The six regions are our own grouping of the 18 districts, for coverage slices. Two calls are
#   judgment: River Wards (Fishtown, Kensington, Port Richmond) sits in North, and North Delaware
#   (Tacony, Holmesburg, Mayfair) sits in Northeast. Change them in one place, the district rows.
#   ZIP codes that exist only for PO boxes or single buildings (19160 to 19199) have no area and
#   are not placed here. A group with one of those uses its street address instead.
#
# `residential: false` marks areas where almost nobody lives (the airport, the Navy Yard, large
# parks, industrial land). Groups can still be located there.
#
# Group files use the neighborhood `id` in `locations[].neighborhood`.
# Ids are stable forever. `aliases` maps names people use for an area that is split into several
# neighborhoods here (Kensington, Germantown), so the importer can place a group written up under
# the broader name, and flag it for a person to choose.

