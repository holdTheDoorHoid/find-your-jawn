# The six roles: what you actually do at a group. A compact version of the Holland interest types.
#
# Read by: the quiz (scenes and moments each point to roles), the matching engine (role and format
# score), and the research agents (each group lists the roles it offers).
# The `holland` field names the Holland type each role echoes. Do not show it to visitors:
# the quiz never gives personality labels (DESIGN section 2.1, rule 12).

version: 1

roles:
  - id: hands_on
    icon: "🔨"
    label: "Hands on"
    description: "You build, fix, grow, move or care for things with your hands and body."
    holland: Realistic

  - id: figure_out
    icon: "🔍"
    label: "Figure things out"
    description: "You solve problems, study how things work and learn the why."
    holland: Investigative

  - id: create
    icon: "🎨"
    label: "Create"
    description: "You make, perform or design something new, in your own style."
    holland: Artistic

  - id: help_teach
    icon: "🤲"
    label: "Help and teach"
    description: "You listen, help, coach or teach other people."
    holland: Social

  - id: lead
    icon: "📣"
    label: "Lead"
    description: "You take charge, speak up, make decisions and get others moving."
    holland: Enterprising

  - id: organize
    icon: "🗂️"
    label: "Organize"
    description: "You plan, keep track of details and make sure things run smoothly."
    holland: Conventional
