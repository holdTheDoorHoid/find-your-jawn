# Who is at a group and who it is for.
#
# Read by: research agents (fill `crowd`, `audience.community`, `audience.faith`, `audience.open_to`
# and `access.languages` from these lists), the importer (checks every value), the quiz (question 6
# "Who would you like to meet?", the faith and language screens) and the matching engine.
#
# Sections:
#   crowd       who is usually in the room (a group lists one or more)
#   open_to     who may join (a group lists exactly one)
#   community   affinity groups, for people who want to find their own community. Private to the
#               visitor: the quiz keeps these answers in the browser and never sends them anywhere.
#   heritage    specific heritages, written in a group file as `heritage:<id>`, for example
#               `heritage:irish`. The list is a start, not a limit: the importer accepts any new
#               snake_case id after `heritage:` and flags it for review.
#   languages   written in a group file as `language:<code>` under `audience.community` when the
#               group is for speakers of that language, and as the bare code (for example `es`)
#               in `access.languages` when the group offers service in that language.
#   faith       faith traditions, the `audience.faith` field. A group names at most one.

version: 1

crowd:
  - {id: all_ages, label: "All ages", ages: [0, 99], description: "Children, adults and older adults are all welcome in the room."}
  - {id: all_adults, label: "Adults of any age", ages: [18, 99], description: "Grown ups of every age."}
  - {id: families, label: "Families with children", ages: [0, 99], description: "Parents and kids come together."}
  - {id: kids, label: "Kids", ages: [5, 12], description: "Mostly children in elementary school."}
  - {id: teens, label: "Teens", ages: [13, 18], description: "Mostly young people in middle and high school."}
  - {id: young_adults, label: "Young adults", ages: [18, 35], description: "Mostly people in their late teens, twenties and early thirties."}
  - {id: seniors, label: "Older adults", ages: [55, 99], description: "Mostly people 55 and older."}
  - {id: students, label: "Students", ages: [17, 30], description: "Mostly college and graduate students."}
  - {id: professionals, label: "Working professionals", ages: [22, 65], description: "Mostly people with jobs in the same field or from nearby offices."}
  - {id: neighbors, label: "Neighbors", ages: [18, 99], description: "People who live near each other, of many ages."}
  - {id: newcomers, label: "People new to Philly or new to the country", ages: [18, 99], description: "Many members are new to the city, or the group goes out of its way to welcome them."}

open_to:
  - {id: public, label: "Open to the public", description: "Anyone who meets the age rule can join."}
