  - {id: members, label: "Members only", description: "You must be a member, and membership may have its own rules or dues."}
  - {id: parents, label: "Parents and caregivers", description: "Meant for parents or guardians of children."}
  - {id: residents, label: "People who live in the area", description: "Meant for residents of one neighborhood or building."}
  - {id: invite, label: "By invitation", description: "A member has to invite you."}

