- id: irs_bmf
  name: IRS Exempt Organizations Business Master File, Pennsylvania extract
  owner: Internal Revenue Service, SOI Division
  url: https://www.irs.gov/pub/irs-soi/eo_pa.csv
  access: csv
  terms: Public IRS data, free to reuse
  attribution: "Data: IRS Exempt Organizations Business Master File"
  lead_only: false
  refresh: monthly
  harvester: pipeline/fyj/harvest/irs_bmf.py
  notes: >
    9,664 Philadelphia (ZIP starting 191) records out of 81,852 statewide, kept unfiltered per
    the task brief; triage is a later step. Per IRS Publication 5926 (the extract's own dataset
    guide), this file only ever carries EO status code 01 (unconditional exemption), 02
    (conditional exemption, no longer issued) or 25 (terminating private foundation status under
    507(b)(1)(B)); revoked organizations are excluded from the file entirely. That corrects an
    assumption in docs/research/scouting/structured-sources.md, which guessed the STATUS field
    tracks revocations; see research/harvest/2026-10-04-official.md.

- id: irs_990n
  name: IRS Form 990-N e-Postcard bulk file (NCCS mirror)
  owner: Internal Revenue Service, mirrored by the Urban Institute's National Center for Charitable Statistics
  url: https://nccsdata.s3.us-east-1.amazonaws.com/raw/e-postcard/<YYYY>-<MM>-E-POSTCARD.csv
  access: csv
  terms: Public IRS data, free to reuse
  attribution: "Data: IRS Form 990-N e-Postcard, via NCCS"
  lead_only: false
  refresh: monthly
  harvester: pipeline/fyj/harvest/irs_990n.py
  notes: >
    The IRS's own bulk download page blocks automated fetches (Akamai bot protection); we use the
    NCCS mirror instead. Newest available month is found by HEAD probing backward from the
    current month (2026-08 and 2026-09 both 403 as of this harvest; 2026-07 is the newest file
    that exists). Only source that reaches organizations too small to file a real 990.

- id: penn_clubs
  name: Penn Clubs (Penn Labs student directory, University of Pennsylvania)
  owner: Penn Labs (student organization), data about University of Pennsylvania student clubs
  url: https://pennclubs.com/api/clubs/?format=json
  access: json_api
  terms: No published terms; public unauthenticated endpoint, treated politely, no robots.txt present
  attribution: "Data: Penn Clubs (pennclubs.com)"
  lead_only: false
  refresh: monthly
  harvester: pipeline/fyj/harvest/penn_clubs.py
  notes: 479 active clubs. No field states whether a club accepts non-Penn members, so open_to_public_hint is left null throughout rather than guessed from accepting_members, which is about new Penn members, not the public.

- id: engage_drexel
  name: DragonLink, Drexel University student organizations (Campus Labs Engage)
  owner: Drexel University, student organizations on the Campus Labs Engage platform
  url: https://drexel.campuslabs.com/engage/api/discovery/search/organizations
  access: json_api
  terms: Campus Labs platform terms apply to the school; endpoint itself would be unauthenticated
  attribution: "Data: Drexel DragonLink"
  lead_only: false
  refresh: monthly
  harvester: pipeline/fyj/harvest/campus_labs.py
  notes: >
    BLOCKED, not harvested. drexel.campuslabs.com/robots.txt carries
    "Disallow: /engage/api/" under "User-agent: *", which covers exactly this endpoint (checked
    2026-10-04). CLAUDE.md is unconditional about never getting around a robots rule, so this
    harvester checks robots.txt and refuses rather than fetching anyway, even though the task
    brief named this exact endpoint. The code is written and unit tested against a saved sample
    payload (docs/research/scouting/samples/drexel_dragonlink_sample.json) so it is ready if the
    school ever opens that path; see research/harvest/2026-10-04-official.md.

