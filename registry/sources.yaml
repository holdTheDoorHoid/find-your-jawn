- id: city_libraries
  name: Free Library of Philadelphia branch locations (City of Philadelphia)
  owner: City of Philadelphia, Free Library of Philadelphia
  url: https://services.arcgis.com/fLeGjb7u4uXqeF9q/ArcGIS/rest/services/Free_Library_Locations/FeatureServer/0
  access: arcgis_rest
  terms: City of Philadelphia License (free reuse, as is)
  attribution: "Data: City of Philadelphia"
  lead_only: false
  refresh: yearly
  harvester: pipeline/fyj/harvest/arcgis.py
  notes: >
    Facility anchor, kind_hint facility, 54 branches. The library's own website
    (freelibrary.org/locations/) returns HTTP 403 to automated fetches; this ArcGIS layer is the
    only way we have to get branch addresses. Friends-of-the-library groups per branch are not in
    this layer and were not found elsewhere this pass.

- id: city_rec
  name: Philadelphia Parks and Recreation Centers (City of Philadelphia)
  owner: City of Philadelphia, Parks & Recreation
  url: https://services.arcgis.com/fLeGjb7u4uXqeF9q/ArcGIS/rest/services/Philadelphia_Parks_and_Recreation_Centers/FeatureServer/0
  access: arcgis_rest
  terms: City of Philadelphia License (free reuse, as is)
  attribution: "Data: City of Philadelphia"
  lead_only: false
  refresh: yearly
  harvester: pipeline/fyj/harvest/arcgis.py
  notes: >
    Facility anchor, kind_hint facility, 479 records. This is a broad PPR asset inventory
    (playgrounds, squares, and land parcels, not only staffed recreation centers), per the
    scouting report; treat names and types with that in mind before publishing. Polygon layer,
    lat/lng is an averaged centroid.

- id: city_senior
  name: Senior centers (City of Philadelphia, PCA_SeniorCenters plus Senior_Sites_PUBLIC_VIEW)
  owner: City of Philadelphia / Philadelphia Corporation for Aging
  url: https://services.arcgis.com/fLeGjb7u4uXqeF9q/ArcGIS/rest/services/PCA_SeniorCenters/FeatureServer/0
  access: arcgis_rest
  terms: City of Philadelphia License (free reuse, as is)
  attribution: "Data: City of Philadelphia / Philadelphia Corporation for Aging"
  lead_only: false
  refresh: yearly
  harvester: pipeline/fyj/harvest/arcgis.py
  notes: >
    Facility anchor, kind_hint facility. Combines two overlapping city layers (PCA_SeniorCenters,
    26 records, and Senior_Sites_PUBLIC_VIEW, 26 records) into one leads file; native_id is
    prefixed pca: or sites: to keep them apart since they are not yet reconciled with each other.
    Two more overlapping layers (Senior_Centers, PHA_Senior_Sites) were seen in the City's catalog
    but not harvested this pass.

