# Sources registry. Format is binding, see docs/DATA_MODEL.md section 1.
# Every id here has a matching entry in pipeline/fyj/harvest/__init__.py:HARVESTERS.

- id: city_rco
  name: Registered Community Organizations, Zoning_RCO layer (City of Philadelphia)
  owner: City of Philadelphia, Department of Planning and Development
  url: https://services.arcgis.com/fLeGjb7u4uXqeF9q/ArcGIS/rest/services/Zoning_RCO/FeatureServer/0
  access: arcgis_rest
  terms: City of Philadelphia License (free reuse, as is)
  attribution: "Data: City of Philadelphia"
  lead_only: false
  refresh: monthly
  harvester: pipeline/fyj/harvest/arcgis.py
  notes: >
    The current, authoritative RCO boundary dataset (240 records). Carries a named individual's
    personal email and cell phone as the primary contact, not just an org level address; the
    owner should decide deliberately before showing that verbatim on the public site. We copy
    contact fields exactly as published, per owner decision 2026-10-04. Polygon layer; lat/lng is
    an averaged centroid of the boundary, not a surveyed point.

